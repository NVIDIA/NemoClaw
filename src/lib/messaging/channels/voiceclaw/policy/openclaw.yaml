preset:
  name: voiceclaw
  description: "Telnyx calls, speech-to-text, and NVIDIA TTS over HTTPS"

network_policies:
  voiceclaw:
    name: voiceclaw
    endpoints:
      - host: api.telnyx.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: POST, path: "/v2/calls" }
          - allow: { method: GET, path: "/v2/calls/*" }
          - allow: { method: POST, path: "/v2/calls/*/actions/answer" }
          - allow: { method: POST, path: "/v2/calls/*/actions/hangup" }
          - allow: { method: POST, path: "/v2/calls/*/actions/playback_start" }
          - allow: { method: POST, path: "/v2/calls/*/actions/transcription_start" }
          - allow: { method: POST, path: "/v2/calls/*/actions/transcription_stop" }
      - host: 877104f7-e885-42b9-8de8-f6e4c6303969.invocation.api.nvcf.nvidia.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: POST, path: "/v1/audio/synthesize" }
    binaries:
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/node }
