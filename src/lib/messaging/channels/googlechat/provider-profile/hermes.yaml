#
# Google Chat bridge for Hermes: keyless reply + Pub/Sub pull.
#
# * The gateway mints one chat.bot + pubsub token and injects it on both hosts.
# * The private key stays gateway-side; the sandbox holds only the placeholder.
# * messaging-bridge-provider.ts supplies the material at onboard, the key via
#   `--secret-material-env` so it never reaches argv.
id: google-chat-hermes-bridge
display_name: Google Chat Bridge (Hermes)
description: Gateway-minted Google Chat bot token (chat.bot + pubsub) for Hermes Pub/Sub pull + Chat reply
category: agent
credentials:
  - name: access_token
    description: Google Chat bot OAuth access token (gateway-minted via service-account JWT; chat.bot + pubsub)
    env_vars:
      - GOOGLE_CHAT_ACCESS_TOKEN
    required: true
    auth_style: bearer
    header_name: Authorization
    query_param: ''
    refresh:
      strategy: google-service-account-jwt
      scopes:
        - https://www.googleapis.com/auth/chat.bot
        - https://www.googleapis.com/auth/pubsub
      material:
        - name: client_email
          description: Service-account client email (JWT issuer)
          required: true
        - name: private_key
          description: Service-account RSA private key (PEM); signs the JWT assertion
          required: true
          secret: true
        - name: scope
          description: OAuth scope(s) to mint the token for
endpoints:
  - host: pubsub.googleapis.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
  - host: chat.googleapis.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
# OpenShell resolves the process to its real interpreter via /proc/pid/exe and
# matches binaries EXACTLY — a `/usr/bin/python3*` glob does not cover
# `python3.13`, and an unmatched binary is 403'd at CONNECT. Hermes' venv python
# resolves to /usr/bin/python3.13, so list the concrete path. Revisit when the
# base image bumps Python.
binaries:
  - /opt/hermes/.venv/bin/python
  - /usr/bin/python3
  - /usr/bin/python3.13
inference_capable: false
