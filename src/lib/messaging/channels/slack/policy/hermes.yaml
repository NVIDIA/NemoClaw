preset:
  name: slack
  description: "Hermes Slack API, Socket Mode, and webhooks access"

network_policies:
  slack:
    name: slack
    endpoints:
      # slack.com carries two credentials, so it is declared twice and split by
      # `path`:
      # - A credential_binding authorizes one provider per endpoint.
      # - OpenShell picks the endpoint by path specificity, so the narrow
      #   apps.connections.open entry wins the Socket Mode handshake and every
      #   other Web API call falls to the broad entry.
      # - Drop the `path` selector and both entries score equal specificity, the
      #   policy is rejected as ambiguous, and sandbox creation fails.
      - host: slack.com
        port: 443
        path: /api/apps.connections.open
        protocol: rest
        enforcement: enforce
        request_body_credential_rewrite: true
        credential_binding:
          provider: "{sandboxName}-slack-app"
        rules:
          - allow: { method: POST, path: "/api/apps.connections.open" }
      - host: slack.com
        port: 443
        protocol: rest
        enforcement: enforce
        request_body_credential_rewrite: true
        credential_binding:
          provider: "{sandboxName}-slack-bridge"
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
      - host: api.slack.com
        port: 443
        protocol: rest
        enforcement: enforce
        request_body_credential_rewrite: true
        credential_binding:
          provider: "{sandboxName}-slack-bridge"
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
      - host: hooks.slack.com
        port: 443
        protocol: rest
        enforcement: enforce
        request_body_credential_rewrite: true
        credential_binding:
          provider: "{sandboxName}-slack-bridge"
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
      - host: wss-primary.slack.com
        port: 443
        protocol: websocket
        enforcement: enforce
        websocket_credential_rewrite: true
        credential_binding:
          provider: "{sandboxName}-slack-app"
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: WEBSOCKET_TEXT, path: "/**" }
      - host: wss-backup.slack.com
        port: 443
        protocol: websocket
        enforcement: enforce
        websocket_credential_rewrite: true
        credential_binding:
          provider: "{sandboxName}-slack-app"
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: WEBSOCKET_TEXT, path: "/**" }
    binaries:
      - { path: /usr/local/bin/hermes }
      - { path: /usr/bin/python3* }
      - { path: /opt/hermes/.venv/bin/python }
