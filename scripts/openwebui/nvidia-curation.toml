#
# nvidia-curation.toml — controls which models nvidia-proxy exposes to open-webui.
#
# The daily liveness sweep applies this file to the NVIDIA catalog and writes a
# `featured` array into liveness.json. The proxy returns only featured + live
# models from GET /v1/models, so open-webui's dropdown stays curated.
#
# Strategy: per-provider top-N picks, ranked by newest version then largest
# params parsed from the model id. No hand-pinning — purely automatic so new
# models from any provider get picked up the day they're released.
#
# Edit, then either wait for the 04:00 daily sweep or rerun manually:
#   /opt/homebrew/bin/python3 ~/.nemoclaw/source/scripts/openwebui/nvidia-liveness.py

# Top-N picks per provider. 0 = every live model from every provider is
# featured (ranked newest-version / largest-params first). Picks a number
# (>1) to restrict to the top-N per provider instead.
per_provider_limit = 0

# Never include — applied after auto-selection. Glob `*` supported.
# Used to override the heuristic when it picks a model you don't want
# (e.g. a vision-only or guardrail variant that landed as provider top-pick).
exclude = [
    # Content-safety and guardrail models — narrow-purpose, not general assistants
    "meta/llama-guard-*",
    "nvidia/nemotron-3.5-content-safety",
    "nvidia/nemotron-3-content-safety",
    "nvidia/nemotron-content-safety-reasoning-4b",
    "nvidia/llama-3.1-nemoguard-*",
    "nvidia/llama-3.1-nemotron-safety-guard*",
    # Specialized / infrastructure models
    "nvidia/gliner-pii",
    "nvidia/nemotron-parse-*",
    "nvidia/riva-translate-*",
    "nvidia/ising-calibration-*",
    # Nano / mini tiers — not flagship
    "nvidia/nemotron-mini-4b-instruct",
    "nvidia/nvidia-nemotron-nano-9b-v2",
    "nvidia/llama-3.1-nemotron-nano-8b-v1",
    # Vision-language variants — when a text-only version exists
    "nvidia/llama-3.1-nemotron-nano-vl-8b-v1",
    "nvidia/nemotron-nano-12b-v2-vl",
    # Embedding models
    "nvidia/llama-nemotron-embed-*",
]

[ranking]
prefer_newer_major = true   # llama-3.3 beats llama-3.1
prefer_larger_params = true # tiebreak within same major: 70b beats 8b
