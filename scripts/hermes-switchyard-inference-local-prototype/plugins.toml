version = 1

[[plugins.dynamic]]
manifest = "/usr/local/lib/nemoclaw/switchyard-relay-plugin/relay-plugin.toml"

[plugins.dynamic.config]
version = 2
priority = 0
max_retries = 0

[plugins.dynamic.config.algorithm]
kind = "llm_classifier"
classifier_target = "classifier"
weak_target = "fast"
strong_target = "quality"
base_threshold = 0.5
min_confidence = 0.5
max_output_tokens = 512
session_affinity = false
message_hash_fallback = false

[plugins.dynamic.config.default_targets]
openai_chat = "quality"

[plugins.dynamic.config.targets.classifier]
model = "provider/classifier"
protocol = "openai_chat"
endpoint = "/v1/chat/completions"
base_url = "http://127.0.0.1:4101"
weight = 0

# OpenShell owns the provider endpoint, credential, and final model. Switchyard
# still makes the tier decision, but current inference.local forces one model
# for the active gateway route. Distinct model names here are therefore routing
# evidence, not a claim that both real tiers can coexist behind one gateway.
[plugins.dynamic.config.targets.fast]
model = "nemoclaw-switchyard-efficient"
protocol = "openai_chat"
endpoint = "/v1/chat/completions"
base_url = "https://inference.local"
weight = 1

[plugins.dynamic.config.targets.quality]
model = "nemoclaw-switchyard-capable"
protocol = "openai_chat"
endpoint = "/v1/chat/completions"
base_url = "https://inference.local"
weight = 1
