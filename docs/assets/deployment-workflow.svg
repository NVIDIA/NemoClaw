<title id="title">Deploy agents with NemoClaw</title>
<desc id="desc">Build the v1 bundle and matching agent images. Define agents, models, sandbox settings, network access, and volume mounts in YAML. Preview and apply the deployment. Inside each OpenShell sandbox, NeMo Fabric configures and starts the agent.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#f4f7fb}
.heading{font-weight:700;font-size:30px}
.step{font-weight:700;font-size:21px}
.body{font-size:17px;fill:#c8d2e1}
.code{font-family:Menlo,monospace;font-size:15px;fill:#dce4ee}
.card{fill:#172033;stroke:#ff973c;stroke-width:2}
.wire{stroke:#ff973c;stroke-width:2;fill:none}
.boundary{fill:#111a28;stroke:#68778c;stroke-width:1.3}
.small{font-size:17px;font-weight:700;fill:#f4f7fb}
</style>
<rect width="100%" height="100%" rx="12" fill="#0b1018"/>
<text x="28" y="49" class="heading">Deploy agents with NemoClaw</text>
<path class="wire" d="M264 131h20"/>
<rect x="28" y="78" width="236" height="106" rx="9" class="card"/>
<text x="44" y="111" class="step">Get NemoClaw</text>
<text x="44" y="141" class="body">Build the v1 bundle and</text>
<text x="44" y="164" class="body">matching agent images.</text>
<path class="wire" d="M608 131h20"/>
<rect x="284" y="78" width="324" height="106" rx="9" class="card"/>
<text x="300" y="111" class="step">Define the deployment</text>
<text x="300" y="141" class="body">Agents, models, sandbox settings,</text>
<text x="300" y="164" class="body">network access, and volume mounts.</text>
<rect x="628" y="78" width="304" height="106" rx="9" class="card"/>
<text x="642" y="111" class="step">Preview and deploy</text>
<text x="642" y="141" class="code">nemoclaw plan deployment.yaml</text>
<text x="642" y="164" class="code">nemoclaw apply deployment.yaml</text>
<path class="wire" d="M763 184v32"/>
<rect x="313" y="216" width="619" height="84" rx="9" class="boundary"/>
<text x="333" y="248" class="small">One OpenShell sandbox per agent</text>
<text x="333" y="278" class="body"><tspan font-weight="bold" fill="#f4f7fb">NeMo Fabric</tspan> configures and starts the agent.</text>
</svg>
