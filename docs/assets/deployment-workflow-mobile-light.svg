<svg xmlns="http://www.w3.org/2000/svg" width="360" height="516" viewBox="0 0 360 516" role="img" aria-labelledby="title">
<title id="title">Define → Plan → Apply</title>
  <defs>
    <radialGradient id="halo"><stop stop-color="#76b900" stop-opacity=".09"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></radialGradient>
    <radialGradient id="pool"><stop stop-color="#a4ef37" stop-opacity=".45"/><stop offset=".35" stop-color="#76b900" stop-opacity=".15"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></radialGradient>
    <linearGradient id="metal" x2=".8" y2="1"><stop stop-color="#806b38"/><stop offset=".27" stop-color="#9a8452"/><stop offset=".65" stop-color="#675730"/><stop offset="1" stop-color="#917841"/></linearGradient>
    <linearGradient id="glass" x2=".8" y2="1"><stop stop-color="#ffffff"/><stop offset=".52" stop-color="#f4f5ee"/><stop offset="1" stop-color="#e7ebe0"/></linearGradient>
    <linearGradient id="plate" x2="1" y2="1"><stop stop-color="#f2f5eb"/><stop offset="1" stop-color="#e4eadb"/></linearGradient>
    <linearGradient id="green" x2=".85" y2="1"><stop stop-color="#dcffa4"/><stop offset=".45" stop-color="#9cde36"/><stop offset="1" stop-color="#76b900"/></linearGradient>
    <linearGradient id="side" x2="1" y2="1"><stop stop-color="#76b900"/><stop offset="1" stop-color="#263e0a"/></linearGradient>
    <linearGradient id="wire"><stop stop-color="#494333" stop-opacity="0"/><stop offset=".55" stop-color="#8b7e5c"/><stop offset="1" stop-color="#806a37"/></linearGradient>
<linearGradient id="down" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#494333" stop-opacity="0"/><stop offset=".55" stop-color="#8b7e5c"/><stop offset="1" stop-color="#806a37"/></linearGradient><linearGradient id="champagne" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#8c7136"/><stop offset=".35" stop-color="#a78b4c"/><stop offset=".7" stop-color="#745e30"/><stop offset="1" stop-color="#9a7d3d"/></linearGradient>
<radialGradient id="warm-light"><stop stop-color="#d0ba80" stop-opacity=".055"/><stop offset="1" stop-color="#c6b179" stop-opacity="0"/></radialGradient>
</defs>

<ellipse cx="96" cy="415" rx="170" ry="150" fill="url(#halo)"/>
<ellipse cx="96" cy="88" rx="145" ry="120" fill="url(#halo)" opacity=".28"/>
<g fill="none" stroke="url(#down)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M96 149V183m-5-6 5 6 5-6"/><path d="M96 312V346m-5-6 5 6 5-6"/></g>
<g fill="none" stroke="#807458" stroke-opacity=".17"><path d="M187 119H315M187 282H315M187 445H315"/></g>
<g fill="#957c44"><circle cx="187" cy="119" r="1.6" opacity=".45"/><circle cx="187" cy="282" r="1.6" opacity=".65"/><circle cx="187" cy="445" r="1.6"/></g>
  <!-- A configuration sheet, with structure represented by strokes. -->
  <g transform="translate(96 88) scale(.64)">
    <circle r="111" fill="url(#warm-light)"/>
    <circle r="108" fill="none" stroke="#a19065" stroke-opacity=".10" stroke-width=".8"/>
    <path d="M-93-55A108 108 0 0 1 43-99" fill="none" stroke="url(#champagne)" stroke-width="1" stroke-opacity=".48"/>
    <g fill="#94763a" fill-opacity=".72"><circle cx="-93" cy="-55" r="2.1"/><circle cx="43" cy="-99" r="1.8"/></g>

    <rect x="-48" y="-68" width="116" height="146" rx="6" fill="#eef1e7" stroke="#a69d82"/>
    <rect x="-58" y="-78" width="116" height="146" rx="6" fill="url(#glass)" stroke="url(#metal)" stroke-width="1.5"/>
    <path d="M-57-55H57" stroke="#a4b398" stroke-opacity=".16"/>
    <circle cx="-42" cy="-66" r="2" fill="#76b900"/>
    <circle cx="-34" cy="-66" r="2" fill="#64715a"/>
    <circle cx="-26" cy="-66" r="2" fill="#a69d82"/>
    <g fill="none" stroke-linecap="round" stroke-width="4">
      <path d="M-35-31H-4" stroke="#5f9200"/>
      <path d="M-22-12H21M-22 7H10" stroke="#59634e"/>
      <path d="M-35 27H-8" stroke="#5f9200"/>
      <path d="M-22 46H27" stroke="#59634e"/>
    </g>
    <path d="M-35-13V7M-35 45V47" stroke="#8c8168" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- The same deployment is previewed as separated, inspectable layers. -->
