apiVersion: nemoclaw.nvidia.com/managed-inference/v1
kind: ServingPreset

metadata:
  id: llama-cpp.dgx-spark-gb10.single.muse-glimmer-30b
  displayName: Meta Muse Glimmer 30B on one DGX Spark
  supportState: experimental
  validation:
    level: schema
    evidence: managed-inference-catalog-compiler-v1

spec:
  selection: explicit-only
  priority: 500

  requirements:
    all:
      - readiness:
          scope: everyNode
          kind: qualification
          id: host.platform.dgx_spark
          status: qualified
      - readiness:
          scope: everyNode
          kind: capability
          id: host.platform.supported
          state: present
      - readiness:
          scope: everyNode
          kind: capability
          id: host.platform.dgx_spark
          state: present
      - readiness:
          scope: everyNode
          kind: capability
          id: host.docker.available
          state: present
      - readiness:
          scope: everyNode
          kind: capability
          id: host.docker.daemon_reachable
          state: present
      - readiness:
          scope: everyNode
          kind: capability
          id: host.docker.runtime_supported
          state: present
      - readiness:
          scope: everyNode
          kind: capability
          id: host.docker.storage_compatible
          state: present
      - readiness:
          scope: everyNode
          kind: capability
          id: host.gpu.nvidia_available
          state: present
      - readiness:
          scope: everyNode
          kind: capability
          id: host.gpu.container_toolkit_available
          state: present
      - readiness:
          scope: everyNode
          kind: capability
          id: host.gpu.cdi_healthy
          state: present
      - readiness:
          scope: everyNode
          kind: observation
          id: host.os.platform
          comparison:
            operator: equals
            value: linux
      - readiness:
          scope: everyNode
          kind: observation
          id: host.os.architecture
          comparison:
            operator: equals
            value: arm64
      - readiness:
          scope: everyNode
          kind: observation
          id: host.docker.runtime
          comparison:
            operator: equals
            value: docker
      - readiness:
          scope: everyNode
          kind: observation
          id: host.gpu.count
          comparison:
            operator: at-least
            value: 1
      - readiness:
          scope: everyNode
          kind: observation
          id: host.gpu.driver_version
          comparison:
            operator: version-at-least
            value: 580.65.06

  plan:
    backend: install-llama-cpp
    recipeRef: llama-cpp.muse-glimmer-30b.spark-single.v1
