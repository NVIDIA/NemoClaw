apiVersion: nemoclaw.nvidia.com/managed-inference/v1
kind: ServingPreset

metadata:
  id: vllm.dgx-spark-gb10.single.nemotron-3.5-lightning-30b-a3b-nvfp4
  displayName: NVIDIA Nemotron 3.5 Lightning 30B-A3B NVFP4 on one DGX Spark
  supportState: experimental

spec:
  selection: explicit-only
  priority: 450

  requirements:
    all:
      - readiness:
          scope: everyNode
          kind: qualification
          id: host.platform.dgx_spark
          status: qualified
      - readiness:
          scope: everyNode
          kind: capability
          id: host.platform.supported
          state: present
      - readiness:
          scope: everyNode
          kind: capability
          id: host.platform.dgx_spark
          state: present
      - readiness:
          scope: everyNode
          kind: capability
          id: host.docker.available
          state: present
      - readiness:
          scope: everyNode
          kind: capability
          id: host.docker.daemon_reachable
          state: present
      - readiness:
          scope: everyNode
          kind: capability
          id: host.docker.runtime_supported
          state: present
      - readiness:
          scope: everyNode
          kind: capability
          id: host.docker.storage_compatible
          state: present
      - readiness:
          scope: everyNode
          kind: capability
          id: host.gpu.nvidia_available
          state: present
      - readiness:
          scope: everyNode
          kind: capability
          id: host.gpu.container_toolkit_available
          state: present
      - readiness:
          scope: everyNode
          kind: capability
          id: host.gpu.cdi_healthy
          state: present
      - readiness:
          scope: everyNode
          kind: observation
          id: host.os.platform
          comparison:
            operator: equals
            value: linux
      - readiness:
          scope: everyNode
          kind: observation
          id: host.os.architecture
          comparison:
            operator: equals
            value: arm64
      - readiness:
          scope: everyNode
          kind: observation
          id: host.docker.runtime
          comparison:
            operator: equals
            value: docker
      - readiness:
          scope: everyNode
          kind: observation
          id: host.gpu.count
          comparison:
            operator: at-least
            value: 1
      - readiness:
          scope: everyNode
          kind: observation
          id: host.gpu.driver_version
          comparison:
            operator: version-at-least
            value: 580.65.06

  plan:
    backend: vllm
    recipeRef: vllm.nemotron-3.5-lightning-30b-a3b-nvfp4.spark-single.v1
