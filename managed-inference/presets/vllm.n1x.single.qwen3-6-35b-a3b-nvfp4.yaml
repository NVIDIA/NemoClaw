apiVersion: nemoclaw.nvidia.com/managed-inference/v1
kind: ServingPreset

metadata:
  id: vllm.n1x.single.qwen3-6-35b-a3b-nvfp4
  displayName: Qwen3.6 35B-A3B NVFP4 on one N1x
  supportState: experimental
  validation:
    level: schema
    evidence: managed-inference-catalog-compiler-v1

spec:
  selection: automatic
  priority: 550

  requirements:
    all:
      - readiness:
          scope: everyNode
          kind: qualification
          id: host.platform.n1x
          status: qualified
      - readiness:
          scope: everyNode
          kind: capability
          id: host.platform.n1x
          state: present
      - readiness:
          scope: everyNode
          kind: capability
          id: host.docker.available
          state: present
      - readiness:
          scope: everyNode
          kind: capability
          id: host.docker.daemon_reachable
          state: present
      - readiness:
          scope: everyNode
          kind: capability
          id: host.docker.runtime_supported
          state: present
      - readiness:
          scope: everyNode
          kind: capability
          id: host.docker.storage_compatible
          state: present
      - readiness:
          scope: everyNode
          kind: capability
          id: host.gpu.nvidia_available
          state: present
      - readiness:
          scope: everyNode
          kind: capability
          id: host.gpu.container_toolkit_available
          state: present
      - readiness:
          scope: everyNode
          kind: capability
          id: host.gpu.cdi_healthy
          state: present
      - readiness:
          scope: everyNode
          kind: observation
          id: host.os.platform
          comparison:
            operator: equals
            value: linux
      - readiness:
          scope: everyNode
          kind: observation
          id: host.os.architecture
          comparison:
            operator: equals
            value: arm64
      - readiness:
          scope: everyNode
          kind: observation
          id: host.docker.runtime
          comparison:
            operator: equals
            value: docker
      - readiness:
          scope: everyNode
          kind: observation
          id: host.gpu.count
          comparison:
            operator: at-least
            value: 1
      - readiness:
          scope: everyNode
          kind: observation
          id: host.gpu.driver_version
          comparison:
            operator: version-at-least
            value: 580.65.06

  plan:
    backend: vllm
    platform: n1x
    interactive: true
    recipeRef: vllm.qwen3-6-35b-a3b-nvfp4.n1x-single.v1
