id: nemoclaw-anthropic-inference-v1
display_name: NemoClaw Anthropic Hosted Inference
description: Native Anthropic hosted inference access for NemoClaw agents
category: inference
credentials:
  - name: api_key
    description: Anthropic hosted inference API key
    env_vars:
      - ANTHROPIC_API_KEY
    required: true
    auth_style: header
    header_name: x-api-key
    query_param: ''
endpoints:
  - host: api.anthropic.com
    port: 443
    protocol: rest
    enforcement: enforce
    rules:
      - allow: { method: GET, path: "/v1/models" }
      - allow: { method: POST, path: "/v1/messages" }
binaries:
  - /usr/local/bin/node
  - /usr/bin/node
  - /opt/hermes/.venv/bin/python
  - /opt/hermes/.venv/bin/python3
  - /opt/venv/bin/python3
  - /usr/local/bin/curl
  - /usr/bin/curl
inference_capable: true
