id: nemoclaw-gemini-inference-v1
display_name: NemoClaw Google Gemini Hosted Inference
description: Native Google Gemini hosted inference access for NemoClaw agents
category: inference
credentials:
  - name: api_key
    description: Google Gemini hosted inference API key
    env_vars:
      - GEMINI_API_KEY
    required: true
    auth_style: bearer
    header_name: authorization
    query_param: ''
endpoints:
  - host: generativelanguage.googleapis.com
    port: 443
    protocol: rest
    enforcement: enforce
    rules:
      - allow: { method: GET, path: "/v1beta/openai/models" }
      - allow: { method: POST, path: "/v1beta/openai/chat/completions" }
binaries:
  - /usr/local/bin/node
  - /usr/bin/node
  - /opt/hermes/.venv/bin/python
  - /opt/hermes/.venv/bin/python3
  - /opt/venv/bin/python3
  - /usr/local/bin/curl
  - /usr/bin/curl
inference_capable: true
