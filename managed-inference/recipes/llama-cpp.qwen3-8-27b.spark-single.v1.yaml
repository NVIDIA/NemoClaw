kind: ServingRecipe

metadata:
  id: llama-cpp.qwen3-8-27b.spark-single.v1
  displayName: Qwen3.8 27B with llama.cpp

spec:
  backend: install-llama-cpp
  providerId: llama-cpp-local

  server:
    technology: llama.cpp
    source:
      repository: ggml-org/llama.cpp
      revision: 22dc605c4ead20e36f447cc67b55ef87e523bd55

  model:
    id: unsloth/Qwen3.8-27B-GGUF
    revision: 27af057ecb382ddfea5d12837360a8980560e3ed
    servedName: qwen3-8-27b
    files:
      - path: Qwen3.8-27B-UD-Q4_K_XL.gguf
        digest: sha256:3f227079003add2511437e5b1e94812e363385225bf6a9b47b0054a72bc8b01e
        sizeBytes: 17559178144
        format: gguf
        quantization: UD-Q4_K_XL
        license: Apache-2.0
    acquisition:
      ref: hugging-face-exact-file/v1
      downloaderImage: nvcr.io/nvidia/vllm@sha256:94e21552f644e0c1627464ba89d2f7a4ce7442e196f72afa0bb5d7fba23cbb03
      authentication:
        mode: optional
        environment: HF_TOKEN
    cache:
      ref: hugging-face-shared-cache/v1
      root: user-cache
      reuse: verify-exact-file
      sharing: host-user
      cleanup: preserve

  runtime:
    image: ghcr.io/ggml-org/llama.cpp@sha256:866ad568474de9e835e487ae841ad6ace1a494b5eab4f292cbd45adb6180f711
    imageDownloadSizeBytes: 2181958990
    platforms:
      - linux/amd64
      - linux/arm64
    containerRuntime: docker
    networkExposure: loopback
    restartPolicy: unless-stopped
    hosts: 1
    cuda:
      baseImage: docker.io/nvidia/cuda@sha256:789e629e49401647e22b7054ae9c6c4f6427dba68010ba428deb4cc6b063676e
      minimumDriverVersion: 580.65.06
    gpu:
      vendor: nvidia
      count: 1
      offload: full
      cpuFallback: reject
    resources:
      memoryBytes: 51539607552
      writableStorageBytes: 42949672960
      pidsLimit: 256

  execution:
    receiptRef: llama-cpp.host-local.receipt/v1
    materializerRef: llama-cpp.host-local/v1
    lifecycleRef: llama-cpp.host-local.lifecycle/v1

  serve:
    protocol: openai-completions
    authentication: bearer
    port: 8081
    chatTemplate: model-embedded-jinja
    # This checkpoint's embedded template reads `reasoning_effort` (default
    # `xhigh`; it accepts only `xhigh`, `medium`, `low` and raises otherwise).
    # The llama.cpp runtime emits `reasoning_strength`, so the template ignores
    # it and resolves to its own default. `xhigh` is declared here because it is
    # what the server actually serves; it is not delivered through the kwarg.
    chatTemplateArguments:
      reasoningStrength: xhigh
    contextSize: 262144
    slots: 1
    idleSleepSeconds: -1
    batchSize: 2048
    microBatchSize: 512
    flashAttention: enabled
    kvCache:
      key: f16
      value: f16
    speculativeDecoding: disabled
    limits:
      maxRequestBodyBytes: 1048576
      maxRequestHeaderBytes: 32768
      maxOutputTokens: 4096
      requestTimeoutSeconds: 900
      shutdownTimeoutSeconds: 25
    requestGuard:
      upstreamPort: 8082

  readiness:
    contractRef: llama-cpp.server-readiness/v1
    timeoutSeconds: 1800
    expectedModel: qwen3-8-27b
    probeImage: nvcr.io/nvidia/vllm@sha256:94e21552f644e0c1627464ba89d2f7a4ce7442e196f72afa0bb5d7fba23cbb03
    probes:
      models: true
      health: true
      properties: true
      metrics: true

  policy:
    egress: disabled
    modelSource: verified-local
    modelDownloads: disabled

  surfaces:
    ui: disabled
    slotInspection: disabled
    router: disabled
    mcpProxy: disabled
    serverTools: disabled
    agentMode: disabled
    multimodalProjection: disabled

  capabilities:
    agents: []
    protocols:
      - openai-completions
    streaming: true
    toolCalls: true
    structuredOutputs: true
    parallelToolCalls: false
    responsesApi: false
    embeddings: false
    reranking: false
    multimodal: false
