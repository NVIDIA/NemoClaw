apiVersion: nemoclaw.nvidia.com/managed-inference/v1
kind: ServingRecipe

metadata:
  id: vllm.muse-glimmer-30b-nvfp4-w4a4.spark-single.v1
  displayName: Muse Glimmer 30B NVFP4 W4A4 with vLLM

spec:
  backend: vllm

  modelRef: vllm.muse-glimmer-30b-nvfp4-w4a4.v1
  runtime:
    image: vllm/vllm-openai@sha256:b0e84e5f2b00a7268e4fdda332790ebd4bfb166b64757e166914753afaeee965
    imageDownloadSizeBytes: 9706339423
    minimumComputeCapability: 121
    minimumGpuMemoryBytes: 25447097878
    pullTimeoutSeconds: 3600
    architecture: arm64
    networkMode: bridge
    ipcMode: host
    sharedMemoryBytes: 34359738368
    gpuRequest: all
    devices: []
    ulimits:
      memlock: -1
      stackBytes: 67108864
    modelCache:
      source: huggingface-cache
      target: /root/.cache/huggingface
    temporaryFilesystems: []
    environment: {}

  execution:
    materializerRef: vllm.host-local/v1
    lifecycleRef: vllm.host-local.lifecycle/v1
    orchestrationRef: vllm.host-local.standard/v1

  serve:
    authentication: bearer
    directInstall:
      authentication: bearer
      fixedArguments: true
      catalogReceipt: true
    executable: /usr/local/bin/vllm
    arguments:
      - name: --max-model-len
        value: 32768
      - name: --gpu-memory-utilization
        value: 0.75
      - name: --max-num-seqs
        value: 1
      - name: --max-num-batched-tokens
        value: 4096
      - name: --enable-auto-tool-choice
      - name: --tool-call-parser
        value: muse_glimmer
      - name: --reasoning-parser
        value: muse_glimmer
      - name: --generation-config
        value: auto

  readiness:
    timeoutSeconds: 1800
    expectedModel: muse-glimmer
