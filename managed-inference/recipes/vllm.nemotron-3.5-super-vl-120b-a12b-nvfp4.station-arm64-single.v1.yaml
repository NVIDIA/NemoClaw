apiVersion: nemoclaw.nvidia.com/managed-inference/v1
kind: ServingRecipe

metadata:
  id: vllm.nemotron-3.5-super-vl-120b-a12b-nvfp4.station-arm64-single.v1
  displayName: NVIDIA Nemotron 3.5 Super VL NVFP4 with vLLM on DGX Station

spec:
  backend: vllm

  modelRef: vllm.nemotron-3.5-super-vl-120b-a12b-nvfp4.v1
  runtime:
    # Published ARM64 nightly; release qualification is still required before activation.
    image: vllm/vllm-openai@sha256:fd33bec1578f312a01547cc6b9691a5154c3e8bcfb76d2b35acb657bfc4eee8f
    imageDownloadSizeBytes: 10690535076
    minimumComputeCapability: 100
    pullTimeoutSeconds: 43200
    architecture: arm64
    networkMode: bridge
    ipcMode: host
    sharedMemoryBytes: 34359738368
    gpuRequest: all
    devices: []
    ulimits:
      memlock: -1
      stackBytes: 67108864
    modelCache:
      source: huggingface-cache
      target: /root/.cache/huggingface
    temporaryFilesystems: []
    environment: {}

  execution:
    materializerRef: vllm.host-local/v1
    lifecycleRef: vllm.host-local.lifecycle/v1
    orchestrationRef: vllm.host-local.standard/v1

  serve:
    authentication: bearer
    directInstall:
      authentication: bearer
      fixedArguments: true
      catalogReceipt: true
    executable: /usr/local/bin/vllm
    arguments:
      - name: --max-model-len
        value: 49152
      - name: --async-scheduling
      - name: --gpu-memory-utilization
        value: 0.85
      - name: --max-num-seqs
        value: 1
      - name: --max-num-batched-tokens
        value: 8192
      - name: --mamba-backend
        value: flashinfer
      - name: --kv-cache-dtype
        value: bfloat16
      - name: --mamba-ssm-cache-dtype
        value: float16
      - name: --enable-mamba-cache-stochastic-rounding
      - name: --mamba-cache-philox-rounds
        value: 5
      - name: --spec-method
        value: mtp
      - name: --spec-tokens
        value: 3
      - name: --enable-auto-tool-choice
      - name: --tool-call-parser
        value: hermes
      - name: --reasoning-parser
        value: nemotron_v3
      # Packaged in the catalog and passed literally to stock vLLM, not loaded from an image path.
      # SHA256: ec468fff5625ccc22545b51c06f013b403c14c097dc971d74871651a0f821c76
      - name: --chat-template
        value: |+
          {# Private experiment: original multimodal/reasoning template, native JSON tool format. #}
          {%- macro render_content(content) -%}
              {%- if content is none -%}
                  {{- '' -}}
              {%- elif content is string -%}
                  {{- content | string -}}
              {%- else -%}
                  {%- set text_ns = namespace(val='') -%}
                  {%- set counters = namespace(images=0, videos=0) -%}
                  {%- for part in content -%}
                      {%- if part['type'] == 'image' or part['type'] == 'image_url' or part['type'] == 'input_image' -%}
                          {%- set counters.images = counters.images + 1 -%}
                      {%- elif part['type'] == 'video' or part['type'] == 'video_url' or part['type'] == 'input_video' -%}
                          {%- set counters.videos = counters.videos + 1 -%}
                      {%- elif part['type'] == 'text' or part['type'] == 'input_text' -%}
                          {%- set text_ns.val = text_ns.val + (part['text'] | default('', true)) -%}
                      {%- endif -%}
                  {%- endfor -%}
                  {%- if '<image>' in text_ns.val -%}
                      {%- set counters.images = 0 -%}
                  {%- endif -%}
                  {%- if '<video>' in text_ns.val -%}
                      {%- set counters.videos = 0 -%}
                  {%- endif -%}
                  {%- set content_ns = namespace(val='') -%}
                  {%- set render_ns = namespace(image_index=0, after_text=false) -%}
                  {%- for part in content -%}
                      {%- set sep = '\n' if render_ns.after_text and not content_ns.val.endswith('\n') else '' -%}
                      {%- if part['type'] == 'image' or part['type'] == 'image_url' or part['type'] == 'input_image' -%}
                          {%- set render_ns.image_index = render_ns.image_index + 1 -%}
                          {%- if counters.images > 0 -%}
                              {%- if counters.images > 1 -%}
                                  {%- set content_ns.val = content_ns.val + sep
                                      + '<image ' + render_ns.image_index|string + '><image>' -%}
                              {%- else -%}
                                  {%- set content_ns.val = content_ns.val + sep + '<image>' -%}
                              {%- endif -%}
                              {%- set render_ns.after_text = false -%}
                          {%- endif -%}
                      {%- elif part['type'] == 'video' or part['type'] == 'video_url' or part['type'] == 'input_video' -%}
                          {%- if counters.videos > 0 -%}
                              {%- set content_ns.val = content_ns.val + sep + '<video>' -%}
                              {%- set render_ns.after_text = false -%}
                          {%- endif -%}
                      {%- elif part['type'] == 'text' or part['type'] == 'input_text' -%}
                          {%- set content_ns.val = content_ns.val + (part['text'] | default('', true)) -%}
                          {%- if part['text'] | default('', true) -%}
                              {%- set render_ns.after_text = true -%}
                          {%- endif -%}
                      {%- endif -%}
                  {%- endfor -%}
                  {{- content_ns.val -}}
              {%- endif -%}
          {%- endmacro %}
          {%- set enable_thinking = enable_thinking if enable_thinking is defined else True %}
          {%- set medium_effort = medium_effort if medium_effort is defined else False %}
          {%- set truncate_history_thinking = truncate_history_thinking if truncate_history_thinking is defined else True %}
          {%- set ns = namespace(last_user_idx = -1) %}
          {%- set loop_messages = messages %}
          {%- for m in loop_messages %}
            {%- if m["role"] == "user" %}
              {%- set ns.last_user_idx = loop.index0 %}
            {%- endif %}
          {%- endfor %}
          {%- if messages[0]["role"] == "system" %}
              {%- set system_message = messages[0]["content"] %}
              {%- set loop_messages = messages[1:] %}
          {%- else %}
              {%- set system_message = "" %}
              {%- set loop_messages = messages %}
          {%- endif %}
          {%- if not tools is defined %}
              {%- set tools = [] %}
          {%- endif %}
          {%- set ns = namespace(last_user_idx = -1) %}
          {%- for m in loop_messages %}
            {%- if m["role"] == "user" %}
              {%- set ns.last_user_idx = loop.index0 %}
            {%- endif %}
          {%- endfor %}
          {%- if system_message is defined %}
              {{- "<|im_start|>system\n" ~ render_content(system_message) }}
          {%- else %}
              {%- if tools is iterable and tools | length > 0 %}
                  {{- "<|im_start|>system\n" }}
              {%- endif %}
          {%- endif %}
          {%- if tools is iterable and tools | length > 0 %}
              {%- if system_message is defined and system_message | length > 0 %}
                  {{- "\n\n" }}
              {%- endif %}
              {{- "# Tools\n\nYou have access to the following functions:\n\n" }}
              {{- "<tools>" }}
              {%- for tool in tools %}
                  {{- '\n' ~ (tool | tojson) }}
              {%- endfor %}
              {{- "\n</tools>" }}
              {{- '\n\nTo call a tool, output one JSON object inside <tool_call> and </tool_call>:\n<tool_call>\n{"name":"example_function_name","arguments":{"text":"example\\n","count":1}}\n</tool_call>\nUse JSON, not XML function or parameter tags. Arguments must be an object with the tool schema types. Preserve string content exactly using JSON escapes for newlines, tabs, quotes, and backslashes. Include all required arguments. The outer JSON object must have exactly two keys: name and arguments, in that order. ALL function parameters, including optional ones, belong INSIDE arguments; never put a parameter beside arguments. Do not nest tool_call tags. Each call must have exactly one opening tag and one closing tag. Emit each requested call once only; never repeat an identical function and arguments. For distinct calls, emit separate tool_call blocks. You may reason before the calls, but do not add a suffix after them. If no tool is needed, answer normally.' }}
          {%- endif %}
          {%- if system_message is defined %}
              {{- '<|im_end|>\n' }}
          {%- else %}
              {%- if tools is iterable and tools | length > 0 %}
                  {{- '<|im_end|>\n' }}
              {%- endif %}
          {%- endif %}
          {%- for message in loop_messages %}
              {%- set content = render_content(message.content | default('', true)) %}
              {%- if message.role == "assistant" %}
                  {%- if message.reasoning_content is defined and message.reasoning_content is string and message.reasoning_content | trim | length > 0 %}
                      {%- set content = "<think>\n" ~ message.reasoning_content ~ "</think>" ~ content %}
                  {%- else %}
                      {%- if content is string -%}
                          {%- if '<think>' not in content and '</think>' not in content -%}
                              {%- set content = "<think></think>" ~ content -%}
                          {%- endif -%}
                      {%- endif -%}
                  {%- endif %}
                  {%- if message.tool_calls is defined and message.tool_calls is iterable and message.tool_calls | length > 0 %}
                      {{- '<|im_start|>assistant\n' }}
                          {%- set include_content = not (truncate_history_thinking and loop.index0 < ns.last_user_idx) %}
                          {%- if content is string and content | trim | length > 0 %}
                              {%- if include_content %}
                                  {{- (content | trim) ~ '\n' -}}
                              {%- else %}
                                  {%- set c = (content | string) %}
                                  {%- if '</think>' in c %}
                                      {%- set c = c.split('</think>')[-1] %}
                                  {%- elif '<think>' in c %}
                                      {%- set c = c.split('<think>')[0] %}
                                  {%- endif %}
                                  {%- set c = "<think></think>" ~ c %}
                                  {%- if c | length > 0 %}
                                      {{- c ~ '\n' -}}
                                  {%- endif %}
                              {%- endif %}
                          {%- else %}
                              {{- "<think></think>" -}}
                          {%- endif %}
                          {%- for tool_call in message.tool_calls %}
                              {%- if tool_call.function is defined %}
                                  {%- set tool_call = tool_call.function %}
                              {%- endif %}
                              {{- '<tool_call>\n' ~ ({'name': tool_call.name, 'arguments': tool_call.arguments | default({})} | tojson) ~ '\n</tool_call>\n' -}}
                          {%- endfor %}
                          {{- '<|im_end|>\n' }}
                  {%- else %}
                      {%- if not (truncate_history_thinking and loop.index0 < ns.last_user_idx) %}
                          {{- '<|im_start|>assistant\n' ~ (content | default('', true) | string | trim) ~ '<|im_end|>\n' }}
                      {%- else %}
                          {%- set c = (content | default('', true) | string) %}
                          {%- if '<think>' in c and '</think>' in c %}
                              {%- set c = "<think></think>" ~ c.split('</think>')[-1] %}
                          {%- endif %}
                          {%- set c = c | trim %}
                          {%- if c | length > 0 %}
                              {{- '<|im_start|>assistant\n' ~ c ~ '<|im_end|>\n' }}
                          {%- else %}
                              {{- '<|im_start|>assistant\n<|im_end|>\n' }}
                          {%- endif %}
                      {%- endif %}
                  {%- endif %}
              {%- elif message.role == "user" or message.role == "system" %}
                  {{- '<|im_start|>' + message.role + '\n' }}
                  {#- Render structured image/video content in its original order. -#}
                  {%- if message.role == "user" and loop.index0 == ns.last_user_idx and medium_effort %}
                      {{- content + '\n\n{reasoning effort: efficient}' }}
                  {%- else %}
                      {{- content }}
                  {%- endif %}
                  {{- '<|im_end|>\n' }}
              {%- elif message.role == "tool" %}
                  {%- if loop.previtem and loop.previtem.role != "tool" %}
                      {{- '<|im_start|>user\n' }}
                  {%- endif %}
                  {{- '<tool_response>\n' }}
                  {{- content }}
                  {{- '\n</tool_response>\n' }}
                  {%- if not loop.last and loop.nextitem.role != "tool" %}
                      {{- '<|im_end|>\n' }}
                  {%- elif loop.last %}
                      {{- '<|im_end|>\n' }}
                  {%- endif %}
              {%- else %}
                  {{- '<|im_start|>' ~ message.role ~ '\n' ~ content ~ '<|im_end|>\n' }}
              {%- endif %}
          {%- endfor %}
          {%- if add_generation_prompt %}
              {%- if enable_thinking %}
                  {{- '<|im_start|>assistant\n<think>\n' }}
              {%- else %}
                  {{- '<|im_start|>assistant\n<think></think>' }}
              {%- endif %}
          {%- endif %}

      - name: --tool-strict-level
        value: parameter
      - name: --default-chat-template-kwargs
        value: '{"enable_thinking":true}'
      - name: --limit-mm-per-prompt
        value: '{"image":8,"video":0}'
      # Accept inline images without giving the model server arbitrary media URL or host-file access.
      - name: --allowed-media-domains
        value: cobalt.invalid

  readiness:
    timeoutSeconds: 3600
    expectedModel: nvidia-nemotron-3.5-super-vl-120b-a12b-nvfp4
