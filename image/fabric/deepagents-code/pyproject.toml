#
# Deep Agents Code (dcode) for the deepagents-code agent image. dcode pins
# exact versions and needs Python 3.14, so it gets its own environment, apart
# from Fabric's. uv.lock records every package and its hashes; the image
# installs that lock's export and nothing else.
[project]
name = "nemoclaw-deepagents-code"
version = "0"
requires-python = ">=3.14,<3.15"
dependencies = ["deepagents-code==0.2.2"]

[tool.uv]
package = false
