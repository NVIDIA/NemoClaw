# Fern site config for the NemoClaw documentation site.
instances:
  - url: nvidia-nemoclaw-staging.docs.buildwithfern.com/nemoclaw
    multi-source: true
  - url: nvidia-nemoclaw.docs.buildwithfern.com/nemoclaw
    custom-domain: docs.nvidia.com/nemoclaw
    multi-source: true

title: NVIDIA NemoClaw

global-theme: nvidia
header: ./components/DocsHeader.tsx

layout:
  searchbar-placement: header
  page-width: 1376px
  sidebar-width: 248px
  content-width: 812px
  tabs-placement: header
  hide-feedback: true

colors:
  accentPrimary:
    dark: "#76B900"
    light: "#76B900"
  background:
    light: "#FFFFFF"
    dark: "#000000"

theme:
  page-actions: toolbar
  footer-nav: minimal

logo:
  href: /nemoclaw/v0/user-guide/openclaw/home
  right-text: NemoClaw

favicon: ./assets/NVIDIA_symbol.svg

js:
  - url: https://assets.adobedtm.com/5d4962a43b79/c1061d2c5e7b/launch-191c2462b890.min.js
    strategy: beforeInteractive

css:
  - ./main.css

navbar-links:
  - type: github
    value: https://github.com/NVIDIA/NemoClaw

experimental:
  mdx-components:
    - ../docs/_components
    - ./components

# This project owns the legacy /nemoclaw entry points. The v1 branch
# publishes a separate multi-source project at /nemoclaw/v1.
products:
  - display-name: v0
    path: ../docs/index.yml
    slug: v0
  - display-name: v1
    href: https://docs.nvidia.com/nemoclaw/v1/home
    target: _self

