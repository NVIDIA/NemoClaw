    risk_areas: [skill-injection, agent-verification]

  - id: docs-validation-e2e
    workflow: nightly-e2e
    job: docs-validation-e2e
    script: test/e2e/test-docs-validation.sh
    runner: ubuntu-latest
    cost: low
    domains: [docs, cli-help]
    risk_areas: [docs-parity, markdown-links]

  - id: messaging-providers-e2e
    workflow: nightly-e2e
    job: messaging-providers-e2e
    script: test/e2e/test-messaging-providers.sh
    runner: ubuntu-latest
    cost: medium
    domains: [messaging, providers, proxy, credentials]
