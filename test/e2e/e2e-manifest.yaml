#
# Static inventory consumed by the E2E advisor. Keep this file close to
# E2E scripts so test-selection policy can follow renamed files and workflows.
# The advisor treats changed_files as hints, not as the only source of truth.

version: 1
workflows:
  nightly-e2e:
    path: .github/workflows/nightly-e2e.yaml
    dispatch_input: jobs
  sandbox-images-and-e2e:
    path: .github/workflows/sandbox-images-and-e2e.yaml
  ollama-proxy-e2e:
    path: .github/workflows/ollama-proxy-e2e.yaml
  e2e-branch-validation:
    path: .github/workflows/e2e-branch-validation.yaml

tests:
  - id: cloud-e2e
    workflow: nightly-e2e
    job: cloud-e2e
    script: test/e2e/test-full-e2e.sh
    runner: ubuntu-latest
    cost: high
    requires_secrets: [NVIDIA_API_KEY]
    domains: [install, onboard, gateway, cloud-inference, sandbox-startup]
    risk_areas: [installer, credentials, inference-local, end-to-end-smoke]

  - id: cloud-onboard-e2e
    workflow: nightly-e2e
    job: cloud-onboard-e2e
    script: test/e2e/test-cloud-onboard-e2e.sh
    runner: ubuntu-latest
    cost: high
    requires_secrets: [NVIDIA_API_KEY]
    domains: [install, onboard, landlock, security, policy, sandbox-startup]
    risk_areas: [public-installer, non-root, credential-leak, policy-presets]

  - id: cloud-inference-e2e
    workflow: nightly-e2e
    job: cloud-inference-e2e
    script: test/e2e/test-cloud-inference-e2e.sh
    runner: ubuntu-latest
    cost: medium
    requires_secrets: [NVIDIA_API_KEY]
    domains: [cloud-inference, inference-local, skills, sandbox]
    risk_areas: [gateway-routing, live-chat, skill-filesystem]

  - id: skill-agent-e2e
    workflow: nightly-e2e
    job: skill-agent-e2e
    script: test/e2e/test-skill-agent-e2e.sh
    runner: ubuntu-latest
    cost: medium
