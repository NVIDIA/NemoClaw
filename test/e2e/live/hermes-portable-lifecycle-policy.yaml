version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /bin
    - /lib
    - /lib64
    - /etc
    # The Portable profile acceptance path executes the immutable Hermes venv.
    - /opt/hermes
    - /proc
    - /dev/urandom
  read_write:
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort

# Preserve the Hermes image's root entrypoint. Its production startup script
# validates the mounted sandbox posture before dropping privileges itself.
network_policies: {}
