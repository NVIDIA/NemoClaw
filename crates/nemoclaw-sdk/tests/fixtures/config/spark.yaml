apiVersion: nemoclaw.nvidia.com/v1alpha1
kind: NemoClawConfig
metadata:
  name: spark-recipe
  uid: 302ff5e1-088d-42ce-959f-4ff4c3570c13
spec:
  gateway:
    management: managed
    endpoint: http://127.0.0.1:17681
    engine: unix:///var/run/docker.sock
    image: ghcr.io/nvidia/openshell/gateway@sha256:ec2b0efea84fff198e888e97c85befb9c908acde92e8256f9b527877ed182d66
    networkCIDR: 172.30.110.0/24
  services:
    qwen:
      kind: vllm
      image: fixture-runtime@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      model:
        repository: fixture/model
        revision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      serving:
        port: 18888
        contextTokens: 32768
        maxSequences: 1
        batchTokens: 1024
        speculativeTokens: 0
        startupTimeoutSeconds: 1800
      memory:
        hostReserveGiB: 32
        kvCacheGiB: 8
        minAvailableGiB: 8
        minFreeGiB: 3
        freeGateGiB: 12
        consecutiveSamples: 5
      recipe:
        apiVersion: nemoclaw.nvidia.com/recipe/v1
        compatibility:
          architecture: arm64
          gpu: NVIDIA GB10
          minDriverMajor: 580
          minHostMemoryGiB: 118
          imageLabels:
            org.nemoclaw.recipe.protocol: v1
        preparation:
          executable: /opt/recipe/prepare
          sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        verification:
          executable: /opt/recipe/verify
          sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        resources:
          preparedBytes: 30064771072
          preparationMemoryGiB: 20
          gpuMemoryBytes: 91804925952
          startupHeadroomGiB: 20
        serving:
          modelName: fixture-model
          kvCacheDtype: fp8
          lazyLoading: true
          chunkedPrefill: true
        licenses:
        - /opt/recipe/LICENSE
        sourceNotices:
        - /opt/recipe/NOTICE
        snapshot:
          repository: fixture/model
          revision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          files:
          - name: config.json
            size: 1
            sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          - name: model.safetensors
            size: 1
            sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  inferenceProviders:
  - name: qwen
    provider: openai
    serviceRef: qwen
  sandboxes:
  - name: assistant
    image:
      ref: nc-multi-models@sha256:3ab70ded67440e838a37d6c9f0e3b08b95e2acf416c6076f8817bac190525cf0
    runtime:
      provider: docker
    network:
      tier: isolated
    harness:
      kind: nvidia.fabric.openclaw
    agent:
      name: assistant
      inference:
        routes:
        - name: primary
          providerRef: qwen
          overrides:
            model: fixture-model
