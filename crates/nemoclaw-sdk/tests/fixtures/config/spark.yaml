      image: fixture-runtime@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      model:
        repository: fixture/model
        revision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      serving:
        port: 18888
        contextTokens: 32768
        maxSequences: 1
        batchTokens: 1024
        speculativeTokens: 0
