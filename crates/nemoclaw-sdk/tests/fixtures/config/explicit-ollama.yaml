# Explicit counterpart of a managed-model parser fixture. Not a live qualification or authorization.
apiVersion: nemoclaw.nvidia.com/v1alpha1
kind: NemoClawConfig
metadata:
  name: local-agent
  uid: 87d485ad-fba7-4197-9eaa-aa97cc97446b
spec:
  services:
    ollama-server:
      kind: container
      image: >-
        nc-prototype-ollama@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      container:
        gpu: true
        memoryLimitGiB: 104
        sharedMemoryGiB: 8
        ipc: private
        ulimits:
          memlock: -1
          stack: 67108864
      port: 18888
      readiness:
        runtimeStatus: /data/status.json
        timeoutSeconds: 1800
      user: 0:0
      environment:
        NEMOCLAW_RUNTIME_SPEC: "{\"kind\":\"ollama\",\"hardware\":{\"profile\":\"dgx-spark\"},\"model\":{\"name\":\"qwen3:0.6b\",\"digest\":\"7df6b6e09427a769808717c0a93cadc4ae99ed4eb8bf5ca557c90846becea435\"},\"serving\":{\"port\":18888,\"contextTokens\":8192,\"maxSequences\":1,\"startupTimeoutSeconds\":1800},\"memory\":{\"gpuMemoryGiB\":16,\"hostReserveGiB\":32,\"minAvailableGiB\":8,\"minFreeGiB\":3,\"freeGateGiB\":12,\"consecutiveSamples\":5}}"
      publication:
        bindAddress: 172.20.0.1
        port: 18888
      data:
        mountPath: /data
  gateway:
    management: managed
    runtime:
      provider: docker
    endpoint: http://127.0.0.1:17671
