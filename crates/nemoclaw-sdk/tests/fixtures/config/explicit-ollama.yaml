        nc-multi-models@sha256:3ab70ded67440e838a37d6c9f0e3b08b95e2acf416c6076f8817bac190525cf0
    network:
      tier: isolated
    agent:
      name: main
      inference:
        routes:
        - name: primary
          providerRef: local
          overrides:
            model: qwen3:0.6b
