apiVersion: nemoclaw.nvidia.com/v1alpha1
kind: NemoClawConfig
metadata:
  name: local-agent
  uid: 87d485ad-fba7-4197-9eaa-aa97cc97446b
spec:
  gateway:
    management: managed
    endpoint: http://127.0.0.1:17671
    engine: unix:///var/run/docker.sock
    image: ghcr.io/nvidia/openshell/gateway@sha256:ec2b0efea84fff198e888e97c85befb9c908acde92e8256f9b527877ed182d66
    networkCIDR: 172.20.0.0/24
  services:
    ollama-server:
      kind: ollama
      management: managed
      hardware: {profile: dgx-spark}
      image: nc-prototype-ollama@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      model:
        name: qwen3:0.6b
        digest: 7df6b6e09427a769808717c0a93cadc4ae99ed4eb8bf5ca557c90846becea435
      serving:
        contextTokens: 8192
      memory:
        gpuMemoryGiB: 16
  inferenceProviders:
    - name: local
      provider: openai
      serviceRef: ollama-server
  sandboxes:
    - name: assistant
      image:
        ref: nc-multi-models@sha256:3ab70ded67440e838a37d6c9f0e3b08b95e2acf416c6076f8817bac190525cf0
      runtime:
        provider: docker
      network:
        tier: isolated
      harness:
        kind: openclaw
      agent:
        name: main
        inference:
          routes:
            - name: primary
              providerRef: local
              overrides:
                model: qwen3:0.6b
