# Set the endpoint and model for your service. Custom models need piModel metadata.
# See docs/agents.md for catalog models and protocol requirements.
apiVersion: nemoclaw.nvidia.com/v1alpha1
kind: NemoClawConfig
metadata:
  name: fabric-pi
  uid: c4a639f3-2bd3-42ba-8f5d-658d7913b0f9
spec:
  gateway:
    management: external
    endpoint: http://127.0.0.1:17681
  inferenceProviders:
    - name: local
      provider: openai
      endpoint: http://172.20.0.1:11446/v1
  sandboxes:
    - name: assistant
      image:
        ref: nc-fabric-pi@sha256:fc53fc5a0c37bd487fc58e41886cd1afe8af387c6c8cf410e632c045a03a20dc
      runtime:
        provider: docker
      network:
        tier: isolated
      agents:
        - name: main
          harness:
            kind: pi
          inference:
            routes:
              - name: primary
                providerRef: local
                overrides:
                  model: qwen3:4b
                  piModel:
                    api: openai-completions
                    contextWindow: 8192
                    maxTokens: 2048
                    reasoning: false
                    input: [text]
