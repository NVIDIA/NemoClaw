[package]
name = "nemoclaw-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
tokio = { workspace = true, features = ["test-util"] }

[dependencies]
jsonschema.workspace = true
thiserror.workspace = true
schemars.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
sha2.workspace = true
sha1.workspace = true
regex.workspace = true
url.workspace = true
ipnet.workspace = true
openshell-core.workspace = true
openshell-policy.workspace = true
tonic.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "fs"] }
tempfile.workspace = true
getrandom.workspace = true
process-wrap.workspace = true
tokio-util.workspace = true
tokio-stream.workspace = true
axum.workspace = true
zeroize.workspace = true
reqwest.workspace = true
futures-util.workspace = true
bollard.workspace = true
tar.workspace = true
interprocess = { version = "2.4.4", features = ["tokio"] }
time.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["process"] }

[target.'cfg(unix)'.dependencies]
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
command-fds.workspace = true

[target.'cfg(windows)'.dependencies]
widestring = "1"
