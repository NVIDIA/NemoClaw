[package]
name = "nemoclaw-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
# One integration-test binary links the SDK once instead of once per file.
autotests = false

[[test]]
name = "integration"
path = "tests/main.rs"

[lints]
workspace = true

[build-dependencies]
serde_json.workspace = true
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }

[dev-dependencies]
base64 = "0.22.1"
bollard.workspace = true
nemoclaw-provider = { path = "../nemoclaw-provider" }
reqwest.workspace = true
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
tokio = { workspace = true, features = ["test-util"] }

[dependencies]
nemoclaw-backend = { path = "../nemoclaw-backend" }
nemoclaw-tofu = { path = "../nemoclaw-tofu" }
nemoclaw-openshell = { path = "../nemoclaw-openshell" }
# Only the image contract, without the engine client.
nemoclaw-fabric = { path = "../nemoclaw-fabric", default-features = false }
# Only the endpoint policy and retained identity types, without the engine client.
nemoclaw-docker = { path = "../nemoclaw-docker", default-features = false }
nemoclaw-runtime = { path = "../nemoclaw-runtime", default-features = false }
nemo-fabric-core = { git = "https://github.com/NVIDIA/NeMo-Fabric", rev = "24f068c895e5cbc30286bc743498be4e5014d658" }
jsonschema.workspace = true
thiserror.workspace = true
schemars.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
sha2.workspace = true
time.workspace = true
regex.workspace = true
url.workspace = true
ipnet.workspace = true
openshell-core.workspace = true
openshell-policy.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "fs"] }
tempfile.workspace = true
getrandom.workspace = true
process-wrap.workspace = true
tokio-util.workspace = true
bollard-stubs = "=1.53.1-rc.29.3.1"
interprocess = { version = "2.4.4", features = ["tokio"] }
kube.workspace = true
rustls.workspace = true
k8s-openapi.workspace = true
base64 = "0.22.1"
# Development issuer certificates and token signing.
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
ring = "0.17.14"

[target.'cfg(windows)'.dependencies]
widestring = "1"
