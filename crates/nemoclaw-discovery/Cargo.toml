[package]
name = "nemoclaw-discovery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Read-only facts about a deployment target, shared by the provider and onboarding."
# One integration-test binary links the crate and its dependencies once.
autotests = false

[[test]]
name = "integration"
path = "tests/main.rs"

[dependencies]
nemoclaw-sdk = { path = "../nemoclaw-sdk" }
nemoclaw-openshell = { path = "../nemoclaw-openshell" }
nemoclaw-docker = { path = "../nemoclaw-docker" }
nemoclaw-fabric = { path = "../nemoclaw-fabric" }
bollard.workspace = true
futures-util.workspace = true
openshell-sdk.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }
tonic.workspace = true
url.workspace = true

[target.'cfg(unix)'.dependencies]
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }

[lints]
workspace = true
