[package]
name = "nemoclaw-provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
# One integration-test binary links the crate and its dependencies once.
autotests = false

[[test]]
name = "integration"
path = "tests/main.rs"

[dependencies]
nemoclaw-backend = { path = "../nemoclaw-backend" }
nemoclaw-tofu = { path = "../nemoclaw-tofu" }
nemoclaw-openshell = { path = "../nemoclaw-openshell" }
nemoclaw-docker = { path = "../nemoclaw-docker" }
openshell-provider = { path = "../openshell-provider" }
nemoclaw-discovery = { path = "../nemoclaw-discovery" }
nemoclaw-sdk = { path = "../nemoclaw-sdk" }
nemoclaw-runtime = { path = "../nemoclaw-runtime", default-features = false }
bollard.workspace = true
futures-util.workspace = true
reqwest.workspace = true
regex.workspace = true
url.workspace = true
sha2.workspace = true
tar.workspace = true
ipnet.workspace = true
interprocess = { version = "2.4.4", features = ["tokio"] }
time.workspace = true
tokio-util.workspace = true
getrandom.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tf-provider.workspace = true
tokio.workspace = true
rustls.workspace = true
openshell-core.workspace = true
openshell-sdk.workspace = true
openshell-policy.workspace = true
tonic.workspace = true
nemo-fabric-core = { git = "https://github.com/NVIDIA/NeMo-Fabric", rev = "24f068c895e5cbc30286bc743498be4e5014d658" }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[dev-dependencies]
fabric-provider = { path = "../fabric-provider" }
prost.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true

[target.'cfg(windows)'.dev-dependencies]
widestring = "1"

[lints]
workspace = true

[[bin]]
name = "terraform-provider-nemoclaw"
path = "src/main.rs"
