# examples/multiple-providers.yaml on an external Kubernetes gateway, with
# each sandbox described by the runner's metadata bundle: the researcher's
# inference profile routes to a hosted and a local provider, and the writer
# uses only the local one. external-multiple-providers-writer.yaml is a second
# deployment on the same gateway.
apiVersion: nemoclaw.nvidia.com/v1alpha1
kind: NemoClawConfig
metadata:
  name: multiple-providers
  uid: cb18eaf0-1a4e-47b8-b254-6fe4e49bc360
spec:
  gateway:
    management: external
    runtime:
      provider: kubernetes
    endpoint: http://127.0.0.1:17671
  inferenceProviders:
    local:
      provider: openai
      endpoint: http://172.20.0.1:11434/v1
    hosted:
      provider: anthropic
      api: anthropic-messages
      endpoint: https://hosted.example/v1
      credential:
        env: HOSTED_API_KEY
  harnesses:
    assistant:
      kind: nvidia.fabric.openclaw
  inferences:
    smart-and-fast:
      default: smart
      routes:
        - name: smart
          providerRef: hosted
          overrides:
            model: hosted-model
        - name: fast
          providerRef: local
          overrides:
            model: qwen3:4b
  sandboxes:
    researcher:
      image:
        metadata: {env: NEMOCLAW_AGENT_IMAGE_METADATA}
        ref: fixture/agent@sha256:c3448f4fe32d5351b2a5142b7df2370e142b9070480f858666fdded1e3e46b6e
      harnessRef: assistant
      agent:
        name: researcher
        inferenceRef: smart-and-fast
    writer:
      image:
        metadata: {env: NEMOCLAW_AGENT_IMAGE_METADATA}
        ref: fixture/agent@sha256:c3448f4fe32d5351b2a5142b7df2370e142b9070480f858666fdded1e3e46b6e
      harnessRef: assistant
      agent:
        name: writer
        inference:
          routes:
            - name: fast
              providerRef: local
              overrides:
                model: qwen3:4b
