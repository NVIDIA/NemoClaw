# Three agents with different harnesses on one image, on an external gateway
# that runs OpenShell's Kubernetes driver, with web search declared three ways:
# a deployment integration the OpenClaw agent references, a sandbox
# integration the Hermes agent references, and the Pi agent's own. A fourth,
# unused integration is never registered. Each sandbox names the runner's
# metadata bundle image.
apiVersion: nemoclaw.nvidia.com/v1alpha1
kind: NemoClawConfig
metadata:
  name: kubernetes-search-scopes
  uid: 5e1c9a7d-3b2f-4c8e-9d6a-2f7b8e1c4a90
spec:
  gateway:
    management: external
    runtime:
      provider: kubernetes
    endpoint: https://openshell.example.com
  inferenceProviders:
    local:
      provider: openai
      endpoint: https://inference.example/v1
  integrations:
    shared-search:
      kind: webSearch
      provider: tavily
      credential: {env: TAVILY_API_KEY}
    unused-search:
      kind: webSearch
      provider: brave
      credential: {env: UNUSED_SEARCH_KEY}
  sandboxes:
    assistant:
      image:
        metadata: {env: NEMOCLAW_AGENT_IMAGE_METADATA}
        ref: fixture/agent@sha256:c3448f4fe32d5351b2a5142b7df2370e142b9070480f858666fdded1e3e46b6e
      network:
        tier: isolated
      harness:
        kind: nvidia.fabric.openclaw
      agent:
        name: assistant
        inference:
          routes:
            - name: primary
              providerRef: local
              overrides:
                model: fixture-model
        integrationRefs: [shared-search]
    hermes:
      image:
        metadata: {env: NEMOCLAW_AGENT_IMAGE_METADATA}
        ref: fixture/agent@sha256:c3448f4fe32d5351b2a5142b7df2370e142b9070480f858666fdded1e3e46b6e
      network:
        tier: isolated
      harness:
        kind: nvidia.fabric.hermes
      integrations:
        sandbox-search:
          kind: webSearch
          provider: brave
          credential: {env: BRAVE_API_KEY}
      agent:
        name: hermes
        inference:
          routes:
            - name: primary
              providerRef: local
              overrides:
                model: fixture-model
        integrationRefs: [sandbox-search]
    pi:
      image:
        metadata: {env: NEMOCLAW_AGENT_IMAGE_METADATA}
        ref: fixture/agent@sha256:c3448f4fe32d5351b2a5142b7df2370e142b9070480f858666fdded1e3e46b6e
      network:
        tier: isolated
      harness:
        kind: nvidia.fabric.pi
      agent:
        name: pi
        inference:
          routes:
            - name: primary
              providerRef: local
              overrides:
                model: fixture-model
        integrations:
          agent-search:
            kind: webSearch
            provider: brave
            credential: {env: BRAVE_API_KEY}
