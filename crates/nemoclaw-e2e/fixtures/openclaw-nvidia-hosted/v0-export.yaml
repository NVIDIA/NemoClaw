# Modeled from config export at NVIDIA/NemoClaw revision
# f47724f29838fe08898993fad1c8c6b7fcb3e080.
# 2026-09-15: reduced the explicit policy to deterministic representative rules.

apiVersion: nemoclaw.nvidia.com/v1
kind: NemoClawConfig
metadata:
  name: openclaw-nvidia-hosted
  uid: b8f25ac9-8e58-4c0b-98c3-17648f9a5575
spec:
  gateway:
    management: nemoclaw
    name: nemoclaw
    port: 17691
  inferenceProviders:
    - name: hosted-nvidia-prod
      provider: nvidia-prod
      api: openai-completions
      endpoint: https://integrate.api.nvidia.com/v1
      credential:
        env: NVIDIA_INFERENCE_API_KEY
  sandboxes:
    - name: assistant
      runtime:
        provider: docker
        image:
          ref: nemoclaw-sandbox-local@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      network:
        policy:
          explicit:
            version: 1
            process:
              run_as_user: sandbox
              run_as_group: sandbox
            network_policies:
              hosted-inference:
                name: hosted-inference
                endpoints:
                  - host: integrate.api.nvidia.com
                    port: 443
                binaries:
                  - path: /usr/bin/openclaw
            filesystem_policy:
              include_workdir: true
              read_only:
                - /usr
              read_write:
                - /sandbox
      agents:
        - name: primary
          type: openclaw
          inference:
            routes:
              - name: primary
                providerRef: hosted-nvidia-prod
                overrides:
                  model: nvidia/nemotron-3-super-120b-a12b
