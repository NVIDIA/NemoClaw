# Parsed and defaulted form of the raw v0 export produced by NVIDIA/NemoClaw
# b6934c6300c4e1e175757e9281ae3a641d9a5b1f.
# 2026-09-17: refreshed from the public v0 config export contract in #11977.

apiVersion: nemoclaw.nvidia.com/v1alpha1
kind: NemoClawConfig
metadata:
  name: openclaw-nvidia-hosted
  uid: b8f25ac9-8e58-4c0b-98c3-17648f9a5575
spec:
  gateway:
    management: managed
    endpoint: http://127.0.0.1:17691
    engine: unix:///var/run/docker.sock
    image: ghcr.io/nvidia/openshell/gateway@sha256:ec2b0efea84fff198e888e97c85befb9c908acde92e8256f9b527877ed182d66
    networkCIDR: 172.30.60.0/24
  inferenceProviders:
    - name: hosted-nvidia-prod
      provider: openai
      api: openai-completions
      endpoint: https://integrate.api.nvidia.com/v1
      credential:
        env: NVIDIA_INFERENCE_API_KEY
  sandboxes:
    - name: assistant
      harness:
        kind: openclaw
      image:
        ref: nc-multi-models@sha256:3ab70ded67440e838a37d6c9f0e3b08b95e2acf416c6076f8817bac190525cf0
      runtime:
        provider: docker
      network:
        policy:
          explicit:
            version: 1
            process:
              run_as_user: "1000"
              run_as_group: "1000"
            network_policies:
              hosted-inference:
                name: hosted-inference
                endpoints:
                  - host: integrate.api.nvidia.com
                    port: 443
                binaries:
                  - path: /usr/bin/openclaw
            filesystem_policy:
              include_workdir: true
              read_only:
                - /usr
                - /opt/fabric
                - /opt/nemoclaw
                - /app
              read_write:
                - /sandbox
      agents:
        - name: primary
          inference:
            routes:
              - name: primary
                providerRef: hosted-nvidia-prod
                overrides:
                  model: nvidia/nemotron-3-super-120b-a12b
