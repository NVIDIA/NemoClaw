apiVersion: nemoclaw.nvidia.com/v1alpha1
kind: NemoClawConfig
metadata:
  name: hermes-nvidia-hosted
  uid: 06b13b70-649d-4bc5-848d-1e116c36615d
spec:
  gateway:
    endpoint: http://127.0.0.1:17692
    management: managed
  inferenceProviders:
    - api: openai-completions
      credential:
        env: NVIDIA_INFERENCE_API_KEY
      endpoint: https://integrate.api.nvidia.com/v1
      name: hosted-nvidia-prod
      provider: openai
  sandboxes:
    - agents:
        - inference:
            routes:
              - name: primary
                overrides:
                  model: nvidia/nemotron-3-super-120b-a12b
                providerRef: hosted-nvidia-prod
          name: primary
      harness:
        interfaces:
          api:
            port: 8643
        kind: hermes
      name: assistant
      network:
        policy:
          explicit:
            filesystem_policy:
              include_workdir: true
              read_only:
                - /usr
                - /opt/fabric
                - /opt/nemoclaw
                - /opt/hermes
              read_write:
                - /sandbox
            network_policies:
              hosted-inference:
                binaries:
                  - path: /usr/local/bin/hermes
                endpoints:
                  - host: integrate.api.nvidia.com
                    port: 443
                name: hosted-inference
            process:
              run_as_group: "1000"
              run_as_user: "1000"
            version: 1
      runtime:
        provider: docker
