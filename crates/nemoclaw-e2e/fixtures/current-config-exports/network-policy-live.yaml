apiVersion: nemoclaw.nvidia.com/v1alpha1
kind: NemoClawConfig
metadata:
  name: e2e-net-policy
  uid: b279fb8f-952a-4745-918a-a23f98d939ea
spec:
  gateway:
    endpoint: http://127.0.0.1:8080
    management: managed
  inferenceProviders:
    - api: openai-completions
      credential:
        env: COMPATIBLE_API_KEY
      endpoint: https://inference-api.nvidia.com/v1
      name: hosted-compatible-endpoint
      provider: openai
  sandboxes:
    - agent:
        inference:
          routes:
            - name: primary
              overrides:
                model: nvidia/nvidia/nemotron-3-ultra
              providerRef: hosted-compatible-endpoint
        name: primary
      harness:
        kind: openclaw
      name: e2e-net-policy
      network:
        policy:
          explicit:
            filesystem_policy:
              include_workdir: true
              read_only:
                - /usr
                - /lib
                - /proc
                - /dev/urandom
                - /app
                - /etc
                - /var/log
                - /var/lib/dpkg
                - /opt/fabric
                - /opt/nemoclaw
              read_write:
                - /tmp
                - /dev/null
                - /dev/pts
                - /sandbox/.openclaw
                - /sandbox/.nemoclaw
                - /home/linuxbrew
            landlock:
              compatibility: best_effort
            network_policies:
              clawhub:
                binaries:
                  - path: /usr/local/bin/openclaw
                  - path: /usr/local/bin/node
                endpoints:
                  - allow_encoded_slash: true
                    enforcement: enforce
                    host: clawhub.ai
                    port: 443
                    protocol: rest
                    rules:
                      - allow:
                          method: GET
                          path: /**
                      - allow:
                          method: POST
                          path: /**
                name: clawhub
              managed_inference:
                binaries:
                  - path: /usr/local/bin/openclaw
                  - path: /usr/local/bin/node
                  - path: /usr/bin/node
                  - path: /usr/bin/curl
                  - path: /usr/bin/python3
                endpoints:
                  - enforcement: enforce
                    host: inference.local
                    port: 443
                    protocol: rest
                    rules:
                      - allow:
                          method: GET
                          path: /**
                      - allow:
                          method: POST
                          path: /**
                name: managed_inference
              npm_registry:
                binaries:
                  - path: /usr/local/bin/openclaw
                endpoints:
                  - enforcement: enforce
                    host: registry.npmjs.org
                    port: 443
                    protocol: rest
                    rules:
                      - allow:
                          method: GET
                          path: /**
                name: npm_registry
              nvidia:
                binaries:
                  - path: /usr/local/bin/openclaw
                endpoints:
                  - enforcement: enforce
                    host: integrate.api.nvidia.com
                    port: 443
                    protocol: rest
                    rules:
                      - allow:
                          method: POST
                          path: /v1/chat/completions
                      - allow:
                          method: POST
                          path: /v1/completions
                      - allow:
                          method: POST
                          path: /v1/embeddings
                      - allow:
                          method: GET
                          path: /v1/models
                      - allow:
                          method: GET
                          path: /v1/models/**
                name: nvidia
              openclaw_api:
                binaries:
                  - path: /usr/local/bin/openclaw
                  - path: /usr/local/bin/node
                endpoints:
                  - enforcement: enforce
                    host: openclaw.ai
                    port: 443
                    protocol: rest
                    rules:
                      - allow:
                          method: GET
                          path: /**
                      - allow:
                          method: POST
                          path: /**
                  - enforcement: enforce
                    host: catalog.openclaw.ai
                    port: 443
                    protocol: rest
                    rules:
                      - allow:
                          method: GET
                          path: /**
                name: openclaw_api
              openclaw_docs:
                binaries:
                  - path: /usr/local/bin/openclaw
                endpoints:
                  - enforcement: enforce
                    host: docs.openclaw.ai
                    port: 443
                    protocol: rest
                    rules:
                      - allow:
                          method: GET
                          path: /**
                name: openclaw_docs
            process:
              run_as_group: "1000"
              run_as_user: "1000"
            version: 1
      runtime:
        provider: docker
