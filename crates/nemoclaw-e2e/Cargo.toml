[package]
name = "nemoclaw-e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
# One integration-test binary links the SDK and provider once. The Brev test
# stays separate because its workflow copies that one executable to a VM.
autotests = false

[[test]]
name = "integration"
path = "tests/main.rs"

[[test]]
name = "brev"
path = "tests/brev.rs"

[dependencies]
rcgen = "0.14.10"
rustls.workspace = true
nemoclaw-sdk = { path = "../nemoclaw-sdk" }
nemoclaw-runtime = { path = "../nemoclaw-runtime" }
nemoclaw-provider = { path = "../nemoclaw-provider" }
nemoclaw-tofu = { path = "../nemoclaw-tofu" }
fabric-provider = { path = "../fabric-provider" }
nemoclaw-openshell = { path = "../nemoclaw-openshell" }
nemoclaw-test-fixtures = { path = "../nemoclaw-test-fixtures" }
async-trait.workspace = true
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true
tf-provider.workspace = true
tokio.workspace = true
tempfile.workspace = true
openshell-core.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
prost.workspace = true
tower.workspace = true
http.workspace = true
tokio-stream.workspace = true
tar.workspace = true

[dev-dependencies]
serde-saphyr.workspace = true
getrandom.workspace = true

[lints]
workspace = true
