[package]
name = "nemoclaw-e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
# Fixture tests share one binary. Brev and Station stay separate so operators
# can select each live suite without the fixture tests.
autotests = false

[[test]]
name = "integration"
path = "tests/main.rs"

[[test]]
name = "brev"
path = "tests/brev.rs"

[[test]]
name = "station"
path = "tests/station.rs"

[dependencies]
getrandom.workspace = true
rcgen = "0.14.10"
rustls.workspace = true
nemoclaw-sdk = { path = "../nemoclaw-sdk" }
nemoclaw-runtime = { path = "../nemoclaw-runtime" }
nemoclaw-provider = { path = "../nemoclaw-provider" }
nemoclaw-tofu = { path = "../nemoclaw-tofu" }
fabric-provider = { path = "../fabric-provider" }
nemoclaw-openshell = { path = "../nemoclaw-openshell" }
openshell-provider = { path = "../openshell-provider" }
nemoclaw-test-fixtures = { path = "../nemoclaw-test-fixtures" }
async-trait.workspace = true
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true
tf-provider.workspace = true
tokio.workspace = true
tempfile.workspace = true
openshell-core.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
prost.workspace = true
tower.workspace = true
http.workspace = true
tokio-stream.workspace = true
tar.workspace = true

[dev-dependencies]
reqwest.workspace = true
base64 = "0.22.1"
bollard.workspace = true
nemoclaw-sdk = { path = "../nemoclaw-sdk", features = ["test-scenarios"] }
k8s-openapi.workspace = true
kube.workspace = true
time.workspace = true
url.workspace = true
serde-saphyr.workspace = true
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }

[lints]
workspace = true
