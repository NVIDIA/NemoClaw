[package]
name = "nemoclaw-build"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
# One integration-test binary links the build tool and its dependencies once.
autotests = false

[[test]]
name = "integration"
path = "tests/main.rs"

[dependencies]
thiserror.workspace = true
nemoclaw-runtime = { path = "../nemoclaw-runtime", default-features = false }
nemoclaw-sdk = { path = "../nemoclaw-sdk", optional = true }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
reqwest.workspace = true
tokio.workspace = true
zip.workspace = true
flate2.workspace = true
tar.workspace = true
tempfile.workspace = true
getrandom.workspace = true
serde-saphyr.workspace = true
pulldown-cmark = { workspace = true, optional = true }
pulldown-cmark-to-cmark = { workspace = true, optional = true }
url.workspace = true
determinator.workspace = true
guppy.workspace = true
quick-junit.workspace = true
[build-dependencies]
sha2.workspace = true
[lints]
workspace = true

[features]
default = ["sdk"]
sdk = ["dep:nemoclaw-sdk", "dep:pulldown-cmark", "dep:pulldown-cmark-to-cmark"]
