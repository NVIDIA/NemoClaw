[package]
name = "openshell-provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "terraform-provider-openshell"
path = "src/main.rs"
required-features = ["installation"]

[features]
default = ["installation", "kubernetes"]
# Serve the types the SDK and nemoclaw-provider implement: gateway installation,
# and the external inference server check. Providers that only reach a gateway,
# such as fabric, turn this off.
installation = ["dep:nemoclaw-provider", "dep:nemoclaw-sdk"]
# Reach managed Kubernetes gateways through port-forwards the provider opens.
kubernetes = ["dep:nemoclaw-sdk"]

[lints]
workspace = true

[dependencies]
nemoclaw-backend = { path = "../nemoclaw-backend" }
nemoclaw-docker = { path = "../nemoclaw-docker" }
nemoclaw-openshell = { path = "../nemoclaw-openshell" }
nemoclaw-provider = { path = "../nemoclaw-provider", optional = true }
nemoclaw-sdk = { path = "../nemoclaw-sdk", optional = true }
nemoclaw-tofu = { path = "../nemoclaw-tofu" }
async-trait.workspace = true
openshell-core.workspace = true
prost-types.workspace = true
openshell-policy.workspace = true
openshell-sdk.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tf-provider.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tonic.workspace = true

[dev-dependencies]
nemoclaw-sdk = { path = "../nemoclaw-sdk" }
nemoclaw-test-fixtures = { path = "../nemoclaw-test-fixtures" }
# Certificates for a fake gateway that requires mutual TLS.
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
tar.workspace = true
tempfile.workspace = true
url.workspace = true
serde_json.workspace = true
prost.workspace = true
tokio = { workspace = true, features = ["test-util"] }
