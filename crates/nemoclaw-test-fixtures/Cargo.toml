# Test fixtures shared by the provider contract tests and the end-to-end
# tests. Provider crates use them as development dependencies; nemoclaw-e2e
# depends on the providers, so they cannot live there. The fixture executables
# in src/bin are found beside the test executables (fixture_executable).
[package]
name = "nemoclaw-test-fixtures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# The fixture provider serves SDK resource definitions through the shared adapter.
nemoclaw-sdk = { path = "../nemoclaw-sdk" }
nemoclaw-runtime = { path = "../nemoclaw-runtime", default-features = false }
nemoclaw-tofu = { path = "../nemoclaw-tofu" }
tf-provider.workspace = true
async-trait.workspace = true
tar.workspace = true
openshell-core.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
prost.workspace = true
tower.workspace = true
http.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
rustls.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
