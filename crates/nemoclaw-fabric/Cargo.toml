[package]
name = "nemoclaw-fabric"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["client"]
# Reading an image's label through its container engine.
client = ["dep:nemoclaw-docker", "dep:tokio"]

[dependencies]
nemoclaw-backend = { path = "../nemoclaw-backend" }
nemoclaw-docker = { path = "../nemoclaw-docker", optional = true }
nemoclaw-openshell = { path = "../nemoclaw-openshell" }
nemoclaw-tofu = { path = "../nemoclaw-tofu" }
jsonschema.workspace = true
nemo-fabric-core = { git = "https://github.com/NVIDIA/NeMo-Fabric", rev = "6cad35045ea534e096c48f634f739d804baef5ee" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"], optional = true }

[dev-dependencies]
tempfile.workspace = true
