[package]
name = "nemoclaw-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
# One integration-test binary links the CLI and its dependencies once.
autotests = false

[[test]]
name = "integration"
path = "tests/main.rs"

[dependencies]
nemoclaw-discovery = { path = "../nemoclaw-discovery" }
nemoclaw-onboarding = { path = "../nemoclaw-onboarding" }
nemoclaw-sdk = { path = "../nemoclaw-sdk" }
clap.workspace = true
futures-util.workspace = true
ratatui.workspace = true
terminal_size.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
tokio = { workspace = true, features = ["signal", "io-std", "io-util", "net"] }

tempfile.workspace = true
# Telemetry: the 5.0 record, its generated schema, the install ID, and the sender.
getrandom.workspace = true
regex.workspace = true
reqwest.workspace = true
schemars.workspace = true
serde.workspace = true
time = { workspace = true, features = ["macros"] }

[target.'cfg(unix)'.dependencies]
nix.workspace = true

# Hides console echo during credential prompts; crossterm already uses it.
[target.'cfg(windows)'.dependencies]
crossterm_winapi = "0.9.1"

[[bin]]
name = "nemoclaw"
path = "src/main.rs"

[lints]
workspace = true

[dev-dependencies]
jsonschema.workspace = true
vt100 = "0.16.2"

[target.'cfg(unix)'.dev-dependencies]
rustix = { workspace = true, features = ["termios"] }
