apiVersion: nemoclaw.nvidia.com/v1alpha1
kind: NemoClawConfig
metadata:
  name: openclaw-nvidia-hosted
  uid: 12345678-1234-4234-9234-123456789abc
spec:
  gateway:
    management: managed
  inferenceProviders:
  - api: openai-completions
    credential:
      env: NVIDIA_INFERENCE_API_KEY
    endpoint: https://integrate.api.nvidia.com/v1
    name: hosted-nvidia-prod
    provider: openai
  sandboxes:
  - agent:
      inference:
        routes:
        - name: primary
          overrides:
            model: nvidia/nemotron-3-super-120b-a12b
          providerRef: hosted-nvidia-prod
      name: primary
    harness:
      kind: openclaw
    name: assistant
    network:
      policy:
        explicit:
          filesystem_policy:
            include_workdir: true
            read_only:
            - /usr
            - /opt/fabric
            - /opt/nemoclaw
            - /app
            read_write:
            - /sandbox
          network_policies:
            hosted-inference:
              binaries:
              - path: /usr/bin/openclaw
              endpoints:
              - host: integrate.api.nvidia.com
                port: 443
              name: hosted-inference
          process:
            run_as_group: "1000"
            run_as_user: "1000"
          version: 1
    runtime:
      provider: docker
