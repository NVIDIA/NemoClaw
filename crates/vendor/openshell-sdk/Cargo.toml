[package]
name = "openshell-sdk"
description = "Shared async Rust client for OpenShell gateways"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/NVIDIA/OpenShell"

[dependencies]
openshell-core = { git = "https://github.com/NVIDIA/OpenShell", rev = "1fe79f53991debf32776853a60f0cbd4e127dcfb", default-features = false }
async-trait = "0.1"
futures = { version = "0.3" }
hyper = { version = "1.6", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
miette = { version = "7", features = ["fancy"] }
oauth2 = { version = "5", default-features = false, features = ["reqwest"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls-native-roots-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["std", "logging", "tls12", "aws_lc_rs"] }
serde = { version = "1", features = ["derive"] }
thiserror = { version = "2" }
tokio = { version = "1.43", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "aws_lc_rs"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
tonic = { version = "0.14", features = ["tls-native-roots"] }
tower = { version = "0.5" }
tracing = { version = "0.1" }

[dev-dependencies]
serde_json = { version = "1" }
tokio = { version = "1.43", features = ["full", "macros", "rt-multi-thread"] }
tokio-stream = { version = "0.1" }
wiremock = "0.6"


[workspace]
