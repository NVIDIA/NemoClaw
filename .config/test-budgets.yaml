# Wall-clock budgets for each test step, in seconds, enforced on the Linux CI
# runners; other platforms report their times without failing. wall_seconds
# bounds a step's nextest run, the live-docker step's nextest commands together,
# or each lifecycle partition; test_seconds bounds any one test in it. Lower a
# budget when a change makes the step faster; raising one needs the reason in
# the pull request. See docs/contributing/testing.md.

# Unit and integration tests: 27 s on linux_amd64, slowest test 5.1 s.
test:
  wall_seconds: 45
  test_seconds: 8

# Each lifecycle partition: at most 207 s on linux_amd64 and linux_arm64,
# slowest test 67 s.
lifecycle:
  wall_seconds: 300
  test_seconds: 90

# Live / Docker, its four nextest commands together: at most 255 s on
# linux_amd64 and 210 s on linux_arm64 in 11 v1 runs. Its slowest test,
# retained_runtime_rebuilds_offline_without_protobuf_or_a_dependency_cache,
# took 110 s on linux_amd64 in a full report; in the v1 runs, whose reports
# kept only the last command, it ran past 120 s in 5 of 11 linux_amd64 runs
# and, by its command's wall time, under about 150 s.
live-docker:
  wall_seconds: 360
  test_seconds: 180

# Live / Kind: at most 199 s on linux_amd64 and 171 s on linux_arm64 in 11 v1
# runs; slowest test 83 s.
live-kind:
  wall_seconds: 270
  test_seconds: 120
