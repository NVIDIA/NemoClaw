# Wall-clock budgets for each test step, in seconds, enforced on the Linux CI
# runners; other platforms report their times without failing. wall_seconds
# bounds a step's nextest run, the live-docker step's nextest commands together,
# or each lifecycle partition; test_seconds bounds any one test in it. The
# step's profile in .config/nextest.toml must use test_seconds as its
# slow-timeout period; it stops a test at a multiple of it. Lower a budget when
# a change makes the step faster; raising one needs the reason in the pull
# request. See docs/contributing/testing.md.
#
# binaries budgets test binaries by their nextest name: summed_seconds bounds
# the binary's test times added up across a platform's lifecycle partitions,
# and test_seconds bounds any one of its tests. Each binary's override in the
# lifecycle profile in .config/nextest.toml must use its test_seconds as the
# slow-timeout period.

# Unit and integration tests: 27 s on linux_amd64, slowest test 5.1 s.
test:
  wall_seconds: 45
  test_seconds: 8

# Each lifecycle partition: at most 207 s on linux_amd64 and linux_arm64,
# slowest test 67 s.
lifecycle:
  wall_seconds: 300
  test_seconds: 90

# Live / Docker, its four nextest commands together: at most 255 s on
# linux_amd64 and 210 s on linux_arm64 in 11 v1 runs, which included the
# runtime rebuild test since removed with the runtime builder; 228 s in one
# linux_arm64 run without it.
live-docker:
  wall_seconds: 360
  test_seconds: 180

# Live / Kind: at most 199 s on linux_amd64 and 171 s on linux_arm64 in 11 v1
# runs; slowest test 83 s.
live-kind:
  wall_seconds: 270
  test_seconds: 120

# Each provider's contract tests, measured on linux_amd64 and linux_arm64 in
# two runs after providers and the fake OpenShell gateway set TCP_NODELAY.
binaries:
  # 5 tests: at most 17.4 s summed; slowest test 6.2 s.
  fabric-provider::contract:
    summed_seconds: 25
    test_seconds: 10
  # 26 tests: at most 32.5 s summed; slowest test 4.7 s.
  nemoclaw-provider::contract:
    summed_seconds: 45
    test_seconds: 8
  # 62 tests: at most 74.6 s summed; slowest test 3.7 s.
  openshell-provider::contract:
    summed_seconds: 105
    test_seconds: 6
