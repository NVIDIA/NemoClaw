[profile.ci]
fail-fast = false
status-level = "slow"
failure-output = "immediate-final"
retries = 0
test-threads = 8
slow-timeout = { period = "30s", terminate-after = 10 }

[profile.lifecycle]
inherits = "ci"
test-threads = 4
# These fixtures own temporary state and loopback endpoints. Live tests stay opt-in.
default-filter = '''
test(native_state_json_preserves_module_and_instance_identity_without_refresh)
| (package(nemoclaw-e2e) & binary(=integration) & (
    test(/^provider_protocol::/) | test(/^service_capacity::/) | test(/^service_readiness::/)
    | test(/^sandbox_readiness::/) | test(/^opentofu_openshell::/) | test(/^deployment::/)
    | test(/^export_observations::/) | test(/^fabric_deployment::/)
    | test(/^multiple_providers::/) | test(/^remote_service::/)
    | test(/^discovery::/) | test(/^inference_discovery::/) | test(/^gateway_readiness::/)
))
'''

[profile.lifecycle.junit]
path = "lifecycle.xml"

# Real Docker and OpenTofu; run through `cargo ci live-docker`, which builds the
# images and owned inputs these tests read. One at a time: they share one engine.
[profile.live-docker]
inherits = "ci"
test-threads = 1
slow-timeout = { period = "60s", terminate-after = 10 }
default-filter = '''
(package(nemoclaw-runtime) & test(/^ollama_cache::/))
| (package(nemoclaw-build) & (
    test(runtime_archive_loads_with_its_exported_digest)
    | test(retained_runtime_rebuilds_offline_without_protobuf_or_a_dependency_cache)
    | test(a_new_fabric_archive_cannot_reuse_an_older_compiled_core)
))
| (package(nemoclaw-e2e) & binary(=integration) & (
    test(/^cache_provider::/) | test(/^docker_provider_proxy::/)
))
| (package(nemoclaw-sdk) & (
    test(managed_gateway_plan_apply_noop_destroy_and_recovery_use_real_opentofu)
    | test(the_issuer_image_serves_both_documents_over_https)
))
| (package(nemoclaw-provider) & test(/^managed_gateway_live::/))
'''

[profile.live-kind]
inherits = "ci"
test-threads = 1
slow-timeout = { period = "120s", terminate-after = 10 }
default-filter = '''
package(nemoclaw-sdk) & (test(/^kubernetes_live::/) | test(/^kubernetes_gateway::/))
'''

[profile.live-kind.junit]
path = "live-kind.xml"

[profile.live-docker.junit]
path = "live-docker.xml"
