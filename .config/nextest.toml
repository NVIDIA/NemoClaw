[profile.ci]
fail-fast = false
status-level = "slow"
failure-output = "immediate-final"
retries = 0
test-threads = 8
slow-timeout = { period = "30s", terminate-after = 10 }

[profile.lifecycle]
inherits = "ci"
test-threads = 4
# These fixtures own temporary state and loopback endpoints. Live tests stay opt-in.
default-filter = '''
test(native_state_json_preserves_module_and_instance_identity_without_refresh)
| (package(nemoclaw-e2e) & binary(=integration) & (
    test(/^provider_protocol::/) | test(/^service_capacity::/) | test(/^service_readiness::/)
    | test(/^sandbox_readiness::/) | test(/^opentofu_openshell::/) | test(/^deployment::/)
    | test(/^export_observations::/) | test(/^fabric_deployment::/)
    | test(/^multiple_providers::/) | test(/^remote_service::/)
    | test(/^discovery::/) | test(/^inference_discovery::/) | test(/^gateway_readiness::/)
))
'''

[profile.lifecycle.junit]
path = "lifecycle.xml"
