[profile.ci]
fail-fast = false
status-level = "slow"
failure-output = "immediate-final"
retries = 0
test-threads = 8
slow-timeout = { period = "30s", terminate-after = 10 }

[profile.lifecycle]
inherits = "ci"
test-threads = 2
