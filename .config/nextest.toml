[profile.ci]
fail-fast = false
status-level = "slow"
failure-output = "immediate-final"
retries = 0
test-threads = 8
# Each profile reports a test as slow at its step's per-test limit in
# .config/test-budgets.yaml and stops it at a small multiple of that limit, a
# margin for the platforms and local runs that only report budgets. The test
# step stops a test at three times its limit: its slowest test takes nearly
# twice the limit on macOS. A test in crates/nemoclaw-build checks both files.
slow-timeout = { period = "8s", terminate-after = 3 }

# Each test step writes a JUnit report that `cargo ci` summarizes into where
# its time went.
[profile.ci.junit]
path = "test.xml"

# These fixtures spawn Git, Cargo and Bake processes. Limit their contention
# on CI runners without serializing tests in the other binaries.
[[profile.ci.overrides]]
filter = 'binary_id(=nemoclaw-build::integration)'
test-group = "build-integration"

[profile.lifecycle]
inherits = "ci"
test-threads = 4
slow-timeout = { period = "90s", terminate-after = 2 }
# These fixtures own temporary state and loopback endpoints. Live tests stay opt-in.
# Selecting the fake ssh relay's ignored test also archives nemoclaw-test-fixtures'
# executables beside the extracted tests: the relay, which fake engines need on
# platforms without Unix sockets, and the SSH simulator. The fixture provider's
# ignored test does the same for the provider protocol tests.
default-filter = '''
((package(nemoclaw-provider) | package(openshell-provider) | package(fabric-provider)) & binary(=contract))
| (package(nemoclaw-test-fixtures) & binary(=ssh_relay))
| (package(nemoclaw-fixture-provider) & binary(=archive))
| (package(nemoclaw-e2e) & binary(=integration) & (
    test(/^deployment::/)
    | test(/^export_observations::/) | test(/^fabric_deployment::/)
    | test(/^kubernetes_agents::/)
    | test(/^multi_agent::/) | test(/^multiple_providers::/)
    | test(/^remote_service::/) | test(/^helm_recovery::/)
    | test(/^hcl_integration::/) | test(/^travel_example::/)
    | test(/^travel_team_example::/)
))
'''

[profile.lifecycle.junit]
path = "lifecycle.xml"

# Each provider's contract tests have their own per-test limit in
# .config/test-budgets.yaml; stop them at twice it, like the profile's other
# tests.
[[profile.lifecycle.overrides]]
filter = 'binary_id(=fabric-provider::contract)'
slow-timeout = { period = "16s", terminate-after = 2 }

[[profile.lifecycle.overrides]]
filter = 'binary_id(=nemoclaw-provider::contract)'
slow-timeout = { period = "12s", terminate-after = 2 }

[[profile.lifecycle.overrides]]
filter = 'binary_id(=openshell-provider::contract)'
slow-timeout = { period = "8s", terminate-after = 2 }


# The tofu test integration shards share one fixed engine socket.
[[profile.lifecycle.overrides]]
filter = 'test(/^hcl_integration::/)'
test-group = "hcl-integration"
# Real Docker and OpenTofu; run through `cargo ci live-docker`, which builds the
# images and owned inputs these tests read. The Docker tests share one engine,
# so they run one at a time; the offline runtime rebuild uses no engine and
# compiles alongside them.
[profile.live-docker]
inherits = "ci"
test-threads = 2
slow-timeout = { period = "180s", terminate-after = 2 }
default-filter = '''
(package(nemoclaw-build) & test(a_new_fabric_archive_cannot_reuse_an_older_compiled_core))
| (package(nemoclaw-e2e) & binary(=integration) & (
    test(/^cache_provider::/) | test(/^docker_provider_proxy::/) | test(/^docker_registry::/)
    | test(/^managed_gateway::/) | test(/^dummy_agent::/) | test(/^interfaces_live::/)
    | test(/^deepagents_code_terminal::/)
))
| (package(nemoclaw-sdk) & test(the_issuer_image_serves_both_documents_over_https))
| (package(nemoclaw-provider) & test(/^managed_gateway_live::/))
'''

[profile.live-kind]
inherits = "ci"
test-threads = 4
slow-timeout = { period = "150s", terminate-after = 2 }
default-filter = '''
package(nemoclaw-e2e) & binary(=integration) & (test(/^kubernetes_live::/) | test(/^kubernetes_chart::/))
'''

# The cluster tests use separate namespaces, releases and ports, so they run
# side by side while each waits on its pods. The registry test seeds its
# registry by tagging and untagging the node's shared agent image, which other
# sandboxes pull from at the same moment, so it runs alone. It runs last, so
# the tests that sort after it start with the others instead of waiting.
[[profile.live-kind.overrides]]
filter = 'test(/^kubernetes_live::registry::/)'
threads-required = "num-test-threads"
priority = -100

# The live reports are a run's shareable result: outcomes and times only.
# Failing tests' output stays in the job log.
[profile.live-kind.junit]
path = "live-kind.xml"
store-failure-output = false

[profile.live-docker.junit]
path = "live-docker.xml"
store-failure-output = false

[test-groups]
docker-engine = { max-threads = 1 }
build-integration = { max-threads = 2 }
hcl-integration = { max-threads = 1 }

# Every live Docker test uses the engine.
[[profile.live-docker.overrides]]
filter = 'all()'
test-group = "docker-engine"
