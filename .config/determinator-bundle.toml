# The bundle retains sources from source::SOURCE_ROOTS, including every crate.
# Unknown inputs run all checks. These rules must also cover build environment changes.

# The Windows installer packs the bundle, and its check runs where CI / Bundle
# builds the Windows bundle, so a change to its sources, build helper, or check
# builds it.
[[path-rule]]
globs = ["packaging/windows/**", "tools/release/windows-installer.rs", "tools/ci/windows-installer-e2e.rs"]
mark-changed = "all"

[[path-rule]]
globs = ["Cargo.lock", "crates/**", "examples/**", "image/**", "schemas/**", "LICENSE", "versions.json", "rust-toolchain.toml", ".cargo/**", ".config/**", ".github/actions/**", ".github/workflows/rust.yml", ".github/workflows/bundle-platform.yml", ".github/workflows/validation-plan.yml"]
mark-changed = "all"

[[path-rule]]
globs = ["docs/**", "fern/**", "tools/**", ".github/**", ".agents/**", ".claude/**", "deny.toml", ".pre-commit-config.yaml", "AGENTS.md", "WRITING.md"]
mark-changed = []
