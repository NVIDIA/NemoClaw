[workspace]
members = [
    "crates/nemoclaw-backend",
    "crates/nemoclaw-tofu",
    "crates/nemoclaw-openshell",
    "crates/nemoclaw-docker",
    "crates/openshell-provider",
    "crates/fabric-provider",
    "crates/nemoclaw-sdk",
    "crates/nemoclaw-authoring",
    "crates/nemoclaw-discovery",
    "crates/nemoclaw-provider",
    "crates/nemoclaw-e2e",
    "crates/nemoclaw-cli",
    "crates/nemoclaw-runtime",
    "crates/nemoclaw-build",
    "crates/nemoclaw-ollama-proxy",
    "examples/onboarding-tui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
thiserror = "2"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tf-provider = { git = "https://github.com/aneoconsulting/tf-provider", rev = "d4d1501e5e35d7d8d18184a319192c3f775d25f3" }
tempfile = "3"
terminal_size = "0.4.4"
serde-saphyr = "1.2"
sha2 = "0.11"
sha1 = "0.11"
regex = "1"
url = "2"
ipnet = "2"
nix = { version = "0.29", features = ["signal", "term"] }
openshell-core = { git = "https://github.com/NVIDIA/OpenShell", rev = "6648bd0c290efbc41ba131ee9831ee45cd431f94", default-features = false }
openshell-sdk = { git = "https://github.com/NVIDIA/OpenShell", rev = "6648bd0c290efbc41ba131ee9831ee45cd431f94", default-features = false }
openshell-policy = { git = "https://github.com/NVIDIA/OpenShell", rev = "6648bd0c290efbc41ba131ee9831ee45cd431f94", default-features = false }
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots"] }
prost = "0.14"
tonic-prost = "0.14"
tower = "0.5"
http = "1"
tokio-stream = { version = "0.1", features = ["net"] }
getrandom = "0.4"
process-wrap = { version = "10", features = ["tokio1"] }
tokio-util = { version = "0.7", features = ["rt"] }
clap = { version = "4", features = ["derive"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
futures-util = "0.3"
time = { version = "0.3", features = ["formatting", "parsing"] }
bollard = { version = "0.21.1", default-features = false, features = ["pipe"] }
tar = "0.4"
rustix = { version = "1", features = ["fs", "termios"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
flate2 = "1.1"
schemars = "=1.2.2"
jsonschema = { version = "=0.56.0", default-features = false }
pulldown-cmark = { version = "=0.13.4", default-features = false }
pulldown-cmark-to-cmark = "=22.0.1"
crossterm = "0.29"
# Cluster access for Kubernetes gateways; helm is the only cluster subprocess.
kube = { version = "4.2", default-features = false, features = ["client", "rustls-tls", "ring", "ws"] }
k8s-openapi = { version = "0.28", default-features = false, features = ["latest"] }

[patch."https://github.com/NVIDIA/OpenShell"]
openshell-sdk = { path = "crates/vendor/openshell-sdk" }
