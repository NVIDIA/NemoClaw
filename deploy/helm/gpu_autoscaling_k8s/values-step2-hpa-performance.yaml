# Performance HPA: Prometheus scrapes /metrics → prometheus-adapter → HPA on inflight requests.
# Better signal for GPU inference than CPU utilization alone.
# Requires: kube-prometheus-stack + prometheus-adapter (see scripts/install-hpa.sh).

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 4
  maxGpus: 4
  mode: performance
  performance:
    inflightRequestsPerPod: "4"

gpuScaling:
  oneReplicaPerGpu: true
  count: 1
  perPodGpu: 1
  perPodCpuRequest: "2"
  perPodCpuLimit: "4"
  perPodMemory: "16Gi"
  perPodMemoryLimit: "24Gi"
  agentCpuRequest: "250m"
  agentCpuLimit: "1"
  agentMemory: "512Mi"
  agentMemoryLimit: "1Gi"

loadTest:
  chatOnly: true
  concurrencyPerPod: 8

probes:
  readinessChecksInference: true
  startupProbeSeconds: 600

metrics:
  enabled: true
  path: /metrics
  serviceMonitor:
    enabled: true
    interval: 15s
    labels:
      release: kube-prometheus
