#
# imagePullSecret so kubelet can authenticate to nvcr.io when pulling the NIM image itself.
# Separate from nim-ngc-secret.yaml, which holds NGC_API_KEY for the already-running container
# to pull its model profile — a Kubernetes imagePullSecret must be `kubernetes.io/dockerconfigjson`,
# not the plain Opaque Secret used for an env var. See nim.imagePullSecret in values.yaml.
{{- if and (eq (include "nemoclaw-gpu.runtime" .) "nim") .Values.nim.imagePullSecret.create .Values.nim.ngcApiKey.value (not .Values.nim.imagePullSecret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nemoclaw-gpu.nimImagePullSecretName" . | quote }}
  namespace: {{ include "nemoclaw-gpu.namespace" . }}
  labels:
    {{- include "nemoclaw-gpu.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  # NGC's registry auth convention: literal username "$oauthtoken", password is the NGC API key.
  .dockerconfigjson: {{ dict "auths" (dict .Values.nim.imagePullSecret.registry (dict "username" "$oauthtoken" "password" .Values.nim.ngcApiKey.value "auth" (printf "$oauthtoken:%s" .Values.nim.ngcApiKey.value | b64enc))) | toJson | b64enc }}
{{- end }}
