apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nemoclaw-gpu.fullname" . }}-agent
  namespace: {{ include "nemoclaw-gpu.namespace" . }}
  labels:
    {{- include "nemoclaw-gpu.labels" . | nindent 4 }}
spec:
  {{- if .Values.autoscaling.enabled }}
  replicas: {{ include "nemoclaw-gpu.hpaMinReplicas" . }}
  {{- else }}
  replicas: {{ include "nemoclaw-gpu.replicas" . }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "nemoclaw-gpu.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nemoclaw-gpu.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/agent-config: {{ printf "%s%s%s" (.Files.Get "files/agent-server.mjs") (.Files.Get "files/agent-metrics.mjs") (.Files.Get "files/ollama-start.sh") | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.runtimeClassName }}
      runtimeClassName: {{ .Values.runtimeClassName | quote }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ollama
          image: "{{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}"
          imagePullPolicy: {{ .Values.ollama.image.pullPolicy }}
          command: ["/bin/sh", "/scripts/ollama-start.sh"]
          ports:
            - name: ollama
              containerPort: {{ .Values.ollama.port }}
              protocol: TCP
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:{{ .Values.ollama.port }}"
            - name: OLLAMA_MODEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "nemoclaw-gpu.fullname" . }}-agent
                  key: INFERENCE_MODEL
            - name: OLLAMA_NUM_PARALLEL
              value: {{ .Values.ollama.numParallel | default 4 | quote }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: ollama-data
              mountPath: /root/.ollama
          resources:
            {{- include "nemoclaw-gpu.ollamaResources" . | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/tags
              port: ollama
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /api/tags
              port: ollama
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 12
        - name: agent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          command: ["node", "/app/agent-server.mjs"]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: INFERENCE_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "nemoclaw-gpu.fullname" . }}-agent
                  key: INFERENCE_BASE_URL
            - name: INFERENCE_MODEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "nemoclaw-gpu.fullname" . }}-agent
                  key: INFERENCE_MODEL
            - name: OLLAMA_BASE_URL
              value: "http://127.0.0.1:{{ .Values.ollama.port }}"
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
          resources:
            {{- include "nemoclaw-gpu.agentResources" . | nindent 12 }}
          startupProbe:
            httpGet:
              path: {{ if .Values.probes.readinessChecksInference }}/readyz{{ else }}/healthz{{ end }}
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: {{ max (div (int .Values.probes.startupProbeSeconds) 10) 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: {{ if .Values.probes.readinessChecksInference }}/readyz{{ else }}/healthz{{ end }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: app
          configMap:
            name: {{ include "nemoclaw-gpu.fullname" . }}-agent
            items:
              - key: agent-server.mjs
                path: agent-server.mjs
              - key: agent-metrics.mjs
                path: agent-metrics.mjs
        - name: scripts
          configMap:
            name: {{ include "nemoclaw-gpu.fullname" . }}-agent
            items:
              - key: ollama-start.sh
                path: ollama-start.sh
                mode: 0755
        - name: ollama-data
          {{- if and .Values.ollama.persistence.enabled .Values.ollama.persistence.hostPath }}
          hostPath:
            path: {{ .Values.ollama.persistence.hostPath | quote }}
            type: DirectoryOrCreate
          {{- else if .Values.ollama.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "nemoclaw-gpu.fullname" . }}-ollama
          {{- else }}
          emptyDir: {}
          {{- end }}
