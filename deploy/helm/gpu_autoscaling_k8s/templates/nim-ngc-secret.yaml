{{- if and (eq (include "nemoclaw-gpu.runtime" .) "nim") .Values.nim.ngcApiKey.value (not .Values.nim.ngcApiKey.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-nim-ngc" (include "nemoclaw-gpu.fullname" .) | trunc 63 | trimSuffix "-" | quote }}
  namespace: {{ include "nemoclaw-gpu.namespace" . }}
  labels:
    {{- include "nemoclaw-gpu.labels" . | nindent 4 }}
type: Opaque
data:
  NGC_API_KEY: {{ .Values.nim.ngcApiKey.value | b64enc | quote }}
{{- end }}
