{{- if not .Values.inference.auth.enabled }}
{{- fail "inference.auth.enabled must remain true: the in-cluster inference API requires authentication" }}
{{- end }}
{{- $authKey := required "inference.auth.key is required" .Values.inference.auth.key }}
{{- if not (regexMatch "^[A-Za-z0-9._-]+$" $authKey) }}
{{- fail "inference.auth.key must contain only letters, digits, '.', '_', or '-'" }}
{{- end }}
{{- if not .Values.inference.auth.existingSecret }}
{{- $ns := include "nemoclaw-gpu.namespace" . }}
{{- $secretName := include "nemoclaw-gpu.inferenceApiSecretName" . }}
{{- $existing := lookup "v1" "Secret" $ns $secretName }}
{{- $apiKey := "" }}
{{- if $existing }}
{{- if not (hasKey (default dict $existing.data) $authKey) }}
{{- fail (printf "existing generated inference Secret %s does not contain key %s" $secretName $authKey) }}
{{- end }}
{{- $apiKey = index $existing.data $authKey | b64dec }}
{{- else }}
{{- $apiKey = randAlphaNum 48 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName | quote }}
  namespace: {{ $ns }}
  labels:
    {{- include "nemoclaw-gpu.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $authKey | quote }}: {{ $apiKey | b64enc | quote }}
{{- end }}
