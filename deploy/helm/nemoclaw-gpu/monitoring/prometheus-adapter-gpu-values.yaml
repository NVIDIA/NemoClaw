# prometheus-adapter: expose DCGM GPU utilization and agent LLM metrics to HPA.
# DCGM_FI_DEV_GPU_UTIL is scraped from nvidia-dcgm-exporter (GPU operator).
# Agent /metrics (inflight, LLM latency) require ServiceMonitor on nemoclaw-gpu-agent.

prometheus:
  url: http://REPLACE_PROMETHEUS_SERVICE.monitoring.svc
  port: 9090

rules:
  default: false
  custom:
    # DCGM exporter attributes GPU util to workloads via exported_* labels (not pod/namespace).
    - seriesQuery: 'DCGM_FI_DEV_GPU_UTIL{exported_namespace!="",exported_pod!=""}'
      resources:
        overrides:
          exported_namespace:
            resource: namespace
          exported_pod:
            resource: pod
      name:
        matches: "^(.*)$"
        as: "gpu_utilization_percent"
      metricsQuery: 'avg(<<.Series>>{<<.LabelMatchers>>}) by (<<.GroupBy>>)'
    - seriesQuery: 'nemoclaw_http_inflight_requests{namespace!="",pod!=""}'
      resources:
        overrides:
          namespace:
            resource: namespace
          pod:
            resource: pod
      name:
        matches: "^(.*)$"
        as: "nemoclaw_http_inflight_requests"
      metricsQuery: 'avg(<<.Series>>{<<.LabelMatchers>>}) by (<<.GroupBy>>)'
    - seriesQuery: 'nemoclaw_llm_latency_p95_milliseconds{namespace!="",pod!=""}'
      resources:
        overrides:
          namespace:
            resource: namespace
          pod:
            resource: pod
      name:
        matches: "^(.*)$"
        as: "nemoclaw_llm_latency_p95_milliseconds"
      metricsQuery: 'avg(<<.Series>>{<<.LabelMatchers>>}) by (<<.GroupBy>>)'
