# Latency HPA: scale when rolling p95 LLM response time exceeds target (ms).
# Requires: Prometheus + prometheus-adapter + ServiceMonitor scraping agent /metrics.

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 4
  maxGpus: 4
  mode: latency
  performance:
    latencyP95Milliseconds: "2000"

gpuScaling:
  oneReplicaPerGpu: true
  count: 1
  perPodGpu: 1
  perPodCpuRequest: "2"
  perPodCpuLimit: "4"
  perPodMemory: "16Gi"
  perPodMemoryLimit: "24Gi"
  agentCpuRequest: "250m"
  agentCpuLimit: "1"
  agentMemory: "512Mi"
  agentMemoryLimit: "1Gi"

loadTest:
  chatOnly: true
  concurrencyPerPod: 8

probes:
  readinessChecksInference: true
  startupProbeSeconds: 600

metrics:
  enabled: true
  path: /metrics
  serviceMonitor:
    enabled: true
    interval: 15s
    labels:
      release: kube-prometheus
