[package]
name = "gpu-rust-compiler"
version = "0.1.0"
edition = "2021"
default-run = "gpu-rust-compiler"
publish = false
license = "Apache-2.0"

# This experiment is independent of NemoClaw's production workspace.
[workspace]
resolver = "2"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
object = { version = "0.37", default-features = false, features = ["write", "read", "std"] }

[profile.release]
opt-level = 3
