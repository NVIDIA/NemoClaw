name: CI / Native
on:
  push:
    branches: [v1]
  pull_request:
    branches: [v1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-native-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native:
    name: Test / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            platform: linux_arm64
          - runner: ubuntu-24.04
            platform: linux_amd64
          - runner: macos-15
            platform: darwin_arm64
          # Intel macOS CI is temporarily disabled because of slow builds.
          - runner: windows-2025
            platform: windows_amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      TEST_PLATFORM: ${{ matrix.platform }}
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          platform: ${{ matrix.platform }}
      # Each step runs through `cargo ci`, so `cargo ci` locally runs the same checks.
      - name: Check formatting
        run: cargo ci fmt
      - name: Lint Rust
        run: cargo ci clippy
      - name: Build test executables
        run: cargo ci build
      - name: Run deterministic tests
        run: cargo ci test
      - name: Check generated configuration schema and reference
        run: cargo ci schema
      - name: Build and verify native bundle
        run: cargo ci bundle
      - name: Execute real OpenTofu and SDK/CLI lifecycle
        run: cargo ci lifecycle
      - name: Upload deterministic test timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-${{ matrix.platform }}-${{ github.run_attempt }}
          path: target/nextest/ci/test.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload lifecycle timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lifecycle-${{ matrix.platform }}-${{ github.run_attempt }}
          path: target/nextest/lifecycle/lifecycle.xml
          if-no-files-found: ignore
          retention-days: 14
