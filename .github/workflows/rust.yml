name: CI / Native
on:
  push:
    branches: [v1]
  pull_request:
    branches: [v1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-native-${{ github.event_name }}-${{ github.ref }}
  # Only v1 pushes save the shared Rust caches, and a cold Windows or macOS build
  # outlasts the usual gap between merges. Cancelling pushes left those caches unwritten.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  linux_arm64:
    uses: ./.github/workflows/native-platform.yml
    with:
      runner: ubuntu-24.04-arm
      platform: linux_arm64
  linux_amd64:
    uses: ./.github/workflows/native-platform.yml
    with:
      runner: ubuntu-24.04
      platform: linux_amd64
  darwin_arm64:
    uses: ./.github/workflows/native-platform.yml
    with:
      runner: macos-15
      platform: darwin_arm64
  windows_amd64:
    uses: ./.github/workflows/native-platform.yml
    with:
      runner: windows-2025
      platform: windows_amd64
      # Windows has few lifecycle fixtures; one worker runs them all.
      lifecycle-shards: "[1]"
  # Keep the v1 ruleset's check names. A skipped, cancelled, or failed platform
  # must never become a successful required check. Each platform's shards start
  # after its own build, not after the slowest member of a global build matrix.
  native:
    name: Test / ${{ matrix.platform }}
    if: always()
    needs: [linux_arm64, linux_amd64, darwin_arm64, windows_amd64]
    strategy:
      fail-fast: false
      matrix:
        platform: [linux_arm64, linux_amd64, darwin_arm64, windows_amd64]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all checks for this platform
        env:
          RESULT: ${{ needs[matrix.platform].result }}
        run: test "$RESULT" = success
