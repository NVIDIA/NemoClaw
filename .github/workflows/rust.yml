name: CI / Native
on:
  push:
    branches: [v1]
  pull_request:
    branches: [v1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-native-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native:
    name: Native / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            platform: linux_arm64
          - runner: ubuntu-24.04
            platform: linux_amd64
          - runner: macos-15
            platform: darwin_arm64
          # Intel macOS CI is temporarily disabled because of slow builds.
          - runner: windows-2025
            platform: windows_amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      TEST_PLATFORM: ${{ matrix.platform }}
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          platform: ${{ matrix.platform }}
      - name: Test CI orchestration
        if: matrix.platform == 'linux_amd64'
        run: python3 -B -m unittest discover -s tools/ci -p 'test_*.py'
      - name: Install test runner for Linux ARM64 pilot
        if: matrix.platform == 'linux_arm64'
        run: |
          mkdir -p "$RUNNER_TEMP/nextest"
          cd "$RUNNER_TEMP/nextest"
          archive=cargo-nextest-0.9.144-aarch64-unknown-linux-gnu.tar.gz
          curl --fail --location --retry 3 "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.144/$archive" -o "$archive"
          echo "7fecfd431b810c05c589d800524286b8f80ce2fe9fb1fef05caf16d095cea407  $archive" | sha256sum --check
          tar -xzf "$archive" cargo-nextest
          echo "$PWD" >> "$GITHUB_PATH"
          ./cargo-nextest nextest --version
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint Rust
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build test executables
        run: cargo build --locked --workspace --all-targets
      - name: Run deterministic tests
        run: |
          if [ "$TEST_PLATFORM" = linux_arm64 ]; then
            cargo nextest run --locked --workspace --profile ci
            cargo test --locked --workspace --doc
          else
            cargo test --locked --workspace
          fi
      - name: Check recipe attribution and preparation adapters
        if: runner.os == 'Linux'
        run: python3 -B -m unittest discover -s runtimes/qwen38 -p 'test_*.py'
      - name: Check generated configuration schema and reference
        run: |
          suffix=""
          if [ "$TEST_PLATFORM" = windows_amd64 ]; then suffix=.exe; fi
          "./target/debug/nemoclaw-build$suffix" schema --check
      - name: Build and verify native bundle
        run: |
          suffix=""
          if [ "$TEST_PLATFORM" = windows_amd64 ]; then suffix=.exe; fi
          "./target/debug/nemoclaw-build$suffix" bundle --platform "$TEST_PLATFORM"
      - name: Execute real OpenTofu and SDK/CLI lifecycle
        run: |
          export NEMOCLAW_TEST_BUNDLE="$PWD/dist/$TEST_PLATFORM"
          suffix=""
          if [ "$TEST_PLATFORM" = windows_amd64 ]; then suffix=.exe; fi
          export NEMOCLAW_TEST_TOFU="$NEMOCLAW_TEST_BUNDLE/libexec/tofu$suffix"
          export NEMOCLAW_TEST_PROVIDER="$PWD/target/debug/terraform-provider-nemoclaw$suffix"
          cargo test --locked -p nemoclaw-sdk native_state_json_preserves_module_and_instance_identity_without_refresh -- --ignored
          tests=(--test provider_protocol --test service_capacity --test service_readiness --test sandbox_readiness --test opentofu_openshell --test deployment --test export_observations --test fabric_deployment --test multiple_providers --test remote_service)
          if [ "$TEST_PLATFORM" = linux_arm64 ]; then
            cargo nextest run --locked --workspace --profile lifecycle "${tests[@]}" --run-ignored only
          else
            cargo test --locked --workspace "${tests[@]}" -- --ignored --test-threads=2
          fi
