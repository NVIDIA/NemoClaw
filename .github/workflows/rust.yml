name: CI / Bundle
on:
  push:
    branches: [v1]
  # Stacked v1 PRs target feature branches, so do not filter by base branch.
  pull_request:
  workflow_dispatch:
# The planner and the Linux live suites read the per-commit image package for
# images to reuse. GitHub checks a reusable workflow's job permissions for every
# caller, including platforms whose live jobs never run, so grant it here.
permissions:
  contents: read
  packages: read
concurrency:
  group: ci-bundle-${{ github.event_name }}-${{ github.ref }}
  # Only v1 pushes save the shared Rust caches, and a cold Windows or macOS build
  # outlasts the usual gap between merges. Cancelling pushes left those caches unwritten.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  plan:
    uses: ./.github/workflows/validation-plan.yml
    with:
      full: ${{ github.event_name != 'pull_request' }}
  # Each platform runs its four test layers: Unit, Contract, Integration, and,
  # on Linux when the plan selects the live suites, E2E. Linux AMD64 also runs
  # the HCL E2E cases that need a model; they use the inference secret, so a
  # fork's pull request skips them, and the ones on the NVIDIA GPU runner, which
  # refuses pull request jobs, run on v1 pushes and manual runs.
  linux_arm64:
    needs: plan
    uses: ./.github/workflows/bundle-platform.yml
    with:
      runner: ubuntu-24.04-arm
      platform: linux_arm64
      bundle: ${{ needs.plan.outputs.bundle == 'true' }}
      lifecycle: ${{ needs.plan.outputs.lifecycle == 'true' }}
      e2e: ${{ needs.plan.outputs.live == 'true' }}
      live-images-commit: ${{ needs.plan.outputs.live_images }}
  linux_amd64:
    needs: plan
    uses: ./.github/workflows/bundle-platform.yml
    with:
      runner: ubuntu-24.04
      platform: linux_amd64
      bundle: ${{ needs.plan.outputs.bundle == 'true' }}
      lifecycle: ${{ needs.plan.outputs.lifecycle == 'true' }}
      e2e: ${{ needs.plan.outputs.live == 'true' }}
      live-images-commit: ${{ needs.plan.outputs.live_images }}
      hcl: ${{ needs.plan.outputs.live == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
      hcl-gpu: ${{ github.event_name != 'pull_request' }}
    secrets: inherit
  darwin_arm64:
    needs: plan
    uses: ./.github/workflows/bundle-platform.yml
    with:
      runner: macos-15
      platform: darwin_arm64
      bundle: ${{ needs.plan.outputs.bundle == 'true' }}
      lifecycle: ${{ needs.plan.outputs.lifecycle == 'true' }}
  windows_amd64:
    needs: plan
    uses: ./.github/workflows/bundle-platform.yml
    with:
      runner: windows-2025
      platform: windows_amd64
      bundle: ${{ needs.plan.outputs.bundle == 'true' }}
      lifecycle: ${{ needs.plan.outputs.lifecycle == 'true' }}
      # Windows runs its tests longest after its slower bundle build, so its
      # integration tests use a third partition to keep that path closer to
      # the other platforms.
      integration-shards: "[1, 2, 3]"
  # One required check per test layer, across every platform. A skipped,
  # cancelled, or failed platform must never become a successful check: a
  # missing result fails it. A layer the plan did not select passes.
  unit:
    name: Unit
    if: ${{ !cancelled() }}
    needs: [linux_arm64, linux_amd64, darwin_arm64, windows_amd64]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require Unit on every platform
        env:
          RESULTS: >-
            ${{ needs.linux_arm64.outputs.unit }}
            ${{ needs.linux_amd64.outputs.unit }}
            ${{ needs.darwin_arm64.outputs.unit }}
            ${{ needs.windows_amd64.outputs.unit }}
        run: |
          set -- $RESULTS
          test "$#" = 4
          for result; do
            case "$result" in
              success) ;;
              *) echo "a platform reported $result"; exit 1 ;;
            esac
          done
  contract:
    name: Contract
    if: ${{ !cancelled() }}
    needs: [linux_arm64, linux_amd64, darwin_arm64, windows_amd64]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require Contract on every platform
        env:
          RESULTS: >-
            ${{ needs.linux_arm64.outputs.contract }}
            ${{ needs.linux_amd64.outputs.contract }}
            ${{ needs.darwin_arm64.outputs.contract }}
            ${{ needs.windows_amd64.outputs.contract }}
        run: |
          set -- $RESULTS
          test "$#" = 4
          for result; do
            case "$result" in
              success | not-selected) ;;
              *) echo "a platform reported $result"; exit 1 ;;
            esac
          done
  integration:
    name: Integration
    if: ${{ !cancelled() }}
    needs: [linux_arm64, linux_amd64, darwin_arm64, windows_amd64]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require Integration on every platform
        env:
          RESULTS: >-
            ${{ needs.linux_arm64.outputs.integration }}
            ${{ needs.linux_amd64.outputs.integration }}
            ${{ needs.darwin_arm64.outputs.integration }}
            ${{ needs.windows_amd64.outputs.integration }}
        run: |
          set -- $RESULTS
          test "$#" = 4
          for result; do
            case "$result" in
              success | not-selected) ;;
              *) echo "a platform reported $result"; exit 1 ;;
            esac
          done
  e2e:
    name: E2E
    if: ${{ !cancelled() }}
    needs: [plan, linux_arm64, linux_amd64, darwin_arm64, windows_amd64]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require E2E on every platform
        env:
          PLAN: ${{ needs.plan.result }}
          RESULTS: >-
            ${{ needs.linux_arm64.outputs.e2e }}
            ${{ needs.linux_amd64.outputs.e2e }}
            ${{ needs.darwin_arm64.outputs.e2e }}
            ${{ needs.windows_amd64.outputs.e2e }}
        run: |
          test "$PLAN" = success || { echo "the plan reported $PLAN"; exit 1; }
          set -- $RESULTS
          test "$#" = 4
          for result; do
            case "$result" in
              success | not-selected) ;;
              *) echo "a platform reported $result"; exit 1 ;;
            esac
          done
  # Keep the v1 ruleset's check names until it requires the layer checks. Each
  # platform's check covers its build, bundle, unit, contract, and integration
  # tests, not its live suites.
  native:
    name: Test / ${{ matrix.platform }}
    # Unlike always(), this reports a cancelled run's gates as cancelled, not failed;
    # neither counts as a passing required check. Without a condition, a failed
    # platform would skip the gate, and GitHub counts a skipped check as passing.
    if: ${{ !cancelled() }}
    needs: [linux_arm64, linux_amd64, darwin_arm64, windows_amd64]
    strategy:
      fail-fast: false
      matrix:
        platform: [linux_arm64, linux_amd64, darwin_arm64, windows_amd64]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require this platform's unit, contract, and integration tests
        env:
          UNIT: ${{ needs[matrix.platform].outputs.unit }}
          CONTRACT: ${{ needs[matrix.platform].outputs.contract }}
          INTEGRATION: ${{ needs[matrix.platform].outputs.integration }}
        run: |
          test "$UNIT" = success
          for result in "$CONTRACT" "$INTEGRATION"; do
            case "$result" in
              success | not-selected) ;;
              *) echo "a layer reported $result"; exit 1 ;;
            esac
          done
