name: CI / Bundle
on:
  # Pushes to v1 also run the live suites.
  push:
    branches: [v1]
  # Stacked v1 PRs target feature branches, so do not filter by base branch.
  pull_request:
  workflow_dispatch:
# The planner and the Linux live suites read the per-commit image package for
# images to reuse. GitHub checks a reusable workflow's job permissions for every
# caller, including platforms whose live jobs never run, so grant it here.
permissions:
  contents: read
  packages: read
concurrency:
  group: ci-bundle-${{ github.event_name }}-${{ github.ref }}
  # Only v1 pushes save the shared Rust caches, and a cold Windows or macOS build
  # outlasts the usual gap between merges. Cancelling pushes left those caches unwritten.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  plan:
    uses: ./.github/workflows/validation-plan.yml
    with:
      full: ${{ github.event_name != 'pull_request' }}
  linux_arm64:
    needs: plan
    uses: ./.github/workflows/bundle-platform.yml
    with:
      runner: ubuntu-24.04-arm
      platform: linux_arm64
      bundle: ${{ needs.plan.outputs.bundle == 'true' }}
      lifecycle: ${{ needs.plan.outputs.lifecycle == 'true' }}
      live: ${{ github.event_name == 'push' && github.ref == 'refs/heads/v1' }}
  linux_amd64:
    needs: plan
    uses: ./.github/workflows/bundle-platform.yml
    with:
      runner: ubuntu-24.04
      platform: linux_amd64
      bundle: ${{ needs.plan.outputs.bundle == 'true' }}
      lifecycle: ${{ needs.plan.outputs.lifecycle == 'true' }}
      live: ${{ github.event_name == 'push' && github.ref == 'refs/heads/v1' }}
  darwin_arm64:
    needs: plan
    uses: ./.github/workflows/bundle-platform.yml
    with:
      runner: macos-15
      platform: darwin_arm64
      bundle: ${{ needs.plan.outputs.bundle == 'true' }}
      lifecycle: ${{ needs.plan.outputs.lifecycle == 'true' }}
  windows_amd64:
    needs: plan
    uses: ./.github/workflows/bundle-platform.yml
    with:
      runner: windows-2025
      platform: windows_amd64
      bundle: ${{ needs.plan.outputs.bundle == 'true' }}
      lifecycle: ${{ needs.plan.outputs.lifecycle == 'true' }}
      # Windows runs its tests longest after its slower bundle build, so its
      # integration tests use a third partition to keep that path closer to
      # the other platforms.
      integration-shards: "[1, 2, 3]"
  # The live suites, on each push to v1 only. No required check depends on them.
  # E2E / HCL builds its own candidate and runs the HCL E2E cases that need a
  # model; E2E / PLATFORM runs the Docker and Kubernetes suites from the
  # platform's test archive and bundle.
  e2e_hcl:
    name: E2E / HCL
    if: github.event_name == 'push' && github.ref == 'refs/heads/v1'
    uses: ./.github/workflows/hcl-e2e.yml
    # The hosted cases read NVIDIA_API_KEY.
    secrets: inherit
  e2e_linux_arm64:
    name: E2E / linux_arm64
    needs: [plan, linux_arm64]
    if: >-
      ${{ !cancelled() && needs.linux_arm64.outputs.tests != '' && needs.linux_arm64.outputs.bundle != '' &&
      github.event_name == 'push' && github.ref == 'refs/heads/v1' }}
    uses: ./.github/workflows/e2e-platform.yml
    with:
      runner: ubuntu-24.04-arm
      platform: linux_arm64
      tests: ${{ needs.linux_arm64.outputs.tests }}
      bundle: ${{ needs.linux_arm64.outputs.bundle }}
      live-images-commit: ${{ needs.plan.outputs.live_images }}
  e2e_linux_amd64:
    name: E2E / linux_amd64
    needs: [plan, linux_amd64]
    if: >-
      ${{ !cancelled() && needs.linux_amd64.outputs.tests != '' && needs.linux_amd64.outputs.bundle != '' &&
      github.event_name == 'push' && github.ref == 'refs/heads/v1' }}
    uses: ./.github/workflows/e2e-platform.yml
    with:
      runner: ubuntu-24.04
      platform: linux_amd64
      tests: ${{ needs.linux_amd64.outputs.tests }}
      bundle: ${{ needs.linux_amd64.outputs.bundle }}
      live-images-commit: ${{ needs.plan.outputs.live_images }}
  # The E2E layer's check, after a change reaches v1: the Docker and Kubernetes
  # suites on both Linux platforms and the HCL cases that need a model.
  e2e:
    name: E2E
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/v1' }}
    needs: [e2e_linux_arm64, e2e_linux_amd64, e2e_hcl]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every live suite
        env:
          RESULTS: >-
            ${{ needs.e2e_linux_arm64.result }}
            ${{ needs.e2e_linux_amd64.result }}
            ${{ needs.e2e_hcl.result }}
        run: |
          for result in $RESULTS; do
            test "$result" = success || { echo "a live suite reported $result"; exit 1; }
          done
  # One required check per test layer, across every platform. A skipped,
  # cancelled, or failed platform must never become a successful check: a
  # missing result fails it. A layer the plan did not select passes.
  unit:
    name: Unit
    if: ${{ !cancelled() }}
    needs: [linux_arm64, linux_amd64, darwin_arm64, windows_amd64]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require unit tests on every platform
        env:
          RESULTS: >-
            ${{ needs.linux_arm64.outputs.unit }}
            ${{ needs.linux_amd64.outputs.unit }}
            ${{ needs.darwin_arm64.outputs.unit }}
            ${{ needs.windows_amd64.outputs.unit }}
        run: |
          set -- $RESULTS
          test "$#" = 4
          for result; do
            case "$result" in
              success) ;;
              *) echo "a platform reported $result"; exit 1 ;;
            esac
          done
  contract:
    name: Contract
    if: ${{ !cancelled() }}
    needs: [linux_arm64, linux_amd64, darwin_arm64, windows_amd64]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require contract tests on every platform
        env:
          RESULTS: >-
            ${{ needs.linux_arm64.outputs.contract }}
            ${{ needs.linux_amd64.outputs.contract }}
            ${{ needs.darwin_arm64.outputs.contract }}
            ${{ needs.windows_amd64.outputs.contract }}
        run: |
          set -- $RESULTS
          test "$#" = 4
          for result; do
            case "$result" in
              success | not-selected) ;;
              *) echo "a platform reported $result"; exit 1 ;;
            esac
          done
  integration:
    name: Integration
    if: ${{ !cancelled() }}
    needs: [linux_arm64, linux_amd64, darwin_arm64, windows_amd64]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require integration tests on every platform
        env:
          RESULTS: >-
            ${{ needs.linux_arm64.outputs.integration }}
            ${{ needs.linux_amd64.outputs.integration }}
            ${{ needs.darwin_arm64.outputs.integration }}
            ${{ needs.windows_amd64.outputs.integration }}
        run: |
          set -- $RESULTS
          test "$#" = 4
          for result; do
            case "$result" in
              success | not-selected) ;;
              *) echo "a platform reported $result"; exit 1 ;;
            esac
          done
  # Keep the v1 ruleset's check names until it requires the layer checks. Each
  # platform's check covers its build, bundle, unit, contract, and integration
  # tests, not the live suites. Each platform's shards start after its own
  # build, not after the slowest member of a global build matrix.
  native:
    name: Test / ${{ matrix.platform }}
    # Unlike always(), this reports a cancelled run's gates as cancelled, not failed;
    # neither counts as a passing required check. Without a condition, a failed
    # platform would skip the gate, and GitHub counts a skipped check as passing.
    if: ${{ !cancelled() }}
    needs: [linux_arm64, linux_amd64, darwin_arm64, windows_amd64]
    strategy:
      fail-fast: false
      matrix:
        platform: [linux_arm64, linux_amd64, darwin_arm64, windows_amd64]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all checks for this platform
        env:
          RESULT: ${{ needs[matrix.platform].result }}
        run: test "$RESULT" = success
