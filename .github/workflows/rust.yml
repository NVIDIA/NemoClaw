name: CI / Native
on:
  push:
    branches: [v1]
  pull_request:
    branches: [v1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-native-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native:
    name: Native / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            platform: linux_arm64
          - runner: ubuntu-24.04
            platform: linux_amd64
          - runner: macos-15
            platform: darwin_arm64
          # Intel macOS CI is temporarily disabled because of slow builds.
          - runner: windows-2025
            platform: windows_amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      TEST_PLATFORM: ${{ matrix.platform }}
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          platform: ${{ matrix.platform }}
      - name: Test CI orchestration
        if: matrix.platform == 'linux_amd64'
        run: python3 -B -m unittest discover -s tools/ci -p 'test_*.py'
      - name: Install pinned test runner
        run: |
          mkdir -p "$RUNNER_TEMP/nextest"
          cd "$RUNNER_TEMP/nextest"
          case "$TEST_PLATFORM" in
            linux_arm64) target=aarch64-unknown-linux-gnu; checksum=7fecfd431b810c05c589d800524286b8f80ce2fe9fb1fef05caf16d095cea407 ;;
            linux_amd64) target=x86_64-unknown-linux-gnu; checksum=8a4f726272b0a1c499bd87ca3978bfbb1a8c20bb08ccf075b9996e2081bd1e1e ;;
            darwin_arm64) target=universal-apple-darwin; checksum=87472b2c3ee09154cadd34d168a5cdede478806810f095c3dc4dc499943da42e ;;
            windows_amd64) target=x86_64-pc-windows-msvc; checksum=b0d6a6569d4ef63a095c5a574a6856c17fb755b51a02a17e4651e738e9192831 ;;
            *) exit 1 ;;
          esac
          archive="cargo-nextest-0.9.144-$target.tar.gz"
          curl --fail --location --retry 3 "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.144/$archive" -o "$archive"
          python -c 'import hashlib, pathlib, sys; assert hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest() == sys.argv[2], "nextest checksum mismatch"' "$archive" "$checksum"
          tar -xzf "$archive"
          python -c 'import os, pathlib; open(os.environ["GITHUB_PATH"], "a").write(str(pathlib.Path.cwd()) + "\n")'
          ./cargo-nextest nextest --version
      - name: Verify test runner on PATH
        run: cargo nextest --version
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint Rust
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build test executables
        run: cargo build --locked --workspace --all-targets
      - name: Run deterministic tests
        run: |
          cargo nextest run --locked --workspace --all-targets --profile ci
          cargo test --locked --workspace --doc
      - name: Check recipe attribution and preparation adapters
        if: runner.os == 'Linux'
        run: python3 -B -m unittest discover -s runtimes/qwen38 -p 'test_*.py'
      - name: Check generated configuration schema and reference
        run: |
          suffix=""
          if [ "$TEST_PLATFORM" = windows_amd64 ]; then suffix=.exe; fi
          "./target/debug/nemoclaw-build$suffix" schema --check
      - name: Build and verify native bundle
        run: |
          suffix=""
          if [ "$TEST_PLATFORM" = windows_amd64 ]; then suffix=.exe; fi
          "./target/debug/nemoclaw-build$suffix" bundle --platform "$TEST_PLATFORM"
      - name: Execute real OpenTofu and SDK/CLI lifecycle
        run: |
          export NEMOCLAW_TEST_BUNDLE="$PWD/dist/$TEST_PLATFORM"
          suffix=""
          if [ "$TEST_PLATFORM" = windows_amd64 ]; then suffix=.exe; fi
          export NEMOCLAW_TEST_TOFU="$NEMOCLAW_TEST_BUNDLE/libexec/tofu$suffix"
          export NEMOCLAW_TEST_PROVIDER="$PWD/target/debug/terraform-provider-nemoclaw$suffix"
          # Keep Cargo's target/feature selection identical to the first test build.
          # Nextest filters execution without recompiling a different package graph.
          cargo nextest run --locked --workspace --all-targets --profile lifecycle --run-ignored only
      - name: Upload lifecycle timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lifecycle-${{ matrix.platform }}-${{ github.run_attempt }}
          path: target/nextest/lifecycle/lifecycle.xml
          if-no-files-found: ignore
          retention-days: 14
