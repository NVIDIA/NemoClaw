name: CI / Bundle
on:
  push:
    branches: [v1]
  # Stacked v1 PRs target feature branches, so do not filter by base branch.
  pull_request:
  workflow_dispatch:
# The planner and the Linux live suites read the per-commit image package for
# images to reuse. GitHub checks a reusable workflow's job permissions for every
# caller, including platforms whose live jobs never run, so grant it here.
permissions:
  contents: read
  packages: read
concurrency:
  group: ci-bundle-${{ github.event_name }}-${{ github.ref }}
  # Only v1 pushes save the shared Rust caches, and a cold Windows or macOS build
  # outlasts the usual gap between merges. Cancelling pushes left those caches unwritten.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  plan:
    uses: ./.github/workflows/validation-plan.yml
    with:
      full: ${{ github.event_name != 'pull_request' }}
  # Each platform runs its test layers: Unit, Contract, and Integration, and, on
  # Linux when the plan selects the live suites, E2E. Linux AMD64 also runs
  # the HCL E2E cases that need a model; they use the inference secret, so a
  # fork's pull request skips them, and the ones on the NVIDIA GPU runner, which
  # refuses pull request jobs, run on v1 pushes and manual runs.
  # Ubuntu 22.04 is the oldest supported Linux: its runners build the Linux
  # bundles and test executables, and the bundle job checks that none needs a
  # newer glibc. Test jobs run on the newer runners, which run them too.
  linux_arm64:
    needs: plan
    uses: ./.github/workflows/bundle-platform.yml
    with:
      runner: ubuntu-24.04-arm
      build-runner: ubuntu-22.04-arm
      glibc: "2.35"
      platform: linux_arm64
      bundle: ${{ needs.plan.outputs.bundle == 'true' }}
      lifecycle: ${{ needs.plan.outputs.lifecycle == 'true' }}
      e2e: ${{ needs.plan.outputs.live == 'true' }}
      live-images-commit: ${{ needs.plan.outputs.live_images }}
      hcl-cases: ${{ needs.plan.outputs.hcl_cases }}
  linux_amd64:
    needs: plan
    uses: ./.github/workflows/bundle-platform.yml
    with:
      runner: ubuntu-24.04
      build-runner: ubuntu-22.04
      glibc: "2.35"
      platform: linux_amd64
      bundle: ${{ needs.plan.outputs.bundle == 'true' }}
      lifecycle: ${{ needs.plan.outputs.lifecycle == 'true' }}
      e2e: ${{ needs.plan.outputs.live == 'true' }}
      live-images-commit: ${{ needs.plan.outputs.live_images }}
      hcl-cases: ${{ needs.plan.outputs.hcl_cases }}
      hcl: ${{ needs.plan.outputs.live == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
      hcl-gpu: ${{ needs.plan.outputs.live == 'true' && github.event_name != 'pull_request' }}
    secrets: inherit
  darwin_arm64:
    needs: plan
    uses: ./.github/workflows/bundle-platform.yml
    with:
      runner: macos-15
      platform: darwin_arm64
      bundle: ${{ needs.plan.outputs.bundle == 'true' }}
      lifecycle: ${{ needs.plan.outputs.lifecycle == 'true' }}
  windows_amd64:
    needs: plan
    uses: ./.github/workflows/bundle-platform.yml
    with:
      runner: windows-2025
      platform: windows_amd64
      bundle: ${{ needs.plan.outputs.bundle == 'true' }}
      lifecycle: ${{ needs.plan.outputs.lifecycle == 'true' }}
      # Windows runs its tests longest after its slower bundle build, so its
      # integration tests use a third partition to keep that path closer to
      # the other platforms.
      partitions: >-
        [{"layer": "contract", "shard": 1, "shards": 1},
        {"layer": "integration", "shard": 1, "shards": 3},
        {"layer": "integration", "shard": 2, "shards": 3},
        {"layer": "integration", "shard": 3, "shards": 3}]
  # The v1 ruleset requires one check per platform. Each covers the platform's
  # four test layers, Unit, Contract, Integration, and E2E, which the run page
  # groups under the platform. Each platform's jobs start after its own build,
  # not after the slowest member of a global build matrix.
  native:
    name: Test / ${{ matrix.platform }}
    # Unlike always(), this reports a cancelled run's gates as cancelled, not failed;
    # neither counts as a passing required check. Without a condition, a failed
    # platform would skip the gate, and GitHub counts a skipped check as passing.
    if: ${{ !cancelled() }}
    needs: [linux_arm64, linux_amd64, darwin_arm64, windows_amd64]
    strategy:
      fail-fast: false
      matrix:
        platform: [linux_arm64, linux_amd64, darwin_arm64, windows_amd64]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all checks for this platform
        env:
          RESULT: ${{ needs[matrix.platform].result }}
        run: test "$RESULT" = success
