#
# FORWARD-mode proxy E2E (#2572) — manual trigger.
#
# Spins up a local OpenAI-compatible mock endpoint, onboards NemoClaw with
# NEMOCLAW_PROVIDER=custom, and exercises the FORWARD-mode rewrite branch
# of nemoclaw-blueprint/scripts/http-proxy-fix.js end-to-end inside a
# running sandbox. Validates that openclaw's HTTP client can complete an
# agent turn through the custom endpoint and that no RFC 7230 hop-by-hop
# proxy headers leak to the upstream.
#
# Trigger manually: Actions → "FORWARD-mode Proxy E2E" → Run workflow
# Or via CLI: gh workflow run forward-proxy-e2e.yaml

name: FORWARD-mode Proxy E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forward-proxy-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "22"

      - name: Run FORWARD-mode Proxy E2E
        env:
          NEMOCLAW_NON_INTERACTIVE: "1"
          NEMOCLAW_ACCEPT_THIRD_PARTY_SOFTWARE: "1"
        run: bash test/e2e/test-messaging-compatible-endpoint.sh

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: forward-proxy-e2e-log
          path: /tmp/nemoclaw-compat-e2e.log
          if-no-files-found: ignore
