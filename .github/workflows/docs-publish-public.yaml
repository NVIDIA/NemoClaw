name: Docs / Publish Release Docs

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: docs-publish-public-${{ github.ref_name }}
  cancel-in-progress: false

env:
  FERN_PUBLIC_INSTANCE: nvidia-nemoclaw.docs.buildwithfern.com/nemoclaw

jobs:
  publish:
    name: Docs / Publish release documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: docs-public
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag commit is on the v0 release branch
        run: |
          # A full checkout already has the remote branches. Prefer v0 after the rename.
          release_branch=origin/main
          if git show-ref --verify --quiet refs/remotes/origin/v0; then
            release_branch=origin/v0
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "$release_branch"; then
            echo "::error::Public docs publishing only runs for release tags whose commits are reachable from $release_branch."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false

      - name: Install reviewed npm
        uses: ./.github/actions/setup-reviewed-npm

      - name: Install docs dependencies
        run: npm ci --ignore-scripts

      - name: Prepare and validate Fern docs
        run: |
          npm run docs:prepare
          npm run docs:validate

      - name: Publish public docs
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: |
          FERN_VERSION=$(node -p "require('./fern/fern.config.json').version")
          cd fern
          npx --yes "fern-api@${FERN_VERSION}" generate --docs --instance "$FERN_PUBLIC_INSTANCE"
