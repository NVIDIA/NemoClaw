  # Manual PR qualification also requires the exact candidate activation contract.
  managed-image-multiarch-startup:
    name: Protected managed-image startup (${{ matrix.platform }})
    needs: [base-image-publication, generate-matrix]
    if: ${{ github.repository == 'NVIDIA/NemoClaw' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && (contains(fromJSON(needs.generate-matrix.outputs.selected_jobs), 'managed-image-multiarch-startup') || contains(fromJSON(needs.generate-matrix.outputs.selected_jobs), 'managed-image-protected-runtime')) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 210
    permissions:
      contents: read
    strategy:
