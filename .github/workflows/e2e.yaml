      E2E_WORKLOAD_SOURCE: ${{ needs.generate-matrix.outputs.workload_source }}
      E2E_JOB: "1"
      E2E_TARGET_ID: "hermes-gpu-startup"
      E2E_AGENT_RUNTIME: "hermes"
      E2E_ENVIRONMENT_OR_INFERENCE_ENDPOINT: "NVIDIA GPU runner; local GPU inference"
