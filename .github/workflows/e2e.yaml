          - platform: linux/amd64
            runner: ubuntu-24.04
            shard: linux-amd64
            environment_or_inference_endpoint: "AMD64 Ubuntu; exact managed image startup"
            coverage_variant: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
