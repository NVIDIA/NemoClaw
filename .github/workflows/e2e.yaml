          "$OPENSHELL_BIN" --version
          npx tsx tools/e2e/live-vitest-invocation.mts run --test-path test/e2e/live/mcp-bridge.test.ts

      - id: mcp_artifact_secret_scan
        name: Scan MCP artifacts for fixture credentials
        if: always()
        run: >-
