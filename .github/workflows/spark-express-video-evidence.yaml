name: CI / Spark Express Video Evidence

on:
  workflow_dispatch:
    inputs:
      maintainer_branch_override:
        description: Allow an authorized maintainer to qualify the selected non-main revision
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: spark-express-video-evidence
  cancel-in-progress: false

jobs:
  record:
    name: Record Spark Express vLLM qualification
    if: ${{ github.repository == 'NVIDIA/NemoClaw' && github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || (inputs.maintainer_branch_override && github.actor == 'ericksoa' && github.triggering_actor == 'ericksoa')) }}
    runs-on: linux-arm64-gpu-dgx-spark-gb10-protected-1
    environment:
      name: approve-dgx-spark-image-qualification
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      E2E_ARTIFACT_DIR: ${{ github.workspace }}/e2e-artifacts/live/spark-express-vllm
      E2E_JOB: "1"
      E2E_TARGET_ID: spark-express-vllm
      NEMOCLAW_ACCEPT_THIRD_PARTY_SOFTWARE: "1"
      NEMOCLAW_CLI_BIN: ${{ github.workspace }}/bin/nemoclaw.js
      NEMOCLAW_NON_INTERACTIVE: "1"
      NEMOCLAW_RUN_LIVE_E2E: "1"
      NEMOCLAW_SANDBOX_NAME: e2e-spark-express-vllm
      NEMOCLAW_SPARK_EVIDENCE_TIMELINE: ${{ github.workspace }}/spark-express-video-work/spark-express-vllm.timeline.jsonl
      OPENSHELL_GATEWAY: nemoclaw
    steps:
      - name: Validate protected Spark dispatch
        env:
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          MAINTAINER_BRANCH_OVERRIDE: ${{ inputs.maintainer_branch_override }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          RUNNER_ARCH_KIND: ${{ runner.arch }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        shell: bash
        run: |
          set -euo pipefail
          trusted_ref=0
          if [[ "$REF" == "refs/heads/main" ]]; then
            trusted_ref=1
          elif [[ "$MAINTAINER_BRANCH_OVERRIDE" == "true" && "$ACTOR" == "ericksoa" && "$TRIGGERING_ACTOR" == "ericksoa" ]]; then
            trusted_ref=1
          fi
          [[ "$REPOSITORY" == "NVIDIA/NemoClaw" && "$EVENT_NAME" == "workflow_dispatch" && "$trusted_ref" -eq 1 ]] || {
            echo "::error::Spark evidence requires trusted main or the authorized maintainer branch override" >&2
            exit 1
          }
          [[ "$RUNNER_ARCH_KIND" == "ARM64" ]] || {
            echo "::error::Spark evidence requires native Linux ARM64" >&2
            exit 1
          }

      - name: Checkout exact main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare E2E workspace
        uses: NVIDIA/NemoClaw/.github/actions/prepare-e2e@f6304bc25fc35bfaa441c8c2fbfee38f72805a75

      - name: Install OpenShell CLI
        shell: bash
        run: >-
          env -u DOCKER_CONFIG -u DOCKERHUB_USERNAME -u DOCKERHUB_TOKEN
          -u NVIDIA_API_KEY -u NVIDIA_INFERENCE_API_KEY -u GITHUB_TOKEN -u GH_TOKEN
          bash scripts/install-openshell.sh

      - name: Run and record Spark Express qualification
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/.npm-global/bin:$PATH"
          install -d -m 0700 "$E2E_ARTIFACT_DIR"
          set +e
          env -u DOCKER_CONFIG -u DOCKERHUB_USERNAME -u DOCKERHUB_TOKEN \
            -u NVIDIA_API_KEY -u NVIDIA_INFERENCE_API_KEY -u GITHUB_TOKEN -u GH_TOKEN \
            npx tsx tools/e2e/live-vitest-invocation.mts run \
              --test-path test/e2e/live/spark-express-vllm.test.ts 2>&1 | \
            node --experimental-strip-types --no-warnings \
              tools/e2e/spark-express-video-evidence.mts record \
              --output "$NEMOCLAW_SPARK_EVIDENCE_TIMELINE"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          test_status="${pipeline_status[0]}"
          recorder_status="${pipeline_status[1]}"
          if [[ "$test_status" -eq 0 ]]; then
            outcome=passed
          else
            outcome=failed
          fi
          node --experimental-strip-types --no-warnings \
            tools/e2e/spark-express-video-evidence.mts finalize \
            --timeline "$NEMOCLAW_SPARK_EVIDENCE_TIMELINE" \
            --status "$outcome"
          [[ "$recorder_status" -eq 0 ]] || exit "$recorder_status"
          exit "$test_status"

      - name: Upload Spark Express E2E artifacts
        if: ${{ always() }}
        uses: NVIDIA/NemoClaw/.github/actions/upload-e2e-artifacts@7768e15eb90d3ee2d33432f481dfe8747e4f6d57

      - name: Transfer sanitized Spark Express timeline
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spark-express-video-timeline
          path: ${{ env.NEMOCLAW_SPARK_EVIDENCE_TIMELINE }}
          if-no-files-found: error
          retention-days: 1

  render:
    name: Render Spark Express qualification video
    needs: record
    if: ${{ github.repository == 'NVIDIA/NemoClaw' && github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || (inputs.maintainer_branch_override && github.actor == 'ericksoa' && github.triggering_actor == 'ericksoa')) && needs.record.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NEMOCLAW_SPARK_EVIDENCE_CONCAT: ${{ github.workspace }}/spark-express-video-work/replay.ffconcat
      NEMOCLAW_SPARK_EVIDENCE_FRAMES: ${{ github.workspace }}/spark-express-video-work/frames
      NEMOCLAW_SPARK_EVIDENCE_INPUT: ${{ github.workspace }}/spark-express-video-work/input/spark-express-vllm.timeline.jsonl
      NEMOCLAW_SPARK_EVIDENCE_OUTPUT: ${{ github.workspace }}/spark-express-video-work/output
    steps:
      - name: Checkout exact evidence renderer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download sanitized Spark Express timeline
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spark-express-video-timeline
          path: ${{ github.workspace }}/spark-express-video-work/input

      - name: Render sanitized Spark Express replay
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null
          install -d -m 0700 "$NEMOCLAW_SPARK_EVIDENCE_OUTPUT"
          node --experimental-strip-types --no-warnings \
            tools/e2e/spark-express-video-evidence.mts render \
            --timeline "$NEMOCLAW_SPARK_EVIDENCE_INPUT" \
            --frames "$NEMOCLAW_SPARK_EVIDENCE_FRAMES" \
            --concat "$NEMOCLAW_SPARK_EVIDENCE_CONCAT" \
            --manifest "$NEMOCLAW_SPARK_EVIDENCE_OUTPUT/manifest.json"
          duration="$(node -e 'const value=require(process.argv[1]); process.stdout.write(String(value.playbackDurationSeconds))' "$NEMOCLAW_SPARK_EVIDENCE_OUTPUT/manifest.json")"
          ffmpeg -hide_banner -loglevel error \
            -f concat -safe 0 -i "$NEMOCLAW_SPARK_EVIDENCE_CONCAT" \
            -vf "fps=1,format=yuv420p" \
            -c:v libx264 -preset veryfast -crf 28 -movflags +faststart -t "$duration" \
            "$NEMOCLAW_SPARK_EVIDENCE_OUTPUT/spark-express-vllm-qualification.mp4"

      - name: Upload Spark Express qualification video
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spark-express-vllm-qualification-video
          path: ${{ env.NEMOCLAW_SPARK_EVIDENCE_OUTPUT }}/
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 14
