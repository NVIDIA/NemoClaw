# The Docker and Kubernetes live suites for one Linux platform, from the test
# inputs, bundle, and live images that its Bundle platform run uploaded, which
# calls it as that platform's E2E jobs whenever the plan selects the live suites, including
# on pull requests, and on Linux AMD64 the HCL E2E cases. A failure here fails
# that platform's required Test / PLATFORM check.
name: E2E platform
on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      platform:
        type: string
        required: true
      tests:
        description: Name prefix of the Bundle platform run's test artifacts; live jobs download PREFIX-inputs and PREFIX-live.
        type: string
        required: true
      bundle:
        description: The Bundle platform run's bundle artifact.
        type: string
        required: true
      images:
        description: The Bundle platform run's live images artifact, or empty when the live suites pull live-images-commit's images.
        type: string
        default: ""
      live-images-commit:
        description: A v1 commit whose pushed images the live suites pull instead of building, or empty to build them.
        type: string
        default: ""
      hcl:
        description: Also run the HCL E2E cases that use NVIDIA hosted inference; the caller passes the inference secret.
        type: boolean
        default: false
      hcl-gpu:
        description: Also run the HCL E2E cases on the NVIDIA GPU runner, which refuses pull request jobs; the caller passes the inference secret.
        type: boolean
        default: false
      hcl-cases:
        description: The validation plan's live HCL case selection, as JSON with the selected cases by where they run.
        type: string
        required: true
      live-suites:
        description: Run the Docker and Kubernetes live suites; a run for the hardware cases alone skips them.
        type: boolean
        default: true
      hcl-target:
        description: With hcl-gpu, Live / HCL's hardware target, which runs on this platform.
        type: string
        default: rtx-pro-6000
      hcl-hosted:
        description: With hcl-gpu, also run the hosted cases in Live / HCL, as a manual run of the HCL cases does.
        type: boolean
        default: false
      hcl-jobs:
        description: With hcl-gpu, comma-separated case IDs on the target, or empty for every selected case.
        type: string
        default: ""
permissions:
  contents: read
  packages: read
defaults:
  run:
    shell: bash
env:
  TEST_PLATFORM: ${{ inputs.platform }}
  CARGO_INCREMENTAL: "0"
jobs:
  # Like the contract and integration shards, the live suites run this
  # platform's archived test executables and bundle, load its live images, and
  # compile nothing. A selected suite that fails fails Test / PLATFORM.
  live-docker:
    name: E2E Docker tests
    if: inputs.live-suites
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/live-suite
        with:
          platform: ${{ inputs.platform }}
          suite: live-docker
          tests: ${{ inputs.tests }}
          bundle: ${{ inputs.bundle }}
          images: ${{ inputs.images }}
          images-commit: ${{ inputs.live-images-commit }}
          hcl-cases: ${{ join(fromJSON(inputs.hcl-cases).runners['live-docker'], ',') }}

  live-kind:
    name: E2E Kubernetes (kind) tests
    # Runs when the plan selected a kind case: the suite runs only those.
    if: inputs.live-suites && fromJSON(inputs.hcl-cases).runners['live-kind'][0] != null
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/live-suite
        with:
          platform: ${{ inputs.platform }}
          suite: live-kind
          tests: ${{ inputs.tests }}
          bundle: ${{ inputs.bundle }}
          images: ${{ inputs.images }}
          images-commit: ${{ inputs.live-images-commit }}
          hcl-cases: ${{ join(fromJSON(inputs.hcl-cases).runners['live-kind'], ',') }}

  # The selected HCL E2E cases that use NVIDIA hosted inference, from this
  # platform's test archive, bundle, and live images, like the live suites.
  hcl:
    name: E2E HCL ${{ matrix.case }}
    if: inputs.hcl && fromJSON(inputs.hcl-cases).runners.hosted[0] != null
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(inputs.hcl-cases).runners.hosted }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    env:
      NEMOCLAW_HCL_CASE: ${{ matrix.case }}
      NEMOCLAW_TEST_BUNDLE: ${{ github.workspace }}/dist/${{ inputs.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/containerd-store
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.tests }}-e2e
          path: .build/ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.bundle }}
          path: .build/ci
      - if: inputs.live-images-commit == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.images }}
          path: .build/ci
      - name: Load the images and bind the case to them
        env:
          COMMIT: ${{ inputs.live-images-commit }}
          PULL_TOKEN: ${{ github.token }}
        run: |
          tar -xf .build/ci/bundle.tar
          # Artifact transfer drops the executable bit.
          install -m 755 .build/ci/e2e .build/e2e
          # A case names its images nc-fabric@DIGEST, which Docker resolves only
          # in the repository that holds the image.
          if [[ -n $COMMIT ]]; then
            printf '%s\n' "$PULL_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            for name in openclaw hermes; do
              docker pull --quiet "ghcr.io/nvidia/nemoclaw/v1-ci:$name-$COMMIT-${TEST_PLATFORM#linux_}"
              docker tag "ghcr.io/nvidia/nemoclaw/v1-ci:$name-$COMMIT-${TEST_PLATFORM#linux_}" "nc-fabric:$name"
            done
          else
            zstd -d -c -q .build/ci/live-images.tar.zst | docker load
            for name in openclaw hermes; do docker tag "nc-live-images:$name" "nc-fabric:$name"; done
          fi
          id() { docker image inspect --format '{{.Id}}' "$1"; }
          # Pin this run's images and give it a fresh deployment identity; plan rejects an unbound image.
          sed -i -e "s#nc-fabric@sha256:0\{64\}#nc-fabric@$(id nc-fabric:openclaw)#" \
            -e "s#nc-fabric-hermes@sha256:0\{64\}#nc-fabric@$(id nc-fabric:hermes)#" \
            -e "s#^  uid: .*#  uid: $(cat /proc/sys/kernel/random/uuid)#" \
            "crates/nemoclaw-e2e/cases/$NEMOCLAW_HCL_CASE.yaml"
      - name: Run the scenario
        working-directory: crates/nemoclaw-e2e
        env:
          NEMOCLAW_HCL_RUN: ${{ runner.temp }}/hcl
          NVIDIA_INFERENCE_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: '"$GITHUB_WORKSPACE/.build/e2e" hcl_live::case --exact --ignored --nocapture'
      # A cancelled or timed-out job still runs this step; the test's process does not survive.
      - name: Destroy
        if: always()
        run: |
          state="$RUNNER_TEMP/hcl/deployment"
          [[ -d $state ]] || exit 0
          "$NEMOCLAW_TEST_BUNDLE/bin/nemoclaw" destroy --output json --progress off --state-dir "$state" \
            > "$RUNNER_TEMP/hcl/reports/destroy.json"
      # Reports hold outcomes only; requests, replies, state, and credentials stay on the runner.
      - name: Upload observations and cleanup receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hcl-e2e-${{ matrix.case }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hcl/reports/*.json
          if-no-files-found: ignore
          retention-days: 7

  # The selected HCL E2E cases on the NVIDIA GPU runner, which refuses pull
  # request jobs, or on Linux ARM64 on a DGX Station or Spark, from the same
  # test archive, bundle, and live images: built on Ubuntu 22.04, they run on
  # those runners too. Live / HCL selects the Station and Spark cases itself.
  gpu:
    name: E2E GPU
    if: inputs.hcl-gpu && (inputs.hcl-target != 'rtx-pro-6000' || fromJSON(inputs.hcl-cases).runners.gpu[0] != null)
    uses: ./.github/workflows/hcl-e2e.yml
    with:
      target: ${{ inputs.hcl-target }}
      hosted: ${{ inputs.hcl-hosted }}
      jobs: ${{ inputs.hcl-jobs }}
      cases: ${{ inputs.hcl-cases }}
      tests: ${{ inputs.tests }}
      bundle: ${{ inputs.bundle }}
      live-images: ${{ inputs.images }}
      live-images-commit: ${{ inputs.live-images-commit }}
    # The Ollama case reads NVIDIA_API_KEY.
    secrets: inherit
