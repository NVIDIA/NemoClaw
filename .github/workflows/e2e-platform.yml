# A Linux platform's E2E layer: the Docker and Kubernetes live suites and the
# HCL E2E cases, from the test archive and bundle that the platform's unit layer
# uploaded. Bundle platform calls it whenever the plan selects the live suites,
# including on pull requests; a failure fails the platform's Test check.
name: E2E platform
on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      platform:
        type: string
        required: true
      tests:
        description: The Bundle platform run's test inputs artifact.
        type: string
        required: true
      bundle:
        description: The Bundle platform run's bundle artifact.
        type: string
        required: true
      live-images-commit:
        description: A v1 commit whose pushed images the live suites pull instead of building, or empty to build them.
        type: string
        default: ""
      hcl:
        description: Also run the HCL E2E cases that use NVIDIA hosted inference; the caller passes the inference secret.
        type: boolean
        default: false
      gpu:
        description: Also run the HCL E2E cases on the NVIDIA GPU runner, which refuses pull request jobs; the caller passes the inference secret.
        type: boolean
        default: false
permissions:
  contents: read
  packages: read
defaults:
  run:
    shell: bash
env:
  TEST_PLATFORM: ${{ inputs.platform }}
  CARGO_INCREMENTAL: "0"
jobs:
  # The live suites' images, built once per platform alongside the build and
  # bundle jobs; both live jobs load them instead of building their own. When
  # no image input changed since a v1 commit that pushed them, the live jobs
  # pull that commit's images instead.
  live-images:
    name: Build images
    if: inputs.live-images-commit == ''
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.identity.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          platform: ${{ inputs.platform }}
          save-cache: "false"
      - uses: ./.github/actions/containerd-store
      - name: Build and save the live images
        run: cargo ci live-images
      - name: Identify live images artifact
        id: identity
        run: echo "artifact=live-images-${TEST_PLATFORM}-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload live images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.identity.outputs.artifact }}
          path: .build/ci/live-images.tar.zst
          include-hidden-files: true
          # Already zstd-compressed.
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  # Like the contract and integration shards, the live suites run this
  # platform's archived test executables and bundle, load its live images, and
  # compile nothing. No required check depends on them.
  live-docker:
    name: Docker tests
    needs: [live-images]
    # Runs after Build images, or in its place when the plan names a v1
    # commit's images.
    if: >-
      ${{ !cancelled() &&
      (needs.live-images.result == 'success' ||
      (needs.live-images.result == 'skipped' && inputs.live-images-commit != '')) }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/live-suite
        with:
          platform: ${{ inputs.platform }}
          suite: live-docker
          tests: ${{ inputs.tests }}
          bundle: ${{ inputs.bundle }}
          images: ${{ needs.live-images.outputs.artifact }}
          images-commit: ${{ inputs.live-images-commit }}

  live-kind:
    name: Kubernetes (kind) tests
    needs: [live-images]
    # Runs after Build images, or in its place when the plan names a v1
    # commit's images.
    if: >-
      ${{ !cancelled() &&
      (needs.live-images.result == 'success' ||
      (needs.live-images.result == 'skipped' && inputs.live-images-commit != '')) }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/live-suite
        with:
          platform: ${{ inputs.platform }}
          suite: live-kind
          tests: ${{ inputs.tests }}
          bundle: ${{ inputs.bundle }}
          images: ${{ needs.live-images.outputs.artifact }}
          images-commit: ${{ inputs.live-images-commit }}

  # The HCL E2E cases that use NVIDIA hosted inference, from this platform's
  # test archive, bundle, and live images, like the live suites.
  hcl:
    name: HCL ${{ matrix.case }}
    needs: [live-images]
    # Runs after Build images, or in its place when the plan names a v1
    # commit's images.
    if: >-
      ${{ !cancelled() && inputs.hcl &&
      (needs.live-images.result == 'success' ||
      (needs.live-images.result == 'skipped' && inputs.live-images-commit != '')) }}
    strategy:
      fail-fast: false
      matrix:
        case: [docker-openclaw-nvidia, docker-openclaw-v0-parity, docker-hermes-v0-parity]
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/hcl-case
        with:
          case: ${{ matrix.case }}
          api-key: ${{ secrets.NVIDIA_API_KEY }}
          platform: ${{ inputs.platform }}
          tests: ${{ inputs.tests }}
          bundle: ${{ inputs.bundle }}
          images: ${{ needs.live-images.outputs.artifact }}
          images-commit: ${{ inputs.live-images-commit }}

  # The HCL E2E cases on the NVIDIA GPU runner, which refuses pull request jobs.
  # Like Live / HCL, they run a candidate built against Ubuntu 22.04's older
  # glibc rather than this platform's artifacts, until the runner is known to
  # run executables built on Ubuntu 24.04.
  gpu-build:
    name: GPU build
    # The GPU runner and the inference secret exist only in this repository.
    if: inputs.gpu && github.repository == 'NVIDIA/NemoClaw'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/hcl-candidate
        with:
          artifact: hcl-candidate-${{ github.run_id }}-${{ github.run_attempt }}

  gpu:
    name: GPU ${{ matrix.case }}
    needs: [gpu-build]
    # Runs only after the candidate build.
    if: needs.gpu-build.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: docker-openclaw-vllm
            secret: ""
          - case: docker-openclaw-vllm-shared
            secret: ""
          - case: docker-openclaw-hermes-ollama
            secret: NVIDIA_API_KEY
    # This NVIDIA GPU runner is already used by the main E2E workflow.
    runs-on: linux-amd64-gpu-rtxpro6000-latest-1
    timeout-minutes: 60
    # These cases use fixed gateway ports; finish cleanup before another run starts.
    concurrency:
      group: live-hcl-${{ matrix.case }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/hcl-case
        with:
          case: ${{ matrix.case }}
          # Only the case that uses hosted inference receives the credential.
          api-key: ${{ secrets[matrix.secret] }}
          candidate: hcl-candidate-${{ github.run_id }}-${{ github.run_attempt }}
