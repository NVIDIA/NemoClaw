name: CI / Native Windows Installer Candidate v2

# External prerequisite for secure use: administrators must permanently disable
# legacy Actions workflow ID 350766812 before enabling this fresh v2 workflow.
# This caller contains no secret references; qualification secrets belong only
# to the protected environments owned by its same-commit reusable controller.
# Finished installer publication requires explicit dispatch.
# The pinned legacy payload is used only by isolated diagnostic/profiling lanes.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/actions/setup-reviewed-npm/**"
      - ".github/workflows/windows-native-installer-v2.yaml"
      - ".github/workflows/windows-native-installer-trusted.yaml"
      - "bin/nemoclaw.js"
      - "ci/reviewed-npm-audit.json"
      - "packaging/windows/**"
      - "scripts/checks/*windows-native*"
      - "scripts/install-windows-native.ps1"
      - "src/lib/onboard/runtime-provider/**"
      - "test/automation/pull-requests/windows-native-installer-workflow.test.ts"
      - "test/automation/pull-requests/windows-native-installer-bootstrap.test.ts"
      - "test/automation/pull-requests/windows-native-installer-review.test.ts"
      - "test/automation/pull-requests/windows-native-installer-process.test.ts"
      - "test/automation/pull-requests/windows-native-installer-process.support.ts"
      - "test/security/windows-native-*.test.ts"
      - "test/support/windows-native-*.ts"
      - "tools/windows-installer/**"
  workflow_dispatch:
    inputs:
      finished_windows_pr_number:
        description: Open internal PR number whose exact head will be qualified
        required: false
        default: ""
        type: string
      finished_windows_candidate_repository:
        description: Exact internal head repository reported by that PR
        required: false
        default: ""
        type: string
      finished_windows_candidate_sha:
        description: Exact 40-character PR head SHA to build
        required: false
        default: ""
        type: string
      finished_windows_base_sha:
        description: Exact 40-character PR base SHA observed before dispatch
        required: false
        default: ""
        type: string
      finished_windows_workflow_sha:
        description: Exact workflow SHA (main for qualification, PR head for credential-free build)
        required: false
        default: ""
        type: string
      finished_windows_agent:
        description: Include only this agent in the finished installer
        required: false
        default: openclaw
        type: choice
        options:
          - openclaw
          - hermes
      finished_windows_product_version:
        description: MSI product version for the finished preview (must be newer than the legacy preview)
        required: false
        default: "0.1.10"
        type: string
      finished_windows_validation_scope:
        description: Protected full lifecycle, credential-free OpenClaw startup, or candidate build only
        required: false
        default: full-acceptance
        type: choice
        options:
          - full-acceptance
          - startup-only
          - build-only
      build_windows_native_candidate:
        description: Build an exact internal PR installer without credentials or installation; provide an unqualified Hermes download
        required: false
        default: false
        type: boolean
      run_windows_native_installer:
        description: Build the selected finished native preview installer, then test it
        required: false
        default: false
        type: boolean
      windows_native_diagnostic_source_run_id:
        description: Replay the fixed built 0.1.3 installer (source run 34555046495; no runtime overlay)
        required: false
        default: ""
        type: string
      profile_native_windows:
        description: Diagnostic profiling of the exact installed f8 baseline only (no installer publication or comparison)
        required: false
        default: false
        type: boolean
      test_native_windows_runtime:
        description: Run native ownership and guardian controls with isolated MSI fixtures
        required: false
        default: false
        type: boolean
      probe_official_hermes_components:
        description: Run the selected official Hermes Windows probe without publishing an installer
        required: false
        default: false
        type: boolean
      record_hermes_startup:
        description: Record a bounded diagnostic trace during the Personal Hermes probe
        required: false
        default: false
        type: boolean
      capture_hermes_renderer_context:
        description: Capture bounded renderer context only in the failure debugger diagnostic
        required: false
        default: false
        type: boolean
      official_hermes_phase:
        description: Official Hermes probe phase (requires the probe input above)
        required: false
        default: components
        type: choice
        options:
          - components
          - python
          - runtime
          - npm-shims
          - export-controls
          - edge-host-prerequisite
          - personal-candidate
          - personal-browser-first
          - personal-cold-job
          - personal-renderer-wer
          - personal-postmortem
          - trace-analysis
          - bash-compat
          - host-prerequisites
          - system-drive
          - application

permissions:
  actions: read
  contents: read

concurrency:
  group: windows-native-installer-${{ github.ref }}${{ inputs.run_windows_native_installer && inputs.windows_native_diagnostic_source_run_id == '' && '-finished-package' || inputs.test_native_windows_runtime && '-runtime-controls' || inputs.profile_native_windows && '-profiling' || inputs.probe_official_hermes_components && inputs.official_hermes_phase == 'python' && '-hermes-python' || inputs.probe_official_hermes_components && inputs.official_hermes_phase == 'runtime' && '-hermes-runtime' || inputs.probe_official_hermes_components && inputs.official_hermes_phase == 'npm-shims' && '-hermes-npm-shims' || inputs.probe_official_hermes_components && inputs.official_hermes_phase == 'bash-compat' && '-bash-compat' || inputs.probe_official_hermes_components && inputs.official_hermes_phase == 'personal-browser-first' && '-hermes-personal-browser-first' || inputs.probe_official_hermes_components && inputs.official_hermes_phase == 'personal-postmortem' && '-hermes-personal-postmortem' || inputs.probe_official_hermes_components && inputs.official_hermes_phase == 'personal-renderer-wer' && '-hermes-personal-renderer-wer' || inputs.probe_official_hermes_components && inputs.official_hermes_phase == 'personal-cold-job' && '-hermes-personal-cold-job' || inputs.probe_official_hermes_components && inputs.official_hermes_phase == 'personal-candidate' && '-hermes-personal-candidate' || inputs.probe_official_hermes_components && inputs.official_hermes_phase == 'trace-analysis' && '-hermes-trace-analysis' || inputs.probe_official_hermes_components && inputs.official_hermes_phase == 'export-controls' && '-hermes-export-controls' || inputs.probe_official_hermes_components && inputs.official_hermes_phase == 'application' && '-compiled-application' || inputs.probe_official_hermes_components && inputs.official_hermes_phase == 'host-prerequisites' && '-host-prerequisites' || inputs.probe_official_hermes_components && inputs.official_hermes_phase == 'system-drive' && '-system-drive' || inputs.probe_official_hermes_components && '-hermes-components' || inputs.windows_native_diagnostic_source_run_id != '' && '-package-diagnostic' || '' }}
  # Preserve explicit evidence runs while replacing stale pull request controls.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-finished-request:
    name: Resolve exact credential-free or trusted finished-installer request
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      request_kind: ${{ steps.pull_request.outputs.request_kind || steps.candidate_build.outputs.request_kind || steps.authorize.outputs.request_kind || steps.diagnostic.outputs.request_kind }}
      candidate_repository: ${{ steps.pull_request.outputs.candidate_repository || steps.candidate_build.outputs.candidate_repository || steps.authorize.outputs.candidate_repository || steps.diagnostic.outputs.candidate_repository }}
      candidate_sha: ${{ steps.pull_request.outputs.candidate_sha || steps.candidate_build.outputs.candidate_sha || steps.authorize.outputs.candidate_sha || steps.diagnostic.outputs.candidate_sha }}
      base_sha: ${{ steps.pull_request.outputs.base_sha || steps.candidate_build.outputs.base_sha || steps.authorize.outputs.base_sha || steps.diagnostic.outputs.base_sha }}
      pr_number: ${{ steps.pull_request.outputs.pr_number || steps.candidate_build.outputs.pr_number || steps.authorize.outputs.pr_number }}
      workflow_sha: ${{ steps.pull_request.outputs.workflow_sha || steps.candidate_build.outputs.workflow_sha || steps.authorize.outputs.workflow_sha || steps.diagnostic.outputs.workflow_sha }}
      agent: ${{ steps.pull_request.outputs.agent || steps.candidate_build.outputs.agent || steps.authorize.outputs.agent || steps.diagnostic.outputs.agent }}
      product_version: ${{ steps.pull_request.outputs.product_version || steps.candidate_build.outputs.product_version || steps.authorize.outputs.product_version || steps.diagnostic.outputs.product_version }}
      validation_scope: ${{ steps.pull_request.outputs.validation_scope || steps.candidate_build.outputs.validation_scope || steps.authorize.outputs.validation_scope || steps.diagnostic.outputs.validation_scope }}
      build_allowed: ${{ steps.pull_request.outputs.build_allowed || steps.candidate_build.outputs.build_allowed || steps.authorize.outputs.build_allowed || steps.diagnostic.outputs.build_allowed }}
      trusted_main: ${{ steps.pull_request.outputs.trusted_main || steps.candidate_build.outputs.trusted_main || steps.authorize.outputs.trusted_main || steps.diagnostic.outputs.trusted_main }}
      exact_workflow: ${{ steps.pull_request.outputs.exact_workflow || steps.candidate_build.outputs.exact_workflow || steps.authorize.outputs.exact_workflow || steps.diagnostic.outputs.exact_workflow }}
      exact_pr: ${{ steps.pull_request.outputs.exact_pr || steps.candidate_build.outputs.exact_pr || steps.authorize.outputs.exact_pr || steps.diagnostic.outputs.exact_pr }}
      credential_authorized: ${{ steps.pull_request.outputs.credential_authorized || steps.candidate_build.outputs.credential_authorized || steps.authorize.outputs.credential_authorized || steps.diagnostic.outputs.credential_authorized }}
    steps:
      - name: Admit the exact pull request head without credentials
        id: pull_request
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ && "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          {
            echo 'request_kind=pull-request'
            echo "candidate_repository=$CANDIDATE_REPOSITORY"
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "base_sha=$BASE_SHA"
            echo "pr_number=$PR_NUMBER"
            echo "workflow_sha=$WORKFLOW_SHA"
            echo 'agent=openclaw'
            echo 'product_version=0.1.10'
            echo 'validation_scope=startup-only'
            echo 'build_allowed=true'
            echo 'trusted_main=false'
            echo 'exact_workflow=false'
            echo 'exact_pr=true'
            echo 'credential_authorized=false'
          } >> "$GITHUB_OUTPUT"
      - name: Admit an exact credential-free candidate build
        id: candidate_build
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_windows_native_candidate }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.finished_windows_pr_number }}
          CANDIDATE_REPOSITORY: ${{ inputs.finished_windows_candidate_repository }}
          CANDIDATE_SHA: ${{ inputs.finished_windows_candidate_sha }}
          BASE_SHA: ${{ inputs.finished_windows_base_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.finished_windows_workflow_sha }}
          SELECTED_AGENT: ${{ inputs.finished_windows_agent }}
          PRODUCT_VERSION: ${{ inputs.finished_windows_product_version }}
          VALIDATION_SCOPE: ${{ inputs.finished_windows_validation_scope }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EVENT_REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          PROTECTED_REQUEST: ${{ inputs.run_windows_native_installer }}
          OTHER_COMPONENTS: ${{ inputs.probe_official_hermes_components }}
          OTHER_PROFILE: ${{ inputs.profile_native_windows }}
          OTHER_RUNTIME: ${{ inputs.test_native_windows_runtime }}
          DIAGNOSTIC_SOURCE_RUN: ${{ inputs.windows_native_diagnostic_source_run_id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'NVIDIA/NemoClaw' && "$CANDIDATE_REPOSITORY" == "$GITHUB_REPOSITORY" ]]
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ && "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_WORKFLOW_SHA" == "$CANDIDATE_SHA" && "$EVENT_SHA" == "$CANDIDATE_SHA" && "$EVENT_WORKFLOW_SHA" == "$CANDIDATE_SHA" ]]
          [[ "$SELECTED_AGENT" =~ ^(openclaw|hermes)$ && "$VALIDATION_SCOPE" == 'build-only' ]]
          [[ "$PRODUCT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$PROTECTED_REQUEST" == 'false' && "$OTHER_COMPONENTS" == 'false' && "$OTHER_PROFILE" == 'false' && "$OTHER_RUNTIME" == 'false' && -z "$DIAGNOSTIC_SOURCE_RUN" ]]
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          [[ "$(jq -r '.number' <<<"$pr")" == "$PR_NUMBER" && "$(jq -r '.state' <<<"$pr")" == 'open' ]]
          [[ "$(jq -r '.base.repo.full_name' <<<"$pr")" == "$GITHUB_REPOSITORY" && "$(jq -r '.base.ref' <<<"$pr")" == 'main' ]]
          [[ "$(jq -r '.base.sha' <<<"$pr")" == "$BASE_SHA" ]]
          [[ "$(jq -r '.head.repo.full_name' <<<"$pr")" == "$CANDIDATE_REPOSITORY" ]]
          [[ "$(jq -r '.head.repo.owner.login' <<<"$pr")" == 'NVIDIA' && "$(jq -r '.head.repo.owner.type' <<<"$pr")" == 'Organization' ]]
          [[ "$(jq -r '.head.sha' <<<"$pr")" == "$CANDIDATE_SHA" ]]
          [[ "$EVENT_REF" == "refs/heads/$(jq -r '.head.ref' <<<"$pr")" && "$EVENT_REF" != 'refs/heads/main' ]]
          for principal in "$ACTOR" "$TRIGGERING_ACTOR"; do
            permission="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$principal/permission" --jq '.permission')"
            [[ "$permission" =~ ^(admin|maintain|write)$ ]]
          done
          current="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          for field in '.number' '.state' '.base.repo.full_name' '.base.ref' '.base.sha' '.head.repo.full_name' '.head.repo.owner.login' '.head.repo.owner.type' '.head.ref' '.head.sha'; do
            [[ "$(jq -r "$field" <<<"$current")" == "$(jq -r "$field" <<<"$pr")" ]]
          done
          {
            echo 'request_kind=candidate-build'
            echo "candidate_repository=$CANDIDATE_REPOSITORY"
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "base_sha=$BASE_SHA"
            echo "pr_number=$PR_NUMBER"
            echo "workflow_sha=$EXPECTED_WORKFLOW_SHA"
            echo "agent=$SELECTED_AGENT"
            echo "product_version=$PRODUCT_VERSION"
            echo 'validation_scope=build-only'
            echo 'build_allowed=true'
            echo 'trusted_main=false'
            echo 'exact_workflow=false'
            echo 'exact_pr=true'
            echo 'credential_authorized=false'
          } >> "$GITHUB_OUTPUT"
      - name: Resolve a credential-free diagnostic dispatch
        id: diagnostic
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.build_windows_native_candidate && !(inputs.run_windows_native_installer && inputs.windows_native_diagnostic_source_run_id == '') }}
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          SELECTED_AGENT: ${{ inputs.finished_windows_agent || 'openclaw' }}
          PRODUCT_VERSION: ${{ inputs.finished_windows_product_version || '0.1.10' }}
          VALIDATION_SCOPE: ${{ inputs.finished_windows_validation_scope || 'startup-only' }}
        run: |
          set -euo pipefail
          {
            echo 'request_kind=diagnostic'
            echo "candidate_repository=$GITHUB_REPOSITORY"
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "base_sha=$CANDIDATE_SHA"
            echo "workflow_sha=$WORKFLOW_SHA"
            echo "agent=$SELECTED_AGENT"
            echo "product_version=$PRODUCT_VERSION"
            echo "validation_scope=$VALIDATION_SCOPE"
            echo 'build_allowed=false'
            echo 'trusted_main=false'
            echo 'exact_workflow=false'
            echo 'exact_pr=false'
            echo 'credential_authorized=false'
          } >> "$GITHUB_OUTPUT"
      - name: Authorize exact internal PR from the exact main controller
        id: authorize
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.build_windows_native_candidate && inputs.run_windows_native_installer && inputs.windows_native_diagnostic_source_run_id == '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.finished_windows_pr_number }}
          CANDIDATE_REPOSITORY: ${{ inputs.finished_windows_candidate_repository }}
          CANDIDATE_SHA: ${{ inputs.finished_windows_candidate_sha }}
          BASE_SHA: ${{ inputs.finished_windows_base_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.finished_windows_workflow_sha }}
          SELECTED_AGENT: ${{ inputs.finished_windows_agent }}
          PRODUCT_VERSION: ${{ inputs.finished_windows_product_version }}
          VALIDATION_SCOPE: ${{ inputs.finished_windows_validation_scope }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EVENT_REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'NVIDIA/NemoClaw' && "$EVENT_REF" == 'refs/heads/main' ]]
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_REPOSITORY" == 'NVIDIA/NemoClaw' ]]
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ && "$BASE_SHA" =~ ^[a-f0-9]{40}$ && "$EXPECTED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EVENT_SHA" == "$EXPECTED_WORKFLOW_SHA" && "$EVENT_WORKFLOW_SHA" == "$EXPECTED_WORKFLOW_SHA" ]]
          [[ "$BASE_SHA" == "$EXPECTED_WORKFLOW_SHA" ]]
          [[ "$SELECTED_AGENT" =~ ^(openclaw|hermes)$ && "$VALIDATION_SCOPE" == 'full-acceptance' ]]
          [[ "$PRODUCT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          [[ "$(jq -r '.state' <<<"$pr")" == 'open' ]]
          [[ "$(jq -r '.base.repo.full_name' <<<"$pr")" == "$GITHUB_REPOSITORY" ]]
          [[ "$(jq -r '.base.ref' <<<"$pr")" == 'main' ]]
          [[ "$(jq -r '.base.sha' <<<"$pr")" == "$BASE_SHA" ]]
          [[ "$(jq -r '.head.repo.full_name' <<<"$pr")" == "$CANDIDATE_REPOSITORY" ]]
          [[ "$(jq -r '.head.repo.owner.login' <<<"$pr")" == 'NVIDIA' ]]
          [[ "$(jq -r '.head.repo.owner.type' <<<"$pr")" == 'Organization' ]]
          [[ "$(jq -r '.head.sha' <<<"$pr")" == "$CANDIDATE_SHA" ]]
          comparison="$(gh api "repos/$GITHUB_REPOSITORY/compare/$EXPECTED_WORKFLOW_SHA...$CANDIDATE_SHA")"
          [[ "$(jq -r '.merge_base_commit.sha' <<<"$comparison")" == "$EXPECTED_WORKFLOW_SHA" ]]
          [[ "$(jq -r '.behind_by' <<<"$comparison")" == '0' ]]
          for principal in "$ACTOR" "$TRIGGERING_ACTOR"; do
            permission="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$principal/permission" --jq '.permission')"
            [[ "$permission" =~ ^(admin|maintain|write)$ ]]
          done
          {
            echo 'request_kind=trusted-manual'
            echo "candidate_repository=$CANDIDATE_REPOSITORY"
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "base_sha=$BASE_SHA"
            echo "pr_number=$PR_NUMBER"
            echo "workflow_sha=$EXPECTED_WORKFLOW_SHA"
            echo "agent=$SELECTED_AGENT"
            echo "product_version=$PRODUCT_VERSION"
            echo "validation_scope=$VALIDATION_SCOPE"
            echo 'build_allowed=true'
            echo 'trusted_main=true'
            echo 'exact_workflow=true'
            echo 'exact_pr=true'
            echo 'credential_authorized=true'
          } >> "$GITHUB_OUTPUT"

  windows-personal-trace-analysis:
    name: Recorded Hermes Personal trace analysis (no application execution)
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.run_windows_native_installer && !inputs.profile_native_windows && !inputs.test_native_windows_runtime && inputs.windows_native_diagnostic_source_run_id == '' && inputs.probe_official_hermes_components && inputs.official_hermes_phase == 'trace-analysis' }}
    runs-on: windows-11-vs2026-arm
    # Fixed recorded input; eight bounded analysis commands plus intake/upload.
    timeout-minutes: 25
    steps:
      - name: Check out the trace analysis controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify and analyze the exact recorded 51e3 light trace
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & "$env:GITHUB_WORKSPACE\packaging\windows\performance\analyze-personal-wpr.ps1" `
            -ArtifactDirectory "$env:RUNNER_TEMP\personal-trace-analysis"
      - name: Preserve bounded analysis reports and original small trace metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-hermes-personal-trace-analysis-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/personal-trace-analysis/
            !${{ runner.temp }}/personal-trace-analysis/recorded-trace.zip
            !${{ runner.temp }}/personal-trace-analysis/input/**/*.etl
          if-no-files-found: error
          retention-days: 14

  windows-finished-installer:
    name: Finished Windows ${{ needs.windows-finished-request.outputs.agent }} candidate installer (ARM64)
    needs:
      [windows-finished-request, windows-compiled-application, windows-bash-compatibility-reuse]
    if: ${{ always() && !cancelled() && needs.windows-finished-request.result == 'success' && needs.windows-finished-request.outputs.build_allowed == 'true' && needs.windows-compiled-application.result == 'success' && (needs.windows-finished-request.outputs.agent != 'hermes' || needs.windows-bash-compatibility-reuse.result == 'success') }}
    runs-on: windows-11-vs2026-arm
    timeout-minutes: ${{ needs.windows-finished-request.outputs.agent == 'hermes' && 180 || 120 }}
    outputs:
      installer_cache_key: ${{ steps.product_manifest.outputs.cache_key }}
      installer_manifest_sha256: ${{ steps.product_manifest.outputs.manifest_sha256 }}
    env:
      CANDIDATE_SHA: ${{ needs.windows-finished-request.outputs.candidate_sha }}
      SELECTED_AGENT: ${{ needs.windows-finished-request.outputs.agent }}
      PRODUCT_VERSION: ${{ needs.windows-finished-request.outputs.product_version }}
    steps:
      - name: Check out the finished Windows application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.windows-finished-request.outputs.candidate_repository }}
          ref: ${{ needs.windows-finished-request.outputs.candidate_sha }}
          path: candidate
          persist-credentials: false
      - name: Validate the dedicated finished preview request
        shell: pwsh
        env:
          OTHER_COMPONENTS: ${{ inputs.probe_official_hermes_components }}
          OTHER_PROFILE: ${{ inputs.profile_native_windows }}
          OTHER_RUNTIME: ${{ inputs.test_native_windows_runtime }}
        run: |
          $parsedVersion = $null
          if ($env:PRODUCT_VERSION -cnotmatch '^[0-9]+\.[0-9]+\.[0-9]+$' -or -not [version]::TryParse($env:PRODUCT_VERSION, [ref]$parsedVersion) -or $parsedVersion -le [version]'0.1.4') {
            throw 'The finished preview needs an explicit MSI version newer than migration baseline 0.1.4.'
          }
          if (@($env:OTHER_COMPONENTS, $env:OTHER_PROFILE, $env:OTHER_RUNTIME) -contains 'true') {
            throw 'The finished preview requires its own explicit dispatch.'
          }
      - name: Restore exact compiled units from the same-run cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/finished-windows-application-transfer
          key: ${{ needs.windows-compiled-application.outputs.application_cache_key }}
