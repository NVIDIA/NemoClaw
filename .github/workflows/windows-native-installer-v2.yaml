  official-hermes-edge-host-prerequisite:
    name: Native ARM64 Microsoft Edge prerequisite
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.run_windows_native_installer && inputs.probe_official_hermes_components && inputs.official_hermes_phase == 'edge-host-prerequisite' && !inputs.test_native_windows_runtime && !inputs.profile_native_windows }}
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the Windows Edge prerequisite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the installed native Edge trust owner
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.95.0-aarch64-pc-windows-msvc
          target: aarch64-pc-windows-msvc
          cache: false
          rustflags: ""
      - name: Verify standard signed native ARM64 Microsoft Edge
        shell: pwsh
        run: |
          $output = "$env:RUNNER_TEMP\native-edge-prerequisite"
          $null = New-Item -ItemType Directory -Path $output
          rustup run 1.95.0-aarch64-pc-windows-msvc cargo rustc --locked --release `
            --target aarch64-pc-windows-msvc --features immutable-runtime `
            --manifest-path "$env:GITHUB_WORKSPACE\packaging\windows\launcher\Cargo.toml" `
            --target-dir "$output\target" -- -C target-feature=+crt-static
          if ($LASTEXITCODE -ne 0) { throw 'The native Edge trust owner did not compile.' }
          $install = "$output\install"
          $null = New-Item -ItemType Directory -Path "$install\bin"
          Copy-Item -LiteralPath "$output\target\aarch64-pc-windows-msvc\release\NemoClaw.exe" -Destination "$install\bin\NemoClaw.exe"
          $env:NEMOCLAW_NATIVE_INSTALL_ROOT = $install
          node --experimental-strip-types --input-type=module -e @'
          import assert from "node:assert/strict";
          import { spawnSync } from "node:child_process";
          import fs from "node:fs";
          import path from "node:path";
          import { detectNativeEdge } from "./packaging/windows/runtime/native-edge-browser.mts";
          if (process.platform !== "win32" || process.arch !== "arm64") throw new Error("Expected native Windows ARM64 Node.");
          try {
            const launcher = path.join(process.env.NEMOCLAW_NATIVE_INSTALL_ROOT, "bin", "NemoClaw.exe");
            const denial = spawnSync(launcher, ["--edge-trust", launcher], { encoding: "utf8", windowsHide: true });
            const denialReceipt = { schemaVersion: 1, classification: "native-edge-unsigned-denial", exitCode: denial.status, stdout: denial.stdout.trim(), stderr: denial.stderr.trim() };
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, "native-edge-prerequisite", "unsigned-denial.json"), JSON.stringify(denialReceipt, null, 2) + "\n", { flag: "wx" });
            assert.equal(denial.error, undefined);
            assert.equal(denial.signal, null);
            assert.equal(denial.status, 2);
            assert.equal(denial.stdout, "");
            assert.match(denial.stderr, /^Microsoft Edge native identity verification failed \(0x[0-9a-f]{8}\)\.\r?\n$/u);
            const generationResult = spawnSync(launcher, ["--edge-process-identity", String(process.pid)], { encoding: "utf8", windowsHide: true });
            assert.equal(generationResult.error, undefined);
            assert.equal(generationResult.signal, null);
            assert.equal(generationResult.status, 0);
            assert.equal(generationResult.stderr, "");
            const generation = JSON.parse(generationResult.stdout);
            assert.equal(generation.pid, process.pid);
            assert.equal(generation.path.toLowerCase(), process.execPath.toLowerCase());
            assert.match(generation.creationFiletime, /^[0-9]{15,20}$/u);
            const identity = await detectNativeEdge();
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, "native-edge-prerequisite", "edge-identity.json"), JSON.stringify({ ...identity, executed: false }, null, 2) + "\n", { flag: "wx" });
          } catch (error) {
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, "native-edge-prerequisite", "edge-failure.json"), JSON.stringify({ schemaVersion: 1, classificationCategory: "native-edge-prerequisite", message: error instanceof Error ? error.message : "Edge validation failed" }, null, 2) + "\n", { flag: "wx" });
            throw error;
          }
          '@
      - name: Preserve Microsoft Edge identity evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-edge-prerequisite-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-edge-prerequisite/
          if-no-files-found: error
          retention-days: 14

  windows-bash-compatibility-reuse:
    # Keep the job/output identity used by the same-run installer transfer.
    name: Build and qualify current native Bash inputs
    needs: windows-finished-request
    if: ${{ needs.windows-finished-request.outputs.build_allowed == 'true' && needs.windows-finished-request.outputs.agent == 'hermes' }}
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      compatibility_cache_key: ${{ steps.compatibility_manifest.outputs.cache_key }}
      compatibility_manifest_sha256: ${{ steps.compatibility_manifest.outputs.manifest_sha256 }}
    steps:
      - name: Check out current Bash qualification inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.windows-finished-request.outputs.candidate_repository }}
          ref: ${{ needs.windows-finished-request.outputs.candidate_sha }}
          path: current
          persist-credentials: false
      - name: Verify exact native producer source
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ needs.windows-finished-request.outputs.candidate_sha }}
        run: |
          $revision = (& git -C current rev-parse HEAD | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $revision -cne $env:CANDIDATE_SHA) { throw 'The native producer checkout differs from the admitted candidate.' }
      - name: Prepare pinned Rust for the existing metadata helper
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.95.0
          target: aarch64-pc-windows-msvc
          cache: false
      - name: Build the existing fixed-purpose system-drive metadata helper
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ needs.windows-finished-request.outputs.candidate_sha }}
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          & current/packaging/windows/host-preparation/build-helper.ps1 -OutputDirectory "$env:RUNNER_TEMP\finished-bash-helper"
      - name: Prepare upstream-pinned Rust for MXC token inspection
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.93.0
          target: aarch64-pc-windows-msvc
          cache: false
          override: false
      - name: Build and qualify exact current native compatibility
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ needs.windows-finished-request.outputs.candidate_sha }}
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          & current/packaging/windows/mxc-bash/run-bash-compat.ps1 `
            -SourceRoot "$env:GITHUB_WORKSPACE\current" `
            -ArtifactDirectory "$env:RUNNER_TEMP\finished-bash-evidence" `
            -HelperDirectory "$env:RUNNER_TEMP\finished-bash-helper"
      - name: Seal same-run exact-input Bash evidence
        id: compatibility_manifest
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ needs.windows-finished-request.outputs.candidate_sha }}
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'finished-bash-evidence'
          $proof = Get-Content -LiteralPath (Join-Path $evidence 'result.json') -Raw | ConvertFrom-Json
          $runner = Get-Content -LiteralPath (Join-Path $evidence 'runner-result.json') -Raw | ConvertFrom-Json
          if ($proof.schemaVersion -ne 2 -or $proof.classification -cne 'small-msys-native-basecontainer-compatibility-proof' -or
              $proof.sourceRevision -cne $env:CANDIDATE_SHA -or $proof.passed -cne $true -or $proof.normalCleanup -cne $true -or
              $runner.sourceRevision -cne $env:CANDIDATE_SHA -or $runner.status -cne 'pass' -or
              $runner.cleanup.workRootRemoved -cne $true -or $runner.cleanup.workRetainedForUnconfirmedExecutor -cne $false) {
            throw 'The current native Bash execution or cleanup did not pass.'
          }
          $transfer = Join-Path $env:RUNNER_TEMP 'finished-windows-bash-transfer'
          if (Test-Path -LiteralPath $transfer) { throw 'The native Bash transfer must be fresh.' }
          $destination = Join-Path $transfer 'native-proof/bash-compat-evidence'
          [void][IO.Directory]::CreateDirectory($destination)
          # Preserve the producer's evidence layout, excluding only the same
          # build/download trees omitted by the standalone Bash evidence lane.
          $items = @(Get-ChildItem -LiteralPath $evidence -Recurse -Force)
          if (@($items | Where-Object { $_.Attributes.HasFlag([IO.FileAttributes]::ReparsePoint) }).Count -ne 0) {
            throw 'Native Bash evidence contains a reparse point.'
          }
          foreach ($file in $items | Where-Object { $_ -is [IO.FileInfo] }) {
            $relative = [IO.Path]::GetRelativePath($evidence, $file.FullName).Replace('\', '/')
            if ($relative -match '^(?:downloads|build|compatibility-build/build|mxc-token-inspection-build/build)/' -or
                $relative -eq 'node/node.exe' -or $relative -match '^node/[^/]+\.zip$') { continue }
            $target = Join-Path $destination $relative
            [void][IO.Directory]::CreateDirectory((Split-Path -Parent $target))
            Copy-Item -LiteralPath $file.FullName -Destination $target
          }
          $manifest = @(& current/scripts/checks/windows-native-transfer.ps1 -Mode Create -Root $transfer `
            -Kind bash-compatibility -SourceRevision $env:CANDIDATE_SHA -Agent hermes `
            -RunId $env:GITHUB_RUN_ID -RunAttempt $env:GITHUB_RUN_ATTEMPT)
          if ($manifest.Count -ne 1 -or [string]$manifest[0] -cnotmatch '^[a-f0-9]{64}$') { throw 'The Bash transfer manifest failed.' }
          "manifest_sha256=$([string]$manifest[0])" >> $env:GITHUB_OUTPUT
          "cache_key=windows-finished-bash-v2-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:CANDIDATE_SHA-hermes" >> $env:GITHUB_OUTPUT
      - name: Save executable-bearing compatibility inputs only in the same-run cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/finished-windows-bash-transfer
          key: ${{ steps.compatibility_manifest.outputs.cache_key }}
          enableCrossOsArchive: true
      - name: Preserve current native Bash diagnostic records without executables
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: finished-native-bash-records-${{ needs.windows-finished-request.outputs.candidate_sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/finished-bash-evidence/**/*.json
            ${{ runner.temp }}/finished-bash-evidence/**/*.log
            !${{ runner.temp }}/finished-bash-evidence/downloads/
            !${{ runner.temp }}/finished-bash-evidence/build/
            !${{ runner.temp }}/finished-bash-evidence/compatibility-build/build/
            !${{ runner.temp }}/finished-bash-evidence/mxc-token-inspection-build/build/
          if-no-files-found: warn
          retention-days: 7

  windows-bash-compatibility:
