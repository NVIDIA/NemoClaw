  official-hermes-personal-candidate:
    name: Canonical Hermes candidate Personal MXC feasibility (Windows ARM64)
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.run_windows_native_installer && inputs.probe_official_hermes_components && (inputs.official_hermes_phase == 'personal-browser-first' || inputs.official_hermes_phase == 'personal-candidate' || inputs.official_hermes_phase == 'personal-cold-job' || inputs.official_hermes_phase == 'personal-renderer-wer' || inputs.official_hermes_phase == 'personal-postmortem') && !inputs.test_native_windows_runtime && !inputs.profile_native_windows }}
    runs-on: windows-11-vs2026-arm
    # Ordinary qualification derives the current complete base with same-run native proof.
    # Explicit historical diagnostic phases retain their immutable replay contract.
    # The contained component/startup deadlines remain unchanged.
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the Windows feasibility controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare pinned native Rust for the admitted metadata helper
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.95.0
          target: aarch64-pc-windows-msvc
          cache: false
      - name: Verify pinned interpreters and archive admission controls
        shell: pwsh
        run: |
          $bootstrap = "$env:RUNNER_TEMP\personal-bootstrap"
          & packaging/windows/hermes/test-official-runtime-export.ps1 -ArtifactDirectory $bootstrap
          $record = Get-Content -LiteralPath "$bootstrap\export-controls.json" -Raw | ConvertFrom-Json
          $env:NEMOCLAW_TEST_PYTHON = $record.pythonPath
          $env:NEMOCLAW_PERSONAL_CONTROL_EVIDENCE = "$env:RUNNER_TEMP\personal-controls"
          $null = New-Item -ItemType Directory -Path $env:NEMOCLAW_PERSONAL_CONTROL_EVIDENCE
          & "$bootstrap\tools\node\node-v22.23.2-win-arm64\node.exe" --experimental-strip-types --no-warnings --test packaging/windows/hermes/personal-candidate.test.mts
          if ($LASTEXITCODE -ne 0) { throw 'The candidate admission/Personal controls failed.' }
      - name: Build the fixed-purpose system-drive metadata helper
        shell: pwsh
        run: |
          & packaging/windows/host-preparation/build-helper.ps1 -OutputDirectory "$env:RUNNER_TEMP\personal-helper"
      - name: Prepare pinned native Rust for Personal compatibility
        if: ${{ inputs.official_hermes_phase == 'personal-candidate' }}
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.93.0
          target: aarch64-pc-windows-msvc
          override: false
          cache: false
      - name: Build and qualify current Personal native inputs
        if: ${{ inputs.official_hermes_phase == 'personal-candidate' }}
        shell: pwsh
        run: |
          $head = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA) { throw 'Personal producer checkout differs from its source.' }
          & packaging/windows/mxc-bash/run-bash-compat.ps1 -SourceRoot $env:GITHUB_WORKSPACE `
            -ArtifactDirectory "$env:RUNNER_TEMP\personal-native-inputs" -HelperDirectory "$env:RUNNER_TEMP\personal-helper"
      - name: Prepare the complete candidate and test canonical Personal components
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $native = @{}
          if ("${{ inputs.official_hermes_phase }}" -ceq 'personal-candidate') {
            $rustc = & rustup which --toolchain 1.95.0 rustc
            if ($LASTEXITCODE -ne 0) { throw 'The pinned ConPTY Rust compiler is unavailable.' }
            $native = @{ NativeCompatibilityDirectory = "$env:RUNNER_TEMP\personal-native-inputs"; RustBinDirectory = (Split-Path -Parent $rustc) }
          }
          & packaging/windows/hermes/probe-personal-candidate.ps1 `
            -ArtifactDirectory "$env:RUNNER_TEMP\official-hermes-personal" `
            -BootstrapDirectory "$env:RUNNER_TEMP\personal-bootstrap" `
            -HelperDirectory "$env:RUNNER_TEMP\personal-helper" `
            -RecordStartup:("${{ inputs.record_hermes_startup }}" -ceq 'true') `
            -CaptureRendererContext:("${{ inputs.capture_hermes_renderer_context }}" -ceq 'true') `
            -ColdJobProbe:("${{ inputs.official_hermes_phase }}" -ceq 'personal-cold-job') `
            -RendererWer:("${{ inputs.official_hermes_phase }}" -ceq 'personal-renderer-wer') `
            -RendererPostmortem:("${{ inputs.official_hermes_phase }}" -ceq 'personal-postmortem') `
            -BrowserFirst:("${{ inputs.official_hermes_phase }}" -ceq 'personal-browser-first') @native
      - name: Preserve current native Personal runtime inputs
        if: ${{ success() && inputs.official_hermes_phase == 'personal-candidate' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-hermes-native-personal-runtime-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/official-hermes-personal/official-hermes-runtime-candidate/
            ${{ runner.temp }}/official-hermes-personal/official-hermes-runtime-build/official-runtime-build.json
            ${{ runner.temp }}/official-hermes-personal/official-hermes-runtime-build/native-adaptation.json
            ${{ runner.temp }}/official-hermes-personal/official-hermes-runtime-phase.json
            ${{ runner.temp }}/official-hermes-personal/personal-phase.json
            ${{ runner.temp }}/official-hermes-personal/personal-mxc/
            ${{ runner.temp }}/personal-native-inputs/
            !${{ runner.temp }}/personal-native-inputs/downloads/
            !${{ runner.temp }}/personal-native-inputs/build/
            !${{ runner.temp }}/personal-native-inputs/compatibility-build/build/
            !${{ runner.temp }}/personal-native-inputs/mxc-token-inspection-build/build/
            !${{ runner.temp }}/personal-native-inputs/node/node.exe
            !${{ runner.temp }}/personal-native-inputs/node/*.zip
          if-no-files-found: error
          retention-days: 7
      - name: Preserve small exact-candidate feasibility evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-hermes-personal-feasibility-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/official-hermes-personal/
            !${{ runner.temp }}/official-hermes-personal/downloads/
            !${{ runner.temp }}/official-hermes-personal/primary-wpr/
            !${{ runner.temp }}/official-hermes-personal/official-hermes-runtime-build/pywinpty/tools/
            !${{ runner.temp }}/official-hermes-personal/official-hermes-runtime-build/pywinpty/downloads/
            !${{ runner.temp }}/official-hermes-personal/official-hermes-runtime-build/pywinpty/source/
            !${{ runner.temp }}/official-hermes-personal/official-hermes-runtime-build/pywinpty/cargo-home/
            !${{ runner.temp }}/official-hermes-personal/official-hermes-runtime-build/pywinpty/build-env/
            !${{ runner.temp }}/official-hermes-personal/official-hermes-runtime-build/pywinpty/target/
            !${{ runner.temp }}/official-hermes-personal/official-hermes-runtime-build/pywinpty/uv-cache/
            !${{ runner.temp }}/official-hermes-personal/official-hermes-runtime-build/pywinpty/npm-cache/
            !${{ runner.temp }}/official-hermes-personal/official-hermes-runtime-candidate/*.tar.gz
            !${{ runner.temp }}/official-hermes-personal/official-hermes-runtime-candidate/*.tar.gz.partial
            ${{ runner.temp }}/personal-bootstrap/export-controls.json
            ${{ runner.temp }}/personal-bootstrap/results/
            ${{ runner.temp }}/personal-controls/
            ${{ runner.temp }}/personal-helper/build-receipt.json
            ${{ runner.temp }}/personal-helper/build.log
            ${{ runner.temp }}/personal-native-inputs/**/*.json
            ${{ runner.temp }}/personal-native-inputs/**/*.log
            !${{ runner.temp }}/personal-native-inputs/downloads/
            !${{ runner.temp }}/personal-native-inputs/build/
            !${{ runner.temp }}/personal-native-inputs/compatibility-build/build/
            !${{ runner.temp }}/personal-native-inputs/mxc-token-inspection-build/build/
          if-no-files-found: error
          retention-days: 7

      - name: Retain bounded ordinary Personal WPR evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-hermes-personal-trace-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/official-hermes-personal/primary-wpr/
          if-no-files-found: warn
          retention-days: 14

  official-hermes-components:
    name: Official Hermes ${{ inputs.official_hermes_phase || 'components' }} probe (Windows ARM64)
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.run_windows_native_installer && inputs.probe_official_hermes_components && inputs.official_hermes_phase != 'host-prerequisites' && inputs.official_hermes_phase != 'application' && inputs.official_hermes_phase != 'system-drive' && inputs.official_hermes_phase != 'npm-shims' && inputs.official_hermes_phase != 'export-controls' && inputs.official_hermes_phase != 'edge-host-prerequisite' && inputs.official_hermes_phase != 'personal-browser-first' && inputs.official_hermes_phase != 'personal-candidate' && inputs.official_hermes_phase != 'personal-cold-job' && inputs.official_hermes_phase != 'personal-renderer-wer' && inputs.official_hermes_phase != 'personal-postmortem' && inputs.official_hermes_phase != 'trace-analysis' && inputs.official_hermes_phase != 'bash-compat' && !inputs.test_native_windows_runtime && !inputs.profile_native_windows }}
    runs-on: windows-11-vs2026-arm
    timeout-minutes: ${{ inputs.official_hermes_phase == 'runtime' && 180 || 90 }}
    steps:
      - name: Check out the component probe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Provision pinned official Hermes components
        id: hermes-components
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $runtimeRoot = "$env:SystemDrive\NemoClawHermesProbe-$([guid]::NewGuid().ToString('N').Substring(0, 12))"
          "runtime_root=$runtimeRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          & "$env:GITHUB_WORKSPACE\packaging\windows\hermes\prepare-official-components.ps1" `
            -RuntimeRoot $runtimeRoot `
            -ArtifactDirectory "$env:RUNNER_TEMP\official-hermes-components"

      - name: Check the canonical Python phase result contract
        if: ${{ (inputs.official_hermes_phase == 'python' || inputs.official_hermes_phase == 'runtime') }}
        shell: powershell
        env:
          HERMES_COMPONENT_ROOT: ${{ steps.hermes-components.outputs.runtime_root }}
        run: |
          & "$env:GITHUB_WORKSPACE\packaging\windows\hermes\test-official-python.ps1"
          & "$env:GITHUB_WORKSPACE\packaging\windows\hermes\test-official-python-process.ps1"
          & "$env:GITHUB_WORKSPACE\packaging\windows\hermes\test-official-msvc-tools.ps1"
          & "$env:GITHUB_WORKSPACE\packaging\windows\hermes\test-official-python-semantics.ps1" `
            -OfficialInstallerPath "$env:HERMES_COMPONENT_ROOT\hermes-agent\scripts\install.ps1"
          & "$env:GITHUB_WORKSPACE\packaging\windows\hermes\test-official-registry-path.ps1" `
            -OfficialInstallerPath "$env:HERMES_COMPONENT_ROOT\hermes-agent\scripts\install.ps1" `
            -ReceiptPath "$env:RUNNER_TEMP\official-hermes-components\python-registry-path-controls.json"

      - name: Set up pinned native Rust for canonical Hermes Python
        if: ${{ (inputs.official_hermes_phase == 'python' || inputs.official_hermes_phase == 'runtime') }}
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.95.0-aarch64-pc-windows-msvc
          target: aarch64-pc-windows-msvc
          cache: false
          rustflags: ""

      - name: Provision canonical Hermes Python before baseline setup
        if: ${{ (inputs.official_hermes_phase == 'python' || inputs.official_hermes_phase == 'runtime') }}
        id: hermes-python
        shell: powershell
        # Pinned OpenSSL SDK build precedes the unchanged 20-minute Python stage.
        timeout-minutes: ${{ inputs.official_hermes_phase == 'runtime' && 165 || 55 }}
        env:
          HERMES_COMPONENT_ROOT: ${{ steps.hermes-components.outputs.runtime_root }}
          HERMES_SELECTED_PHASE: ${{ inputs.official_hermes_phase }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $toolchain = '1.95.0-aarch64-pc-windows-msvc'
          $rustc = (& rustup which --toolchain $toolchain rustc).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'The pinned native Rust compiler is missing.' }
          $cargo = (& rustup which --toolchain $toolchain cargo).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'The pinned native Cargo is missing.' }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsDevCmd = (& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -find 'Common7\Tools\VsDevCmd.bat' | Select-Object -First 1)
          if ($LASTEXITCODE -ne 0 -or -not $vsDevCmd) { throw 'The runner does not contain the required Visual Studio ARM64 tools.' }
          $powershell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $entry = if ($env:HERMES_SELECTED_PHASE -eq 'runtime') { 'prepare-official-runtime.ps1' } else { 'prepare-official-python.ps1' }
          $script = Join-Path "$env:GITHUB_WORKSPACE\packaging\windows\hermes" $entry
          $phaseLock = "$env:GITHUB_WORKSPACE\packaging\windows\hermes\official-python.lock.json"
          $evidence = "$env:RUNNER_TEMP\official-hermes-python"
          $components = "$env:RUNNER_TEMP\official-hermes-components"
          foreach ($value in @($vsDevCmd, $powershell, $script, $phaseLock, $evidence, $components, $rustc, $cargo, $env:HERMES_COMPONENT_ROOT)) {
            if ($value -match '["\r\n%!]') { throw 'A build-prerequisite path cannot be represented safely.' }
          }
          $command = 'call "' + $vsDevCmd + '" -arch=arm64 -host_arch=arm64 && "' + $powershell + '" -NoProfile -ExecutionPolicy Bypass -File "' + $script + '" -LockPath "' + $phaseLock + '" -RuntimeRoot "' + $env:HERMES_COMPONENT_ROOT + '" -ArtifactDirectory "' + $evidence + '" -ComponentEvidenceDirectory "' + $components + '" -RustcPath "' + $rustc + '" -CargoPath "' + $cargo + '"'
          if ($env:HERMES_SELECTED_PHASE -eq 'runtime') { $command += ' -ControllerSource "' + $env:GITHUB_SHA + '"' }
          & "$env:SystemRoot\System32\cmd.exe" /d /c $command
          if ($LASTEXITCODE -ne 0) { throw 'The canonical Hermes Python phase failed; baseline setup will not run.' }

      - name: Upload the complete unqualified official runtime candidate
        if: ${{ always() && inputs.official_hermes_phase == 'runtime' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-hermes-runtime-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/official-hermes-runtime-candidate/
            ${{ runner.temp }}/official-hermes-runtime-build/
            ${{ runner.temp }}/official-hermes-runtime-phase.json
            ${{ runner.temp }}/official-hermes-export-controls/
            !${{ runner.temp }}/official-hermes-export-controls/tools/
            ${{ runner.temp }}/official-hermes-components/
            ${{ runner.temp }}/official-hermes-python/
            !${{ runner.temp }}/official-hermes-components/downloads/
            !${{ runner.temp }}/official-hermes-python/downloads/
            !${{ runner.temp }}/official-hermes-python/cargo-home/
            !${{ runner.temp }}/official-hermes-python/dependency-stage/uv-cache/
            !${{ runner.temp }}/official-hermes-python/openssl/downloads/
            !${{ runner.temp }}/official-hermes-python/openssl/strawberryperl/
            !${{ runner.temp }}/official-hermes-python/openssl/nasm-windows-bin/
            !${{ runner.temp }}/official-hermes-python/openssl/jom-windows-bin/
            !${{ runner.temp }}/official-hermes-python/openssl/openssl/
            !${{ runner.temp }}/official-hermes-runtime-build/downloads/
            !${{ runner.temp }}/official-hermes-runtime-build/browser-use-wheels/
            !${{ runner.temp }}/official-hermes-runtime-build/uv-cache/
            !${{ runner.temp }}/official-hermes-runtime-build/npm-cache/
            !${{ runner.temp }}/official-hermes-runtime-build/node-build/
            !${{ runner.temp }}/official-hermes-runtime-build/node-build-tools/
            !${{ runner.temp }}/official-hermes-runtime-build/node-addon-headers/
          if-no-files-found: error
          retention-days: 14

      - name: Install the immutable MXC baseline
        if: ${{ inputs.official_hermes_phase != 'python' && inputs.official_hermes_phase != 'runtime' }}
        id: component-baseline
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\packaging\windows\hermes\component-probe-baseline.ps1" `
            -ArtifactDirectory "$env:RUNNER_TEMP\official-hermes-baseline"

      - name: Check bounded component process diagnostics on Windows
        if: ${{ steps.component-baseline.outcome == 'success' }}
        id: component-controls
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\packaging\windows\performance\acl-snapshot.test.ps1"
          $node = Join-Path $env:ProgramFiles 'NVIDIA\NemoClaw\bin\node.exe'
          & $node --experimental-strip-types --no-warnings --test `
            (Join-Path $env:GITHUB_WORKSPACE 'packaging/windows/hermes/probe-components.test.mts') `
            (Join-Path $env:GITHUB_WORKSPACE 'packaging/windows/hermes/portable-git-arguments.test.mts') `
            (Join-Path $env:GITHUB_WORKSPACE 'packaging/windows/hermes/probe-python-temp.test.mts') `
            (Join-Path $env:GITHUB_WORKSPACE 'packaging/windows/performance/measurement.test.mts') `
            (Join-Path $env:GITHUB_WORKSPACE 'packaging/windows/performance/compile-cache-experiment.test.mts')
          if ($LASTEXITCODE -ne 0) { throw 'The component process diagnostic controls failed.' }

      - name: Execute the official components inside MXC
        if: ${{ steps.component-baseline.outcome == 'success' && steps.component-controls.outcome == 'success' }}
        shell: powershell
        env:
          HERMES_COMPONENT_ROOT: ${{ steps.hermes-components.outputs.runtime_root }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $installRoot = Join-Path $env:ProgramFiles 'NVIDIA\NemoClaw'
          & "$installRoot\bin\node.exe" --experimental-strip-types --no-warnings `
            "$env:GITHUB_WORKSPACE\packaging\windows\hermes\probe-official-components.mts" `
            --install-root $installRoot `
            --runtime-root $env:HERMES_COMPONENT_ROOT `
            --artifact-directory "$env:RUNNER_TEMP\official-hermes-mxc"
          if ($LASTEXITCODE -ne 0) { throw 'The official Hermes MXC component probe failed.' }

      - name: Check official Python temp permissions before and after the startup adapter
        if: ${{ !cancelled() && steps.component-baseline.outcome == 'success' && steps.component-controls.outcome == 'success' }}
        shell: powershell
        env:
          HERMES_COMPONENT_ROOT: ${{ steps.hermes-components.outputs.runtime_root }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $installRoot = Join-Path $env:ProgramFiles 'NVIDIA\NemoClaw'
          & "$installRoot\bin\node.exe" --experimental-strip-types --no-warnings `
            "$env:GITHUB_WORKSPACE\packaging\windows\hermes\probe-official-python-adapter.mts" `
            --install-root $installRoot `
            --runtime-root $env:HERMES_COMPONENT_ROOT `
            --artifact-directory "$env:RUNNER_TEMP\official-hermes-python-temp"
          if ($LASTEXITCODE -ne 0) { throw 'The official Python before/after temp adapter control failed.' }

      - name: Probe installed runtime access and contained compile-cache A/B
        if: ${{ !cancelled() && steps.component-baseline.outcome == 'success' && steps.component-controls.outcome == 'success' }}
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $installRoot = Join-Path $env:ProgramFiles 'NVIDIA\NemoClaw'
          & "$installRoot\bin\node.exe" --experimental-strip-types --no-warnings `
            "$env:GITHUB_WORKSPACE\packaging\windows\performance\probe-installed-readonly.mts" `
            --install-root $installRoot `
            --source-revision f8a1d8c702c879d2984d76d2e0419641bb1ccd97 `
            --artifact-directory "$env:RUNNER_TEMP\installed-runtime-readonly" `
            --compile-cache-experiment `
            --runtime-manifest-sha256 d36e977401cf8188350e657137bf649c654f4554a6c4da299f9b2b9353e7066e
          if ($LASTEXITCODE -ne 0) { throw 'The installed read-only runtime probe failed.' }

      - name: Upload failed component evidence before baseline cleanup
        if: ${{ failure() && inputs.official_hermes_phase != 'runtime' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-hermes-windows-mxc-components-precleanup-${{ github.sha }}
          path: |
            ${{ runner.temp }}/official-hermes-components/
            ${{ runner.temp }}/official-hermes-python/
            ${{ runner.temp }}/official-hermes-python-temp/
            ${{ runner.temp }}/official-hermes-mxc/
            ${{ runner.temp }}/installed-runtime-readonly/
            !${{ runner.temp }}/official-hermes-components/downloads/
            !${{ runner.temp }}/official-hermes-python/openssl/downloads/
            !${{ runner.temp }}/official-hermes-python/openssl/strawberryperl/
            !${{ runner.temp }}/official-hermes-python/openssl/nasm-windows-bin/
            !${{ runner.temp }}/official-hermes-python/openssl/jom-windows-bin/
            !${{ runner.temp }}/official-hermes-python/openssl/openssl/
            !${{ runner.temp }}/official-hermes-python/downloads/
            !${{ runner.temp }}/official-hermes-python/cargo-home/
            !${{ runner.temp }}/official-hermes-python/dependency-stage/uv-cache/
          if-no-files-found: warn
          retention-days: 14

      - name: Uninstall the component probe baseline
        if: ${{ always() && inputs.official_hermes_phase != 'runtime' && steps.component-baseline.outcome != 'skipped' }}
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\packaging\windows\hermes\component-probe-baseline.ps1" `
            -ArtifactDirectory "$env:RUNNER_TEMP\official-hermes-baseline" -Uninstall

      - name: Upload official Hermes component evidence
        if: ${{ always() && inputs.official_hermes_phase != 'runtime' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-hermes-windows-mxc-components-${{ github.sha }}
          path: |
            ${{ runner.temp }}/official-hermes-baseline/
            ${{ runner.temp }}/official-hermes-components/
            ${{ runner.temp }}/official-hermes-python/
            ${{ runner.temp }}/official-hermes-python-temp/
            ${{ runner.temp }}/official-hermes-mxc/
            ${{ runner.temp }}/installed-runtime-readonly/
            !${{ runner.temp }}/official-hermes-baseline/baseline-setup.exe
            !${{ runner.temp }}/official-hermes-components/downloads/
            !${{ runner.temp }}/official-hermes-python/openssl/downloads/
            !${{ runner.temp }}/official-hermes-python/openssl/strawberryperl/
            !${{ runner.temp }}/official-hermes-python/openssl/nasm-windows-bin/
            !${{ runner.temp }}/official-hermes-python/openssl/jom-windows-bin/
            !${{ runner.temp }}/official-hermes-python/openssl/openssl/
            !${{ runner.temp }}/official-hermes-python/downloads/
            !${{ runner.temp }}/official-hermes-python/cargo-home/
            !${{ runner.temp }}/official-hermes-python/dependency-stage/uv-cache/
          if-no-files-found: error
          retention-days: 14

  windows-native-profiling:
    name: Installed Windows baseline profiling (diagnostic only)
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.run_windows_native_installer && inputs.profile_native_windows && !inputs.test_native_windows_runtime }}
    runs-on: windows-11-vs2026-arm
    # Existing target allowances: 15m install + 30m warm prep + 45m replays
    # + 15m uninstall; download/recording finalization retain bounded headroom.
    timeout-minutes: 150
    steps:
      - name: Check out the profiling controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the explicit profiling request
        shell: powershell
        env:
          OTHER_BUILD: ${{ inputs.run_windows_native_installer }}
          OTHER_COMPONENTS: ${{ inputs.probe_official_hermes_components }}
          OTHER_DIAGNOSTIC: ${{ inputs.windows_native_diagnostic_source_run_id }}
        run: |
          if ($env:OTHER_BUILD -eq 'true' -or $env:OTHER_COMPONENTS -eq 'true' -or $env:OTHER_DIAGNOSTIC) {
            throw 'Profiling is a separate explicit dispatch and cannot also build or run component diagnostics.'
          }

      - name: Set up the profiling controller Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          architecture: arm64

      - name: Resolve the reviewed npm Git Bash scratch path
        id: reviewed-npm-temp
        shell: bash
        run: |
          path="$(cygpath -u "$RUNNER_TEMP")"
          [[ "$path" == /* ]]
          printf 'path=%s\n' "$path" >> "$GITHUB_OUTPUT"

      - name: Install reviewed npm
        uses: ./.github/actions/setup-reviewed-npm
        env:
          RUNNER_TEMP: ${{ steps.reviewed-npm-temp.outputs.path }}
          TAR_OPTIONS: --force-local

      - name: Record actual installation and dashboard CPU and file I/O
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\packaging\windows\performance\run-profiling-phase.ps1" `
            -ArtifactDirectory "$env:RUNNER_TEMP\windows-native-profiling" `
            -HarnessNodePath ((Get-Command node.exe -CommandType Application | Select-Object -First 1).Source) `
            -ControllerSha $env:GITHUB_SHA

      - name: Upload profiling evidence including failures and capped traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-native-profiling-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/windows-native-profiling/
            !${{ runner.temp }}/windows-native-profiling/baseline/baseline-setup.exe
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14

  windows-runtime-controls:
    name: Native Windows ownership and isolated MSI controls
    needs: windows-runtime-preflight
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.run_windows_native_installer && inputs.test_native_windows_runtime) }}
    permissions:
      contents: read
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 20
    steps:
      - name: Check out the native ownership controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the explicit ownership request
        shell: powershell
        env:
          OTHER_BUILD: ${{ inputs.run_windows_native_installer }}
          OTHER_COMPONENTS: ${{ inputs.probe_official_hermes_components }}
          OTHER_PROFILE: ${{ inputs.profile_native_windows }}
          OTHER_DIAGNOSTIC: ${{ inputs.windows_native_diagnostic_source_run_id }}
        run: |
          if ($env:OTHER_BUILD -eq 'true' -or $env:OTHER_COMPONENTS -eq 'true' -or $env:OTHER_PROFILE -eq 'true' -or $env:OTHER_DIAGNOSTIC) {
            throw 'Native ownership controls require a separate explicit dispatch.'
          }

      - name: Set up actual ARM64 Node for controller preflight and shared-file fixtures
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          architecture: arm64

      - name: Exercise installed acceptance controller compatibility
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'windows-runtime-controls'
          [IO.Directory]::CreateDirectory($output) | Out-Null
          $log = Join-Path $output 'installed-acceptance-controller-tests.log'
          $tests = @(
            (Join-Path $env:GITHUB_WORKSPACE 'packaging/windows/installer/control-installed-openclaw-input.test.mts'),
            (Join-Path $env:GITHUB_WORKSPACE 'packaging/windows/runtime/native-turn-cleanup.test.mts'),
            (Join-Path $env:GITHUB_WORKSPACE 'packaging/windows/installer/run-installed-acceptance.test.mts'),
            (Join-Path $env:GITHUB_WORKSPACE 'packaging/windows/installer/qualify-finished-package.test.mts'),
            (Join-Path $env:GITHUB_WORKSPACE 'packaging/windows/runtime/native-ui-tunnel.test.mts'),
            (Join-Path $env:GITHUB_WORKSPACE 'packaging/windows/installer/qualify-installed-hermes.test.mts'),
            (Join-Path $env:GITHUB_WORKSPACE 'packaging/windows/installer/windows-native-transfer.test.mts'),
            (Join-Path $env:GITHUB_WORKSPACE 'packaging/windows/runtime/native-configuration-credentials.test.mts'),
            (Join-Path $env:GITHUB_WORKSPACE 'packaging/windows/runtime/native-setup-transaction.test.mts'),
            (Join-Path $env:GITHUB_WORKSPACE 'packaging/windows/runtime/native-remove-data.test.mts'),
            (Join-Path $env:GITHUB_WORKSPACE 'packaging/windows/runtime/native-local-models.test.mts'),
            (Join-Path $env:GITHUB_WORKSPACE 'packaging/windows/runtime/native-bundled-inference.test.mts'),
            (Join-Path $env:GITHUB_WORKSPACE 'packaging/windows/runtime/native-inference.test.mts'),
            (Join-Path $env:GITHUB_WORKSPACE 'packaging/windows/runtime/native-setup-local-models.test.mts')
          )
          try {
            $ErrorActionPreference = 'Continue'
            & node --experimental-strip-types --no-warnings --test --test-reporter=tap @tests `
              2>&1 | Tee-Object -FilePath $log
            $result = $LASTEXITCODE
          } finally { $ErrorActionPreference = 'Stop' }
          if ($result -ne 0) { throw 'The installed acceptance controller controls failed.' }

      - name: Set up pinned Rust for the native ownership controls
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.95.0-aarch64-pc-windows-msvc
          target: aarch64-pc-windows-msvc
          cache: false
          rustflags: ""

      - name: Check the native transaction helper
        shell: powershell
        env:
          CARGO_TERM_COLOR: never
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'windows-runtime-controls'
          [IO.Directory]::CreateDirectory($output) | Out-Null
          $log = Join-Path $output 'msi-helper-tests.log'
          try {
            $ErrorActionPreference = 'Continue'
            & rustup run 1.95.0-aarch64-pc-windows-msvc cargo test --locked `
              --manifest-path "$env:GITHUB_WORKSPACE\packaging\windows\installer\Cargo.toml" `
              --target aarch64-pc-windows-msvc --features msi-boundary-fixture -- `
              --nocapture --test-threads=1 --skip runtime_lease:: 2>&1 | Tee-Object -FilePath $log
            $result = $LASTEXITCODE
          } finally { $ErrorActionPreference = 'Stop' }
          if ($result -ne 0 -or (Get-Content -LiteralPath $log -Raw) -notmatch 'test result: ok\. 33 passed; 0 failed; 0 ignored;') {
            throw 'The thirty-three transaction, image cleanup, manifest, mount ACL and native SHA256 controls did not all pass.'
          }

      - name: Exercise native certificate revocation requests
        shell: powershell
        env:
          CARGO_TERM_COLOR: never
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'windows-runtime-controls'
          [IO.Directory]::CreateDirectory($output) | Out-Null
          $log = Join-Path $output 'edge-trust-tests.log'
          try {
            $ErrorActionPreference = 'Continue'
            & rustup run 1.95.0-aarch64-pc-windows-msvc cargo test --locked `
              --manifest-path "$env:GITHUB_WORKSPACE\packaging\windows\launcher\Cargo.toml" `
              --target aarch64-pc-windows-msvc edge_trust:: -- --nocapture 2>&1 | Tee-Object -FilePath $log
            $result = $LASTEXITCODE
          } finally { $ErrorActionPreference = 'Stop' }
          if ($result -ne 0 -or (Get-Content -LiteralPath $log -Raw) -notmatch 'test result: ok\. 6 passed; 0 failed; 0 ignored;') {
            throw 'The native Edge certificate trust controls did not all pass.'
          }

      - name: Reject unavailable revocation through the native Windows trust API
        timeout-minutes: 5
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'edge-revocation-control'
          & rustup run 1.95.0-aarch64-pc-windows-msvc cargo build --locked `
            --manifest-path "$env:GITHUB_WORKSPACE\packaging\windows\launcher\Cargo.toml" `
            --target aarch64-pc-windows-msvc --target-dir "$output\target"
          if ($LASTEXITCODE -ne 0) { throw 'The native certificate trust owner did not build.' }
          & "$env:GITHUB_WORKSPACE\packaging\windows\tests\edge-trust\run-revocation-control.ps1" `
            -Launcher "$output\target\aarch64-pc-windows-msvc\debug\NemoClaw.exe"

      - name: Exercise real Windows leases and protected fixtures
        shell: powershell
        env:
          CARGO_TERM_COLOR: never
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'windows-runtime-controls'
          [IO.Directory]::CreateDirectory($output) | Out-Null
          $log = Join-Path $output 'runtime-lease-tests.log'
          try {
            $ErrorActionPreference = 'Continue'
            & rustup run 1.95.0-aarch64-pc-windows-msvc cargo test --locked `
              --manifest-path "$env:GITHUB_WORKSPACE\packaging\windows\launcher\Cargo.toml" `
              --target aarch64-pc-windows-msvc runtime_lease:: -- --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath $log
            $result = $LASTEXITCODE
          } finally { $ErrorActionPreference = 'Stop' }
          if ($result -ne 0) { throw 'The real native runtime ownership controls failed.' }
          if ((Get-Content -LiteralPath $log -Raw) -notmatch 'test result: ok\. 19 passed; 0 failed; 0 ignored;') {
            throw 'The six portable and thirteen Windows ownership controls did not all execute.'
          }

      - name: Exercise shared configuration and per-agent state ownership
        shell: powershell
        env:
          CARGO_TERM_COLOR: never
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'windows-runtime-controls'
          $log = Join-Path $output 'state-session-tests.log'
          try {
            $ErrorActionPreference = 'Continue'
            & rustup run 1.95.0-aarch64-pc-windows-msvc cargo test --locked `
              --manifest-path "$env:GITHUB_WORKSPACE\packaging\windows\launcher\Cargo.toml" `
              --target aarch64-pc-windows-msvc state_session:: -- --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath $log
            $result = $LASTEXITCODE
          } finally { $ErrorActionPreference = 'Stop' }
          $text = [string](Get-Content -LiteralPath $log -Raw)
          if ($result -ne 0 -or $text -notmatch '(?m)^test result: ok\. 18 passed; 0 failed; 0 ignored;') {
            throw 'The shared configuration and per-agent state ownership controls did not all pass.'
          }

      - name: Exercise owned child and grandchild lifetime
        shell: powershell
        env:
          CARGO_TERM_COLOR: never
          NEMOCLAW_BROWSER_PROOF: "1"
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'windows-runtime-controls'
          [IO.Directory]::CreateDirectory($output) | Out-Null
          $log = Join-Path $output 'runtime-host-tests.log'
          try {
            $ErrorActionPreference = 'Continue'
            & rustup run 1.95.0-aarch64-pc-windows-msvc cargo test --locked `
              --manifest-path "$env:GITHUB_WORKSPACE\packaging\windows\launcher\Cargo.toml" `
              --target aarch64-pc-windows-msvc runtime_host:: -- --include-ignored --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath $log
            $result = $LASTEXITCODE
          } finally { $ErrorActionPreference = 'Stop' }
          if ($result -ne 0) { throw 'The native runtime guardian controls failed.' }
          if ((Get-Content -LiteralPath $log -Raw) -notmatch 'test result: ok\. 23 passed; 0 failed; 0 ignored;') {
            throw 'The twenty-two guardian/browser controls and their child-fixture entry did not all execute.'
          }

      - name: Set up pinned tools for isolated MSI fixtures
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.419

      - name: Verify cached maintenance cancellation and deadline handling
        shell: powershell
        run: |
          & dotnet run --configuration Release --project `
            packaging/windows/tests/maintenance-wait/Maintenance.Wait.Controls.csproj
          if ($LASTEXITCODE -ne 0) { throw 'The cached maintenance wait controls failed.' }

      - name: Verify setup cancellation checkpoints before configuration mutation
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'windows-runtime-controls'
          [IO.Directory]::CreateDirectory($output) | Out-Null
          $log = Join-Path $output 'setup-cancellation-controls.log'
          try {
            $ErrorActionPreference = 'Continue'
            & dotnet run --configuration Release --project `
              packaging/windows/tests/setup-cancellation/Setup.Cancellation.Controls.csproj `
              2>&1 | Tee-Object -FilePath $log
            $result = $LASTEXITCODE
          } finally { $ErrorActionPreference = 'Stop' }
          if ($result -ne 0) { throw 'The setup cancellation checkpoint controls failed.' }

      - name: Resolve the reviewed npm Git Bash scratch path
        id: reviewed-npm-temp
        shell: bash
        run: |
          path="$(cygpath -u "$RUNNER_TEMP")"
          [[ "$path" == /* ]]
          printf 'path=%s\n' "$path" >> "$GITHUB_OUTPUT"

      - name: Install reviewed npm
        uses: ./.github/actions/setup-reviewed-npm
        env:
          RUNNER_TEMP: ${{ steps.reviewed-npm-temp.outputs.path }}
          TAR_OPTIONS: --force-local

      - name: Exercise actual browser request channel cleanup
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:RUNNER_TEMP 'windows-runtime-controls\runtime-browser-node-tests.log'
          try {
            $ErrorActionPreference = 'Continue'
            & node --experimental-strip-types --no-warnings --test --test-reporter=tap `
              (Join-Path $env:GITHUB_WORKSPACE 'packaging/windows/runtime/native-runtime-browser.test.mts') 2>&1 | Tee-Object -FilePath $log
            $result = $LASTEXITCODE
          } finally { $ErrorActionPreference = 'Stop' }
          $text = Get-Content -LiteralPath $log -Raw
          if ($result -ne 0 -or $text -notmatch '(?m)^# pass 6\r?$' -or $text -notmatch '(?m)^# skipped 0\r?$') {
            throw 'All six browser origin and actual named-pipe cleanup controls must execute.'
          }

      - name: Set up build-only Python for MSI fixture authoring
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.1.0
        with:
          python-version: 3.13.13
          architecture: arm64

      - name: Exercise native file ownership and relay counters
        shell: powershell
        env:
          CARGO_TERM_COLOR: never
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'windows-runtime-controls'
          $log = Join-Path $output 'native-ui-file-owner-tests.log'
          try {
            $ErrorActionPreference = 'Continue'
            & rustup run 1.95.0-aarch64-pc-windows-msvc cargo test --locked `
              --manifest-path "$env:GITHUB_WORKSPACE\packaging\windows\launcher\Cargo.toml" `
              --target aarch64-pc-windows-msvc native_ui_file_owner:: -- --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath $log
            $result = $LASTEXITCODE
          } finally { $ErrorActionPreference = 'Stop' }
          if ($result -ne 0 -or (Get-Content -LiteralPath $log -Raw) -notmatch 'test result: ok\. 15 passed; 0 failed; 0 ignored;') {
            throw 'The two portable and thirteen Windows file-owner controls did not all pass.'
          }
          $target = Join-Path $env:RUNNER_TEMP 'windows-runtime-test-launcher'
          try {
            $ErrorActionPreference = 'Continue'
            & rustup run 1.95.0-aarch64-pc-windows-msvc cargo rustc --locked --release --no-default-features `
              --manifest-path "$env:GITHUB_WORKSPACE\packaging\windows\launcher\Cargo.toml" `
              --target aarch64-pc-windows-msvc --target-dir $target -- -C target-feature=+crt-static `
              2>&1 | Tee-Object -FilePath (Join-Path $output 'relay-launcher-build.log')
            $buildResult = $LASTEXITCODE
          } finally { $ErrorActionPreference = 'Stop' }
          if ($buildResult -ne 0) { throw 'The native relay fixture launcher did not build.' }
          $env:NEMOCLAW_NATIVE_TEST_LAUNCHER = Join-Path $target 'aarch64-pc-windows-msvc\release\NemoClaw.exe'
          $relayLog = Join-Path $output 'relay-measurement-tests.log'
          try {
            $ErrorActionPreference = 'Continue'
            & node --experimental-strip-types --no-warnings --test --test-reporter=tap `
              (Join-Path $env:GITHUB_WORKSPACE 'packaging/windows/performance/relay-measurements.test.mts') `
              2>&1 | Tee-Object -FilePath $relayLog
            $relayResult = $LASTEXITCODE
          } finally { $ErrorActionPreference = 'Stop' }
          $relayText = Get-Content -LiteralPath $relayLog -Raw
          if ($relayResult -ne 0 -or $relayText -notmatch '(?m)^# pass 5\r?$' -or $relayText -notmatch '(?m)^# skipped 0\r?$') {
            throw 'All five actual Windows relay measurement controls must run without skips.'
          }

      - name: Check MSI manifest controls
        shell: powershell
        env:
          CARGO_TERM_COLOR: never
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'windows-runtime-controls'
          $pythonLog = Join-Path $output 'msi-build-tests.log'
          try {
            $ErrorActionPreference = 'Continue'
            & python -m unittest discover -s "$env:GITHUB_WORKSPACE\packaging\windows\installer" -p 'test_*.py' -v 2>&1 | Tee-Object -FilePath $pythonLog
            $pythonResult = $LASTEXITCODE
          } finally { $ErrorActionPreference = 'Stop' }
          $pythonText = [string](Get-Content -LiteralPath $pythonLog -Raw)
          if ($pythonResult -ne 0 -or $pythonText -notmatch '(?m)^Ran 200 tests in [0-9.]+s\r?$' -or $pythonText -notmatch '(?m)^OK\r?$') {
            throw 'The 200 MSI build and metadata controls did not all pass.'
          }

      - name: Build and exercise actual isolated MSI transactions
        shell: pwsh
        env:
          CARGO_TERM_COLOR: never
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $node = (Get-Command node.exe -CommandType Application | Select-Object -First 1).Source
          & "$env:GITHUB_WORKSPACE\packaging\windows\installer\test-runtime-msi-process.ps1" `
            -SourceRoot $env:GITHUB_WORKSPACE `
            -ArtifactDirectory (Join-Path $env:RUNNER_TEMP 'windows-msi-lease-process') -NodePath $node
          $tools = Join-Path $env:RUNNER_TEMP 'windows-msi-tools'
          & "$env:GITHUB_WORKSPACE\packaging\windows\installer\install-pinned-wix.ps1" -ToolDirectory $tools
          $python = (Get-Command python.exe -CommandType Application | Select-Object -First 1).Source
          $license = Join-Path (Split-Path -Parent $node) 'LICENSE'
          & "$env:GITHUB_WORKSPACE\packaging\windows\installer\test-runtime-msi.ps1" `
            -SourceRoot $env:GITHUB_WORKSPACE `
            -ArtifactDirectory (Join-Path $env:RUNNER_TEMP 'windows-msi-boundary-fixtures') `
            -NodePath $node -NodeLicensePath $license -PythonPath $python `
            -WixPath (Join-Path $tools 'wix.exe') -SourceRevision $env:GITHUB_SHA

      - name: Upload runtime ownership control evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-runtime-controls-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/windows-runtime-controls/
            ${{ runner.temp }}/windows-msi-lease-process/*.json
            ${{ runner.temp }}/windows-msi-tools/wix-input.json
            ${{ runner.temp }}/windows-msi-boundary-fixtures/*.json
            ${{ runner.temp }}/windows-msi-boundary-fixtures/*.log
            ${{ runner.temp }}/windows-msi-boundary-fixtures/fixtures/fixtures.json
            ${{ runner.temp }}/windows-msi-boundary-fixtures/fixtures/*/namespace.json
          if-no-files-found: warn
          retention-days: 14
