          }
          & "$env:GITHUB_WORKSPACE\candidate\packaging\windows\installer\build-finished-runtime-image.ps1" `
            -RuntimeRoot "$work\assembled\runtimes\$($identity.runtimeId)" -RuntimeId $identity.runtimeId `
            -OutputImage "$work\runtime-image\$($identity.runtimeId).vhdx" `
            -ReceiptPath "$work\runtime-image\runtime-image.json"
      - name: Build the finished WPF, guarded launcher, transactional MSI and Burn preview
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          $work = "$env:RUNNER_TEMP\finished-windows"
          $tools = "$work\tools"
          [IO.File]::WriteAllText("$work\global.json", '{"sdk":{"version":"8.0.419","rollForward":"disable","allowPrerelease":false}}', [Text.UTF8Encoding]::new($false))
          Push-Location $work
          & "$env:GITHUB_WORKSPACE\candidate\packaging\windows\installer\install-pinned-wix.ps1" -ToolDirectory $tools
          $identity = Get-Content -LiteralPath "$work\assembled\runtime-identity.json" -Raw | ConvertFrom-Json
          $imageArguments = @{
            RuntimeImage = "$work\runtime-image\$($identity.runtimeId).vhdx"
            RuntimeImageReceipt = "$work\runtime-image\runtime-image.json"
          }
          & "$env:GITHUB_WORKSPACE\candidate\packaging\windows\installer\build-immutable-package.ps1" `
            -SourceRoot "$env:GITHUB_WORKSPACE\candidate" -SourceRevision $env:GITHUB_SHA -ProductVersion $env:PRODUCT_VERSION `
            -HostPayloadRoot "$work\host" -RuntimeAssemblyRoot "$work\assembled" -OutputDirectory "$work\package" `
            -PythonPath (Get-Command python.exe -CommandType Application | Select-Object -First 1).Source `
            -DotNetPath (Get-Command dotnet.exe -CommandType Application | Select-Object -First 1).Source -WixPath "$tools\wix.exe" `
            -SystemDrivePrepPath "$work\system-drive-helper\NemoClawHostPreparation.exe" `
            -SystemDriveBuildReceipt "$work\system-drive-helper\build-receipt.json" -SystemDriveProofDirectory "$work\system-drive-proof" @imageArguments
          Pop-Location
      - name: Record exact native UI inputs for independent setup regression
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          $package = "$env:RUNNER_TEMP\finished-windows\package"
          $paths = @('build/BootstrapperPayloads.wxs','build/payload/mxc/wxc-host-prep.exe','build/payload/mxc/wxc-exec.exe') + @(Get-ChildItem -LiteralPath "$package\build\bootstrapper" -File | ForEach-Object { 'build/bootstrapper/' + $_.Name })
          $files = @($paths | ForEach-Object { $file = Join-Path $package $_; @{file=$_;bytes=(Get-Item -LiteralPath $file).Length;sha256=(Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()} })
          [IO.File]::WriteAllText("$package\migration-inputs.json", (@{schemaVersion=1;sourceRevision=$env:GITHUB_SHA;files=$files}|ConvertTo-Json -Depth 5), [Text.UTF8Encoding]::new($false))
      - name: Seal the installer for same-run private qualification
        id: product_manifest
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          $source = "$env:RUNNER_TEMP\finished-windows"
          $transfer = "$env:RUNNER_TEMP\finished-windows-product-transfer"
          if (Test-Path -LiteralPath $transfer) { throw 'The installer transfer root must be fresh.' }
          [void][IO.Directory]::CreateDirectory($transfer)
          Copy-Item -LiteralPath "$source\package" -Destination "$transfer\package" -Recurse
          [void][IO.Directory]::CreateDirectory("$transfer\assembled")
          Copy-Item -LiteralPath "$source\assembled\runtime-identity.json" -Destination "$transfer\assembled\runtime-identity.json"
          if ($env:SELECTED_AGENT -ceq 'openclaw') {
            # Retain the exact small build inputs needed to repackage reviewed
            # availability around the existing runtime and native artifacts.
            # These stay inside the same-run, content-bound private transfer.
            Copy-Item -LiteralPath "$source\assembled\assembly.json" -Destination "$transfer\assembled\assembly.json"
            $recomposition = "$transfer\recomposition-inputs"
            foreach ($relative in @(
              'host/runtime-payload-receipt.json', 'host/bin/node.exe',
              'host/mxc/wxc-exec.exe', 'host/mxc/wxc-host-prep.exe',
              'system-drive-helper/NemoClawHostPreparation.exe', 'system-drive-helper/build-receipt.json',
              'system-drive-proof/system-root-mxc-proof.json', 'system-drive-proof/policy.json',
              'system-drive-proof/mxc-native.log'
            )) {
              $destination = Join-Path $recomposition $relative
              [void][IO.Directory]::CreateDirectory((Split-Path -Parent $destination))
              Copy-Item -LiteralPath (Join-Path $source $relative) -Destination $destination
            }
          }
          # Keep the original sealed controller/application transfer beside the MSI.
          # Acceptance must not depend on an older cache surviving the entire build.
          Copy-Item -LiteralPath "$env:RUNNER_TEMP\finished-windows-application-transfer" -Destination "$transfer\compiled-application" -Recurse
          $manifest = @(& "$env:GITHUB_WORKSPACE\candidate\scripts\checks\windows-native-transfer.ps1" -Mode Create -Root $transfer `
            -Kind finished-installer -SourceRevision $env:CANDIDATE_SHA -Agent $env:SELECTED_AGENT `
            -RunId $env:GITHUB_RUN_ID -RunAttempt $env:GITHUB_RUN_ATTEMPT)
          if ($manifest.Count -ne 1 -or [string]$manifest[0] -cnotmatch '^[a-f0-9]{64}$') { throw 'The installer transfer manifest failed.' }
          "manifest_sha256=$([string]$manifest[0])" >> $env:GITHUB_OUTPUT
          "cache_key=windows-finished-installer-v1-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:CANDIDATE_SHA-$env:SELECTED_AGENT" >> $env:GITHUB_OUTPUT
      - name: Save the executable installer only in the same-run cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/finished-windows-product-transfer
          key: ${{ steps.product_manifest.outputs.cache_key }}
      - name: Verify and label the unqualified OpenClaw preview
        id: unqualified_preview
        if: ${{ success() && github.event_name == 'pull_request' && needs.windows-finished-request.outputs.request_kind == 'pull-request' && needs.windows-finished-request.outputs.candidate_repository == github.repository && needs.windows-finished-request.outputs.agent == 'openclaw' && needs.windows-finished-request.outputs.credential_authorized == 'false' }}
        shell: pwsh
        env:
          INSTALLER_MANIFEST: ${{ steps.product_manifest.outputs.manifest_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PRODUCT_VERSION -cnotmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid preview product version.' }
          $product = "$env:RUNNER_TEMP\finished-windows-product-transfer"
          $expectedMsi = "NemoClaw-$env:PRODUCT_VERSION-windows-arm64.msi"
          $expectedSetup = "NemoClawSetup-$env:PRODUCT_VERSION-windows-arm64.exe"
          $verifiedManifest = @(& "$env:GITHUB_WORKSPACE\candidate\scripts\checks\windows-native-transfer.ps1" -Mode Verify `
            -Root $product -Kind finished-installer -SourceRevision $env:CANDIDATE_SHA -Agent openclaw `
            -RunId $env:GITHUB_RUN_ID -RunAttempt $env:GITHUB_RUN_ATTEMPT -ExpectedManifestSha256 $env:INSTALLER_MANIFEST `
            -ExpectedPackageRunnables @($expectedMsi, $expectedSetup))
          if ($verifiedManifest.Count -ne 1 -or [string]$verifiedManifest[0] -cne $env:INSTALLER_MANIFEST) {
            throw 'The preview transfer did not match the built bytes.'
          }
          $receipt = Get-Content -LiteralPath "$product\package\immutable-package-build.json" -Raw | ConvertFrom-Json
          $preview = [ordered]@{
            schemaVersion = 1
            classification = 'unqualified-openclaw-installer-preview'
            warning = 'Preview only. Full installed acceptance and release qualification have not been established.'
            agent = 'openclaw'
            sourceRevision = $env:CANDIDATE_SHA
            workflowRunId = $env:GITHUB_RUN_ID
            workflowRunAttempt = $env:GITHUB_RUN_ATTEMPT
            transferManifestSha256 = $env:INSTALLER_MANIFEST
            installer = @($receipt.files | Where-Object { $_.file -ceq $expectedSetup })[0]
            installedAcceptance = $false
            windowsQualified = $false
            release = $false
          }
          $label = "$env:RUNNER_TEMP\unqualified-openclaw-preview.json"
          if (Test-Path -LiteralPath $label) { throw 'The preview label must be fresh.' }
          [IO.File]::WriteAllText($label, ($preview | ConvertTo-Json -Depth 5), [Text.UTF8Encoding]::new($false))
      - name: Publish the unqualified OpenClaw preview download
        if: ${{ success() && steps.unqualified_preview.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unqualified-openclaw-preview-${{ needs.windows-finished-request.outputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/finished-windows-product-transfer/package/NemoClawSetup-${{ needs.windows-finished-request.outputs.product_version }}-windows-arm64.exe
            ${{ runner.temp }}/finished-windows-product-transfer/package/immutable-package-build.json
            ${{ runner.temp }}/finished-windows-product-transfer/package/compiled-msi.json
            ${{ runner.temp }}/finished-windows-product-transfer/assembled/runtime-identity.json
            ${{ runner.temp }}/finished-windows-product-transfer/transfer-manifest.json
            ${{ runner.temp }}/unqualified-openclaw-preview.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify and label the unqualified Hermes preview
        id: unqualified_hermes_preview
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.build_windows_native_candidate && needs.windows-finished-request.outputs.request_kind == 'candidate-build' && needs.windows-finished-request.outputs.candidate_repository == github.repository && needs.windows-finished-request.outputs.agent == 'hermes' && needs.windows-finished-request.outputs.validation_scope == 'build-only' && needs.windows-finished-request.outputs.credential_authorized == 'false' }}
        shell: pwsh
        env:
          INSTALLER_MANIFEST: ${{ steps.product_manifest.outputs.manifest_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PRODUCT_VERSION -cnotmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid preview product version.' }
          $product = "$env:RUNNER_TEMP\finished-windows-product-transfer"
          $expectedMsi = "NemoClaw-$env:PRODUCT_VERSION-windows-arm64.msi"
          $expectedSetup = "NemoClawSetup-$env:PRODUCT_VERSION-windows-arm64.exe"
          $verifiedManifest = @(& "$env:GITHUB_WORKSPACE\candidate\scripts\checks\windows-native-transfer.ps1" -Mode Verify `
            -Root $product -Kind finished-installer -SourceRevision $env:CANDIDATE_SHA -Agent hermes `
            -RunId $env:GITHUB_RUN_ID -RunAttempt $env:GITHUB_RUN_ATTEMPT -ExpectedManifestSha256 $env:INSTALLER_MANIFEST `
            -ExpectedPackageRunnables @($expectedMsi, $expectedSetup))
          if ($verifiedManifest.Count -ne 1 -or [string]$verifiedManifest[0] -cne $env:INSTALLER_MANIFEST) {
            throw 'The preview transfer did not match the built bytes.'
          }
          $receipt = Get-Content -LiteralPath "$product\package\immutable-package-build.json" -Raw | ConvertFrom-Json
          $preview = [ordered]@{
            schemaVersion = 1
            classification = 'unqualified-hermes-installer-preview'
            warning = 'Preview only. Full installed acceptance and release qualification have not been established.'
            agent = 'hermes'
            sourceRevision = $env:CANDIDATE_SHA
            workflowRunId = $env:GITHUB_RUN_ID
            workflowRunAttempt = $env:GITHUB_RUN_ATTEMPT
            transferManifestSha256 = $env:INSTALLER_MANIFEST
            installer = @($receipt.files | Where-Object { $_.file -ceq $expectedSetup })[0]
            msi = @($receipt.files | Where-Object { $_.file -ceq $expectedMsi })[0]
            installedAcceptance = $false
            windowsQualified = $false
            release = $false
          }
          $label = "$env:RUNNER_TEMP\unqualified-hermes-preview.json"
          if (Test-Path -LiteralPath $label) { throw 'The preview label must be fresh.' }
          [IO.File]::WriteAllText($label, ($preview | ConvertTo-Json -Depth 5), [Text.UTF8Encoding]::new($false))
      - name: Publish the unqualified Hermes preview download
        if: ${{ success() && steps.unqualified_hermes_preview.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unqualified-hermes-preview-${{ needs.windows-finished-request.outputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/finished-windows-product-transfer/package/NemoClawSetup-${{ needs.windows-finished-request.outputs.product_version }}-windows-arm64.exe
            ${{ runner.temp }}/finished-windows-product-transfer/package/NemoClaw-${{ needs.windows-finished-request.outputs.product_version }}-windows-arm64.msi
            ${{ runner.temp }}/finished-windows-product-transfer/package/immutable-package-build.json
            ${{ runner.temp }}/finished-windows-product-transfer/package/compiled-msi.json
            ${{ runner.temp }}/finished-windows-product-transfer/assembled/runtime-identity.json
            ${{ runner.temp }}/finished-windows-product-transfer/transfer-manifest.json
            ${{ runner.temp }}/unqualified-hermes-preview.json
          if-no-files-found: error
          retention-days: 14
      - name: Stage only non-runnable finished build evidence
        id: finished_evidence
        if: ${{ always() }}
        shell: pwsh
        run: |
          $work = "$env:RUNNER_TEMP\finished-windows"
          $inputs = @(
            "$work\host\runtime-payload-receipt.json",
            "$work\tools\wix-input.json",
            "$work\runtime-image\runtime-image.json",
            "$work\runtime-image\runtime-image.robocopy.log",
            "$work\runtime-image\runtime-image.diskpart.log",
            "$work\hermes-input\intake.json",
            "$work\hermes-input\personal-feasibility.json",
            "$work\hermes-input\personal-request.json",
            "$work\hermes-input\mxc-native.log",
            "$work\personal-bootstrap\export-controls.json",
            "$work\hermes-input\current-native-proof.json",
            "$work\hermes-input\current-msys-build.json",
            "$work\hermes-input\current-mxc-build.json",
            "$work\assembled\diagnostics",
            "$work\openshell-binaries\openshell-build.json",
            "$work\system-drive-helper\build-receipt.json",
            "$work\system-drive-helper\build.log",
            "$work\system-drive-proof"
          )
          foreach ($pattern in @(
            "$work\assembled\*.json", "$work\hermes-input\candidate\*.json",
            "$work\personal-production\*.json", "$work\personal-production\*.log",
            "$work\personal-production\personal-mxc\*.json", "$work\personal-production\personal-mxc\*.log",
            "$work\personal-production\system-root-proof\*.json", "$work\personal-production\system-root-proof\*.log",
            "$work\personal-production\official-hermes-runtime-build\*.log",
            "$work\package\*.json", "$work\package\build\*.log",
            "$work\*.log", "$work\openshell-logs\*.log"
          )) {
            $inputs += @(Get-ChildItem -Path $pattern -File -ErrorAction SilentlyContinue | ForEach-Object FullName)
          }
          & "$env:GITHUB_WORKSPACE\candidate\scripts\checks\stage-windows-native-evidence.ps1" `
            -SourceBase $work -InputPath $inputs -OutputRoot "$env:RUNNER_TEMP\finished-windows-build-evidence"
      - name: Preserve finished build and helper proof evidence
        if: ${{ always() && steps.finished_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: finished-windows-preview-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/finished-windows-build-evidence/
          if-no-files-found: warn
          retention-days: 14

  windows-finished-installed-startup:
    name: Credential-free fresh installed OpenClaw startup and cleanup (ARM64)
    needs: [windows-finished-request, windows-finished-installer, windows-compiled-application]
    if: ${{ always() && !cancelled() && needs.windows-finished-request.result == 'success' && needs.windows-finished-request.outputs.request_kind == 'pull-request' && needs.windows-finished-request.outputs.agent == 'openclaw' && needs.windows-finished-request.outputs.validation_scope == 'startup-only' && needs.windows-finished-installer.result == 'success' && needs.windows-compiled-application.result == 'success' }}
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    env:
      CANDIDATE_SHA: ${{ needs.windows-finished-request.outputs.candidate_sha }}
      SELECTED_AGENT: openclaw
      PRODUCT_VERSION: ${{ needs.windows-finished-request.outputs.product_version }}
    steps:
      - name: Check out the exact pull request acceptance controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.windows-finished-request.outputs.candidate_repository }}
          ref: ${{ needs.windows-finished-request.outputs.candidate_sha }}
          path: candidate
          persist-credentials: false
      - name: Restore exact same-run installer cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/finished-windows-product-transfer
          key: ${{ needs.windows-finished-installer.outputs.installer_cache_key }}
          fail-on-cache-miss: true
      - name: Verify and materialize exact same-run startup inputs
        shell: pwsh
        env:
          INSTALLER_MANIFEST: ${{ needs.windows-finished-installer.outputs.installer_manifest_sha256 }}
          APPLICATION_MANIFEST: ${{ needs.windows-compiled-application.outputs.application_manifest_sha256 }}
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          $product = "$env:RUNNER_TEMP\finished-windows-product-transfer"
          $application = "$product\compiled-application"
          $verifiedProduct = @(& "$env:GITHUB_WORKSPACE\candidate\scripts\checks\windows-native-transfer.ps1" -Mode Verify -Root $product `
            -Kind finished-installer -SourceRevision $env:CANDIDATE_SHA -Agent openclaw `
            -RunId $env:GITHUB_RUN_ID -RunAttempt $env:GITHUB_RUN_ATTEMPT -ExpectedManifestSha256 $env:INSTALLER_MANIFEST)
          $verifiedApplication = @(& "$env:GITHUB_WORKSPACE\candidate\scripts\checks\windows-native-transfer.ps1" -Mode Verify -Root $application `
            -Kind compiled-application -SourceRevision $env:CANDIDATE_SHA -Agent openclaw `
            -RunId $env:GITHUB_RUN_ID -RunAttempt $env:GITHUB_RUN_ATTEMPT -ExpectedManifestSha256 $env:APPLICATION_MANIFEST)
          if ($verifiedProduct.Count -ne 1 -or [string]$verifiedProduct[0] -cne $env:INSTALLER_MANIFEST -or
              $verifiedApplication.Count -ne 1 -or [string]$verifiedApplication[0] -cne $env:APPLICATION_MANIFEST) {
            throw 'A startup transfer did not match its producer.'
          }
          $work = "$env:RUNNER_TEMP\finished-windows"
          [void][IO.Directory]::CreateDirectory($work)
          Copy-Item -LiteralPath "$product\package" -Destination "$work\package" -Recurse
          Copy-Item -LiteralPath "$product\assembled" -Destination "$work\assembled" -Recurse
          Copy-Item -LiteralPath "$application\application" -Destination "$work\application" -Recurse
      - name: Exercise installed OpenClaw startup and owned cleanup without credentials
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          & "$env:GITHUB_WORKSPACE\candidate\packaging\windows\installer\run-installed-acceptance.ps1" `
            -SourceRoot "$env:GITHUB_WORKSPACE\candidate" -WorkDirectory "$env:RUNNER_TEMP\finished-windows" `
            -ProductVersion $env:PRODUCT_VERSION -ArtifactSourceRevision $env:CANDIDATE_SHA -Mode current-build -Agent openclaw -ValidationScope startup-only
      - name: Stage only non-runnable startup evidence
        id: startup_evidence
        if: ${{ always() }}
        shell: pwsh
        run: |
          $work = "$env:RUNNER_TEMP\finished-windows"
          $inputs = @("$work\installed-smoke", "$work\installed-smoke-after-repair", "$work\installed-stage-timings.json")
          foreach ($pattern in @("$work\*.log", "$work\package\*.json")) {
            $inputs += @(Get-ChildItem -Path $pattern -File -ErrorAction SilentlyContinue | ForEach-Object FullName)
          }
          & "$env:GITHUB_WORKSPACE\candidate\scripts\checks\stage-windows-native-evidence.ps1" `
            -SourceBase $work -InputPath $inputs -OutputRoot "$env:RUNNER_TEMP\finished-windows-startup-evidence"
      - name: Preserve credential-free fresh install, startup and cleanup evidence
        if: ${{ always() && steps.startup_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: finished-windows-installed-startup-${{ needs.windows-finished-request.outputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/finished-windows-startup-evidence/
          if-no-files-found: warn
          retention-days: 14

  windows-finished-runtime-qualification:
    name: Qualify and independently review the selected runtime before UI packaging
    needs: [windows-finished-request, windows-finished-installer, windows-compiled-application]
    if: ${{ always() && !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.windows-finished-request.result == 'success' && contains(fromJSON('["openclaw","hermes"]'), needs.windows-finished-request.outputs.agent) && needs.windows-finished-request.outputs.trusted_main == 'true' && needs.windows-finished-request.outputs.exact_workflow == 'true' && needs.windows-finished-request.outputs.exact_pr == 'true' && needs.windows-finished-request.outputs.credential_authorized == 'true' && needs.windows-finished-request.outputs.validation_scope == 'full-acceptance' && needs.windows-finished-installer.result == 'success' && needs.windows-compiled-application.result == 'success' }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
    uses: ./.github/workflows/windows-native-installer-trusted.yaml
    with:
      qualification_phase: runtime-bootstrap
      pr_number: ${{ needs.windows-finished-request.outputs.pr_number }}
      candidate_repository: ${{ needs.windows-finished-request.outputs.candidate_repository }}
      candidate_sha: ${{ needs.windows-finished-request.outputs.candidate_sha }}
      base_sha: ${{ needs.windows-finished-request.outputs.base_sha }}
      workflow_sha: ${{ needs.windows-finished-request.outputs.workflow_sha }}
      agent: ${{ needs.windows-finished-request.outputs.agent }}
      product_version: ${{ needs.windows-finished-request.outputs.product_version }}
      installer_cache_key: ${{ needs.windows-finished-installer.outputs.installer_cache_key }}
      installer_manifest_sha256: ${{ needs.windows-finished-installer.outputs.installer_manifest_sha256 }}
      application_manifest_sha256: ${{ needs.windows-compiled-application.outputs.application_manifest_sha256 }}

  windows-finished-reviewed-installer:
    name: Rebuild setup UI around the independently reviewed selected runtime
    needs:
      [windows-finished-request, windows-finished-installer, windows-finished-runtime-qualification]
    if: ${{ always() && !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.windows-finished-request.result == 'success' && contains(fromJSON('["openclaw","hermes"]'), needs.windows-finished-request.outputs.agent) && needs.windows-finished-installer.result == 'success' && needs.windows-finished-runtime-qualification.result == 'success' }}
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    outputs:
      installer_cache_key: ${{ steps.reviewed_manifest.outputs.cache_key }}
      installer_manifest_sha256: ${{ steps.reviewed_manifest.outputs.manifest_sha256 }}
    env:
      CANDIDATE_SHA: ${{ needs.windows-finished-request.outputs.candidate_sha }}
      CONTROLLER_SHA: ${{ needs.windows-finished-request.outputs.workflow_sha }}
      PRODUCT_VERSION: ${{ needs.windows-finished-request.outputs.product_version }}
      SELECTED_AGENT: ${{ needs.windows-finished-request.outputs.agent }}
    steps:
      - name: Check out exact candidate packaging source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.windows-finished-request.outputs.candidate_repository }}
          ref: ${{ needs.windows-finished-request.outputs.candidate_sha }}
          path: candidate
          persist-credentials: false
      - name: Check out exact trusted transfer verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NVIDIA/NemoClaw
          ref: ${{ needs.windows-finished-request.outputs.workflow_sha }}
          path: controller
          persist-credentials: false
      - name: Restore original same-run package and retained build inputs
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/finished-windows-product-transfer
          key: ${{ needs.windows-finished-installer.outputs.installer_cache_key }}
          fail-on-cache-miss: true
      - name: Download independently reviewed runtime availability
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.windows-finished-runtime-qualification.outputs.availability_id }}
          path: ${{ runner.temp }}/reviewed-runtime-availability
          merge-multiple: true
      - name: Verify original package and exact reviewed decision before executable use
        shell: pwsh
        env:
          INSTALLER_MANIFEST: ${{ needs.windows-finished-installer.outputs.installer_manifest_sha256 }}
          AVAILABILITY_SHA256: ${{ needs.windows-finished-runtime-qualification.outputs.availability_sha256 }}
        run: |
          $head = (& git -C "$env:GITHUB_WORKSPACE\controller" rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:CONTROLLER_SHA) { throw 'The reviewed packaging controller differs.' }
          $product = "$env:RUNNER_TEMP\finished-windows-product-transfer"
          $verified = @(& "$env:GITHUB_WORKSPACE\controller\scripts\checks\windows-native-transfer.ps1" -Mode Verify -Root $product `
            -Kind finished-installer -SourceRevision $env:CANDIDATE_SHA -Agent $env:SELECTED_AGENT `
            -RunId $env:GITHUB_RUN_ID -RunAttempt $env:GITHUB_RUN_ATTEMPT -ExpectedManifestSha256 $env:INSTALLER_MANIFEST)
          if ($verified.Count -ne 1 -or [string]$verified[0] -cne $env:INSTALLER_MANIFEST) { throw 'The original package transfer changed.' }
          $decision = Get-Item -LiteralPath "$env:RUNNER_TEMP\reviewed-runtime-availability\reviewed-availability.json" -Force
          if ($decision -isnot [IO.FileInfo] -or $decision.Length -le 0 -or $decision.Length -gt 65536 -or
              ($decision.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or $env:AVAILABILITY_SHA256 -cnotmatch '^[a-f0-9]{64}$' -or
              (Get-FileHash -LiteralPath $decision.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:AVAILABILITY_SHA256) {
            throw 'The independently reviewed decision changed.'
          }
          $work = "$env:RUNNER_TEMP\finished-windows"
          if (Test-Path -LiteralPath $work) { throw 'The reviewed packaging work directory must be fresh.' }
          [void][IO.Directory]::CreateDirectory($work)
          Copy-Item -LiteralPath "$product\package" -Destination "$work\unqualified-package" -Recurse
          Copy-Item -LiteralPath "$product\assembled" -Destination "$work\assembled" -Recurse
          foreach ($name in @('host', 'system-drive-helper', 'system-drive-proof')) {
            Copy-Item -LiteralPath "$product\recomposition-inputs\$name" -Destination "$work\$name" -Recurse
          }
      - name: Prepare pinned native packaging SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.419
      - name: Prepare pinned build-only Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.1.0
        with:
          python-version: 3.13.13
          architecture: arm64
      - name: Rebuild native UI MSI and Burn without rebuilding the qualified runtime
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          $work = "$env:RUNNER_TEMP\finished-windows"
          $tools = "$work\tools"
          [IO.File]::WriteAllText("$work\global.json", '{"sdk":{"version":"8.0.419","rollForward":"disable","allowPrerelease":false}}', [Text.UTF8Encoding]::new($false))
          Push-Location $work
          try {
            & "$env:GITHUB_WORKSPACE\candidate\packaging\windows\installer\install-pinned-wix.ps1" -ToolDirectory $tools
            & "$env:GITHUB_WORKSPACE\candidate\packaging\windows\installer\build-immutable-package.ps1" `
              -SourceRoot "$env:GITHUB_WORKSPACE\candidate" -SourceRevision $env:CANDIDATE_SHA -ProductVersion $env:PRODUCT_VERSION `
              -HostPayloadRoot "$work\host" -RuntimeAssemblyRoot "$work\assembled" -OutputDirectory "$work\package" `
              -UnqualifiedPackageDirectory "$work\unqualified-package" -ReviewedAvailability "$env:RUNNER_TEMP\reviewed-runtime-availability\reviewed-availability.json" `
              -PythonPath (Get-Command python.exe -CommandType Application | Select-Object -First 1).Source `
              -DotNetPath (Get-Command dotnet.exe -CommandType Application | Select-Object -First 1).Source -WixPath "$tools\wix.exe" `
              -SystemDrivePrepPath "$work\system-drive-helper\NemoClawHostPreparation.exe" `
              -SystemDriveBuildReceipt "$work\system-drive-helper\build-receipt.json" -SystemDriveProofDirectory "$work\system-drive-proof"
          } finally { Pop-Location }
          Copy-Item -LiteralPath "$env:RUNNER_TEMP\reviewed-runtime-availability\reviewed-availability.json" -Destination "$work\package\reviewed-availability.json"
          $package = "$work\package"
          $paths = @('build/BootstrapperPayloads.wxs','build/payload/mxc/wxc-host-prep.exe','build/payload/mxc/wxc-exec.exe') + @(Get-ChildItem -LiteralPath "$package\build\bootstrapper" -File | ForEach-Object { 'build/bootstrapper/' + $_.Name })
          $files = @($paths | ForEach-Object { $file = Join-Path $package $_; @{file=$_;bytes=(Get-Item -LiteralPath $file).Length;sha256=(Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()} })
          [IO.File]::WriteAllText("$package\migration-inputs.json", (@{schemaVersion=1;sourceRevision=$env:CANDIDATE_SHA;files=$files}|ConvertTo-Json -Depth 5), [Text.UTF8Encoding]::new($false))
      - name: Seal the rebuilt installer under a distinct same-run identity
        id: reviewed_manifest
        shell: pwsh
        run: |
          $work = "$env:RUNNER_TEMP\finished-windows"
          $transfer = "$env:RUNNER_TEMP\finished-windows-reviewed-transfer"
          if (Test-Path -LiteralPath $transfer) { throw 'The reviewed installer transfer must be fresh.' }
          [void][IO.Directory]::CreateDirectory($transfer)
          Copy-Item -LiteralPath "$work\package" -Destination "$transfer\package" -Recurse
          Copy-Item -LiteralPath "$work\assembled" -Destination "$transfer\assembled" -Recurse
          Copy-Item -LiteralPath "$env:RUNNER_TEMP\finished-windows-product-transfer\compiled-application" -Destination "$transfer\compiled-application" -Recurse
          $manifest = @(& "$env:GITHUB_WORKSPACE\controller\scripts\checks\windows-native-transfer.ps1" -Mode Create -Root $transfer `
            -Kind finished-installer -SourceRevision $env:CANDIDATE_SHA -Agent $env:SELECTED_AGENT `
            -RunId $env:GITHUB_RUN_ID -RunAttempt $env:GITHUB_RUN_ATTEMPT)
          if ($manifest.Count -ne 1 -or [string]$manifest[0] -cnotmatch '^[a-f0-9]{64}$') { throw 'The reviewed installer transfer manifest failed.' }
          # Cache versions include the saved path. Preserve the original locally,
          # then publish the new bytes from the same path every consumer restores.
          $cacheRoot = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\') + '\'
          $product = [IO.Path]::GetFullPath((Join-Path $cacheRoot 'finished-windows-product-transfer'))
          $original = [IO.Path]::GetFullPath((Join-Path $work 'original-transfer'))
          foreach ($candidate in @($transfer, $product, $original)) {
            if (-not [IO.Path]::GetFullPath($candidate).StartsWith($cacheRoot, [StringComparison]::OrdinalIgnoreCase)) {
              throw 'The reviewed cache relocation escaped the runner temporary directory.'
            }
          }
          if (Test-Path -LiteralPath $original) { throw 'The original transfer preservation path must be fresh.' }
          Move-Item -LiteralPath $product -Destination $original
          Move-Item -LiteralPath $transfer -Destination $product
          "manifest_sha256=$([string]$manifest[0])" >> $env:GITHUB_OUTPUT
          "cache_key=windows-finished-reviewed-installer-v1-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:CANDIDATE_SHA-$env:SELECTED_AGENT" >> $env:GITHUB_OUTPUT
      - name: Retain rebuilt executables only in the same-run private cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/finished-windows-product-transfer
          key: ${{ steps.reviewed_manifest.outputs.cache_key }}
      - name: Stage only non-runnable reviewed build evidence
        id: reviewed_evidence
        if: ${{ always() }}
        shell: pwsh
        run: |
          $work = "$env:RUNNER_TEMP\finished-windows"
          $inputs = @()
          foreach ($pattern in @("$work\package\*.json", "$work\package\build\*.log", "$work\tools\wix-input.json")) {
            $inputs += @(Get-ChildItem -Path $pattern -File -ErrorAction SilentlyContinue | ForEach-Object FullName)
          }
          & "$env:GITHUB_WORKSPACE\controller\scripts\checks\stage-windows-native-evidence.ps1" `
            -SourceBase $work -InputPath $inputs -OutputRoot "$env:RUNNER_TEMP\finished-windows-reviewed-evidence"
      - name: Preserve reviewed build diagnostics only
        if: ${{ always() && steps.reviewed_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: finished-windows-reviewed-evidence-${{ needs.windows-finished-request.outputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/finished-windows-reviewed-evidence/
          if-no-files-found: warn
          retention-days: 14

  windows-finished-candidate-migration:
    name: Credential-free candidate migration controllers (ARM64)
    needs:
      [windows-finished-request, windows-finished-installer, windows-finished-reviewed-installer]
    if: ${{ always() && !cancelled() && needs.windows-finished-request.result == 'success' && needs.windows-finished-request.outputs.request_kind != 'candidate-build' && needs.windows-finished-installer.result == 'success' && needs.windows-finished-reviewed-installer.result == 'success' }}
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    outputs:
      evidence_id: ${{ steps.migration_upload.outputs.artifact-id }}
      proof_sha256: ${{ steps.migration_proof.outputs.sha256 }}
    env:
      CANDIDATE_SHA: ${{ needs.windows-finished-request.outputs.candidate_sha }}
      SELECTED_AGENT: ${{ needs.windows-finished-request.outputs.agent }}
      PRODUCT_VERSION: ${{ needs.windows-finished-request.outputs.product_version }}
      INSTALLER_MANIFEST: ${{ needs.windows-finished-reviewed-installer.outputs.installer_manifest_sha256 }}
    steps:
      - name: Check out the exact candidate migration controllers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.windows-finished-request.outputs.candidate_repository }}
          ref: ${{ needs.windows-finished-request.outputs.candidate_sha }}
          path: candidate
          persist-credentials: false
      - name: Restore exact same-run installer cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/finished-windows-product-transfer
          key: ${{ needs.windows-finished-reviewed-installer.outputs.installer_cache_key }}
          fail-on-cache-miss: true
      - name: Verify and materialize candidate migration inputs
        shell: pwsh
        run: |
          $head = (& git -C "$env:GITHUB_WORKSPACE\candidate" rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:CANDIDATE_SHA) { throw 'The candidate migration checkout differs.' }
          $product = "$env:RUNNER_TEMP\finished-windows-product-transfer"
          $verified = @(& "$env:GITHUB_WORKSPACE\candidate\scripts\checks\windows-native-transfer.ps1" -Mode Verify -Root $product `
            -Kind finished-installer -SourceRevision $env:CANDIDATE_SHA -Agent $env:SELECTED_AGENT `
            -RunId $env:GITHUB_RUN_ID -RunAttempt $env:GITHUB_RUN_ATTEMPT -ExpectedManifestSha256 $env:INSTALLER_MANIFEST)
          if ($verified.Count -ne 1 -or [string]$verified[0] -cne $env:INSTALLER_MANIFEST) { throw 'The candidate migration input differs from its producer.' }
          $work = "$env:RUNNER_TEMP\finished-windows"
          if (Test-Path -LiteralPath $work) { throw 'Candidate migration requires a fresh work directory.' }
          [void][IO.Directory]::CreateDirectory($work)
          Copy-Item -LiteralPath "$product\package" -Destination "$work\package" -Recurse
          Copy-Item -LiteralPath "$product\assembled" -Destination "$work\assembled" -Recurse
      - name: Prepare pinned candidate fixture compiler
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.95.0
          target: aarch64-pc-windows-msvc
          cache: false
      - name: Exercise candidate Burn fixture and diagnostics
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          $tools = "$env:RUNNER_TEMP\finished-windows\setup-regression-tools"
          & "$env:GITHUB_WORKSPACE\candidate\packaging\windows\installer\install-pinned-wix.ps1" -ToolDirectory $tools
          $owner = "$env:GITHUB_WORKSPACE\candidate\packaging\windows\installer"
          $work = "$env:RUNNER_TEMP\finished-windows"
          & "$owner\build-burn-diagnostics-fixture.ps1" -SourceRoot "$env:GITHUB_WORKSPACE\candidate" -PackageDirectory "$work\package" -OutputDirectory "$work\diagnostics-fixture" -ProductVersion $env:PRODUCT_VERSION -WixPath "$tools\wix.exe"
          & "$owner\test-burn-diagnostics.ps1" -FixtureDirectory "$work\diagnostics-fixture" -OutputDirectory "$work\burn-diagnostics" -Agent $env:SELECTED_AGENT
      - name: Exercise candidate preview migration and selective reset
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          & "$env:GITHUB_WORKSPACE\candidate\packaging\windows\installer\run-preview-migration.ps1" -WorkDirectory "$env:RUNNER_TEMP\finished-windows" -ProductVersion $env:PRODUCT_VERSION -NewAgent $env:SELECTED_AGENT
      - name: Bind candidate migration proof to controller and installer
        id: migration_proof
        shell: pwsh
        run: |
          $work = "$env:RUNNER_TEMP\finished-windows"
          & git -C "$env:GITHUB_WORKSPACE\candidate" diff --exit-code $env:CANDIDATE_SHA -- packaging/windows
          if ($LASTEXITCODE -ne 0) { throw 'Candidate migration source changed during qualification.' }
          $reports = @('diagnostics-fixture/fixture.json', 'burn-diagnostics/burn-diagnostics.json', 'migration/preview-migration.json')
          $files = @($reports | ForEach-Object {
            $file = Get-Item -LiteralPath (Join-Path $work $_) -Force
            if ($file.PSIsContainer -or $file.Attributes.HasFlag([IO.FileAttributes]::ReparsePoint) -or $file.Length -gt 1048576) { throw 'Candidate migration evidence is invalid.' }
            @{file=$_;sha256=(Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()}
          })
          $burn = Get-Content -LiteralPath "$work\burn-diagnostics\burn-diagnostics.json" -Raw | ConvertFrom-Json
          $migration = Get-Content -LiteralPath "$work\migration\preview-migration.json" -Raw | ConvertFrom-Json
          if ($burn.sourceRevision -cne $env:CANDIDATE_SHA -or $burn.status -cne 'pass' -or $burn.packageNotInstalled -ne $true -or @($burn.cleanupErrors).Count -ne 0 -or
              $migration.sourceRevision -cne $env:CANDIDATE_SHA -or $migration.status -cne 'pass' -or $migration.installationRootRemoved -ne $true -or @($migration.cleanupErrors).Count -ne 0 -or @($migration.cases).Count -ne 2 -or
              @($migration.cases | Where-Object resetVerified -NE $true).Count -ne 0) { throw 'Candidate migration did not complete cleanly.' }
          $proof = "$work\candidate-migration-controller.json"
          [IO.File]::WriteAllText($proof, (@{
            schemaVersion=1;classification='same-run-candidate-migration-controllers';passed=$true
            controllerSourceRevision=$env:CANDIDATE_SHA;artifactSourceRevision=$env:CANDIDATE_SHA
            installerManifestSha256=$env:INSTALLER_MANIFEST;agent=$env:SELECTED_AGENT
            workflowRunId=$env:GITHUB_RUN_ID;workflowRunAttempt=$env:GITHUB_RUN_ATTEMPT;files=$files
          } | ConvertTo-Json -Depth 5), [Text.UTF8Encoding]::new($false))
          "sha256=$((Get-FileHash -LiteralPath $proof -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Stage only non-runnable candidate migration evidence
        id: migration_evidence
        if: ${{ always() }}
        shell: pwsh
        run: |
          $work = "$env:RUNNER_TEMP\finished-windows"
          $inputs = @("$work\candidate-migration-controller.json", "$work\diagnostics-fixture\fixture.json", "$work\setup-regression-tools\wix-input.json")
          $allowed = @('.csv', '.etl', '.jpeg', '.jpg', '.json', '.log', '.md', '.png', '.txt', '.xml')
          foreach ($directory in @("$work\burn-diagnostics", "$work\migration")) {
            $inputs += @(Get-ChildItem -LiteralPath $directory -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Extension -in $allowed } | ForEach-Object FullName)
          }
          & "$env:GITHUB_WORKSPACE\candidate\scripts\checks\stage-windows-native-evidence.ps1" `
            -SourceBase $work -InputPath $inputs -OutputRoot "$env:RUNNER_TEMP\candidate-windows-migration-evidence"
      - name: Preserve candidate migration controller evidence
        id: migration_upload
        if: ${{ always() && steps.migration_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-windows-migration-${{ needs.windows-finished-request.outputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-windows-migration-evidence/
          if-no-files-found: error
          retention-days: 14

  # The same-commit reusable controller is callable only after both workflow
  # files land on main. It repeats every identity check and owns both protected
  # environments; this feature-branch workflow is not itself a trust boundary.
  windows-finished-trusted-qualification:
    name: Trusted full acceptance, migration and qualified publication
    needs:
      [
        windows-finished-request,
        windows-finished-installer,
        windows-compiled-application,
        windows-finished-candidate-migration,
        windows-finished-reviewed-installer,
      ]
    if: ${{ always() && !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.windows-finished-request.result == 'success' && needs.windows-finished-request.outputs.trusted_main == 'true' && needs.windows-finished-request.outputs.exact_workflow == 'true' && needs.windows-finished-request.outputs.exact_pr == 'true' && needs.windows-finished-request.outputs.credential_authorized == 'true' && needs.windows-finished-request.outputs.validation_scope == 'full-acceptance' && needs.windows-finished-installer.result == 'success' && needs.windows-compiled-application.result == 'success' && needs.windows-finished-candidate-migration.result == 'success' }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
    uses: ./.github/workflows/windows-native-installer-trusted.yaml
    with:
      qualification_phase: final
      pr_number: ${{ needs.windows-finished-request.outputs.pr_number }}
      candidate_repository: ${{ needs.windows-finished-request.outputs.candidate_repository }}
      candidate_sha: ${{ needs.windows-finished-request.outputs.candidate_sha }}
      base_sha: ${{ needs.windows-finished-request.outputs.base_sha }}
      workflow_sha: ${{ needs.windows-finished-request.outputs.workflow_sha }}
      agent: ${{ needs.windows-finished-request.outputs.agent }}
      product_version: ${{ needs.windows-finished-request.outputs.product_version }}
      installer_cache_key: ${{ needs.windows-finished-reviewed-installer.outputs.installer_cache_key }}
      installer_manifest_sha256: ${{ needs.windows-finished-reviewed-installer.outputs.installer_manifest_sha256 }}
      application_manifest_sha256: ${{ needs.windows-compiled-application.outputs.application_manifest_sha256 }}
      candidate_migration_evidence_id: ${{ needs.windows-finished-candidate-migration.outputs.evidence_id }}
      candidate_migration_proof_sha256: ${{ needs.windows-finished-candidate-migration.outputs.proof_sha256 }}

  windows-runtime-preflight:
    name: Windows observer and cleanup preflight (Node ${{ matrix.node }})
    needs: windows-finished-request
    if: ${{ needs.windows-finished-request.result == 'success' && (needs.windows-finished-request.outputs.build_allowed == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.test_native_windows_runtime || (inputs.probe_official_hermes_components && inputs.official_hermes_phase == 'application')))) }}
    permissions:
      contents: read
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22.23.2", "24.18.1"]
    steps:
      - name: Check out the exact candidate preflight
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.windows-finished-request.outputs.candidate_repository }}
          ref: ${{ needs.windows-finished-request.outputs.candidate_sha }}
          persist-credentials: false
      - name: Set up pinned ARM64 preflight Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          architecture: arm64
      - name: Set up the pinned gateway certificate control compiler
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.419
      - name: Verify private gateway certificate generation and Node interoperability
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'windows-runtime-preflight'
          [void][IO.Directory]::CreateDirectory($output)
          $helperRoot = Join-Path $env:RUNNER_TEMP 'gateway-tls-helper'
          & dotnet publish packaging/windows/tests/gateway-auth/Gateway.Auth.Controls.csproj `
            --configuration Release --runtime win-arm64 --self-contained true --output $helperRoot
          if ($LASTEXITCODE -ne 0) { throw 'The self-contained gateway certificate fixture did not build.' }
          $env:NEMOCLAW_GATEWAY_TLS_CONTROL = Join-Path $helperRoot 'Gateway.Auth.Controls.exe'
          $log = Join-Path $output 'gateway-certificate-tests.log'
          try {
            $ErrorActionPreference = 'Continue'
            & $env:NEMOCLAW_GATEWAY_TLS_CONTROL 2>&1 | Tee-Object -FilePath $log
            $result = $LASTEXITCODE
          } finally { $ErrorActionPreference = 'Stop' }
          if ($result -ne 0 -or (Get-Content -LiteralPath $log -Raw) -notmatch '(?m)^Gateway TLS controls: 14 passed; no keys written to disk or certificate stores\.\r?$') {
            throw 'All fourteen gateway certificate controls must execute.'
          }
          $log = Join-Path $output 'gateway-tls-node-tests.log'
          try {
            $ErrorActionPreference = 'Continue'
            & node --experimental-strip-types --no-warnings --test --test-reporter=tap `
              packaging/windows/runtime/native-gateway-tls.test.mts packaging/windows/runtime/native-gateway-session.test.mts `
              2>&1 | Tee-Object -FilePath $log
            $result = $LASTEXITCODE
          } finally { $ErrorActionPreference = 'Stop' }
          $text = Get-Content -LiteralPath $log -Raw
          if ($result -ne 0 -or $text -notmatch '(?m)^# pass 30\r?$' -or $text -notmatch '(?m)^# skipped 0\r?$') {
            throw 'All thirty import-boundary, command-custody, private-session, private-pipe and Node TLS controls must execute without skips.'
          }
          $ownerRoot = Join-Path $env:RUNNER_TEMP 'gateway-process-helper'
          & dotnet publish packaging/windows/tests/gateway-process/Gateway.Process.Controls.csproj `
            --configuration Release --runtime win-arm64 --self-contained true --output $ownerRoot
          if ($LASTEXITCODE -ne 0) { throw 'The gateway process-ownership fixture did not build.' }
          $env:NEMOCLAW_GATEWAY_PROCESS_CONTROL = Join-Path $ownerRoot 'Gateway.Process.Controls.exe'
          $log = Join-Path $output 'gateway-process-tests.log'
          try {
            $ErrorActionPreference = 'Continue'
            & node --experimental-strip-types --no-warnings --test --test-reporter=tap `
              packaging/windows/runtime/native-gateway-process.test.mts 2>&1 | Tee-Object -FilePath $log
            $result = $LASTEXITCODE
          } finally { $ErrorActionPreference = 'Stop' }
          $text = Get-Content -LiteralPath $log -Raw
          if ($result -ne 0 -or $text -notmatch '(?m)^# pass 6\r?$' -or $text -notmatch '(?m)^# skipped 0\r?$') {
            throw 'All six gateway process-ownership controls must execute without skips.'
          }
      - name: Verify observer shutdown and qualification cleanup before building
        shell: powershell
        env:
          PREFLIGHT_NODE_VERSION: ${{ matrix.node }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $identityText = & node --print 'JSON.stringify({platform:process.platform,arch:process.arch,version:process.versions.node})'
          if ($LASTEXITCODE -ne 0) { throw 'Preflight Node identity could not be read.' }
          $identity = $identityText | ConvertFrom-Json
          if ($identity.platform -cne 'win32' -or $identity.arch -cne 'arm64' -or $identity.version -cne $env:PREFLIGHT_NODE_VERSION) {
            throw 'Preflight requires the selected native Windows ARM64 Node.'
          }
          $output = Join-Path $env:RUNNER_TEMP 'windows-runtime-preflight'
          [void][IO.Directory]::CreateDirectory($output)
          $log = Join-Path $output 'observer-cleanup-tests.log'
          $tests = @(
            (Join-Path $env:GITHUB_WORKSPACE 'packaging/windows/app/runtime-published-resources.test.mts'),
            (Join-Path $env:GITHUB_WORKSPACE 'packaging/windows/installer/build-immutable-package-cleanup.test.mts'),
            (Join-Path $env:GITHUB_WORKSPACE 'packaging/windows/installer/control-installed-openclaw-input.test.mts'),
            (Join-Path $env:GITHUB_WORKSPACE 'packaging/windows/installer/qualify-installed-openclaw.test.mts'),
            (Join-Path $env:GITHUB_WORKSPACE 'packaging/windows/installer/review-hermes-availability.test.mts'),
            (Join-Path $env:GITHUB_WORKSPACE 'packaging/windows/installer/mxc-probe-identity.test.mts'),
            (Join-Path $env:GITHUB_WORKSPACE 'packaging/windows/installer/install-pinned-wix.test.mts'),
            (Join-Path $env:GITHUB_WORKSPACE 'packaging/windows/installer/runtime-image-storage.test.mts'),
            (Join-Path $env:GITHUB_WORKSPACE 'packaging/windows/runtime/native-ui-lifecycle.test.mts'),
            (Join-Path $env:GITHUB_WORKSPACE 'packaging/windows/runtime/native-ui-relay.test.mts'),
            (Join-Path $env:GITHUB_WORKSPACE 'packaging/windows/runtime/native-web-session.test.mts'),
            (Join-Path $env:GITHUB_WORKSPACE 'packaging/windows/runtime/native-gateway-configuration.test.mts'),
            (Join-Path $env:GITHUB_WORKSPACE 'packaging/windows/runtime/native-openclaw-models.test.mts'),
            (Join-Path $env:GITHUB_WORKSPACE 'packaging/windows/runtime/native-turn-cleanup.test.mts'),
            (Join-Path $env:GITHUB_WORKSPACE 'packaging/windows/runtime/native-hermes-turn-cleanup.test.mts')
          )
          try {
            $ErrorActionPreference = 'Continue'
            & node --experimental-strip-types --no-warnings --test --test-reporter=tap @tests `
              2>&1 | Tee-Object -FilePath $log
            $result = $LASTEXITCODE
          } finally { $ErrorActionPreference = 'Stop' }
          if ($result -ne 0) { throw 'Windows observer or qualification cleanup preflight failed.' }
      - name: Verify compiled MXC probe admission without running MXC
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:RUNNER_TEMP 'windows-runtime-preflight\probe-identity-tests.log'
          try {
            $ErrorActionPreference = 'Continue'
            & dotnet run --configuration Release --project `
              packaging/windows/tests/host-preparation-diagnostics/HostPreparation.Diagnostics.Controls.csproj `
              2>&1 | Tee-Object -FilePath $log
            $result = $LASTEXITCODE
          } finally { $ErrorActionPreference = 'Stop' }
          if ($result -ne 0) { throw 'The compiled MXC probe admission controls failed.' }
      - name: Verify bootstrapper choices through the runtime configuration writer
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:RUNNER_TEMP 'bootstrapper-configuration-controls'
          & dotnet build packaging/windows/tests/prebuilt-configuration/PrebuiltConfiguration.csproj --configuration Release --output $build
          if ($LASTEXITCODE -ne 0) { throw 'The bootstrapper configuration controls did not build.' }
          $requests = Join-Path $env:RUNNER_TEMP 'windows-runtime-preflight\bootstrapper-requests.log'
          & dotnet (Join-Path $build 'PrebuiltConfiguration.dll') | Set-Content -LiteralPath $requests -Encoding UTF8
          if ($LASTEXITCODE -ne 0) { throw 'The bootstrapper configuration controls failed.' }
          & node --experimental-strip-types --no-warnings packaging/windows/tests/prebuilt-configuration/verify-runtime-requests.mts $requests
          if ($LASTEXITCODE -ne 0) { throw 'Bootstrapper choices did not match the runtime configuration contract.' }
      - name: Retain preflight results for each Node version
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-runtime-preflight-${{ matrix.node }}-${{ needs.windows-finished-request.outputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-runtime-preflight/*.log
          if-no-files-found: warn
          retention-days: 14

  windows-compiled-application:
    name: Compile exact Windows application units (ARM64)
    needs: [windows-finished-request, windows-runtime-preflight]
    outputs:
      application_cache_key: ${{ steps.transfer_manifest.outputs.cache_key }}
      application_manifest_sha256: ${{ steps.transfer_manifest.outputs.manifest_sha256 }}
    if: ${{ always() && !cancelled() && needs.windows-finished-request.result == 'success' && needs.windows-runtime-preflight.result == 'success' && ((needs.windows-finished-request.outputs.build_allowed == 'true') || (github.event_name == 'workflow_dispatch' && inputs.probe_official_hermes_components && inputs.official_hermes_phase == 'application')) }}
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: ${{ needs.windows-finished-request.outputs.candidate_sha }}
      SELECTED_AGENT: ${{ needs.windows-finished-request.outputs.agent }}
    steps:
      - name: Check out Windows application packaging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.windows-finished-request.outputs.candidate_repository }}
          ref: ${{ needs.windows-finished-request.outputs.candidate_sha }}
          persist-credentials: false
      - name: Prepare a fresh compiled application workspace
        shell: pwsh
        run: |
          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          $work = [IO.Path]::GetFullPath((Join-Path $runnerTemp 'compiled-windows-app'))
          if ([IO.Path]::GetRelativePath($runnerTemp, $work) -cne 'compiled-windows-app') {
            throw 'The compiled application workspace escaped RUNNER_TEMP.'
          }
          if (Test-Path -LiteralPath $work) {
            Remove-Item -LiteralPath $work -Recurse -Force
          }
          New-Item -ItemType Directory -Path $work | Out-Null
      - name: Reject unsupported finished-installer validation scopes
        if: ${{ needs.windows-finished-request.outputs.build_allowed == 'true' }}
        shell: pwsh
        env:
          VALIDATION_SCOPE: ${{ needs.windows-finished-request.outputs.validation_scope }}
        run: |
          if ($env:SELECTED_AGENT -ceq 'hermes' -and $env:VALIDATION_SCOPE -ceq 'startup-only') { throw 'Hermes requires its existing full-acceptance lane.' }
      - name: Prepare the pinned native application compiler
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          & packaging/windows/app/prepare-app-node.ps1 `
            -LockPath packaging/windows/hermes/official-runtime.lock.json `
            -OutputDirectory "$env:RUNNER_TEMP\compiled-windows-app\node"
      - name: Verify installed acceptance controller Windows compatibility
        if: ${{ needs.windows-finished-request.outputs.build_allowed == 'true' }}
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          $work = "$env:RUNNER_TEMP\compiled-windows-app"
          $output = "$work\controls"
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          $tests = @(
            'packaging/windows/installer/control-installed-openclaw-input.test.mts',
            'packaging/windows/installer/run-installed-acceptance.test.mts',
            'packaging/windows/installer/qualify-finished-package.test.mts',
            'packaging/windows/runtime/native-ui-tunnel.test.mts'
          )
          & "$work\node\node.exe" --experimental-strip-types --no-warnings --test @tests `
            1>"$output\installed-acceptance-controller.stdout.log" `
            2>"$output\installed-acceptance-controller.stderr.log"
          if ($LASTEXITCODE -ne 0) { throw 'The Windows installed-acceptance controller controls failed.' }
          & "$work\node\node.exe" --experimental-strip-types --no-warnings --test `
            packaging/windows/app/choice-inspect-diagnostics.test.mts `
            packaging/windows/installer/qualify-installed-hermes.test.mts `
            packaging/windows/installer/qualify-installed-openclaw.test.mts `
            packaging/windows/installer/windows-native-transfer.test.mts `
            packaging/windows/runtime/native-configuration-credentials.test.mts `
            packaging/windows/runtime/native-setup-transaction.test.mts `
            packaging/windows/runtime/native-remove-data.test.mts `
            packaging/windows/runtime/native-local-models.test.mts `
            packaging/windows/runtime/native-bundled-inference.test.mts `
            packaging/windows/runtime/native-inference.test.mts `
            packaging/windows/runtime/native-setup-local-models.test.mts
          if ($LASTEXITCODE -ne 0) { throw 'The Windows Hermes and configuration transaction controls failed.' }
          $files = @($tests | ForEach-Object {
            $file = Join-Path $env:GITHUB_WORKSPACE $_
            @{ file = $_; bytes = (Get-Item -LiteralPath $file).Length; sha256 = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant() }
          })
          [IO.File]::WriteAllText("$output\installed-acceptance-controller.json", (@{
            schemaVersion = 1
            classification = 'same-run-installed-acceptance-controller-controls'
            sourceRevision = $env:GITHUB_SHA
            nodeSha256 = (Get-FileHash -LiteralPath "$work\node\node.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
            passed = $true
            files = $files
          } | ConvertTo-Json -Depth 5), [Text.UTF8Encoding]::new($false))
      - name: Restore immutable application build inputs
        if: ${{ needs.windows-finished-request.outputs.agent == 'openclaw' }}
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          python packaging/windows/app/materialize-openclaw-build.py `
            --output "$env:RUNNER_TEMP\compiled-windows-app\inputs" `
            --cache "$env:RUNNER_TEMP\compiled-windows-app\downloads"
          if ($LASTEXITCODE -ne 0) { throw 'Application build inputs failed verification.' }
      - name: Verify Windows native plugin file URL loading
        if: ${{ needs.windows-finished-request.outputs.agent == 'openclaw' }}
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          & "$env:RUNNER_TEMP\compiled-windows-app\node\node.exe" `
            --experimental-strip-types packaging/windows/app/test-windows-plugin-file-url.mts `
            --source-root "$env:RUNNER_TEMP\compiled-windows-app\inputs\node_modules\openclaw"
          if ($LASTEXITCODE -ne 0) { throw 'Windows native plugin loading controls failed.' }
          & "$env:RUNNER_TEMP\compiled-windows-app\node\node.exe" `
            --experimental-strip-types packaging/windows/app/test-windows-update-owner.mts `
            --source-root "$env:RUNNER_TEMP\compiled-windows-app\inputs\node_modules\openclaw"
          if ($LASTEXITCODE -ne 0) { throw 'Installer-owned update controls failed.' }
          & "$env:RUNNER_TEMP\compiled-windows-app\node\node.exe" `
            --experimental-strip-types packaging/windows/app/test-windows-configured-plugin-install.mts `
            --source-root "$env:RUNNER_TEMP\compiled-windows-app\inputs\node_modules\openclaw"
          if ($LASTEXITCODE -ne 0) { throw 'Installer-owned configured-plugin controls failed.' }
          & "$env:RUNNER_TEMP\compiled-windows-app\node\node.exe" `
            --experimental-strip-types packaging/windows/app/test-windows-eager-ollama.mts `
            --source-root "$env:RUNNER_TEMP\compiled-windows-app\inputs\node_modules\openclaw" `
            --tool-root "$env:RUNNER_TEMP\compiled-windows-app\inputs\tools"
          if ($LASTEXITCODE -ne 0) { throw 'Eager Ollama compilation controls failed.' }
          & "$env:RUNNER_TEMP\compiled-windows-app\node\node.exe" `
            --experimental-strip-types packaging/windows/app/test-prebuilt-plugin-consent-records.mts `
            --source-root "$env:RUNNER_TEMP\compiled-windows-app\inputs\node_modules\openclaw" `
            --tool-root "$env:RUNNER_TEMP\compiled-windows-app\inputs\tools"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged plugin consent persistence controls failed.' }
      - name: Compile the OpenClaw application unit
        if: ${{ needs.windows-finished-request.outputs.agent == 'openclaw' }}
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          & "$env:RUNNER_TEMP\compiled-windows-app\node\node.exe" `
            --experimental-strip-types --max-old-space-size=8192 `
            packaging/windows/app/build-openclaw-app.mts `
            --source-root "$env:RUNNER_TEMP\compiled-windows-app\inputs\node_modules\openclaw" `
            --tool-root "$env:RUNNER_TEMP\compiled-windows-app\inputs\tools" `
            --output "$env:RUNNER_TEMP\compiled-windows-app\build"
          if ($LASTEXITCODE -ne 0) { throw 'The Windows application compilation failed.' }
      - name: Execute the compiled application through its CLI and Worker API
        if: ${{ needs.windows-finished-request.outputs.agent == 'openclaw' }}
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          & "$env:RUNNER_TEMP\compiled-windows-app\node\node.exe" `
            --experimental-strip-types packaging/windows/app/test-windows-private-directory-library.mts `
            --source-root "$env:RUNNER_TEMP\compiled-windows-app\inputs\node_modules\openclaw" `
            --app-root "$env:RUNNER_TEMP\compiled-windows-app\build\app"
          if ($LASTEXITCODE -ne 0) { throw 'The compiled private-directory permission controls failed.' }
          & "$env:RUNNER_TEMP\compiled-windows-app\node\node.exe" `
            --experimental-strip-types packaging/windows/app/test-compiled-openclaw.mts `
            --app-root "$env:RUNNER_TEMP\compiled-windows-app\build\app" `
            --output "$env:RUNNER_TEMP\compiled-windows-app\controls\compiled-openclaw"
          if ($LASTEXITCODE -ne 0) { throw 'The compiled Windows application controls failed.' }
      - name: Exercise compiled provider, tools and all packaged onboarding choices
        id: configured_choices
        if: ${{ needs.windows-finished-request.outputs.agent == 'openclaw' }}
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          $work = "$env:RUNNER_TEMP\compiled-windows-app"
          $ciNode = "$work\node\node.exe"
          $application = "$work\build\app"
          $diagnostics = "$work\build\diagnostics"
          $source = "$env:GITHUB_WORKSPACE\packaging\windows\app"
          & $ciNode --experimental-strip-types "$source\test-compiled-openclaw-model-tools.mts" `
            --app-root $application --output "$diagnostics\local-model-tools"
          if ($LASTEXITCODE -ne 0) { throw 'The compiled local-provider and actual tool execution checks failed.' }
          # OpenClaw Discord is deferred until packaged plugin provenance is supported.
          # Setup rejects that selection; its upstream trust checks remain unchanged.
          $choices = @('brave', 'slack', 'tavily')
          $checks = @($choices | ForEach-Object -Parallel {
            $ErrorActionPreference = 'Stop'
            $choice = $_
            $output = Join-Path $using:diagnostics ('choice-' + $choice)
            & $using:ciNode --experimental-strip-types (Join-Path $using:source 'test-prebuilt-choice-plugins.mts') `
              --app-root $using:application --choice $choice --output $output `
              1>($output + '.controller.stdout.log') 2>($output + '.controller.stderr.log')
            [pscustomobject]@{ choice=$choice; exitCode=$LASTEXITCODE }
          } -ThrottleLimit 4)
          $checks | ConvertTo-Json -Depth 3 | Set-Content -LiteralPath "$diagnostics\configured-choice-results.json" -Encoding utf8
          if ($checks.Count -ne 3 -or @($checks | Where-Object exitCode -NE 0).Count -ne 0) {
            throw 'A packaged onboarding choice did not complete its configured gateway checks.'
          }
      - name: Prepare the compiler for failure-only readonly-worker diagnostics
        id: readonly_diagnostic_compiler
        if: ${{ failure() && steps.configured_choices.outcome == 'failure' }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.419
      - name: Diagnose the compiled readonly worker without changing acceptance
        if: ${{ failure() && steps.configured_choices.outcome == 'failure' && steps.readonly_diagnostic_compiler.outcome == 'success' }}
        timeout-minutes: 5
        shell: pwsh
        run: |
          $work = "$env:RUNNER_TEMP\compiled-windows-app"
          $ownerRoot = "$work\readonly-process-owner"
          & dotnet publish packaging/windows/tests/gateway-process/Gateway.Process.Controls.csproj `
            --configuration Release --runtime win-arm64 --self-contained true --output $ownerRoot
          if ($LASTEXITCODE -ne 0) { throw 'The diagnostic process owner did not build.' }
          & "$work\node\node.exe" --experimental-strip-types `
            packaging/windows/app/diagnose-compiled-sqlite-readonly.mts `
            --app-root "$work\build\app" --process-owner "$ownerRoot\Gateway.Process.Controls.exe" `
            --output "$work\build\diagnostics\readonly-worker"
          if ($LASTEXITCODE -ne 0) { throw 'The readonly worker diagnostic failed; acceptance remains failed.' }
      - name: Verify the compiled dashboard and packaged resources in a real browser
        if: ${{ needs.windows-finished-request.outputs.agent == 'openclaw' }}
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          $work = "$env:RUNNER_TEMP\compiled-windows-app"
          $browsers = @(
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe",
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe"
          )
          $browser = $browsers | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $browser) { throw 'The Windows runner has no preinstalled browser for dashboard validation.' }
          & "$work\node\node.exe" --experimental-strip-types `
            packaging/windows/app/test-compiled-openclaw-gateway.mts `
            --app-root "$work\build\app" --output "$work\first-run-consent-control" `
            --browser-executable $browser --with-brave --browser-setup-control --browser-plugin-consent-control
          if ($LASTEXITCODE -ne 0) { throw 'The first-run dashboard or plugin consent control failed.' }
          & "$work\node\node.exe" --experimental-strip-types `
            packaging/windows/app/test-compiled-openclaw-gateway.mts `
            --app-root "$work\build\app" --output "$work\gateway-control" `
            --browser-executable $browser
          if ($LASTEXITCODE -ne 0) { throw 'The compiled Windows dashboard or resource control failed.' }
      - name: Prepare only shared compiler and browser-observer tools for Hermes
        if: ${{ needs.windows-finished-request.outputs.agent != 'openclaw' }}
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          python packaging/windows/distribution/prepare-native-build-tools.py `
            --output "$env:RUNNER_TEMP\compiled-windows-app\inputs" --cache "$env:RUNNER_TEMP\compiled-windows-app\downloads"
          if ($LASTEXITCODE -ne 0) { throw 'The shared runtime compiler tools failed verification.' }
      - name: Prepare the pinned executable resource injector
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          python packaging/windows/distribution/prepare-executable-tools.py `
            --output "$env:RUNNER_TEMP\compiled-windows-app\executable-tools" `
            --cache "$env:RUNNER_TEMP\compiled-windows-app\downloads"
          if ($LASTEXITCODE -ne 0) { throw 'Executable build tools failed verification.' }
      - name: Compile the native application dispatcher and static workers
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          $work = "$env:RUNNER_TEMP\compiled-windows-app"
          if ($env:SELECTED_AGENT -eq 'openclaw') {
            New-Item -ItemType Junction -Path "$work\inputs\tools\node_modules\typescript" `
              -Target "$work\inputs\node_modules\openclaw\node_modules\typescript" | Out-Null
          }
          New-Item -ItemType Junction -Path "$env:GITHUB_WORKSPACE\node_modules" `
            -Target "$work\inputs\tools\node_modules" | Out-Null
          & "$work\node\node.exe" --experimental-strip-types --no-warnings --test `
            packaging/windows/app/native-model-catalog-build.test.mts `
            packaging/windows/app/native-pipe-transport-build.test.mts `
            packaging/windows/runtime/native-inference-broker.test.mts
          if ($LASTEXITCODE -ne 0) { throw 'Native provider catalog and broker controls failed.' }
          & "$work\node\node.exe" --experimental-strip-types --no-warnings --test packaging/windows/app/runtime-external-packages.test.mts packaging/windows/app/sqlite-canonical-path.test.mts
          if ($LASTEXITCODE -ne 0) { throw 'OpenClaw dependency-location controls failed.' }
          & "$work\node\node.exe" --experimental-strip-types --no-warnings --test packaging/windows/runtime/native-openclaw-migration.test.mts
          if ($LASTEXITCODE -ne 0) { throw 'OpenClaw session migration controls failed.' }
          & "$work\node\node.exe" --experimental-strip-types `
            packaging/windows/distribution/build-native-workers.mts "$work\workers"
          if ($LASTEXITCODE -ne 0) { throw 'Static application worker compilation failed.' }
      - name: Migrate synthetic history with the compiled OpenClaw importer
        if: ${{ needs.windows-finished-request.outputs.agent == 'openclaw' }}
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          $work = "$env:RUNNER_TEMP\compiled-windows-app"
          & "$work\node\node.exe" --experimental-strip-types `
            packaging/windows/app/test-compiled-openclaw-migration.mts `
            --app-root "$work\build\app" --runtime-root $work `
            --output "$work\controls\compiled-migration"
          if ($LASTEXITCODE -ne 0) { throw 'The compiled OpenClaw history migration failed.' }
      - name: Build and execute the Windows application EXE
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          $work = "$env:RUNNER_TEMP\compiled-windows-app"
          & "$work\node\node.exe" --experimental-strip-types `
            packaging/windows/distribution/prepare-native-executable.mts `
            "$work\workers\native-runtime.cjs" `
            "$work\executable-tools\postject\dist\api.js" "$work\executable"
          if ($LASTEXITCODE -ne 0) { throw 'The Windows application EXE build or execution failed.' }
      - name: Seal exact executable units for same-run private transfer
        id: transfer_manifest
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          $source = "$env:RUNNER_TEMP\compiled-windows-app"
          $transfer = "$env:RUNNER_TEMP\finished-windows-application-transfer"
          if (Test-Path -LiteralPath $transfer) { throw 'The application transfer root must be fresh.' }
          [void][IO.Directory]::CreateDirectory($transfer)
          function Copy-TransferInput([string]$Group, [string]$Relative) {
            $input = Join-Path $source $Relative
            if (-not (Test-Path -LiteralPath $input)) { return }
            $output = Join-Path (Join-Path $transfer $Group) $Relative
            [void][IO.Directory]::CreateDirectory([IO.Path]::GetDirectoryName($output))
            Copy-Item -LiteralPath $input -Destination $output -Recurse -Force
          }
          @(
            'build/app', 'build/build-receipt.json', 'node',
            'controls/installed-acceptance-controller.json',
            'inputs/tools/node_modules/playwright-core', 'inputs/tools/node_modules/esbuild',
            'inputs/tools/node_modules/@esbuild/win32-arm64', 'inputs/materialization-receipt.json'
          ) | ForEach-Object { Copy-TransferInput application $_ }
          @('executable', 'workers') | ForEach-Object { Copy-TransferInput runtime $_ }
          $manifest = @(& scripts/checks/windows-native-transfer.ps1 -Mode Create -Root $transfer `
            -Kind compiled-application -SourceRevision $env:CANDIDATE_SHA -Agent $env:SELECTED_AGENT `
            -RunId $env:GITHUB_RUN_ID -RunAttempt $env:GITHUB_RUN_ATTEMPT)
          if ($manifest.Count -ne 1 -or [string]$manifest[0] -cnotmatch '^[a-f0-9]{64}$') { throw 'The application transfer manifest failed.' }
          "manifest_sha256=$([string]$manifest[0])" >> $env:GITHUB_OUTPUT
          "cache_key=windows-finished-application-v1-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:CANDIDATE_SHA-$env:SELECTED_AGENT" >> $env:GITHUB_OUTPUT
      - name: Save exact executable units only in the same-run cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/finished-windows-application-transfer
          key: ${{ steps.transfer_manifest.outputs.cache_key }}
      - name: Stage only non-runnable application diagnostics
        id: application_evidence
        if: ${{ always() }}
        shell: pwsh
        run: |
          $work = "$env:RUNNER_TEMP\compiled-windows-app"
          $inputs = @(
            "$work\controls\installed-acceptance-controller.json",
            "$work\controls\installed-acceptance-controller.stdout.log",
            "$work\controls\installed-acceptance-controller.stderr.log",
            "$work\controls\compiled-openclaw\compiled-controls.json",
            "$work\controls\compiled-openclaw\direct-version.log",
            "$work\controls\compiled-openclaw\worker-version.log",
            "$work\controls\compiled-openclaw\config-validate.log",
            "$work\controls\compiled-migration\migration-controls.json",
            "$work\first-run-consent-control\gateway-control.json",
            "$work\first-run-consent-control\browser-control.json",
            "$work\first-run-consent-control\compiled-dashboard-failed.png",
            "$work\first-run-consent-control\stdout.log", "$work\first-run-consent-control\stderr.log",
            "$work\gateway-control\gateway-control.json",
            "$work\gateway-control\browser-control.json",
            "$work\gateway-control\compiled-dashboard-failed.png",
            "$work\gateway-control\stdout.log", "$work\gateway-control\stderr.log",
            "$work\workers\build.json", "$work\workers\source-adaptation.json",
            "$work\executable-tools\tools-input.json",
            "$work\build\diagnostics\configured-choice-results.json",
            "$work\build\diagnostics\readonly-worker\readonly-diagnostic.json",
            "$work\build\diagnostics\readonly-worker\delete-closed.trace.log",
            "$work\build\diagnostics\readonly-worker\wal-held.trace.log",
            "$work\build\diagnostics\local-model-tools\result.json",
            "$work\build\diagnostics\local-model-tools\undici-instances.json",
            "$work\build\diagnostics\local-model-tools\stdout.log",
            "$work\build\diagnostics\local-model-tools\stderr.log",
            "$work\build\build-receipt.json", "$work\build\build-failure.json",
            "$work\inputs\materialization-receipt.json", "$work\node\node-input.json"
          )
          foreach ($choice in @('brave', 'slack', 'tavily')) {
            $choiceRoot = "$work\build\diagnostics\choice-$choice"
            $inputs += @("$choiceRoot\result.json", "$choiceRoot\registered.json", "$choiceRoot\inspect.timeline.log")
          }
          foreach ($pattern in @(
            "$work\build\diagnostics\choice-*.controller.stdout.log",
            "$work\build\diagnostics\choice-*.controller.stderr.log",
            "$work\build\diagnostics\choice-*\*.stdout.log",
            "$work\build\diagnostics\choice-*\*.stderr.log",
            "$work\executable\*.json", "$work\executable\*.log"
          )) {
            $inputs += @(Get-ChildItem -Path $pattern -File -ErrorAction SilentlyContinue | ForEach-Object FullName)
          }
          & "$env:GITHUB_WORKSPACE\scripts\checks\stage-windows-native-evidence.ps1" `
            -SourceBase $work -InputPath $inputs -OutputRoot "$env:RUNNER_TEMP\compiled-windows-application-evidence"
      - name: Preserve application build diagnostics
        if: ${{ always() && steps.application_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compiled-windows-application-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/compiled-windows-application-evidence/
          if-no-files-found: error
          retention-days: 14

  windows-system-drive-proof:
    name: Native system-drive preparation and MXC proof (ARM64)
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.run_windows_native_installer && inputs.probe_official_hermes_components && inputs.official_hermes_phase == 'system-drive' }}
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 12
    steps:
      - name: Check out the fixed-purpose Windows helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned native Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.95.0
          target: aarch64-pc-windows-msvc
          cache: false
      - name: Prepare only the pinned Node and MXC executables
        shell: pwsh
        run: |
          $work = "$env:RUNNER_TEMP\system-drive-inputs"
          & packaging/windows/app/prepare-app-node.ps1 `
            -LockPath packaging/windows/hermes/official-runtime.lock.json -OutputDirectory "$work\node"
          $archive = "$work\mxc-sdk.tgz"
          Invoke-WebRequest 'https://registry.npmjs.org/@microsoft/mxc-sdk/-/mxc-sdk-0.8.0.tgz' -OutFile $archive -TimeoutSec 60
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne '06bb2399d7e98ab1907acf851e12a4e44748dd467b79d3e53c2f2fbf569da14e') {
            throw 'The MXC SDK differs from its immutable archive.'
          }
          & "$env:SystemRoot\System32\tar.exe" -xzf $archive -C $work package/bin/arm64/wxc-exec.exe package/bin/arm64/wxc-host-prep.exe
          if ($LASTEXITCODE -ne 0) { throw 'The two pinned MXC executables could not be extracted.' }
      - name: Compile and exercise the native metadata helper
        shell: pwsh
        run: |
          $work = "$env:RUNNER_TEMP\host-preparation-helper"
          & packaging/windows/host-preparation/build-helper.ps1 -OutputDirectory $work
          & rustup run 1.95.0-aarch64-pc-windows-msvc cargo test --locked --offline `
            --target aarch64-pc-windows-msvc --manifest-path packaging/windows/host-preparation/Cargo.toml `
            --target-dir "$work\rust-target" -- --test-threads=1 2>&1 | Tee-Object -FilePath "$work\native-controls.log"
          if ($LASTEXITCODE -ne 0) { throw 'The actual native metadata controls failed.' }
      - name: Verify retained preparation errors and Setup diagnostics
        shell: pwsh
        run: |
          & dotnet run --project packaging/windows/tests/host-preparation-diagnostics/HostPreparation.Diagnostics.Controls.csproj `
            -p:MxcProbeSha256=dde1c592270e9a659b01dccad70362da7b99fec114885fa4d625507aa775a503 `
            -- "$env:RUNNER_TEMP\system-drive-inputs\package\bin\arm64\wxc-exec.exe"
          if ($LASTEXITCODE -ne 0) { throw 'The preparation diagnostic controls failed.' }
      - name: Verify the actual system root and contained Node access
        shell: pwsh
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -File "$env:GITHUB_WORKSPACE\packaging\windows\host-preparation\test-system-root-mxc.ps1" `
            -HelperPath "$env:RUNNER_TEMP\host-preparation-helper\NemoClawHostPreparation.exe" `
            -MxcDirectory "$env:RUNNER_TEMP\system-drive-inputs\package\bin\arm64" `
            -NodePath "$env:RUNNER_TEMP\system-drive-inputs\node\node.exe" `
            -ArtifactDirectory "$env:RUNNER_TEMP\system-root-mxc-proof"
          if ($LASTEXITCODE -ne 0) { throw 'The Windows PowerShell 5.1 system-drive proof failed.' }
      - name: Set up pinned proof verifier Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.1.0
        with:
          python-version: 3.13.13
          architecture: arm64
      - name: Verify the historical SDK proof without package admission
        shell: pwsh
        run: |
          & python packaging/windows/installer/verify-system-drive-proof.py `
            --helper "$env:RUNNER_TEMP\host-preparation-helper\NemoClawHostPreparation.exe" `
            --build-receipt "$env:RUNNER_TEMP\host-preparation-helper\build-receipt.json" `
            --proof-directory "$env:RUNNER_TEMP\system-root-mxc-proof" `
            --source-root $env:GITHUB_WORKSPACE --source-revision $env:GITHUB_SHA `
            --node-path "$env:RUNNER_TEMP\system-drive-inputs\node\node.exe" `
            --legacy-mxc-directory "$env:RUNNER_TEMP\system-drive-inputs\package\bin\arm64" `
            --output "$env:RUNNER_TEMP\system-root-mxc-proof\historical-sdk-proof.json"
          if ($LASTEXITCODE -ne 0) { throw 'The verifier rejected the historical SDK system-drive proof.' }
          & python packaging/windows/hermes/test-native-adapter-paths.py -v
          if ($LASTEXITCODE -ne 0) { throw 'The native Hermes adapter path controls failed.' }
          & python packaging/windows/hermes/test_generated_finder_paths.py -v
          if ($LASTEXITCODE -ne 0) { throw 'The generated Hermes finder controls failed.' }
      - name: Verify acceptance-controller Windows shell compatibility
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\system-drive-inputs\node\node.exe" --experimental-strip-types --no-warnings `
            --test --test-reporter=tap `
            packaging/windows/installer/control-installed-openclaw-input.test.mts `
            packaging/windows/installer/run-installed-acceptance.test.mts
          if ($LASTEXITCODE -ne 0) { throw 'The Windows acceptance-controller shell controls failed.' }
      - name: Preserve fixed-purpose preparation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-system-drive-mxc-proof-${{ github.sha }}
          path: |
            ${{ runner.temp }}/host-preparation-helper/*.json
            ${{ runner.temp }}/host-preparation-helper/*.log
            ${{ runner.temp }}/host-preparation-helper/NemoClawHostPreparation.exe
            ${{ runner.temp }}/system-root-mxc-proof/
            ${{ runner.temp }}/system-drive-inputs/node/node-input.json
          if-no-files-found: error
          retention-days: 14

  windows-host-prerequisite-proof:
    name: Isolated Windows directory permission proof (ARM64)
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.run_windows_native_installer && inputs.probe_official_hermes_components && inputs.official_hermes_phase == 'host-prerequisites' }}
    runs-on: windows-11-vs2026-arm
