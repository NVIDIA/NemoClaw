name: CI / Native Windows Installer Candidate v2

# External prerequisite for secure use: administrators must permanently disable
# legacy Actions workflow ID 350766812 before enabling this fresh v2 workflow.
# This caller contains no secret references; qualification secrets belong only
# to the protected environments owned by its same-commit reusable controller.
# Finished installer publication requires explicit dispatch.
# The pinned legacy payload is used only by isolated diagnostic/profiling lanes.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/actions/setup-reviewed-npm/**"
      - ".github/workflows/windows-native-installer-v2.yaml"
      - ".github/workflows/windows-native-installer-trusted.yaml"
      - "bin/nemoclaw.js"
      - "ci/reviewed-npm-audit.json"
      - "packaging/windows/**"
      - "scripts/checks/*windows-native*"
      - "scripts/install-windows-native.ps1"
      - "test/security/windows-native-*.test.ts"
      - "test/support/windows-native-*.ts"
  workflow_dispatch:
    inputs:
      finished_windows_pr_number:
        description: Open internal PR number whose exact head will be qualified
        required: false
        default: ""
        type: string
      finished_windows_candidate_repository:
        description: Exact internal head repository reported by that PR
        required: false
        default: ""
        type: string
      finished_windows_candidate_sha:
        description: Exact 40-character PR head SHA to build
        required: false
        default: ""
        type: string
      finished_windows_base_sha:
        description: Exact 40-character PR base SHA observed before dispatch
        required: false
        default: ""
        type: string
      finished_windows_workflow_sha:
        description: Exact current main SHA containing the trusted controller
        required: false
        default: ""
        type: string
      finished_windows_agent:
        description: Include only this agent in the finished installer
        required: false
        default: openclaw
        type: choice
        options:
          - openclaw
          - hermes
          - pi
      finished_windows_product_version:
        description: MSI product version for the finished preview (must be newer than the legacy preview)
        required: false
        default: "0.1.10"
        type: string
      finished_windows_validation_scope:
        description: Full installed lifecycle with real inference, or startup-only with a local mock model
        required: false
        default: full-acceptance
        type: choice
        options:
          - full-acceptance
          - startup-only
      run_windows_native_installer:
        description: Build the selected finished native preview installer, then test it
        required: false
        default: false
        type: boolean
      windows_native_diagnostic_source_run_id:
        description: Replay the fixed built 0.1.3 installer (source run 34555046495; no runtime overlay)
        required: false
        default: ""
        type: string
      profile_native_windows:
        description: Diagnostic profiling of the exact installed f8 baseline only (no installer publication or comparison)
        required: false
        default: false
        type: boolean
      test_native_windows_runtime:
        description: Run native ownership and guardian controls with isolated MSI fixtures
        required: false
        default: false
        type: boolean
      probe_official_hermes_components:
        description: Run the selected official Hermes Windows probe without publishing an installer
        required: false
        default: false
        type: boolean
      record_hermes_startup:
        description: Record a bounded diagnostic trace during the Personal Hermes probe
        required: false
        default: false
        type: boolean
      capture_hermes_renderer_context:
        description: Capture bounded renderer context only in the failure debugger diagnostic
        required: false
        default: false
        type: boolean
      official_hermes_phase:
        description: Official Hermes probe phase (requires the probe input above)
        required: false
        default: components
        type: choice
        options:
          - components
          - python
          - runtime
          - npm-shims
          - export-controls
          - edge-host-prerequisite
          - personal-candidate
          - personal-browser-first
          - personal-cold-job
          - personal-renderer-wer
          - personal-postmortem
          - trace-analysis
          - bash-compat
          - host-prerequisites
          - system-drive
          - application

permissions:
  actions: read
  contents: read

concurrency:
  group: windows-native-installer-${{ github.ref }}${{ inputs.run_windows_native_installer && inputs.windows_native_diagnostic_source_run_id == '' && '-finished-package' || inputs.test_native_windows_runtime && '-runtime-controls' || inputs.profile_native_windows && '-profiling' || inputs.probe_official_hermes_components && inputs.official_hermes_phase == 'python' && '-hermes-python' || inputs.probe_official_hermes_components && inputs.official_hermes_phase == 'runtime' && '-hermes-runtime' || inputs.probe_official_hermes_components && inputs.official_hermes_phase == 'npm-shims' && '-hermes-npm-shims' || inputs.probe_official_hermes_components && inputs.official_hermes_phase == 'bash-compat' && '-bash-compat' || inputs.probe_official_hermes_components && inputs.official_hermes_phase == 'personal-browser-first' && '-hermes-personal-browser-first' || inputs.probe_official_hermes_components && inputs.official_hermes_phase == 'personal-postmortem' && '-hermes-personal-postmortem' || inputs.probe_official_hermes_components && inputs.official_hermes_phase == 'personal-renderer-wer' && '-hermes-personal-renderer-wer' || inputs.probe_official_hermes_components && inputs.official_hermes_phase == 'personal-cold-job' && '-hermes-personal-cold-job' || inputs.probe_official_hermes_components && inputs.official_hermes_phase == 'personal-candidate' && '-hermes-personal-candidate' || inputs.probe_official_hermes_components && inputs.official_hermes_phase == 'trace-analysis' && '-hermes-trace-analysis' || inputs.probe_official_hermes_components && inputs.official_hermes_phase == 'export-controls' && '-hermes-export-controls' || inputs.probe_official_hermes_components && inputs.official_hermes_phase == 'application' && '-compiled-application' || inputs.probe_official_hermes_components && inputs.official_hermes_phase == 'host-prerequisites' && '-host-prerequisites' || inputs.probe_official_hermes_components && inputs.official_hermes_phase == 'system-drive' && '-system-drive' || inputs.probe_official_hermes_components && '-hermes-components' || inputs.windows_native_diagnostic_source_run_id != '' && '-package-diagnostic' || '' }}
  # Preserve explicit evidence runs while replacing stale pull request controls.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-finished-request:
    name: Resolve exact credential-free or trusted finished-installer request
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      request_kind: ${{ steps.pull_request.outputs.request_kind || steps.authorize.outputs.request_kind || steps.diagnostic.outputs.request_kind }}
      candidate_repository: ${{ steps.pull_request.outputs.candidate_repository || steps.authorize.outputs.candidate_repository || steps.diagnostic.outputs.candidate_repository }}
      candidate_sha: ${{ steps.pull_request.outputs.candidate_sha || steps.authorize.outputs.candidate_sha || steps.diagnostic.outputs.candidate_sha }}
      base_sha: ${{ steps.pull_request.outputs.base_sha || steps.authorize.outputs.base_sha || steps.diagnostic.outputs.base_sha }}
      pr_number: ${{ steps.pull_request.outputs.pr_number || steps.authorize.outputs.pr_number }}
      workflow_sha: ${{ steps.pull_request.outputs.workflow_sha || steps.authorize.outputs.workflow_sha || steps.diagnostic.outputs.workflow_sha }}
      agent: ${{ steps.pull_request.outputs.agent || steps.authorize.outputs.agent || steps.diagnostic.outputs.agent }}
      product_version: ${{ steps.pull_request.outputs.product_version || steps.authorize.outputs.product_version || steps.diagnostic.outputs.product_version }}
      validation_scope: ${{ steps.pull_request.outputs.validation_scope || steps.authorize.outputs.validation_scope || steps.diagnostic.outputs.validation_scope }}
      build_allowed: ${{ steps.pull_request.outputs.build_allowed || steps.authorize.outputs.build_allowed || steps.diagnostic.outputs.build_allowed }}
      trusted_main: ${{ steps.pull_request.outputs.trusted_main || steps.authorize.outputs.trusted_main || steps.diagnostic.outputs.trusted_main }}
      exact_workflow: ${{ steps.pull_request.outputs.exact_workflow || steps.authorize.outputs.exact_workflow || steps.diagnostic.outputs.exact_workflow }}
      exact_pr: ${{ steps.pull_request.outputs.exact_pr || steps.authorize.outputs.exact_pr || steps.diagnostic.outputs.exact_pr }}
      credential_authorized: ${{ steps.pull_request.outputs.credential_authorized || steps.authorize.outputs.credential_authorized || steps.diagnostic.outputs.credential_authorized }}
    steps:
      - name: Admit the exact pull request head without credentials
        id: pull_request
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ && "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          {
            echo 'request_kind=pull-request'
            echo "candidate_repository=$CANDIDATE_REPOSITORY"
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "base_sha=$BASE_SHA"
            echo "pr_number=$PR_NUMBER"
            echo "workflow_sha=$WORKFLOW_SHA"
            echo 'agent=openclaw'
            echo 'product_version=0.1.10'
            echo 'validation_scope=startup-only'
            echo 'build_allowed=true'
            echo 'trusted_main=false'
            echo 'exact_workflow=false'
            echo 'exact_pr=true'
            echo 'credential_authorized=false'
          } >> "$GITHUB_OUTPUT"
      - name: Resolve a credential-free diagnostic dispatch
        id: diagnostic
        if: ${{ github.event_name == 'workflow_dispatch' && !(inputs.run_windows_native_installer && inputs.windows_native_diagnostic_source_run_id == '') }}
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          SELECTED_AGENT: ${{ inputs.finished_windows_agent || 'openclaw' }}
          PRODUCT_VERSION: ${{ inputs.finished_windows_product_version || '0.1.10' }}
          VALIDATION_SCOPE: ${{ inputs.finished_windows_validation_scope || 'startup-only' }}
        run: |
          set -euo pipefail
          {
            echo 'request_kind=diagnostic'
            echo "candidate_repository=$GITHUB_REPOSITORY"
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "base_sha=$CANDIDATE_SHA"
            echo "workflow_sha=$WORKFLOW_SHA"
            echo "agent=$SELECTED_AGENT"
            echo "product_version=$PRODUCT_VERSION"
            echo "validation_scope=$VALIDATION_SCOPE"
            echo 'build_allowed=false'
            echo 'trusted_main=false'
            echo 'exact_workflow=false'
            echo 'exact_pr=false'
            echo 'credential_authorized=false'
          } >> "$GITHUB_OUTPUT"
      - name: Authorize exact internal PR from the exact main controller
        id: authorize
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_windows_native_installer && inputs.windows_native_diagnostic_source_run_id == '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.finished_windows_pr_number }}
          CANDIDATE_REPOSITORY: ${{ inputs.finished_windows_candidate_repository }}
          CANDIDATE_SHA: ${{ inputs.finished_windows_candidate_sha }}
          BASE_SHA: ${{ inputs.finished_windows_base_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.finished_windows_workflow_sha }}
          SELECTED_AGENT: ${{ inputs.finished_windows_agent }}
          PRODUCT_VERSION: ${{ inputs.finished_windows_product_version }}
          VALIDATION_SCOPE: ${{ inputs.finished_windows_validation_scope }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EVENT_REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'NVIDIA/NemoClaw' && "$EVENT_REF" == 'refs/heads/main' ]]
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_REPOSITORY" == 'NVIDIA/NemoClaw' ]]
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ && "$BASE_SHA" =~ ^[a-f0-9]{40}$ && "$EXPECTED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EVENT_SHA" == "$EXPECTED_WORKFLOW_SHA" && "$EVENT_WORKFLOW_SHA" == "$EXPECTED_WORKFLOW_SHA" ]]
          [[ "$BASE_SHA" == "$EXPECTED_WORKFLOW_SHA" ]]
          [[ "$SELECTED_AGENT" =~ ^(openclaw|hermes|pi)$ && "$VALIDATION_SCOPE" == 'full-acceptance' ]]
          [[ "$PRODUCT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          [[ "$(jq -r '.state' <<<"$pr")" == 'open' ]]
          [[ "$(jq -r '.base.repo.full_name' <<<"$pr")" == "$GITHUB_REPOSITORY" ]]
          [[ "$(jq -r '.base.ref' <<<"$pr")" == 'main' ]]
          [[ "$(jq -r '.base.sha' <<<"$pr")" == "$BASE_SHA" ]]
          [[ "$(jq -r '.head.repo.full_name' <<<"$pr")" == "$CANDIDATE_REPOSITORY" ]]
          [[ "$(jq -r '.head.repo.owner.login' <<<"$pr")" == 'NVIDIA' ]]
          [[ "$(jq -r '.head.repo.owner.type' <<<"$pr")" == 'Organization' ]]
          [[ "$(jq -r '.head.sha' <<<"$pr")" == "$CANDIDATE_SHA" ]]
          comparison="$(gh api "repos/$GITHUB_REPOSITORY/compare/$EXPECTED_WORKFLOW_SHA...$CANDIDATE_SHA")"
          [[ "$(jq -r '.merge_base_commit.sha' <<<"$comparison")" == "$EXPECTED_WORKFLOW_SHA" ]]
          [[ "$(jq -r '.behind_by' <<<"$comparison")" == '0' ]]
          for principal in "$ACTOR" "$TRIGGERING_ACTOR"; do
            permission="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$principal/permission" --jq '.permission')"
            [[ "$permission" =~ ^(admin|maintain|write)$ ]]
          done
          {
            echo 'request_kind=trusted-manual'
            echo "candidate_repository=$CANDIDATE_REPOSITORY"
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "base_sha=$BASE_SHA"
            echo "pr_number=$PR_NUMBER"
            echo "workflow_sha=$EXPECTED_WORKFLOW_SHA"
            echo "agent=$SELECTED_AGENT"
            echo "product_version=$PRODUCT_VERSION"
            echo "validation_scope=$VALIDATION_SCOPE"
            echo 'build_allowed=true'
            echo 'trusted_main=true'
            echo 'exact_workflow=true'
            echo 'exact_pr=true'
            echo 'credential_authorized=true'
          } >> "$GITHUB_OUTPUT"

  windows-personal-trace-analysis:
    name: Recorded Hermes Personal trace analysis (no application execution)
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.run_windows_native_installer && !inputs.profile_native_windows && !inputs.test_native_windows_runtime && inputs.windows_native_diagnostic_source_run_id == '' && inputs.probe_official_hermes_components && inputs.official_hermes_phase == 'trace-analysis' }}
    runs-on: windows-11-vs2026-arm
    # Fixed recorded input; eight bounded analysis commands plus intake/upload.
    timeout-minutes: 25
    steps:
      - name: Check out the trace analysis controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify and analyze the exact recorded 51e3 light trace
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & "$env:GITHUB_WORKSPACE\packaging\windows\performance\analyze-personal-wpr.ps1" `
            -ArtifactDirectory "$env:RUNNER_TEMP\personal-trace-analysis"
      - name: Preserve bounded analysis reports and original small trace metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-hermes-personal-trace-analysis-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/personal-trace-analysis/
            !${{ runner.temp }}/personal-trace-analysis/recorded-trace.zip
            !${{ runner.temp }}/personal-trace-analysis/input/**/*.etl
          if-no-files-found: error
          retention-days: 14

  windows-finished-installer:
    name: Finished Windows ${{ needs.windows-finished-request.outputs.agent }} candidate installer (ARM64)
    needs:
      [windows-finished-request, windows-compiled-application, windows-bash-compatibility-reuse]
    if: ${{ always() && needs.windows-finished-request.result == 'success' && needs.windows-finished-request.outputs.build_allowed == 'true' && needs.windows-compiled-application.result == 'success' && (needs.windows-finished-request.outputs.agent != 'hermes' || needs.windows-bash-compatibility-reuse.result == 'success') }}
    runs-on: windows-11-vs2026-arm
    timeout-minutes: ${{ needs.windows-finished-request.outputs.agent == 'hermes' && 180 || 120 }}
    outputs:
      installer_cache_key: ${{ steps.product_manifest.outputs.cache_key }}
      installer_manifest_sha256: ${{ steps.product_manifest.outputs.manifest_sha256 }}
    env:
      CANDIDATE_SHA: ${{ needs.windows-finished-request.outputs.candidate_sha }}
      SELECTED_AGENT: ${{ needs.windows-finished-request.outputs.agent }}
      PRODUCT_VERSION: ${{ needs.windows-finished-request.outputs.product_version }}
    steps:
      - name: Check out the finished Windows application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.windows-finished-request.outputs.candidate_repository }}
          ref: ${{ needs.windows-finished-request.outputs.candidate_sha }}
          path: candidate
          persist-credentials: false
      - name: Validate the dedicated finished preview request
        shell: pwsh
        env:
          OTHER_COMPONENTS: ${{ inputs.probe_official_hermes_components }}
          OTHER_PROFILE: ${{ inputs.profile_native_windows }}
          OTHER_RUNTIME: ${{ inputs.test_native_windows_runtime }}
        run: |
          $parsedVersion = $null
          if ($env:PRODUCT_VERSION -cnotmatch '^[0-9]+\.[0-9]+\.[0-9]+$' -or -not [version]::TryParse($env:PRODUCT_VERSION, [ref]$parsedVersion) -or $parsedVersion -le [version]'0.1.4') {
            throw 'The finished preview needs an explicit MSI version newer than migration baseline 0.1.4.'
          }
          if (@($env:OTHER_COMPONENTS, $env:OTHER_PROFILE, $env:OTHER_RUNTIME) -contains 'true') {
            throw 'The finished preview requires its own explicit dispatch.'
          }
      - name: Restore exact compiled units from the same-run cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/finished-windows-application-transfer
          key: ${{ needs.windows-compiled-application.outputs.application_cache_key }}
          fail-on-cache-miss: true
      - name: Verify and materialize the exact compiled units
        shell: pwsh
        env:
          EXPECTED_MANIFEST: ${{ needs.windows-compiled-application.outputs.application_manifest_sha256 }}
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          $transfer = "$env:RUNNER_TEMP\finished-windows-application-transfer"
          $verifiedManifest = @(& "$env:GITHUB_WORKSPACE\candidate\scripts\checks\windows-native-transfer.ps1" -Mode Verify -Root $transfer `
            -Kind compiled-application -SourceRevision $env:CANDIDATE_SHA -Agent $env:SELECTED_AGENT `
            -RunId $env:GITHUB_RUN_ID -RunAttempt $env:GITHUB_RUN_ATTEMPT -ExpectedManifestSha256 $env:EXPECTED_MANIFEST)
          if ($verifiedManifest.Count -ne 1 -or [string]$verifiedManifest[0] -cne $env:EXPECTED_MANIFEST) {
            throw 'The compiled application transfer is not exact.'
          }
          $work = "$env:RUNNER_TEMP\finished-windows"
          [void][IO.Directory]::CreateDirectory($work)
          Copy-Item -LiteralPath "$transfer\application" -Destination "$work\application" -Recurse
          Copy-Item -LiteralPath "$transfer\runtime" -Destination "$work\runtime" -Recurse
      - name: Prepare pinned native Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.95.0-aarch64-pc-windows-msvc
          target: aarch64-pc-windows-msvc
          cache: false
          rustflags: ""
      - name: Prepare pinned native .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.419
      - name: Prepare build-only Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.1.0
        with:
          python-version: 3.13.13
          architecture: arm64
      - name: Check exact helper-proof consumption controls
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          & python -m unittest discover -s "$env:GITHUB_WORKSPACE\candidate\packaging\windows\installer" -p 'test_verify_system_drive_proof.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'The helper-proof consumption controls failed.' }
          & python -m unittest discover -s "$env:GITHUB_WORKSPACE\candidate\packaging\windows\installer" -p 'test_materialize_compiled_executable.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'The compiled artifact materialization controls failed.' }
      - name: Check out the pinned OpenShell host source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NVIDIA/OpenShell
          ref: bcd517bbe08cc80860c9be57699390cd32e8445f
          path: openshell
          persist-credentials: false
      - name: Build and test the current OpenShell derivative
        working-directory: openshell
        shell: pwsh
        env:
          RUSTUP_TOOLCHAIN: 1.95.0-aarch64-pc-windows-msvc
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          $work = "$env:RUNNER_TEMP\finished-windows"
          $patch = "$env:GITHUB_WORKSPACE\candidate\packaging\windows\openshell-2721-node-ui.patch"
          $revision = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $revision -cne 'bcd517bbe08cc80860c9be57699390cd32e8445f') { throw 'Unexpected OpenShell source.' }
          $status = & git status --porcelain
          if ($LASTEXITCODE -ne 0 -or $status) { throw 'The OpenShell checkout is not clean.' }
          $patchHash = (Get-FileHash -LiteralPath $patch -Algorithm SHA256).Hash.ToLowerInvariant()
          & git apply --check -- $patch
          if ($LASTEXITCODE -ne 0) { throw 'The current OpenShell derivative no longer applies exactly.' }
          & git apply -- $patch
          if ($LASTEXITCODE -ne 0) { throw 'Applying the current OpenShell derivative failed.' }
          $sourceDiff = & git diff --binary
          if ($LASTEXITCODE -ne 0) { throw 'Cannot record the patched source.' }
          $env:CARGO_TARGET_DIR = "$work\openshell-target"
          if (Test-Path -LiteralPath $env:CARGO_TARGET_DIR) { throw 'OpenShell must build into a fresh target directory.' }
          . .\tasks\scripts\windows-msvc.ps1 build aarch64-pc-windows-msvc -LogDir "$work\openshell-logs"
          Assert-NativeTestTarget 'aarch64-pc-windows-msvc'
          Invoke-VsCargo -RustTarget 'aarch64-pc-windows-msvc' `
            -CargoArgs 'cargo test --locked --release --target aarch64-pc-windows-msvc -p openshell-driver-mxc --lib -- --test-threads=1' `
            -LogName 'mxc-driver-tests.log'
          $afterDiff = & git diff --binary
          if ($LASTEXITCODE -ne 0 -or ($sourceDiff -join "`n") -cne ($afterDiff -join "`n") -or `
              (Get-FileHash -LiteralPath $patch -Algorithm SHA256).Hash.ToLowerInvariant() -cne $patchHash) {
            throw 'OpenShell source or its derivative patch changed during the build.'
          }
          $output = "$work\openshell-binaries"
          New-Item -ItemType Directory -Path $output -ErrorAction Stop | Out-Null
          $files = foreach ($name in @('openshell.exe', 'openshell-gateway.exe')) {
            $binary = Join-Path $env:CARGO_TARGET_DIR "aarch64-pc-windows-msvc\release\$name"
            $hash = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
            $copy = Join-Path $output $name
            Copy-Item -LiteralPath $binary -Destination $copy -ErrorAction Stop
            if ((Get-FileHash -LiteralPath $copy -Algorithm SHA256).Hash.ToLowerInvariant() -cne $hash) { throw 'OpenShell build copy changed.' }
            @{ file = $name; bytes = (Get-Item -LiteralPath $copy).Length; sha256 = $hash }
          }
          @{
            schemaVersion = 1
            classification = 'ci-built-openshell-host-binaries'
            requestedSourceRevision = $env:GITHUB_SHA
            openshellRevision = $revision
            derivativePatchSha256 = $patchHash
            rustToolchain = $env:RUSTUP_TOOLCHAIN
            rustTarget = 'aarch64-pc-windows-msvc'
            workflowRunId = $env:GITHUB_RUN_ID
            workflowRunAttempt = $env:GITHUB_RUN_ATTEMPT
            files = @($files)
            currentPackageQualification = $false
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath "$output\openshell-build.json" -Encoding utf8NoBOM
      - name: Prepare native host files without any legacy agent tree
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          $work = "$env:RUNNER_TEMP\finished-windows"
          & python "$env:GITHUB_WORKSPACE\candidate\packaging\windows\installer\prepare-finished-host.py" `
            --source-root "$env:GITHUB_WORKSPACE\candidate" --openshell-binaries "$work\openshell-binaries" `
            --node-root "$work\application\node" --output "$work\host" --cache "$work\downloads"
          if ($LASTEXITCODE -ne 0) { throw 'Native host input preparation failed.' }
      - name: Build and prove the exact native system-drive prerequisite
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          $work = "$env:RUNNER_TEMP\finished-windows"
          $owner = "$env:GITHUB_WORKSPACE\candidate\packaging\windows\host-preparation"
          & "$owner\build-helper.ps1" -OutputDirectory "$work\system-drive-helper"
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -File "$owner\test-system-root-mxc.ps1" `
            -HelperPath "$work\system-drive-helper\NemoClawHostPreparation.exe" -MxcDirectory "$work\host\mxc" `
            -NodePath "$work\host\bin\node.exe" -ArtifactDirectory "$work\system-drive-proof"
          if ($LASTEXITCODE -ne 0) { throw 'The exact helper did not pass actual system-root and contained Node proof.' }
      - name: Seal the finished application and selected OpenClaw resources
        if: ${{ needs.windows-finished-request.outputs.agent == 'openclaw' }}
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          $work = "$env:RUNNER_TEMP\finished-windows"
          $owner = "$env:GITHUB_WORKSPACE\candidate\packaging\windows\installer"
          $inputs = @("$work\host\runtime-payload-receipt.json", "$work\application\build\app\openclaw-resource-closure.json", "$work\runtime\workers\build.json", "$work\runtime\executable\build.json")
          $identityText = ($inputs | ForEach-Object { (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant() }) -join "`n"
          $component = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($identityText))).ToLowerInvariant()
          & python "$owner\assign_runtime_namespace.py" --receipt "$work\namespace.json" --source-revision $env:GITHUB_SHA --component-identity $component
          if ($LASTEXITCODE -ne 0) { throw 'Immutable namespace assignment failed.' }
          & python "$owner\assemble_runtime.py" --output "$work\assembled" `
            --agent "openclaw=$work\application\build\app" --shared-node "$work\host\bin\node.exe" `
            --node-version 22.23.2 --source-revision $env:GITHUB_SHA --component-identity $component `
            --namespace-receipt "$work\namespace.json" --worker-build "$work\runtime\workers" --executable-build "$work\runtime\executable"
          if ($LASTEXITCODE -ne 0) { throw 'The finished runtime could not be sealed.' }
      - name: Prepare the locked finished Pi runtime
        if: ${{ needs.windows-finished-request.outputs.agent == 'pi' }}
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          $work = "$env:RUNNER_TEMP\finished-windows"
          & python -m unittest discover -s "$env:GITHUB_WORKSPACE\candidate\packaging\windows\distribution" -p test_prepare_selected_node_agent.py
          if ($LASTEXITCODE -ne 0) { throw 'Selected-agent preparation regression tests failed.' }
          & python "$env:GITHUB_WORKSPACE\candidate\packaging\windows\distribution\prepare-selected-node-agent.py" `
            --agent pi --source-root "$env:GITHUB_WORKSPACE\candidate" `
            --node "$work\application\node\node.exe" `
            --npm-cli "$work\application\node\node_modules\npm\bin\npm-cli.js" `
            --output "$work\pi" --tool-root "$work\application\inputs\tools"
          if ($LASTEXITCODE -ne 0) { throw 'The locked Pi runtime could not be prepared.' }
      - name: Seal only the finished Pi runtime
        if: ${{ needs.windows-finished-request.outputs.agent == 'pi' }}
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          $work = "$env:RUNNER_TEMP\finished-windows"
          $inputs = @("$work\host\runtime-payload-receipt.json", "$work\pi\selected-agent-build.json", "$work\runtime\workers\build.json", "$work\runtime\executable\build.json")
          $identityText = ($inputs | ForEach-Object { (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant() }) -join "`n"
          $component = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($identityText))).ToLowerInvariant()
          & python "$env:GITHUB_WORKSPACE\candidate\packaging\windows\installer\assign_runtime_namespace.py" --receipt "$work\namespace.json" --source-revision $env:GITHUB_SHA --component-identity $component
          & python "$env:GITHUB_WORKSPACE\candidate\packaging\windows\installer\assemble_runtime.py" --output "$work\assembled" `
            --agent "pi=$work\pi" --shared-node "$work\host\bin\node.exe" --node-version 22.23.2 `
            --source-revision $env:GITHUB_SHA --component-identity $component --namespace-receipt "$work\namespace.json" `
            --worker-build "$work\runtime\workers" --executable-build "$work\runtime\executable" `
            --target-install-root "$env:ProgramFiles\NVIDIA\NemoClaw"
          if ($LASTEXITCODE -ne 0) { throw 'The finished Pi runtime could not be sealed.' }
      - name: Restore the exact same-run compatibility component and proof
        if: ${{ needs.windows-finished-request.outputs.agent == 'hermes' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/finished-windows-bash-transfer
          key: ${{ needs.windows-bash-compatibility-reuse.outputs.compatibility_cache_key }}
          fail-on-cache-miss: true
          enableCrossOsArchive: true
      - name: Verify and materialize exact same-run compatibility proof
        if: ${{ needs.windows-finished-request.outputs.agent == 'hermes' }}
        shell: pwsh
        env:
          EXPECTED_MANIFEST: ${{ needs.windows-bash-compatibility-reuse.outputs.compatibility_manifest_sha256 }}
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          $transfer = "$env:RUNNER_TEMP\finished-windows-bash-transfer"
          $verifiedManifest = @(& "$env:GITHUB_WORKSPACE\candidate\scripts\checks\windows-native-transfer.ps1" -Mode Verify -Root $transfer `
            -Kind bash-compatibility -SourceRevision $env:CANDIDATE_SHA -Agent hermes `
            -RunId $env:GITHUB_RUN_ID -RunAttempt $env:GITHUB_RUN_ATTEMPT -ExpectedManifestSha256 $env:EXPECTED_MANIFEST)
          if ($verifiedManifest.Count -ne 1 -or [string]$verifiedManifest[0] -cne $env:EXPECTED_MANIFEST) {
            throw 'The Bash compatibility transfer is not exact.'
          }
          Copy-Item -LiteralPath "$transfer\native-proof" -Destination "$env:RUNNER_TEMP\finished-windows\native-proof" -Recurse
      - name: Verify the explicitly pinned Personal-passing complete Hermes candidate
        if: ${{ needs.windows-finished-request.outputs.agent == 'hermes' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          $work = "$env:RUNNER_TEMP\finished-windows"
          & python "$env:GITHUB_WORKSPACE\candidate\packaging\windows\installer\prepare-finished-hermes.py" `
            --output "$work\hermes-input" --native-proof-directory "$work\native-proof\bash-compat-evidence" --source-revision $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'The exact complete Personal-passing Hermes input was not admitted.' }
      - name: Seal only Hermes with current-source native compatibility and precompiled workers
        if: ${{ needs.windows-finished-request.outputs.agent == 'hermes' }}
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          $work = "$env:RUNNER_TEMP\finished-windows"
          $owner = "$env:GITHUB_WORKSPACE\candidate\packaging\windows\installer"
          $proof = "$work\native-proof\bash-compat-evidence"
          $installedRoot = Join-Path ([Environment]::GetFolderPath([Environment+SpecialFolder]::ProgramFiles)) 'NVIDIA\NemoClaw'
          $inputs = @("$work\host\runtime-payload-receipt.json", "$work\hermes-input\intake.json", "$proof\result.json", "$proof\compatibility-build\build-receipt.json", "$proof\mxc-token-inspection-build\mxc-token-inspection-build.json", "$work\runtime\workers\build.json", "$work\runtime\executable\build.json")
          $identityText = ($inputs | ForEach-Object { (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant() }) -join "`n"
          $component = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($identityText))).ToLowerInvariant()
          & python "$owner\assign_runtime_namespace.py" --receipt "$work\namespace.json" --source-revision $env:GITHUB_SHA --component-identity $component
          if ($LASTEXITCODE -ne 0) { throw 'Immutable Hermes namespace assignment failed.' }
          $intake = Get-Content -LiteralPath "$work\hermes-input\intake.json" -Raw | ConvertFrom-Json
          $candidatePath = "$work\hermes-input\candidate\runtime-candidate.json"
          if ((Get-FileHash -LiteralPath $candidatePath -Algorithm SHA256).Hash.ToLowerInvariant() -cne $intake.personalInput.candidateReceiptSha256) {
            throw 'The admitted Hermes candidate receipt changed before worker compilation.'
          }
          $candidate = Get-Content -LiteralPath $candidatePath -Raw | ConvertFrom-Json
          $inventoryPath = "$work\hermes-input\candidate\payload-inventory.json"
          if ((Get-FileHash -LiteralPath $inventoryPath -Algorithm SHA256).Hash.ToLowerInvariant() -cne $candidate.inventorySha256) {
            throw 'The admitted Hermes interpreter inventory changed.'
          }
          $inventory = Get-Content -LiteralPath $inventoryPath -Raw | ConvertFrom-Json
          $pythonRelative = 'hermes-agent/.hermes-runtime/python/cpython-3.11.16-windows-aarch64-none/python.exe'
          $pythonRows = @($inventory.files | Where-Object path -CEQ $pythonRelative)
          $hermesPython = Join-Path "$work\hermes-input\runtime" $pythonRelative
          $pythonFile = Get-Item -LiteralPath $hermesPython -Force
          if ($pythonRows.Count -ne 1 -or $pythonFile.PSIsContainer -or $pythonFile.Attributes.HasFlag([IO.FileAttributes]::ReparsePoint) -or
              $pythonFile.Length -ne $pythonRows[0].bytes -or (Get-FileHash -LiteralPath $hermesPython -Algorithm SHA256).Hash.ToLowerInvariant() -cne $pythonRows[0].sha256) {
            throw 'The shipping Hermes core interpreter differs from its admitted bytes.'
          }
          $namespace = Get-Content -LiteralPath "$work\namespace.json" -Raw | ConvertFrom-Json
          if ([string]$namespace.runtimeId -cnotmatch '^[a-f0-9]{64}$') { throw 'The assigned Hermes worker namespace is invalid.' }
          $installedWorkers = Join-Path (Join-Path $installedRoot ('runtimes\'+$namespace.runtimeId)) 'workers'
          $pythonWorkers = "$work\runtime\workers\python\hermes"
          & $hermesPython -I -S -B "$env:GITHUB_WORKSPACE\candidate\packaging\windows\distribution\prepare-python-bytecode.py" `
            --agent hermes --worker-inputs "$work\runtime\workers\python-build-inputs" --workers-output $pythonWorkers `
            --installed-workers $installedWorkers --report "$pythonWorkers\bytecode.json"
          if ($LASTEXITCODE -ne 0) { throw 'The shipping Hermes interpreter could not compile the static workers in CI.' }
          & python "$owner\assemble_runtime.py" --output "$work\assembled" `
            --agent "hermes=$work\hermes-input\runtime" --canonical-hermes-receipt "$work\hermes-input\candidate\runtime-candidate.json" `
            --canonical-hermes-personal-proof "$work\hermes-input\personal-feasibility.json" --target-install-root $installedRoot `
            --hermes-executor-directory "$proof\mxc-token-inspection-build" --hermes-compatibility-directory "$proof\compatibility-build" --hermes-compatibility-proof "$proof\result.json" `
            --shared-node "$work\host\bin\node.exe" --node-version 22.23.2 --source-revision $env:GITHUB_SHA --component-identity $component `
            --namespace-receipt "$work\namespace.json" --worker-build "$work\runtime\workers" --executable-build "$work\runtime\executable"
          if ($LASTEXITCODE -ne 0) { throw 'The complete Hermes runtime could not be finalized and sealed.' }
      - name: Build the selected runtime as one finished application image
        if: ${{ needs.windows-finished-request.outputs.agent == 'hermes' }}
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          $work = "$env:RUNNER_TEMP\finished-windows"
          $identity = Get-Content -LiteralPath "$work\assembled\runtime-identity.json" -Raw | ConvertFrom-Json
          Remove-Item -LiteralPath "$work\hermes-input\runtime" -Recurse -Force
          & "$env:GITHUB_WORKSPACE\candidate\packaging\windows\installer\build-finished-runtime-image.ps1" `
            -RuntimeRoot "$work\assembled\runtimes\$($identity.runtimeId)" -RuntimeId $identity.runtimeId `
            -OutputImage "$work\runtime-image\$($identity.runtimeId).vhdx" `
            -ReceiptPath "$work\runtime-image\runtime-image.json"
      - name: Build the finished WPF, guarded launcher, transactional MSI and Burn preview
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          $work = "$env:RUNNER_TEMP\finished-windows"
          $tools = "$work\tools"
          New-Item -ItemType Directory -Path $tools | Out-Null
          [IO.File]::WriteAllText("$work\global.json", '{"sdk":{"version":"8.0.419","rollForward":"disable","allowPrerelease":false}}', [Text.UTF8Encoding]::new($false))
          Push-Location $work
          $config = "$tools\NuGet.Config"
          [IO.File]::WriteAllText($config, '<configuration><packageSources><clear/><add key="nuget.org" value="https://api.nuget.org/v3/index.json" /></packageSources></configuration>', [Text.UTF8Encoding]::new($false))
          & dotnet tool install wix --version 5.0.2 --tool-path $tools --configfile $config
          if ($LASTEXITCODE -ne 0) { throw 'The pinned WiX tool could not be prepared.' }
          $imageArguments = @{}
          if ($env:SELECTED_AGENT -ceq 'hermes') {
            $identity = Get-Content -LiteralPath "$work\assembled\runtime-identity.json" -Raw | ConvertFrom-Json
            $imageArguments = @{
              RuntimeImage = "$work\runtime-image\$($identity.runtimeId).vhdx"
              RuntimeImageReceipt = "$work\runtime-image\runtime-image.json"
            }
          }
          & "$env:GITHUB_WORKSPACE\candidate\packaging\windows\installer\build-immutable-package.ps1" `
            -SourceRoot "$env:GITHUB_WORKSPACE\candidate" -SourceRevision $env:GITHUB_SHA -ProductVersion $env:PRODUCT_VERSION `
            -HostPayloadRoot "$work\host" -RuntimeAssemblyRoot "$work\assembled" -OutputDirectory "$work\package" `
            -PythonPath (Get-Command python.exe -CommandType Application | Select-Object -First 1).Source `
            -DotNetPath (Get-Command dotnet.exe -CommandType Application | Select-Object -First 1).Source -WixPath "$tools\wix.exe" `
            -SystemDrivePrepPath "$work\system-drive-helper\NemoClawHostPreparation.exe" `
            -SystemDriveBuildReceipt "$work\system-drive-helper\build-receipt.json" -SystemDriveProofDirectory "$work\system-drive-proof" @imageArguments
          Pop-Location
      - name: Record exact native UI inputs for independent setup regression
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          $package = "$env:RUNNER_TEMP\finished-windows\package"
          $paths = @('build/BootstrapperPayloads.wxs','build/payload/mxc/wxc-host-prep.exe','build/payload/mxc/wxc-exec.exe') + @(Get-ChildItem -LiteralPath "$package\build\bootstrapper" -File | ForEach-Object { 'build/bootstrapper/' + $_.Name })
          $files = @($paths | ForEach-Object { $file = Join-Path $package $_; @{file=$_;bytes=(Get-Item -LiteralPath $file).Length;sha256=(Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()} })
          [IO.File]::WriteAllText("$package\migration-inputs.json", (@{schemaVersion=1;sourceRevision=$env:GITHUB_SHA;files=$files}|ConvertTo-Json -Depth 5), [Text.UTF8Encoding]::new($false))
      - name: Seal the installer for same-run private qualification
        id: product_manifest
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          $source = "$env:RUNNER_TEMP\finished-windows"
          $transfer = "$env:RUNNER_TEMP\finished-windows-product-transfer"
          if (Test-Path -LiteralPath $transfer) { throw 'The installer transfer root must be fresh.' }
          [void][IO.Directory]::CreateDirectory($transfer)
          Copy-Item -LiteralPath "$source\package" -Destination "$transfer\package" -Recurse
          [void][IO.Directory]::CreateDirectory("$transfer\assembled")
          Copy-Item -LiteralPath "$source\assembled\runtime-identity.json" -Destination "$transfer\assembled\runtime-identity.json"
          # Keep the original sealed controller/application transfer beside the MSI.
          # Acceptance must not depend on an older cache surviving the entire build.
          Copy-Item -LiteralPath "$env:RUNNER_TEMP\finished-windows-application-transfer" -Destination "$transfer\compiled-application" -Recurse
          $manifest = @(& "$env:GITHUB_WORKSPACE\candidate\scripts\checks\windows-native-transfer.ps1" -Mode Create -Root $transfer `
            -Kind finished-installer -SourceRevision $env:CANDIDATE_SHA -Agent $env:SELECTED_AGENT `
            -RunId $env:GITHUB_RUN_ID -RunAttempt $env:GITHUB_RUN_ATTEMPT)
          if ($manifest.Count -ne 1 -or [string]$manifest[0] -cnotmatch '^[a-f0-9]{64}$') { throw 'The installer transfer manifest failed.' }
          "manifest_sha256=$([string]$manifest[0])" >> $env:GITHUB_OUTPUT
          "cache_key=windows-finished-installer-v1-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:CANDIDATE_SHA-$env:SELECTED_AGENT" >> $env:GITHUB_OUTPUT
      - name: Save the executable installer only in the same-run cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/finished-windows-product-transfer
          key: ${{ steps.product_manifest.outputs.cache_key }}
      - name: Stage only non-runnable finished build evidence
        id: finished_evidence
        if: ${{ always() }}
        shell: pwsh
        run: |
          $work = "$env:RUNNER_TEMP\finished-windows"
          $inputs = @(
            "$work\host\runtime-payload-receipt.json",
            "$work\runtime-image\runtime-image.json",
            "$work\hermes-input\intake.json",
            "$work\hermes-input\personal-feasibility.json",
            "$work\hermes-input\personal-request.json",
            "$work\hermes-input\current-native-proof.json",
            "$work\hermes-input\current-msys-build.json",
            "$work\hermes-input\current-mxc-build.json",
            "$work\assembled\diagnostics",
            "$work\openshell-binaries\openshell-build.json",
            "$work\system-drive-helper\build-receipt.json",
            "$work\system-drive-helper\build.log",
            "$work\system-drive-proof"
          )
          foreach ($pattern in @(
            "$work\assembled\*.json", "$work\hermes-input\candidate\*.json",
            "$work\package\*.json", "$work\package\build\*.log",
            "$work\*.log", "$work\openshell-logs\*.log"
          )) {
            $inputs += @(Get-ChildItem -Path $pattern -File -ErrorAction SilentlyContinue | ForEach-Object FullName)
          }
          & "$env:GITHUB_WORKSPACE\candidate\scripts\checks\stage-windows-native-evidence.ps1" `
            -SourceBase $work -InputPath $inputs -OutputRoot "$env:RUNNER_TEMP\finished-windows-build-evidence"
      - name: Preserve finished build and helper proof evidence
        if: ${{ always() && steps.finished_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: finished-windows-preview-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/finished-windows-build-evidence/
          if-no-files-found: warn
          retention-days: 14

  windows-finished-installed-startup:
    name: Credential-free fresh installed OpenClaw startup and cleanup (ARM64)
    needs: [windows-finished-request, windows-finished-installer, windows-compiled-application]
    if: ${{ always() && needs.windows-finished-request.result == 'success' && needs.windows-finished-request.outputs.request_kind == 'pull-request' && needs.windows-finished-request.outputs.agent == 'openclaw' && needs.windows-finished-request.outputs.validation_scope == 'startup-only' && needs.windows-finished-installer.result == 'success' && needs.windows-compiled-application.result == 'success' }}
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    env:
      CANDIDATE_SHA: ${{ needs.windows-finished-request.outputs.candidate_sha }}
      SELECTED_AGENT: openclaw
      PRODUCT_VERSION: ${{ needs.windows-finished-request.outputs.product_version }}
    steps:
      - name: Check out the exact pull request acceptance controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.windows-finished-request.outputs.candidate_repository }}
          ref: ${{ needs.windows-finished-request.outputs.candidate_sha }}
          path: candidate
          persist-credentials: false
      - name: Restore exact same-run installer cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/finished-windows-product-transfer
          key: ${{ needs.windows-finished-installer.outputs.installer_cache_key }}
          fail-on-cache-miss: true
      - name: Verify and materialize exact same-run startup inputs
        shell: pwsh
        env:
          INSTALLER_MANIFEST: ${{ needs.windows-finished-installer.outputs.installer_manifest_sha256 }}
          APPLICATION_MANIFEST: ${{ needs.windows-compiled-application.outputs.application_manifest_sha256 }}
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          $product = "$env:RUNNER_TEMP\finished-windows-product-transfer"
          $application = "$product\compiled-application"
          $verifiedProduct = @(& "$env:GITHUB_WORKSPACE\candidate\scripts\checks\windows-native-transfer.ps1" -Mode Verify -Root $product `
            -Kind finished-installer -SourceRevision $env:CANDIDATE_SHA -Agent openclaw `
            -RunId $env:GITHUB_RUN_ID -RunAttempt $env:GITHUB_RUN_ATTEMPT -ExpectedManifestSha256 $env:INSTALLER_MANIFEST)
          $verifiedApplication = @(& "$env:GITHUB_WORKSPACE\candidate\scripts\checks\windows-native-transfer.ps1" -Mode Verify -Root $application `
            -Kind compiled-application -SourceRevision $env:CANDIDATE_SHA -Agent openclaw `
            -RunId $env:GITHUB_RUN_ID -RunAttempt $env:GITHUB_RUN_ATTEMPT -ExpectedManifestSha256 $env:APPLICATION_MANIFEST)
          if ($verifiedProduct.Count -ne 1 -or [string]$verifiedProduct[0] -cne $env:INSTALLER_MANIFEST -or
              $verifiedApplication.Count -ne 1 -or [string]$verifiedApplication[0] -cne $env:APPLICATION_MANIFEST) {
            throw 'A startup transfer did not match its producer.'
          }
          $work = "$env:RUNNER_TEMP\finished-windows"
          [void][IO.Directory]::CreateDirectory($work)
          Copy-Item -LiteralPath "$product\package" -Destination "$work\package" -Recurse
          Copy-Item -LiteralPath "$product\assembled" -Destination "$work\assembled" -Recurse
          Copy-Item -LiteralPath "$application\application" -Destination "$work\application" -Recurse
      - name: Exercise installed OpenClaw startup and owned cleanup without credentials
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          & "$env:GITHUB_WORKSPACE\candidate\packaging\windows\installer\run-installed-acceptance.ps1" `
            -SourceRoot "$env:GITHUB_WORKSPACE\candidate" -WorkDirectory "$env:RUNNER_TEMP\finished-windows" `
            -ProductVersion $env:PRODUCT_VERSION -ArtifactSourceRevision $env:CANDIDATE_SHA -Mode current-build -Agent openclaw -ValidationScope startup-only
      - name: Stage only non-runnable startup evidence
        id: startup_evidence
        if: ${{ always() }}
        shell: pwsh
        run: |
          $work = "$env:RUNNER_TEMP\finished-windows"
          $inputs = @("$work\installed-smoke", "$work\installed-stage-timings.json")
          foreach ($pattern in @("$work\*.log", "$work\package\*.json")) {
            $inputs += @(Get-ChildItem -Path $pattern -File -ErrorAction SilentlyContinue | ForEach-Object FullName)
          }
          & "$env:GITHUB_WORKSPACE\candidate\scripts\checks\stage-windows-native-evidence.ps1" `
            -SourceBase $work -InputPath $inputs -OutputRoot "$env:RUNNER_TEMP\finished-windows-startup-evidence"
      - name: Preserve credential-free fresh install, startup and cleanup evidence
        if: ${{ always() && steps.startup_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: finished-windows-installed-startup-${{ needs.windows-finished-request.outputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/finished-windows-startup-evidence/
          if-no-files-found: warn
          retention-days: 14

  # The same-commit reusable controller is callable only after both workflow
  # files land on main. It repeats every identity check and owns both protected
  # environments; this feature-branch workflow is not itself a trust boundary.
  windows-finished-trusted-qualification:
    name: Trusted full acceptance, migration and qualified publication
    needs: [windows-finished-request, windows-finished-installer, windows-compiled-application]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.windows-finished-request.result == 'success' && needs.windows-finished-request.outputs.trusted_main == 'true' && needs.windows-finished-request.outputs.exact_workflow == 'true' && needs.windows-finished-request.outputs.exact_pr == 'true' && needs.windows-finished-request.outputs.credential_authorized == 'true' && needs.windows-finished-request.outputs.validation_scope == 'full-acceptance' && needs.windows-finished-installer.result == 'success' && needs.windows-compiled-application.result == 'success' }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
    uses: ./.github/workflows/windows-native-installer-trusted.yaml
    with:
      pr_number: ${{ needs.windows-finished-request.outputs.pr_number }}
      candidate_repository: ${{ needs.windows-finished-request.outputs.candidate_repository }}
      candidate_sha: ${{ needs.windows-finished-request.outputs.candidate_sha }}
      base_sha: ${{ needs.windows-finished-request.outputs.base_sha }}
      workflow_sha: ${{ needs.windows-finished-request.outputs.workflow_sha }}
      agent: ${{ needs.windows-finished-request.outputs.agent }}
      product_version: ${{ needs.windows-finished-request.outputs.product_version }}
      installer_cache_key: ${{ needs.windows-finished-installer.outputs.installer_cache_key }}
      installer_manifest_sha256: ${{ needs.windows-finished-installer.outputs.installer_manifest_sha256 }}
      application_manifest_sha256: ${{ needs.windows-compiled-application.outputs.application_manifest_sha256 }}

  windows-compiled-application:
    name: Compile exact Windows application units (ARM64)
    needs: windows-finished-request
    outputs:
      application_cache_key: ${{ steps.transfer_manifest.outputs.cache_key }}
      application_manifest_sha256: ${{ steps.transfer_manifest.outputs.manifest_sha256 }}
    if: ${{ always() && needs.windows-finished-request.result == 'success' && ((needs.windows-finished-request.outputs.build_allowed == 'true') || (github.event_name == 'workflow_dispatch' && inputs.probe_official_hermes_components && inputs.official_hermes_phase == 'application')) }}
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: ${{ needs.windows-finished-request.outputs.candidate_sha }}
      SELECTED_AGENT: ${{ needs.windows-finished-request.outputs.agent }}
    steps:
      - name: Check out Windows application packaging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.windows-finished-request.outputs.candidate_repository }}
          ref: ${{ needs.windows-finished-request.outputs.candidate_sha }}
          persist-credentials: false
      - name: Prepare a fresh compiled application workspace
        shell: pwsh
        run: |
          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          $work = [IO.Path]::GetFullPath((Join-Path $runnerTemp 'compiled-windows-app'))
          if ([IO.Path]::GetRelativePath($runnerTemp, $work) -cne 'compiled-windows-app') {
            throw 'The compiled application workspace escaped RUNNER_TEMP.'
          }
          if (Test-Path -LiteralPath $work) {
            Remove-Item -LiteralPath $work -Recurse -Force
          }
          New-Item -ItemType Directory -Path $work | Out-Null
      - name: Reject unsupported finished-installer validation scopes
        if: ${{ needs.windows-finished-request.outputs.build_allowed == 'true' }}
        shell: pwsh
        env:
          VALIDATION_SCOPE: ${{ needs.windows-finished-request.outputs.validation_scope }}
        run: |
          if ($env:SELECTED_AGENT -ceq 'hermes' -and $env:VALIDATION_SCOPE -ceq 'startup-only') { throw 'Hermes requires its existing full-acceptance lane.' }
      - name: Prepare the pinned native application compiler
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          & packaging/windows/app/prepare-app-node.ps1 `
            -LockPath packaging/windows/hermes/official-runtime.lock.json `
            -OutputDirectory "$env:RUNNER_TEMP\compiled-windows-app\node"
      - name: Verify installed acceptance controller Windows compatibility
        if: ${{ needs.windows-finished-request.outputs.build_allowed == 'true' }}
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          $work = "$env:RUNNER_TEMP\compiled-windows-app"
          $output = "$work\controls"
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          $tests = @(
            'packaging/windows/installer/control-installed-openclaw-input.test.mts',
            'packaging/windows/installer/run-installed-acceptance.test.mts',
            'packaging/windows/installer/qualify-finished-package.test.mts',
            'packaging/windows/runtime/native-ui-tunnel.test.mts'
          )
          & "$work\node\node.exe" --experimental-strip-types --no-warnings --test @tests `
            1>"$output\installed-acceptance-controller.stdout.log" `
            2>"$output\installed-acceptance-controller.stderr.log"
          if ($LASTEXITCODE -ne 0) { throw 'The Windows installed-acceptance controller controls failed.' }
          & "$work\node\node.exe" --experimental-strip-types --no-warnings --test `
            packaging/windows/installer/qualify-installed-hermes.test.mts `
            packaging/windows/installer/windows-native-transfer.test.mts `
            packaging/windows/runtime/native-configuration-credentials.test.mts `
            packaging/windows/runtime/native-setup-transaction.test.mts
          if ($LASTEXITCODE -ne 0) { throw 'The Windows Hermes and configuration transaction controls failed.' }
          $files = @($tests | ForEach-Object {
            $file = Join-Path $env:GITHUB_WORKSPACE $_
            @{ file = $_; bytes = (Get-Item -LiteralPath $file).Length; sha256 = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant() }
          })
          [IO.File]::WriteAllText("$output\installed-acceptance-controller.json", (@{
            schemaVersion = 1
            classification = 'same-run-installed-acceptance-controller-controls'
            sourceRevision = $env:GITHUB_SHA
            nodeSha256 = (Get-FileHash -LiteralPath "$work\node\node.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
            passed = $true
            files = $files
          } | ConvertTo-Json -Depth 5), [Text.UTF8Encoding]::new($false))
      - name: Restore immutable application build inputs
        if: ${{ needs.windows-finished-request.outputs.agent == 'openclaw' }}
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          python packaging/windows/app/materialize-openclaw-build.py `
            --output "$env:RUNNER_TEMP\compiled-windows-app\inputs" `
            --cache "$env:RUNNER_TEMP\compiled-windows-app\downloads"
          if ($LASTEXITCODE -ne 0) { throw 'Application build inputs failed verification.' }
      - name: Verify Windows native plugin file URL loading
        if: ${{ needs.windows-finished-request.outputs.agent == 'openclaw' }}
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          & "$env:RUNNER_TEMP\compiled-windows-app\node\node.exe" `
            --experimental-strip-types packaging/windows/app/test-windows-plugin-file-url.mts `
            --source-root "$env:RUNNER_TEMP\compiled-windows-app\inputs\openclaw"
          if ($LASTEXITCODE -ne 0) { throw 'Windows native plugin loading controls failed.' }
          & "$env:RUNNER_TEMP\compiled-windows-app\node\node.exe" `
            --experimental-strip-types packaging/windows/app/test-windows-update-owner.mts `
            --source-root "$env:RUNNER_TEMP\compiled-windows-app\inputs\openclaw"
          if ($LASTEXITCODE -ne 0) { throw 'Installer-owned update controls failed.' }
          & "$env:RUNNER_TEMP\compiled-windows-app\node\node.exe" `
            --experimental-strip-types packaging/windows/app/test-windows-configured-plugin-install.mts `
            --source-root "$env:RUNNER_TEMP\compiled-windows-app\inputs\openclaw"
          if ($LASTEXITCODE -ne 0) { throw 'Installer-owned configured-plugin controls failed.' }
      - name: Compile the OpenClaw application unit
        if: ${{ needs.windows-finished-request.outputs.agent == 'openclaw' }}
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          & "$env:RUNNER_TEMP\compiled-windows-app\node\node.exe" `
            --experimental-strip-types --max-old-space-size=8192 `
            packaging/windows/app/build-openclaw-app.mts `
            --source-root "$env:RUNNER_TEMP\compiled-windows-app\inputs\openclaw" `
            --tool-root "$env:RUNNER_TEMP\compiled-windows-app\inputs\tools" `
            --output "$env:RUNNER_TEMP\compiled-windows-app\build"
          if ($LASTEXITCODE -ne 0) { throw 'The Windows application compilation failed.' }
      - name: Execute the compiled application through its CLI and Worker API
        if: ${{ needs.windows-finished-request.outputs.agent == 'openclaw' }}
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          & "$env:RUNNER_TEMP\compiled-windows-app\node\node.exe" `
            --experimental-strip-types packaging/windows/app/test-compiled-openclaw.mts `
            --app-root "$env:RUNNER_TEMP\compiled-windows-app\build\app" `
            --output "$env:RUNNER_TEMP\compiled-windows-app\controls\compiled-openclaw"
          if ($LASTEXITCODE -ne 0) { throw 'The compiled Windows application controls failed.' }
      - name: Exercise compiled provider, tools and all packaged onboarding choices
        if: ${{ needs.windows-finished-request.outputs.agent == 'openclaw' }}
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          $work = "$env:RUNNER_TEMP\compiled-windows-app"
          $ciNode = "$work\node\node.exe"
          $application = "$work\build\app"
          $diagnostics = "$work\build\diagnostics"
          $source = "$env:GITHUB_WORKSPACE\packaging\windows\app"
          & $ciNode --experimental-strip-types "$source\test-compiled-openclaw-model-tools.mts" `
            --app-root $application --output "$diagnostics\local-model-tools"
          if ($LASTEXITCODE -ne 0) { throw 'The compiled local-provider and actual tool execution checks failed.' }
          $choices = @('brave', 'discord', 'slack', 'tavily')
          $checks = @($choices | ForEach-Object -Parallel {
            $ErrorActionPreference = 'Stop'
            $choice = $_
            $output = Join-Path $using:diagnostics ('choice-' + $choice)
            & $using:ciNode --experimental-strip-types (Join-Path $using:source 'test-prebuilt-choice-plugins.mts') `
              --app-root $using:application --choice $choice --output $output `
              1>($output + '.controller.stdout.log') 2>($output + '.controller.stderr.log')
            [pscustomobject]@{ choice=$choice; exitCode=$LASTEXITCODE }
          } -ThrottleLimit 4)
          $checks | ConvertTo-Json -Depth 3 | Set-Content -LiteralPath "$diagnostics\configured-choice-results.json" -Encoding utf8
          if ($checks.Count -ne 4 -or @($checks | Where-Object exitCode -NE 0).Count -ne 0) {
            throw 'A packaged onboarding choice did not complete its configured gateway checks.'
          }
      - name: Verify the compiled dashboard and packaged resources in a real browser
        if: ${{ needs.windows-finished-request.outputs.agent == 'openclaw' }}
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          $work = "$env:RUNNER_TEMP\compiled-windows-app"
          $browsers = @(
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe",
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe"
          )
          $browser = $browsers | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $browser) { throw 'The Windows runner has no preinstalled browser for dashboard validation.' }
          & "$work\node\node.exe" --experimental-strip-types `
            packaging/windows/app/test-compiled-openclaw-gateway.mts `
            --app-root "$work\build\app" --output "$work\gateway-control" `
            --browser-executable $browser
          if ($LASTEXITCODE -ne 0) { throw 'The compiled Windows dashboard or resource control failed.' }
      - name: Prepare only shared compiler and browser-observer tools for Hermes
        if: ${{ needs.windows-finished-request.outputs.agent != 'openclaw' }}
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          python packaging/windows/distribution/prepare-native-build-tools.py `
            --output "$env:RUNNER_TEMP\compiled-windows-app\inputs" --cache "$env:RUNNER_TEMP\compiled-windows-app\downloads"
          if ($LASTEXITCODE -ne 0) { throw 'The shared runtime compiler tools failed verification.' }
      - name: Prepare the pinned executable resource injector
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          python packaging/windows/distribution/prepare-executable-tools.py `
            --output "$env:RUNNER_TEMP\compiled-windows-app\executable-tools" `
            --cache "$env:RUNNER_TEMP\compiled-windows-app\downloads"
          if ($LASTEXITCODE -ne 0) { throw 'Executable build tools failed verification.' }
      - name: Compile the native application dispatcher and static workers
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          $work = "$env:RUNNER_TEMP\compiled-windows-app"
          if ($env:SELECTED_AGENT -eq 'openclaw') {
            New-Item -ItemType Junction -Path "$work\inputs\tools\node_modules\typescript" `
              -Target "$work\inputs\openclaw\node_modules\typescript" | Out-Null
          }
          New-Item -ItemType Junction -Path "$env:GITHUB_WORKSPACE\node_modules" `
            -Target "$work\inputs\tools\node_modules" | Out-Null
          & "$work\node\node.exe" --experimental-strip-types --no-warnings --test packaging/windows/distribution/compile-pi-sdks.test.mts
          if ($LASTEXITCODE -ne 0) { throw 'Pi SDK compilation regression tests failed.' }
          & "$work\node\node.exe" --experimental-strip-types `
            packaging/windows/distribution/build-native-workers.mts "$work\workers"
          if ($LASTEXITCODE -ne 0) { throw 'Static application worker compilation failed.' }
      - name: Build and execute the Windows application EXE
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          $work = "$env:RUNNER_TEMP\compiled-windows-app"
          & "$work\node\node.exe" --experimental-strip-types `
            packaging/windows/distribution/prepare-native-executable.mts `
            "$work\workers\native-runtime.cjs" `
            "$work\executable-tools\postject\dist\api.js" "$work\executable"
          if ($LASTEXITCODE -ne 0) { throw 'The Windows application EXE build or execution failed.' }
      - name: Seal exact executable units for same-run private transfer
        id: transfer_manifest
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:CANDIDATE_SHA
          $source = "$env:RUNNER_TEMP\compiled-windows-app"
          $transfer = "$env:RUNNER_TEMP\finished-windows-application-transfer"
          if (Test-Path -LiteralPath $transfer) { throw 'The application transfer root must be fresh.' }
          [void][IO.Directory]::CreateDirectory($transfer)
          function Copy-TransferInput([string]$Group, [string]$Relative) {
            $input = Join-Path $source $Relative
            if (-not (Test-Path -LiteralPath $input)) { return }
            $output = Join-Path (Join-Path $transfer $Group) $Relative
            [void][IO.Directory]::CreateDirectory([IO.Path]::GetDirectoryName($output))
            Copy-Item -LiteralPath $input -Destination $output -Recurse -Force
          }
          @(
            'build/app', 'build/build-receipt.json', 'node',
            'controls/installed-acceptance-controller.json',
            'inputs/tools/node_modules/playwright-core', 'inputs/tools/node_modules/esbuild',
            'inputs/tools/node_modules/@esbuild/win32-arm64', 'inputs/materialization-receipt.json'
          ) | ForEach-Object { Copy-TransferInput application $_ }
          @('executable', 'workers') | ForEach-Object { Copy-TransferInput runtime $_ }
          $manifest = @(& scripts/checks/windows-native-transfer.ps1 -Mode Create -Root $transfer `
            -Kind compiled-application -SourceRevision $env:CANDIDATE_SHA -Agent $env:SELECTED_AGENT `
            -RunId $env:GITHUB_RUN_ID -RunAttempt $env:GITHUB_RUN_ATTEMPT)
          if ($manifest.Count -ne 1 -or [string]$manifest[0] -cnotmatch '^[a-f0-9]{64}$') { throw 'The application transfer manifest failed.' }
          "manifest_sha256=$([string]$manifest[0])" >> $env:GITHUB_OUTPUT
          "cache_key=windows-finished-application-v1-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:CANDIDATE_SHA-$env:SELECTED_AGENT" >> $env:GITHUB_OUTPUT
      - name: Save exact executable units only in the same-run cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/finished-windows-application-transfer
          key: ${{ steps.transfer_manifest.outputs.cache_key }}
      - name: Stage only non-runnable application diagnostics
        id: application_evidence
        if: ${{ always() }}
        shell: pwsh
        run: |
          $work = "$env:RUNNER_TEMP\compiled-windows-app"
          $inputs = @(
            "$work\controls\installed-acceptance-controller.json",
            "$work\controls\installed-acceptance-controller.stdout.log",
            "$work\controls\installed-acceptance-controller.stderr.log",
            "$work\controls\compiled-openclaw\compiled-controls.json",
            "$work\controls\compiled-openclaw\direct-version.log",
            "$work\controls\compiled-openclaw\worker-version.log",
            "$work\controls\compiled-openclaw\config-validate.log",
            "$work\gateway-control\gateway-control.json",
            "$work\gateway-control\stdout.log", "$work\gateway-control\stderr.log",
            "$work\workers\build.json", "$work\workers\source-adaptation.json",
            "$work\executable-tools\tools-input.json",
            "$work\build\diagnostics\configured-choice-results.json",
            "$work\build\diagnostics\local-model-tools\result.json",
            "$work\build\diagnostics\local-model-tools\undici-instances.json",
            "$work\build\diagnostics\local-model-tools\stdout.log",
            "$work\build\diagnostics\local-model-tools\stderr.log",
            "$work\build\build-receipt.json", "$work\build\build-failure.json",
            "$work\inputs\materialization-receipt.json", "$work\node\node-input.json"
          )
          foreach ($choice in @('brave', 'discord', 'slack', 'tavily')) {
            $choiceRoot = "$work\build\diagnostics\choice-$choice"
            $inputs += @("$choiceRoot\result.json", "$choiceRoot\registered.json")
          }
          foreach ($pattern in @(
            "$work\build\diagnostics\choice-*.controller.stdout.log",
            "$work\build\diagnostics\choice-*.controller.stderr.log",
            "$work\build\diagnostics\choice-*\*.stdout.log",
            "$work\build\diagnostics\choice-*\*.stderr.log",
            "$work\executable\*.json", "$work\executable\*.log"
          )) {
            $inputs += @(Get-ChildItem -Path $pattern -File -ErrorAction SilentlyContinue | ForEach-Object FullName)
          }
          & "$env:GITHUB_WORKSPACE\scripts\checks\stage-windows-native-evidence.ps1" `
            -SourceBase $work -InputPath $inputs -OutputRoot "$env:RUNNER_TEMP\compiled-windows-application-evidence"
      - name: Preserve application build diagnostics
        if: ${{ always() && steps.application_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compiled-windows-application-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/compiled-windows-application-evidence/
          if-no-files-found: error
          retention-days: 14

  windows-system-drive-proof:
    name: Native system-drive preparation and MXC proof (ARM64)
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.run_windows_native_installer && inputs.probe_official_hermes_components && inputs.official_hermes_phase == 'system-drive' }}
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 12
    steps:
      - name: Check out the fixed-purpose Windows helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned native Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.95.0
          target: aarch64-pc-windows-msvc
          cache: false
      - name: Prepare only the pinned Node and MXC executables
        shell: pwsh
        run: |
          $work = "$env:RUNNER_TEMP\system-drive-inputs"
          & packaging/windows/app/prepare-app-node.ps1 `
            -LockPath packaging/windows/hermes/official-runtime.lock.json -OutputDirectory "$work\node"
          $archive = "$work\mxc-sdk.tgz"
          Invoke-WebRequest 'https://registry.npmjs.org/@microsoft/mxc-sdk/-/mxc-sdk-0.8.0.tgz' -OutFile $archive -TimeoutSec 60
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne '06bb2399d7e98ab1907acf851e12a4e44748dd467b79d3e53c2f2fbf569da14e') {
            throw 'The MXC SDK differs from its immutable archive.'
          }
          & "$env:SystemRoot\System32\tar.exe" -xzf $archive -C $work package/bin/arm64/wxc-exec.exe package/bin/arm64/wxc-host-prep.exe
          if ($LASTEXITCODE -ne 0) { throw 'The two pinned MXC executables could not be extracted.' }
      - name: Compile and exercise the native metadata helper
        shell: pwsh
        run: |
          $work = "$env:RUNNER_TEMP\host-preparation-helper"
          & packaging/windows/host-preparation/build-helper.ps1 -OutputDirectory $work
          & rustup run 1.95.0-aarch64-pc-windows-msvc cargo test --locked --offline `
            --target aarch64-pc-windows-msvc --manifest-path packaging/windows/host-preparation/Cargo.toml `
            --target-dir "$work\rust-target" -- --test-threads=1 2>&1 | Tee-Object -FilePath "$work\native-controls.log"
          if ($LASTEXITCODE -ne 0) { throw 'The actual native metadata controls failed.' }
      - name: Verify retained preparation errors and Setup diagnostics
        shell: pwsh
        run: |
          & dotnet run --project packaging/windows/tests/host-preparation-diagnostics/HostPreparation.Diagnostics.Controls.csproj -- "$env:RUNNER_TEMP\system-drive-inputs\package\bin\arm64\wxc-exec.exe"
          if ($LASTEXITCODE -ne 0) { throw 'The preparation diagnostic controls failed.' }
      - name: Verify the actual system root and contained Node access
        shell: pwsh
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -File "$env:GITHUB_WORKSPACE\packaging\windows\host-preparation\test-system-root-mxc.ps1" `
            -HelperPath "$env:RUNNER_TEMP\host-preparation-helper\NemoClawHostPreparation.exe" `
            -MxcDirectory "$env:RUNNER_TEMP\system-drive-inputs\package\bin\arm64" `
            -NodePath "$env:RUNNER_TEMP\system-drive-inputs\node\node.exe" `
            -ArtifactDirectory "$env:RUNNER_TEMP\system-root-mxc-proof"
          if ($LASTEXITCODE -ne 0) { throw 'The Windows PowerShell 5.1 system-drive proof failed.' }
      - name: Set up pinned proof verifier Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.1.0
        with:
          python-version: 3.13.13
          architecture: arm64
      - name: Bind the actual proof to the package verifier
        shell: pwsh
        run: |
          & python packaging/windows/installer/verify-system-drive-proof.py `
            --helper "$env:RUNNER_TEMP\host-preparation-helper\NemoClawHostPreparation.exe" `
            --build-receipt "$env:RUNNER_TEMP\host-preparation-helper\build-receipt.json" `
            --proof-directory "$env:RUNNER_TEMP\system-root-mxc-proof" `
            --source-root $env:GITHUB_WORKSPACE --source-revision $env:GITHUB_SHA `
            --node-path "$env:RUNNER_TEMP\system-drive-inputs\node\node.exe" `
            --output "$env:RUNNER_TEMP\system-root-mxc-proof\system-drive-build-gate.json"
          if ($LASTEXITCODE -ne 0) { throw 'The package verifier rejected the actual system-drive proof.' }
          & python packaging/windows/hermes/test-native-adapter-paths.py -v
          if ($LASTEXITCODE -ne 0) { throw 'The native Hermes adapter path controls failed.' }
          & python packaging/windows/hermes/test_generated_finder_paths.py -v
