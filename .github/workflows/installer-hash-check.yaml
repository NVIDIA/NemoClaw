#
# Verifies pinned installer SHA-256 hashes still match upstream scripts.
# Checked: allowlisted OpenShell installer and Brev release assets.
# Reports the required network-backed drift check on every PR, every push to
# main, and weekly. Pull requests execute checker code from their base commit.
# A new release-manifest allowlist entry must land on main in a prerequisite PR
# before a later PR changes runtime selectors to that release.

name: Security / Verify Installer Hashes

run-name: >-
  ${{ inputs.repair_attempt_key != '' &&
  format('Repair validation {0} head {1}', inputs.repair_attempt_key,
  inputs.repair_head_sha) || github.event_name == 'pull_request' &&
  format('Installer Hash PR #{0} head {1} base {2} gate true',
  github.event.pull_request.number, github.event.pull_request.head.sha,
  github.event.pull_request.base.sha) ||
  format('Installer Hash {0} {1}', github.event_name, github.sha) }}

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  schedule:
    # Weekly fallback in case upstream changes between PRs
    - cron: "30 9 * * 1"
  workflow_dispatch:
    inputs:
      repair_pr_number:
        required: false
        type: string
        default: ""
      repair_head_sha:
        required: false
        type: string
        default: ""
      repair_base_sha:
        required: false
        type: string
        default: ""
      repair_attempt_key:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  validate-repair-target:
    uses: ./.github/workflows/validate-repair-target.yaml
    with:
      repair_pr_number: ${{ inputs.repair_pr_number }}
      repair_head_sha: ${{ inputs.repair_head_sha }}
      repair_base_sha: ${{ inputs.repair_base_sha }}
      repair_attempt_key: ${{ inputs.repair_attempt_key }}
    permissions:
      contents: read
      pull-requests: read

  check-hash:
    needs: validate-repair-target
    if: ${{ always() && github.repository == 'NVIDIA/NemoClaw' && (inputs.repair_attempt_key == '' || needs.validate-repair-target.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Set up trusted installer hash parser runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0

      # The checkout of the latest PR commit supplies data only. The checker and
      # pin parser execute from the checkout of the PR base SHA below.
      - name: Checkout pull request head
        if: ${{ github.event_name == 'pull_request' || inputs.repair_attempt_key != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NVIDIA/NemoClaw
          ref: ${{ inputs.repair_attempt_key != '' && inputs.repair_head_sha || github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Checkout trusted event
        if: ${{ github.event_name != 'pull_request' && inputs.repair_attempt_key == '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout base-trusted installer hash action
        if: ${{ github.event_name == 'pull_request' || inputs.repair_attempt_key != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.repair_attempt_key != '' && github.workflow_sha || github.event.pull_request.base.sha }}
          path: .trusted-installer-hash
          persist-credentials: false
          sparse-checkout: |
            .github/actions/ci-installer-hash-check
            scripts/check-installer-hash.sh
            scripts/checks/extract-installer-pins.mts
          sparse-checkout-cone-mode: false

      - name: Verify pull request installer hashes from base-trusted code
        if: ${{ github.event_name == 'pull_request' || inputs.repair_attempt_key != '' }}
        uses: ./.trusted-installer-hash/.github/actions/ci-installer-hash-check
        with:
          repo-root: ${{ github.workspace }}

      - name: Verify trusted event installer hashes
        if: ${{ github.event_name != 'pull_request' && inputs.repair_attempt_key == '' }}
        uses: ./.github/actions/ci-installer-hash-check
        with:
          repo-root: ${{ github.workspace }}

  repair-receipt:
    name: ${{ format('Repair receipt {0} PR {1} head {2} base {3}', inputs.repair_attempt_key, inputs.repair_pr_number, inputs.repair_head_sha, inputs.repair_base_sha) }}
    needs: check-hash
    if: ${{ inputs.repair_attempt_key != '' && needs.check-hash.result == 'success' }}
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Record exact validation receipt
        run: echo 'Trusted validation completed for the exact repair inputs.'
