#
# Verifies pinned installer SHA-256 hashes still match upstream scripts.
# Checked: allowlisted OpenShell installer and Brev release assets.
# Reports the required network-backed drift check on every PR, every push to
# main, and weekly. Pull requests normally execute their base's verifier.
# The exact pre-admission base below uses a reviewed immutable revision containing
# the bounded-curl fingerprint. Later bases use their own verifier, so future
# trust additions and revocations are not frozen to this rollout revision.

name: Security / Verify Installer Hashes

run-name: >-
  ${{ github.event_name == 'pull_request' &&
  format('Installer Hash PR #{0} head {1} base {2} gate true',
  github.event.pull_request.number, github.event.pull_request.head.sha,
  github.event.pull_request.base.sha) ||
  format('Installer Hash {0} {1}', github.event_name, github.sha) }}

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  schedule:
    # Weekly fallback in case upstream changes between PRs
    - cron: "30 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-hash:
    if: github.repository == 'NVIDIA/NemoClaw'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The checkout of the latest PR commit supplies data only. The checker and
      # pin parser execute from the base or exact reviewed rollout revision below.
      - name: Checkout pull request head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Checkout trusted event
        if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout reviewed installer hash action
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NVIDIA/NemoClaw
          # This revision retains every trust record from the named base and
          # admits only the exact bounded-curl template from #12374.
          ref: >-
            ${{ github.event.pull_request.base.sha == '241fcd199275fa1d1ac6bf9beddd991117398536' &&
            '9daa989354dcdf3756165337877bf659d9d27dc6' || github.event.pull_request.base.sha }}
          path: .trusted-installer-hash
          persist-credentials: false
          sparse-checkout: |
            .github/actions/ci-installer-hash-check
            scripts/check-installer-hash.sh
            scripts/checks/extract-installer-pins.mts
          sparse-checkout-cone-mode: false

      - name: Set up trusted installer hash parser runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1

      - name: Install immutable reviewed npm
        if: github.event_name == 'pull_request'
        uses: NVIDIA/NemoClaw/.github/actions/setup-reviewed-npm@98669f24d35f18e49b6b2769cd68709509ea24f2

      - name: Install trusted-event reviewed npm
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/setup-reviewed-npm

      - name: Verify pull request installer hashes from reviewed code
        if: github.event_name == 'pull_request'
        uses: ./.trusted-installer-hash/.github/actions/ci-installer-hash-check
        with:
          repo-root: ${{ github.workspace }}

      - name: Verify trusted event installer hashes
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/ci-installer-hash-check
        with:
          repo-root: ${{ github.workspace }}
