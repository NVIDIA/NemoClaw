# This PR-context workflow only wakes the default-branch admission controller.
# It uses permissions: {} and has no checkout, artifacts, or admission authority.
name: Security / Candidate Review Signal
on:
  pull_request_review:
    types: [submitted, edited, dismissed]
permissions: {}
jobs:
  signal:
    if: ${{ github.repository == 'NVIDIA/NemoClaw' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == 'NVIDIA/NemoClaw' }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Signal a review change
        run: echo 'Candidate admission will read the current PR reviews.'
