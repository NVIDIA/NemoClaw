name: Dependencies / Pin Diesel Nightly

on:
  schedule:
    # 21:00 PST / 22:00 PDT
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: upstream-runtime-drift-${{ github.ref }}
  cancel-in-progress: false

jobs:
  report:
    name: Pin Diesel dependency report
    if: github.repository == 'NVIDIA/NemoClaw'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"

      - name: Compare NemoClaw pins with stable upstream releases
        id: drift
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_DIR: ${{ runner.temp }}/upstream-runtime-drift
          RUN_URL: https://github.com/NVIDIA/NemoClaw/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "${REPORT_DIR}"
          node --experimental-strip-types --no-warnings \
            scripts/checks/upstream-runtime-drift.mts \
            --json-output "${REPORT_DIR}/report.json" \
            --nemoclaw-sha "${GITHUB_SHA}" \
            --report-output "${REPORT_DIR}/report.md" \
            --slack-output "${REPORT_DIR}/slack.json" \
            --summary-output "${GITHUB_STEP_SUMMARY}" \
            --run-url "${RUN_URL}"
          echo "ready=true" >> "${GITHUB_OUTPUT}"

      - name: Upload Pin Diesel report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pin-diesel-nightly-report
          path: ${{ runner.temp }}/upstream-runtime-drift/
          if-no-files-found: ignore
          retention-days: 30

      - name: Send Pin Diesel to the situation room
        if: >-
          always() &&
          steps.drift.outputs.ready == 'true' &&
          github.ref == 'refs/heads/main'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN_PIN_DIESEL }}
          SLACK_CHANNEL_ID: C0ALN454EH4
          SLACK_CHANNEL_NAME: nemoclaw-situation-room
          SLACK_PAYLOAD_PATH: ${{ runner.temp }}/upstream-runtime-drift/slack.json
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const token = process.env.SLACK_BOT_TOKEN;
          if (!token) {
            process.stdout.write(
              `::notice::SLACK_BOT_TOKEN_PIN_DIESEL is not configured; ` +
                `Pin Diesel cannot post to #${process.env.SLACK_CHANNEL_NAME} ` +
                `(${process.env.SLACK_CHANNEL_ID}). The GitHub report remains available.\n`,
            );
            process.exit(0);
          }

          const channel = process.env.SLACK_CHANNEL_ID;
          if (!channel) {
            throw new Error("The Slack channel ID is not configured.");
          }

          let payload;
          try {
            payload = JSON.parse(fs.readFileSync(process.env.SLACK_PAYLOAD_PATH, "utf8"));
          } catch {
            throw new Error("The Slack report payload is not valid JSON.");
          }
          const apiPayload = {
            ...payload,
            channel,
            unfurl_links: false,
            unfurl_media: false,
          };
          const encoded = JSON.stringify(apiPayload);
          const blocks = payload?.attachments?.[0]?.blocks;
          if (
            typeof payload?.text !== "string" ||
            payload.text.length > 3000 ||
            !Array.isArray(payload.attachments) ||
            payload.attachments.length !== 1 ||
            !Array.isArray(blocks) ||
            blocks.length < 2 ||
            blocks.length > 3 ||
            encoded.length > 50000 ||
            encoded.includes("<!")
          ) {
            throw new Error("The Slack report payload is invalid.");
          }

          let response;
          try {
            response = await fetch("https://slack.com/api/chat.postMessage", {
              method: "POST",
              headers: {
                authorization: `Bearer ${token}`,
                "content-type": "application/json",
              },
              body: encoded,
              redirect: "error",
              signal: AbortSignal.timeout(10000),
            });
          } catch {
            throw new Error("The Slack chat.postMessage request failed.");
          }
          if (!response.ok) {
            throw new Error(`Slack chat.postMessage returned HTTP ${response.status}.`);
          }

          let result;
          try {
            result = await response.json();
          } catch {
            throw new Error("Slack chat.postMessage returned invalid JSON.");
          }
          if (
            result?.ok !== true ||
            result.channel !== channel ||
            typeof result.ts !== "string"
          ) {
            throw new Error(
              "Slack chat.postMessage did not confirm a posted message in the target channel.",
            );
          }
          NODE
