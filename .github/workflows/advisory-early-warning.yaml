#
# Advisory early warning (#7338): every six hours, fetch public GitHub Security
# Advisories that name packages in the reviewed npm inventory and correlate them
# with scripts/advisory-early-warning-scan.mts. All three advisory types are
# fetched: "reviewed" records (the corpus npm audit already enforces, so a
# match means enforcement is imminent or active), "unreviewed" records
# (NVD-sourced, often published before curation reaches the reviewed feed —
# these commonly lack a verified npm mapping and flow through the module's
# ambiguous, informational-only path), and "malware" records (npm malware
# advisories naming an inventory package). Matches surface as a rolling,
# security-labeled tracking issue — a traceable, NON-blocking investigation
# signal. Enforcement stays with the reviewed npm audit gate; this workflow
# never fails a build or mutates a release.

name: Security / Advisory Early Warning

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: advisory-early-warning
  cancel-in-progress: false

jobs:
  early-warning:
    if: github.repository == 'NVIDIA/NemoClaw'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup production-compatible Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22.22.2"

      - name: Fetch advisories naming reviewed inventory packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/advisory-early-warning-scan.mts \
            --list-packages >"$RUNNER_TEMP/inventory-packages.txt"
          batches=()
          batch=""
          batch_count=0
          while IFS= read -r package_name; do
            [ -n "$package_name" ] || continue
            if [ -z "$batch" ]; then
              batch="$package_name"
            else
              batch="$batch,$package_name"
            fi
            batch_count=$((batch_count + 1))
            if [ "$batch_count" -ge 25 ]; then
              batches+=("$batch")
              batch=""
              batch_count=0
            fi
          done <"$RUNNER_TEMP/inventory-packages.txt"
          [ -z "$batch" ] || batches+=("$batch")
          : >"$RUNNER_TEMP/advisory-records.jsonl"
          for advisory_type in reviewed unreviewed malware; do
            for batch in "${batches[@]}"; do
              gh api -X GET /advisories \
                -f "type=$advisory_type" \
                -f ecosystem=npm \
                -f "affects=$batch" \
                -f per_page=100 \
                --paginate \
                --jq '.[]' >>"$RUNNER_TEMP/advisory-records.jsonl"
            done
          done
          jq -s 'unique_by(.ghsa_id)' "$RUNNER_TEMP/advisory-records.jsonl" \
            >"$RUNNER_TEMP/advisories.json"
          echo "Fetched $(jq 'length' "$RUNNER_TEMP/advisories.json") advisory records"

      - name: Correlate advisories with the reviewed inventory
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/advisory-early-warning-scan.mts \
            --advisories "$RUNNER_TEMP/advisories.json" \
            --output "$RUNNER_TEMP/signals.json"

      - name: Create or update the rolling early-warning issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          signals="$RUNNER_TEMP/signals.json"
          count="$(jq 'length' "$signals")"
          if [ "$count" -eq 0 ]; then
            echo "No early-warning signals; nothing to report."
            exit 0
          fi
          title="Advisory early warning: reviewed npm inventory signals"
          marker="<!-- nemoclaw-advisory-early-warning -->"
          body_file="$RUNNER_TEMP/issue-body.md"
          # One line per advisoryId+package signal. Column 1 is the dedupe key
          # ("<advisoryId> <package>") and is embedded verbatim in the line,
          # always followed by a space (the range column falls back to
          # "(no range)"), so existing bodies are checked with a fixed-string
          # grep for "<key> " — a prefix-sibling package (tar vs tar-stream)
          # can never falsely dedupe. Advisory free text is sanitized so it
          # cannot split lines or corrupt the TSV.
          jq -r '.[] |
            (.advisoryId + " " + (.package | gsub("[\\r\\n\\t]"; " "))) as $key |
            [$key,
             "- [ ] " + $key + " " +
             (if .vulnerableRange == "" then "(no range)"
              else (.vulnerableRange | gsub("[\\r\\n\\t]"; " ")) end) +
             " [" + .action + ", " + .confidence + ", matched " +
             (.matchedVersions | join(" ")) + "] (source: " + .source + ")"] |
            @tsv' "$signals" >"$RUNNER_TEMP/signal-lines.tsv"
          # Only trust a rolling issue this workflow created itself: it must be
          # authored by the Actions bot AND carry the embedded marker. A
          # lookalike security-labeled issue must not become the sink (it could
          # pre-seed dedupe keys to suppress real signals).
          existing="$(gh issue list --repo "$REPO" --label security --state open \
            --author "app/github-actions" \
            --search "\"$title\" in:title" \
            --json number,body |
            jq --arg marker "$marker" '[.[] | select(.body | contains($marker))][0] // empty')"
          if [ -z "$existing" ]; then
            {
              echo "$marker"
              echo ""
              echo "Automated, non-blocking early-warning signals: public GitHub Security"
              echo "Advisories that plausibly affect the reviewed npm inventory before or"
              echo "beyond what the reviewed npm audit gate currently enforces (#7338)."
              echo "Ambiguous matches are informational only and must not block a release."
              echo ""
              cut -f2 "$RUNNER_TEMP/signal-lines.tsv"
            } >"$body_file"
            gh issue create --repo "$REPO" --label security --title "$title" \
              --body-file "$body_file"
            echo "Created rolling early-warning issue"
            exit 0
          fi
          issue_number="$(jq -r '.number' <<<"$existing")"
          jq -r '.body' <<<"$existing" >"$body_file"
          appended=0
          while IFS=$'\t' read -r dedupe_key line; do
            [ -n "$dedupe_key" ] || continue
            if ! grep -qF "$dedupe_key " "$body_file"; then
              printf '%s\n' "$line" >>"$body_file"
              appended=1
            fi
          done <"$RUNNER_TEMP/signal-lines.tsv"
          if [ "$appended" -eq 1 ]; then
            gh issue edit "$issue_number" --repo "$REPO" --body-file "$body_file"
            echo "Updated rolling early-warning issue #$issue_number"
          else
            echo "Rolling early-warning issue #$issue_number already lists every signal."
          fi
