name: E2E / Regression Runner

# Regression E2E holding pen.
#
# Jobs here are intentionally NOT part of the scheduled E2E workflow. They are
# failing-test-first coverage guards or high-signal regressions that should be
# easy to dispatch while the owning fix is in flight. Periodically review this
# workflow and promote stable/high-value jobs into .github/workflows/e2e.yaml.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number (optional; creates a check run on that PR)"
        required: false
        type: string
        default: ""
      jobs:
        description: >-
          Comma-separated regression job names to run (empty = all).
          Valid: whatsapp-qr-compact-e2e
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: regression-e2e-${{ github.event_name }}-${{ github.ref }}-${{ inputs.jobs || 'all' }}-${{ inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  select_regression_jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      whatsapp_qr_compact: ${{ steps.select.outputs.whatsapp_qr_compact }}
    steps:
      - id: select
        env:
          JOBS: ${{ inputs.jobs }}
        run: |
          set -euo pipefail
          normalized="$(printf '%s' "$JOBS" | tr -d '[:space:]')"
          case ",${normalized}," in
            ,|*,whatsapp-qr-compact-e2e,*)
              echo "whatsapp_qr_compact=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "whatsapp_qr_compact=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  # ── WhatsApp compact-QR reporter-workflow E2E ──────────────────
  # Coverage guard for #4522. Drives the real @openclaw/whatsapp +
  # openclaw renderQrTerminal path (the symbol the in-sandbox
  # `openclaw channels login --channel whatsapp` onQr callback invokes)
  # at the version bundled in Dockerfile.base, and asserts the pairing QR
  # renders compact with the NemoClaw preload and oversized without it.
  # Hermetic: only needs node + npm (no Docker, GPU, or NVIDIA_INFERENCE_API_KEY).
  whatsapp-qr-compact-e2e:
    needs: select_regression_jobs
    if: >-
      github.repository == 'NVIDIA/NemoClaw' &&
      needs.select_regression_jobs.outputs.whatsapp_qr_compact == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Run WhatsApp compact-QR reporter-workflow Vitest test
        env:
          NEMOCLAW_RUN_LIVE_E2E: "1"
        run: |
          npx vitest run --project e2e-live \
            test/e2e/live/whatsapp-qr-compact.test.ts \
            --silent=false --reporter=default
