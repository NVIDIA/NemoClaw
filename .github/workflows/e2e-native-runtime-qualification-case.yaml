name: Native runtime qualification case collector

on:
  workflow_call:
    inputs:
      case_id:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      job_name:
        required: true
        type: string
      candidate_repository:
        required: true
        type: string
      candidate_sha:
        required: true
        type: string
      pull_request_number:
        required: true
        type: number
      base_sha:
        required: true
        type: string
      workflow_sha:
        required: true
        type: string
      producer_run_id:
        required: true
        type: string
      producer_run_attempt:
        required: true
        type: number
      dispatch_artifact_id:
        required: true
        type: string
      dispatch_artifact_name:
        required: true
        type: string
      dispatch_artifact_digest:
        required: true
        type: string
      dispatch_artifact_size:
        required: true
        type: number

permissions:
  actions: read
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the trusted qualification collector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            test/e2e/registry/native-runtime-qualification.ts
            tools/e2e/native-runtime-qualification-plan.mts
            tools/e2e/native-runtime-qualification-collector.mts
          sparse-checkout-cone-mode: false

      - name: Set up Node for qualification evidence validation
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - id: artifact
        name: Resolve the immutable case artifact
        env:
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ inputs.producer_run_attempt }}
          JOB_NAME: ${{ inputs.job_name }}
          WORKFLOW_SHA: ${{ inputs.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${PRODUCER_RUN_ID}/artifacts" \
            -f name="$ARTIFACT_NAME" \
            -f per_page=100)"
          artifact="$(jq -ce --arg name "$ARTIFACT_NAME" '
            select(.total_count == 1 and (.artifacts | length) == 1) |
            .artifacts[0] |
            select(.name == $name and .expired == false) |
            select(.size_in_bytes > 0 and .size_in_bytes <= 1048576) |
            select((.id | tostring | test("^[1-9][0-9]{0,19}$"))) |
            select((.digest // "") | test("^sha256:[a-f0-9]{64}$")) |
            select((.workflow_run.id | tostring) == env.PRODUCER_RUN_ID) |
            select(.workflow_run.head_sha == env.WORKFLOW_SHA)
          ' <<<"$response")" || {
            echo "::error::Qualification case artifact identity is missing or ambiguous" >&2
            exit 1
          }
          printf 'id=%s\n' "$(jq -r '.id | tostring' <<<"$artifact")" >>"$GITHUB_OUTPUT"
          printf 'digest=%s\n' "$(jq -r '.digest' <<<"$artifact")" >>"$GITHUB_OUTPUT"
          printf 'size=%s\n' "$(jq -r '.size_in_bytes' <<<"$artifact")" >>"$GITHUB_OUTPUT"
          jobs="$(gh api --method GET --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${PRODUCER_RUN_ID}/attempts/${PRODUCER_RUN_ATTEMPT}/jobs" \
            -f per_page=100)"
          protected_job="$(jq -ce --arg name "$JOB_NAME" --arg runId "$PRODUCER_RUN_ID" --argjson attempt "$PRODUCER_RUN_ATTEMPT" --arg workflowSha "$WORKFLOW_SHA" '
            select(length > 0 and length <= 10) |
            select(.[0].total_count == ([.[].jobs[]] | length)) |
            [.[].jobs[] | select(.name == $name)] |
            select(length == 1) | .[0] |
            select((.run_id | tostring) == $runId) |
            select(.run_attempt == $attempt and .head_sha == $workflowSha) |
            select(.status == "completed" and .conclusion == "success") |
            select((.id | tostring | test("^[1-9][0-9]{0,19}$")))
          ' <<<"$jobs")" || {
            echo "::error::Qualification producer job identity is missing or ambiguous" >&2
            exit 1
          }
          printf 'job_id=%s\n' "$(jq -r '.id | tostring' <<<"$protected_job")" >>"$GITHUB_OUTPUT"

      - name: Download the immutable case artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.artifact.outputs.id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/native-runtime-qualification-evidence
          repository: NVIDIA/NemoClaw
          run-id: ${{ inputs.producer_run_id }}

      - name: Validate the qualification case evidence
        env:
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.digest }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          ARTIFACT_SIZE: ${{ steps.artifact.outputs.size }}
          BASE_SHA: ${{ inputs.base_sha }}
          CANDIDATE_REPOSITORY: ${{ inputs.candidate_repository }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CASE_ID: ${{ inputs.case_id }}
          DISPATCH_ARTIFACT_DIGEST: ${{ inputs.dispatch_artifact_digest }}
          DISPATCH_ARTIFACT_ID: ${{ inputs.dispatch_artifact_id }}
          DISPATCH_ARTIFACT_NAME: ${{ inputs.dispatch_artifact_name }}
          DISPATCH_ARTIFACT_SIZE: ${{ inputs.dispatch_artifact_size }}
          EVIDENCE_PATH: ${{ runner.temp }}/native-runtime-qualification-evidence/evidence.json
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ inputs.producer_run_attempt }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          PROTECTED_JOB_ID: ${{ steps.artifact.outputs.job_id }}
          PROTECTED_JOB_NAME: ${{ inputs.job_name }}
          RECEIPT_PATH: ${{ runner.temp }}/native-runtime-qualification-receipt/receipt.json
          WORKFLOW_SHA: ${{ inputs.workflow_sha }}
        run: node --experimental-strip-types --no-warnings tools/e2e/native-runtime-qualification-collector.mts collect

      - name: Upload the validated case receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-runtime-qualification-receipt-${{ inputs.candidate_sha }}-${{ inputs.case_id }}
          path: ${{ runner.temp }}/native-runtime-qualification-receipt/receipt.json
          if-no-files-found: error
          retention-days: 30
