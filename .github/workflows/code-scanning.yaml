# Dedicated security reporting workflow for NemoClaw.
# CodeQL and ShellCheck publish findings to GitHub code scanning while the
# existing PR and main workflows remain the merge-gating CI path.
name: Security / Code Scanning

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  codeql:
    # Keep Python independent and preserve its original analysis identity.
    name: CodeQL (python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        language: [python]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4

  codeql-javascript-report:
    name: CodeQL JS combined report
    needs: [codeql-javascript]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require complete JavaScript query evidence
        env:
          PARTITION_RESULT: ${{ needs.codeql-javascript.result }}
        run: test "$PARTITION_RESULT" = success

      - name: Download first JavaScript query report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codeql-javascript-sarif-${{ github.run_id }}-a-m
          path: codeql-sarif/a-m
          digest-mismatch: error

      - name: Download complementary JavaScript query report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codeql-javascript-sarif-${{ github.run_id }}-other
          path: codeql-sarif/other
          digest-mismatch: error

      - name: Prepare complete JavaScript report identity
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          category = ".github/workflows/code-scanning.yaml:codeql/language:javascript-typescript/"
          reports = []
          for partition in ("a-m", "other"):
              source = Path("codeql-sarif") / partition / "javascript.sarif"
              report = json.loads(source.read_text())
              assert report["version"] == "2.1.0" and len(report["runs"]) == 1
              run = report["runs"][0]
              assert run["tool"]["driver"]["name"] == "CodeQL"
              assert run["automationDetails"]["id"] == f"/language:javascript-typescript/partition:{partition}/"
              run["automationDetails"]["id"] = category
              reports.append((source, report))
          # Validate both reports before changing either downloaded copy.
          for source, report in reports:
              source.write_text(json.dumps(report))
          PY

      - name: Publish complete JavaScript report in the former category
        # The pinned action supports an explicit key for non-standard publishers.
        env:
          CODEQL_ACTION_ANALYSIS_KEY: .github/workflows/code-scanning.yaml:codeql
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: codeql-sarif
          category: .github/workflows/code-scanning.yaml:codeql/language:javascript-typescript
          matrix: '{"language":"javascript-typescript"}'

  # The complete security-and-quality suite is partitioned by one predicate and
  # its complement. Both jobs still extract the complete source tree; neither
  # query coverage nor the existing 15-minute job deadline is reduced.
  codeql-javascript:
    name: CodeQL JS partition (${{ matrix.partition }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - partition: a-m
            config: >-
              {"query-filters":[{"include":{"id":"/^js\\/[a-m]/"}}]}
          - partition: other
            config: >-
              {"query-filters":[{"exclude":{"id":"/^js\\/[a-m]/"}}]}
    env:
      QUERY_SUITE: security-and-quality
      QUERY_LANGUAGE: javascript-typescript
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: ${{ env.QUERY_LANGUAGE }}
          queries: ${{ env.QUERY_SUITE }}
          config: ${{ matrix.config }}
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          # Retain each partition locally; publish only the complete report.
          upload: false
          category: /language:javascript-typescript/partition:${{ matrix.partition }}
        id: analyze
      - name: Retain JavaScript query report for complete publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # A failed-job rerun retains successful partitions from the prior attempt.
          name: codeql-javascript-sarif-${{ github.run_id }}-${{ matrix.partition }}
          overwrite: true
          path: ${{ steps.analyze.outputs.sarif-output }}/javascript.sarif
          if-no-files-found: error
          retention-days: 1

  codeql-javascript-complete:
    # Keep the existing check name. A partial suite can never satisfy it.
    name: CodeQL (javascript-typescript)
    needs: [codeql-javascript, codeql-javascript-report]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require every query partition to succeed
        env:
          PARTITION_RESULT: ${{ needs.codeql-javascript.result }}
          REPORT_RESULT: ${{ needs.codeql-javascript-report.result }}
        run: test "$PARTITION_RESULT" = success && test "$REPORT_RESULT" = success

  shellcheck:
    name: ShellCheck SARIF
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: source

      - name: Check out the trusted ShellCheck converter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.workflow_sha }}
          path: trusted-shellcheck-converter
          sparse-checkout: |
            scripts/shellcheck-json1-to-sarif.mts
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1

      - name: Install reviewed npm
        uses: NVIDIA/NemoClaw/.github/actions/setup-reviewed-npm@98669f24d35f18e49b6b2769cd68709509ea24f2

      - name: Install ShellCheck
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/shellcheck-json1-probe.sh"
          printf '#!/bin/sh\ntrue\n' > "$probe"
          if command -v shellcheck >/dev/null 2>&1 &&
            shellcheck --format=json1 "$probe" >/dev/null 2>&1; then
            echo "Using preinstalled ShellCheck"
            shellcheck --version
          else
            apt_options=(
              -o Acquire::Retries=3
              -o Acquire::http::Timeout=15
              -o Acquire::https::Timeout=15
            )
            if ! sudo apt-get "${apt_options[@]}" update; then
              echo "Failed to update apt package indexes for ShellCheck" >&2
              exit 1
            fi
            if ! sudo apt-get "${apt_options[@]}" install -y shellcheck; then
              echo "Failed to install ShellCheck" >&2
              exit 1
            fi
            if ! shellcheck --format=json1 "$probe" >/dev/null 2>&1; then
              echo "Installed ShellCheck does not support --format=json1" >&2
              exit 1
            fi
            echo "Using installed ShellCheck"
            shellcheck --version
          fi

      - name: Collect shell files
        id: shell-files
        working-directory: source
        run: |
          git ls-files -z -- '*.sh' 'install.sh' 'uninstall.sh' | sort -zu > "$GITHUB_WORKSPACE/shell-files.txt"
          if [ -s "$GITHUB_WORKSPACE/shell-files.txt" ]; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate ShellCheck SARIF
        if: steps.shell-files.outputs.has_files == 'true'
        working-directory: source
        run: |
          # Ubuntu's packaged ShellCheck may not support --format=sarif.
          # Generate json1 and convert it to SARIF for upload.
          mapfile -d '' -t shell_files < "$GITHUB_WORKSPACE/shell-files.txt"
          sc_exit=0
          if shellcheck --format=json1 -- "${shell_files[@]}" > "$GITHUB_WORKSPACE/shellcheck.json"; then
            sc_exit=0
          else
            sc_exit=$?
          fi

          echo "ShellCheck invocation exit status: $sc_exit"
          case "$sc_exit" in
            0) ;;
            1)
              echo "ShellCheck found issues; continuing because json1 output is available for SARIF conversion."
              ;;
            *)
              echo "ShellCheck failed to process the input files (exit=$sc_exit); refusing to convert or upload incomplete results."
              exit "$sc_exit"
              ;;
          esac

          conversion_exit=0
          if env -i PATH="$PATH" node \
            "$GITHUB_WORKSPACE/trusted-shellcheck-converter/scripts/shellcheck-json1-to-sarif.mts" \
            "$GITHUB_WORKSPACE/shellcheck.json" "$GITHUB_WORKSPACE/shellcheck.sarif"; then
            conversion_exit=0
          else
            conversion_exit=$?
          fi

          echo "SARIF conversion exit status: $conversion_exit"
          if [ "$conversion_exit" -ne 0 ]; then
            echo "ShellCheck SARIF conversion failed; refusing to upload invalid or stale output."
            exit "$conversion_exit"
          fi

      - name: Check SARIF has runs
        id: sarif-runs
        if: steps.shell-files.outputs.has_files == 'true'
        run: |
          run_count="$(jq '.runs | length' shellcheck.sarif)"
          if [ "$run_count" -gt 0 ]; then
            echo "has_runs=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_runs=false" >> "$GITHUB_OUTPUT"
            echo "Skipping SARIF upload because shellcheck.sarif has zero runs."
          fi

      - name: Upload ShellCheck SARIF
        if: steps.shell-files.outputs.has_files == 'true' && steps.sarif-runs.outputs.has_runs == 'true'
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: shellcheck.sarif
          checkout_path: source
