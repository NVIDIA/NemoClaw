name: Governance / Require PR DCO Declaration

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' &&
  format('Generated-head DCO {0} {1}', inputs.repair_attempt_key, inputs.source_head_sha) ||
  format('DCO PR {0}', github.event.pull_request.number) }}

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      source_head_sha:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      repair_attempt_key:
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check Dependabot DCO bypass
        if: github.event_name == 'pull_request'
        id: dco-bypass
        env:
          USERNAME: ${{ github.event.pull_request.user.login }}
        run: |
          # GitHub exposes the same trusted app as dependabot[bot] in event
          # payloads and app/dependabot through some GraphQL PR surfaces.
          if [[ "$USERNAME" == "dependabot[bot]" || "$USERNAME" == "app/dependabot" ]]; then
            echo "bypass=true" >> "$GITHUB_OUTPUT"
            echo "Dependabot is exempt from the PR-body DCO declaration."
          else
            echo "bypass=false" >> "$GITHUB_OUTPUT"
            echo "The PR-body DCO declaration is required."
          fi

      - name: Check PR body for Signed-off-by
        if: ${{ github.event_name == 'pull_request' && steps.dco-bypass.outputs.bypass != 'true' }}
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          normalized_body="$(printf '%s\n' "$PR_BODY" | tr -d '\r')"

          if ! printf '%s\n' "$normalized_body" | grep -qP '^Signed-off-by:\s+.+\s+<[^<>]+>$'; then
            echo "::error::PR description must contain a DCO sign-off line."
            echo "::error::Expected format: Signed-off-by: Your Name <your-email@example.com>"
            exit 1
          fi

          echo "PR description contains a DCO sign-off."

      - name: Checkout generated-head verifier
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify generated-head dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          GENERATED_HEAD_COMMAND: verify
          GENERATED_HEAD_CONTEXT_FILE: ${{ runner.temp }}/generated-head-context.json
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REPAIR_ATTEMPT_KEY: ${{ inputs.repair_attempt_key }}
          SOURCE_HEAD_SHA: ${{ inputs.source_head_sha }}
        run: node --experimental-strip-types --no-warnings tools/pr-review-advisor-repair/generated-head-context.mts

      - name: Check generated-head PR body for Signed-off-by
        if: github.event_name == 'workflow_dispatch'
        env:
          GENERATED_HEAD_COMMAND: check-dco
          GENERATED_HEAD_CONTEXT_FILE: ${{ runner.temp }}/generated-head-context.json
        run: node --experimental-strip-types --no-warnings tools/pr-review-advisor-repair/generated-head-context.mts
