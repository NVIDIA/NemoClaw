name: Governance / Require PR DCO Declaration

run-name: >-
  ${{ inputs.repair_attempt_key != '' &&
  format('Repair validation {0} head {1}', inputs.repair_attempt_key, inputs.repair_head_sha) ||
  github.event.pull_request.title }}

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:
    inputs:
      repair_pr_number:
        required: false
        type: string
        default: ""
      repair_head_sha:
        required: false
        type: string
        default: ""
      repair_base_sha:
        required: false
        type: string
        default: ""
      repair_attempt_key:
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.repair_attempt_key || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  validate-repair-target:
    uses: ./.github/workflows/validate-repair-target.yaml
    with:
      repair_pr_number: ${{ inputs.repair_pr_number }}
      repair_head_sha: ${{ inputs.repair_head_sha }}
      repair_base_sha: ${{ inputs.repair_base_sha }}
      repair_attempt_key: ${{ inputs.repair_attempt_key }}
    permissions:
      contents: read
      pull-requests: read

  dco-check:
    needs: validate-repair-target
    if: ${{ always() && (github.event_name == 'pull_request' || needs.validate-repair-target.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Read generated repair pull request
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.repair_pr_number }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/repair-pr.json"

      - name: Check Dependabot DCO bypass
        id: dco-bypass
        env:
          USERNAME: ${{ github.event.pull_request.user.login || '' }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            USERNAME="$(jq -r .user.login "$RUNNER_TEMP/repair-pr.json")"
          fi
          # GitHub exposes the same trusted app as dependabot[bot] in event
          # payloads and app/dependabot through some GraphQL PR surfaces.
          if [[ "$USERNAME" == "dependabot[bot]" || "$USERNAME" == "app/dependabot" ]]; then
            echo "bypass=true" >> "$GITHUB_OUTPUT"
            echo "Dependabot is exempt from the PR-body DCO declaration."
          else
            echo "bypass=false" >> "$GITHUB_OUTPUT"
            echo "The PR-body DCO declaration is required."
          fi

      - name: Check PR body for Signed-off-by
        if: ${{ steps.dco-bypass.outputs.bypass != 'true' }}
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            PR_BODY="$(jq -r '.body // ""' "$RUNNER_TEMP/repair-pr.json")"
          fi
          normalized_body="$(printf '%s\n' "$PR_BODY" | tr -d '\r')"

          if ! printf '%s\n' "$normalized_body" | grep -qP '^Signed-off-by:\s+.+\s+<[^<>]+>$'; then
            echo "::error::PR description must contain a DCO sign-off line."
            echo "::error::Expected format: Signed-off-by: Your Name <your-email@example.com>"
            exit 1
          fi

          echo "PR description contains a DCO sign-off."

  repair-receipt:
    name: ${{ format('Repair receipt {0} PR {1} head {2} base {3}', inputs.repair_attempt_key, inputs.repair_pr_number, inputs.repair_head_sha, inputs.repair_base_sha) }}
    needs: dco-check
    if: ${{ inputs.repair_attempt_key != '' && needs.dco-check.result == 'success' }}
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Record exact validation receipt
        run: echo 'Trusted validation completed for the exact repair inputs.'
