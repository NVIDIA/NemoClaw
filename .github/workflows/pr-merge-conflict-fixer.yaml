name: PR Conflicts / Resolve

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  scan:
    name: Scan conflicting PRs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      count: ${{ steps.scan.outputs.count }}
      matrix: ${{ steps.scan.outputs.matrix }}
    steps:
      - name: Checkout trusted workflow code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - id: scan
        name: Reproduce PR merges
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types --no-warnings tools/pr-merge-conflict-fixer/discover.mts

  resolve:
    name: Resolve PR #${{ matrix.item.pr_number }}
    needs: scan
    if: ${{ needs.scan.outputs.count != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scan.outputs.matrix) }}
    env:
      ARTIFACT_DIR: ${{ github.workspace }}/resolution-artifact
      OPENSHELL_GATEWAY_ENDPOINT: http://127.0.0.1:8080
      PI_IMAGE: ghcr.io/nvidia/openshell-community/sandboxes/pi@sha256:00d0c5e9e733f94f6db3eaa2ab70d4fd75bcc4aace6b13a54535cbf2dd20dfcd
      RESOLUTION_WORKDIR: ${{ github.workspace }}/repo
      RESOLVER_CONFIG_DIR: ${{ github.workspace }}/pi-config
      SANDBOX_NAME: pr-conflict-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.item.pr_number }}
      TRUSTED_CHECKOUT: ${{ github.workspace }}/trusted
    steps:
      - name: Checkout trusted workflow code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          path: trusted
          persist-credentials: false
          ref: ${{ matrix.item.base_sha }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - id: prepare
        name: Reproduce the recorded conflict
        env:
          MATRIX_ENTRY: ${{ toJSON(matrix.item) }}
        run: node --experimental-strip-types --no-warnings "$TRUSTED_CHECKOUT/tools/pr-merge-conflict-fixer/resolve.mts"

      - name: Install OpenShell
        run: |
          env -u GITHUB_TOKEN -u GH_TOKEN -u PR_REVIEW_ADVISOR_API_KEY \
            NEMOCLAW_NON_INTERACTIVE=1 \
            bash "$TRUSTED_CHECKOUT/scripts/install-openshell.sh"

      - name: Configure OpenShell inference
        env:
          OPENAI_API_KEY: ${{ secrets.PR_REVIEW_ADVISOR_API_KEY }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          GATEWAY_DIR="$RUNNER_TEMP/openshell-gateway"
          mkdir -p "$GATEWAY_DIR"
          openshell-gateway generate-certs --output-dir "$GATEWAY_DIR"
          cat >"$GATEWAY_DIR/gateway.toml" <<EOF
          [openshell]
          version = 1

          [openshell.gateway]
          bind_address = "127.0.0.1:8080"
          compute_drivers = ["docker"]
          disable_tls = true

          [openshell.gateway.auth]
          allow_unauthenticated_users = true

          [openshell.gateway.gateway_jwt]
          signing_key_path = "$GATEWAY_DIR/jwt/signing.pem"
          public_key_path = "$GATEWAY_DIR/jwt/public.pem"
          kid_path = "$GATEWAY_DIR/jwt/kid"
          gateway_id = "pr-conflict-fixer"
          ttl_secs = 3600

          [openshell.drivers.docker]
          grpc_endpoint = "http://host.openshell.internal:8080"
          supervisor_bin = "$(command -v openshell-sandbox)"
          EOF
          openshell-gateway --config "$GATEWAY_DIR/gateway.toml" \
            >"$GATEWAY_DIR/gateway.log" 2>&1 &
          for _ in {1..30}; do
            openshell gateway info >/dev/null 2>&1 && break
            sleep 1
          done
          openshell gateway info
          openshell provider create \
            --name terra \
            --type openai \
            --credential OPENAI_API_KEY \
            --config OPENAI_BASE_URL=https://inference-api.nvidia.com/v1
          openshell inference set \
            --provider terra \
            --model azure/openai/gpt-5.6-terra \
            --timeout 900

      - name: Create the credential-free sandbox
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          openshell sandbox create \
            --name "$SANDBOX_NAME" \
            --from "$PI_IMAGE" \
            --policy "$TRUSTED_CHECKOUT/tools/pr-merge-conflict-fixer/policy.yaml" \
            --upload "$RESOLUTION_WORKDIR:/sandbox" \
            --upload "$RESOLVER_CONFIG_DIR:/sandbox" \
            --no-git-ignore \
            --no-tty \
            -- /usr/bin/git -C /sandbox/repo status --short

      - name: Run one Pi conflict-resolution task
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          openshell sandbox exec \
            --name "$SANDBOX_NAME" \
            --timeout 1200 \
            --workdir /sandbox/repo \
            --env HOME=/sandbox \
            --env PI_CODING_AGENT_DIR=/sandbox/pi-config \
            --env PI_OFFLINE=1 \
            --env TMPDIR=/sandbox \
            -- \
            /usr/bin/node \
              /usr/lib/node_modules/@earendil-works/pi-coding-agent/dist/cli.js \
              --provider openshell \
              --model azure/openai/gpt-5.6-terra \
              --thinking medium \
              --tools read,bash,edit,write,grep,find,ls \
              --no-context-files \
              --no-extensions \
              --no-prompt-templates \
              --no-session \
              --no-skills \
              --no-themes \
              --offline \
              --print @/sandbox/pi-config/task.txt

      - name: Export the Git patch
        env:
          CONFLICT_TREE: ${{ steps.prepare.outputs.conflict_tree }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          openshell sandbox exec \
            --name "$SANDBOX_NAME" \
            --workdir /sandbox/repo \
            --env CONFLICT_TREE="$CONFLICT_TREE" \
            -- \
            /usr/bin/bash -c '
              set -euo pipefail
              if test -n "$(git ls-files -u)"; then
                echo "Pi did not stage every resolved conflict." >&2
                exit 1
              fi
              final_tree="$(git write-tree)"
              git diff --binary "$CONFLICT_TREE" "$final_tree" > /sandbox/resolution.patch
            '
          mkdir -p "$ARTIFACT_DIR"
          openshell sandbox download \
            "$SANDBOX_NAME" \
            /sandbox/resolution.patch \
            "$ARTIFACT_DIR/"

      - name: Delete the sandbox
        if: always()
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          if command -v openshell >/dev/null 2>&1 \
            && openshell sandbox list --names | grep -Fxq -- "$SANDBOX_NAME"; then
            openshell sandbox delete "$SANDBOX_NAME"
          fi

      - name: Upload the resolution patch
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-conflict-resolution-${{ matrix.item.pr_number }}-${{ matrix.item.head_sha }}-${{ matrix.item.base_sha }}
          path: ${{ env.ARTIFACT_DIR }}/resolution.patch

  publish:
    name: Publish PR #${{ matrix.item.pr_number }}
    needs:
      - scan
      - resolve
    if: ${{ always() && needs.scan.outputs.count != '0' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scan.outputs.matrix) }}
    env:
      ARTIFACT_DIR: ${{ github.workspace }}/resolution-artifact
      TRUSTED_CHECKOUT: ${{ github.workspace }}/trusted
    steps:
      - name: Checkout trusted publisher code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          path: trusted
          persist-credentials: false
          ref: ${{ matrix.item.base_sha }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - id: download
        name: Download the resolution patch
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-conflict-resolution-${{ matrix.item.pr_number }}-${{ matrix.item.head_sha }}-${{ matrix.item.base_sha }}
          path: ${{ env.ARTIFACT_DIR }}

      - name: Validate and publish the merge commit
        if: ${{ steps.download.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MATRIX_ENTRY: ${{ toJSON(matrix.item) }}
        run: node --experimental-strip-types --no-warnings "$TRUSTED_CHECKOUT/tools/pr-merge-conflict-fixer/publish.mts"
