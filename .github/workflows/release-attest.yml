# Attest each image index's build provenance with a GitHub artifact attestation,
# and store it beside the image as an OCI referrer, so the index digest stays
# the one staging pushed. Release / Stage calls this for a final release.
name: Release / Attest
on:
  workflow_call:
    inputs:
      images:
        description: 'JSON array of {name, repository, digest}, one entry per image index.'
        required: true
        type: string
permissions: {}
jobs:
  attest:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.images) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      # The attest action and gh read the registry credentials Docker stores.
      - name: Sign in to the registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s\n' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      # push-to-registry takes a single subject, hence one job per index.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ matrix.repository }}
          subject-digest: ${{ matrix.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Verify the attestation stored in the registry
        env:
          GH_TOKEN: ${{ github.token }}
          REFERENCE: ${{ matrix.repository }}@${{ matrix.digest }}
        run: gh attestation verify "oci://$REFERENCE" --owner "$GITHUB_REPOSITORY_OWNER" --bundle-from-oci
      - name: Sign out of the registry
        if: always()
        run: docker logout ghcr.io
