name: Live / Brev

on:
  workflow_dispatch:
  # Dispatch requires this file on the default branch; branch pushes remain opt-in.
  push:
    branches: [run-brev-v1-e2e/**]

permissions:
  contents: read

concurrency:
  group: live-brev-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: Build
    if: >-
      github.repository == 'NVIDIA/NemoClaw' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/v1') ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/run-brev-v1-e2e/')))
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      artifact: ${{ steps.identity.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: identity
        name: Identify candidate artifact
        run: echo "artifact=brev-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-rust
        with:
          platform: linux_amd64
          cache-prefix: brev-deps-v1
      - name: Build bundle
        run: cargo run --locked -p nemoclaw-build -- bundle --platform linux_amd64
      - name: Build live test executable
        run: |
          set -euo pipefail
          cargo test --locked -p nemoclaw-e2e --test e2e --no-run --message-format=json \
            | tee "${RUNNER_TEMP}/brev-build.json" >/dev/null
          binary="$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "e2e" and .profile.test == true) | .executable' "${RUNNER_TEMP}/brev-build.json" | tail -1)"
          test -x "${binary}"
          mkdir candidate
          cp "${binary}" candidate/e2e
          cp -a dist/linux_amd64 candidate/bundle
          # Tar retains executable bits; no credential is present in this job.
          tar -cf "${RUNNER_TEMP}/brev-candidate.tar" candidate
      - name: Upload candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.identity.outputs.artifact }}
          path: ${{ runner.temp }}/brev-candidate.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  image:
    name: Build image
    if: >-
      github.repository == 'NVIDIA/NemoClaw' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/v1') ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/run-brev-v1-e2e/')))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact: ${{ steps.identity.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: identity
        name: Identify candidate image
        run: echo "artifact=brev-image-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      # The image builds' pinned sources, as CI / Images saved them.
      - name: Restore the verified image sources
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/downloads
          key: image-sources-v1-${{ hashFiles('versions.json') }}
      - name: Build candidate OCI archive
        env:
          AGENT_PLATFORM: linux/amd64
        run: |
          # Bake reads the pinned image sources from .build/image-sources.
          cargo images fetch
          mkdir candidate-image
          docker buildx create --name brev --driver docker-container \
            --driver-opt image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
          docker buildx bake --builder brev openclaw \
            --set 'openclaw.output=type=oci,dest=candidate-image/image.tar' \
            --metadata-file candidate-image/metadata.json
          python3 tools/ci/brev_image.py record candidate-image "$GITHUB_SHA"
      - name: Upload candidate image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.identity.outputs.artifact }}
          path: |
            candidate-image/image.tar
            candidate-image/candidate.json
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  prepare:
    name: Prepare VM
    if: >-
      github.repository == 'NVIDIA/NemoClaw' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/v1') ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/run-brev-v1-e2e/')))
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    outputs:
      instance: ${{ steps.identity.outputs.instance }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-brev
        with:
          api-key: ${{ secrets.BREV_API_KEY }}
      # Publish ownership before create, including when create partially fails.
      - id: identity
        name: Identify owned VM
        run: echo "instance=nclaw-v1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Provision VM and check fresh host
        env:
          INSTANCE_NAME: ${{ steps.identity.outputs.instance }}
        run: bash tools/e2e/brev-v1-host.sh prepare

  load-image:
    name: Load image
    needs: [image, prepare]
    # Runs only when the jobs it needs ran, as on v1 dispatch or a run-brev branch.
    if: needs.image.result == 'success' && needs.prepare.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-brev
        with:
          api-key: ${{ secrets.BREV_API_KEY }}
      - name: Download candidate image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.image.outputs.artifact }}
          path: candidate-image
      - name: Transfer and verify candidate image
        env:
          INSTANCE_NAME: ${{ needs.prepare.outputs.instance }}
        run: bash tools/e2e/brev-v1-host.sh load-image

  qualify:
    name: Lifecycle
    needs: [build, prepare, load-image]
    # Runs only when the jobs it needs ran, as on v1 dispatch or a run-brev branch.
    if: needs.build.result == 'success' && needs.prepare.result == 'success' && needs.load-image.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-brev
        with:
          api-key: ${{ secrets.BREV_API_KEY }}
      - name: Download candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/brev-candidate
      - name: Extract candidate
        run: tar -xf "${RUNNER_TEMP}/brev-candidate/brev-candidate.tar"
      - name: Transfer bundle and run lifecycle
        env:
          INSTANCE_NAME: ${{ needs.prepare.outputs.instance }}
          NVIDIA_INFERENCE_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: bash tools/e2e/brev-v1-host.sh qualify
      # The HCL scenario's outcome reports, the destroy receipt, and fresh-host checks.
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: brev-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/brev-evidence/*.json
          if-no-files-found: warn
          retention-days: 14

  cleanup:
    name: Delete VM
    needs: [build, image, prepare, load-image, qualify]
    if: always() && needs.prepare.outputs.instance != ''
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-brev
        with:
          api-key: ${{ secrets.BREV_API_KEY }}
      - name: Delete owned VM and verify absence
        env:
          INSTANCE_NAME: ${{ needs.prepare.outputs.instance }}
        run: bash tools/e2e/brev-v1-host.sh cleanup
