# Live / Brev's lifecycle on the VM that Live / Brev host prepared, from CI /
# Bundle's Linux AMD64 bundle and e2e test executable, then the VM's verified
# deletion, which runs whenever the host workflow named a VM.
name: Live / Brev

on:
  workflow_call:
    inputs:
      instance:
        description: The VM that Live / Brev host named.
        type: string
        required: true
      ready:
        description: Whether the VM, its image, the bundle, and the test executable are ready.
        type: boolean
        required: true
      tests:
        description: Name prefix of CI / Bundle's Linux AMD64 test artifacts; the lifecycle downloads PREFIX-e2e.
        type: string
        default: ""
      bundle:
        description: CI / Bundle's Linux AMD64 bundle artifact.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  qualify:
    name: Lifecycle
    if: inputs.ready
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-brev
        with:
          api-key: ${{ secrets.BREV_API_KEY }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.tests }}-e2e
          path: .build/ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.bundle }}
          path: .build/ci
      - name: Assemble candidate
        run: |
          tar -xf .build/ci/bundle.tar
          mkdir candidate
          cp -a dist/linux_amd64 candidate/bundle
          # Artifact transfer drops the executable bit.
          install -m 755 .build/ci/e2e candidate/e2e
      - name: Transfer bundle and run lifecycle
        env:
          INSTANCE_NAME: ${{ inputs.instance }}
          NVIDIA_INFERENCE_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: bash tools/e2e/brev-v1-host.sh qualify
      # The HCL scenario's outcome reports, the destroy receipt, and fresh-host checks.
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: brev-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/brev-evidence/*.json
          if-no-files-found: warn
          retention-days: 14

  cleanup:
    name: Delete VM
    needs: qualify
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-brev
        with:
          api-key: ${{ secrets.BREV_API_KEY }}
      - name: Delete owned VM and verify absence
        env:
          INSTANCE_NAME: ${{ inputs.instance }}
        run: bash tools/e2e/brev-v1-host.sh cleanup
