name: Bare Brev desired-state E2E

on:
  workflow_dispatch:
  # workflow_dispatch is unavailable until this file reaches the default branch.
  # An explicitly named temporary branch keeps v1 qualification opt-in meanwhile.
  push:
    branches:
      - run-brev-v1-e2e/**

permissions:
  contents: read

concurrency:
  group: bare-brev-v1-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  bare-brev:
    if: >-
      github.repository == 'NVIDIA/NemoClaw' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/v1') ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/run-brev-v1-e2e/')))
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      INSTANCE_NAME: nclaw-v1-${{ github.run_id }}-${{ github.run_attempt }}
      BREV_CLI_VERSION: 0.6.335
      BREV_CLI_SHA256: 89d778e6f1e5e52495f3e0f10393f1666a1b16d180001b13faec6f906955e6f8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned build tools
        env:
          TEST_PLATFORM: linux_amd64
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, urllib.request, zipfile
          root = pathlib.Path.cwd()
          pin = json.loads((root / "versions.json").read_text())["platforms"][os.environ["TEST_PLATFORM"]]["protoc"]
          data = urllib.request.urlopen(pin["url"], timeout=120).read()
          assert hashlib.sha256(data).hexdigest() == pin["sha256"]
          destination = root / ".tools/protoc"
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              archive.extractall(destination)
          binary = destination / "bin/protoc"
          binary.chmod(0o755)
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"PROTOC={binary}\n")
          PY

      - name: Build the candidate bundle and Brev test
        run: |
          set -euo pipefail
          cargo run --locked -p nemoclaw-build -- bundle --platform linux_amd64
          cargo test --locked -p nemoclaw-e2e --test brev --no-run --message-format=json \
            | tee "${RUNNER_TEMP}/brev-build.json" >/dev/null
          jq -r 'select(.reason == "compiler-artifact" and .target.name == "brev" and .profile.test == true) | .executable' \
            "${RUNNER_TEMP}/brev-build.json" | tail -1 > "${RUNNER_TEMP}/brev-test-path"
          test -x "$(cat "${RUNNER_TEMP}/brev-test-path")"
          git archive --format=tar HEAD | gzip -9 > "${RUNNER_TEMP}/candidate-source.tar.gz"

      - name: Install and authenticate the pinned Brev CLI
        env:
          BREV_API_KEY: ${{ secrets.BREV_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${BREV_API_KEY}"
          archive="${RUNNER_TEMP}/brev-cli.tar.gz"
          curl -fsSL -o "${archive}" "https://github.com/brevdev/brev-cli/releases/download/v${BREV_CLI_VERSION}/brev-cli_${BREV_CLI_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "${BREV_CLI_SHA256}" "${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" brev
          sudo install -m 0755 "${RUNNER_TEMP}/brev" /usr/local/bin/brev
          brev login --api-key "${BREV_API_KEY}"

      - name: Provision, install, qualify, and dispose
        env:
          NVIDIA_INFERENCE_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -euo pipefail
          created=false
          cleanup() {
            status=$?
            trap - EXIT INT TERM
            if ${created}; then
              brev delete "${INSTANCE_NAME}" || true
              absent=0
              for _ in $(seq 1 40); do
                rows="$(brev ls --json 2>/dev/null | jq -c 'if type == "array" then . elif type == "object" and (.workspaces | type) == "array" then .workspaces elif type == "object" and .workspaces == null then [] else error("unexpected Brev inventory") end' 2>/dev/null || true)"
                if test -n "${rows}" && ! jq -e --arg name "${INSTANCE_NAME}" 'any(.[]; ((.name // .workspaceName // .instanceName // "") | tostring) == $name)' <<<"${rows}" >/dev/null; then
                  absent=$((absent + 1))
                  if test "${absent}" -ge 2; then break; fi
                else
                  absent=0
                fi
                brev refresh >/dev/null 2>&1 || true
                sleep 15
              done
              if test "${absent}" -lt 2; then
                echo "Brev workspace deletion was not verified" >&2
                status=1
              fi
            fi
            exit "${status}"
          }
          trap cleanup EXIT INT TERM
          test -n "${NVIDIA_INFERENCE_API_KEY}"
          created=true
          brev search cpu --arch x86_64 --min-vcpu 8 --min-ram 32 --min-disk 100 --sort price \
            | brev create "${INSTANCE_NAME}" \
                --startup-script @tools/e2e/brev-v1-startup.sh --detached
          brev refresh || true
          for attempt in $(seq 1 90); do
            if ssh -o BatchMode=yes -o ConnectTimeout=10 "${INSTANCE_NAME}" true 2>/dev/null; then break; fi
            if test "${attempt}" -eq 90; then echo "Brev SSH did not become ready" >&2; exit 1; fi
            if test $((attempt % 5)) -eq 0; then brev refresh || true; fi
            sleep 10
          done
          for attempt in $(seq 1 120); do
            if ssh "${INSTANCE_NAME}" 'test -f /var/run/nemoclaw-brev-v1-ready'; then break; fi
            if test $((attempt % 10)) -eq 0; then
              ssh "${INSTANCE_NAME}" 'tail -20 /tmp/nemoclaw-brev-v1-startup.log 2>/dev/null || true' || true
            fi
            if test "${attempt}" -eq 120; then echo "Brev startup did not become ready" >&2; exit 1; fi
            sleep 10
          done
          # shellcheck disable=SC2029
          remote_home="$(ssh "${INSTANCE_NAME}" 'printf %s "$HOME"')"
          remote_root="${remote_home}/nemoclaw-brev-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # shellcheck disable=SC2029
          ssh "${INSTANCE_NAME}" "install -d -m 700 '${remote_root}/source' '${remote_root}/bundle'"
          rsync -a "${RUNNER_TEMP}/candidate-source.tar.gz" "${INSTANCE_NAME}:${remote_root}/"
          rsync -a dist/linux_amd64/ "${INSTANCE_NAME}:${remote_root}/bundle/"
          rsync -a "$(cat "${RUNNER_TEMP}/brev-test-path")" "${INSTANCE_NAME}:${remote_root}/brev-test"
          printf '%s' "${NVIDIA_INFERENCE_API_KEY}" > "${RUNNER_TEMP}/nvidia-api-key"
          chmod 600 "${RUNNER_TEMP}/nvidia-api-key"
          rsync -a "${RUNNER_TEMP}/nvidia-api-key" "${INSTANCE_NAME}:${remote_root}/nvidia-api-key"
          # shellcheck disable=SC2029
          ssh "${INSTANCE_NAME}" "tar -xzf '${remote_root}/candidate-source.tar.gz' -C '${remote_root}/source' && chmod 700 '${remote_root}/brev-test' && NEMOCLAW_BREV_ROOT='${remote_root}' bash '${remote_root}/source/tools/e2e/brev-v1-guest.sh'"
          mkdir -p "${RUNNER_TEMP}/brev-evidence"
          rsync -a "${INSTANCE_NAME}:${remote_root}/evidence/brev-proof.json" "${RUNNER_TEMP}/brev-evidence/"

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bare-brev-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/brev-evidence/brev-proof.json
          if-no-files-found: warn
          retention-days: 14
