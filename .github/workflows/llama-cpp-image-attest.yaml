name: Security / Attest llama.cpp Server Image

on:
  workflow_call:
    inputs:
      candidate_tag:
        description: Run-unique candidate tag
        required: true
        type: string
      digest:
        description: Exact candidate index digest
        required: true
        type: string
      image:
        description: Owned llama.cpp server image repository
        required: true
        type: string
      retention_days:
        description: Evidence artifact retention in days
        required: true
        type: number
      sbom_format:
        description: SBOM document format
        required: true
        type: string

permissions: {}

jobs:
  validate-inputs:
    name: Validate attestation inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      pull-requests: read
    outputs:
      trusted_revision: ${{ steps.identity.outputs.revision }}
      candidate_tag: ${{ steps.validate.outputs.candidate_tag }}
      digest: ${{ steps.validate.outputs.digest }}
      image: ${{ steps.validate.outputs.image }}
      retention_days: ${{ steps.validate.outputs.retention_days }}
      sbom_format: ${{ steps.validate.outputs.sbom_format }}
    steps:
      - name: Resolve the signer's own source
        id: identity
        env:
          WORKFLOW_JOB: ${{ toJSON(job) }}
        shell: bash
        run: |
          set -euo pipefail
          revision="$(jq -er '
            select(.workflow_repository == "NVIDIA/NemoClaw" and
              .workflow_file_path == ".github/workflows/llama-cpp-image-attest.yaml")
            | .workflow_sha | select(type == "string" and test("^[0-9a-f]{40}$"))
          ' <<< "$WORKFLOW_JOB")"
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
      - name: Check out the signer's own source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NVIDIA/NemoClaw
          ref: ${{ steps.identity.outputs.revision }}
          persist-credentials: false
      - name: Validate exact inputs
        id: validate
        shell: bash
        env:
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          ROOT_WORKFLOW_SHA: ${{ github.workflow_sha }}
          TRUSTED_REVISION: ${{ steps.identity.outputs.revision }}
          GH_TOKEN: ${{ github.token }}
          INPUT_CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          INPUT_DIGEST: ${{ inputs.digest }}
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_RETENTION_DAYS: ${{ inputs.retention_days }}
          INPUT_SBOM_FORMAT: ${{ inputs.sbom_format }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REPOSITORY" != "NVIDIA/NemoClaw" ] \
            || [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "ERROR: attestation caller does not match the trusted publication workflow." >&2
            exit 1
          fi
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            test "$CALLER_WORKFLOW_REF" = "NVIDIA/NemoClaw/.github/workflows/llama-cpp-image.yaml@$GITHUB_REF"
          else
            if [ "$GITHUB_REF" != "refs/heads/fix/issue-12285-wsl-transport" ] \
              || [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] \
              || [[ ! "$TRUSTED_REVISION" =~ ^[0-9a-f]{40}$ ]] \
              || [ "$ROOT_WORKFLOW_SHA" != "$GITHUB_SHA" ] \
              || [ "$CALLER_WORKFLOW_REF" != "NVIDIA/NemoClaw/.github/workflows/llama-cpp-image.yaml@$GITHUB_REF" ]; then
              echo "ERROR: attestation ref is not approved." >&2
              exit 1
            fi
            wrapper_sha="$( { cat .github/workflows/llama-cpp-image.yaml; sed "s/PUBLISHER_REVISION/$TRUSTED_REVISION/g" ci/llama-cpp-branch-publication.yaml; } | git hash-object --stdin)"
            gh api "repos/NVIDIA/NemoClaw/contents/.github/workflows/llama-cpp-image.yaml?ref=$GITHUB_SHA" \
              | jq -e --arg expected "$wrapper_sha" '.type == "file" and .sha == $expected' >/dev/null
            gh api repos/NVIDIA/NemoClaw/pulls/12664 | jq -e --arg sha "$GITHUB_SHA" '
              .state == "open" and .head.sha == $sha
              and .head.ref == "fix/issue-12285-wsl-transport"
              and .head.repo.full_name == "NVIDIA/NemoClaw"
              and .base.ref == "main" and .base.repo.full_name == "NVIDIA/NemoClaw"
            ' >/dev/null
            # Revalidate admission inside the signer, independently of its caller.
            if [ "$(gh api "repos/NVIDIA/NemoClaw/commits/$GITHUB_SHA" --jq '.commit.verification.verified')" != "true" ]; then
              echo "ERROR: branch publication requires a verified signed commit." >&2
              exit 1
            fi
            # PR description edits add a skipped changes check. Every required
            # check still needs an actual success on this exact commit.
            gh api --paginate --slurp "repos/NVIDIA/NemoClaw/commits/$GITHUB_SHA/check-runs?per_page=100&filter=latest" \
              | jq -e --arg sha "$GITHUB_SHA" '
                [.[] | .check_runs[] | select(.app.id == 15368 and .head_sha == $sha)] as $runs
                | ["checks", "commit-lint", "dco-check", "check-hash", "changes",
                   "Build native llama.cpp server (amd64)", "Build native llama.cpp server (arm64)"]
                | all(.[]; . as $name
                    | [$runs[] | select(.name == $name)]
                    | any(.[]; .conclusion == "success")
                      and all(.[]; .status == "completed" and
                        (.conclusion == "success" or ($name == "changes" and .conclusion == "skipped"))))
              ' >/dev/null
            # GitHub requires both forms when a name has check runs and commit
            # statuses. In particular, admission also owns check-hash status.
            gh api --paginate --slurp "repos/NVIDIA/NemoClaw/commits/$GITHUB_SHA/statuses?per_page=100" \
              | jq -e '
                add | group_by(.context) | map(max_by(.id))
                | all(.[] | select(.context == "checks" or .context == "commit-lint" or
                    .context == "dco-check" or .context == "check-hash" or .context == "changes");
                    .state == "success" and .creator.id == 41898282 and .creator.type == "Bot")
              ' >/dev/null
          fi
          expected_candidate_tag="llama-cpp-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [ "$INPUT_CANDIDATE_TAG" != "$expected_candidate_tag" ]; then
            echo "ERROR: candidate tag does not match llama-cpp-candidate-RUN_ID-RUN_ATTEMPT." >&2
            exit 1
          fi
          if [[ ! "$INPUT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ERROR: candidate digest is invalid." >&2
            exit 1
          fi
          if [ "$INPUT_IMAGE" != "ghcr.io/nvidia/nemoclaw/llama-cpp-server" ]; then
            echo "ERROR: image repository is not the owned llama.cpp server repository." >&2
            exit 1
          fi
          if [ "$INPUT_SBOM_FORMAT" != "spdx-json" ]; then
            echo "ERROR: SBOM format must be spdx-json." >&2
            exit 1
          fi
          if [[ ! "$INPUT_RETENTION_DAYS" =~ ^[1-9][0-9]*$ ]] \
            || [ "$INPUT_RETENTION_DAYS" -gt 90 ]; then
            echo "ERROR: evidence retention must be between 1 and 90 days." >&2
            exit 1
          fi
          {
            printf 'candidate_tag=%s\n' "$INPUT_CANDIDATE_TAG"
            printf 'digest=%s\n' "$INPUT_DIGEST"
            printf 'image=%s\n' "$INPUT_IMAGE"
            printf 'retention_days=%s\n' "$INPUT_RETENTION_DAYS"
            printf 'sbom_format=%s\n' "$INPUT_SBOM_FORMAT"
          } >> "$GITHUB_OUTPUT"

  attest:
    name: Generate and publish image evidence
    needs: validate-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-inputs.outputs.trusted_revision }}
          persist-credentials: false

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Generate amd64 SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        env:
          SYFT_PLATFORM: linux/amd64
        with:
          image: ${{ needs.validate-inputs.outputs.image }}@${{ needs.validate-inputs.outputs.digest }}
          format: ${{ needs.validate-inputs.outputs.sbom_format }}
          artifact-name: llama-cpp-sbom-amd64-${{ needs.validate-inputs.outputs.candidate_tag }}
          output-file: llama-cpp-sbom-amd64.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload amd64 SPDX SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: llama-cpp-sbom-amd64-${{ needs.validate-inputs.outputs.candidate_tag }}
          path: llama-cpp-sbom-amd64.spdx.json
          if-no-files-found: error
          retention-days: ${{ needs.validate-inputs.outputs.retention_days }}

      - name: Generate arm64 SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        env:
          SYFT_PLATFORM: linux/arm64
        with:
          image: ${{ needs.validate-inputs.outputs.image }}@${{ needs.validate-inputs.outputs.digest }}
          format: ${{ needs.validate-inputs.outputs.sbom_format }}
          artifact-name: llama-cpp-sbom-arm64-${{ needs.validate-inputs.outputs.candidate_tag }}
          output-file: llama-cpp-sbom-arm64.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload arm64 SPDX SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: llama-cpp-sbom-arm64-${{ needs.validate-inputs.outputs.candidate_tag }}
          path: llama-cpp-sbom-arm64.spdx.json
          if-no-files-found: error
          retention-days: ${{ needs.validate-inputs.outputs.retention_days }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Attest amd64 SPDX SBOM
        shell: bash
        env:
          DIGEST: ${{ needs.validate-inputs.outputs.digest }}
          IMAGE: ${{ needs.validate-inputs.outputs.image }}
        run: |
          set -euo pipefail
          timeout --foreground 120s cosign attest \
            --yes \
            --predicate llama-cpp-sbom-amd64.spdx.json \
            --type spdxjson \
            "$IMAGE@$DIGEST"

      - name: Attest arm64 SPDX SBOM
        shell: bash
        env:
          DIGEST: ${{ needs.validate-inputs.outputs.digest }}
          IMAGE: ${{ needs.validate-inputs.outputs.image }}
        run: |
          set -euo pipefail
          timeout --foreground 120s cosign attest \
            --yes \
            --predicate llama-cpp-sbom-arm64.spdx.json \
            --type spdxjson \
            "$IMAGE@$DIGEST"

      - name: Attest SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.validate-inputs.outputs.image }}
          subject-digest: ${{ needs.validate-inputs.outputs.digest }}
          push-to-registry: true

      - name: Sign exact candidate index
        shell: bash
        env:
          DIGEST: ${{ needs.validate-inputs.outputs.digest }}
          IMAGE: ${{ needs.validate-inputs.outputs.image }}
        run: |
          set -euo pipefail
          timeout --foreground 120s cosign sign --yes "$IMAGE@$DIGEST"
          # Cosign 2 defaults to the legacy .sig location rather than Sigstore bundles.
          # Legacy signing uses the built-in services and still requires a transparency log.
          timeout --foreground 120s cosign sign --yes \
            --new-bundle-format=false \
            --use-signing-config=false \
            --tlog-upload=true \
            "$IMAGE@$DIGEST"
