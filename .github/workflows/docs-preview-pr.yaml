name: Docs / Validate and Preview PR Docs

on:
  pull_request:
    branches: [main, v0]
    types: [opened, reopened, synchronize]
    paths:
      - "docs/**"
      - "fern/**"
      - "README.md"
      - "package.json"
      - "package-lock.json"
      - "scripts/generate-starter-prompt.mts"
      - "scripts/fern-preview-config.mts"
      - "scripts/sync-agent-variant-docs.mts"
      - ".github/workflows/docs-preview-pr.yaml"

concurrency:
  group: fern-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  FERN_STAGING_INSTANCE: nvidia-nemoclaw-staging.docs.buildwithfern.com/nemoclaw

jobs:
  preview:
    name: Docs / Validate and publish PR preview
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check Fern preview availability
        id: fern-preview
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: |
          if [ -n "$FERN_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Fern docs preview because FERN_TOKEN is unavailable. This is expected for fork PRs and repos without Fern preview credentials configured."
          fi

      - name: Checkout the v1 documentation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NVIDIA/NemoClaw
          ref: v1
          persist-credentials: false

      - name: Set up the v1 documentation renderer
        uses: ./.github/actions/setup-rust
        with:
          platform: linux_amd64
          cache-prefix: native-bundle-v4
          save-cache: "false"

      - name: Render the v1 guides for this preview
        run: |
          cargo run --locked -p nemoclaw-build -- docs
          cp -R fern/_generated "$RUNNER_TEMP/v1-guide"

      # Keep the v1 composite action available to its post-job cleanup.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr-docs
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.1"

      - name: Install reviewed npm
        uses: NVIDIA/NemoClaw/.github/actions/setup-reviewed-npm@98669f24d35f18e49b6b2769cd68709509ea24f2

      - name: Install docs dependencies
        working-directory: pr-docs
        run: npm ci --ignore-scripts

      - name: Prepare and validate docs
        working-directory: pr-docs
        run: |
          npm run docs:prepare
          npm run docs:validate

      - name: Assemble and validate the combined preview
        working-directory: pr-docs
        run: |
          node scripts/fern-preview-config.mts "$RUNNER_TEMP/v0-preview" "$RUNNER_TEMP/v1-guide"
          FERN_VERSION=$(node -p "require('./fern/fern.config.json').version")
          cd "$RUNNER_TEMP/v0-preview/fern"
          npx --yes "fern-api@${FERN_VERSION}" check --local

      - name: Generate preview URL
        working-directory: pr-docs
        if: ${{ steps.fern-preview.outputs.enabled == 'true' }}
        id: generate-docs
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
          PREVIEW_ID: pr-${{ github.event.pull_request.number }}
        run: |
          FERN_VERSION=$(node -p "require('./fern/fern.config.json').version")
          set +e
          OUTPUT=$(cd "$RUNNER_TEMP/v0-preview/fern" && npx --yes "fern-api@${FERN_VERSION}" generate --docs --instance "$FERN_STAGING_INSTANCE" --preview --id "$PREVIEW_ID" 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | sed -nE 's/.*Published docs to (https?:\/\/[^[:space:]]+).*/\1/p' | head -n1)
          if [ "$STATUS" -ne 0 ]; then exit "$STATUS"; fi
          if [ -z "$URL" ]; then
            echo "::error::Failed to generate preview URL. See fern output above."
            exit 1
          fi
          FERN_ORG=$(node -p "require('./fern/fern.config.json').organization")
          INSTANCE_PATH="${FERN_STAGING_INSTANCE#*/}"
          if [[ "$INSTANCE_PATH" == "$FERN_STAGING_INSTANCE" ]]; then
            INSTANCE_PATH=""
          else
            INSTANCE_PATH="/${INSTANCE_PATH}"
          fi
          EXPECTED_BASE="https://${FERN_ORG}-preview-${PREVIEW_ID}.docs.buildwithfern.com${INSTANCE_PATH}"
          EXPECTED_PREFIX="${EXPECTED_BASE}/"
          if [[ "$URL" != "$EXPECTED_BASE" && "$URL" != "${EXPECTED_PREFIX}"* ]]; then
            echo "::error::Preview URL must match ${EXPECTED_BASE} or start with ${EXPECTED_PREFIX}; got ${URL}."
            exit 1
          fi
          echo "preview_url=$EXPECTED_BASE" >> "$GITHUB_OUTPUT"

      - name: Post or update PR comment
        working-directory: pr-docs
        if: ${{ steps.fern-preview.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.generate-docs.outputs.preview_url }}
        run: |
          BODY="**Documentation preview** · [v0 home](${PREVIEW_URL%/}/v0/user-guide/openclaw/home) · [v1 home](${PREVIEW_URL%/}/v1/home)"
          MARKER="<!-- fern-preview-docs -->"
          BODY="${BODY}

          ${MARKER}"

          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" | head -1)

          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" \
              -X PATCH -f body="$BODY"
          else
            gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              -f body="$BODY"
          fi
