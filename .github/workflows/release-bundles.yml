# Package the CLI bundles that CI / Bundle built and checked at one commit, one
# archive per platform with their SHA-256 checksums, without rebuilding them.
# Release / Stage calls this for the tagged commit and attaches the archives to
# the draft release. Run it by hand to check that a commit's bundles are ready
# to stage; a manual run only uploads the archives to its own run.
name: Release / CLI bundles
on:
  workflow_call:
    inputs:
      commit:
        description: The full hash of the commit whose bundles to package.
        type: string
        required: true
      version:
        description: The version in the archive names, such as the release tag.
        type: string
        required: true
    outputs:
      artifact:
        description: The run artifact that holds the archives and SHA256SUMS.
        value: ${{ jobs.bundles.outputs.artifact }}
      source:
        description: The CI / Bundle run that built and checked the bundles.
        value: ${{ jobs.bundles.outputs.source }}
  # Temporary: a push run registers the workflow so it can be dispatched.
  push:
    branches: [cv/release-attach-bundles]
  workflow_dispatch:
    inputs:
      commit:
        description: The full hash of a v1 commit that CI / Bundle passed at.
        type: string
        required: true
      version:
        description: The version in the archive names; empty uses the commit.
        type: string
        default: ""
permissions:
  actions: read
defaults:
  run:
    shell: bash
jobs:
  bundles:
    name: Package the checked CLI bundles
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
    outputs:
      artifact: ${{ steps.package.outputs.artifact }}
      source: ${{ steps.package.outputs.source }}
    steps:
      - name: Package the bundles CI checked at the commit
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ inputs.commit }}
          VERSION: ${{ inputs.version || inputs.commit }}
        run: |
          out="$RUNNER_TEMP/cli-bundles"
          work="$RUNNER_TEMP/cli-bundle-work"
          mkdir -p "$out" "$work"
          if ! [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The commit must be a full lowercase commit hash, not '$COMMIT'"
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::The version must be a tag or commit name, not '$VERSION'"
            exit 1
          fi
          platforms=(linux_arm64 linux_amd64 darwin_arm64 windows_amd64)
          retry="Run CI / Bundle at the tag with 'gh workflow run rust.yml --ref TAG', and rerun this workflow once it passes."
          # v1 push runs and manual runs build the commit itself; a pull
          # request run builds a merge commit, so its bundles are another
          # commit's. Newest runs come first.
          mapfile -t runs < <(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/workflows/rust.yml/runs?head_sha=$COMMIT&status=success&per_page=100" |
            jq -r --arg commit "$COMMIT" '.workflow_runs[]
              | select(.head_sha == $commit and .conclusion == "success" and (.event == "push" or .event == "workflow_dispatch"))
              | "\(.id) \(.html_url)"')
          if [ ${#runs[@]} = 0 ]; then
            echo "::error::CI / Bundle hasn't passed at $COMMIT, so no checked bundles exist to stage. $retry"
            exit 1
          fi
          for entry in "${runs[@]}"; do
            read -r run source <<< "$entry"
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" > "$work/artifacts.json"
            names=()
            missing=
            for platform in "${platforms[@]}"; do
              # A rerun bundle job uploads its own attempt's bundle; take the latest.
              name=$(jq -rs --arg prefix "bundle-$platform-$COMMIT-" '[.[].artifacts[]
                | select((.expired | not) and (.name | startswith($prefix)) and (.name | ltrimstr($prefix) | test("^[0-9]+$")))
                | {name, attempt: (.name | ltrimstr($prefix) | tonumber)}] | max_by(.attempt) | .name // empty' "$work/artifacts.json")
              [ -n "$name" ] || missing="$missing $platform"
              names+=("$name")
            done
            [ -n "$missing" ] || break
          done
          if [ -n "$missing" ]; then
            echo "::error::No passing CI / Bundle run at $COMMIT still has the bundle for:$missing. CI keeps a v1 commit's bundles for 7 days. $retry"
            exit 1
          fi
          for i in "${!platforms[@]}"; do
            platform=${platforms[$i]}
            download="$work/$platform"
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "${names[$i]}" --dir "$download"
            tar -xf "$download/bundle.tar" -C "$download"
            if [ ! -f "$download/dist/$platform/manifest.json" ]; then
              echo "::error::${names[$i]} from $source holds no $platform bundle"
              exit 1
            fi
            root="nemoclaw-$VERSION-$platform"
            mv "$download/dist/$platform" "$work/$root"
            rm -rf "$download"
            # Fixed entry order and ownership, so packaging the same bundle
            # again yields the same archive and checksum.
            case "$platform" in
              windows_*) (cd "$work" && find "$root" -print | LC_ALL=C sort | zip -q -X "$out/$root.zip" -@) ;;
              *) tar -C "$work" --sort=name --owner=0 --group=0 --numeric-owner -cf - "$root" | gzip -n > "$out/$root.tar.gz" ;;
            esac
            rm -rf "${work:?}/$root"
          done
          (cd "$out" && sha256sum -- nemoclaw-* > SHA256SUMS)
          echo "artifact=cli-bundles-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "CLI bundles from $source, built and checked at \`$COMMIT\`." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: ${{ runner.temp }}/cli-bundles
          # Already compressed.
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
