# SPDX-License-Identifier: Apache-2.0
#
# Self-hosted runner PR workflow — triggered by copy-pr-bot.
#
# copy-pr-bot pushes PR code to pull-request/<number> branches only after
# a maintainer has vetted the changes (or the author is a trusted NVIDIA
# employee with signed commits). This ensures community PRs never run on
# self-hosted runners without explicit maintainer approval.
#
# Lightweight checks (lint, unit tests) still run on GitHub-hosted runners
# via the regular pr.yaml workflow, which triggers on pull_request events.
#
# See: https://docs.gha-runners.nvidia.com/platform/onboarding/pull-request-testing/

name: E2E / Self-Hosted PR Qualification

on:
  push:
    branches:
      - "pull-request/[0-9]+"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-llama-cpp-generic-gpu:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      actions: read
      contents: read
    outputs:
      base_sha: ${{ steps.changed.outputs.base_sha }}
      managed_image_revision: ${{ steps.publication.outputs.head_sha }}
      selected: ${{ steps.changed.outputs.selected }}
      wsl_arm64_runner_label: ${{ steps.changed.outputs.wsl_arm64_runner_label }}
      wsl_arm64_selected: ${{ steps.changed.outputs.wsl_arm64_selected }}
    steps:
      - id: changed
        name: Select llama.cpp generic GPU E2E from PR files
        env:
          GH_TOKEN: ${{ github.token }}
          WSL_ARM64_MULTI_GPU_RUNNER_LABEL: ${{ vars.WSL_ARM64_MULTI_GPU_RUNNER_LABEL }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^pull-request/([0-9]+)$ ]] || {
            echo "::error::Copied branch name does not identify a PR" >&2
            exit 1
          }
          pr_number="${BASH_REMATCH[1]}"
          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number")"
          head_sha="$(jq -er '.head.sha | select(test("^[a-f0-9]{40}$"))' <<<"$pr_json")"
          base_sha="$(jq -er '.base.sha | select(test("^[a-f0-9]{40}$"))' <<<"$pr_json")"
          [[ "$head_sha" == "$GITHUB_SHA" ]] || {
            echo "::error::Copied PR branch SHA does not match the current PR head" >&2
            exit 1
          }
          if gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/pulls/$pr_number/files?per_page=100" \
            | jq -e '
              flatten
              | any(
                  .filename == ".github/workflows/e2e.yaml"
                  or .filename == ".github/workflows/pr-self-hosted.yaml"
                  or .filename == "scripts/install.sh"
                  or .filename == "src/lib/inference/nim.ts"
                  or .filename == "src/lib/onboard/provider-selection.ts"
                  or .filename == "src/lib/onboard/runtime-provider/configured-runtime.ts"
                  or .filename == "src/lib/onboard/runtime-provider/current.ts"
                  or .filename == "src/lib/onboard/setup-nim-flow.ts"
                  or .filename == "test/e2e/live/llama-cpp-generic-gpu.test.ts"
                  or .filename == "test/e2e/live/gpu-e2e-helpers.ts"
                  or .filename == "test/e2e/mock-parity.json"
                  or .filename == "tools/e2e/cli-artifact-workflow-boundary.mts"
                  or .filename == "tools/e2e/workflow-boundary.mts"
                  or (.filename | startswith("managed-inference/presets/llama-cpp."))
                  or (.filename | startswith("managed-inference/recipes/llama-cpp."))
                  or (.filename | startswith("src/lib/inference/llama-cpp/"))
                  or (.filename | startswith("src/lib/readiness/"))
                  or .filename == "src/lib/onboard/fatal-runtime-preflight.ts"
                  or .filename == "src/lib/onboard/overlayfs-auto-fix.ts"
                  or .filename == "src/lib/onboard/preflight.ts"
                  or (.filename | startswith("src/lib/onboard/runtime-provider/docker-llama-cpp"))
                )
            ' >/dev/null; then
            selected=true
          else
            selected=false
          fi
          if gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/pulls/$pr_number/files?per_page=100" \
            | jq -e '
              flatten
              | any(
                  .filename == ".github/workflows/pr-self-hosted.yaml"
                  or .filename == "src/lib/container-gpu-proof.ts"
                  or .filename == "src/lib/onboard/runtime-provider/nvidia-container-proof.ts"
                  or .filename == "tools/e2e/wsl-arm64-multi-gpu-qualification.mts"
                  or .filename == "test/e2e/support/pr-self-hosted-llama-selector.test.ts"
                )
            ' >/dev/null; then
            wsl_arm64_selected=true
            [[ "$WSL_ARM64_MULTI_GPU_RUNNER_LABEL" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || {
              echo "::error::WSL_ARM64_MULTI_GPU_RUNNER_LABEL must name the reviewed physical WSL ARM64 multi-GPU runner" >&2
              exit 1
            }
          else
            wsl_arm64_selected=false
          fi
          {
            printf 'base_sha=%s\n' "$base_sha"
            printf 'head_sha=%s\n' "$head_sha"
            printf 'pr_number=%s\n' "$pr_number"
            printf 'selected=%s\n' "$selected"
            printf 'wsl_arm64_runner_label=%s\n' "$WSL_ARM64_MULTI_GPU_RUNNER_LABEL"
            printf 'wsl_arm64_selected=%s\n' "$wsl_arm64_selected"
          } >>"$GITHUB_OUTPUT"

      - name: Check out PR base SHA for publication verification
        if: ${{ steps.changed.outputs.selected == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.changed.outputs.base_sha }}

      - name: Set up Node for publication verification
        if: ${{ steps.changed.outputs.selected == 'true' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1

      - name: Install reviewed npm
        if: ${{ steps.changed.outputs.selected == 'true' }}
        uses: NVIDIA/NemoClaw/.github/actions/setup-reviewed-npm@98669f24d35f18e49b6b2769cd68709509ea24f2

      - name: Install publication verifier dependencies
        if: ${{ steps.changed.outputs.selected == 'true' }}
        run: npm ci --ignore-scripts --no-audit --no-fund

      - id: publication
        name: Verify complete base and managed-image publication
        if: ${{ steps.changed.outputs.selected == 'true' }}
        env:
          BASE_SHA: ${{ steps.changed.outputs.base_sha }}
          CANDIDATE_REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ steps.changed.outputs.head_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          MANAGED_IMAGE_SHA: ${{ steps.changed.outputs.head_sha }}
          PR_NUMBER: ${{ steps.changed.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          catalog_path="${RUNNER_TEMP}/pr-managed-image-catalog.json"
          error_path="${RUNNER_TEMP}/pr-managed-image-publication-error.txt"
          deadline=$((SECONDS + 3000))
          while true; do
            rm -f -- "$catalog_path" "$error_path"
            if selection="$(node --no-warnings \
              tools/e2e/pr-managed-image-publication.mts \
              "$catalog_path" 2>"$error_path")"; then
              break
            fi
            if (( SECONDS >= deadline )); then
              cat "$error_path" >&2
              exit 1
            fi
            echo "::notice::Waiting for exact PR managed-image publication for ${CANDIDATE_SHA}"
            sleep 30
          done
          case "$selection" in
            candidate-catalog)
              printf 'head_sha=%s\n' "$CANDIDATE_SHA" >>"$GITHUB_OUTPUT"
              ;;
            base-cohort)
              export EXPECTED_SHA="$BASE_SHA"
              export GITHUB_REF=refs/heads/main
              export GITHUB_SHA="$EXPECTED_SHA"
              export PUBLICATION_HISTORY_ALLOW_NON_HEAD=1
              export REQUIRE_MANAGED_IMAGE_PUBLICATION=1
              export SELECT_NEAREST_SUCCESSFUL_PUBLICATION=0
              node --no-warnings tools/e2e/base-image-publication.mts \
                --wait-seconds 3000 \
                --poll-seconds 30
              ;;
            *)
              echo "::error::PR managed-image selection is invalid" >&2
              exit 1
              ;;
          esac

  llama-cpp-generic-gpu:
    name: llama.cpp on generic NVIDIA GPU
    needs: select-llama-cpp-generic-gpu
    if: ${{ needs.select-llama-cpp-generic-gpu.outputs.selected == 'true' }}
    runs-on: linux-amd64-gpu-rtxpro6000-latest-1
    timeout-minutes: 120
    env:
      E2E_ARTIFACT_DIR: ${{ github.workspace }}/e2e-artifacts/live/llama-cpp-generic-gpu
      E2E_JOB: "1"
      E2E_MANAGED_IMAGE_REVISION: ${{ needs.select-llama-cpp-generic-gpu.outputs.managed_image_revision }}
      E2E_TARGET_ID: llama-cpp-generic-gpu
      NEMOCLAW_ACCEPT_THIRD_PARTY_SOFTWARE: "1"
      NEMOCLAW_CLI_BIN: ${{ github.workspace }}/bin/nemoclaw.js
      NEMOCLAW_E2E_EXPECTED_SHA: ${{ github.sha }}
      NEMOCLAW_E2E_SHARD: default
      NEMOCLAW_GATEWAY_RUNTIME: docker
      NEMOCLAW_LLAMA_CPP_QUALIFICATION_HEAD_SHA: ${{ github.sha }}
      NEMOCLAW_LLAMACPP_RECIPE: llama-cpp.nemotron-3-nano-30b-a3b.spark-single.v1
      NEMOCLAW_NON_INTERACTIVE: "1"
      NEMOCLAW_PROVIDER: install-llama-cpp
      NEMOCLAW_RUN_LIVE_E2E: "1"
      NEMOCLAW_SANDBOX_NAME: e2e-llamacpp-gpu
      OPENSHELL_GATEWAY: nemoclaw
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Prepare E2E workspace
        uses: NVIDIA/NemoClaw/.github/actions/prepare-e2e@afffe9cdedd168bfd7116c53846ddffe32eadd4c

      - name: Bind E2E correlation identity
        shell: bash
        run: |
          set -euo pipefail
          correlation_id="$(node --input-type=module -e \
            'import { randomUUID } from "node:crypto"; console.log(randomUUID())')"
          [[ "$correlation_id" =~ ^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$ ]]
          printf 'NEMOCLAW_E2E_CORRELATION_ID=%s\n' "$correlation_id" >>"$GITHUB_ENV"

      - name: Install OpenShell CLI
        run: bash scripts/install-openshell.sh

      - name: Run llama.cpp generic NVIDIA GPU live test
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/.npm-global/bin:$PATH"
          OPENSHELL_BIN="$(command -v openshell)"
          export OPENSHELL_BIN
          "$OPENSHELL_BIN" --version
          npx tsx tools/e2e/live-vitest-invocation.mts run \
            --test-path test/e2e/live/llama-cpp-generic-gpu.test.ts

      - name: Upload llama.cpp generic NVIDIA GPU artifacts
        if: always()
        uses: NVIDIA/NemoClaw/.github/actions/upload-e2e-artifacts@7768e15eb90d3ee2d33432f481dfe8747e4f6d57

  wsl-arm64-multi-gpu:
    name: WSL ARM64 multi-GPU qualification
    needs: select-llama-cpp-generic-gpu
    if: ${{ needs.select-llama-cpp-generic-gpu.outputs.wsl_arm64_selected == 'true' }}
    runs-on: ${{ needs.select-llama-cpp-generic-gpu.outputs.wsl_arm64_runner_label }}
    timeout-minutes: 45
    env:
      WSL_DISTRO: Ubuntu
      WSL_TEST_USER: nemoclaw-ci
      TRUSTED_WSL_HELPER: ${{ github.workspace }}\trusted-wsl-ci\tools\wsl\ci-helper.ps1
    steps:
      - name: Force LF line endings for checkout
        shell: powershell
        run: git config --global core.autocrlf false

      - name: Check out trusted WSL helper from PR base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select-llama-cpp-generic-gpu.outputs.base_sha }}
          path: trusted-wsl-ci
          persist-credentials: false
          sparse-checkout: |
            tools/wsl/ci-helper.ps1
          sparse-checkout-cone-mode: false

      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Verify physical Windows ARM64 runner
        shell: powershell
        run: |
          $architecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($architecture -ne 'Arm64') {
            throw "WSL ARM64 qualification requires a physical Windows ARM64 runner; got $architecture"
          }

      - name: Resolve workspace paths for WSL
        shell: powershell
        run: |
          . "$env:TRUSTED_WSL_HELPER"
          $null = Set-WslWorkflowPaths `
            -Workspace "$env:GITHUB_WORKSPACE\source" `
            -WorkdirPrefix '/home/nemoclaw-ci/nemoclaw-wsl-vitest' `
            -RunId $env:GITHUB_RUN_ID `
            -RunAttempt $env:GITHUB_RUN_ATTEMPT `
            -EnvironmentFile $env:GITHUB_ENV

      - name: Require configured Ubuntu WSL and Docker Desktop GPU integration
        shell: powershell
        run: |
          . "$env:TRUSTED_WSL_HELPER"
          $probe = Invoke-WslNativeOutput -ArgumentList @('-d', $env:WSL_DISTRO, '--', 'bash', '-lc', 'test "$(uname -m)" = aarch64 && test -c /dev/dxg && docker info >/dev/null && nvidia-smi -L')
          if ($probe.ExitCode -ne 0) {
            $probe.Output | Out-Default
            throw 'The reviewed runner must provide Ubuntu WSL ARM64, /dev/dxg, Docker Desktop integration, and NVIDIA GPU access.'
          }

      - name: Install WSL qualification dependencies
        shell: powershell
        run: |
          . "$env:TRUSTED_WSL_HELPER"
          $packages = @(
            'bash', 'ca-certificates', 'curl', 'git', 'jq', 'make', 'procps',
            'rsync', 'tar', 'xz-utils'
          )
          Install-WslUbuntuDependencies -Distro $env:WSL_DISTRO -Packages $packages -TestUser $env:WSL_TEST_USER
          Install-WslNode -Distro $env:WSL_DISTRO

      - name: Copy exact PR head into WSL ext4 workspace
        shell: powershell
        run: |
          . "$env:TRUSTED_WSL_HELPER"
          Sync-WslCheckout `
            -Distro $env:WSL_DISTRO `
            -Checkout $env:WSL_CHECKOUT_DIR `
            -Workdir $env:WSL_WORKDIR `
            -Owner $env:WSL_TEST_USER

      - name: Install dependencies and build in WSL
        shell: powershell
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          . "$env:TRUSTED_WSL_HELPER"
          $workdir = ConvertTo-BashLiteral -Value $env:WSL_WORKDIR
          $nodeAuthToken = ConvertTo-BashLiteral -Value ([string]$env:NODE_AUTH_TOKEN)
          $script = @"
          set -euo pipefail
          cd $workdir
          export NPM_CONFIG_CACHE="`$HOME/.npm"
          export NODE_AUTH_TOKEN=$nodeAuthToken
          bash .github/actions/ci-install-dependencies.sh
          unset NODE_AUTH_TOKEN
          npm run build:cli
          "@
          Invoke-WslScript -Distro $env:WSL_DISTRO -User $env:WSL_TEST_USER -Script $script

      - name: Run WSL ARM64 multi-GPU live qualification
        shell: powershell
        run: |
          . "$env:TRUSTED_WSL_HELPER"
          $workdir = ConvertTo-BashLiteral -Value $env:WSL_WORKDIR
          $artifactDir = ConvertTo-BashLiteral -Value "$env:WSL_CHECKOUT_DIR/e2e-artifacts/live/wsl-arm64-multi-gpu"
          $expectedSha = ConvertTo-BashLiteral -Value $env:GITHUB_SHA
          $script = @"
          set -euo pipefail
          cd $workdir
          export E2E_ARTIFACT_DIR=$artifactDir
          export E2E_JOB=1
          export E2E_TARGET_ID=wsl-arm64-multi-gpu
          export NEMOCLAW_E2E_EXPECTED_SHA=$expectedSha
          export NEMOCLAW_E2E_SHARD=default
          export NEMOCLAW_RUN_LIVE_E2E=1
          export NEMOCLAW_WSL_ARM64_MULTI_GPU_QUALIFICATION=1
          mkdir -p "`$E2E_ARTIFACT_DIR"
          npx tsx tools/e2e/wsl-arm64-multi-gpu-qualification.mts 2>&1 `
            | tee "`$E2E_ARTIFACT_DIR/qualification.log"
          "@
          Invoke-WslScript -Distro $env:WSL_DISTRO -User $env:WSL_TEST_USER -Script $script

      - name: Upload WSL ARM64 multi-GPU qualification artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wsl-arm64-multi-gpu-qualification
          path: ${{ github.workspace }}\source\e2e-artifacts\live\wsl-arm64-multi-gpu
          if-no-files-found: error
          retention-days: 14

  build-sandbox-images:
    runs-on: linux-amd64-cpu4
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve sandbox base image
        uses: ./.github/actions/resolve-sandbox-base-image

      - name: Build production image
        env:
          BASE_IMAGE: ${{ env.BASE_IMAGE }}
        run: |
          set -euo pipefail
          build_args=(--build-arg "BASE_IMAGE=${BASE_IMAGE}")
          scripts/check-production-build-args.sh "${build_args[@]}"
          docker build "${build_args[@]}" -t nemoclaw-production .

      - name: Save production image
        run: |
          set -euo pipefail
          docker save nemoclaw-production | gzip > /tmp/isolation-image.tar.gz

      - name: Upload isolation image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: isolation-image
          path: /tmp/isolation-image.tar.gz
          retention-days: 1
          if-no-files-found: error

  build-sandbox-images-arm64:
    runs-on: linux-arm64-cpu4
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve sandbox base image
        uses: ./.github/actions/resolve-sandbox-base-image

      - name: Build production image on arm64
        env:
          BASE_IMAGE: ${{ env.BASE_IMAGE }}
        run: |
          set -euo pipefail
          build_args=(--build-arg "BASE_IMAGE=${BASE_IMAGE}")
          scripts/check-production-build-args.sh "${build_args[@]}"
          docker build "${build_args[@]}" -t nemoclaw-production-arm64 .

  managed-image-openclaw-security:
    runs-on: linux-amd64-cpu4
    timeout-minutes: 15
    needs: build-sandbox-images
    env:
      E2E_ARTIFACT_DIR: ${{ github.workspace }}/e2e-artifacts/live/managed-image-openclaw-security
      E2E_TARGET_ID: managed-image-openclaw-security
      NEMOCLAW_E2E_SHARD: default
      NEMOCLAW_MANAGED_IMAGE_SECURITY_COHORT: pr-${{ github.run_id }}-${{ github.run_attempt }}
      NEMOCLAW_RUN_LIVE_E2E: "1"
      NEMOCLAW_TEST_IMAGE: nemoclaw-production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bind managed-image risk signal identity
        run: |
          set -euo pipefail
          echo "NEMOCLAW_E2E_EXPECTED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "NEMOCLAW_E2E_CORRELATION_ID=$(python3 -c 'import uuid; print(uuid.uuid4())')" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install reviewed npm
        uses: ./.github/actions/setup-reviewed-npm

      - name: Install root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Download image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: isolation-image
          path: /tmp

      - name: Load image
        run: gunzip -c /tmp/isolation-image.tar.gz | docker load

      - name: Validate OpenClaw managed-image security boundary
        run: >-
          npx vitest run --project integration test/e2e-runtime/managed-image-openclaw-security.test.ts --silent=false --reporter=default --reporter=test/e2e/risk-signal-reporter.ts

      - name: Validate glibc probe lifecycle
        if: ${{ !cancelled() }}
        env:
          NEMOCLAW_RUN_GLIBC_PROBE_DOCKER_E2E: "1"
        run: >-
          npx vitest run --project integration test/e2e-runtime/image-compatibility-docker-lifecycle.test.ts
          --silent=false --reporter=default --reporter=test/e2e/risk-signal-reporter.ts

      - name: Remove managed-image security resources
        if: ${{ always() }}
        run: |
          set -euo pipefail
          label="io.nvidia.nemoclaw.managed-image.cohort=$NEMOCLAW_MANAGED_IMAGE_SECURITY_COHORT"
          cleanup_failed=0
          mapfile -t containers < <(docker ps -aq --filter "label=$label")
          ((${#containers[@]} == 0)) || docker rm -f "${containers[@]}" >/dev/null || cleanup_failed=1
          mapfile -t volumes < <(docker volume ls -q --filter "label=$label")
          ((${#volumes[@]} == 0)) || docker volume rm -f "${volumes[@]}" >/dev/null || cleanup_failed=1
          docker ps -aq --filter "label=$label" | grep -q . && cleanup_failed=1
          docker volume ls -q --filter "label=$label" | grep -q . && cleanup_failed=1
          exit "$cleanup_failed"

      - name: Upload OpenClaw managed-image security evidence
        if: ${{ always() }}
        uses: ./.github/actions/upload-e2e-artifacts
        with:
          name: managed-image-openclaw-security-evidence
          path: ${{ env.E2E_ARTIFACT_DIR }}

  port-override-image-contract:
    runs-on: linux-amd64-cpu4
    timeout-minutes: 10
    needs: build-sandbox-images
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: isolation-image
          path: /tmp

      - name: Load image
        run: gunzip -c /tmp/isolation-image.tar.gz | docker load

      - name: Run port override E2E tests
        run: NEMOCLAW_TEST_IMAGE=nemoclaw-production bash test/e2e-port-overrides.sh

  test-non-root-sandbox-smoke:
    runs-on: linux-amd64-cpu4
    timeout-minutes: 5
    needs: build-sandbox-images
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: isolation-image
          path: /tmp

      - name: Load image
        run: gunzip -c /tmp/isolation-image.tar.gz | docker load

      - name: Run non-root sandbox smoke test
        run: NEMOCLAW_TEST_IMAGE=nemoclaw-production bash test/e2e-non-root-smoke.sh
