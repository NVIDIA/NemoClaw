name: Reproduce MSI failed-upgrade recovery
on:
  push:
    tags: [msi-rollback-red-20261124-1]
permissions:
  contents: read
  actions: read
jobs:
  rollback:
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: '14958369830'
          run-id: '45475766293'
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/current
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: '14960885115'
          run-id: '45475766293'
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/older
      - name: Require recovery of the previous installation
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustc --edition=2021 -D warnings e2e.rs -o "$env:RUNNER_TEMP/e2e.exe"
          & "$env:RUNNER_TEMP/e2e.exe" --older "$env:RUNNER_TEMP/older/older.msi" --current "$env:RUNNER_TEMP/current/nemoclaw-v0.1.0-rc.3-windows_amd64.msi" --version 0.1.0-rc.3 --msi-version 0.1.3 --stale 'retired\only-in-older.txt' --logs "$env:RUNNER_TEMP/installer-logs"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: rollback-red-logs
          path: ${{ runner.temp }}/installer-logs/*.log
          retention-days: 3
