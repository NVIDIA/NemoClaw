name: CI / Platform Compatibility
run-name: Issue 11401 Windows Ollama reproduction on main e4e6391870
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-11401-${{ github.ref }}
  cancel-in-progress: false
jobs:
  reproduce:
    name: Issue 11401 on Windows x64 and WSL2
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      WSL_DISTRO: Ubuntu-24.04
      WSL_TEST_USER: nemoclaw-ci
    steps:
      - name: Preserve Linux line endings
        shell: powershell
        run: git config --global core.autocrlf false
      - name: Check out the diagnostic harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
          persist-credentials: false
      - name: Check out main at the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e4e6391870bef3834cd30cdd997529e5361f89a5
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare real WSL and Node
        shell: powershell
        run: |
          . "$env:GITHUB_WORKSPACE\source\tools\wsl\ci-helper.ps1"
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\evidence" | Out-Null
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture | ConvertTo-Json | Set-Content "$env:GITHUB_WORKSPACE\evidence\windows.json"
          Ensure-WslDistro -Distro $env:WSL_DISTRO
          & wsl --set-version $env:WSL_DISTRO 2
          if ($LASTEXITCODE -ne 0) { throw 'WSL2 is required' }
          & wsl --list --verbose
          Install-WslUbuntuDependencies -Distro $env:WSL_DISTRO -TestUser $env:WSL_TEST_USER -Packages @('bash','ca-certificates','curl','git','jq','python3','python3-pexpect','rsync','xz-utils','unzip','procps','iproute2')
          Install-WslNode -Distro $env:WSL_DISTRO
          Set-WslWorkflowPaths -Workspace "$env:GITHUB_WORKSPACE\source" -WorkdirPrefix '/tmp/nemoclaw-wsl-vitest' -RunId $env:GITHUB_RUN_ID -RunAttempt $env:GITHUB_RUN_ATTEMPT -EnvironmentFile $env:GITHUB_ENV
      - name: Start real Windows Ollama with an installed model
        shell: powershell
        timeout-minutes: 12
        run: |
          $root = "$env:RUNNER_TEMP\issue-11401-ollama"
          New-Item -ItemType Directory -Force $root | Out-Null
          $zip = "$root\ollama.zip"
          & curl.exe -fSL --connect-timeout 30 --max-time 600 'https://github.com/ollama/ollama/releases/download/v0.34.0/ollama-windows-amd64.zip' -o $zip
          if ($LASTEXITCODE -ne 0) { throw 'Ollama download failed' }
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a7dd1b174f39d3d1b8a25d4cbc86045d0e190b17187bfdcbe2f2ee3b5a11470e') { throw 'Ollama checksum mismatch' }
          & 'C:\Program Files\7-Zip\7z.exe' e $zip "-o$root" ollama.exe -y
          if ($LASTEXITCODE -ne 0) { throw 'Ollama extraction failed' }
          Remove-Item $zip
          $env:OLLAMA_HOST = '127.0.0.1:11434'
          $env:OLLAMA_MODELS = "$root\models"
          $process = Start-Process "$root\ollama.exe" -ArgumentList serve -PassThru -RedirectStandardOutput "$env:GITHUB_WORKSPACE\evidence\ollama.stdout.log" -RedirectStandardError "$env:GITHUB_WORKSPACE\evidence\ollama.stderr.log"
          $process.Id | Set-Content "$env:GITHUB_WORKSPACE\evidence\ollama.pid.before.txt"
          $ready = $false
          for ($i=0; $i -lt 30; $i++) {
            try { $null = Invoke-RestMethod 'http://127.0.0.1:11434/api/tags'; $ready=$true; break } catch { Start-Sleep 2 }
          }
          if (-not $ready) { throw 'Windows Ollama did not start' }
          & "$root\ollama.exe" pull smollm2:135m
          if ($LASTEXITCODE -ne 0) { throw 'Model pull failed' }
          Invoke-RestMethod 'http://127.0.0.1:11434/api/tags' | ConvertTo-Json -Depth 8 | Set-Content "$env:GITHUB_WORKSPACE\evidence\windows-tags.json"
          Get-NetTCPConnection -LocalPort 11434 -State Listen | Select-Object LocalAddress,LocalPort,OwningProcess | ConvertTo-Json | Set-Content "$env:GITHUB_WORKSPACE\evidence\windows-listener.json"
      - name: Install and start Docker Desktop for the reported route
        id: desktop
        continue-on-error: true
        timeout-minutes: 12
        shell: powershell
        run: |
          $installer = "$env:RUNNER_TEMP\Docker-Desktop-Installer.exe"
          & curl.exe -fSL --connect-timeout 30 --max-time 600 'https://desktop.docker.com/win/main/amd64/Docker%20Desktop%20Installer.exe' -o $installer
          if ($LASTEXITCODE -ne 0) { throw 'Docker Desktop download failed' }
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Docker') { throw 'Docker installer signature is invalid' }
          $process = Start-Process $installer -ArgumentList 'install','--quiet','--accept-license','--backend=wsl-2' -PassThru
          if (-not $process.WaitForExit(360000)) { $process.Kill(); throw 'Docker Desktop installer timed out' }
          "exit=$($process.ExitCode)" | Set-Content "$env:GITHUB_WORKSPACE\evidence\desktop-install.txt"
          if ($process.ExitCode -ne 0) { throw 'Docker Desktop installation failed' }
          $settingsRoot = "$env:APPDATA\Docker"
          New-Item -ItemType Directory -Force $settingsRoot | Out-Null
          @{configurationFileVersion=43;wslEngineEnabled=$true;integratedWslDistros=@($env:WSL_DISTRO);enableIntegrationWithDefaultWslDistro=$true} | ConvertTo-Json | Set-Content "$settingsRoot\settings-store.json"
          Start-Process 'C:\Program Files\Docker\Docker\Docker Desktop.exe'
          $ready=$false
          for ($i=0; $i -lt 60; $i++) {
            & wsl -d $env:WSL_DISTRO -- docker info --format '{{.OperatingSystem}}'
            if ($LASTEXITCODE -eq 0) { $ready=$true; break }
            Start-Sleep 5
          }
          if (-not $ready) { throw 'Docker Desktop did not become available inside WSL' }
      - name: Build the unmodified main CLI in WSL
        shell: powershell
        timeout-minutes: 15
        run: |
          . "$env:GITHUB_WORKSPACE\source\tools\wsl\ci-helper.ps1"
          Sync-WslCheckout -Distro $env:WSL_DISTRO -Checkout $env:WSL_CHECKOUT_DIR -Workdir $env:WSL_WORKDIR -Owner $env:WSL_TEST_USER
          $workdir = ConvertTo-BashLiteral $env:WSL_WORKDIR
          $script = @"
          set -euo pipefail
          cd $workdir
          test "`$(git rev-parse HEAD)" = e4e6391870bef3834cd30cdd997529e5361f89a5
          npm ci --ignore-scripts
          npm run build:cli
          "@
          Invoke-WslScript -Distro $env:WSL_DISTRO -User $env:WSL_TEST_USER -Script $script
      - name: Run real discovery and provider-menu probes
        shell: powershell
        timeout-minutes: 10
        env:
          DESKTOP_SETUP: ${{ steps.desktop.outcome }}
        run: |
          . "$env:GITHUB_WORKSPACE\source\tools\wsl\ci-helper.ps1"
          $harness = ConvertTo-BashLiteral (ConvertTo-WslPath "$env:GITHUB_WORKSPACE\harness\tools\wsl\verify-11401.cts")
          $evidence = ConvertTo-BashLiteral (ConvertTo-WslPath "$env:GITHUB_WORKSPACE\evidence")
          $workdir = ConvertTo-BashLiteral $env:WSL_WORKDIR
          $script = @"
          set -euo pipefail
          cd $workdir
          uname -a
          cat /etc/os-release
          command -v powershell.exe
          if command -v ollama; then echo 'Unexpected WSL-native Ollama'; exit 1; fi
          ss -ltnp 'sport = :11434'
          node $harness $workdir $evidence '$env:DESKTOP_SETUP'
          "@
          Invoke-WslScript -Distro $env:WSL_DISTRO -User $env:WSL_TEST_USER -Script $script
      - name: Record the Windows process after the probes
        if: always()
        shell: powershell
        run: |
          Get-Process ollama -ErrorAction SilentlyContinue | Select-Object Id,Path,StartTime | ConvertTo-Json | Set-Content "$env:GITHUB_WORKSPACE\evidence\ollama.after.json"
          Get-ChildItem "$env:LOCALAPPDATA\Docker" -Filter '*install*.txt' -ErrorAction SilentlyContinue | Copy-Item -Destination "$env:GITHUB_WORKSPACE\evidence" -ErrorAction SilentlyContinue
      - name: Upload reproduction evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue-11401-main-windows-wsl
          path: evidence
          if-no-files-found: warn
          retention-days: 7
