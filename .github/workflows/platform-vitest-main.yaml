name: CI / Platform Compatibility
run-name: Issue 11401 Windows regression comparison
on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Full reviewed base commit
        required: true
        type: string
      candidate_sha:
        description: Full reviewed candidate commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: verify-11401-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-regression:
    name: Windows PowerShell and WSL regression (${{ matrix.role }})
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        role: [base, candidate]
    env:
      WSL_DISTRO: Ubuntu-24.04
      WSL_TEST_USER: nemoclaw-ci
      TARGET_SHA: ${{ matrix.role == 'base' && inputs.base_sha || inputs.candidate_sha }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      ROLE: ${{ matrix.role }}
    steps:
      - name: Validate commit identities and preserve Linux line endings
        shell: powershell
        run: |
          if ($env:TARGET_SHA -cnotmatch '^[0-9a-f]{40}$' -or $env:CANDIDATE_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'Full commit SHAs are required' }
          git config --global core.autocrlf false
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\evidence" | Out-Null
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,OSArchitecture | ConvertTo-Json | Set-Content "$env:GITHUB_WORKSPACE\evidence\windows.json"
      - name: Check out the production revision under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          path: source
          persist-credentials: false
      - name: Check out the common regression tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_sha }}
          path: witness
          persist-credentials: false
          sparse-checkout: |
            src/lib/inference/ollama/windows.test.ts
            src/lib/onboard/provider-host-state.test.ts
          sparse-checkout-cone-mode: false
      - name: Prepare Windows PowerShell and Ubuntu WSL2
        shell: powershell
        run: |
          . "$env:GITHUB_WORKSPACE\source\tools\wsl\ci-helper.ps1"
          $PSVersionTable.PSVersion.ToString() | Set-Content "$env:GITHUB_WORKSPACE\evidence\powershell-version.txt"
          Ensure-WslDistro -Distro $env:WSL_DISTRO
          $kernel = & wsl -d $env:WSL_DISTRO -- uname -r
          if ($LASTEXITCODE -ne 0 -or $kernel -notmatch 'WSL2') { throw 'A running WSL2 kernel is required' }
          Install-WslUbuntuDependencies -Distro $env:WSL_DISTRO -TestUser $env:WSL_TEST_USER -Packages @('bash','ca-certificates','curl','git','python3','rsync','xz-utils')
          Install-WslNode -Distro $env:WSL_DISTRO
          $paths = Set-WslWorkflowPaths -Workspace "$env:GITHUB_WORKSPACE\source" -WorkdirPrefix '/tmp/nemoclaw-wsl-vitest' -RunId $env:GITHUB_RUN_ID -RunAttempt $env:GITHUB_RUN_ATTEMPT -EnvironmentFile $env:GITHUB_ENV
          Sync-WslCheckout -Distro $env:WSL_DISTRO -Checkout $paths.Checkout -Workdir $paths.Workdir -Owner $env:WSL_TEST_USER
          Invoke-WslScript -Distro $env:WSL_DISTRO -User root -Script 'mv "$1" /home/nemoclaw-ci/issue-11401-main' -ScriptArguments @($paths.Workdir)
      - name: Run common tests against the pinned production revision
        shell: powershell
        run: |
          . "$env:GITHUB_WORKSPACE\source\tools\wsl\ci-helper.ps1"
          $witness = ConvertTo-WslPath "$env:GITHUB_WORKSPACE\witness"
          $evidence = ConvertTo-WslPath "$env:GITHUB_WORKSPACE\evidence"
          $script = @'
          set -euo pipefail
          cd /home/nemoclaw-ci/issue-11401-main
          test "$(git rev-parse HEAD)" = "$1"
          test -n "$WSL_DISTRO_NAME"
          command -v powershell.exe
          cp "$3/src/lib/inference/ollama/windows.test.ts" src/lib/inference/ollama/windows.test.ts
          cp "$3/src/lib/onboard/provider-host-state.test.ts" src/lib/onboard/provider-host-state.test.ts
          git diff --name-only > "$4/overlaid-test-paths.txt"
          git diff --exit-code -- src/lib/inference/ollama/windows.ts src/lib/onboard/provider-host-state.ts
          printf '%s\n' "$1" > "$4/source-commit.txt"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run catalog:compile
          npm run build:policy-boundary
          set +e
          ./node_modules/.bin/vitest run --project cli src/lib/inference/ollama/windows.test.ts src/lib/onboard/provider-host-state.test.ts -t '#11401' --reporter=json --outputFile="$4/vitest.json" > "$4/vitest.log" 2>&1
          result=$?
          set -e
          python3 - "$4/vitest.json" "$2" "$result" <<'VERIFY'
          import json,sys
          from pathlib import Path
          report=json.loads(Path(sys.argv[1]).read_text())
          failures=[a['fullName'] for suite in report['testResults'] for a in suite['assertionResults'] if a['status']=='failed']
          expected=[
            'captures Windows process state with daemon only (#11401)',
            'captures Windows process state with tray only (#11401)',
            'captures Windows process state with no Ollama processes (#11401)',
            'reuses a protected Windows route after initial discovery returns null without an executable path (#11401)',
          ]
          print(json.dumps({'role':sys.argv[2],'passed':report['numPassedTests'],'failed':report['numFailedTests'],'failures':failures},indent=2))
          assert report['numPassedTests']+report['numFailedTests']==11, 'All eleven regressions must execute'
          if sys.argv[2]=='base':
            assert int(sys.argv[3])==1 and len(failures)==4, 'Base must fail the four known regression cases'
            assert all(any(name.endswith(want) for name in failures) for want in expected), 'Unexpected baseline failure'
          else:
            assert int(sys.argv[3])==0 and report['numFailedTests']==0, 'Candidate must pass every regression'
          VERIFY
          '@
          Invoke-WslScript -Distro $env:WSL_DISTRO -User $env:WSL_TEST_USER -Script $script -ScriptArguments @($env:TARGET_SHA,$env:ROLE,$witness,$evidence)
      - name: Upload source identities and Windows regression evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue-11401-${{ matrix.role }}
          path: evidence
          retention-days: 14
