name: CI / Platform Compatibility
run-name: Issue 11401 Windows regression comparison
on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Full reviewed base commit
        required: true
        type: string
      candidate_sha:
        description: Full reviewed candidate commit
        required: true
        type: string
      live_daemon:
        description: Verify snapshot capture against a real Windows Ollama daemon
        required: false
        default: false
        type: boolean
      docker_desktop:
        description: Also verify the real Docker Desktop provider flow using Docker Desktop 4.89
        required: false
        default: false
        type: boolean
      windows_runner:
        description: Existing GitHub Windows runner image
        required: false
        default: windows-latest
        type: choice
        options:
          - windows-latest
          - windows-11-vs2026-arm
permissions:
  contents: read
concurrency:
  group: verify-11401-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-regression:
    if: ${{ !inputs.live_daemon }}
    name: Windows PowerShell and WSL regression (${{ matrix.role }})
    runs-on: ${{ inputs.windows_runner || 'windows-latest' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        role: [base, candidate]
    env:
      WSL_DISTRO: Ubuntu-24.04
      WSL_TEST_USER: nemoclaw-ci
      TARGET_SHA: ${{ matrix.role == 'base' && inputs.base_sha || inputs.candidate_sha }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      ROLE: ${{ matrix.role }}
    steps:
      - name: Validate commit identities and preserve Linux line endings
        shell: powershell
        run: |
          if ($env:TARGET_SHA -cnotmatch '^[0-9a-f]{40}$' -or $env:CANDIDATE_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'Full commit SHAs are required' }
          git config --global core.autocrlf false
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\evidence" | Out-Null
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,OSArchitecture | ConvertTo-Json | Set-Content "$env:GITHUB_WORKSPACE\evidence\windows.json"
      - name: Check out the production revision under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          path: source
          persist-credentials: false
      - name: Check out the common regression tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_sha }}
          path: witness
          persist-credentials: false
          sparse-checkout: |
            src/lib/inference/ollama/windows.test.ts
            src/lib/onboard/provider-host-state.test.ts
          sparse-checkout-cone-mode: false
      - name: Prepare Windows PowerShell and Ubuntu WSL2
        shell: powershell
        run: |
          . "$env:GITHUB_WORKSPACE\source\tools\wsl\ci-helper.ps1"
          $PSVersionTable.PSVersion.ToString() | Set-Content "$env:GITHUB_WORKSPACE\evidence\powershell-version.txt"
          Ensure-WslDistro -Distro $env:WSL_DISTRO -MaxAttempts 1
          $kernel = & wsl -d $env:WSL_DISTRO -- uname -r
          if ($LASTEXITCODE -ne 0 -or $kernel -notmatch 'WSL2') { throw 'A running WSL2 kernel is required' }
          Install-WslUbuntuDependencies -Distro $env:WSL_DISTRO -TestUser $env:WSL_TEST_USER -Packages @('bash','ca-certificates','curl','git','python3','rsync','xz-utils')
          Install-WslNode -Distro $env:WSL_DISTRO
          $paths = Set-WslWorkflowPaths -Workspace "$env:GITHUB_WORKSPACE\source" -WorkdirPrefix '/tmp/nemoclaw-wsl-vitest' -RunId $env:GITHUB_RUN_ID -RunAttempt $env:GITHUB_RUN_ATTEMPT -EnvironmentFile $env:GITHUB_ENV
          Sync-WslCheckout -Distro $env:WSL_DISTRO -Checkout $paths.Checkout -Workdir $paths.Workdir -Owner $env:WSL_TEST_USER
          Invoke-WslScript -Distro $env:WSL_DISTRO -User root -Script 'mv "$1" /home/nemoclaw-ci/issue-11401-main' -ScriptArguments @($paths.Workdir)
      - name: Run common tests against the pinned production revision
        shell: powershell
        run: |
          . "$env:GITHUB_WORKSPACE\source\tools\wsl\ci-helper.ps1"
          $witness = ConvertTo-WslPath "$env:GITHUB_WORKSPACE\witness"
          $evidence = ConvertTo-WslPath "$env:GITHUB_WORKSPACE\evidence"
          $script = @'
          set -euo pipefail
          cd /home/nemoclaw-ci/issue-11401-main
          test "$(git rev-parse HEAD)" = "$1"
          test -n "$WSL_DISTRO_NAME"
          command -v powershell.exe
          cp "$3/src/lib/inference/ollama/windows.test.ts" src/lib/inference/ollama/windows.test.ts
          cp "$3/src/lib/onboard/provider-host-state.test.ts" src/lib/onboard/provider-host-state.test.ts
          git diff --name-only > "$4/overlaid-test-paths.txt"
          git diff --exit-code -- src/lib/inference/ollama/windows.ts src/lib/onboard/provider-host-state.ts
          printf '%s\n' "$1" > "$4/source-commit.txt"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run catalog:compile
          npm run build:policy-boundary
          set +e
          ./node_modules/.bin/vitest run --project cli src/lib/inference/ollama/windows.test.ts src/lib/onboard/provider-host-state.test.ts -t '#11401' --reporter=json --outputFile="$4/vitest.json" > "$4/vitest.log" 2>&1
          result=$?
          set -e
          python3 - "$4/vitest.json" "$2" "$result" <<'VERIFY'
          import json,sys
          from pathlib import Path
          report=json.loads(Path(sys.argv[1]).read_text())
          failures=[a['fullName'] for suite in report['testResults'] for a in suite['assertionResults'] if a['status']=='failed']
          expected=[
            'captures Windows process state with daemon only (#11401)',
            'captures Windows process state with tray only (#11401)',
            'captures Windows process state with no Ollama processes (#11401)',
            'reuses a protected Windows route after initial discovery returns null without an executable path (#11401)',
          ]
          print(json.dumps({'role':sys.argv[2],'passed':report['numPassedTests'],'failed':report['numFailedTests'],'failures':failures},indent=2))
          assert report['numPassedTests']+report['numFailedTests']==11, 'All eleven regressions must execute'
          if sys.argv[2]=='base':
            assert int(sys.argv[3])==1 and len(failures)==4, 'Base must fail the four known regression cases'
            assert all(any(name.replace(chr(39), '').endswith(want) for name in failures) for want in expected), 'Unexpected baseline failure'
          else:
            assert int(sys.argv[3])==0 and report['numFailedTests']==0, 'Candidate must pass every regression'
          VERIFY
          '@
          Invoke-WslScript -Distro $env:WSL_DISTRO -User $env:WSL_TEST_USER -Script $script -ScriptArguments @($env:TARGET_SHA,$env:ROLE,$witness,$evidence)
      - name: Upload source identities and Windows regression evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue-11401-${{ matrix.role }}
          path: evidence
          retention-days: 14

  live-daemon:
    if: ${{ inputs.live_daemon }}
    name: Real Windows Ollama snapshot (${{ matrix.role }})
    runs-on: ${{ inputs.windows_runner || 'windows-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        role: ${{ fromJSON(inputs.docker_desktop && '["candidate"]' || '["base","candidate"]') }}
    env:
      WSL_DISTRO: Ubuntu-24.04
      WSL_TEST_USER: nemoclaw-ci
      TARGET_SHA: ${{ matrix.role == 'base' && inputs.base_sha || inputs.candidate_sha }}
      ROLE: ${{ matrix.role }}
      TRY_DESKTOP: ${{ inputs.docker_desktop }}
    steps:
      - name: Validate source identity and preserve Linux line endings
        shell: powershell
        run: |
          if ($env:TARGET_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'A full source SHA is required' }
          git config --global core.autocrlf false
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\evidence" | Out-Null
      - name: Check out the production source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          path: source
          persist-credentials: false
      - name: Check out the read-only capture harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
          persist-credentials: false
          sparse-checkout: tools/wsl/verify-11401.cts
          sparse-checkout-cone-mode: false
      - name: Install WSL on the Windows 11 ARM image
        if: ${{ runner.arch == 'ARM64' }}
        shell: powershell
        timeout-minutes: 10
        run: |
          $ErrorActionPreference='Continue'
          & wsl --install --no-distribution --web-download 2>&1 | Tee-Object "$env:GITHUB_WORKSPACE\evidence\wsl-bootstrap.log"
          & wsl --version 2>&1 | Tee-Object "$env:GITHUB_WORKSPACE\evidence\wsl-version.log"
          $ErrorActionPreference='Stop'
      - name: Install the pinned Docker Desktop release
        if: ${{ inputs.docker_desktop }}
        shell: powershell
        timeout-minutes: 10
        run: |
          $installer = "$env:RUNNER_TEMP\Docker-Desktop-Installer.exe"
          $dockerArch=if($env:RUNNER_ARCH -eq 'ARM64'){'arm64'}else{'amd64'}
          $dockerHash=if($env:RUNNER_ARCH -eq 'ARM64'){'a423c8cb01fb4e5c507237c5981e6ddc8ce1f06740d7507a1aadfb8f9805b3a3'}else{'854626704af28a160d5af68b96b3e32eacf08ab397ce6c12eb02a04788d73681'}
          & curl.exe -fSL --connect-timeout 30 --max-time 300 "https://desktop.docker.com/win/main/$dockerArch/238018/Docker%20Desktop%20Installer.exe" -o $installer
          if ($LASTEXITCODE -ne 0) { throw 'Docker Desktop download failed' }
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $dockerHash) { throw 'Docker Desktop checksum mismatch' }
          $process = Start-Process $installer -ArgumentList 'install','--quiet','--accept-license','--backend=wsl-2' -PassThru
          if (-not $process.WaitForExit(360000)) { $process.Kill(); throw 'Docker Desktop installation timed out' }
          if ($process.ExitCode -ne 0) { throw "Docker Desktop installation failed: $($process.ExitCode)" }
          Remove-Item $installer
      - name: Build the pinned CLI in a persistent WSL workspace
        shell: powershell
        run: |
          . "$env:GITHUB_WORKSPACE\source\tools\wsl\ci-helper.ps1"
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,OSArchitecture | ConvertTo-Json | Set-Content "$env:GITHUB_WORKSPACE\evidence\windows.json"
          Ensure-WslDistro -Distro $env:WSL_DISTRO -MaxAttempts 1
          $kernel = & wsl -d $env:WSL_DISTRO -- uname -r
          if ($LASTEXITCODE -ne 0 -or $kernel -notmatch 'WSL2') { throw 'A running WSL2 kernel is required' }
          Install-WslUbuntuDependencies -Distro $env:WSL_DISTRO -TestUser $env:WSL_TEST_USER -Packages @('bash','ca-certificates','curl','git','python3','rsync','xz-utils')
          Install-WslNode -Distro $env:WSL_DISTRO
          if ($env:TRY_DESKTOP -eq 'true') {
            $settingsRoot="$env:APPDATA\Docker"
            New-Item -ItemType Directory -Force $settingsRoot | Out-Null
            $settingsPath="$settingsRoot\settings-store.json"
            $settings=if(Test-Path $settingsPath){Get-Content $settingsPath -Raw | ConvertFrom-Json}else{[pscustomobject]@{}}
            $updates=@{wslEngineEnabled=$true;integratedWslDistros=@($env:WSL_DISTRO);enableIntegrationWithDefaultWslDistro=$true}
            foreach($entry in $updates.GetEnumerator()){$settings | Add-Member -MemberType NoteProperty -Name $entry.Key -Value $entry.Value -Force}
            [IO.File]::WriteAllText($settingsPath,($settings | ConvertTo-Json -Depth 32),(New-Object System.Text.UTF8Encoding $false))
            $ErrorActionPreference='Continue'
            & 'C:\Program Files\Docker\Docker\resources\bin\docker.exe' desktop start --timeout 180 2>&1 | Tee-Object "$env:GITHUB_WORKSPACE\evidence\desktop-start.log"
            & 'C:\Program Files\Docker\Docker\resources\bin\docker.exe' --context desktop-linux info 2>&1 | Tee-Object "$env:GITHUB_WORKSPACE\evidence\desktop-engine.log"
            $ErrorActionPreference='Stop'
          }
          $paths = Set-WslWorkflowPaths -Workspace "$env:GITHUB_WORKSPACE\source" -WorkdirPrefix '/tmp/nemoclaw-wsl-vitest' -RunId $env:GITHUB_RUN_ID -RunAttempt $env:GITHUB_RUN_ATTEMPT -EnvironmentFile $env:GITHUB_ENV
          Sync-WslCheckout -Distro $env:WSL_DISTRO -Checkout $paths.Checkout -Workdir $paths.Workdir -Owner $env:WSL_TEST_USER
          Invoke-WslScript -Distro $env:WSL_DISTRO -User root -Script 'mv "$1" /home/nemoclaw-ci/issue-11401-main' -ScriptArguments @($paths.Workdir)
          $script = @'
          set -euo pipefail
          cd /home/nemoclaw-ci/issue-11401-main
          test "$(git rev-parse HEAD)" = "$1"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:cli
          '@
          Invoke-WslScript -Distro $env:WSL_DISTRO -User $env:WSL_TEST_USER -Script $script -ScriptArguments @($env:TARGET_SHA)
      - name: Hold Windows Ollama alive while testing production snapshot capture
        shell: powershell
        timeout-minutes: 12
        run: |
          . "$env:GITHUB_WORKSPACE\source\tools\wsl\ci-helper.ps1"
          $root = "$env:RUNNER_TEMP\issue-11401-ollama"
          New-Item -ItemType Directory -Force $root | Out-Null
          $zip = "$root\ollama.zip"
          $ollamaArch=if($env:RUNNER_ARCH -eq 'ARM64'){'arm64'}else{'amd64'}
          $ollamaHash=if($env:RUNNER_ARCH -eq 'ARM64'){'a5ce957f750dbe85b34c9da81440969f4b9c7f747a3bb629ce50ac6cd2a63536'}else{'a7dd1b174f39d3d1b8a25d4cbc86045d0e190b17187bfdcbe2f2ee3b5a11470e'}
          & curl.exe -fSL --connect-timeout 30 --max-time 600 "https://github.com/ollama/ollama/releases/download/v0.34.0/ollama-windows-$ollamaArch.zip" -o $zip
          if ($LASTEXITCODE -ne 0) { throw 'Ollama download failed' }
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $ollamaHash) { throw 'Ollama checksum mismatch' }
          & 'C:\Program Files\7-Zip\7z.exe' x $zip "-o$root" -y
          if ($LASTEXITCODE -ne 0) { throw 'Ollama extraction failed' }
          Remove-Item $zip
          $env:OLLAMA_HOST = '127.0.0.1:11434'
          $env:OLLAMA_CONTEXT_LENGTH = '64000'
          $env:OLLAMA_MODELS = "$root\models"
          $daemon = Start-Process "$root\ollama.exe" -ArgumentList serve -PassThru -RedirectStandardOutput "$env:GITHUB_WORKSPACE\evidence\ollama.stdout.log" -RedirectStandardError "$env:GITHUB_WORKSPACE\evidence\ollama.stderr.log"
          try {
            $ready=$false
            for ($i=0; $i -lt 30; $i++) {
              try { $null=Invoke-RestMethod 'http://127.0.0.1:11434/api/tags'; $ready=$true; break } catch { Start-Sleep 1 }
            }
            if (-not $ready) { throw 'Ollama API did not become ready' }
            $model = if($env:TRY_DESKTOP -eq 'true'){'qwen3.5:0.8b'}else{'smollm2:135m'}
            & "$root\ollama.exe" pull $model
            if ($LASTEXITCODE -ne 0) { throw 'Model pull failed' }
            if ($env:TRY_DESKTOP -eq 'true') {
              $warmup=@{model=$model;prompt='Hello';stream=$false;options=@{num_ctx=64000;num_predict=1};keep_alive='10m'} | ConvertTo-Json -Depth 5
              Invoke-RestMethod -Method Post -ContentType 'application/json' -Body $warmup -Uri 'http://127.0.0.1:11434/api/generate' -TimeoutSec 180 | ConvertTo-Json -Depth 6 | Set-Content "$env:GITHUB_WORKSPACE\evidence\model-warmup.json"
            }
            $before=Get-Process -Id $daemon.Id
            $tagsBefore=Invoke-RestMethod 'http://127.0.0.1:11434/api/tags'
            $before | Select-Object Id,Path,StartTime | ConvertTo-Json | Set-Content "$env:GITHUB_WORKSPACE\evidence\daemon-before.json"
            $tagsBefore | ConvertTo-Json -Depth 8 | Set-Content "$env:GITHUB_WORKSPACE\evidence\tags-before.json"
            $harness=ConvertTo-WslPath "$env:GITHUB_WORKSPACE\harness\tools\wsl\verify-11401.cts"
            $evidence=ConvertTo-WslPath "$env:GITHUB_WORKSPACE\evidence"
            Invoke-WslScript -Distro $env:WSL_DISTRO -User $env:WSL_TEST_USER -Script 'node "$1" /home/nemoclaw-ci/issue-11401-main "$2" "$3" "$4" "$5"' -ScriptArguments @($harness,$evidence,$env:ROLE,$env:TARGET_SHA,$env:TRY_DESKTOP)
            $after=Get-Process -Id $daemon.Id
            $tagsAfter=Invoke-RestMethod 'http://127.0.0.1:11434/api/tags'
            if ($before.StartTime -ne $after.StartTime -or ($tagsBefore | ConvertTo-Json -Depth 8) -ne ($tagsAfter | ConvertTo-Json -Depth 8)) { throw 'The running daemon or model inventory changed' }
            $after | Select-Object Id,Path,StartTime | ConvertTo-Json | Set-Content "$env:GITHUB_WORKSPACE\evidence\daemon-after.json"
            $tagsAfter | ConvertTo-Json -Depth 8 | Set-Content "$env:GITHUB_WORKSPACE\evidence\tags-after.json"
          } finally { Stop-Process -Id $daemon.Id -ErrorAction SilentlyContinue }
      - name: Retain Docker Desktop failure diagnostics
        if: ${{ always() && inputs.docker_desktop }}
        shell: powershell
        run: |
          Get-ChildItem "$env:LOCALAPPDATA\Docker\log\host" -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -match 'backend|desktop' } | ForEach-Object { Get-Content $_.FullName -Tail 150 | Set-Content (Join-Path "$env:GITHUB_WORKSPACE\evidence" $_.Name) }
          Get-WinEvent -FilterHashtable @{LogName='Application';StartTime=(Get-Date).AddMinutes(-30)} -ErrorAction SilentlyContinue | Where-Object { $_.ProviderName -in @('Application Error','.NET Runtime','Windows Error Reporting') } | Select-Object -First 15 TimeCreated,Id,ProviderName,Message | ConvertTo-Json -Depth 5 | Set-Content "$env:GITHUB_WORKSPACE\evidence\application-errors.json"
      - name: Upload live daemon and snapshot evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue-11401-live-${{ matrix.role }}
          path: evidence
          retention-days: 14
