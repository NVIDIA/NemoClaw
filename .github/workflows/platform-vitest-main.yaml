name: CI / Platform Compatibility

on:
  workflow_dispatch:
    inputs:
      run_windows_native_installer:
        description: Build and qualify the no-WSL ARM64 Windows candidate installer
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/workflows/docs-preview-*.yaml"
      - "ISSUE_TEMPLATE/**"
      - ".github/ISSUE_TEMPLATE/**"

permissions:
  actions: read
  contents: read

concurrency:
  group: platform-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu-2604-contract:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.run_windows_native_installer) }}
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04@sha256:b7f48194d4d8b763a478a621cdc81c27be222ba2206ca3ca6bc42b49685f3d9e
    timeout-minutes: 20
    steps:
      - name: Install runner dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils ca-certificates docker.io git python3
          rm -rf /var/lib/apt/lists/*

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Verify Ubuntu 26.04 userspace
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = "ubuntu"
          test "$VERSION_ID" = "26.04"
          command -v docker
          docker info --format 'server={{.ServerVersion}} os={{.OperatingSystem}}'
          command -v strings
          printf 'os=%s version=%s arch=%s\n' "$ID" "$VERSION_ID" "$(uname -m)"
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build CLI
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse --verify HEAD)" = "$GITHUB_SHA"
          npm run build:cli

      - name: Run Ubuntu 26.04 compatibility contracts
        run: |
          npx vitest run --project cli \
            src/lib/onboard/preflight.test.ts \
            src/lib/onboard/preflight-ubuntu-2604.test.ts
          npx vitest run --project integration test/e2e-runtime/platform.test.ts
          npx vitest run --project installer-integration \
            --testTimeout 30000 \
            test/installer-integration/install-preflight.test.ts

  macos-vitest:
    name: macOS compatibility (${{ matrix.shard }}/4)
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.run_windows_native_installer) }}
    runs-on: macos-26
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            timeout_minutes: 60
          - shard: 2
            timeout_minutes: 30
          - shard: 3
            timeout_minutes: 30
          - shard: 4
            timeout_minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ci/platform-vitest-macos-requirements.lock

      - name: Install macOS test dependencies
        run: |
          set -euo pipefail
          brew install bash coreutils fd gawk ripgrep
          printf '%s\n' \
            "$(brew --prefix bash)/bin" \
            "$(brew --prefix coreutils)/libexec/gnubin" \
            "$(brew --prefix gawk)/libexec/gnubin" \
            >>"$GITHUB_PATH"
          python -m pip install \
            --only-binary=:all: \
            --require-hashes \
            --requirement ci/platform-vitest-macos-requirements.lock

      - name: Show environment
        run: |
          set -euo pipefail
          echo "Runner: $(uname -a)"
          echo "Arch:   $(uname -m)"
          sw_vers
          bash --version | head -n 1
          node --version
          npm --version
          python --version
          python3 --version
          python -c 'import setuptools, yaml; print(f"setuptools={setuptools.__version__} pyyaml={yaml.__version__}")'
          rg --version | head -n 1
          timeout --version | head -n 1
          stat --version | head -n 1
          awk --version | head -n 1

      - name: Install pinned OpenShell
        env:
          NEMOCLAW_NON_INTERACTIVE: "1"
        run: env -u GH_TOKEN -u GITHUB_TOKEN bash scripts/install-openshell.sh

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          cd nemoclaw
          npm ci --ignore-scripts

      - name: Build CLI and plugin
        run: |
          npm run build:cli
          cd nemoclaw
          npm run build

      - name: Run full Vitest suite on macOS
        run: npx vitest run --testTimeout 60000 --shard="${{ matrix.shard }}/4"

      - id: macos_docker
        name: Detect Docker availability for macOS E2E
        if: ${{ matrix.shard == 1 }}
        shell: bash
        run: |
          set -euo pipefail
          if docker info >/dev/null 2>&1; then
            echo "docker_ok=true" >>"$GITHUB_OUTPUT"
            docker version
          else
            echo "docker_ok=false" >>"$GITHUB_OUTPUT"
            echo "Docker is unavailable on the Apple silicon runner."
          fi

      - name: Run macOS live E2E
        if: ${{ matrix.shard == 1 && steps.macos_docker.outputs.docker_ok == 'true' && github.ref == 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NVIDIA_INFERENCE_API_KEY: ${{ secrets.NVIDIA_INFERENCE_API_KEY }}
          NEMOCLAW_ACCEPT_THIRD_PARTY_SOFTWARE: "1"
          NEMOCLAW_NON_INTERACTIVE: "1"
          NEMOCLAW_RECREATE_SANDBOX: "1"
          NEMOCLAW_SANDBOX_NAME: "e2e-macos"
          NEMOCLAW_RUN_LIVE_E2E: "1"
        run: >-
          npx vitest run --project e2e-live
          test/e2e/live/full-e2e.test.ts
          --silent=false --reporter=default

      - name: Explain skipped macOS live E2E
        if: ${{ matrix.shard == 1 && (steps.macos_docker.outputs.docker_ok != 'true' || github.ref != 'refs/heads/main') }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "The macOS live E2E did not run because this workflow does not test main."
          else
            echo "The macOS live E2E did not run because Docker is unavailable."
          fi
          echo "The macOS build and Vitest shard still provide platform evidence."

      - name: Upload macOS E2E logs on failure
        if: ${{ matrix.shard == 1 && failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-platform-evidence-logs
          path: |
            /tmp/nemoclaw-e2e-*.log
            ${{ github.workspace }}/e2e-artifacts/live
          if-no-files-found: ignore
          retention-days: 14

  windows-native-installer:
    name: Windows native installer candidate (ARM64, no WSL)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_windows_native_installer }}
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 120
    steps:
      - name: Check out the NemoClaw candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Check out the pinned OpenShell Windows candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NVIDIA/OpenShell
          ref: bcd517bbe08cc80860c9be57699390cd32e8445f # NVIDIA/OpenShell#2721 merge commit
          path: openshell
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pinned Rust for the OpenShell ARM64 build
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.95.0
          target: aarch64-pc-windows-msvc
          cache: true
          cache-bin: false
          cache-on-failure: true
          cache-workspace-crates: true
          cache-key: openshell-2721-bcd517bbe08c
          rust-src-dir: openshell
          rustflags: ""

      - name: Set up pinned .NET SDK for WiX
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.419

      - name: Set up pinned Node.js for NemoClaw and OpenClaw
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: |
            candidate/package-lock.json
            candidate/agents/openclaw/openclaw-runtime/package-lock.json

      - name: Build the pinned NVIDIA/OpenShell#2721 candidate
        working-directory: openshell
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          & .\tasks\scripts\windows-msvc.ps1 build aarch64-pc-windows-msvc
          & .\tasks\scripts\windows-msvc.ps1 artifacts aarch64-pc-windows-msvc

      - name: Qualify native execution, install, repair, recovery, and uninstall
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $candidate = [IO.Path]::GetFullPath("$env:GITHUB_WORKSPACE\candidate")
          $openshell = [IO.Path]::GetFullPath("$env:GITHUB_WORKSPACE\openshell")
          & "$candidate\scripts\checks\run-windows-native-installer-qualification.ps1" `
            -CandidateCheckout $candidate `
            -CandidateSha $env:GITHUB_SHA `
            -OpenShellCheckout $openshell `
            -OpenShellSha bcd517bbe08cc80860c9be57699390cd32e8445f `
            -ArtifactDirectory "$env:RUNNER_TEMP\windows-native-installer-receipts"

      - name: Upload Windows native installer qualification receipts
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-native-installer-${{ github.sha }}
          path: ${{ runner.temp }}/windows-native-installer-receipts/
          if-no-files-found: error
          retention-days: 14

      - name: Restore the assembled native NemoClaw runtime payload
        id: windows-runtime-payload-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/nemoclaw-native-runtime-payload
          key: windows-native-runtime-v1-${{ runner.os }}-${{ runner.arch }}-openshell-bcd517bbe08c-${{ hashFiles('candidate/package.json', 'candidate/package-lock.json', 'candidate/bin/**', 'candidate/src/**', 'candidate/nemoclaw/**', 'candidate/agents/**', 'candidate/scripts/lib/package-blueprint-runner-runtime.mts', 'candidate/scripts/checks/prepare-windows-native-package-payload.ps1', 'candidate/packaging/windows/NATIVE-PREVIEW.txt', 'candidate/packaging/windows/MXC-LICENSE.txt', 'candidate/packaging/windows/runtime/**') }}

      - name: Assemble the native NemoClaw runtime payload
        if: ${{ steps.windows-runtime-payload-cache.outputs.cache-hit != 'true' }}
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $candidate = [IO.Path]::GetFullPath("$env:GITHUB_WORKSPACE\candidate")
          $openshell = [IO.Path]::GetFullPath("$env:GITHUB_WORKSPACE\openshell")
          & "$candidate\scripts\checks\prepare-windows-native-package-payload.ps1" `
            -CandidateCheckout $candidate `
            -OpenShellPayloadRoot "$openshell\target\aarch64-pc-windows-msvc\release" `
            -OutputDirectory "$env:RUNNER_TEMP\nemoclaw-native-runtime-payload"

      - name: Cache the assembled native NemoClaw runtime payload
        if: ${{ steps.windows-runtime-payload-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/nemoclaw-native-runtime-payload
          key: ${{ steps.windows-runtime-payload-cache.outputs.cache-primary-key }}

      - name: Build ARM64 MSI and setup executable
        id: windows-package
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $candidate = [IO.Path]::GetFullPath("$env:GITHUB_WORKSPACE\candidate")
          $version = [string](Get-Content -LiteralPath "$candidate\package.json" -Raw | ConvertFrom-Json).version
          $packageRoot = [IO.Path]::GetFullPath("$env:RUNNER_TEMP\nemoclaw-windows-package")
          $payloadRoot = [IO.Path]::GetFullPath("$env:RUNNER_TEMP\nemoclaw-native-runtime-payload")
          "product_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "package_root=$packageRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          & "$candidate\scripts\checks\build-windows-native-package.ps1" `
            -ProductVersion $version `
            -PayloadRoot $payloadRoot `
            -OutputDirectory $packageRoot
          $referenceReceipts = Join-Path $packageRoot 'reference-qualification'
          [IO.Directory]::CreateDirectory($referenceReceipts) | Out-Null
          Copy-Item `
            -Path "$env:RUNNER_TEMP\windows-native-installer-receipts\*" `
            -Destination $referenceReceipts `
            -Recurse

      - name: Qualify MSI and setup executable
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $candidate = [IO.Path]::GetFullPath("$env:GITHUB_WORKSPACE\candidate")
          $version = '${{ steps.windows-package.outputs.product_version }}'
          $packageRoot = '${{ steps.windows-package.outputs.package_root }}'
          & "$candidate\scripts\checks\run-windows-native-package-qualification.ps1" `
            -ProductVersion $version `
            -MsiPath "$packageRoot\NemoClaw-$version-windows-arm64.msi" `
            -SetupPath "$packageRoot\NemoClawSetup-$version-windows-arm64.exe" `
            -PackageManifestPath "$packageRoot\package-manifest.json" `
            -ArtifactDirectory "$packageRoot\qualification"

      - name: Upload installer for the recorded GitHub download
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-native-download-source-${{ github.sha }}
          path: |
            ${{ steps.windows-package.outputs.package_root }}/NemoClaw-${{ steps.windows-package.outputs.product_version }}-windows-arm64.msi
            ${{ steps.windows-package.outputs.package_root }}/NemoClawSetup-${{ steps.windows-package.outputs.product_version }}-windows-arm64.exe
            ${{ steps.windows-package.outputs.package_root }}/package-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Create native Windows proof-of-life video
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $candidate = [IO.Path]::GetFullPath("$env:GITHUB_WORKSPACE\candidate")
          $version = '${{ steps.windows-package.outputs.product_version }}'
          $packageRoot = '${{ steps.windows-package.outputs.package_root }}'
          & "$candidate\scripts\checks\create-windows-native-proof-video.ps1" `
            -CandidateCheckout $candidate `
            -ProductVersion $version `
            -CandidateSha $env:GITHUB_SHA `
            -GitHubRepository $env:GITHUB_REPOSITORY `
            -GitHubRunId $env:GITHUB_RUN_ID `
            -DownloadArtifactName "windows-native-download-source-$env:GITHUB_SHA" `
            -DesktopDownloadDirectory "$env:USERPROFILE\Desktop\NemoClawDownload" `
            -MsiPath "$packageRoot\NemoClaw-$version-windows-arm64.msi" `
            -SetupPath "$packageRoot\NemoClawSetup-$version-windows-arm64.exe" `
            -PackageManifestPath "$packageRoot\package-manifest.json" `
            -QualificationReceiptPath "$packageRoot\qualification\package-qualification.json" `
            -HostReceiptPath "$packageRoot\reference-qualification\host-platform.json" `
            -OpenShellReceiptPath "$packageRoot\reference-qualification\openshell-source.json" `
            -OutputDirectory "$packageRoot\proof-video"

      - name: Upload native Windows proof-of-life video
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-native-proof-video-${{ github.sha }}
          path: ${{ runner.temp }}/nemoclaw-windows-package/proof-video/
          if-no-files-found: error
          retention-days: 14

      - name: Upload downloadable Windows native package
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nemoclaw-native-windows-package-${{ github.sha }}
          path: ${{ runner.temp }}/nemoclaw-windows-package/
          if-no-files-found: warn
          retention-days: 14

  wsl-vitest:
    name: WSL compatibility (${{ matrix.shard }}/4)
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.run_windows_native_installer) }}
    runs-on: windows-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            timeout_minutes: 180
          - shard: 2
            timeout_minutes: 90
          - shard: 3
            timeout_minutes: 90
          - shard: 4
            timeout_minutes: 90
    env:
      WSL_DISTRO: Ubuntu
      WSL_TEST_USER: nemoclaw-ci
      TRUSTED_WSL_HELPER: ${{ github.workspace }}\trusted-wsl-ci\tools\wsl\ci-helper.ps1
      NEMOCLAW_NON_INTERACTIVE: "1"
      NEMOCLAW_ACCEPT_THIRD_PARTY_SOFTWARE: "1"
      NEMOCLAW_RECREATE_SANDBOX: "1"
      NEMOCLAW_SANDBOX_NAME: "e2e-wsl"
    steps:
      - name: Force LF line endings for checkout
        shell: powershell
        run: git config --global core.autocrlf false

      - name: Check out the trusted WSL helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted-wsl-ci
          persist-credentials: false
          sparse-checkout: |
            tools/wsl/ci-helper.ps1
          sparse-checkout-cone-mode: false

      - name: Check out candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve workspace paths for WSL
        shell: powershell
        run: |
          . "$env:TRUSTED_WSL_HELPER"
          $null = Set-WslWorkflowPaths `
            -Workspace "$env:GITHUB_WORKSPACE\source" `
            -WorkdirPrefix '/tmp/nemoclaw-wsl-vitest' `
            -RunId $env:GITHUB_RUN_ID `
            -RunAttempt $env:GITHUB_RUN_ATTEMPT `
            -EnvironmentFile $env:GITHUB_ENV

      - name: Ensure Ubuntu WSL exists
        shell: powershell
        run: |
          . "$env:TRUSTED_WSL_HELPER"
          Ensure-WslDistro -Distro $env:WSL_DISTRO

      - name: Install Ubuntu dependencies
        shell: powershell
        run: |
          . "$env:TRUSTED_WSL_HELPER"
          $packages = @(
            'bash', 'ca-certificates', 'curl', 'git', 'jq', 'lsb-release', 'make',
            'python3', 'python3-pip', 'python3-venv', 'ripgrep', 'rsync', 'tar', 'unzip', 'xz-utils'
          )
          Install-WslUbuntuDependencies -Distro $env:WSL_DISTRO -Packages $packages -TestUser $env:WSL_TEST_USER

      - name: Install Node.js 22 in WSL
        shell: powershell
        run: |
          . "$env:TRUSTED_WSL_HELPER"
          Install-WslNode -Distro $env:WSL_DISTRO

      - name: Copy checkout into WSL ext4 workspace
        shell: powershell
        run: |
          . "$env:TRUSTED_WSL_HELPER"
          Sync-WslCheckout `
            -Distro $env:WSL_DISTRO `
            -Checkout $env:WSL_CHECKOUT_DIR `
            -Workdir $env:WSL_WORKDIR `
            -Owner $env:WSL_TEST_USER

      - name: Install dependencies and build in WSL
        shell: powershell
        run: |
          . "$env:TRUSTED_WSL_HELPER"
          $testUser = ConvertTo-BashLiteral -Value $env:WSL_TEST_USER
          $workdir = ConvertTo-BashLiteral -Value $env:WSL_WORKDIR
          $script = @"
          set -euo pipefail
          id -un | grep -Fxq $testUser
          cd $workdir
          npm ci --ignore-scripts
          npm run build:cli
          cd nemoclaw
          npm ci --ignore-scripts
          npm run build
          "@
          Invoke-WslScript -Distro $env:WSL_DISTRO -User $env:WSL_TEST_USER -Script $script

      - name: Run full Vitest suite in WSL
        shell: powershell
        run: |
          . "$env:TRUSTED_WSL_HELPER"
          $testUser = ConvertTo-BashLiteral -Value $env:WSL_TEST_USER
          $workdir = ConvertTo-BashLiteral -Value $env:WSL_WORKDIR
          $script = @"
          set -euo pipefail
          id -un | grep -Fxq $testUser
          cd $workdir
          export NEMOCLAW_EXEC_TIMEOUT=60000
          export NEMOCLAW_TEST_TIMEOUT=60000
          npx vitest run --testTimeout 60000 --shard='${{ matrix.shard }}/4'
          "@
          Invoke-WslScript -Distro $env:WSL_DISTRO -User $env:WSL_TEST_USER -Script $script

      # Keep the root-only test selection and identity checks inline. Only the
      # trusted helper constructs WSL commands and transfers scripts.
      - name: Run root-required Vitest contracts in WSL
        if: ${{ matrix.shard == 1 }}
        shell: powershell
        run: |
          . "$env:TRUSTED_WSL_HELPER"
          $workdir = ConvertTo-BashLiteral -Value $env:WSL_WORKDIR
          $script = @"
          set -euo pipefail
          id -u | grep -Fxq '0'
          cd $workdir
          if ! getent group sandbox >/dev/null; then
            groupadd --system sandbox
          fi
          if ! id -u sandbox >/dev/null 2>&1; then
            useradd --system --gid sandbox --home-dir /sandbox --shell /bin/bash sandbox
          fi
          install -d -o root -g root -m 0755 /usr/local/lib/nemoclaw
          install -o root -g root -m 0644 \
            scripts/lib/normalize_mutable_config_perms.py \
            /usr/local/lib/nemoclaw/normalize_mutable_config_perms.py
          npx vitest run --project integration \
            test/agents/hermes/hermes-restart-config-seal-recovery.test.ts \
            -t 'keeps the locked Hermes entry sticky-protected|lets a sandbox-group peer create state'
          npx vitest run --project integration \
            test/agents/openclaw/runtime/nemoclaw-start-perms.test.ts \
            -t 'requires both fixed files to match|reclaims a root-owned collapsed config|leaves a root-owned recovery baseline untouched'
          "@
          Invoke-WslScript -Distro $env:WSL_DISTRO -User root -Script $script

      - id: wsl_docker
        name: Detect Docker availability in WSL
        if: ${{ matrix.shard == 1 }}
        shell: powershell
        run: |
          . "$env:TRUSTED_WSL_HELPER"
          $script = @'
          if docker info >/dev/null 2>&1; then
            echo DOCKER_OK=1
          else
            echo DOCKER_OK=0
          fi
          '@
          $result = Invoke-WslScript -Distro $env:WSL_DISTRO -Script $script -CaptureOutput
          if ($result -match 'DOCKER_OK=1') {
            'docker_ok=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host 'Docker is available in WSL'
          } else {
            'docker_ok=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host 'Docker is unavailable in WSL'
          }

      - name: Run WSL live E2E
        if: ${{ matrix.shard == 1 && steps.wsl_docker.outputs.docker_ok == 'true' && github.ref == 'refs/heads/main' }}
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NVIDIA_INFERENCE_API_KEY: ${{ secrets.NVIDIA_INFERENCE_API_KEY }}
        run: |
          . "$env:TRUSTED_WSL_HELPER"
          $workdir = ConvertTo-BashLiteral -Value $env:WSL_WORKDIR
          $exports = @(
            'export NVIDIA_INFERENCE_API_KEY=' + (ConvertTo-BashLiteral -Value ([string]$env:NVIDIA_INFERENCE_API_KEY))
            'export GITHUB_TOKEN=' + (ConvertTo-BashLiteral -Value ([string]$env:GITHUB_TOKEN))
            'export NEMOCLAW_NON_INTERACTIVE=' + (ConvertTo-BashLiteral -Value $env:NEMOCLAW_NON_INTERACTIVE)
            'export NEMOCLAW_ACCEPT_THIRD_PARTY_SOFTWARE=' + (ConvertTo-BashLiteral -Value $env:NEMOCLAW_ACCEPT_THIRD_PARTY_SOFTWARE)
            'export NEMOCLAW_RECREATE_SANDBOX=' + (ConvertTo-BashLiteral -Value $env:NEMOCLAW_RECREATE_SANDBOX)
            'export NEMOCLAW_SANDBOX_NAME=' + (ConvertTo-BashLiteral -Value $env:NEMOCLAW_SANDBOX_NAME)
          ) -join "`n"
          $script = @"
          set -euo pipefail
          cd $workdir
          $exports
          export NEMOCLAW_RUN_LIVE_E2E=1
          npx vitest run --project e2e-live test/e2e/live/full-e2e.test.ts --silent=false --reporter=default
          "@
          Invoke-WslScript -Distro $env:WSL_DISTRO -Script $script

      - name: Explain skipped WSL live E2E
        if: ${{ matrix.shard == 1 && (steps.wsl_docker.outputs.docker_ok != 'true' || github.ref != 'refs/heads/main') }}
        shell: powershell
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            Write-Host 'The WSL live E2E did not run because this workflow does not test main.'
          } else {
            Write-Host 'The WSL live E2E did not run because Docker is unavailable.'
          }
          Write-Host 'The WSL build and Vitest shard still provide platform evidence.'

      - name: Upload WSL E2E log on failure
        if: ${{ matrix.shard == 1 && failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wsl-platform-evidence-install-log
          path: C:\Users\runneradmin\AppData\Local\Temp\nemoclaw-e2e-install.log
          if-no-files-found: ignore
          retention-days: 14
