name: Policy / Independent Approval Review Signal

# This workflow is intentionally unprivileged and non-required. Its completion
# wakes the trusted default-branch workflow_run reconciler. Scheduled
# reconciliation repairs a suppressed or missed signal.
on:
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions: {}

jobs:
  signal:
    name: Signal independent-approval review change
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Emit inert review signal
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "Review state changed for PR #${PR_NUMBER}."
