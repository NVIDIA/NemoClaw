name: Native platform
on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      platform:
        type: string
        required: true
      lifecycle-shards:
        description: JSON list of lifecycle shard numbers; its length is the partition count.
        type: string
        default: "[1, 2]"
      live:
        description: Also run the Docker and Kubernetes live suites, which need a Linux runner.
        type: boolean
        default: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  TEST_PLATFORM: ${{ inputs.platform }}
  CARGO_INCREMENTAL: "0"
# Build and test, and Build bundle, run in parallel on separate runners; the
# lifecycle shards start when both have uploaded their artifacts. Artifact names
# carry the run attempt, and consumers read them from the producers' outputs, so
# rerunning a failed shard reuses an earlier attempt's artifacts.
jobs:
  build:
    name: Build and test
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.identity.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          platform: ${{ inputs.platform }}
      - name: Check formatting
        run: cargo ci fmt
      - name: Lint Rust
        run: cargo ci clippy
      - name: Build test executables
        run: cargo ci build
      - name: Run tests
        run: cargo ci test
      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-${{ inputs.platform }}-${{ github.run_attempt }}
          path: target/nextest/ci/test.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Check generated configuration schema and reference
        run: cargo ci schema
      - name: Archive lifecycle executables and inputs
        run: cargo ci archive
      - name: Identify lifecycle artifact
        id: identity
        run: echo "artifact=lifecycle-inputs-${TEST_PLATFORM}-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload lifecycle inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.identity.outputs.artifact }}
          path: |
            .build/ci/lifecycle.tar.zst
            .build/ci/lifecycle-inputs.tar
          include-hidden-files: true
          compression-level: 1
          retention-days: 1
          if-no-files-found: error

  bundle:
    name: Build bundle
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.identity.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A separate cache: the bundle's release dependencies and the debug build
      # tool that assembles it, which the test job's cache does not hold together.
      - uses: ./.github/actions/setup-rust
        with:
          platform: ${{ inputs.platform }}
          cache-prefix: native-bundle-v1
      - name: Build and verify bundle
        run: cargo ci bundle
      # Tar preserves the executable permissions that artifact transfer drops.
      - name: Pack bundle
        run: |
          mkdir -p .build/ci
          tar -cf .build/ci/bundle.tar "dist/${TEST_PLATFORM}"
      - name: Identify bundle artifact
        id: identity
        run: echo "artifact=bundle-${TEST_PLATFORM}-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.identity.outputs.artifact }}
          path: .build/ci/bundle.tar
          include-hidden-files: true
          compression-level: 1
          retention-days: 1
          if-no-files-found: error

  lifecycle:
    name: Lifecycle / ${{ matrix.shard }}
    needs: [build, bundle]
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.lifecycle-shards) }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: .build/ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.bundle.outputs.artifact }}
          path: .build/ci
      - name: Extract lifecycle inputs and bundle
        run: |
          tar -xf .build/ci/lifecycle-inputs.tar
          tar -xf .build/ci/bundle.tar
      - name: Execute lifecycle partition without compiling
        env:
          LIFECYCLE_SHARD: ${{ matrix.shard }}
          LIFECYCLE_SHARDS: ${{ strategy.job-total }}
        run: >-
          .build/ci/nemoclaw-build ci lifecycle
          --partition "hash:${LIFECYCLE_SHARD}/${LIFECYCLE_SHARDS}"
          --archive-file .build/ci/lifecycle.tar.zst
      - name: Upload lifecycle timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lifecycle-${{ inputs.platform }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: target/nextest/lifecycle/lifecycle.xml
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  # The live suites reuse this platform's bundle instead of building their own,
  # so they start when it is ready. They are not required checks: a failure
  # shows on its job without failing the platform's Test / PLATFORM check.
  live:
    name: Live / ${{ matrix.suite.name }}
    if: inputs.live
    needs: bundle
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: Docker
            step: live-docker
          - name: Kind
            step: live-kind
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    env:
      LIVE_STEP: ${{ matrix.suite.step }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The second commit is a pull request merge commit's base.
          fetch-depth: 2
      # Restore dependencies first, so deciding compiles the build tool from the cache.
      - uses: ./.github/actions/setup-rust
        with:
          platform: ${{ inputs.platform }}
          save-cache: "false"
      - name: Decide whether this change can affect the live suites
        id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # Pushes and manual runs always run the suite.
          if [ "$EVENT" != pull_request ]; then
            echo live=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(git rev-parse HEAD^1)
          cargo run --locked --quiet -p nemoclaw-build --no-default-features --target-dir target/ci-runner -- \
            changes live --base "$base" >> "$GITHUB_OUTPUT"
      - name: Build test executables
        if: steps.changes.outputs.live == 'true'
        run: cargo ci build
      - name: Download the bundle
        if: steps.changes.outputs.live == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.bundle.outputs.artifact }}
          path: .build/ci
      # Tar preserves the executable permissions that artifact transfer drops.
      - name: Extract the bundle
        if: steps.changes.outputs.live == 'true'
        run: tar -xf .build/ci/bundle.tar
      # The Docker suite loads OCI archives and local images by digest, and the
      # Kubernetes suite reads an agent image's metadata from its OCI index; both
      # need Docker's containerd image store, and hosted runners use the classic one.
      - name: Use the containerd image store
        if: steps.changes.outputs.live == 'true'
        run: |
          config=/etc/docker/daemon.json
          if [ -s "$config" ]; then current=$(sudo cat "$config"); else current='{}'; fi
          printf '%s' "$current" | jq '.features["containerd-snapshotter"] = true' | sudo tee "$config" >/dev/null
          sudo systemctl restart docker
          docker info --format '{{json .DriverStatus}}' | grep -q io.containerd.snapshotter.v1
      - name: Run live tests
        if: steps.changes.outputs.live == 'true'
        run: cargo ci "$LIVE_STEP"
      - name: Upload live test results
        if: always() && steps.changes.outputs.live == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.suite.step }}-${{ inputs.platform }}-${{ github.run_attempt }}
          path: target/nextest/${{ matrix.suite.step }}/${{ matrix.suite.step }}.xml
          if-no-files-found: ignore
          retention-days: 14
