name: Native platform
on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      platform:
        type: string
        required: true
      shard-lifecycle:
        type: boolean
        default: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  TEST_PLATFORM: ${{ inputs.platform }}
  CARGO_INCREMENTAL: "0"
jobs:
  build:
    name: Build and test
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.identity.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          platform: ${{ inputs.platform }}
      - name: Check formatting
        run: cargo ci fmt
      - name: Lint Rust
        run: cargo ci clippy
      - name: Build test executables
        run: cargo ci build
      - name: Run tests
        run: cargo ci test
      - name: Check generated configuration schema and reference
        run: cargo ci schema
      - name: Build and verify bundle
        run: cargo ci bundle
      # Windows has few lifecycle fixtures; transferring an archive costs more
      # than running them here. Unix fixtures run on two independent workers.
      - name: Execute unsharded lifecycle
        if: ${{ !inputs.shard-lifecycle }}
        run: cargo ci lifecycle
      - name: Upload unsharded lifecycle timings
        if: ${{ always() && !inputs.shard-lifecycle }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lifecycle-${{ inputs.platform }}-${{ github.run_attempt }}
          path: target/nextest/lifecycle/lifecycle.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Archive lifecycle executables and inputs
        if: inputs.shard-lifecycle
        run: cargo ci archive
      - name: Identify lifecycle artifact
        if: inputs.shard-lifecycle
        id: identity
        run: echo "artifact=lifecycle-inputs-${TEST_PLATFORM}-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload lifecycle inputs
        if: inputs.shard-lifecycle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.identity.outputs.artifact }}
          path: |
            .build/ci/lifecycle.tar.zst
            .build/ci/lifecycle-inputs.tar
          include-hidden-files: true
          compression-level: 1
          retention-days: 1
          if-no-files-found: error

  lifecycle:
    name: Lifecycle / ${{ matrix.shard }}
    if: inputs.shard-lifecycle
    needs: build
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The producer output also supports rerunning a failed shard without
      # rebuilding: its artifact may come from an earlier run attempt.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: .build/ci
      # Tar preserves the executable permissions that artifact transfer drops.
      - name: Extract lifecycle inputs
        run: tar -xf .build/ci/lifecycle-inputs.tar
      - name: Execute lifecycle partition without compiling
        env:
          LIFECYCLE_SHARD: ${{ matrix.shard }}
        run: >-
          .build/ci/nemoclaw-build ci lifecycle
          --partition "hash:${LIFECYCLE_SHARD}/2"
          --archive-file .build/ci/lifecycle.tar.zst
      - name: Upload lifecycle timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lifecycle-${{ inputs.platform }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: target/nextest/lifecycle/lifecycle.xml
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
