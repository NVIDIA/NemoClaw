name: Native platform
on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      platform:
        type: string
        required: true
      lifecycle-shards:
        description: JSON list of lifecycle shard numbers; its length is the partition count.
        type: string
        default: "[1, 2]"
      live:
        description: Also run the Docker and Kubernetes live suites, which need a Linux runner.
        type: boolean
        default: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  TEST_PLATFORM: ${{ inputs.platform }}
  CARGO_INCREMENTAL: "0"
# Build and test, and Build bundle, run in parallel on separate runners; the
# lifecycle shards start when both have uploaded their artifacts. Artifact names
# carry the run attempt, and consumers read them from the producers' outputs, so
# rerunning a failed shard reuses an earlier attempt's artifacts.
jobs:
  build:
    name: Build and test
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.identity.outputs.artifact }}
      live: ${{ steps.changes.outputs.live }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The second commit is a pull request merge commit's base.
          fetch-depth: 2
      - uses: ./.github/actions/setup-rust
        with:
          platform: ${{ inputs.platform }}
      - name: Check formatting
        run: cargo ci fmt
      - name: Lint Rust
        run: cargo ci clippy
      - name: Build test executables
        run: cargo ci build
      - name: Run tests
        run: cargo ci test
      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-${{ inputs.platform }}-${{ github.run_attempt }}
          path: target/nextest/ci/test.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Check generated configuration schema and reference
        run: cargo ci schema
      - name: Archive lifecycle executables and inputs
        run: cargo ci archive
      # Deciding here lets the live jobs skip without starting a runner.
      - name: Decide whether this change can affect the live suites
        id: changes
        if: inputs.live
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # Pushes and manual runs always run the live suites.
          if [ "$EVENT" != pull_request ]; then
            echo live=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(git rev-parse HEAD^1)
          cargo run --locked --quiet -p nemoclaw-build --no-default-features --target-dir target/ci-runner -- \
            changes live --base "$base" >> "$GITHUB_OUTPUT"
      - name: Identify lifecycle artifact
        id: identity
        run: echo "artifact=lifecycle-inputs-${TEST_PLATFORM}-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload lifecycle inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.identity.outputs.artifact }}
          path: |
            .build/ci/lifecycle.tar.zst
            .build/ci/lifecycle-inputs.tar
          include-hidden-files: true
          compression-level: 1
          retention-days: 1
          if-no-files-found: error

  bundle:
    name: Build bundle
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.identity.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A separate cache: the bundle's release dependencies and the debug build
      # tool that assembles it, which the test job's cache does not hold together.
      - uses: ./.github/actions/setup-rust
        with:
          platform: ${{ inputs.platform }}
          cache-prefix: native-bundle-v1
      - name: Build and verify bundle
        run: cargo ci bundle
      # Tar preserves the executable permissions that artifact transfer drops.
      - name: Pack bundle
        run: |
          mkdir -p .build/ci
          tar -cf .build/ci/bundle.tar "dist/${TEST_PLATFORM}"
      - name: Identify bundle artifact
        id: identity
        run: echo "artifact=bundle-${TEST_PLATFORM}-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.identity.outputs.artifact }}
          path: .build/ci/bundle.tar
          include-hidden-files: true
          compression-level: 1
          retention-days: 1
          if-no-files-found: error

  lifecycle:
    name: Lifecycle / ${{ matrix.shard }}
    needs: [build, bundle]
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.lifecycle-shards) }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: .build/ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.bundle.outputs.artifact }}
          path: .build/ci
      - name: Extract lifecycle inputs and bundle
        run: |
          tar -xf .build/ci/lifecycle-inputs.tar
          tar -xf .build/ci/bundle.tar
      - name: Execute lifecycle partition without compiling
        env:
          LIFECYCLE_SHARD: ${{ matrix.shard }}
          LIFECYCLE_SHARDS: ${{ strategy.job-total }}
        run: >-
          .build/ci/nemoclaw-build ci lifecycle
          --partition "hash:${LIFECYCLE_SHARD}/${LIFECYCLE_SHARDS}"
          --archive-file .build/ci/lifecycle.tar.zst
      - name: Upload lifecycle timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lifecycle-${{ inputs.platform }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: target/nextest/lifecycle/lifecycle.xml
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  # Each partition reports and enforces its own budget; this job reports the
  # platform's whole lifecycle suite in its summary, from the partitions'
  # uploaded timings, including failed partitions'. It never fails the platform.
  lifecycle-timing:
    name: Lifecycle timing
    needs: [build, lifecycle]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.lifecycle.result != 'skipped' }}
    continue-on-error: true
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    steps:
      # The build tool comes from the lifecycle inputs; this job compiles nothing.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: .build/ci
      # Every attempt's timings; the report reads each shard's latest attempt.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lifecycle-${{ inputs.platform }}-*
          path: .build/ci/timings
      - name: Report the whole lifecycle suite
        env:
          SHARDS: ${{ inputs.lifecycle-shards }}
        run: |
          tool=.build/ci/nemoclaw-build
          if [ "$RUNNER_OS" = Windows ]; then tool="$tool.exe"; fi
          tar -xf .build/ci/lifecycle-inputs.tar "$tool"
          "$tool" lifecycle-timing .build/ci/timings --platform "$TEST_PLATFORM" --shards "$SHARDS"

  # Like the lifecycle shards, the live suites run this platform's archived test
  # executables and bundle, compile nothing, and count toward the platform's
  # required Test / PLATFORM check.
  live-docker:
    name: Live / Docker
    needs: [build, bundle]
    if: inputs.live && needs.build.outputs.live == 'true'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/live-suite
        with:
          platform: ${{ inputs.platform }}
          suite: live-docker
          tests: ${{ needs.build.outputs.artifact }}
          bundle: ${{ needs.bundle.outputs.artifact }}

  live-kind:
    name: Live / Kind
    needs: [build, bundle]
    if: inputs.live && needs.build.outputs.live == 'true'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/live-suite
        with:
          platform: ${{ inputs.platform }}
          suite: live-kind
          tests: ${{ needs.build.outputs.artifact }}
          bundle: ${{ needs.bundle.outputs.artifact }}
