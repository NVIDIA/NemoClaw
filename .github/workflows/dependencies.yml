name: CI / Dependencies
on:
  # Stacked v1 PRs target feature branches, so do not filter by base branch.
  pull_request:
  push:
    branches: [v1]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - rust-toolchain.toml
      - deny.toml
      - tools/ci/**
      - .github/workflows/dependencies.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-dependencies-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  policy:
    name: Policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - name: Check licenses and approved dependency sources
        run: cargo deny --locked check licenses sources
      - name: Check current vulnerability advisories
        if: github.event_name == 'workflow_dispatch'
        run: cargo deny --locked check advisories

  scripts:
    name: Python scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # These tests cover Python helper scripts, not the Rust build, so they run
      # once here instead of in the native build jobs that `cargo ci` reproduces.
      - name: Test CI orchestration
        run: python3 -B -m unittest discover -s tools/ci -p 'test_*.py'
