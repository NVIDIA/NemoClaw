# Adapted from main PR #13876, b245d56471d0aa4ce4378eb33f58e63a799df199:
# select V1's metadata workflow; ignore PRs without that workflow.
name: Refresh V1 session report
on:
  issue_comment:
    types: [created, edited, deleted]
permissions: {}
jobs:
  refresh-report:
    # This job runs from the default branch. Never check out or execute candidate code with actions: write.
    if: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request && (contains(github.event.comment.body, 'agent-session-report:opening') || contains(github.event.changes.body.from, 'agent-session-report:opening')) }}
    concurrency:
      group: v1-session-report-comments-${{ github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      pull-requests: read
      actions: write
    steps:
      - name: Refresh only the PR metadata check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            if (context.eventName !== 'issue_comment' || !context.payload.issue?.pull_request) throw new Error('Expected a PR comment event');
            const number = context.payload.issue.number;
            if (!Number.isSafeInteger(number) || number <= 0) throw new Error('Invalid PR number');
            const opening = body => typeof body === 'string' && body.includes('agent-session-report:opening');
            if (!opening(context.payload.comment?.body) && !opening(context.payload.changes?.body?.from)) return;
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: context.payload.issue.number });
            if (pr.state !== 'open') return;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo, workflow_id: 'pr-metadata.yml', event: 'pull_request', head_sha: pr.head.sha, per_page: 100,
            });
            const run = runs.filter(run => run.pull_requests.some(pull => pull.number === pr.number)).sort((a, b) => b.id - a.id)[0];
            if (!run) return; // Other branches may not run V1 metadata; publication guidance covers bootstrap.
            // Wait for an active metadata run so a late comment edit cannot leave its earlier result in place.
            for (let attempt = 0; attempt < 65; attempt++) {
              const { data: current } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: run.id });
              if (current.status === 'completed') {
                const { data: latest } = await github.rest.pulls.get({ ...context.repo, pull_number: pr.number });
                if (latest.state !== 'open' || latest.head.sha !== pr.head.sha) return;
                await github.rest.actions.reRunWorkflow({ ...context.repo, run_id: run.id });
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('Metadata run did not finish; rerun this refresh after it completes');
