# Forwards `/nvskills-ci` PR comments and signature push events to the central
# NVSkills CI service in NVIDIA/nvskills-ci. Mirrors
# templates/team-request-workflow.yml from NVIDIA/nvskills-ci@main.
#
# Onboarding reference: NVIDIA/nvskills-ci/docs/team-onboarding.md
# This file must remain CODEOWNERS-protected (see .github/CODEOWNERS).
#
# Required repository secret: NVSKILLS_CI_DISPATCH_TOKEN

name: Request NVSkills CI

on:
  issue_comment:
    types: [created]
  push:

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_request: ${{ steps.evaluate.outputs.should_request }}
    steps:
      - id: evaluate
        uses: actions/github-script@v7
        env:
          NVSKILLS_SIGNATURE_PUSH_ACTOR: ${{ vars.NVSKILLS_SIGNATURE_PUSH_ACTOR || 'nv-skills-ci[bot]' }}
          NVSKILLS_SIGNATURE_COMMIT_TITLE: ${{ vars.NVSKILLS_SIGNATURE_COMMIT_TITLE || 'Attach NVSkills validation signatures' }}
        with:
          script: |
            const isRequestComment =
              context.eventName === "issue_comment" &&
              Boolean(context.payload.issue?.pull_request) &&
              context.payload.comment?.body?.startsWith("/nvskills-ci");

            let isSignaturePush = false;
            if (context.eventName === "push") {
              const message = context.payload.head_commit?.message ?? "";
              const expectedTitle = process.env.NVSKILLS_SIGNATURE_COMMIT_TITLE;
              const expectedActor = process.env.NVSKILLS_SIGNATURE_PUSH_ACTOR;
              if (message.startsWith(expectedTitle)) {
                if (context.actor === expectedActor) {
                  isSignaturePush = true;
                } else {
                  const { owner, repo } = context.repo;
                  try {
                    const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                      owner,
                      repo,
                      username: context.actor,
                    });
                    isSignaturePush = ["admin", "maintain"].includes(data.permission);
                  } catch (error) {
                    core.info(`Could not read collaborator permission for ${context.actor}: ${error.message}`);
                  }
                }
              }
            }

            core.setOutput("should_request", String(isRequestComment || isSignaturePush));

  request:
    needs: gate
    if: needs.gate.outputs.should_request == 'true'
    permissions:
      contents: read
      pull-requests: read
    uses: NVIDIA/skills/.github/workflows/team-request.yml@d6c3af084edd278e5524c95e6586fc763835eb62
    secrets:
      NVSKILLS_CI_DISPATCH_TOKEN: ${{ secrets.NVSKILLS_CI_DISPATCH_TOKEN }}
