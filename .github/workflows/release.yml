# SPDX-License-Identifier: Apache-2.0
# Security review, scan binding, and controlled draft publication added for #13523.
# Stage a release from a semver tag such as v0.1.0-rc1 on the v1 branch. Promote
# the images CI checked on the tagged history to v1/<image>:<tag>, build the runtime
# images, and create a draft release listing every digest, with the CLI bundles
# CI / Bundle built and checked at the tag. The protected
# publisher stays disabled until v1 signoff; no job changes package visibility.
# Nothing pushes to a package an
# administrator hasn't created as internal: packages a workflow creates inherit
# this public repository's visibility.
name: Release / Stage
on:
  push:
    tags: ["v0.1.*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  CI_PACKAGE: ghcr.io/nvidia/nemoclaw/v1-ci
  RELEASE_NAMESPACE: ghcr.io/nvidia/nemoclaw/v1
jobs:
  select:
    name: Select checked images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      source: ${{ steps.select.outputs.source }}
      rebuild: ${{ steps.select.outputs.rebuild }}
      catalog: ${{ steps.select.outputs.catalog }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # CI pushes each checked v1 commit's images; later commits that can't
      # affect the images reuse them, as the image workflow itself does.
      - name: Find the latest checked commit whose images still apply
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          source=
          for commit in $(git rev-list --first-parent --max-count=200 "$GITHUB_SHA"); do
            # The checked images push the proxy last, so its tags mark a complete push.
            if docker buildx imagetools inspect "$CI_PACKAGE:ollama-proxy-$commit-arm64" > /dev/null 2>&1 &&
              docker buildx imagetools inspect "$CI_PACKAGE:ollama-proxy-$commit-amd64" > /dev/null 2>&1; then
              source=$commit
              break
            fi
          done
          docker logout ghcr.io
          rebuild=true
          if [ -n "$source" ]; then
            decision=$(cargo run --locked --quiet -p nemoclaw-build --no-default-features --target-dir target/ci-runner -- \
              changes images --base "$source")
            [ "$decision" = images=false ] && rebuild=false
          fi
          [ "$rebuild" = true ] && source=$GITHUB_SHA
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "rebuild=$rebuild" >> "$GITHUB_OUTPUT"
          # Evaluate the Bake configuration here, without publication credentials;
          # only the agent names reach the stage job, which validates them.
          catalog=$(docker buildx bake --print agents | jq -ce --arg candidate "$GITHUB_SHA" --arg source "$source" \
            '{candidate_revision:$candidate,source_revision:$source,agents:(.target | keys)}')
          echo "catalog=$catalog" >> "$GITHUB_OUTPUT"
          echo "Agent and proxy images from \`$source\`; rebuilt: $rebuild." >> "$GITHUB_STEP_SUMMARY"
  build:
    needs: select
    if: needs.select.outputs.rebuild == 'true'
    name: Build
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image-build.yml
    with:
      plan: success
      run: true
      push: true
  # Runtime images build reproducibly for each host's platform, so building
  # them at the tag yields the digests any rebuild of these sources would.
  runtimes:
    name: Runtimes / ${{ matrix.platform }}
    needs: select
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_arm64
            runner: ubuntu-24.04-arm
          - platform: linux_amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require internal packages
        uses: ./.github/actions/internal-packages
        with:
          namespace: ghcr.io/nvidia/nemoclaw
          names: v1-ci
          required: "true"
          token: ${{ github.token }}
      - name: Install the pinned SBOM generator
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.57.1
      # The image builds' pinned sources, as CI / Images saved them.
      - name: Restore the verified image sources
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/downloads
          key: image-sources-v1-${{ hashFiles('versions.json') }}
      # Bake reads them from .build/image-sources.
      - name: Fetch the pinned image sources
        run: cargo images fetch
      - name: Build and push the runtime images
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ matrix.platform }}
          PACKAGE: ${{ env.CI_PACKAGE }}
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          printf '%s\n' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          tag="$GITHUB_SHA-${PLATFORM#linux_}"
          # Runtime images are reproducible only when every layer's timestamps
          # are clamped to SOURCE_DATE_EPOCH. The runners' built-in BuildKit
          # can't clamp and push (it ignores rewrite-timestamp in the classic
          # image store, and rejects it with unpack=false in the containerd
          # one), so a pinned BuildKit in a container pushes them instead.
          docker buildx create --name runtimes --driver docker-container \
            --driver-opt image=moby/buildkit@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb
          output='type=image,push=true,rewrite-timestamp=true'
          docker buildx bake --builder runtimes runtimes \
            --set "vllm.tags=$CI_PACKAGE:vllm-$tag" --set "vllm.output=$output" \
            --set "ollama.tags=$CI_PACKAGE:ollama-$tag" --set "ollama.output=$output" \
            --set "llama-cpp.tags=$CI_PACKAGE:llama-cpp-$tag" --set "llama-cpp.output=$output"
          # A runtime image's digest only changes with its inputs, so its SBOM
          # is usually already recorded.
          for name in vllm ollama llama-cpp; do
            sh .github/scripts/image-sbom.sh "$CI_PACKAGE:$name-$tag" "linux/${PLATFORM#linux_}"
          done
          docker logout ghcr.io
  bundles:
    name: Find the CLI bundles CI checked
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.find.outputs.run }}
      source: ${{ steps.find.outputs.source }}
      ids: ${{ steps.find.outputs.ids }}
      darwin_arm64: ${{ steps.find.outputs.darwin_arm64 }}
      windows_amd64: ${{ steps.find.outputs.windows_amd64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find the CLI bundles CI checked at the tag
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/find-cli-bundles.sh
  # Signing runs only for the platforms a repository administrator lists in the
  # RELEASE_SIGNING repository variable, such as `windows_amd64`: a job's if:
  # can't see an environment's variables. A listed platform's signing job must
  # pass for staging to continue, and a final release needs both platforms
  # signed unless RELEASE_UNSIGNED_EXCEPTION names it (record-cli-signing.sh).
  sign-windows:
    name: Sign the Windows CLI
    needs: [bundles, security-controller]
    if: contains(vars.RELEASE_SIGNING, 'windows_amd64')
    runs-on: windows-2025
    timeout-minutes: 30
    # Secure Signing's federated credential trusts this environment, whose
    # deployment rule admits only release tags.
    environment: release-signing
    # The job checks out nothing: no code from the tag runs with signing
    # access, and the bundle is data.
    permissions:
      actions: read
      contents: read
      id-token: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Require the signing configuration
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
        run: |
          $missing = @('AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID',
            'AZURE_ARTIFACT_SIGNING_ENDPOINT', 'AZURE_ARTIFACT_SIGNING_ACCOUNT', 'AZURE_ARTIFACT_SIGNING_PROFILE') |
            Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing) {
            Write-Output "::error::The release-signing environment has no $($missing -join ', ') variable."
            exit 1
          }
      - name: Download the bundle CI checked at the tag
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.bundles.outputs.windows_amd64 }}
          run-id: ${{ needs.bundles.outputs.run }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/ci
      - name: Unpack the bundle
        run: tar -xf "$env:RUNNER_TEMP/ci/bundle.tar" -C "$env:RUNNER_TEMP"
      - name: Sign in to Azure
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Appending keeps HashiCorp's signature as the Helm provider's primary
      # one and nests NVIDIA's; the other executables get NVIDIA's as primary.
      - name: Sign the executables
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ runner.temp }}\dist\windows_amd64
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          append-signature: true
      # /all checks the Helm provider's nested signature too, and /tw fails an
      # untimestamped one, which stops verifying when its certificate expires.
      # The output, which names each signer, is the release's evidence.
      - name: Verify every signature
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          $executables = @(Get-ChildItem "$env:RUNNER_TEMP\dist\windows_amd64" -Recurse -Filter *.exe)
          if ($executables.Count -eq 0) {
            Write-Output '::error::The Windows bundle holds no executables.'
            exit 1
          }
          $log = "$env:RUNNER_TEMP\windows_amd64.verification.txt"
          $failed = $false
          foreach ($file in $executables) {
            & $signtool.FullName verify /pa /all /tw /v $file.FullName | Tee-Object -FilePath $log -Append
            if ($LASTEXITCODE -ne 0) {
              Write-Output "::error::$($file.FullName) has no valid timestamped signature."
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Upload the signed bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-cli-windows_amd64
          path: ${{ runner.temp }}/dist/windows_amd64
          if-no-files-found: error
          retention-days: 7
      - name: Upload the signature checks
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signing-verification-windows_amd64
          path: ${{ runner.temp }}/windows_amd64.verification.txt
          if-no-files-found: error
          retention-days: 7
  # Product Security decides whether Secure Signing signs and notarizes the
  # macOS executables or this job does with NVIDIA's Developer ID (#14621); the
  # signing step lands with that decision. Until then, listing darwin_arm64 in
  # RELEASE_SIGNING stops staging here: only the Helm provider is notarized.
  sign-macos:
    name: Sign the macOS CLI
    needs: [bundles, security-controller]
    if: contains(vars.RELEASE_SIGNING, 'darwin_arm64')
    runs-on: macos-15
    timeout-minutes: 30
    environment: release-signing
    permissions:
      actions: read
      contents: read
    steps:
      # Only the v1 controller's files run with signing access; the tag's
      # bundle is data.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.security-controller.outputs.revision }}
          persist-credentials: false
      - name: Require the signing configuration
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_TEAM_ID" ]; then
            echo '::error::The release-signing environment has no APPLE_TEAM_ID variable.'
            exit 1
          fi
      - name: Download the bundle CI checked at the tag
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.bundles.outputs.darwin_arm64 }}
          run-id: ${{ needs.bundles.outputs.run }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/ci
      - name: Unpack the bundle
        run: tar -xf "$RUNNER_TEMP/ci/bundle.tar" -C "$RUNNER_TEMP"
      - name: Verify every signature
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          bash .github/scripts/verify-macos-signatures.sh "$RUNNER_TEMP/dist/darwin_arm64" "$APPLE_TEAM_ID" 2>&1 |
            tee "$RUNNER_TEMP/darwin_arm64.verification.txt"
      - name: Upload the signed bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-cli-darwin_arm64
          path: ${{ runner.temp }}/dist/darwin_arm64
          if-no-files-found: error
          retention-days: 7
      - name: Upload the signature checks
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signing-verification-darwin_arm64
          path: ${{ runner.temp }}/darwin_arm64.verification.txt
          if-no-files-found: error
          retention-days: 7
  stage:
    name: Stage the release
    outputs:
      inventory_sha256: ${{ steps.draft.outputs.inventory_sha256 }}
      sboms_sha256: ${{ steps.draft.outputs.sboms_sha256 }}
      cli_checksums: ${{ steps.pack.outputs.checksums }}
    needs: [select, build, runtimes, security-controller, bundles, sign-windows, sign-macos]
    if: >-
      !cancelled() && needs.security-controller.result == 'success' &&
      needs.select.result == 'success' && needs.runtimes.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      needs.bundles.result == 'success' &&
      (needs.sign-windows.result == 'success' ||
        (needs.sign-windows.result == 'skipped' && !contains(vars.RELEASE_SIGNING, 'windows_amd64'))) &&
      (needs.sign-macos.result == 'success' ||
        (needs.sign-macos.result == 'skipped' && !contains(vars.RELEASE_SIGNING, 'darwin_arm64')))
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned SBOM generator
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.57.1
      - name: List the release images
        id: images
        env:
          CANDIDATE_CATALOG: ${{ needs.select.outputs.catalog }}
          CANDIDATE_REVISION: ${{ github.sha }}
          SOURCE: ${{ needs.select.outputs.source }}
        run: |
          printf '%s\n' "$CANDIDATE_CATALOG" > "$RUNNER_TEMP/candidate-catalog.json"
          cargo run --locked -q -p nemoclaw-build --no-default-features -- release-catalog \
            --catalog "$RUNNER_TEMP/candidate-catalog.json" --candidate-revision "$CANDIDATE_REVISION" --source-revision "$SOURCE" \
            > "$RUNNER_TEMP/validated-catalog.json"
          agents=$(jq -er '.agents | join(" ")' "$RUNNER_TEMP/validated-catalog.json")
          names=$(jq -er '.images | join(" ")' "$RUNNER_TEMP/validated-catalog.json")
          echo "agents=$agents" >> "$GITHUB_OUTPUT"
          echo "names=$names" >> "$GITHUB_OUTPUT"
      - name: Require internal packages
        uses: ./.github/actions/internal-packages
        with:
          namespace: ${{ env.RELEASE_NAMESPACE }}
          names: ${{ steps.images.outputs.names }}
          required: "true"
          token: ${{ github.token }}
      # The CLI bundles CI / Bundle built and checked at the tag, as it uploaded
      # them, each in a directory named after its artifact.
      - name: Download the CLI bundles CI checked at the tag
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.bundles.outputs.ids }}
          run-id: ${{ needs.bundles.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ci-bundles
      - name: Download the signed Windows bundle
        if: needs.sign-windows.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-cli-windows_amd64
          path: ${{ runner.temp }}/signed/windows_amd64
      - name: Download the signed macOS bundle
        if: needs.sign-macos.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-cli-darwin_arm64
          path: ${{ runner.temp }}/signed/darwin_arm64
      - name: Download the signature checks
        if: needs.sign-windows.result == 'success' || needs.sign-macos.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: signing-verification-*
          merge-multiple: true
          path: ${{ runner.temp }}/signed
      # Resealing hashes the bundle with the SDK, which needs the pinned protoc.
      - name: Install the pinned build tools
        run: cargo ci tools
      # A final release fails here, before it pushes anything, unless its macOS
      # and Windows executables are signed or RELEASE_UNSIGNED_EXCEPTION names it.
      - name: Pack the CLI archives and record their signing
        id: pack
        env:
          RELEASE_UNSIGNED_EXCEPTION: ${{ vars.RELEASE_UNSIGNED_EXCEPTION }}
        run: |
          cargo build --locked -q -p nemoclaw-build
          mkdir -p "$RUNNER_TEMP/signed"
          cli="$RUNNER_TEMP/cli-bundles"
          PATH="$PWD/target/debug:$PATH" bash .github/scripts/pack-cli-bundles.sh \
            "$RUNNER_TEMP/ci-bundles" "$RUNNER_TEMP/signed" "$cli"
          bash .github/scripts/record-cli-signing.sh "$RUNNER_TEMP/signed" "$cli" "$RUNNER_TEMP/cli-signing.md"
          # A final release attests these digests.
          {
            echo 'checksums<<CHECKSUMS'
            cat "$cli/SHA256SUMS"
            (cd "$cli" && sha256sum SHA256SUMS)
            echo CHECKSUMS
          } >> "$GITHUB_OUTPUT"
      - name: Join each image's platforms and draft the release
        id: draft
        env:
          NAMES: ${{ steps.images.outputs.names }}
          AGENTS: ${{ steps.images.outputs.agents }}
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ needs.select.outputs.source }}
          CLI_SOURCE: ${{ needs.bundles.outputs.source }}
          TAG: ${{ github.ref_name }}
          PACKAGE: ${{ env.CI_PACKAGE }}
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          printf '%s\n' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          notes="$RUNNER_TEMP/notes.md"
          bundles="$RUNNER_TEMP/bundles"
          mkdir "$bundles"
          inventory="$RUNNER_TEMP/inventory.json"
          echo '[]' > "$inventory"
          cli="$RUNNER_TEMP/cli-bundles"
          {
            echo "Staged from \`$GITHUB_SHA\`. The agent and proxy images are the ones CI checked at \`$SOURCE\`."
            echo
            echo '## CLI'
            echo
            echo "Each archive holds one platform's \`nemoclaw\` CLI with OpenTofu and the providers, as [CI / Bundle]($CLI_SOURCE) built and checked them at \`$GITHUB_SHA\`. \`SHA256SUMS\` lists their SHA-256 checksums."
            echo
            echo '| Archive | SHA-256 |'
            echo '|---|---|'
            while read -r sum archive; do
              echo "| \`$archive\` | \`$sum\` |"
            done < "$cli/SHA256SUMS"
            echo
            cat "$RUNNER_TEMP/cli-signing.md"
            echo
            echo '## Images'
            echo
            echo "A Kubernetes sandbox names its agent image's metadata bundle in \`image.metadata\`; each one is attached to this release."
            echo
            echo "| Image | Reference | Kubernetes metadata |"
            echo "|---|---|---|"
          } > "$notes"
          for image in $NAMES; do
            case "$image" in
              vllm|ollama|llama-cpp) from=$GITHUB_SHA ;;
              *) from=$SOURCE ;;
            esac
            target="$RELEASE_NAMESPACE/$image:$TAG"
            docker buildx imagetools create --tag "$target" \
              "$CI_PACKAGE:$image-$from-arm64" "$CI_PACKAGE:$image-$from-amd64"
            digest=$(docker buildx imagetools inspect "$target" --format '{{.Manifest.Digest}}')
            docker buildx imagetools inspect "$RELEASE_NAMESPACE/$image@$digest" --raw > "$RUNNER_TEMP/index.json"
            jq --arg name "$image" --arg repository "$RELEASE_NAMESPACE/$image" --arg index_digest "$digest" \
              --slurpfile manifests "$RUNNER_TEMP/index.json" \
              '. + [{name: $name, repository: $repository, index_digest: $index_digest, manifests: $manifests[0]}]' \
              "$inventory" > "$inventory.next"
            mv "$inventory.next" "$inventory"
            metadata=-
            # Each agent image's bundle covers both platforms of its index.
            case " $AGENTS " in *" $image "*) agent=true ;; *) agent=false ;; esac
            if [ "$agent" = true ]; then
              NEMOCLAW_REGISTRY_USERNAME="$GITHUB_ACTOR" NEMOCLAW_REGISTRY_PASSWORD="$GH_TOKEN" \
                cargo run --locked -q -p nemoclaw-build --no-default-features -- \
                images export-metadata --registry "$RELEASE_NAMESPACE/$image@$digest" \
                --output "$bundles/$image.metadata.json"
              metadata="\`$image.metadata.json\`"
            fi
            echo "| \`$image\` | \`$RELEASE_NAMESPACE/$image@$digest\` | $metadata |" >> "$notes"
          done
          # Each platform's SPDX document was recorded where the image was built,
          # under its digest. Syft scans only an image whose record doesn't name it.
          sboms="$RUNNER_TEMP/sboms"
          mkdir "$sboms"
          echo '[]' > "$sboms/sboms.json"
          jq -r '.[] | .repository as $repository | .name as $name | .manifests.manifests[]
            | select(.platform.os == "linux")
            | [$name, $repository, .digest, .platform.architecture] | @tsv' "$inventory" > "$RUNNER_TEMP/platforms.tsv"
          while IFS="$(printf '\t')" read -r name repository digest arch; do
            asset="$name-linux-$arch-${digest#sha256:}.spdx.json"
            sh .github/scripts/image-sbom.sh "$repository@$digest" "linux/$arch" "$sboms/$asset"
            jq --arg platform "linux/$arch" --arg reference "$repository@$digest" --arg asset "$asset" \
              --arg sha256 "$(sha256sum "$sboms/$asset" | cut -d' ' -f1)" \
              '. + [{platform: $platform, reference: $reference, asset: $asset, sha256: $sha256}]' \
              "$sboms/sboms.json" > "$sboms/sboms.next"
            mv "$sboms/sboms.next" "$sboms/sboms.json"
          done < "$RUNNER_TEMP/platforms.tsv"
          {
            echo
            echo '## Software bills of materials'
            echo
            cat <<'NOTES'
          Each platform has an SPDX JSON asset, and `sboms.json` records each asset's image reference, platform and SHA-256. These stay private draft assets: release candidates publish nothing about their images, and only final releases attest them (#13521).
          NOTES
            echo
            echo '| Platform | Image reference | SPDX asset |'
            echo '|---|---|---|'
            jq -r '.[] | "| `\(.platform)` | `\(.reference)` | `\(.asset)` |"' "$sboms/sboms.json"
          } >> "$notes"
          docker logout ghcr.io
          # Inventories and package details stay in the private draft, never the public run summary.
          prerelease=
          case "$TAG" in *-*) prerelease=--prerelease ;; esac
          if draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2> /dev/null); then
            if [ "$draft" != true ]; then
              echo "::error::$TAG is already published; stage a new tag instead"
              exit 1
            fi
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft $prerelease --verify-tag \
              --title "NemoClaw $TAG" --notes-file "$notes"
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$bundles"/*.metadata.json
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$cli"/nemoclaw-* "$cli/SHA256SUMS" "$cli/release-evidence.json"
          cp "$inventory" "$sboms/inventory.json"
          echo "inventory_sha256=$(sha256sum "$inventory" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "sboms_sha256=$(sha256sum "$sboms/sboms.json" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$sboms"/*.spdx.json "$sboms/sboms.json" "$sboms/inventory.json"
  security-controller:
    name: Freeze the trusted security controller
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      revision: ${{ steps.controller.outputs.revision }}
      policy_sha256: ${{ steps.controller.outputs.policy_sha256 }}
    steps:
      # Candidate files are data; only the v1 controller runs with reporting
      # and publishing access.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v1
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the controller and policy to this review
        id: controller
        env:
          CANDIDATE_REVISION: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v0\.1\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          test "$(git rev-parse "$TAG^{commit}")" = "$CANDIDATE_REVISION"
          git merge-base --is-ancestor "$CANDIDATE_REVISION" HEAD
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          policy=.github/security/v1-vulnerability-exceptions.json
          echo "policy_sha256=$(sha256sum "$policy" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
  candidate-security:
    name: Assess the release candidate privately
    needs: [stage, security-controller]
    # Report-only, so blocking findings surface before the final tag. The
    # findings stay in the private draft, and a blocked result doesn't fail the run.
    # Without !cancelled(), a skipped Build would skip this job too.
    if: >-
      !cancelled() && contains(github.ref_name, '-') &&
      needs.stage.result == 'success' && needs.security-controller.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.security-controller.outputs.revision }}
          persist-credentials: false
      - name: Assess the staged release
        id: gate
        uses: ./.github/actions/release-assessment
        with:
          tag: ${{ github.ref_name }}
          inventory-sha256: ${{ needs.stage.outputs.inventory_sha256 }}
          sboms-sha256: ${{ needs.stage.outputs.sboms_sha256 }}
          policy-sha256: ${{ needs.security-controller.outputs.policy_sha256 }}
          controller-revision: ${{ needs.security-controller.outputs.revision }}
          token: ${{ github.token }}
      - name: Attach the assessment to the draft
        if: steps.gate.outputs.report == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$RUNNER_TEMP/security-report"/*
      - name: Report the result without disclosing findings
        env:
          RESULT: ${{ steps.gate.outputs.result }}
        run: |
          case "$RESULT" in
            0) echo 'The release candidate passes the release security policy.' >> "$GITHUB_STEP_SUMMARY" ;;
            2) echo "::warning::The release security policy would block publishing; the draft holds the assessment." ;;
            *) echo "::error::The security assessment is incomplete; the draft holds what it recorded."; exit 1 ;;
          esac
  assess:
    name: Assess the release
    needs: [stage, security-controller]
    # Anyone who may push a final tag may release: the release publishes once
    # a release candidate staged its images, they pass the release policy, and
    # their provenance is attested.
    # Without !cancelled(), a skipped Build would skip this job too.
    if: >-
      !cancelled() && !contains(github.ref_name, '-') &&
      needs.stage.result == 'success' && needs.security-controller.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: read
      security-events: write
    outputs:
      images: ${{ steps.recheck.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.security-controller.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck the tag and draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          CANDIDATE_REVISION: ${{ github.sha }}
        run: |
          test "$(git rev-parse "$TAG^{commit}")" = "$CANDIDATE_REVISION"
          git merge-base --is-ancestor "$CANDIDATE_REVISION" HEAD
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
      - name: Require a tested release candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          INVENTORY_SHA256: ${{ needs.stage.outputs.inventory_sha256 }}
        run: |
          # Ship only images a release candidate of this version staged, so the
          # release is what was tested. Compare platform manifests by image.
          dir="$RUNNER_TEMP/candidates"
          mkdir -p "$dir"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern inventory.json --output "$dir/final.json"
          test "$(sha256sum "$dir/final.json" | cut -d ' ' -f1)" = "$INVENTORY_SHA256"
          images() { jq -S '[.[] | {name, platforms: ([.manifests.manifests[].digest] | sort)}] | sort_by(.name)' "$1"; }
          images "$dir/final.json" > "$dir/final.images"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName' > "$dir/tags"
          while read -r candidate; do
            case "$candidate" in "$TAG"-*) ;; *) continue ;; esac
            gh release download "$candidate" --repo "$GITHUB_REPOSITORY" --pattern inventory.json \
              --output "$dir/candidate.json" --clobber || continue
            if images "$dir/candidate.json" | cmp -s - "$dir/final.images"; then
              echo "Release candidate $candidate staged these images." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done < "$dir/tags"
          echo "::error::No release candidate of $TAG staged these images. Tag one from this commit and test it first."
          exit 1
      - name: Assess the staged release
        id: gate
        uses: ./.github/actions/release-assessment
        with:
          tag: ${{ github.ref_name }}
          inventory-sha256: ${{ needs.stage.outputs.inventory_sha256 }}
          sboms-sha256: ${{ needs.stage.outputs.sboms_sha256 }}
          policy-sha256: ${{ needs.security-controller.outputs.policy_sha256 }}
          controller-revision: ${{ needs.security-controller.outputs.revision }}
          token: ${{ github.token }}
      - name: Report findings to code scanning
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_REVISION: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          # GitHub may retain only the first 5,000 results in a run.
          # Refuse truncation while retaining the complete report.
          jq -e 'all(.runs[]; (.results | length) <= 5000)' "$RUNNER_TEMP/security-report/assessment.sarif" > /dev/null
          gzip -nc "$RUNNER_TEMP/security-report/assessment.sarif" | base64 | tr -d '\n' > "$RUNNER_TEMP/encoded-sarif"
          jq -n --arg commit "$CANDIDATE_REVISION" --arg ref "refs/tags/$TAG" --rawfile sarif "$RUNNER_TEMP/encoded-sarif" \
            '{commit_sha:$commit,ref:$ref,sarif:$sarif}' > "$RUNNER_TEMP/sarif-upload.json"
          upload=$(gh api --method POST "repos/$GITHUB_REPOSITORY/code-scanning/sarifs" --input "$RUNNER_TEMP/sarif-upload.json" --jq .id)
          for attempt in $(seq 1 30); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/code-scanning/sarifs/$upload" --jq .processing_status)
            case "$state" in complete) exit 0 ;; failed) exit 1 ;; pending) sleep 2 ;; *) exit 1 ;; esac
          done
          echo '::error::Code scanning did not confirm the SARIF upload'
          exit 1
      - name: Retain the assessment evidence
        if: always() && steps.gate.outputs.report == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-security
          path: ${{ runner.temp }}/security-report
          if-no-files-found: error
          retention-days: 7
      - name: Require a passing release policy
        env:
          RESULT: ${{ steps.gate.outputs.result }}
        run: test "$RESULT" = 0
      - name: Recheck the registry digests
        id: recheck
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          inputs="$RUNNER_TEMP/security-inputs"
          printf '%s\n' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          echo '[]' > "$RUNNER_TEMP/observed-inventory.json"
          while IFS=$'\t' read -r name repository digest; do
            actual=$(docker buildx imagetools inspect "$repository:$TAG" --format '{{.Manifest.Digest}}')
            test "$actual" = "$digest"
            docker buildx imagetools inspect "$repository@$digest" --raw > "$RUNNER_TEMP/observed-index.json"
            jq --arg name "$name" --arg repository "$repository" --arg digest "$actual" --slurpfile manifests "$RUNNER_TEMP/observed-index.json" \
              '. + [{name:$name,repository:$repository,index_digest:$digest,manifests:$manifests[0]}]' \
              "$RUNNER_TEMP/observed-inventory.json" > "$RUNNER_TEMP/observed-inventory.next"
            mv "$RUNNER_TEMP/observed-inventory.next" "$RUNNER_TEMP/observed-inventory.json"
          done < <(jq -r '.[] | [.name,.repository,.index_digest] | @tsv' "$inputs/inventory.json")
          docker logout ghcr.io
          cargo run --locked -q -p nemoclaw-build --no-default-features -- release-verify-promotion \
            --expected "$inputs/inventory.json" --actual "$RUNNER_TEMP/observed-inventory.json"
          echo "images=$(jq -c '[.[] | {name, repository, digest: .index_digest}]' "$RUNNER_TEMP/observed-inventory.json")" >> "$GITHUB_OUTPUT"
      - name: Attach the assessment evidence to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$RUNNER_TEMP/security-report/gate.json" \
            "$RUNNER_TEMP/security-report/assessment.json" "$RUNNER_TEMP/security-report/assessment.sarif"
  # Only final releases are attested: Sigstore's log is public, and release
  # candidates and internal packages stay private (#13521).
  attest:
    name: Attest
    needs: [stage, assess]
    if: >-
      !cancelled() && needs.assess.result == 'success'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-attest.yml
    with:
      images: ${{ needs.assess.outputs.images }}
      checksums: ${{ needs.stage.outputs.cli_checksums }}
  release:
    name: Publish the release
    needs: [assess, attest]
    if: >-
      !cancelled() && needs.assess.result == 'success' && needs.attest.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      attestations: read
      contents: write
    steps:
      # The draft's archives and SHA256SUMS must be the attested ones; the
      # checks' output joins the release's evidence.
      - name: Verify the CLI archives' attestations
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          cli="$RUNNER_TEMP/cli"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$cli" \
            --pattern 'nemoclaw-*' --pattern SHA256SUMS --pattern release-evidence.json
          cd "$cli"
          sha256sum --check --strict SHA256SUMS
          for file in nemoclaw-*.tar.gz SHA256SUMS; do
            if ! gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" --format json > "$RUNNER_TEMP/attestation.json"; then
              echo "::error::$file has no valid build provenance attestation from this repository."
              exit 1
            fi
            echo "$file: attestation verified"
            jq --arg command "gh attestation verify $file --repo $GITHUB_REPOSITORY --format json" --slurpfile output "$RUNNER_TEMP/attestation.json" \
              '.verification += [{command: $command, output: $output[0]}]' release-evidence.json > evidence.next
            mv evidence.next release-evidence.json
          done
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber release-evidence.json
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
