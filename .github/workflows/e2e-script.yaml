name: E2E / Script Runner

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref or SHA to test.
        required: true
        type: string
      script:
        description: Repository-relative E2E script path.
        required: true
        type: string
      runner:
        description: GitHub Actions runner label.
        required: false
        type: string
        default: ubuntu-latest
      timeout_minutes:
        description: Job timeout in minutes.
        required: false
        type: number
        default: 45
      artifact_name:
        description: Failure artifact name.
        required: true
        type: string
      artifact_path:
        description: Newline-capable failure artifact path glob list.
        required: true
        type: string
      env_json:
        description: JSON object of non-secret environment variables for the script.
        required: false
        type: string
        default: "{}"
      nvidia_api_key:
        description: Pass the NVIDIA_API_KEY secret to the script.
        required: false
        type: boolean
        default: false
      brave_api_key:
        description: Pass the BRAVE_API_KEY secret to the script.
        required: false
        type: boolean
        default: false
      github_token:
        description: Pass github.token to the script as GITHUB_TOKEN.
        required: false
        type: boolean
        default: false
    secrets:
      NVIDIA_API_KEY:
        required: false
      BRAVE_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - name: Checkout target ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          path: repo

      - name: Checkout workflow action
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref }}
          sparse-checkout: .github/actions/run-e2e-script
          path: workflow-actions

      - name: Export script environment
        env:
          E2E_ENV_JSON: ${{ inputs.env_json }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import secrets

          values = json.loads(os.environ.get("E2E_ENV_JSON") or "{}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
            for name, value in values.items():
              rendered = str(value)
              if "\n" in rendered:
                delimiter = f"EOF_{name}_{secrets.token_hex(8)}"
                out.write(f"{name}<<{delimiter}\n{rendered}\n{delimiter}\n")
              else:
                out.write(f"{name}={rendered}\n")
          PY

      - name: Run E2E script
        uses: ./workflow-actions/.github/actions/run-e2e-script
        with:
          working-directory: repo
          script: ${{ inputs.script }}
          artifact-name: ${{ inputs.artifact_name }}
          artifact-path: ${{ inputs.artifact_path }}
        env:
          BRAVE_API_KEY: ${{ inputs.brave_api_key && secrets.BRAVE_API_KEY || '' }}
          GITHUB_TOKEN: ${{ inputs.github_token && github.token || '' }}
          NVIDIA_API_KEY: ${{ inputs.nvidia_api_key && secrets.NVIDIA_API_KEY || '' }}
