# A platform's unit layer: Build and test runs the unit tests and archives the
# contract, integration, and live test executables; Build bundle builds the
# bundle they run against, in parallel on a separate runner. Artifact names
# carry the run attempt, and consumers read them from this workflow's outputs,
# so rerunning a failed later job reuses an earlier attempt's artifacts.
name: Unit layer
on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      platform:
        type: string
        required: true
      bundle:
        description: Build the bundle, for the bundle's consumers or because its inputs changed.
        type: boolean
        default: true
      archive:
        description: Archive the contract, integration, and Linux live test executables and their inputs.
        type: boolean
        default: true
    outputs:
      tests:
        description: The test archive artifact's name.
        value: ${{ jobs.build.outputs.artifact }}
      bundle:
        description: The bundle artifact's name.
        value: ${{ jobs.bundle.outputs.artifact }}
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  TEST_PLATFORM: ${{ inputs.platform }}
  CARGO_INCREMENTAL: "0"
jobs:
  build:
    name: Build and test
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.identity.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          platform: ${{ inputs.platform }}
      - name: Check formatting
        run: cargo ci fmt
      - name: Lint Rust
        run: cargo ci clippy
      - name: Clear cached build timings
        id: timings
        run: rm -rf target/cargo-timings
      - name: Build test executables
        run: cargo ci build
      - name: Upload workspace build timings
        if: always() && steps.timings.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-workspace-${{ inputs.platform }}-${{ github.run_attempt }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 14
      - name: Run tests
        run: cargo ci test
      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-${{ inputs.platform }}-${{ github.run_attempt }}
          path: target/nextest/ci/test.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Check generated configuration schema and reference
        run: cargo ci schema
      - name: Archive lifecycle executables and inputs
        if: inputs.archive
        run: cargo ci archive
      - name: Identify lifecycle artifact
        if: inputs.archive
        id: identity
        run: echo "artifact=lifecycle-inputs-${TEST_PLATFORM}-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload lifecycle inputs
        if: inputs.archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.identity.outputs.artifact }}
          path: |
            .build/ci/lifecycle.tar.zst
            .build/ci/lifecycle-inputs.tar
          include-hidden-files: true
          compression-level: 1
          retention-days: 1
          if-no-files-found: error

  bundle:
    name: Build bundle
    if: inputs.bundle
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.identity.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A separate cache: the bundle's release dependencies and the debug build
      # tool that assembles it, which the test job's cache does not hold together.
      - uses: ./.github/actions/setup-rust
        with:
          platform: ${{ inputs.platform }}
          cache-prefix: native-bundle-v3
      - name: Clear cached build timings
        id: timings
        run: rm -rf target/cargo-timings
      - name: Build and verify bundle
        run: cargo ci bundle
      - name: Upload release bundle build timings
        if: always() && steps.timings.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-bundle-${{ inputs.platform }}-${{ github.run_attempt }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 14
      # Tar preserves the executable permissions that artifact transfer drops.
      - name: Pack bundle
        run: |
          mkdir -p .build/ci
          tar -cf .build/ci/bundle.tar "dist/${TEST_PLATFORM}"
      - name: Identify bundle artifact
        id: identity
        run: echo "artifact=bundle-${TEST_PLATFORM}-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.identity.outputs.artifact }}
          path: .build/ci/bundle.tar
          include-hidden-files: true
          compression-level: 1
          retention-days: 1
          if-no-files-found: error
