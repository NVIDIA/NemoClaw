name: E2E / Exact Base Managed Runtime

run-name: >-
  Exact base managed runtime PR #${{ github.event.pull_request.number || inputs.pr_number }}
  candidate ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
    paths:
      - ".github/actions/ci-reviewed-npm-audit/**"
      - ".github/actions/publish-managed-image-digest/**"
      - ".github/workflows/managed-images.yaml"
      - ".github/workflows/managed-runtime-base-qualification.yaml"
      - ".dockerignore"
      - "Dockerfile"
      - "agents/**"
      - "ci/npm-audit-exceptions.json"
      - "ci/pi-agent-qualification-v1-*.json"
      - "ci/reviewed-npm-audit.json"
      - "nemoclaw/**"
      - "nemoclaw-blueprint/**"
      - "scripts/**"
      - "src/lib/actions/sandbox/openshell-child-visible-credentials.v*.json"
      - "src/lib/actions/sandbox/mcp-bridge-*.ts"
      - "src/lib/actions/sandbox/rebuild-post-restore-phase.ts"
      - "src/lib/agent/candidate-authority.ts"
      - "src/lib/core/json-types.ts"
      - "src/lib/core/ports.ts"
      - "src/lib/messaging/**"
      - "src/lib/onboard/**"
      - "src/lib/security/credential-hash.ts"
      - "src/lib/state/paths.ts"
      - "src/lib/state/state-root.ts"
      - "test/e2e/live/mcp-bridge*.ts"
      - "test/e2e/live/managed-image-activation-e2e*.ts"
      - "tools/e2e/managed-runtime-comparison.mts"
      - "tools/e2e/pr-managed-image-publication.mts"
      - "src/lib/tool-disclosure.ts"
      - "tools/mcp-tool-discovery-runtime/**"
      - "tsconfig.runtime-preloads.json"
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open same-repository pull request number
        required: true
        type: string
      candidate_sha:
        description: Candidate commit to execute with the trusted controller
        required: true
        type: string
      base_sha:
        description: Exact comparison base and trusted workflow revision
        required: true
        type: string
      candidate_run_id:
        description: Optional exact managed-image producer run ID
        required: false
        type: string
      candidate_run_attempt:
        description: Optional exact managed-image producer run attempt
        required: false
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: >-
    managed-runtime-base-${{ github.event.pull_request.number || inputs.pr_number }}-
    ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}-
    ${{ github.event.pull_request.base.sha || inputs.base_sha }}
  cancel-in-progress: false

jobs:
  authenticate-candidate:
    name: Authenticate candidate image catalog
    if: >-
      github.repository == 'NVIDIA/NemoClaw' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' &&
      (github.event.action != 'edited' || github.event.changes.base != null)))
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    outputs:
      base_sha: ${{ steps.select.outputs.base_sha }}
      candidate_sha: ${{ steps.select.outputs.candidate_sha }}
    steps:
      - name: Check out exact base-controlled qualification controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1

      - id: select
        name: Bind the current PR and exact candidate image catalog
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          CANDIDATE_REPOSITORY: NVIDIA/NemoClaw
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_MANAGED_IMAGE_POLL_SECONDS: "30"
          PR_MANAGED_IMAGE_REQUIRE_CANDIDATE_CATALOG: "1"
          PR_MANAGED_IMAGE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          PR_MANAGED_IMAGE_RUN_ID: ${{ inputs.candidate_run_id }}
          PR_MANAGED_IMAGE_WAIT_SECONDS: "5400"
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WORKFLOW_SHA" == "$BASE_SHA" ]]
          if { [ -n "$PR_MANAGED_IMAGE_RUN_ID" ] && [ -z "$PR_MANAGED_IMAGE_RUN_ATTEMPT" ]; } ||
             { [ -z "$PR_MANAGED_IMAGE_RUN_ID" ] && [ -n "$PR_MANAGED_IMAGE_RUN_ATTEMPT" ]; }; then
            echo "ERROR: candidate run ID and attempt must be supplied together." >&2
            exit 1
          fi
          node --experimental-strip-types --no-warnings \
            tools/e2e/pr-managed-image-publication.mts \
            "${RUNNER_TEMP}/managed-runtime-candidate/catalog.json"
          printf 'base_sha=%s\ncandidate_sha=%s\n' "$BASE_SHA" "$CANDIDATE_SHA" \
            >> "$GITHUB_OUTPUT"

      - name: Preserve authenticated candidate image catalog
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-runtime-candidate-catalog-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/managed-runtime-candidate/catalog.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  candidate-activation:
    name: Candidate all-agent managed runtime activation
    needs: authenticate-candidate
    if: needs.authenticate-candidate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      packages: read
    env:
      BASE_SHA: ${{ needs.authenticate-candidate.outputs.base_sha }}
      CANDIDATE_SHA: ${{ needs.authenticate-candidate.outputs.candidate_sha }}
      E2E_ARTIFACT_DIR: ${{ github.workspace }}/e2e-artifacts/candidate/managed-runtime-activation
      E2E_JOB: "1"
      E2E_TARGET_ID: managed-image-activation
      NEMOCLAW_CLI_BIN: ${{ github.workspace }}/candidate/bin/nemoclaw.js
      NEMOCLAW_E2E_EXPECTED_SHA: ${{ needs.authenticate-candidate.outputs.candidate_sha }}
      NEMOCLAW_E2E_SHARD: default
      NEMOCLAW_MANAGED_ACTIVATION_CATALOG: ${{ github.workspace }}/managed-runtime-candidate/catalog.json
      NEMOCLAW_NON_INTERACTIVE: "1"
      NEMOCLAW_RUN_LIVE_E2E: "1"
      OPENSHELL_GATEWAY: nemoclaw
    steps:
      - name: Check out exact base-controlled scenario controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exact candidate without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authenticate-candidate.outputs.candidate_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1

      - name: Download authenticated candidate image catalog
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: managed-runtime-candidate-catalog-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/managed-runtime-candidate

      - name: Download reviewed OpenShell SDK without candidate code
        env:
          NEMOCLAW_OPEN_SHELL_SDK_OUTPUT_DIRECTORY: ${{ runner.temp }}/openshell-sdk
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: >-
          node --experimental-strip-types --no-warnings
          scripts/checks/package-openshell-sdk-for-pr.mts

      - name: Install trusted scenario and candidate dependencies without credentials
        shell: bash
        run: |
          set -euo pipefail
          env -u GITHUB_TOKEN -u NODE_AUTH_TOKEN \
            GITHUB_EVENT_NAME=pull_request \
            bash .github/actions/ci-install-dependencies.sh
          (
            cd candidate
            env -u GITHUB_TOKEN -u NODE_AUTH_TOKEN \
              GITHUB_EVENT_NAME=pull_request \
              bash ../.github/actions/ci-install-dependencies.sh
          )

      - name: Build the exact candidate CLI
        working-directory: candidate
        run: npm run build:cli

      - name: Install OpenShell from the exact base
        run: env -u GITHUB_TOKEN -u NODE_AUTH_TOKEN bash scripts/install-openshell.sh

      - id: runtime
        name: Record candidate OpenShell runtime identity
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/.npm-global/bin:$PATH"
          export OPENSHELL_BIN="$(command -v openshell)"
          version="$("$OPENSHELL_BIN" --version)"
          [[ "$version" != *$'\n'* && "$version" != *$'\r'* && -n "$version" ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - id: activation
        name: Run the base-controlled scenario with the exact candidate CLI
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$BASE_SHA"
          test "$(git -C candidate rev-parse --verify HEAD)" = "$CANDIDATE_SHA"
          export PATH="$HOME/.local/bin:$HOME/.npm-global/bin:$PATH"
          export OPENSHELL_BIN="$(command -v openshell)"
          npx --no-install tsx tools/e2e/live-vitest-invocation.mts run \
            --test-path test/e2e/live/managed-image-activation-e2e.test.ts

      - name: Record the candidate activation receipt from trusted code
        if: always()
        env:
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          MANAGED_IMAGE_REVISION: ${{ needs.authenticate-candidate.outputs.candidate_sha }}
          MANAGED_RUNTIME_CATALOG: ${{ env.NEMOCLAW_MANAGED_ACTIVATION_CATALOG }}
          MANAGED_RUNTIME_EVIDENCE_DIRECTORY: ${{ env.E2E_ARTIFACT_DIR }}
          MANAGED_RUNTIME_JOB: Candidate all-agent managed runtime activation
          MANAGED_RUNTIME_OUTCOME: ${{ steps.activation.outcome }}
          MANAGED_RUNTIME_ROLE: candidate
          MANAGED_RUNTIME_SOURCE_SHA: ${{ needs.authenticate-candidate.outputs.candidate_sha }}
          MANAGED_RUNTIME_WORKFLOW_PATH: .github/workflows/managed-runtime-base-qualification.yaml
          OPENSHELL_VERSION: ${{ steps.runtime.outputs.version }}
        run: >-
          node --experimental-strip-types --no-warnings
          tools/e2e/managed-runtime-comparison.mts record
          "${RUNNER_TEMP}/managed-runtime-candidate-receipt/receipt.json"

      - name: Upload trusted candidate activation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-runtime-candidate-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.E2E_ARTIFACT_DIR }}/
          if-no-files-found: error
          retention-days: 14

      - name: Upload trusted candidate activation receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-runtime-candidate-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/managed-runtime-candidate-receipt/receipt.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  exact-base-activation:
    name: Exact base all-agent managed runtime activation
    needs: authenticate-candidate
    if: needs.authenticate-candidate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      packages: read
    env:
      BASE_SHA: ${{ needs.authenticate-candidate.outputs.base_sha }}
      CANDIDATE_SHA: ${{ needs.authenticate-candidate.outputs.candidate_sha }}
      E2E_ARTIFACT_DIR: ${{ github.workspace }}/base/e2e-artifacts/base/managed-runtime-activation
      E2E_JOB: "1"
      E2E_TARGET_ID: managed-image-activation
      NEMOCLAW_CLI_BIN: ${{ github.workspace }}/base/bin/nemoclaw.js
      NEMOCLAW_E2E_EXPECTED_SHA: ${{ needs.authenticate-candidate.outputs.base_sha }}
      NEMOCLAW_E2E_SHARD: default
      NEMOCLAW_MANAGED_ACTIVATION_CATALOG: ${{ github.workspace }}/managed-runtime-base/catalog.json
      NEMOCLAW_NON_INTERACTIVE: "1"
      NEMOCLAW_RUN_LIVE_E2E: "1"
      OPENSHELL_GATEWAY: nemoclaw
    steps:
      - name: Check out exact base-controlled scenario controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false

      - name: Check out exact comparison base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authenticate-candidate.outputs.base_sha }}
          path: base
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1

      - name: Verify base and workflow source identities
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WORKFLOW_SHA" == "$BASE_SHA" ]]
          test "$(git -C base rev-parse --verify HEAD)" = "$BASE_SHA"
          test "$(git -C trusted rev-parse --verify HEAD)" = "$WORKFLOW_SHA"

      - id: publication
        name: Select the production managed-image cohort for the base
        working-directory: base
        env:
          EXPECTED_SHA: ${{ needs.authenticate-candidate.outputs.base_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          PUBLICATION_HISTORY_ALLOW_NON_HEAD: "1"
          REQUIRE_MANAGED_IMAGE_PUBLICATION: "1"
          SELECT_NEAREST_SUCCESSFUL_PUBLICATION: "1"
        run: |
          set -euo pipefail
          export GITHUB_REF=refs/heads/main
          export GITHUB_SHA="$EXPECTED_SHA"
          node --experimental-strip-types --no-warnings \
            ../trusted/tools/e2e/base-image-publication.mts \
            --wait-seconds 300 --poll-seconds 30

      - name: Download the authenticated base managed-image cohort
        working-directory: base
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLICATION_ARTIFACT_KIND: managed-image-cohort
          PUBLICATION_HEAD_SHA: ${{ steps.publication.outputs.head_sha }}
          PUBLICATION_RUN_ATTEMPT: ${{ steps.publication.outputs.run_attempt }}
          PUBLICATION_RUN_ID: ${{ steps.publication.outputs.run_id }}
        run: >-
          node --experimental-strip-types --no-warnings
          ../trusted/tools/e2e/exact-artifact-download.mts
          "${RUNNER_TEMP}/managed-runtime-base/cohort"

      - name: Validate the base cohort and materialize its runtime catalog
        working-directory: base
        env:
          PUBLICATION_HEAD_SHA: ${{ steps.publication.outputs.head_sha }}
          PUBLICATION_RUN_ATTEMPT: ${{ steps.publication.outputs.run_attempt }}
          PUBLICATION_RUN_ID: ${{ steps.publication.outputs.run_id }}
        run: >-
          node --experimental-strip-types --no-warnings
          ../trusted/tools/e2e/managed-image-cohort-contract.mts
          "${RUNNER_TEMP}/managed-runtime-base/cohort/cohort.json"
          "$NEMOCLAW_MANAGED_ACTIVATION_CATALOG"

      - name: Download reviewed OpenShell SDK from trusted code
        working-directory: trusted
        env:
          NEMOCLAW_OPEN_SHELL_SDK_OUTPUT_DIRECTORY: ${{ runner.temp }}/openshell-sdk
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: >-
          node --experimental-strip-types --no-warnings
          scripts/checks/package-openshell-sdk-for-pr.mts

      - name: Install exact-base dependencies without credentials
        working-directory: base
        run: >-
          env -u GITHUB_TOKEN -u NODE_AUTH_TOKEN
          GITHUB_EVENT_NAME=pull_request
          bash ../trusted/.github/actions/ci-install-dependencies.sh

      - name: Build the exact-base CLI
        working-directory: base
        run: npm run build:cli

      - name: Install the exact-base OpenShell CLI
        working-directory: base
        run: env -u GITHUB_TOKEN -u NODE_AUTH_TOKEN bash scripts/install-openshell.sh

      - id: runtime
        name: Record the base OpenShell runtime identity
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/.npm-global/bin:$PATH"
          export OPENSHELL_BIN="$(command -v openshell)"
          version="$("$OPENSHELL_BIN" --version)"
          [[ "$version" != *$'\n'* && "$version" != *$'\r'* && -n "$version" ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - id: activation
        name: Run the identical exact-base managed runtime scenario
        working-directory: base
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$BASE_SHA"
          export PATH="$HOME/.local/bin:$HOME/.npm-global/bin:$PATH"
          export OPENSHELL_BIN="$(command -v openshell)"
          npx --no-install tsx tools/e2e/live-vitest-invocation.mts run \
            --test-path test/e2e/live/managed-image-activation-e2e.test.ts

      - name: Record the base activation receipt
        if: always()
        env:
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          MANAGED_IMAGE_REVISION: ${{ steps.publication.outputs.head_sha }}
          MANAGED_RUNTIME_CATALOG: ${{ env.NEMOCLAW_MANAGED_ACTIVATION_CATALOG }}
          MANAGED_RUNTIME_EVIDENCE_DIRECTORY: ${{ env.E2E_ARTIFACT_DIR }}
          MANAGED_RUNTIME_JOB: Exact base all-agent managed runtime activation
          MANAGED_RUNTIME_OUTCOME: ${{ steps.activation.outcome }}
          MANAGED_RUNTIME_ROLE: base
          MANAGED_RUNTIME_SOURCE_SHA: ${{ needs.authenticate-candidate.outputs.base_sha }}
          MANAGED_RUNTIME_WORKFLOW_PATH: .github/workflows/managed-runtime-base-qualification.yaml
          OPENSHELL_VERSION: ${{ steps.runtime.outputs.version }}
        run: >-
          node --experimental-strip-types --no-warnings
          trusted/tools/e2e/managed-runtime-comparison.mts record
          "${RUNNER_TEMP}/managed-runtime-base-receipt/receipt.json"

      - name: Upload exact-base activation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-runtime-base-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.E2E_ARTIFACT_DIR }}/
          if-no-files-found: error
          retention-days: 14

      - name: Upload exact-base activation receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-runtime-base-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/managed-runtime-base-receipt/receipt.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  classify:
    name: Classify candidate and exact-base evidence
    needs: [authenticate-candidate, candidate-activation, exact-base-activation]
    if: always() && needs.authenticate-candidate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Check out exact base-controlled classifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1

      - id: classify
        name: Compare authenticated scenario receipts
        continue-on-error: true
        env:
          BASE_JOB_CONCLUSION: ${{ needs.exact-base-activation.result }}
          BASE_SHA: ${{ needs.authenticate-candidate.outputs.base_sha }}
          CANDIDATE_JOB_CONCLUSION: ${{ needs.candidate-activation.result }}
          CANDIDATE_SHA: ${{ needs.authenticate-candidate.outputs.candidate_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: >-
          node --experimental-strip-types --no-warnings
          tools/e2e/managed-runtime-comparison.mts classify
          "${RUNNER_TEMP}/managed-runtime-comparison/comparison.json"

      - name: Preserve managed runtime comparison receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-runtime-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/managed-runtime-comparison/comparison.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Propagate the comparison classification
        if: always() && steps.classify.outcome != 'success'
        env:
          CLASSIFICATION: ${{ steps.classify.outputs.classification }}
          REASON: ${{ steps.classify.outputs.reason }}
        run: |
          echo "ERROR: managed runtime comparison classification=${CLASSIFICATION:-unavailable} reason=${REASON:-classifier did not produce a receipt}" >&2
          exit 1
