name: E2E / Exact Base Managed Runtime

on:
  workflow_run:
    workflows: ["Images / Build, Test, and Publish Managed Images"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open same-repository pull request number
        required: true
        type: string
      candidate_sha:
        description: Candidate commit tested by the managed-image run
        required: true
        type: string
      base_sha:
        description: Comparison base commit for the identical scenario
        required: true
        type: string
      candidate_run_id:
        description: Managed-image workflow run ID
        required: true
        type: string
      candidate_run_attempt:
        description: Managed-image workflow run attempt
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: >-
    managed-runtime-base-${{
      github.event.workflow_run.pull_requests[0].number || inputs.pr_number
    }}-${{ github.event.workflow_run.head_sha || inputs.candidate_sha }}-${{
      github.event.workflow_run.pull_requests[0].base.sha || inputs.base_sha
    }}
  cancel-in-progress: false

jobs:
  authenticate-source:
    name: Authenticate managed-image source attempt
    if: >-
      github.repository == 'NVIDIA/NemoClaw' && ((github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      base_sha: ${{ steps.select.outputs.base_sha }}
      candidate_sha: ${{ steps.select.outputs.candidate_sha }}
      pr_number: ${{ steps.select.outputs.pr_number }}
      source_run_attempt: ${{ steps.select.outputs.source_run_attempt }}
      source_run_id: ${{ steps.select.outputs.source_run_id }}
    steps:
      - name: Check out trusted qualification controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1

      - id: select
        name: Bind the current PR and managed-image attempt
        env:
          BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha || inputs.base_sha }}
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha || inputs.candidate_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.candidate_run_attempt }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.candidate_run_id }}
        run: >-
          node --experimental-strip-types --no-warnings tools/e2e/managed-runtime-comparison.mts select-source "${RUNNER_TEMP}/managed-runtime-source/selection.json"

      - name: Mark exact-base qualification pending on the candidate
        env:
          CANDIDATE_SHA: ${{ steps.select.outputs.candidate_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node --experimental-strip-types --no-warnings tools/e2e/managed-runtime-comparison.mts publish-status pending

  publish-candidate-images:
    name: Publish authenticated candidate image (${{ matrix.agent }}, ${{ matrix.arch }})
    needs: authenticate-source
    if: needs.authenticate-source.result == 'success'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: openclaw
            arch: amd64
            platform: linux/amd64
            repository: ghcr.io/nvidia/nemoclaw/openclaw-sandbox
            runner: ubuntu-24.04
          - agent: openclaw
            arch: arm64
            platform: linux/arm64
            repository: ghcr.io/nvidia/nemoclaw/openclaw-sandbox
            runner: ubuntu-24.04-arm
          - agent: hermes
            arch: amd64
            platform: linux/amd64
            repository: ghcr.io/nvidia/nemoclaw/hermes-sandbox
            runner: ubuntu-24.04
          - agent: hermes
            arch: arm64
            platform: linux/arm64
            repository: ghcr.io/nvidia/nemoclaw/hermes-sandbox
            runner: ubuntu-24.04-arm
          - agent: langchain-deepagents-code
            arch: amd64
            platform: linux/amd64
            repository: ghcr.io/nvidia/nemoclaw/langchain-deepagents-code-sandbox
            runner: ubuntu-24.04
          - agent: langchain-deepagents-code
            arch: arm64
            platform: linux/arm64
            repository: ghcr.io/nvidia/nemoclaw/langchain-deepagents-code-sandbox
            runner: ubuntu-24.04-arm
    env:
      AGENT: ${{ matrix.agent }}
      CANDIDATE_SHA: ${{ needs.authenticate-source.outputs.candidate_sha }}
      IMAGE: ${{ matrix.repository }}
      PLATFORM: ${{ matrix.platform }}
      SOURCE_RUN_ATTEMPT: ${{ needs.authenticate-source.outputs.source_run_attempt }}
      SOURCE_RUN_ID: ${{ needs.authenticate-source.outputs.source_run_id }}
    steps:
      - name: Check out the trusted image publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1

      - name: Download the exact authenticated candidate image bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.authenticate-source.outputs.source_run_id }}
          name: managed-pr-image-${{ needs.authenticate-source.outputs.source_run_id }}-${{ needs.authenticate-source.outputs.source_run_attempt }}-${{ matrix.agent }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/managed-pr-image

      - name: Reject production OpenClaw build arguments
        run: trusted/scripts/check-production-build-args.sh

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - id: publish
        name: Validate, authenticate, and publish through the trusted boundary
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
          REGISTRY_PASSWORD: ${{ github.token }}
          REGISTRY_USERNAME: ${{ github.actor }}
        run: >-
          node --experimental-strip-types --no-warnings trusted/tools/e2e/managed-pr-image-publisher.mts publish "${RUNNER_TEMP}/managed-pr-image"

      - name: Remove trusted publisher credentials
        if: always()
        run: docker logout ghcr.io

      - name: Validate the exact public digest and write its contract
        env:
          PUBLISHED_DIGEST: ${{ steps.publish.outputs.digest }}
          RELEASE: ${{ steps.publish.outputs.release }}
        run: |
          set -euo pipefail
          [[ "$PUBLISHED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          reference="${IMAGE}@${PUBLISHED_DIGEST}"
          trusted/scripts/checks/pull-public-exact-digest.sh "$reference" "$PLATFORM"
          image_json="$(docker image inspect "$reference")"
          jq -e \
            --arg agent "$AGENT" \
            --arg cohort "ghrun-${SOURCE_RUN_ID}-${SOURCE_RUN_ATTEMPT}" \
            --arg platform "$PLATFORM" \
            --arg release "$RELEASE" \
            --arg revision "$CANDIDATE_SHA" '
              length == 1 and
              .[0].Config.Labels["io.nvidia.nemoclaw.agent"] == $agent and
              .[0].Config.Labels["io.nvidia.nemoclaw.managed-image.contract"] == "1" and
              .[0].Config.Labels["io.nvidia.nemoclaw.managed-image.platform"] == $platform and
              .[0].Config.Labels["io.nvidia.nemoclaw.managed-image.cohort"] == $cohort and
              .[0].Config.Labels["org.opencontainers.image.revision"] == $revision and
              .[0].Config.Labels["org.opencontainers.image.version"] == $release
            ' <<< "$image_json" >/dev/null
          node --experimental-strip-types --no-warnings \
            trusted/tools/e2e/managed-pr-image-publisher.mts contract \
            "$RUNNER_TEMP/managed-pr-contract/contract.json"

      - name: Upload the trusted exact candidate image contract
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-pr-contract-${{ needs.authenticate-source.outputs.source_run_id }}-${{ needs.authenticate-source.outputs.source_run_attempt }}-${{ matrix.agent }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/managed-pr-contract/contract.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  package-openshell-sdk:
    name: Resolve reviewed OpenShell SDK from the authenticated producer
    needs: authenticate-source
    if: needs.authenticate-source.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      required: ${{ steps.package.outputs.required }}
    steps:
      - name: Check out candidate lockfiles as package inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authenticate-source.outputs.candidate_sha }}
          persist-credentials: false
          sparse-checkout: |
            package-lock.json
            nemoclaw/package-lock.json
          sparse-checkout-cone-mode: false

      - name: Check out exact base package decision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authenticate-source.outputs.base_sha }}
          path: .trusted-sdk-package-decision
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/openshell-sdk-package-pr.yaml
            ci/reviewed-npm-audit.json
            scripts/audit-reviewed-npm-graph.mts
            scripts/checks/prepare-ci-npm-install.mts
            scripts/lib/openclaw-npm-remediation.mts
            scripts/lib/reviewed-npm-archive.mts
            scripts/lib/reviewed-npm-audit.mts
          sparse-checkout-cone-mode: false

      - name: Check out trusted SDK producer selector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .trusted-sdk-package-selector
          persist-credentials: false
          sparse-checkout: scripts/checks/locate-openshell-sdk-package-for-pr.sh
          sparse-checkout-cone-mode: false

      - name: Set up Node for the base-controlled package decision
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1

      - id: package
        name: Locate the authenticated OpenShell SDK producer
        env:
          BASE_SHA: ${{ needs.authenticate-source.outputs.base_sha }}
          GH_TOKEN: ${{ github.token }}
          HEAD_REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ needs.authenticate-source.outputs.candidate_sha }}
          PR_NUMBER: ${{ needs.authenticate-source.outputs.pr_number }}
        run: bash .trusted-sdk-package-selector/scripts/checks/locate-openshell-sdk-package-for-pr.sh

      - name: Download the authenticated OpenShell SDK archive
        if: steps.package.outputs.required == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.package.outputs.run_id }}
          name: openshell-sdk-${{ needs.authenticate-source.outputs.candidate_sha }}
          path: ${{ runner.temp }}/openshell-sdk

      - name: Upload reviewed OpenShell SDK archive
        if: steps.package.outputs.required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-runtime-openshell-sdk-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openshell-sdk/${{ steps.package.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 1

  build-candidate-cli:
    name: Build untrusted candidate CLI in an isolated job
    needs: [authenticate-source, package-openshell-sdk]
    if: >-
      needs.authenticate-source.result == 'success' && needs.package-openshell-sdk.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out candidate product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authenticate-source.outputs.candidate_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Check out trusted dependency installer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: controller
          persist-credentials: false
          sparse-checkout: |
            .github/actions/ci-install-dependencies.sh
            ci/reviewed-npm-audit.json
            scripts/audit-reviewed-npm-graph.mts
            scripts/checks/prepare-ci-npm-install.mts
            scripts/lib
          sparse-checkout-cone-mode: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1

      - name: Download reviewed OpenShell SDK archive
        if: needs.package-openshell-sdk.outputs.required == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: managed-runtime-openshell-sdk-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openshell-sdk

      - name: Install dependencies and build only candidate outputs
        working-directory: candidate
        run: |
          set -euo pipefail
          env -u GITHUB_TOKEN -u NODE_AUTH_TOKEN \
            GITHUB_EVENT_NAME=pull_request \
            bash ../controller/.github/actions/ci-install-dependencies.sh
          npm run build:cli
          test -s dist/nemoclaw.js
          if find -P dist -type l -print -quit | grep -q .; then
            echo "ERROR: candidate build outputs must not contain symbolic links." >&2
            exit 1
          fi
          output_bytes="$(du -sb dist | awk '{ print $1 }')"
          test "$output_bytes" -le 134217728
          /usr/bin/tar --create --file "$RUNNER_TEMP/candidate-cli.tar" \
            dist

      - name: Upload bounded candidate build product
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-runtime-candidate-cli-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-cli.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  trusted-candidate-mcp-discovery:
    name: Trusted candidate OpenClaw managed-image MCP discovery (pass ${{ matrix.pass }})
    needs:
      - authenticate-source
      - publish-candidate-images
      - package-openshell-sdk
      - build-candidate-cli
    if: >-
      needs.authenticate-source.result == 'success' && needs.publish-candidate-images.result == 'success' && needs.package-openshell-sdk.result == 'success' && needs.build-candidate-cli.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pass: [1, 2]
    env:
      CANDIDATE_SHA: ${{ needs.authenticate-source.outputs.candidate_sha }}
      E2E_ARTIFACT_DIR: ${{ github.workspace }}/.managed-runtime-candidate/mcp/pass-${{ matrix.pass }}
      E2E_JOB: "1"
      E2E_TARGET_ID: mcp-bridge
      NEMOCLAW_CLI_BIN: ${{ github.workspace }}/.managed-runtime-candidate/mcp/nemoclaw
      NEMOCLAW_E2E_EXPECTED_SHA: ${{ needs.authenticate-source.outputs.candidate_sha }}
      NEMOCLAW_E2E_MANAGED_IMAGE_CATALOG: ${{ github.workspace }}/.managed-runtime-candidate/mcp/catalog.json
      NEMOCLAW_E2E_REQUIRE_EXECUTED_TEST: "1"
      NEMOCLAW_E2E_SHARD: openclaw
      NEMOCLAW_MCP_BRIDGE_AGENT: openclaw
      NEMOCLAW_MCP_BRIDGE_E2E_SCOPE: managed-image-discovery
      NEMOCLAW_NON_INTERACTIVE: "1"
      NEMOCLAW_OPENSHELL_EXACT_MAIN_PROOF: "1"
      NEMOCLAW_RUN_LIVE_E2E: "1"
      NEMOCLAW_SANDBOX_NAME: e2e-pr-exact-mcp-${{ matrix.pass }}
      OPENSHELL_DOCKER_SUPERVISOR_IMAGE: ghcr.io/nvidia/openshell/supervisor@sha256:722f44669722961b7f432b0b81de25b91a58f34a61d6403bef967acaf2b3af01
      SOURCE_RUN_ATTEMPT: ${{ needs.authenticate-source.outputs.source_run_attempt }}
      SOURCE_RUN_ID: ${{ needs.authenticate-source.outputs.source_run_id }}
    steps:
      - name: Check out trusted MCP controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false

      - name: Check out candidate MCP behavior
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authenticate-source.outputs.candidate_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1

      - name: Verify candidate and trusted MCP controller identities
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse --verify HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C trusted rev-parse --verify HEAD)" = "$WORKFLOW_SHA"

      - name: Download trusted amd64 candidate image contracts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: managed-pr-contract-${{ needs.authenticate-source.outputs.source_run_id }}-${{ needs.authenticate-source.outputs.source_run_attempt }}-*-amd64
          path: ${{ runner.temp }}/managed-runtime-mcp/contracts
          merge-multiple: false

      - name: Download reviewed OpenShell SDK archive
        if: needs.package-openshell-sdk.outputs.required == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: managed-runtime-openshell-sdk-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openshell-sdk

      - name: Download isolated candidate CLI build product
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: managed-runtime-candidate-cli-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-cli-build

      - name: Install trusted and candidate MCP dependencies without credentials
        run: |
          set -euo pipefail
          (
            cd trusted
            env -u GITHUB_TOKEN -u NODE_AUTH_TOKEN \
              GITHUB_EVENT_NAME=pull_request \
              bash .github/actions/ci-install-dependencies.sh
          )
          (
            cd candidate
            env -u GITHUB_TOKEN -u NODE_AUTH_TOKEN \
              GITHUB_EVENT_NAME=pull_request \
              bash ../trusted/.github/actions/ci-install-dependencies.sh
          )

      - name: Materialize the candidate CLI and trusted image catalog
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/candidate-cli-build/candidate-cli.tar"
          test -f "$archive" && test ! -L "$archive"
          /usr/bin/tar --extract --file "$archive" --directory candidate \
            --no-same-owner --no-same-permissions
          mapfile -d '' contracts < <(
            find "$RUNNER_TEMP/managed-runtime-mcp/contracts" \
              -type f -name contract.json -print0
          )
          node --experimental-strip-types --no-warnings \
            trusted/tools/e2e/pr-managed-image-publication.mts assemble \
            "$CANDIDATE_SHA" \
            "$NEMOCLAW_E2E_MANAGED_IMAGE_CATALOG" \
            "${contracts[@]}"

      - name: Bind MCP correlation identity
        run: |
          set -euo pipefail
          correlation_id="$(node --input-type=module -e \
            'import { randomUUID } from "node:crypto"; console.log(randomUUID())')"
          [[ "$correlation_id" =~ ^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$ ]]
          printf 'NEMOCLAW_E2E_CORRELATION_ID=%s\n' "$correlation_id" >> "$GITHUB_ENV"

      - name: Install and verify cloudflared prerequisite
        env:
          CLOUDFLARED_VERSION: "2026.6.1"
          CLOUDFLARED_DEB_SHA256: "ccd02ec216c62bfa573395d8f72cb2e91e95cbdf8726a8acc06b3e2d9aa31526"
        run: |
          set -euo pipefail
          cloudflared_deb="${RUNNER_TEMP}/cloudflared-${CLOUDFLARED_VERSION}-linux-amd64.deb"
          curl -fL "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64.deb" -o "${cloudflared_deb}"
          printf '%s  %s\n' "${CLOUDFLARED_DEB_SHA256}" "${cloudflared_deb}" | sha256sum -c -
          package="$(dpkg-deb -f "${cloudflared_deb}" Package)"
          version="$(dpkg-deb -f "${cloudflared_deb}" Version)"
          architecture="$(dpkg-deb -f "${cloudflared_deb}" Architecture)"
          if [[ "$package" != cloudflared || "$version" != "$CLOUDFLARED_VERSION" || "$architecture" != amd64 ]]; then
            echo "ERROR: downloaded cloudflared package identity is invalid." >&2
            exit 1
          fi
          sudo dpkg -i "$cloudflared_deb"

      - name: Generate MCP test TLS
        working-directory: trusted
        run: bash test/e2e/setup-mcp-test-tls.sh

      - name: Install trusted OpenShell CLI
        working-directory: trusted
        env:
          NEMOCLAW_OPENSHELL_FORCE_INSTALL: "1"
        run: env -u GITHUB_TOKEN -u NODE_AUTH_TOKEN bash scripts/install-openshell.sh

      - name: Isolate the candidate MCP product from trusted state
        run: |
          set -euo pipefail
          test -s candidate/dist/nemoclaw.js
          sudo install -o root -g root -m 0555 trusted/bin/nemoclaw.js candidate/bin/nemoclaw.js
          sudo groupadd --system nemoclaw-runtime
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin \
            --gid nemoclaw-runtime nemoclaw-candidate
          sudo usermod --append --groups nemoclaw-runtime "$USER"
          mkdir -p "$HOME/.nemoclaw" "$HOME/.config/nemoclaw" "$HOME/.config/openshell"
          sudo chown -R root:nemoclaw-runtime \
            "$HOME/.nemoclaw" "$HOME/.config/nemoclaw" "$HOME/.config/openshell"
          sudo chmod -R u+rwX,g+rwX,o-rwx \
            "$HOME/.nemoclaw" "$HOME/.config/nemoclaw" "$HOME/.config/openshell"
          sudo find "$HOME/.nemoclaw" "$HOME/.config/nemoclaw" "$HOME/.config/openshell" \
            -type d -exec chmod 2770 {} +
          mkdir -p "$E2E_ARTIFACT_DIR" "$(dirname "$NEMOCLAW_CLI_BIN")"
          chmod 0700 "$E2E_ARTIFACT_DIR"
          chmod 0444 "$NEMOCLAW_E2E_MANAGED_IMAGE_CATALOG"
          chmod 0555 "$(dirname "$NEMOCLAW_E2E_MANAGED_IMAGE_CATALOG")"
          sudo chown -R root:root trusted candidate
          sudo chmod -R a-w trusted candidate
          trusted_digest="sha256:$(sudo find trusted -xdev -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          printf 'TRUSTED_MCP_CONTROLLER_DIGEST=%s\n' "$trusted_digest" >> "$GITHUB_ENV"
          sudo tee "$NEMOCLAW_CLI_BIN" >/dev/null <<EOF
          #!/usr/bin/env bash
          umask 0007
          exec sudo --preserve-env -u nemoclaw-candidate -- \
            /usr/bin/env HOME="$HOME" PATH="$HOME/.local/bin:$HOME/.npm-global/bin:/usr/local/bin:/usr/bin:/bin" \
            /usr/bin/node "$GITHUB_WORKSPACE/candidate/bin/nemoclaw.js" "\$@"
          EOF
          sudo chown root:root "$NEMOCLAW_CLI_BIN"
          sudo chmod 0555 "$NEMOCLAW_CLI_BIN"

      - name: Reject candidate writes to MCP controller and evidence
        run: |
          set -euo pipefail
          if sudo -u nemoclaw-candidate -- touch "$GITHUB_WORKSPACE/trusted/.candidate-tamper"; then
            echo "ERROR: candidate user can mutate the trusted MCP controller." >&2
            exit 1
          fi
          if sudo -u nemoclaw-candidate -- touch "$E2E_ARTIFACT_DIR/.candidate-tamper"; then
            echo "ERROR: candidate user can mutate trusted MCP evidence." >&2
            exit 1
          fi
          test ! -e "$GITHUB_WORKSPACE/trusted/.candidate-tamper"
          test ! -e "$E2E_ARTIFACT_DIR/.candidate-tamper"

      - id: runtime
        name: Record the MCP OpenShell runtime identity
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/.npm-global/bin:$PATH"
          export OPENSHELL_BIN="$(command -v openshell)"
          version="$("$OPENSHELL_BIN" --version)"
          [[ "$version" != *$'\n'* && "$version" != *$'\r'* && -n "$version" ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - id: mcp
        name: Run controller-owned OpenClaw managed-image MCP discovery
        working-directory: trusted
        run: |
          set -euo pipefail
          test "$(git -C ../candidate rev-parse --verify HEAD)" = "$CANDIDATE_SHA"
          export PATH="$HOME/.local/bin:$HOME/.npm-global/bin:$PATH"
          OPENSHELL_BIN="$(command -v openshell)"
          export OPENSHELL_BIN
          "$OPENSHELL_BIN" --version
          sg nemoclaw-runtime -c \
            'npx --no-install tsx tools/e2e/live-vitest-invocation.mts run --test-path test/e2e/live/mcp-bridge.test.ts'

      - id: integrity
        name: Prove candidate MCP execution could not mutate trusted state
        if: always()
        run: |
          set -euo pipefail
          test ! -w trusted
          test ! -w candidate
          test "sha256:$(sudo find trusted -xdev -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')" = \
            "$TRUSTED_MCP_CONTROLLER_DIGEST"
          test "$(stat -c '%U:%a' "$E2E_ARTIFACT_DIR")" = "runner:700"

      - id: mcp_artifact_secret_scan
        name: Scan MCP artifacts for fixture credentials
        if: always()
        working-directory: trusted
        run: npx --no-install tsx tools/e2e/assert-mcp-artifact-secrets-absent.mts "$E2E_ARTIFACT_DIR"

      - name: Record protected MCP discovery evidence
        if: ${{ always() && steps.integrity.outcome == 'success' && steps.mcp_artifact_secret_scan.outcome == 'success' }}
        env:
          BASE_SHA: ${{ needs.authenticate-source.outputs.base_sha }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          MANAGED_MCP_CATALOG: ${{ env.NEMOCLAW_E2E_MANAGED_IMAGE_CATALOG }}
          MANAGED_MCP_CONTROLLER_DIGEST: ${{ env.TRUSTED_MCP_CONTROLLER_DIGEST }}
          MANAGED_MCP_EVIDENCE_DIRECTORY: ${{ env.E2E_ARTIFACT_DIR }}
          MANAGED_MCP_JOB: Trusted candidate OpenClaw managed-image MCP discovery (pass ${{ matrix.pass }})
          MANAGED_MCP_OUTCOME: ${{ steps.mcp.outcome }}
          MANAGED_MCP_PASS: ${{ matrix.pass }}
          OPENSHELL_VERSION: ${{ steps.runtime.outputs.version }}
        run: >-
          node --experimental-strip-types --no-warnings trusted/tools/e2e/managed-runtime-comparison.mts record-mcp "${RUNNER_TEMP}/managed-runtime-mcp-receipt-pass-${{ matrix.pass }}/receipt.json"

      - name: Upload exact MCP discovery evidence
        if: ${{ always() && steps.mcp_artifact_secret_scan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-runtime-mcp-${{ github.run_id }}-${{ github.run_attempt }}-pass-${{ matrix.pass }}
          path: ${{ env.E2E_ARTIFACT_DIR }}/
          if-no-files-found: error
          retention-days: 14

      - name: Upload protected MCP discovery receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-runtime-mcp-receipt-${{ github.run_id }}-${{ github.run_attempt }}-pass-${{ matrix.pass }}
          path: ${{ runner.temp }}/managed-runtime-mcp-receipt-pass-${{ matrix.pass }}/receipt.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  authenticate-mcp-discovery:
    name: Authenticate managed-image MCP discovery evidence
    needs: [authenticate-source, trusted-candidate-mcp-discovery]
    if: always() && needs.authenticate-source.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out trusted MCP evidence controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1

      - name: Download protected MCP discovery receipts
        id: receipts
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: managed-runtime-mcp-receipt-${{ github.run_id }}-${{ github.run_attempt }}-pass-*
          path: ${{ runner.temp }}/managed-runtime-mcp/receipts
          merge-multiple: false

      - name: Download protected MCP discovery evidence
        id: evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: managed-runtime-mcp-${{ github.run_id }}-${{ github.run_attempt }}-pass-*
          path: ${{ runner.temp }}/managed-runtime-mcp/evidence
          merge-multiple: false

      - id: classify
        name: Classify authenticated MCP discovery receipts
        continue-on-error: true
        env:
          BASE_SHA: ${{ needs.authenticate-source.outputs.base_sha }}
          CANDIDATE_SHA: ${{ needs.authenticate-source.outputs.candidate_sha }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          SOURCE_RUN_ATTEMPT: ${{ needs.authenticate-source.outputs.source_run_attempt }}
          SOURCE_RUN_ID: ${{ needs.authenticate-source.outputs.source_run_id }}
        run: >-
          node --experimental-strip-types --no-warnings tools/e2e/managed-runtime-comparison.mts classify-mcp "${RUNNER_TEMP}/managed-runtime-mcp/receipts" "${RUNNER_TEMP}/managed-runtime-mcp/evidence" "${RUNNER_TEMP}/managed-runtime-mcp/comparison.json"

      - name: Preserve authenticated MCP discovery comparison
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-runtime-mcp-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/managed-runtime-mcp/comparison.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Propagate the MCP discovery classification
        if: steps.classify.outcome != 'success'
        run: |
          echo "ERROR: managed-image MCP discovery did not pass; inspect the comparison receipt." >&2
          exit 1

  trusted-candidate-activation:
    name: Trusted candidate all-agent managed runtime activation (${{ matrix.arch }})
    needs:
      - authenticate-source
      - publish-candidate-images
      - package-openshell-sdk
      - build-candidate-cli
    if: >-
      needs.authenticate-source.result == 'success' && needs.publish-candidate-images.result == 'success' && needs.package-openshell-sdk.result == 'success' && needs.build-candidate-cli.result == 'success'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      actions: read
      contents: read
    env:
      BASE_SHA: ${{ needs.authenticate-source.outputs.base_sha }}
      CANDIDATE_SHA: ${{ needs.authenticate-source.outputs.candidate_sha }}
      E2E_ARTIFACT_DIR: ${{ github.workspace }}/.managed-runtime-candidate/evidence
      E2E_JOB: "1"
      E2E_TARGET_ID: managed-image-activation
      NEMOCLAW_CLI_BIN: ${{ github.workspace }}/.managed-runtime-candidate-cli
      NEMOCLAW_E2E_EXPECTED_SHA: ${{ needs.authenticate-source.outputs.candidate_sha }}
      NEMOCLAW_E2E_SHARD: default
      NEMOCLAW_MANAGED_ACTIVATION_CATALOG: ${{ github.workspace }}/.managed-runtime-candidate/catalog.json
      MANAGED_RUNTIME_PLATFORM: ${{ matrix.platform }}
      NEMOCLAW_NON_INTERACTIVE: "1"
      NEMOCLAW_RUN_LIVE_E2E: "1"
      OPENSHELL_GATEWAY: nemoclaw
      SOURCE_RUN_ATTEMPT: ${{ needs.authenticate-source.outputs.source_run_attempt }}
      SOURCE_RUN_ID: ${{ needs.authenticate-source.outputs.source_run_id }}
    steps:
      - name: Check out trusted qualification controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false

      - name: Check out candidate only as the product input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authenticate-source.outputs.candidate_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1

      - name: Verify candidate and controller identities
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C candidate rev-parse --verify HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C trusted rev-parse --verify HEAD)" = "$WORKFLOW_SHA"

      - name: Download trusted candidate image contracts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: managed-pr-contract-${{ needs.authenticate-source.outputs.source_run_id }}-${{ needs.authenticate-source.outputs.source_run_attempt }}-*-${{ matrix.arch }}
          path: ${{ runner.temp }}/managed-runtime-candidate/contracts
          merge-multiple: false

      - name: Download reviewed OpenShell SDK archive
        if: needs.package-openshell-sdk.outputs.required == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: managed-runtime-openshell-sdk-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openshell-sdk

      - name: Download isolated candidate CLI build product
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: managed-runtime-candidate-cli-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-cli-build

      - name: Assemble candidate catalog with the trusted controller
        run: |
          set -euo pipefail
          mapfile -d '' contracts < <(
            find "$RUNNER_TEMP/managed-runtime-candidate/contracts" \
              -type f -name contract.json -print0
          )
          node --experimental-strip-types --no-warnings \
            trusted/tools/e2e/pr-managed-image-publication.mts assemble \
            "$CANDIDATE_SHA" \
            "$NEMOCLAW_MANAGED_ACTIVATION_CATALOG" \
            "${contracts[@]}"

      - name: Install trusted controller and candidate dependencies without credentials
        run: |
          set -euo pipefail
          (
            cd trusted
            env -u GITHUB_TOKEN -u NODE_AUTH_TOKEN \
              GITHUB_EVENT_NAME=pull_request \
              bash .github/actions/ci-install-dependencies.sh
          )
          (
            cd candidate
            env -u GITHUB_TOKEN -u NODE_AUTH_TOKEN \
              GITHUB_EVENT_NAME=pull_request \
              bash ../trusted/.github/actions/ci-install-dependencies.sh
          )

      - name: Install trusted OpenShell CLI
        working-directory: trusted
        run: env -u GITHUB_TOKEN -u NODE_AUTH_TOKEN bash scripts/install-openshell.sh

      - name: Materialize and isolate the candidate product
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/candidate-cli-build/candidate-cli.tar"
          test -f "$archive" && test ! -L "$archive"
          /usr/bin/tar --extract --file "$archive" --directory candidate \
            --no-same-owner --no-same-permissions
          test -s candidate/dist/nemoclaw.js
          sudo groupadd --system nemoclaw-runtime
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin \
            --gid nemoclaw-runtime nemoclaw-candidate
          sudo usermod --append --groups nemoclaw-runtime "$USER"
          mkdir -p "$HOME/.nemoclaw" "$HOME/.config/nemoclaw" "$HOME/.config/openshell"
          sudo chown -R root:nemoclaw-runtime \
            "$HOME/.nemoclaw" "$HOME/.config/nemoclaw" "$HOME/.config/openshell"
          sudo chmod -R u+rwX,g+rwX,o-rwx \
            "$HOME/.nemoclaw" "$HOME/.config/nemoclaw" "$HOME/.config/openshell"
          sudo find "$HOME/.nemoclaw" "$HOME/.config/nemoclaw" "$HOME/.config/openshell" \
            -type d -exec chmod 2770 {} +
          mkdir -p "$E2E_ARTIFACT_DIR"
          chmod 0700 "$E2E_ARTIFACT_DIR"
          chmod 0444 "$NEMOCLAW_MANAGED_ACTIVATION_CATALOG"
          chmod 0555 "$(dirname "$NEMOCLAW_MANAGED_ACTIVATION_CATALOG")"
          sudo chown -R root:root trusted candidate
          sudo chmod -R a-w trusted candidate
          trusted_digest="$(sudo find trusted -xdev -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          printf 'TRUSTED_CONTROLLER_DIGEST=%s\n' "$trusted_digest" >> "$GITHUB_ENV"
          wrapper="$NEMOCLAW_CLI_BIN"
          sudo tee "$wrapper" >/dev/null <<EOF
          #!/usr/bin/env bash
          umask 0007
          exec sudo --preserve-env -u nemoclaw-candidate -- \
            /usr/bin/env HOME="$HOME" PATH="$HOME/.local/bin:$HOME/.npm-global/bin:/usr/local/bin:/usr/bin:/bin" \
            /usr/bin/node "$GITHUB_WORKSPACE/candidate/bin/nemoclaw.js" "\$@"
          EOF
          sudo chown root:root "$wrapper"
          sudo chmod 0555 "$wrapper"

      - name: Reject candidate writes to controller and evidence boundaries
        run: |
          set -euo pipefail
          if sudo -u nemoclaw-candidate -- touch "$GITHUB_WORKSPACE/trusted/.candidate-tamper"; then
            echo "ERROR: candidate user can mutate the trusted controller." >&2
            exit 1
          fi
          if sudo -u nemoclaw-candidate -- touch "$E2E_ARTIFACT_DIR/.candidate-tamper"; then
            echo "ERROR: candidate user can mutate trusted evidence." >&2
            exit 1
          fi
          test ! -e "$GITHUB_WORKSPACE/trusted/.candidate-tamper"
          test ! -e "$E2E_ARTIFACT_DIR/.candidate-tamper"

      - id: runtime
        name: Record OpenShell runtime identity
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/.npm-global/bin:$PATH"
          OPENSHELL_BIN="$(command -v openshell)"
          export OPENSHELL_BIN
          version="$("$OPENSHELL_BIN" --version)"
          [[ "$version" != *$'\n'* && "$version" != *$'\r'* && -n "$version" ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Bind E2E correlation identity
        run: |
          set -euo pipefail
          correlation_id="$(node --input-type=module -e \
            'import { randomUUID } from "node:crypto"; console.log(randomUUID())')"
          [[ "$correlation_id" =~ ^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$ ]]
          printf 'NEMOCLAW_E2E_CORRELATION_ID=%s\n' "$correlation_id" >> "$GITHUB_ENV"

      - id: activation
        name: Run the trusted scenario against candidate inputs
        working-directory: trusted
        run: |
          set -euo pipefail
          test "$(git -C ../candidate rev-parse --verify HEAD)" = "$CANDIDATE_SHA"
          export PATH="$HOME/.local/bin:$HOME/.npm-global/bin:$PATH"
          OPENSHELL_BIN="$(command -v openshell)"
          export OPENSHELL_BIN
          sg nemoclaw-runtime -c \
            'npx --no-install tsx tools/e2e/live-vitest-invocation.mts run --test-path test/e2e/live/managed-image-activation-e2e.test.ts'

      - name: Prove candidate execution could not mutate trusted state
        if: always()
        run: |
          set -euo pipefail
          test ! -w trusted
          test ! -w candidate
          test "$(sudo find trusted -xdev -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')" = \
            "$TRUSTED_CONTROLLER_DIGEST"
          test "$(stat -c '%U:%a' "$E2E_ARTIFACT_DIR")" = "runner:700"

      - name: Record the protected candidate activation receipt
        if: always()
        env:
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          MANAGED_IMAGE_REVISION: ${{ needs.authenticate-source.outputs.candidate_sha }}
          MANAGED_RUNTIME_CATALOG: ${{ env.NEMOCLAW_MANAGED_ACTIVATION_CATALOG }}
          MANAGED_RUNTIME_EVIDENCE_DIRECTORY: ${{ env.E2E_ARTIFACT_DIR }}
          MANAGED_RUNTIME_JOB: Trusted candidate all-agent managed runtime activation (${{ matrix.arch }})
          MANAGED_RUNTIME_OUTCOME: ${{ steps.activation.outcome }}
          MANAGED_RUNTIME_PLATFORM: ${{ matrix.platform }}
          MANAGED_RUNTIME_ROLE: candidate
          MANAGED_RUNTIME_SOURCE_SHA: ${{ needs.authenticate-source.outputs.candidate_sha }}
          MANAGED_RUNTIME_WORKFLOW_PATH: .github/workflows/managed-runtime-base-qualification.yaml
          OPENSHELL_VERSION: ${{ steps.runtime.outputs.version }}
        run: >-
          node --experimental-strip-types --no-warnings trusted/tools/e2e/managed-runtime-comparison.mts record "${RUNNER_TEMP}/managed-runtime-candidate-receipt-${{ matrix.arch }}/receipt.json"

      - name: Upload trusted candidate activation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-runtime-candidate-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          path: ${{ env.E2E_ARTIFACT_DIR }}/
          if-no-files-found: error
          retention-days: 14

      - name: Upload protected candidate activation receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-runtime-candidate-receipt-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/managed-runtime-candidate-receipt-${{ matrix.arch }}/receipt.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  authenticate-candidate-evidence:
    name: Authenticate trusted candidate evidence (${{ matrix.arch }})
    needs: [authenticate-source, trusted-candidate-activation]
    if: always() && needs.authenticate-source.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    steps:
      - name: Check out trusted qualification controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1

      - id: select
        name: Bind trusted candidate receipt and evidence
        env:
          BASE_SHA: ${{ needs.authenticate-source.outputs.base_sha }}
          CANDIDATE_SHA: ${{ needs.authenticate-source.outputs.candidate_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          PR_NUMBER: ${{ needs.authenticate-source.outputs.pr_number }}
          MANAGED_RUNTIME_PLATFORM: ${{ matrix.platform }}
          SOURCE_RUN_ATTEMPT: ${{ needs.authenticate-source.outputs.source_run_attempt }}
          SOURCE_RUN_ID: ${{ needs.authenticate-source.outputs.source_run_id }}
        run: >-
          node --experimental-strip-types --no-warnings tools/e2e/managed-runtime-comparison.mts select-candidate "${RUNNER_TEMP}/managed-runtime-candidate/selection-${{ matrix.arch }}.json"

      - name: Fail closed when candidate evidence cannot be authenticated
        if: failure()
        env:
          CANDIDATE_SHA: ${{ needs.authenticate-source.outputs.candidate_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node --experimental-strip-types --no-warnings tools/e2e/managed-runtime-comparison.mts publish-status error

      - name: Preserve authenticated candidate selection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-runtime-candidate-selection-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/managed-runtime-candidate/selection-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  exact-base-activation:
    name: Exact base all-agent managed runtime activation (${{ matrix.arch }})
    needs: [authenticate-source, package-openshell-sdk]
    if: >-
      needs.authenticate-source.result == 'success' && needs.package-openshell-sdk.result == 'success'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      BASE_SHA: ${{ needs.authenticate-source.outputs.base_sha }}
      CANDIDATE_SHA: ${{ needs.authenticate-source.outputs.candidate_sha }}
      E2E_ARTIFACT_DIR: ${{ github.workspace }}/.managed-runtime-base/evidence
      E2E_JOB: "1"
      E2E_TARGET_ID: managed-image-activation
      NEMOCLAW_CLI_BIN: ${{ github.workspace }}/base/bin/nemoclaw.js
      NEMOCLAW_E2E_EXPECTED_SHA: ${{ needs.authenticate-source.outputs.base_sha }}
      NEMOCLAW_E2E_SHARD: default
      NEMOCLAW_MANAGED_ACTIVATION_CATALOG: ${{ github.workspace }}/.managed-runtime-base/catalog.json
      MANAGED_RUNTIME_PLATFORM: ${{ matrix.platform }}
      NEMOCLAW_NON_INTERACTIVE: "1"
      NEMOCLAW_RUN_LIVE_E2E: "1"
      OPENSHELL_GATEWAY: nemoclaw
      SOURCE_RUN_ATTEMPT: ${{ needs.authenticate-source.outputs.source_run_attempt }}
      SOURCE_RUN_ID: ${{ needs.authenticate-source.outputs.source_run_id }}
    steps:
      - name: Check out trusted qualification controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false

      - name: Check out exact comparison base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authenticate-source.outputs.base_sha }}
          path: base
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1

      - name: Verify base and workflow source identities
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C base rev-parse --verify HEAD)" = "$BASE_SHA"
          test "$(git -C trusted rev-parse --verify HEAD)" = "$WORKFLOW_SHA"

      - id: publication
        name: Select the production managed-image cohort for the base
        working-directory: base
        env:
          EXPECTED_SHA: ${{ needs.authenticate-source.outputs.base_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          REQUIRE_MANAGED_IMAGE_PUBLICATION: "1"
        run: |
          set -euo pipefail
          export GITHUB_REF=refs/heads/main
          export GITHUB_SHA="$EXPECTED_SHA"
          env GITHUB_WORKSPACE="$PWD" node --experimental-strip-types --no-warnings \
            ../trusted/tools/e2e/base-image-publication.mts \
            --wait-seconds 300 --poll-seconds 30

      - name: Require an exact-base managed-image publication
        env:
          PUBLICATION_HEAD_SHA: ${{ steps.publication.outputs.head_sha }}
        run: |
          set -euo pipefail
          test "$PUBLICATION_HEAD_SHA" = "$BASE_SHA"

      - name: Download the authenticated base managed-image cohort
        working-directory: base
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLICATION_ARTIFACT_KIND: managed-image-cohort
          PUBLICATION_HEAD_SHA: ${{ steps.publication.outputs.head_sha }}
          PUBLICATION_RUN_ATTEMPT: ${{ steps.publication.outputs.run_attempt }}
          PUBLICATION_RUN_ID: ${{ steps.publication.outputs.run_id }}
        run: >-
          node --experimental-strip-types --no-warnings ../trusted/tools/e2e/exact-artifact-download.mts "${RUNNER_TEMP}/managed-runtime-base/cohort"

      - name: Validate the base cohort and materialize its runtime catalog
        working-directory: base
        env:
          PUBLICATION_HEAD_SHA: ${{ steps.publication.outputs.head_sha }}
          PUBLICATION_RUN_ATTEMPT: ${{ steps.publication.outputs.run_attempt }}
          PUBLICATION_RUN_ID: ${{ steps.publication.outputs.run_id }}
        run: >-
          node --experimental-strip-types --no-warnings ../trusted/tools/e2e/managed-image-cohort-contract.mts "${RUNNER_TEMP}/managed-runtime-base/cohort/cohort.json" "$NEMOCLAW_MANAGED_ACTIVATION_CATALOG"

      - name: Download reviewed OpenShell SDK archive
        if: needs.package-openshell-sdk.outputs.required == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: managed-runtime-openshell-sdk-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openshell-sdk

      - name: Install trusted controller and exact-base dependencies without credentials
        run: |
          set -euo pipefail
          (
            cd trusted
            env -u GITHUB_TOKEN -u NODE_AUTH_TOKEN \
              GITHUB_EVENT_NAME=pull_request \
              bash .github/actions/ci-install-dependencies.sh
          )
          (
            cd base
            env -u GITHUB_TOKEN -u NODE_AUTH_TOKEN \
              GITHUB_EVENT_NAME=pull_request \
              bash ../trusted/.github/actions/ci-install-dependencies.sh
          )

      - name: Build the exact-base CLI
        working-directory: base
        run: npm run build:cli

      - name: Install trusted OpenShell CLI
        working-directory: trusted
        run: env -u GITHUB_TOKEN -u NODE_AUTH_TOKEN bash scripts/install-openshell.sh

      - id: runtime
        name: Record the base OpenShell runtime identity
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/.npm-global/bin:$PATH"
          OPENSHELL_BIN="$(command -v openshell)"
          export OPENSHELL_BIN
          version="$("$OPENSHELL_BIN" --version)"
          [[ "$version" != *$'\n'* && "$version" != *$'\r'* && -n "$version" ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - id: activation
        name: Run the identical exact-base managed runtime scenario
        working-directory: trusted
        run: |
          set -euo pipefail
          test "$(git -C ../base rev-parse --verify HEAD)" = "$BASE_SHA"
          export PATH="$HOME/.local/bin:$HOME/.npm-global/bin:$PATH"
          OPENSHELL_BIN="$(command -v openshell)"
          export OPENSHELL_BIN
          npx --no-install tsx tools/e2e/live-vitest-invocation.mts run \
            --test-path test/e2e/live/managed-image-activation-e2e.test.ts

      - name: Record the base activation receipt
        if: always()
        env:
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          MANAGED_IMAGE_REVISION: ${{ steps.publication.outputs.head_sha }}
          MANAGED_RUNTIME_CATALOG: ${{ env.NEMOCLAW_MANAGED_ACTIVATION_CATALOG }}
          MANAGED_RUNTIME_EVIDENCE_DIRECTORY: ${{ env.E2E_ARTIFACT_DIR }}
          MANAGED_RUNTIME_JOB: Exact base all-agent managed runtime activation (${{ matrix.arch }})
          MANAGED_RUNTIME_OUTCOME: ${{ steps.activation.outcome }}
          MANAGED_RUNTIME_ROLE: base
          MANAGED_RUNTIME_PLATFORM: ${{ matrix.platform }}
          MANAGED_RUNTIME_SOURCE_SHA: ${{ needs.authenticate-source.outputs.base_sha }}
          MANAGED_RUNTIME_WORKFLOW_PATH: .github/workflows/managed-runtime-base-qualification.yaml
          OPENSHELL_VERSION: ${{ steps.runtime.outputs.version }}
        run: >-
          node --experimental-strip-types --no-warnings trusted/tools/e2e/managed-runtime-comparison.mts record "${RUNNER_TEMP}/managed-runtime-base-receipt-${{ matrix.arch }}/receipt.json"

      - name: Upload exact-base activation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-runtime-base-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          path: ${{ env.E2E_ARTIFACT_DIR }}/
          if-no-files-found: error
          retention-days: 14

      - name: Upload exact-base activation receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-runtime-base-receipt-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/managed-runtime-base-receipt-${{ matrix.arch }}/receipt.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  classify:
    name: Classify candidate and exact-base evidence
    needs:
      - authenticate-source
      - trusted-candidate-activation
      - authenticate-candidate-evidence
      - exact-base-activation
    if: >-
      always() && needs.authenticate-source.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      statuses: write
    steps:
      - name: Check out trusted qualification controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1

      - name: Download authenticated amd64 candidate selection
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: managed-runtime-candidate-selection-${{ github.run_id }}-${{ github.run_attempt }}-amd64
          path: ${{ runner.temp }}/managed-runtime-candidate/amd64

      - name: Download authenticated arm64 candidate selection
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: managed-runtime-candidate-selection-${{ github.run_id }}-${{ github.run_attempt }}-arm64
          path: ${{ runner.temp }}/managed-runtime-candidate/arm64

      - id: classify
        name: Compare authenticated scenario receipts
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/managed-runtime-comparison/platforms"
          for arch in amd64 arm64; do
            selection="$RUNNER_TEMP/managed-runtime-candidate/$arch/selection-$arch.json"
            comparison="$RUNNER_TEMP/managed-runtime-comparison/platforms/$arch.json"
            if ! node --experimental-strip-types --no-warnings \
              tools/e2e/managed-runtime-comparison.mts classify "$selection" "$comparison"; then
              test -f "$comparison"
            fi
          done
          node --experimental-strip-types --no-warnings \
            tools/e2e/managed-runtime-comparison.mts combine \
            "$RUNNER_TEMP/managed-runtime-comparison/platforms/amd64.json" \
            "$RUNNER_TEMP/managed-runtime-comparison/platforms/arm64.json" \
            "$RUNNER_TEMP/managed-runtime-comparison/comparison.json"

      - name: Publish qualification result on the candidate commit
        if: always()
        env:
          CANDIDATE_SHA: ${{ needs.authenticate-source.outputs.candidate_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          QUALIFICATION_CANCELLED: ${{ needs.trusted-candidate-activation.result == 'cancelled' || needs.authenticate-candidate-evidence.result == 'cancelled' || needs.exact-base-activation.result == 'cancelled' }}
        run: |
          set -euo pipefail
          comparison="$RUNNER_TEMP/managed-runtime-comparison/comparison.json"
          if [ "$QUALIFICATION_CANCELLED" = true ]; then
            node --experimental-strip-types --no-warnings \
              tools/e2e/managed-runtime-comparison.mts \
              publish-status cancelled
          elif [ -f "$comparison" ]; then
            node --experimental-strip-types --no-warnings \
              tools/e2e/managed-runtime-comparison.mts \
              publish-status result "$comparison"
          else
            node --experimental-strip-types --no-warnings \
              tools/e2e/managed-runtime-comparison.mts \
              publish-status error
          fi

      - name: Preserve managed runtime comparison receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-runtime-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/managed-runtime-comparison/comparison.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Propagate the comparison classification
        if: steps.classify.outcome != 'success'
        run: |
          echo "ERROR: managed runtime comparison did not pass; inspect the comparison receipt." >&2
          exit 1
