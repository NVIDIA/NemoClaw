name: Images / Test llama.cpp Signature Compatibility

on:
  pull_request:
    paths:
      - ".github/workflows/llama-cpp-signature-test.yaml"
      - ".github/workflows/llama-cpp-image-attest.yaml"
      - ".github/workflows/llama-cpp-image.yaml"
      - "test/inference/llama/llama-cpp-image-signatures.test.ts"

permissions: {}

jobs:
  publish-test:
    name: Publish and sign a signature test artifact
    # This publication is authorized only for the signature repair in PR #13667.
    if: >-
      github.repository == 'NVIDIA/NemoClaw' &&
      github.event.pull_request.number == 13667 &&
      github.event.pull_request.head.repo.full_name == 'NVIDIA/NemoClaw' &&
      github.event.pull_request.head.ref == 'fix/12206-llama-signature-compat' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      packages: write
      id-token: write
    outputs:
      reference: ${{ steps.fixture.outputs.reference }}
      identity: ${{ steps.fixture.outputs.identity }}
    steps:
      - name: Require the current signed PR commit
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gh api repos/NVIDIA/NemoClaw/pulls/13667 | jq -e --arg sha "$HEAD_SHA" '
            .state == "open" and .head.sha == $sha
            and .head.ref == "fix/12206-llama-signature-compat"
            and .head.repo.full_name == "NVIDIA/NemoClaw"
            and .base.ref == "main" and .base.repo.full_name == "NVIDIA/NemoClaw"
          ' >/dev/null
          test "$(gh api "repos/NVIDIA/NemoClaw/commits/$HEAD_SHA" --jq '.commit.verification.verified')" = true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish a run-unique test artifact
        id: fixture
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          context="$(mktemp -d "$RUNNER_TEMP/llama-signature-test.XXXXXX")"
          trap 'rm -rf "$context"' EXIT
          printf '%s\n' "$HEAD_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$context/marker"
          printf 'FROM scratch\nCOPY marker /signature-test.txt\n' > "$context/Dockerfile"
          tag="ghcr.io/nvidia/nemoclaw/llama-cpp-server:signature-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build --tag "$tag" "$context"
          docker push "$tag"
          reference="$(docker image inspect --format '{{index .RepoDigests 0}}' "$tag")"
          [[ "$reference" =~ ^ghcr\.io/nvidia/nemoclaw/llama-cpp-server@sha256:[0-9a-f]{64}$ ]]
          {
            printf 'reference=%s\n' "$reference"
            printf 'digest=%s\n' "${reference##*@}"
            printf 'identity=https://github.com/%s\n' "$GITHUB_WORKFLOW_REF"
          } >> "$GITHUB_OUTPUT"

      - name: Sign exact candidate index
        env:
          IMAGE: ghcr.io/nvidia/nemoclaw/llama-cpp-server
          DIGEST: ${{ steps.fixture.outputs.digest }}
        run: |
          set -euo pipefail
          timeout --foreground 120s cosign sign --yes "$IMAGE@$DIGEST"
          timeout --foreground 120s cosign sign --yes \
            --new-bundle-format=false \
            --use-signing-config=false \
            --tlog-upload=true \
            "$IMAGE@$DIGEST"

  verify-test:
    name: Verify both formats and reject a wrong signer
    needs: publish-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    env:
      CERTIFICATE_IDENTITY: ${{ needs.publish-test.outputs.identity }}
      CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
      REFERENCE: ${{ needs.publish-test.outputs.reference }}
    steps:
      - name: Verify legacy signature anonymously
        run: |
          set -euo pipefail
          docker run --rm \
            ghcr.io/sigstore/cosign/cosign@sha256:68839b7f13dac5a6744a5d8818e984dd39183374e37855c19e14d623d9bc9037 \
            verify \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$CERTIFICATE_OIDC_ISSUER" \
            "$REFERENCE" > signature-verification-cosign2.json 2> signature-verification-cosign2.log

      - name: Verify the Sigstore bundle anonymously
        run: |
          set -euo pipefail
          docker run --rm \
            ghcr.io/sigstore/cosign/cosign@sha256:68839b7f13dac5a6744a5d8818e984dd39183374e37855c19e14d623d9bc9037 \
            verify --new-bundle-format \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$CERTIFICATE_OIDC_ISSUER" \
            "$REFERENCE" > signature-verification-bundle.json 2> signature-verification-bundle.log

      - name: Reject the wrong certificate identity
        run: |
          set -euo pipefail
          if docker run --rm \
            ghcr.io/sigstore/cosign/cosign@sha256:68839b7f13dac5a6744a5d8818e984dd39183374e37855c19e14d623d9bc9037 \
            verify \
            --certificate-identity "${CERTIFICATE_IDENTITY}-unexpected" \
            --certificate-oidc-issuer "$CERTIFICATE_OIDC_ISSUER" \
            "$REFERENCE" > signature-verification-wrong-identity.json 2> signature-verification-wrong-identity.log; then
            echo "ERROR: the wrong certificate identity was accepted." >&2
            exit 1
          fi
          grep -F 'none of the expected identities matched' signature-verification-wrong-identity.log

      - name: Retain signature test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: llama-cpp-signature-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: signature-verification-*
          if-no-files-found: error
          retention-days: 90
