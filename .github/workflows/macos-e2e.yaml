name: E2E / macOS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "bin/**"
      - "nemoclaw/**"
      - "scripts/**"
      - "src/**"
      - "test/**"
      - ".github/workflows/macos-e2e.yaml"
      - "package.json"
      - "package-lock.json"
      - "nemoclaw/package-lock.json"
      - "vitest.config.ts"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/workflows/docs-preview-*.yaml"
      - "ISSUE_TEMPLATE/**"
      - ".github/ISSUE_TEMPLATE/**"

permissions:
  contents: read

concurrency:
  group: macos-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-e2e:
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: npm

      - name: Show environment
        run: |
          set -euo pipefail
          echo "Runner: $(uname -a)"
          echo "Arch:   $(uname -m)"
          sw_vers
          node --version
          npm --version

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Build CLI TypeScript modules
        run: npm run build:cli

      - name: Install and build plugin
        run: |
          set -euo pipefail
          cd nemoclaw
          npm ci --ignore-scripts
          npm run build

      - name: Run gateway lifecycle regressions
        run: >-
          npx vitest run --project integration
          test/tunnel-gateway-port-release-runtime.test.ts
          test/onboard-gateway-prelaunch-cutover.test.ts
          test/onboard-gateway-legacy-identity-upgrade-runtime.test.ts

      - name: Prepare Docker availability
        id: docker
        env:
          TRUSTED_MACOS_LIVE: ${{ github.event_name != 'pull_request' && '1' || '0' }}
        run: |
          set -euo pipefail
          if docker info >/dev/null 2>&1; then
            echo "docker_ok=true" >> "$GITHUB_OUTPUT"
            echo "Docker is available"
            docker version
            exit 0
          fi

          if [ "$TRUSTED_MACOS_LIVE" != "1" ]; then
            echo "docker_ok=false" >> "$GITHUB_OUTPUT"
            echo "Docker is unavailable; pull_request macOS runs skip secret-bearing live E2E."
            exit 0
          fi

          if ! command -v docker >/dev/null 2>&1 || ! command -v colima >/dev/null 2>&1; then
            echo "::warning::Docker/Colima is not preinstalled on this macOS runner; skipping live E2E instead of bootstrapping floating Homebrew packages before credentialed steps."
            echo "docker_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Do not install floating Homebrew packages before credentialed steps.
          # The hosted runner image is the Colima dependency boundary; record
          # its exact preinstalled version in every trusted run that uses it.
          colima version
          echo "Docker is unavailable; starting preinstalled Colima for trusted macOS live E2E."
          if ! colima start --cpu 4 --memory 8 --disk 80 --vm-type vz --mount-type virtiofs; then
            echo "::warning::Colima could not start Docker on this macOS runner; skipping live E2E."
            echo "docker_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! docker info; then
            echo "::warning::Docker remained unavailable after Colima startup; skipping live E2E."
            echo "docker_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "docker_ok=true" >> "$GITHUB_OUTPUT"
          docker version

      - name: Run macOS full E2E
        if: steps.docker.outputs.docker_ok == 'true' && github.event_name != 'pull_request'
        env:
          NVIDIA_INFERENCE_API_KEY: ${{ github.event_name != 'pull_request' && secrets.NVIDIA_INFERENCE_API_KEY || '' }}
          GITHUB_TOKEN: ${{ github.token }}
          NEMOCLAW_NON_INTERACTIVE: "1"
          NEMOCLAW_ACCEPT_THIRD_PARTY_SOFTWARE: "1"
          NEMOCLAW_RECREATE_SANDBOX: "1"
          NEMOCLAW_SANDBOX_NAME: "e2e-macos"
        run: |
          NEMOCLAW_RUN_LIVE_E2E=1 npx vitest run --project e2e-live test/e2e/live/full-e2e.test.ts --silent=false --reporter=default

      - name: Install OpenShell CLI for macOS sandbox operations
        if: steps.docker.outputs.docker_ok == 'true' && github.event_name != 'pull_request'
        run: bash scripts/install-openshell.sh

      - name: Run macOS final-destroy gateway cleanup E2E
        if: steps.docker.outputs.docker_ok == 'true' && github.event_name != 'pull_request'
        env:
          E2E_TARGET_ID: "sandbox-operations"
          E2E_ARTIFACT_DIR: ${{ github.workspace }}/e2e-artifacts/live/macos-sandbox-operations
          NEMOCLAW_CLI_BIN: ${{ github.workspace }}/bin/nemoclaw.js
          NEMOCLAW_RUN_LIVE_E2E: "1"
          NEMOCLAW_E2E_USE_HOSTED_INFERENCE: "1"
          NEMOCLAW_NON_INTERACTIVE: "1"
          NEMOCLAW_ACCEPT_THIRD_PARTY_SOFTWARE: "1"
          NEMOCLAW_POLICY_TIER: "open"
          NVIDIA_INFERENCE_API_KEY: ${{ github.event_name != 'pull_request' && secrets.NVIDIA_INFERENCE_API_KEY || '' }}
          OPENSHELL_GATEWAY: "nemoclaw"
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/.npm-global/bin:$PATH"
          npx vitest run --project e2e-live \
            test/e2e/live/sandbox-operations.test.ts \
            --silent=false --reporter=default

      - name: Explain skipped macOS live E2E
        if: steps.docker.outputs.docker_ok != 'true' || github.event_name == 'pull_request'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'Skipping secret-bearing macOS live E2E on pull_request; use trusted workflow_dispatch/push evidence for live validation.'
          elif [ "${{ steps.docker.outputs.docker_ok }}" != "true" ]; then
            echo 'Skipping macOS live E2E because Docker is unavailable on this runner.'
          fi
          echo 'The workflow still validated the NemoClaw build on macOS (Apple Silicon).'

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-e2e-logs
          path: |
            /tmp/nemoclaw-e2e-*.log
            ${{ github.workspace }}/e2e-artifacts/live
          if-no-files-found: ignore
