# Real Docker and OpenTofu tests that need only a Linux runner's Docker engine.
# `cargo ci live-docker` runs the same thing locally; see docs/contributing/testing.md.
name: Live / Docker
on:
  push:
    # Dispatch needs this file on the default branch; push a
    # run-live-docker/ branch to run it before merging.
    branches: [v1, run-live-docker/**]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-docker-${{ github.ref }}
  cancel-in-progress: false
jobs:
  live-docker:
    name: Live / Docker / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            platform: linux_arm64
          - runner: ubuntu-24.04
            platform: linux_amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      TEST_PLATFORM: ${{ matrix.platform }}
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          platform: ${{ matrix.platform }}
          save-cache: "false"
      - name: Build test executables
        run: cargo ci build
      - name: Build and verify bundle
        run: cargo ci bundle
      # The tests use local images by digest and load OCI archives, which need
      # Docker's containerd image store; hosted runners use the classic store.
      - name: Use the containerd image store
        run: |
          config=/etc/docker/daemon.json
          if [ -s "$config" ]; then current=$(sudo cat "$config"); else current='{}'; fi
          printf '%s' "$current" | jq '.features["containerd-snapshotter"] = true' | sudo tee "$config" >/dev/null
          sudo systemctl restart docker
          docker info --format '{{json .DriverStatus}}' | grep -q io.containerd.snapshotter.v1
      - name: Run Docker live tests
        run: cargo ci live-docker
      - name: Upload live test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-docker-${{ matrix.platform }}-${{ github.run_attempt }}
          path: target/nextest/live-docker/live-docker.xml
          if-no-files-found: ignore
          retention-days: 14
