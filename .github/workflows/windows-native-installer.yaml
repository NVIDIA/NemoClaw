name: CI / Native Windows Installer Candidate

# Finished installer publication requires explicit dispatch.
# The pinned legacy payload is used only by isolated diagnostic/profiling lanes.
on:
  workflow_dispatch:
    inputs:
      finished_windows_product_version:
        description: MSI product version for the finished preview (must be newer than the legacy preview)
        required: false
        default: "0.1.1"
        type: string
      run_windows_native_installer:
        description: Build the finished native OpenClaw preview installer, then test it
        required: false
        default: false
        type: boolean
      windows_native_diagnostic_source_run_id:
        description: Diagnostic only - reuse a package artifact built from this exact commit
        required: false
        default: ""
        type: string
      profile_native_windows:
        description: Diagnostic profiling of the exact installed f8 baseline only (no installer publication or comparison)
        required: false
        default: false
        type: boolean
      test_native_windows_runtime:
        description: Run native ownership and guardian controls with isolated MSI fixtures
        required: false
        default: false
        type: boolean
      probe_official_hermes_components:
        description: Run the selected official Hermes Windows probe without publishing an installer
        required: false
        default: false
        type: boolean
      official_hermes_phase:
        description: Official Hermes probe phase (requires the probe input above)
        required: false
        default: components
        type: choice
        options:
          - components
          - python
          - runtime
          - host-prerequisites
          - system-drive
          - application

permissions:
  actions: read
  contents: read

concurrency:
  group: windows-native-installer-${{ github.ref }}${{ inputs.run_windows_native_installer && inputs.windows_native_diagnostic_source_run_id == '' && '-finished-package' || inputs.test_native_windows_runtime && '-runtime-controls' || inputs.profile_native_windows && '-profiling' || inputs.probe_official_hermes_components && inputs.official_hermes_phase == 'python' && '-hermes-python' || inputs.probe_official_hermes_components && inputs.official_hermes_phase == 'runtime' && '-hermes-runtime' || inputs.probe_official_hermes_components && inputs.official_hermes_phase == 'application' && '-compiled-application' || inputs.probe_official_hermes_components && inputs.official_hermes_phase == 'host-prerequisites' && '-host-prerequisites' || inputs.probe_official_hermes_components && inputs.official_hermes_phase == 'system-drive' && '-system-drive' || inputs.probe_official_hermes_components && '-hermes-components' || inputs.windows_native_diagnostic_source_run_id != '' && '-package-diagnostic' || '' }}
  # Finish the in-flight artifact/evidence; keep only the latest queued request.
  cancel-in-progress: false

jobs:
  windows-finished-installer:
    name: Finished Windows OpenClaw preview installer (ARM64)
    needs: windows-compiled-application
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_windows_native_installer && inputs.windows_native_diagnostic_source_run_id == '' }}
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 120
    outputs:
      preview_id: ${{ steps.preview.outputs.artifact-id }}
    steps:
      - name: Check out the finished Windows application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          persist-credentials: false
      - name: Validate the dedicated finished preview request
        shell: pwsh
        env:
          PRODUCT_VERSION: ${{ inputs.finished_windows_product_version }}
          OTHER_COMPONENTS: ${{ inputs.probe_official_hermes_components }}
          OTHER_PROFILE: ${{ inputs.profile_native_windows }}
          OTHER_RUNTIME: ${{ inputs.test_native_windows_runtime }}
        run: |
          $parsedVersion = $null
          if ($env:PRODUCT_VERSION -cnotmatch '^[0-9]+\.[0-9]+\.[0-9]+$' -or -not [version]::TryParse($env:PRODUCT_VERSION, [ref]$parsedVersion) -or $parsedVersion -le [version]'0.1.0') {
            throw 'The finished preview needs an explicit MSI version newer than legacy 0.1.0.'
          }
          if (@($env:OTHER_COMPONENTS, $env:OTHER_PROFILE, $env:OTHER_RUNTIME) -contains 'true') {
            throw 'The finished preview requires its own explicit dispatch.'
          }
      - name: Download the exact same-run compiled OpenClaw unit
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.windows-compiled-application.outputs.application_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/finished-windows/application
      - name: Download the exact same-run application executable and workers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.windows-compiled-application.outputs.runtime_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/finished-windows/runtime
      - name: Prepare pinned native Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.95.0-aarch64-pc-windows-msvc
          target: aarch64-pc-windows-msvc
          cache: false
          rustflags: ""
      - name: Prepare pinned native .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.419
      - name: Prepare build-only Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.1.0
        with:
          python-version: 3.13.13
          architecture: arm64
      - name: Check exact helper-proof consumption controls
        shell: pwsh
        run: |
          & python -m unittest discover -s "$env:GITHUB_WORKSPACE\candidate\packaging\windows\installer" -p 'test_verify_system_drive_proof.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'The helper-proof consumption controls failed.' }
          & python -m unittest discover -s "$env:GITHUB_WORKSPACE\candidate\packaging\windows\installer" -p 'test_materialize_compiled_executable.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'The compiled artifact materialization controls failed.' }
      - name: Reuse only the exact reviewed OpenShell host binaries
        shell: pwsh
        run: |
          $work = "$env:RUNNER_TEMP\finished-windows"
          $msi = "$work\host-source.msi"
          Invoke-WebRequest -UseBasicParsing -TimeoutSec 180 `
            -Uri 'https://media.githubusercontent.com/media/NVIDIA/NemoClaw/8856ce6f0263ca55427924e64605b700a7bed6b5/NemoClaw-0.1.0-windows-arm64.msi' -OutFile $msi
          if ((Get-Item -LiteralPath $msi).Length -ne 259973780 -or `
              (Get-FileHash -LiteralPath $msi -Algorithm SHA256).Hash.ToLowerInvariant() -cne '2eadf86ba80fbfbb0b84803c32835fcfff0a33a19e2629ead346610db8fb6a8c') {
            throw 'The immutable native-host source MSI failed verification.'
          }
          $extractor = "$env:ProgramFiles\7-Zip\7z.exe"
          if (-not (Test-Path -LiteralPath $extractor -PathType Leaf)) { throw 'The Windows CI image is missing its explicit7-Zip extraction tool.' }
          & python "$env:GITHUB_WORKSPACE\candidate\packaging\windows\installer\extract-openshell-host.py" `
            --msi $msi --seven-zip $extractor --source-root "$env:GITHUB_WORKSPACE\candidate" --source-revision $env:GITHUB_SHA `
            --output "$work\openshell-binaries" --scratch "$work\native-extract"
          if ($LASTEXITCODE -ne 0) { throw 'The two-file native host extraction failed.' }
      - name: Prepare native host files without any legacy agent tree
        shell: pwsh
        run: |
          $work = "$env:RUNNER_TEMP\finished-windows"
          & python "$env:GITHUB_WORKSPACE\candidate\packaging\windows\installer\prepare-finished-host.py" `
            --source-root "$env:GITHUB_WORKSPACE\candidate" --openshell-binaries "$work\openshell-binaries" `
            --node-root "$work\application\node" --output "$work\host" --cache "$work\downloads"
          if ($LASTEXITCODE -ne 0) { throw 'Native host input preparation failed.' }
      - name: Build and prove the exact native system-drive prerequisite
        shell: pwsh
        run: |
          $work = "$env:RUNNER_TEMP\finished-windows"
          $owner = "$env:GITHUB_WORKSPACE\candidate\packaging\windows\host-preparation"
          & "$owner\build-helper.ps1" -OutputDirectory "$work\system-drive-helper"
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -File "$owner\test-system-root-mxc.ps1" `
            -HelperPath "$work\system-drive-helper\NemoClawHostPreparation.exe" -MxcDirectory "$work\host\mxc" `
            -NodePath "$work\host\bin\node.exe" -ArtifactDirectory "$work\system-drive-proof"
          if ($LASTEXITCODE -ne 0) { throw 'The exact helper did not pass actual system-root and contained Node proof.' }
      - name: Seal the finished application and selected OpenClaw resources
        shell: pwsh
        run: |
          $work = "$env:RUNNER_TEMP\finished-windows"
          $owner = "$env:GITHUB_WORKSPACE\candidate\packaging\windows\installer"
          $inputs = @("$work\host\runtime-payload-receipt.json", "$work\application\build\app\openclaw-resource-closure.json", "$work\runtime\workers\build.json", "$work\runtime\executable\build.json")
          $identityText = ($inputs | ForEach-Object { (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant() }) -join "`n"
          $component = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($identityText))).ToLowerInvariant()
          & python "$owner\assign_runtime_namespace.py" --receipt "$work\namespace.json" --source-revision $env:GITHUB_SHA --component-identity $component
          if ($LASTEXITCODE -ne 0) { throw 'Immutable namespace assignment failed.' }
          & python "$owner\assemble_runtime.py" --output "$work\assembled" `
            --agent "openclaw=$work\application\build\app" --shared-node "$work\host\bin\node.exe" `
            --node-version 22.23.2 --source-revision $env:GITHUB_SHA --component-identity $component `
            --namespace-receipt "$work\namespace.json" --worker-build "$work\runtime\workers" --executable-build "$work\runtime\executable"
          if ($LASTEXITCODE -ne 0) { throw 'The finished runtime could not be sealed.' }
      - name: Build the finished WPF, guarded launcher, transactional MSI and Burn preview
        shell: pwsh
        env:
          PRODUCT_VERSION: ${{ inputs.finished_windows_product_version }}
        run: |
          $work = "$env:RUNNER_TEMP\finished-windows"
          $tools = "$work\tools"
          New-Item -ItemType Directory -Path $tools | Out-Null
          [IO.File]::WriteAllText("$work\global.json", '{"sdk":{"version":"8.0.419","rollForward":"disable","allowPrerelease":false}}', [Text.UTF8Encoding]::new($false))
          Push-Location $work
          $config = "$tools\NuGet.Config"
          [IO.File]::WriteAllText($config, '<configuration><packageSources><clear/><add key="nuget.org" value="https://api.nuget.org/v3/index.json" /></packageSources></configuration>', [Text.UTF8Encoding]::new($false))
          & dotnet tool install wix --version 5.0.2 --tool-path $tools --configfile $config
          if ($LASTEXITCODE -ne 0) { throw 'The pinned WiX tool could not be prepared.' }
          & "$env:GITHUB_WORKSPACE\candidate\packaging\windows\installer\build-immutable-package.ps1" `
            -SourceRoot "$env:GITHUB_WORKSPACE\candidate" -SourceRevision $env:GITHUB_SHA -ProductVersion $env:PRODUCT_VERSION `
            -HostPayloadRoot "$work\host" -RuntimeAssemblyRoot "$work\assembled" -OutputDirectory "$work\package" `
            -PythonPath (Get-Command python.exe -CommandType Application | Select-Object -First 1).Source `
            -DotNetPath (Get-Command dotnet.exe -CommandType Application | Select-Object -First 1).Source -WixPath "$tools\wix.exe" `
            -SystemDrivePrepPath "$work\system-drive-helper\NemoClawHostPreparation.exe" `
            -SystemDriveBuildReceipt "$work\system-drive-helper\build-receipt.json" -SystemDriveProofDirectory "$work\system-drive-proof"
          Pop-Location
      - name: Publish the downloadable preview before installed acceptance
        id: preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: finished-windows-preview-${{ github.sha }}
          path: |
            ${{ runner.temp }}/finished-windows/package/*.exe
            ${{ runner.temp }}/finished-windows/package/*.msi
            ${{ runner.temp }}/finished-windows/package/*.json
            ${{ runner.temp }}/finished-windows/assembled/runtime-identity.json
          if-no-files-found: error
      - name: Preserve finished build and helper proof evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: finished-windows-preview-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/finished-windows/host/runtime-payload-receipt.json
            ${{ runner.temp }}/finished-windows/assembled/*.json
            ${{ runner.temp }}/finished-windows/package/*.json
            ${{ runner.temp }}/finished-windows/package/build/*.log
            ${{ runner.temp }}/finished-windows/*.log
            ${{ runner.temp }}/finished-windows/openshell-binaries/openshell-reuse.json
            ${{ runner.temp }}/finished-windows/native-extract/*.log
            ${{ runner.temp }}/finished-windows/system-drive-helper/build-receipt.json
            ${{ runner.temp }}/finished-windows/system-drive-helper/build.log
            ${{ runner.temp }}/finished-windows/system-drive-proof/
          if-no-files-found: warn
          retention-days: 14


  windows-finished-installed-acceptance:
    name: Fresh-runner finished Windows preview acceptance (ARM64)
    needs: [windows-finished-installer, windows-compiled-application]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_windows_native_installer && inputs.windows_native_diagnostic_source_run_id == '' }}
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 60
    steps:
      - name: Check out only the installed acceptance controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          persist-credentials: false
      - name: Download the exact same-run preview and runtime identity
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.windows-finished-installer.outputs.preview_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/finished-windows
      - name: Download trusted CI Node and browser automation resources
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.windows-compiled-application.outputs.application_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/finished-windows/application
      - name: Exercise the installed preview, real inference and owned cleanup
        shell: pwsh
        env:
          PRODUCT_VERSION: ${{ inputs.finished_windows_product_version }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_INFERENCE_API_KEY: ${{ secrets.NVIDIA_INFERENCE_API_KEY }}
        run: |
          $work = "$env:RUNNER_TEMP\finished-windows"
          $setup = "$work\package\NemoClawSetup-$env:PRODUCT_VERSION-windows-arm64.exe"
          $installation = "$env:ProgramFiles\NVIDIA\NemoClaw"
          if (Test-Path -LiteralPath $installation) { throw 'Fresh preview acceptance requires no preexisting NemoClaw installation.' }
          $primary = $null
          $build = Get-Content -LiteralPath "$work\package\immutable-package-build.json" -Raw | ConvertFrom-Json
          if ($build.sourceRevision -cne $env:GITHUB_SHA -or $build.status -cne 'candidate-built-for-installed-qualification') { throw 'The preview build receipt differs from this acceptance source.' }
          foreach ($file in $build.files) {
            $path = Join-Path "$work\package" $file.file
            if ([IO.Path]::GetFileName([string]$file.file) -cne $file.file -or
                (Get-Item -LiteralPath $path).Length -ne $file.bytes -or
                (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -cne $file.sha256) {
              throw 'The downloaded preview executable/MSI differs from its build receipt.'
            }
          }
          $timings = [ordered]@{ schemaVersion = 1; sourceRevision = $env:GITHUB_SHA; measurement = 'fresh-runner-installed-preview';
            hostPreparationRunBeforeInstall = $false; upgradeMeasured = $false; compiledMsi = $build.compiledMsi; stages = [ordered]@{} }
          function Invoke-OwnedSetup([string]$Action, [string]$Log) {
            $info = [Diagnostics.ProcessStartInfo]::new()
            $info.FileName = $setup; $info.UseShellExecute = $false; $info.CreateNoWindow = $true
            foreach ($value in @($Action, '-quiet', '-norestart', '-log', $Log)) { $info.ArgumentList.Add($value) }
            $clock = [Diagnostics.Stopwatch]::StartNew()
            $process = [Diagnostics.Process]::Start($info)
            try { $process.WaitForExit(); $code = $process.ExitCode } finally { $process.Dispose() }
            $timings.stages[$Action] = @{ elapsedMilliseconds = $clock.ElapsedMilliseconds; exitCode = $code }
            if ($code -ne 0) { throw "Finished preview $Action failed with status $code." }
          }
          try {
            Invoke-OwnedSetup '-install' "$work\install.log"
            $timings['startupComparisonAvailable'] = $false
            foreach ($case in @(
              @{ name = 'firstInstalledLaunch'; directory = 'installed-acceptance' },
              @{ name = 'warmInstalledLaunch'; directory = 'installed-acceptance-warm' }
            )) {
              & "$work\application\node\node.exe" --experimental-strip-types `
                "$env:GITHUB_WORKSPACE\candidate\packaging\windows\installer\qualify-installed-openclaw.mts" `
                --install-root $installation --runtime-identity "$work\assembled\runtime-identity.json" `
                --output "$work\$($case.directory)" --browser-driver-root "$work\application\build\app\node_modules\playwright-core"
              $code = $LASTEXITCODE
              $timings[$case.name] = @{ exitCode = $code; receipt = "$($case.directory)/installed-openclaw-acceptance.json";
                modelAndToolDurationsSeparate = $true; agentStateResetPerCase = $true }
              if ($code -ne 0) { throw "The $($case.name) OpenClaw acceptance failed; no startup comparison is claimed." }
              $accepted = Get-Content -LiteralPath "$work\$($case.directory)\installed-openclaw-acceptance.json" -Raw | ConvertFrom-Json
              if ($accepted.verdict -cne 'pass' -or @($accepted.cleanupErrors).Count -ne 0) {
                throw 'Ordinary launch did not finish its required model/tool checks and owned cleanup.'
              }
            }
            $timings.startupComparisonAvailable = $true
            & "$work\application\node\node.exe" --experimental-strip-types `
              "$env:GITHUB_WORKSPACE\candidate\packaging\windows\installer\qualify-finished-package.mts" `
              --install-root "$env:ProgramFiles\NVIDIA\NemoClaw" --runtime-identity "$work\assembled\runtime-identity.json" --output "$work\installed-smoke"
            if ($LASTEXITCODE -ne 0) { throw 'The installed compiled/contained smoke failed.' }
          } catch { $primary = $_ }
          finally {
            # Enumerate only after launch samples, so counting does not warm startup paths.
            try {
              if (Test-Path -LiteralPath $installation) {
                $installedFiles = @(Get-ChildItem -LiteralPath $installation -Recurse -File)
                $timings['installedInventory'] = @{ fileCount = $installedFiles.Count;
                  bytes = [long](($installedFiles | Measure-Object -Property Length -Sum).Sum);
                  componentCount = $build.compiledMsi.componentCount; componentCountSource = 'compiled-msi-Component-table';
                  observation = 'after-application-checks-before-uninstall'; contentHashesRead = $false }
              }
            } catch { if ($null -eq $primary) { $primary = $_ } else { Write-Warning 'The original failure is preserved; installed counts also failed.' } }
            try {
              Invoke-OwnedSetup '-uninstall' "$work\uninstall.log"
              $timings['installationRootRemoved'] = -not (Test-Path -LiteralPath $installation)
            } catch { if ($null -eq $primary) { $primary = $_ } else { Write-Warning 'The original failure is preserved; preview cleanup also failed.' } }
          }
          try { [IO.File]::WriteAllText("$work\installed-stage-timings.json", ($timings | ConvertTo-Json -Depth 5), [Text.UTF8Encoding]::new($false)) }
          catch { if ($null -eq $primary) { $primary = $_ } else { Write-Warning 'The original failure is preserved; timing evidence also could not be saved.' } }
          if ($null -ne $primary) { throw $primary }
      - name: Preserve fresh install, application and uninstall evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: finished-windows-installed-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/finished-windows/installed-smoke/
            ${{ runner.temp }}/finished-windows/installed-acceptance/
            ${{ runner.temp }}/finished-windows/installed-acceptance-warm/
            ${{ runner.temp }}/finished-windows/installed-stage-timings.json
            ${{ runner.temp }}/finished-windows/*.log
            ${{ runner.temp }}/finished-windows/package/*.json
          if-no-files-found: warn
          retention-days: 14

  windows-compiled-application:
    name: Compile Windows application units (ARM64)
    outputs:
      application_id: ${{ steps.finished_application.outputs.artifact-id }}
      runtime_id: ${{ steps.finished_runtime.outputs.artifact-id }}
    if: ${{ github.event_name == 'workflow_dispatch' && ((inputs.run_windows_native_installer && inputs.windows_native_diagnostic_source_run_id == '') || (inputs.probe_official_hermes_components && inputs.official_hermes_phase == 'application')) }}
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 30
    steps:
      - name: Check out Windows application packaging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare the pinned native application compiler
        shell: pwsh
        run: |
          & packaging/windows/app/prepare-app-node.ps1 `
            -LockPath packaging/windows/hermes/official-runtime.lock.json `
            -OutputDirectory "$env:RUNNER_TEMP\compiled-windows-app\node"
      - name: Restore immutable application build inputs
        shell: pwsh
        run: |
          python packaging/windows/app/materialize-openclaw-build.py `
            --output "$env:RUNNER_TEMP\compiled-windows-app\inputs" `
            --cache "$env:RUNNER_TEMP\compiled-windows-app\downloads"
          if ($LASTEXITCODE -ne 0) { throw 'Application build inputs failed verification.' }
      - name: Verify Windows native plugin file URL loading
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\compiled-windows-app\node\node.exe" `
            --experimental-strip-types packaging/windows/app/test-windows-plugin-file-url.mts `
            --source-root "$env:RUNNER_TEMP\compiled-windows-app\inputs\openclaw"
          if ($LASTEXITCODE -ne 0) { throw 'Windows native plugin loading controls failed.' }
          & "$env:RUNNER_TEMP\compiled-windows-app\node\node.exe" `
            --experimental-strip-types packaging/windows/app/test-windows-update-owner.mts `
            --source-root "$env:RUNNER_TEMP\compiled-windows-app\inputs\openclaw"
          if ($LASTEXITCODE -ne 0) { throw 'Installer-owned update controls failed.' }
      - name: Compile the OpenClaw application unit
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\compiled-windows-app\node\node.exe" `
            --experimental-strip-types --max-old-space-size=8192 `
            packaging/windows/app/build-openclaw-app.mts `
            --source-root "$env:RUNNER_TEMP\compiled-windows-app\inputs\openclaw" `
            --tool-root "$env:RUNNER_TEMP\compiled-windows-app\inputs\tools" `
            --output "$env:RUNNER_TEMP\compiled-windows-app\build"
          if ($LASTEXITCODE -ne 0) { throw 'The Windows application compilation failed.' }
      - name: Execute the compiled application through its CLI and Worker API
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\compiled-windows-app\node\node.exe" `
            --experimental-strip-types packaging/windows/app/test-compiled-openclaw.mts `
            --app-root "$env:RUNNER_TEMP\compiled-windows-app\build\app" `
            --output "$env:RUNNER_TEMP\compiled-windows-app\controls"
          if ($LASTEXITCODE -ne 0) { throw 'The compiled Windows application controls failed.' }
      - name: Verify the compiled dashboard and packaged resources in a real browser
        shell: pwsh
        run: |
          $work = "$env:RUNNER_TEMP\compiled-windows-app"
          $browsers = @(
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe",
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe"
          )
          $browser = $browsers | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $browser) { throw 'The Windows runner has no preinstalled browser for dashboard validation.' }
          & "$work\node\node.exe" --experimental-strip-types `
            packaging/windows/app/test-compiled-openclaw-gateway.mts `
            --app-root "$work\build\app" --output "$work\gateway-control" `
            --browser-executable $browser
          if ($LASTEXITCODE -ne 0) { throw 'The compiled Windows dashboard or resource control failed.' }
      - name: Prepare the pinned executable resource injector
        shell: pwsh
        run: |
          python packaging/windows/distribution/prepare-executable-tools.py `
            --output "$env:RUNNER_TEMP\compiled-windows-app\executable-tools" `
            --cache "$env:RUNNER_TEMP\compiled-windows-app\downloads"
          if ($LASTEXITCODE -ne 0) { throw 'Executable build tools failed verification.' }
      - name: Compile the native application dispatcher and static workers
        shell: pwsh
        run: |
          $work = "$env:RUNNER_TEMP\compiled-windows-app"
          New-Item -ItemType Junction -Path "$work\inputs\tools\node_modules\typescript" `
            -Target "$work\inputs\openclaw\node_modules\typescript" | Out-Null
          New-Item -ItemType Junction -Path "$env:GITHUB_WORKSPACE\node_modules" `
            -Target "$work\inputs\tools\node_modules" | Out-Null
          & "$work\node\node.exe" --experimental-strip-types `
            packaging/windows/distribution/build-native-workers.mts "$work\workers"
          if ($LASTEXITCODE -ne 0) { throw 'Static application worker compilation failed.' }
      - name: Build and execute the Windows application EXE
        shell: pwsh
        run: |
          $work = "$env:RUNNER_TEMP\compiled-windows-app"
          & "$work\node\node.exe" --experimental-strip-types `
            packaging/windows/distribution/prepare-native-executable.mts `
            "$work\workers\native-runtime.cjs" `
            "$work\executable-tools\postject\dist\api.js" "$work\executable"
          if ($LASTEXITCODE -ne 0) { throw 'The Windows application EXE build or execution failed.' }
      - name: Preserve the Windows executable proof
        id: finished_runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-windows-runtime-executable-${{ github.sha }}
          path: |
            ${{ runner.temp }}/compiled-windows-app/executable/NemoClaw.Runtime.exe
            ${{ runner.temp }}/compiled-windows-app/executable/build.json
            ${{ runner.temp }}/compiled-windows-app/executable/execution.json
            ${{ runner.temp }}/compiled-windows-app/workers/
          if-no-files-found: error
      - name: Preserve compiled application units
        id: finished_application
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compiled-windows-application-${{ github.sha }}
          path: |
            ${{ runner.temp }}/compiled-windows-app/build/app/
            ${{ runner.temp }}/compiled-windows-app/build/build-receipt.json
            ${{ runner.temp }}/compiled-windows-app/node/node.exe
            ${{ runner.temp }}/compiled-windows-app/node/LICENSE
            ${{ runner.temp }}/compiled-windows-app/node/node-input.json
          if-no-files-found: error
          include-hidden-files: true
      - name: Preserve application build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compiled-windows-application-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/compiled-windows-app/controls/
            ${{ runner.temp }}/compiled-windows-app/gateway-control/
            ${{ runner.temp }}/compiled-windows-app/workers/build.json
            ${{ runner.temp }}/compiled-windows-app/workers/source-adaptation.json
            ${{ runner.temp }}/compiled-windows-app/executable/*.json
            ${{ runner.temp }}/compiled-windows-app/executable/*.log
            ${{ runner.temp }}/compiled-windows-app/executable-tools/tools-input.json
            ${{ runner.temp }}/compiled-windows-app/build/diagnostics/
            ${{ runner.temp }}/compiled-windows-app/build/build-receipt.json
            ${{ runner.temp }}/compiled-windows-app/build/build-failure.json
            ${{ runner.temp }}/compiled-windows-app/inputs/materialization-receipt.json
            ${{ runner.temp }}/compiled-windows-app/node/node-input.json
          if-no-files-found: error
          retention-days: 14

  windows-system-drive-proof:
    name: Native system-drive preparation and MXC proof (ARM64)
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.run_windows_native_installer && inputs.probe_official_hermes_components && inputs.official_hermes_phase == 'system-drive' }}
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 12
    steps:
      - name: Check out the fixed-purpose Windows helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned native Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.95.0
          target: aarch64-pc-windows-msvc
          cache: false
      - name: Prepare only the pinned Node and MXC executables
        shell: pwsh
        run: |
          $work = "$env:RUNNER_TEMP\system-drive-inputs"
          & packaging/windows/app/prepare-app-node.ps1 `
            -LockPath packaging/windows/hermes/official-runtime.lock.json -OutputDirectory "$work\node"
          $archive = "$work\mxc-sdk.tgz"
          Invoke-WebRequest 'https://registry.npmjs.org/@microsoft/mxc-sdk/-/mxc-sdk-0.8.0.tgz' -OutFile $archive -TimeoutSec 60
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne '06bb2399d7e98ab1907acf851e12a4e44748dd467b79d3e53c2f2fbf569da14e') {
            throw 'The MXC SDK differs from its immutable archive.'
          }
          & "$env:SystemRoot\System32\tar.exe" -xzf $archive -C $work package/bin/arm64/wxc-exec.exe package/bin/arm64/wxc-host-prep.exe
          if ($LASTEXITCODE -ne 0) { throw 'The two pinned MXC executables could not be extracted.' }
      - name: Compile and exercise the native metadata helper
        shell: pwsh
        run: |
          $work = "$env:RUNNER_TEMP\host-preparation-helper"
          & packaging/windows/host-preparation/build-helper.ps1 -OutputDirectory $work
          & rustup run 1.95.0-aarch64-pc-windows-msvc cargo test --locked --offline `
            --target aarch64-pc-windows-msvc --manifest-path packaging/windows/host-preparation/Cargo.toml `
            --target-dir "$work\rust-target" -- --test-threads=1 2>&1 | Tee-Object -FilePath "$work\native-controls.log"
          if ($LASTEXITCODE -ne 0) { throw 'The actual native metadata controls failed.' }
      - name: Verify the actual system root and contained Node access
        shell: pwsh
        run: |
          & packaging/windows/host-preparation/test-system-root-mxc.ps1 `
            -HelperPath "$env:RUNNER_TEMP\host-preparation-helper\NemoClawHostPreparation.exe" `
            -MxcDirectory "$env:RUNNER_TEMP\system-drive-inputs\package\bin\arm64" `
            -NodePath "$env:RUNNER_TEMP\system-drive-inputs\node\node.exe" `
            -ArtifactDirectory "$env:RUNNER_TEMP\system-root-mxc-proof"
      - name: Preserve fixed-purpose preparation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-system-drive-mxc-proof-${{ github.sha }}
          path: |
            ${{ runner.temp }}/host-preparation-helper/*.json
            ${{ runner.temp }}/host-preparation-helper/*.log
            ${{ runner.temp }}/host-preparation-helper/NemoClawHostPreparation.exe
            ${{ runner.temp }}/system-root-mxc-proof/
            ${{ runner.temp }}/system-drive-inputs/node/node-input.json
          if-no-files-found: error
          retention-days: 14

  windows-host-prerequisite-proof:
    name: Isolated Windows directory permission proof (ARM64)
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.run_windows_native_installer && inputs.probe_official_hermes_components && inputs.official_hermes_phase == 'host-prerequisites' }}
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 10
    steps:
      - name: Check out the Windows packaging controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build isolated permission controls
        id: permission-controls-build
        shell: pwsh
        run: |
          dotnet build packaging/windows/tests/host-prerequisites/HandleAcl.Controls.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'The isolated permission controls did not build.' }
      - name: Measure intended metadata handling and directory enumeration
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\packaging\windows\tests\host-prerequisites\test-capture-process.ps1"
          & "$env:GITHUB_WORKSPACE\packaging\windows\tests\host-prerequisites\measure-directory-enumeration.ps1" `
            -ArtifactDirectory "$env:RUNNER_TEMP\handle-acl-large"
      - name: Exercise permission handling on disposable directories
        if: ${{ always() && steps.permission-controls-build.outcome == 'success' }}
        shell: pwsh
        run: |
          dotnet run --project packaging/windows/tests/host-prerequisites/HandleAcl.Controls.csproj `
            --configuration Release --no-build -- "$env:RUNNER_TEMP\handle-acl-proof"
          if ($LASTEXITCODE -ne 0) { throw 'The isolated directory permission proof failed.' }
      - name: Preserve the permission proof result
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-directory-permission-proof-${{ github.sha }}
          path: |
            ${{ runner.temp }}/handle-acl-proof/handle-acl-proof.json
            ${{ runner.temp }}/handle-acl-large/*.json
            ${{ runner.temp }}/handle-acl-large/*.etl
            ${{ runner.temp }}/handle-acl-large/*.xml
            ${{ runner.temp }}/handle-acl-large/*.txt
            ${{ runner.temp }}/handle-acl-large/*.log
            ${{ runner.temp }}/handle-acl-large/measurement/*.json
          if-no-files-found: error

  windows-native-package-diagnostic:
    name: Windows native package/runtime diagnostic (ARM64, no WSL)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_windows_native_installer && !inputs.test_native_windows_runtime && !inputs.profile_native_windows && !inputs.probe_official_hermes_components && inputs.windows_native_diagnostic_source_run_id != '' }}
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 90
    steps:
      - name: Check out diagnostic scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Download and probe the recorded package
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.windows_native_diagnostic_source_run_id }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if ($env:SOURCE_RUN_ID -cnotmatch '^[1-9][0-9]{5,19}$') {
            throw 'The diagnostic source run ID is invalid.'
          }
          $artifactRoot = [IO.Path]::GetFullPath("$env:RUNNER_TEMP\windows-native-package-diagnostic")
          $packageRoot = [IO.Path]::GetFullPath("$env:RUNNER_TEMP\windows-native-package-diagnostic-source")
          [IO.Directory]::CreateDirectory($artifactRoot) | Out-Null
          [IO.Directory]::CreateDirectory($packageRoot) | Out-Null
          $run = & gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.head_repository.full_name -cne $env:GITHUB_REPOSITORY) {
            throw 'The diagnostic source run is not an exact run from this repository.'
          }
          if ($run.head_sha -cne $env:GITHUB_SHA) {
            throw 'This diagnostic requires a package built from the current commit, including its native ownership and ConPTY helpers. Run the full native build with windows_native_diagnostic_source_run_id empty, then reuse that run ID. Older package artifacts cannot be upgraded by overlaying runtime scripts.'
          }
          $artifacts = & gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN_ID/artifacts?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not list diagnostic source artifacts.'
          }
          $matches = @($artifacts.artifacts | Where-Object {
            $_.name.StartsWith("windows-native-download-source-$($run.head_sha)", [StringComparison]::Ordinal)
          })
          if ($matches.Count -ne 1 -or $matches[0].expired) {
            throw 'The diagnostic source run does not contain one live exact-head package artifact.'
          }
          & gh run download $env:SOURCE_RUN_ID `
            --repo $env:GITHUB_REPOSITORY `
            --name $matches[0].name `
            --dir $packageRoot
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not download the diagnostic source package.'
          }
          $manifest = Get-Content -LiteralPath (Join-Path $packageRoot 'package-manifest.json') -Raw | ConvertFrom-Json
          $version = [string]$manifest.productVersion
          $setup = Join-Path $packageRoot "NemoClawSetup-$version-windows-arm64.exe"
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) {
            throw 'The exact-head diagnostic setup executable is missing.'
          }
          $log = Join-Path $artifactRoot 'bundle-startup.log'
          $startedAt = [DateTime]::Now
          $arguments = @('/install', '/quiet', '/norestart', '/log', $log)
          $process = Start-Process -FilePath $setup -ArgumentList $arguments -PassThru
          $setupExitCode = $null
          try {
            if (-not $process.WaitForExit(1200000)) {
              & "$env:SystemRoot\System32\taskkill.exe" /PID $process.Id /T /F | Out-Null
              'setup_timed_out_after_seconds=1200' | Out-File -LiteralPath (Join-Path $artifactRoot 'probe-result.txt') -Encoding utf8
            } else {
              $setupExitCode = $process.ExitCode
              "setup_exit_code=$setupExitCode" | Out-File -LiteralPath (Join-Path $artifactRoot 'probe-result.txt') -Encoding utf8
            }
          } finally {
            $process.Dispose()
          }
          if ($null -eq $setupExitCode) {
            throw 'The diagnostic setup executable did not exit within 1200 seconds.'
          }
          if ($setupExitCode -ne 0) {
            throw "The diagnostic setup executable failed with exit code $setupExitCode."
          }
          if ($setupExitCode -eq 0) {
            $installRoot = Join-Path $env:ProgramFiles 'NVIDIA\NemoClaw'
            $installedQualificationRoot = Join-Path $installRoot 'qualification'
            $candidateQualificationRoot = Join-Path $env:GITHUB_WORKSPACE 'candidate\packaging\windows\runtime'
            $candidateQualifications = @(Get-ChildItem `
              -LiteralPath $candidateQualificationRoot `
              -Filter 'run-installed-native-*.mts' `
              -File)
            if ($candidateQualifications.Count -ne 6) {
              throw 'The candidate native runtime qualification set is incomplete.'
            }
            foreach ($nativeSupport in (Get-ChildItem -LiteralPath $candidateQualificationRoot -Filter 'native-*' -File)) {
              Copy-Item -LiteralPath $nativeSupport.FullName -Destination (Join-Path $installedQualificationRoot $nativeSupport.Name) -Force
            }
            foreach ($candidateQualification in $candidateQualifications) {
              Copy-Item `
                -LiteralPath $candidateQualification.FullName `
                -Destination (Join-Path $installedQualificationRoot $candidateQualification.Name) `
                -Force
            }
            $deepAgentsSitePackages = Join-Path $installRoot 'deepagents\site-packages'
            $langGraphLogging = Join-Path $deepAgentsSitePackages 'langgraph_api\logging.py'
            $langGraphApi = Join-Path $deepAgentsSitePackages 'langgraph_api\api\__init__.py'
            $langGraphCheckpointer = Join-Path $deepAgentsSitePackages 'langgraph_api\_checkpointer\_adapter.py'
            $langGraphStream = Join-Path $deepAgentsSitePackages 'langgraph_api\stream.py'
            $langGraphPatch = Join-Path $env:GITHUB_WORKSPACE 'candidate\packaging\windows\python\langgraph-api-0.14.0.dev3-python313.patch'
            $langGraphNoGrpcPatch = Join-Path $env:GITHUB_WORKSPACE 'candidate\packaging\windows\python\langgraph-api-0.14.0.dev3-inmemory-no-grpc.patch'
            $langChainQuickJsPatch = Join-Path $env:GITHUB_WORKSPACE 'candidate\packaging\windows\python\langchain-quickjs-0.3.5-no-bsdiff.patch'
            $deepAgentsWindowsDaclPatch = Join-Path $env:GITHUB_WORKSPACE 'candidate\packaging\windows\python\deepagents-code-0.1.55-windows-dacl.patch'
            $langGraphSourceDigest = '5754429ea54bb8cbc9b6b062c8c30b7da11d6d2de4e40d8cf149e1af815451d4' # gitleaks:allow -- public wheel source integrity pin
            $langGraphPatchedDigest = '862a676aad507986ce65ba6805feae97406508f994d25b2e4fcdfafc1b366874' # gitleaks:allow -- deterministic compatibility output pin
            $langGraphApiSourceDigest = '66ed5ec37771619bbb70b4408e7fba1dc626b6e40176286554530a309efb6377' # gitleaks:allow -- public wheel source integrity pin
            $langGraphApiPatchedDigest = '7faa1904d664bcc1c99d69da0f44d2fd36eaca87ad72d4aa1215f83b45aadb0e' # gitleaks:allow -- deterministic compatibility output pin
            $langGraphCheckpointerSourceDigest = 'd63262d2f5e834a782c0d3f6e96f1b998af07be7ce585a9ea67a2f605b75e16d' # gitleaks:allow -- public wheel source integrity pin
            $langGraphCheckpointerPatchedDigest = 'f34ea4982d5a2623e8e38fa324142441d355639cc0340fc76a0a6c052fed0b8b' # gitleaks:allow -- deterministic compatibility output pin
            $langGraphStreamSourceDigest = '6a88d50614d34189d3a77d5d852d4479b889c88307bb1ccb52b9d1ef845c06e3' # gitleaks:allow -- public wheel source integrity pin
            $langGraphStreamPatchedDigest = 'f9128fa986c46015d5391fbb3c944f5678c06597f09b4f9630e208bb297cc96f' # gitleaks:allow -- deterministic compatibility output pin
            $langChainQuickJsSnapshotSourceDigest = '616cbc40402b7b414fcbac1992113bab6310974883b01a9f89fba8ce621b1e3d' # gitleaks:allow -- public wheel source integrity pin
            $langChainQuickJsSnapshotPatchedDigest = 'd81ca8b46daeb56d1749e3dfb84f3590a88a8903021c2aba2c190f0dacc390e9' # gitleaks:allow -- deterministic compatibility output pin
            $deepAgentsOffloadSourceDigest = 'baaf2a75eca26dbc58ab195ed9198822c3e48fd505faa36b8e0c0cb10ede3f14' # gitleaks:allow -- public wheel source integrity pin
            $deepAgentsOffloadPatchedDigest = '7e458382b98deef102f2ee667ee2e2e242de10c3ecda67b411bd92199c93a813' # gitleaks:allow -- deterministic compatibility output pin
            $langGraphDigest = (Get-FileHash -LiteralPath $langGraphLogging -Algorithm SHA256).Hash.ToLowerInvariant()
            $langGraphApiDigest = (Get-FileHash -LiteralPath $langGraphApi -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($langGraphDigest -ceq $langGraphSourceDigest) {
              if ($langGraphApiDigest -cne $langGraphApiSourceDigest) {
                throw 'The installed LangGraph API source does not match its pinned diagnostic state.'
              }
              & git -c core.autocrlf=false -C $deepAgentsSitePackages apply --check --whitespace=nowarn $langGraphPatch
              if ($LASTEXITCODE -ne 0) { throw 'The diagnostic LangGraph compatibility patch check failed.' }
              & git -c core.autocrlf=false -C $deepAgentsSitePackages apply --whitespace=nowarn $langGraphPatch
              if ($LASTEXITCODE -ne 0) { throw 'The diagnostic LangGraph compatibility patch failed.' }
            } elseif ($langGraphDigest -cne $langGraphPatchedDigest) {
              throw 'The installed LangGraph logging source does not match a pinned diagnostic state.'
            } elseif ($langGraphApiDigest -cne $langGraphApiPatchedDigest) {
              throw 'The installed LangGraph API source does not match a pinned diagnostic state.'
            }
            if ((Get-FileHash -LiteralPath $langGraphLogging -Algorithm SHA256).Hash.ToLowerInvariant() -cne $langGraphPatchedDigest) {
              throw 'The installed diagnostic LangGraph compatibility output is invalid.'
            }
            if ((Get-FileHash -LiteralPath $langGraphApi -Algorithm SHA256).Hash.ToLowerInvariant() -cne $langGraphApiPatchedDigest) {
              throw 'The installed diagnostic LangGraph API compatibility output is invalid.'
            }
            $langGraphCheckpointerDigest = (Get-FileHash -LiteralPath $langGraphCheckpointer -Algorithm SHA256).Hash.ToLowerInvariant()
            $langGraphStreamDigest = (Get-FileHash -LiteralPath $langGraphStream -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($langGraphCheckpointerDigest -ceq $langGraphCheckpointerSourceDigest) {
              if ($langGraphStreamDigest -cne $langGraphStreamSourceDigest) {
                throw 'The installed LangGraph stream source does not match its pinned diagnostic state.'
              }
              & git -c core.autocrlf=false -C $deepAgentsSitePackages apply --check --unidiff-zero --whitespace=nowarn $langGraphNoGrpcPatch
              if ($LASTEXITCODE -ne 0) { throw 'The diagnostic LangGraph in-memory no-gRPC patch check failed.' }
              & git -c core.autocrlf=false -C $deepAgentsSitePackages apply --unidiff-zero --whitespace=nowarn $langGraphNoGrpcPatch
              if ($LASTEXITCODE -ne 0) { throw 'The diagnostic LangGraph in-memory no-gRPC patch failed.' }
            } elseif ($langGraphCheckpointerDigest -cne $langGraphCheckpointerPatchedDigest) {
              throw 'The installed LangGraph checkpointer source does not match a pinned diagnostic state.'
            } elseif ($langGraphStreamDigest -cne $langGraphStreamPatchedDigest) {
              throw 'The installed LangGraph stream source does not match a pinned diagnostic state.'
            }
            if ((Get-FileHash -LiteralPath $langGraphCheckpointer -Algorithm SHA256).Hash.ToLowerInvariant() -cne $langGraphCheckpointerPatchedDigest) {
              throw 'The installed diagnostic LangGraph checkpointer output is invalid.'
            }
            if ((Get-FileHash -LiteralPath $langGraphStream -Algorithm SHA256).Hash.ToLowerInvariant() -cne $langGraphStreamPatchedDigest) {
              throw 'The installed diagnostic LangGraph stream output is invalid.'
            }
            $deepColorama = Join-Path $deepAgentsSitePackages 'colorama'
            if (-not (Test-Path -LiteralPath $deepColorama -PathType Container)) {
              Copy-Item `
                -LiteralPath (Join-Path $installRoot 'hermes\site-packages\colorama') `
                -Destination $deepColorama `
                -Recurse
            }
            if (-not (Test-Path -LiteralPath (Join-Path $deepColorama '__init__.py') -PathType Leaf)) {
              throw 'The installed diagnostic Deep colorama runtime is incomplete.'
            }
            $quickJsRoot = Join-Path $deepAgentsSitePackages 'quickjs_rs'
            if (-not (Test-Path -LiteralPath $quickJsRoot -PathType Container)) {
              $quickJsArchive = Join-Path $artifactRoot 'quickjs-rs-0.2.5.zip'
              Invoke-WebRequest `
                -UseBasicParsing `
                -Uri 'https://files.pythonhosted.org/packages/d0/1d/e4406d13ce9b9443dbfa59e2a2d5b3e11278ebe322b54de38ae18faf5436/quickjs_rs-0.2.5-py3-none-any.whl' `
                -OutFile $quickJsArchive
              if ((Get-FileHash -LiteralPath $quickJsArchive -Algorithm SHA256).Hash.ToLowerInvariant() -cne 'e82240af1f1dd1b2e12bcf169a22a8e0e451e356f0688f2fc3bba886d9b2bb20') {
                throw 'The diagnostic quickjs-rs wheel digest is invalid.'
              }
              Expand-Archive -LiteralPath $quickJsArchive -DestinationPath $deepAgentsSitePackages -Force
            }
            foreach ($quickJsFile in @('__init__.py', '_guest.wasm', '_transform.wasm')) {
              if (-not (Test-Path -LiteralPath (Join-Path $quickJsRoot $quickJsFile) -PathType Leaf)) {
                throw "The installed diagnostic quickjs-rs runtime is incomplete: $quickJsFile"
              }
            }
            $langChainQuickJsSnapshot = Join-Path $deepAgentsSitePackages 'langchain_quickjs\_snapshot.py'
            $langChainQuickJsSnapshotDigest = (Get-FileHash -LiteralPath $langChainQuickJsSnapshot -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($langChainQuickJsSnapshotDigest -ceq $langChainQuickJsSnapshotSourceDigest) {
              & git -c core.autocrlf=false -C $deepAgentsSitePackages apply --check --unidiff-zero --whitespace=nowarn $langChainQuickJsPatch
              if ($LASTEXITCODE -ne 0) { throw 'The diagnostic langchain-quickjs no-bsdiff patch check failed.' }
              & git -c core.autocrlf=false -C $deepAgentsSitePackages apply --unidiff-zero --whitespace=nowarn $langChainQuickJsPatch
              if ($LASTEXITCODE -ne 0) { throw 'The diagnostic langchain-quickjs no-bsdiff patch failed.' }
            } elseif ($langChainQuickJsSnapshotDigest -cne $langChainQuickJsSnapshotPatchedDigest) {
              throw 'The installed langchain-quickjs snapshot source does not match a pinned diagnostic state.'
            }
            if ((Get-FileHash -LiteralPath $langChainQuickJsSnapshot -Algorithm SHA256).Hash.ToLowerInvariant() -cne $langChainQuickJsSnapshotPatchedDigest) {
              throw 'The installed diagnostic langchain-quickjs snapshot output is invalid.'
            }
            $deepAgentsOffload = Join-Path $deepAgentsSitePackages 'deepagents_code\offload.py'
            $deepAgentsOffloadDigest = (Get-FileHash -LiteralPath $deepAgentsOffload -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($deepAgentsOffloadDigest -ceq $deepAgentsOffloadSourceDigest) {
              & git -c core.autocrlf=false -C $deepAgentsSitePackages apply --check --unidiff-zero --whitespace=nowarn $deepAgentsWindowsDaclPatch
              if ($LASTEXITCODE -ne 0) { throw 'The diagnostic Deep Agents Code Windows DACL patch check failed.' }
              & git -c core.autocrlf=false -C $deepAgentsSitePackages apply --unidiff-zero --whitespace=nowarn $deepAgentsWindowsDaclPatch
              if ($LASTEXITCODE -ne 0) { throw 'The diagnostic Deep Agents Code Windows DACL patch failed.' }
            } elseif ($deepAgentsOffloadDigest -cne $deepAgentsOffloadPatchedDigest) {
              throw 'The installed Deep Agents Code offload source does not match a pinned diagnostic state.'
            }
            if ((Get-FileHash -LiteralPath $deepAgentsOffload -Algorithm SHA256).Hash.ToLowerInvariant() -cne $deepAgentsOffloadPatchedDigest) {
              throw 'The installed diagnostic Deep Agents Code offload output is invalid.'
            }
            $deepAgentsSiteCustomizeSource = Join-Path $env:GITHUB_WORKSPACE 'candidate\packaging\windows\python\deepagents-sitecustomize.py'
            $deepAgentsSiteCustomizeDigest = 'c78a3e9cbe225f459e2ea2d831a9533f776e027770fac2ecd339c22b664279a0' # gitleaks:allow -- committed compatibility source integrity pin
            if ((Get-FileHash -LiteralPath $deepAgentsSiteCustomizeSource -Algorithm SHA256).Hash.ToLowerInvariant() -cne $deepAgentsSiteCustomizeDigest) {
              throw 'The diagnostic Deep Agents Code sitecustomize source is invalid.'
            }
            $deepAgentsSiteCustomize = Join-Path $deepAgentsSitePackages 'sitecustomize.py'
            Copy-Item -LiteralPath $deepAgentsSiteCustomizeSource -Destination $deepAgentsSiteCustomize -Force
            if ((Get-FileHash -LiteralPath $deepAgentsSiteCustomize -Algorithm SHA256).Hash.ToLowerInvariant() -cne $deepAgentsSiteCustomizeDigest) {
              throw 'The installed diagnostic Deep Agents Code sitecustomize output is invalid.'
            }
            $runtimeArtifacts = Join-Path $artifactRoot 'runtime'
            [IO.Directory]::CreateDirectory($runtimeArtifacts) | Out-Null
            $runtimeStdout = Join-Path $artifactRoot 'runtime-stdout.log'
            $runtimeStderr = Join-Path $artifactRoot 'runtime-stderr.log'
            $launcher = Join-Path $installRoot 'bin\NemoClaw.exe'
            $runtimeArguments = @('--wait', '--qualification', '--artifact-directory', $runtimeArtifacts)
            $runtimeExitCode = $null
            $runtime = Start-Process `
              -FilePath $launcher `
              -ArgumentList $runtimeArguments `
              -RedirectStandardOutput $runtimeStdout `
              -RedirectStandardError $runtimeStderr `
              -PassThru
            try {
              if (-not $runtime.WaitForExit(1200000)) {
                & "$env:SystemRoot\System32\taskkill.exe" /PID $runtime.Id /T /F | Out-Null
                'runtime_timed_out_after_seconds=1200' | Out-File -LiteralPath (Join-Path $artifactRoot 'probe-result.txt') -Encoding utf8 -Append
              } else {
                $runtime.WaitForExit()
                $runtime.Refresh()
                $runtimeExitCode = $runtime.ExitCode
                "runtime_exit_code=$runtimeExitCode" | Out-File -LiteralPath (Join-Path $artifactRoot 'probe-result.txt') -Encoding utf8 -Append
              }
            } finally {
              $runtime.Dispose()
            }
            $openClawReceipts = @(Get-ChildItem `
              -LiteralPath $runtimeArtifacts `
              -Filter 'native-windows-web-ui-*.json' `
              -File `
              -ErrorAction SilentlyContinue)
            $openClawPassed = $false
            if ($openClawReceipts.Count -eq 1) {
              $openClawReceipt = Get-Content -LiteralPath $openClawReceipts[0].FullName -Raw | ConvertFrom-Json
              $openClawPassed = $openClawReceipt.verdict -ceq 'pass' -and
                [int]$openClawReceipt.turnCount -eq 3 -and
                @($openClawReceipt.turns).Count -eq 3 -and
                $openClawReceipt.sandboxDeleted -eq $true -and
                $openClawReceipt.gatewayStopped -eq $true -and
                $openClawReceipt.qualificationRootsRemoved -eq $true
            }
            "runtime_openclaw_receipt_pass=$openClawPassed" | Out-File -LiteralPath (Join-Path $artifactRoot 'probe-result.txt') -Encoding utf8 -Append
            if (-not $openClawPassed) {
              throw 'The diagnostic OpenClaw runtime receipt is incomplete.'
            }
            $agentFailures = [Collections.Generic.List[string]]::new()
            foreach ($agent in @('pi', 'hermes', 'langchain-deepagents-code', 'nemocua')) {
              $agentArtifacts = Join-Path $artifactRoot "runtime-$agent"
              [IO.Directory]::CreateDirectory($agentArtifacts) | Out-Null
              $agentStdout = Join-Path $artifactRoot "runtime-$agent-stdout.log"
              $agentStderr = Join-Path $artifactRoot "runtime-$agent-stderr.log"
              $agentArguments = @('--wait', '--qualification', '--agent', $agent, '--artifact-directory', $agentArtifacts)
              $agentProcess = Start-Process `
                -FilePath $launcher `
                -ArgumentList $agentArguments `
                -RedirectStandardOutput $agentStdout `
                -RedirectStandardError $agentStderr `
                -PassThru
              try {
                if (-not $agentProcess.WaitForExit(600000)) {
                  & "$env:SystemRoot\System32\taskkill.exe" /PID $agentProcess.Id /T /F | Out-Null
                  "runtime_${agent}_timed_out_after_seconds=600" | Out-File -LiteralPath (Join-Path $artifactRoot 'probe-result.txt') -Encoding utf8 -Append
                } else {
                  $agentProcess.WaitForExit()
                  $agentProcess.Refresh()
                  "runtime_${agent}_exit_code=$($agentProcess.ExitCode)" | Out-File -LiteralPath (Join-Path $artifactRoot 'probe-result.txt') -Encoding utf8 -Append
                }
              } finally {
                $agentProcess.Dispose()
              }
              $agentReceipts = @(Get-ChildItem `
                -LiteralPath $agentArtifacts `
                -Filter "native-windows-agent-launch-$agent.json" `
                -File `
                -ErrorAction SilentlyContinue)
              $agentPassed = $false
              if ($agentReceipts.Count -eq 1) {
                $agentReceipt = Get-Content -LiteralPath $agentReceipts[0].FullName -Raw | ConvertFrom-Json
                $agentRuntimeReceipt = $agentReceipt.runtimeReceipt
                $agentPassed = $agentReceipt.selectedAgent -ceq $agent -and
                  $agentRuntimeReceipt.verdict -ceq 'pass' -and
                  [int]$agentRuntimeReceipt.turnCount -eq 3 -and
                  $agentRuntimeReceipt.sandboxDeleted -eq $true -and
                  $agentRuntimeReceipt.gatewayStopped -eq $true -and
                  $agentRuntimeReceipt.qualificationRootsRemoved -eq $true
              }
              "runtime_${agent}_receipt_pass=$agentPassed" | Out-File -LiteralPath (Join-Path $artifactRoot 'probe-result.txt') -Encoding utf8 -Append
              if (-not $agentPassed) {
                $agentFailures.Add($agent) | Out-Null
              }
            }
            if ($agentFailures.Count -gt 0) {
              throw "Native Windows diagnostic agent receipt failures: $($agentFailures -join ', ')"
            }
          }
          foreach ($startupLog in @(Get-ChildItem `
            -LiteralPath ([IO.Path]::GetTempPath()) `
            -Filter 'NemoClaw.Bootstrapper.*.startup.log' `
            -File `
            -ErrorAction SilentlyContinue)) {
            Copy-Item -LiteralPath $startupLog.FullName -Destination $artifactRoot -Force
          }
          $events = @(Get-WinEvent `
            -FilterHashtable @{ LogName = 'Application'; StartTime = $startedAt; Level = @(1, 2, 3) } `
            -ErrorAction SilentlyContinue | Where-Object {
            $_.ProviderName -in @('.NET Runtime', 'Application Error', 'SideBySide', 'Windows Error Reporting')
          } | Select-Object TimeCreated, ProviderName, Id, LevelDisplayName, Message)
          if ($events.Count -gt 0) {
            [IO.File]::WriteAllText(
              (Join-Path $artifactRoot 'application-events.json'),
              (($events | ConvertTo-Json -Depth 4) + [Environment]::NewLine),
              [Text.UTF8Encoding]::new($false)
            )
          }

      - name: Upload package startup diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-native-package-startup-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/windows-native-package-diagnostic/
          if-no-files-found: error
          retention-days: 3

  official-hermes-components:
    name: Official Hermes ${{ inputs.official_hermes_phase || 'components' }} probe (Windows ARM64)
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.run_windows_native_installer && inputs.probe_official_hermes_components && inputs.official_hermes_phase != 'host-prerequisites' && inputs.official_hermes_phase != 'application' && inputs.official_hermes_phase != 'system-drive' && !inputs.test_native_windows_runtime && !inputs.profile_native_windows }}
    runs-on: windows-11-vs2026-arm
    timeout-minutes: ${{ inputs.official_hermes_phase == 'runtime' && 180 || 90 }}
    steps:
      - name: Check out the component probe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Provision pinned official Hermes components
        id: hermes-components
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $runtimeRoot = "$env:SystemDrive\NemoClawHermesProbe-$([guid]::NewGuid().ToString('N').Substring(0, 12))"
          "runtime_root=$runtimeRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          & "$env:GITHUB_WORKSPACE\packaging\windows\hermes\prepare-official-components.ps1" `
            -RuntimeRoot $runtimeRoot `
            -ArtifactDirectory "$env:RUNNER_TEMP\official-hermes-components"

      - name: Check the canonical Python phase result contract
        if: ${{ (inputs.official_hermes_phase == 'python' || inputs.official_hermes_phase == 'runtime') }}
        shell: powershell
        env:
          HERMES_COMPONENT_ROOT: ${{ steps.hermes-components.outputs.runtime_root }}
        run: |
          & "$env:GITHUB_WORKSPACE\packaging\windows\hermes\test-official-python.ps1"
          & "$env:GITHUB_WORKSPACE\packaging\windows\hermes\test-official-python-process.ps1"
          & "$env:GITHUB_WORKSPACE\packaging\windows\hermes\test-official-msvc-tools.ps1"
          & "$env:GITHUB_WORKSPACE\packaging\windows\hermes\test-official-python-semantics.ps1" `
            -OfficialInstallerPath "$env:HERMES_COMPONENT_ROOT\hermes-agent\scripts\install.ps1"
          & "$env:GITHUB_WORKSPACE\packaging\windows\hermes\test-official-registry-path.ps1" `
            -OfficialInstallerPath "$env:HERMES_COMPONENT_ROOT\hermes-agent\scripts\install.ps1" `
            -ReceiptPath "$env:RUNNER_TEMP\official-hermes-components\python-registry-path-controls.json"

      - name: Set up pinned native Rust for canonical Hermes Python
        if: ${{ (inputs.official_hermes_phase == 'python' || inputs.official_hermes_phase == 'runtime') }}
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.95.0-aarch64-pc-windows-msvc
          target: aarch64-pc-windows-msvc
          cache: false
          rustflags: ""

      - name: Provision canonical Hermes Python before baseline setup
        if: ${{ (inputs.official_hermes_phase == 'python' || inputs.official_hermes_phase == 'runtime') }}
        id: hermes-python
        shell: powershell
        # Pinned OpenSSL SDK build precedes the unchanged 20-minute Python stage.
        timeout-minutes: ${{ inputs.official_hermes_phase == 'runtime' && 165 || 55 }}
        env:
          HERMES_COMPONENT_ROOT: ${{ steps.hermes-components.outputs.runtime_root }}
          HERMES_SELECTED_PHASE: ${{ inputs.official_hermes_phase }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $toolchain = '1.95.0-aarch64-pc-windows-msvc'
          $rustc = (& rustup which --toolchain $toolchain rustc).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'The pinned native Rust compiler is missing.' }
          $cargo = (& rustup which --toolchain $toolchain cargo).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'The pinned native Cargo is missing.' }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsDevCmd = (& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -find 'Common7\Tools\VsDevCmd.bat' | Select-Object -First 1)
          if ($LASTEXITCODE -ne 0 -or -not $vsDevCmd) { throw 'The runner does not contain the required Visual Studio ARM64 tools.' }
          $powershell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $entry = if ($env:HERMES_SELECTED_PHASE -eq 'runtime') { 'prepare-official-runtime.ps1' } else { 'prepare-official-python.ps1' }
          $script = Join-Path "$env:GITHUB_WORKSPACE\packaging\windows\hermes" $entry
          $phaseLock = "$env:GITHUB_WORKSPACE\packaging\windows\hermes\official-python.lock.json"
          $evidence = "$env:RUNNER_TEMP\official-hermes-python"
          $components = "$env:RUNNER_TEMP\official-hermes-components"
          foreach ($value in @($vsDevCmd, $powershell, $script, $phaseLock, $evidence, $components, $rustc, $cargo, $env:HERMES_COMPONENT_ROOT)) {
            if ($value -match '["\r\n%!]') { throw 'A build-prerequisite path cannot be represented safely.' }
          }
          $command = 'call "' + $vsDevCmd + '" -arch=arm64 -host_arch=arm64 && "' + $powershell + '" -NoProfile -ExecutionPolicy Bypass -File "' + $script + '" -LockPath "' + $phaseLock + '" -RuntimeRoot "' + $env:HERMES_COMPONENT_ROOT + '" -ArtifactDirectory "' + $evidence + '" -ComponentEvidenceDirectory "' + $components + '" -RustcPath "' + $rustc + '" -CargoPath "' + $cargo + '"'
          if ($env:HERMES_SELECTED_PHASE -eq 'runtime') { $command += ' -ControllerSource "' + $env:GITHUB_SHA + '"' }
          & "$env:SystemRoot\System32\cmd.exe" /d /c $command
          if ($LASTEXITCODE -ne 0) { throw 'The canonical Hermes Python phase failed; baseline setup will not run.' }

      - name: Upload the complete unqualified official runtime candidate
        if: ${{ always() && inputs.official_hermes_phase == 'runtime' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-hermes-runtime-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/official-hermes-runtime-candidate/
            ${{ runner.temp }}/official-hermes-runtime-build/
            ${{ runner.temp }}/official-hermes-runtime-phase.json
            ${{ runner.temp }}/official-hermes-components/
            ${{ runner.temp }}/official-hermes-python/
            !${{ runner.temp }}/official-hermes-components/downloads/
            !${{ runner.temp }}/official-hermes-python/downloads/
            !${{ runner.temp }}/official-hermes-python/cargo-home/
            !${{ runner.temp }}/official-hermes-python/dependency-stage/uv-cache/
            !${{ runner.temp }}/official-hermes-python/openssl/downloads/
            !${{ runner.temp }}/official-hermes-python/openssl/strawberryperl/
            !${{ runner.temp }}/official-hermes-python/openssl/nasm-windows-bin/
            !${{ runner.temp }}/official-hermes-python/openssl/jom-windows-bin/
            !${{ runner.temp }}/official-hermes-python/openssl/openssl/
            !${{ runner.temp }}/official-hermes-runtime-build/downloads/
            !${{ runner.temp }}/official-hermes-runtime-build/browser-use-wheels/
            !${{ runner.temp }}/official-hermes-runtime-build/uv-cache/
            !${{ runner.temp }}/official-hermes-runtime-build/npm-cache/
            !${{ runner.temp }}/official-hermes-runtime-build/node-build/
            !${{ runner.temp }}/official-hermes-runtime-build/node-build-tools/
            !${{ runner.temp }}/official-hermes-runtime-build/node-addon-headers/
          if-no-files-found: error
          retention-days: 14

      - name: Install the immutable MXC baseline
        if: ${{ inputs.official_hermes_phase != 'python' && inputs.official_hermes_phase != 'runtime' }}
        id: component-baseline
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\packaging\windows\hermes\component-probe-baseline.ps1" `
            -ArtifactDirectory "$env:RUNNER_TEMP\official-hermes-baseline"

      - name: Check bounded component process diagnostics on Windows
        if: ${{ steps.component-baseline.outcome == 'success' }}
        id: component-controls
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\packaging\windows\performance\acl-snapshot.test.ps1"
          $node = Join-Path $env:ProgramFiles 'NVIDIA\NemoClaw\bin\node.exe'
          & $node --experimental-strip-types --no-warnings --test `
            "$env:GITHUB_WORKSPACE\packaging\windows\hermes\probe-components.test.mts" `
            "$env:GITHUB_WORKSPACE\packaging\windows\hermes\portable-git-arguments.test.mts" `
            "$env:GITHUB_WORKSPACE\packaging\windows\hermes\probe-python-temp.test.mts" `
            "$env:GITHUB_WORKSPACE\packaging\windows\performance\measurement.test.mts" `
            "$env:GITHUB_WORKSPACE\packaging\windows\performance\compile-cache-experiment.test.mts"
          if ($LASTEXITCODE -ne 0) { throw 'The component process diagnostic controls failed.' }

      - name: Execute the official components inside MXC
        if: ${{ steps.component-baseline.outcome == 'success' && steps.component-controls.outcome == 'success' }}
        shell: powershell
        env:
          HERMES_COMPONENT_ROOT: ${{ steps.hermes-components.outputs.runtime_root }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $installRoot = Join-Path $env:ProgramFiles 'NVIDIA\NemoClaw'
          & "$installRoot\bin\node.exe" --experimental-strip-types --no-warnings `
            "$env:GITHUB_WORKSPACE\packaging\windows\hermes\probe-official-components.mts" `
            --install-root $installRoot `
            --runtime-root $env:HERMES_COMPONENT_ROOT `
            --artifact-directory "$env:RUNNER_TEMP\official-hermes-mxc"
          if ($LASTEXITCODE -ne 0) { throw 'The official Hermes MXC component probe failed.' }

      - name: Check official Python temp permissions before and after the startup adapter
        if: ${{ !cancelled() && steps.component-baseline.outcome == 'success' && steps.component-controls.outcome == 'success' }}
        shell: powershell
        env:
          HERMES_COMPONENT_ROOT: ${{ steps.hermes-components.outputs.runtime_root }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $installRoot = Join-Path $env:ProgramFiles 'NVIDIA\NemoClaw'
          & "$installRoot\bin\node.exe" --experimental-strip-types --no-warnings `
            "$env:GITHUB_WORKSPACE\packaging\windows\hermes\probe-official-python-adapter.mts" `
            --install-root $installRoot `
            --runtime-root $env:HERMES_COMPONENT_ROOT `
            --artifact-directory "$env:RUNNER_TEMP\official-hermes-python-temp"
          if ($LASTEXITCODE -ne 0) { throw 'The official Python before/after temp adapter control failed.' }

      - name: Probe installed runtime access and contained compile-cache A/B
        if: ${{ !cancelled() && steps.component-baseline.outcome == 'success' && steps.component-controls.outcome == 'success' }}
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $installRoot = Join-Path $env:ProgramFiles 'NVIDIA\NemoClaw'
          & "$installRoot\bin\node.exe" --experimental-strip-types --no-warnings `
            "$env:GITHUB_WORKSPACE\packaging\windows\performance\probe-installed-readonly.mts" `
            --install-root $installRoot `
            --source-revision f8a1d8c702c879d2984d76d2e0419641bb1ccd97 `
            --artifact-directory "$env:RUNNER_TEMP\installed-runtime-readonly" `
            --compile-cache-experiment `
            --runtime-manifest-sha256 d36e977401cf8188350e657137bf649c654f4554a6c4da299f9b2b9353e7066e
          if ($LASTEXITCODE -ne 0) { throw 'The installed read-only runtime probe failed.' }

      - name: Upload failed component evidence before baseline cleanup
        if: ${{ failure() && inputs.official_hermes_phase != 'runtime' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-hermes-windows-mxc-components-precleanup-${{ github.sha }}
          path: |
            ${{ runner.temp }}/official-hermes-components/
            ${{ runner.temp }}/official-hermes-python/
            ${{ runner.temp }}/official-hermes-python-temp/
            ${{ runner.temp }}/official-hermes-mxc/
            ${{ runner.temp }}/installed-runtime-readonly/
            !${{ runner.temp }}/official-hermes-components/downloads/
            !${{ runner.temp }}/official-hermes-python/openssl/downloads/
            !${{ runner.temp }}/official-hermes-python/openssl/strawberryperl/
            !${{ runner.temp }}/official-hermes-python/openssl/nasm-windows-bin/
            !${{ runner.temp }}/official-hermes-python/openssl/jom-windows-bin/
            !${{ runner.temp }}/official-hermes-python/openssl/openssl/
            !${{ runner.temp }}/official-hermes-python/downloads/
            !${{ runner.temp }}/official-hermes-python/cargo-home/
            !${{ runner.temp }}/official-hermes-python/dependency-stage/uv-cache/
          if-no-files-found: warn
          retention-days: 14

      - name: Uninstall the component probe baseline
        if: ${{ always() && inputs.official_hermes_phase != 'runtime' && steps.component-baseline.outcome != 'skipped' }}
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\packaging\windows\hermes\component-probe-baseline.ps1" `
            -ArtifactDirectory "$env:RUNNER_TEMP\official-hermes-baseline" -Uninstall

      - name: Upload official Hermes component evidence
        if: ${{ always() && inputs.official_hermes_phase != 'runtime' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-hermes-windows-mxc-components-${{ github.sha }}
          path: |
            ${{ runner.temp }}/official-hermes-baseline/
            ${{ runner.temp }}/official-hermes-components/
            ${{ runner.temp }}/official-hermes-python/
            ${{ runner.temp }}/official-hermes-python-temp/
            ${{ runner.temp }}/official-hermes-mxc/
            ${{ runner.temp }}/installed-runtime-readonly/
            !${{ runner.temp }}/official-hermes-baseline/baseline-setup.exe
            !${{ runner.temp }}/official-hermes-components/downloads/
            !${{ runner.temp }}/official-hermes-python/openssl/downloads/
            !${{ runner.temp }}/official-hermes-python/openssl/strawberryperl/
            !${{ runner.temp }}/official-hermes-python/openssl/nasm-windows-bin/
            !${{ runner.temp }}/official-hermes-python/openssl/jom-windows-bin/
            !${{ runner.temp }}/official-hermes-python/openssl/openssl/
            !${{ runner.temp }}/official-hermes-python/downloads/
            !${{ runner.temp }}/official-hermes-python/cargo-home/
            !${{ runner.temp }}/official-hermes-python/dependency-stage/uv-cache/
          if-no-files-found: error
          retention-days: 14

  windows-native-profiling:
    name: Installed Windows baseline profiling (diagnostic only)
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.run_windows_native_installer && inputs.profile_native_windows && !inputs.test_native_windows_runtime }}
    runs-on: windows-11-vs2026-arm
    # Existing target allowances: 15m install + 30m warm prep + 45m replays
    # + 15m uninstall; download/recording finalization retain bounded headroom.
    timeout-minutes: 150
    steps:
      - name: Check out the profiling controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the explicit profiling request
        shell: powershell
        env:
          OTHER_BUILD: ${{ inputs.run_windows_native_installer }}
          OTHER_COMPONENTS: ${{ inputs.probe_official_hermes_components }}
          OTHER_DIAGNOSTIC: ${{ inputs.windows_native_diagnostic_source_run_id }}
        run: |
          if ($env:OTHER_BUILD -eq 'true' -or $env:OTHER_COMPONENTS -eq 'true' -or $env:OTHER_DIAGNOSTIC) {
            throw 'Profiling is a separate explicit dispatch and cannot also build or run component diagnostics.'
          }

      - name: Set up the profiling controller Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          architecture: arm64

      - name: Record actual installation and dashboard CPU and file I/O
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\packaging\windows\performance\run-profiling-phase.ps1" `
            -ArtifactDirectory "$env:RUNNER_TEMP\windows-native-profiling" `
            -HarnessNodePath ((Get-Command node.exe -CommandType Application | Select-Object -First 1).Source) `
            -ControllerSha $env:GITHUB_SHA

      - name: Upload profiling evidence including failures and capped traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-native-profiling-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/windows-native-profiling/
            !${{ runner.temp }}/windows-native-profiling/baseline/baseline-setup.exe
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14

  windows-runtime-controls:
    name: Native Windows ownership and isolated MSI controls
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.run_windows_native_installer && inputs.test_native_windows_runtime }}
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 20
    steps:
      - name: Check out the native ownership controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the explicit ownership request
        shell: powershell
        env:
          OTHER_BUILD: ${{ inputs.run_windows_native_installer }}
          OTHER_COMPONENTS: ${{ inputs.probe_official_hermes_components }}
          OTHER_PROFILE: ${{ inputs.profile_native_windows }}
          OTHER_DIAGNOSTIC: ${{ inputs.windows_native_diagnostic_source_run_id }}
        run: |
          if ($env:OTHER_BUILD -eq 'true' -or $env:OTHER_COMPONENTS -eq 'true' -or $env:OTHER_PROFILE -eq 'true' -or $env:OTHER_DIAGNOSTIC) {
            throw 'Native ownership controls require a separate explicit dispatch.'
          }

      - name: Set up pinned Rust for the native ownership controls
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.95.0-aarch64-pc-windows-msvc
          target: aarch64-pc-windows-msvc
          cache: false
          rustflags: ""

      - name: Exercise real Windows leases and protected fixtures
        shell: powershell
        env:
          CARGO_TERM_COLOR: never
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'windows-runtime-controls'
          [IO.Directory]::CreateDirectory($output) | Out-Null
          $log = Join-Path $output 'runtime-lease-tests.log'
          try {
            $ErrorActionPreference = 'Continue'
            & rustup run 1.95.0-aarch64-pc-windows-msvc cargo test --locked `
              --manifest-path "$env:GITHUB_WORKSPACE\packaging\windows\launcher\Cargo.toml" `
              --target aarch64-pc-windows-msvc runtime_lease:: -- --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath $log
            $result = $LASTEXITCODE
          } finally { $ErrorActionPreference = 'Stop' }
          if ($result -ne 0) { throw 'The real native runtime ownership controls failed.' }
          if ((Get-Content -LiteralPath $log -Raw) -notmatch 'test result: ok\. 18 passed; 0 failed; 0 ignored;') {
            throw 'The six portable and twelve Windows ownership controls did not all execute.'
          }

      - name: Exercise owned child and grandchild lifetime
        shell: powershell
        env:
          CARGO_TERM_COLOR: never
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'windows-runtime-controls'
          [IO.Directory]::CreateDirectory($output) | Out-Null
          $log = Join-Path $output 'runtime-host-tests.log'
          try {
            $ErrorActionPreference = 'Continue'
            & rustup run 1.95.0-aarch64-pc-windows-msvc cargo test --locked `
              --manifest-path "$env:GITHUB_WORKSPACE\packaging\windows\launcher\Cargo.toml" `
              --target aarch64-pc-windows-msvc runtime_host:: -- --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath $log
            $result = $LASTEXITCODE
          } finally { $ErrorActionPreference = 'Stop' }
          if ($result -ne 0) { throw 'The native runtime guardian controls failed.' }
          if ((Get-Content -LiteralPath $log -Raw) -notmatch 'test result: ok\. 15 passed; 0 failed; 0 ignored;') {
            throw 'The fourteen guardian controls and their child-fixture entry did not all execute.'
          }

      - name: Set up pinned tools for isolated MSI fixtures
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.419

      - name: Set up actual ARM64 Node for the shared-file fixture
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          architecture: arm64

      - name: Set up build-only Python for MSI fixture authoring
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.1.0
        with:
          python-version: 3.13.13
          architecture: arm64

      - name: Exercise native file ownership and relay counters
        shell: powershell
        env:
          CARGO_TERM_COLOR: never
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'windows-runtime-controls'
          $log = Join-Path $output 'native-ui-file-owner-tests.log'
          try {
            $ErrorActionPreference = 'Continue'
            & rustup run 1.95.0-aarch64-pc-windows-msvc cargo test --locked `
              --manifest-path "$env:GITHUB_WORKSPACE\packaging\windows\launcher\Cargo.toml" `
              --target aarch64-pc-windows-msvc native_ui_file_owner:: -- --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath $log
            $result = $LASTEXITCODE
          } finally { $ErrorActionPreference = 'Stop' }
          if ($result -ne 0 -or (Get-Content -LiteralPath $log -Raw) -notmatch 'test result: ok\. 15 passed; 0 failed; 0 ignored;') {
            throw 'The two portable and thirteen Windows file-owner controls did not all pass.'
          }
          $target = Join-Path $env:RUNNER_TEMP 'windows-runtime-test-launcher'
          try {
            $ErrorActionPreference = 'Continue'
            & rustup run 1.95.0-aarch64-pc-windows-msvc cargo rustc --locked --release --no-default-features `
              --manifest-path "$env:GITHUB_WORKSPACE\packaging\windows\launcher\Cargo.toml" `
              --target aarch64-pc-windows-msvc --target-dir $target -- -C target-feature=+crt-static `
              2>&1 | Tee-Object -FilePath (Join-Path $output 'relay-launcher-build.log')
            $buildResult = $LASTEXITCODE
          } finally { $ErrorActionPreference = 'Stop' }
          if ($buildResult -ne 0) { throw 'The native relay fixture launcher did not build.' }
          $env:NEMOCLAW_NATIVE_TEST_LAUNCHER = Join-Path $target 'aarch64-pc-windows-msvc\release\NemoClaw.exe'
          $relayLog = Join-Path $output 'relay-measurement-tests.log'
          try {
            $ErrorActionPreference = 'Continue'
            & node --experimental-strip-types --no-warnings --test --test-reporter=tap `
              "$env:GITHUB_WORKSPACE\packaging\windows\performance\relay-measurements.test.mts" `
              2>&1 | Tee-Object -FilePath $relayLog
            $relayResult = $LASTEXITCODE
          } finally { $ErrorActionPreference = 'Stop' }
          $relayText = Get-Content -LiteralPath $relayLog -Raw
          if ($relayResult -ne 0 -or $relayText -notmatch '(?m)^# pass 5\r?$' -or $relayText -notmatch '(?m)^# skipped 0\r?$') {
            throw 'All five actual Windows relay measurement controls must run without skips.'
          }

      - name: Check MSI manifest and transaction controls
        shell: powershell
        env:
          CARGO_TERM_COLOR: never
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'windows-runtime-controls'
          $pythonLog = Join-Path $output 'msi-build-tests.log'
          try {
            $ErrorActionPreference = 'Continue'
            & python -m unittest discover -s "$env:GITHUB_WORKSPACE\packaging\windows\installer" -p 'test_*.py' -v 2>&1 | Tee-Object -FilePath $pythonLog
            $pythonResult = $LASTEXITCODE
          } finally { $ErrorActionPreference = 'Stop' }
          if ($pythonResult -ne 0 -or (Get-Content -LiteralPath $pythonLog -Raw) -notmatch 'Ran 60 tests') {
            throw 'The sixty MSI build and metadata controls did not all pass.'
          }
          $log = Join-Path $output 'msi-helper-tests.log'
          try {
            $ErrorActionPreference = 'Continue'
            & rustup run 1.95.0-aarch64-pc-windows-msvc cargo test --locked `
              --manifest-path "$env:GITHUB_WORKSPACE\packaging\windows\installer\Cargo.toml" `
              --target aarch64-pc-windows-msvc --features msi-boundary-fixture -- `
              --nocapture --test-threads=1 --skip runtime_lease:: 2>&1 | Tee-Object -FilePath $log
            $result = $LASTEXITCODE
          } finally { $ErrorActionPreference = 'Stop' }
          if ($result -ne 0 -or (Get-Content -LiteralPath $log -Raw) -notmatch 'test result: ok\. 17 passed; 0 failed; 0 ignored;') {
            throw 'The sixteen transaction/manifest and native SHA256 controls did not all pass.'
          }

      - name: Build and exercise actual isolated MSI transactions
        shell: pwsh
        env:
          CARGO_TERM_COLOR: never
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $node = (Get-Command node.exe -CommandType Application | Select-Object -First 1).Source
          & "$env:GITHUB_WORKSPACE\packaging\windows\installer\test-runtime-msi-process.ps1" `
            -SourceRoot $env:GITHUB_WORKSPACE `
            -ArtifactDirectory (Join-Path $env:RUNNER_TEMP 'windows-msi-lease-process') -NodePath $node
          $tools = Join-Path $env:RUNNER_TEMP 'windows-msi-tools'
          [IO.Directory]::CreateDirectory($tools) | Out-Null
          $config = Join-Path $tools 'NuGet.Config'
          [IO.File]::WriteAllText($config, '<configuration><packageSources><clear/><add key="nuget.org" value="https://api.nuget.org/v3/index.json" /></packageSources></configuration>', [Text.UTF8Encoding]::new($false))
          & dotnet tool install wix --version 5.0.2 --tool-path $tools --configfile $config
          if ($LASTEXITCODE -ne 0) { throw 'The pinned WiX fixture tool could not be installed.' }
          $python = (Get-Command python.exe -CommandType Application | Select-Object -First 1).Source
          $license = Join-Path (Split-Path -Parent $node) 'LICENSE'
          & "$env:GITHUB_WORKSPACE\packaging\windows\installer\test-runtime-msi.ps1" `
            -SourceRoot $env:GITHUB_WORKSPACE `
            -ArtifactDirectory (Join-Path $env:RUNNER_TEMP 'windows-msi-boundary-fixtures') `
            -NodePath $node -NodeLicensePath $license -PythonPath $python `
            -WixPath (Join-Path $tools 'wix.exe') -SourceRevision $env:GITHUB_SHA

      - name: Upload runtime ownership control evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-runtime-controls-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/windows-runtime-controls/
            ${{ runner.temp }}/windows-msi-lease-process/*.json
            ${{ runner.temp }}/windows-msi-boundary-fixtures/*.json
            ${{ runner.temp }}/windows-msi-boundary-fixtures/*.log
            ${{ runner.temp }}/windows-msi-boundary-fixtures/fixtures/fixtures.json
            ${{ runner.temp }}/windows-msi-boundary-fixtures/fixtures/*/namespace.json
          if-no-files-found: warn
          retention-days: 14
