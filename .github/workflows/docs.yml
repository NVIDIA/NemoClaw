# Adapted from main's Fern workflows; see fern/NOTICE.md.
name: CD / Documentation
on:
  # Stacked v1 PRs target feature branches, so do not filter by base branch.
  pull_request:
  push:
    branches: [v1]
    tags: ["v0.1.*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-v1-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      build-tool: ${{ steps.build-tool.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-docs
      # CI / Bundle runs the docs:: and fern:: tests with the rest of the workspace.
      - name: Check generated reference, local links, and Fern routes
        run: cargo run --locked -p nemoclaw-build -- fern check
      # Publication jobs run this binary, built from the same commit in this run,
      # instead of compiling it again. The attempt keeps a rerun's name unique.
      - name: Name the build tool artifact
        id: build-tool
        env:
          ARTIFACT: docs-build-tool-${{ github.sha }}-${{ github.run_attempt }}
        run: echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.build-tool.outputs.artifact }}
          path: target/debug/nemoclaw-build
          if-no-files-found: error
          retention-days: 1

  preview:
    name: PR preview
    needs: validate
    if: github.event_name == 'pull_request' && github.base_ref == 'v1' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      NEMOCLAW_BUILD: .build/docs-tool/nemoclaw-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check preview availability
        id: available
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: |
          if [ -n "$FERN_TOKEN" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; fi
      - uses: ./.github/actions/setup-docs
        if: steps.available.outputs.enabled == 'true'
        with:
          rust: "false"
      - name: Download the build tool from Validate
        if: steps.available.outputs.enabled == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.validate.outputs.build-tool }}
          path: .build/docs-tool
      - name: Make the build tool executable
        if: steps.available.outputs.enabled == 'true'
        run: chmod +x "$NEMOCLAW_BUILD"
      - name: Publish isolated PR preview
        if: steps.available.outputs.enabled == 'true'
        id: publish
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
          PREVIEW_ID: nemoclaw-v1-pr-${{ github.event.pull_request.number }}
        run: '"$NEMOCLAW_BUILD" fern preview --id "$PREVIEW_ID"'
      - name: Comment with preview URL
        if: steps.available.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.publish.outputs.preview_url }}
        run: >-
          "$NEMOCLAW_BUILD" fern comment
          --repository "$GH_REPO" --pull-request "$PR_NUMBER" --url "$PREVIEW_URL"

  staging:
    name: Staging
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/v1'
    environment: docs-v1-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    env:
      NEMOCLAW_BUILD: .build/docs-tool/nemoclaw-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-docs
        with:
          rust: "false"
      - name: Download the build tool from Validate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.validate.outputs.build-tool }}
          path: .build/docs-tool
      - name: Make the build tool executable
        run: chmod +x "$NEMOCLAW_BUILD"
      - name: Publish v1 without replacing main staging
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: '"$NEMOCLAW_BUILD" fern preview --id nemoclaw-v1'
      - name: Remove merged v1 PR previews
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: >-
          "$NEMOCLAW_BUILD" fern delete-merged
          --repository "$GH_REPO" --commit "$COMMIT_SHA"

  public:
    name: Release
    needs: validate
    # Release candidates such as v0.1.0-rc1 stage images and drafts; only a
    # final release publishes the documentation.
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v0.1.') &&
      !contains(github.ref_name, '-') && vars.FERN_V1_PUBLIC_ENABLED == 'true'
    environment: docs-v1-public
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEMOCLAW_BUILD: .build/docs-tool/nemoclaw-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a tag from v1 history
        run: |
          git fetch --no-tags origin v1
          git merge-base --is-ancestor HEAD origin/v1
      - name: Require a security-reviewed public release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          directory="$RUNNER_TEMP/docs-release"
          mkdir "$directory"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$directory/release.json"
          jq -e --arg tag "$TAG" '.tag_name == $tag and .draft == false and (.published_at | type == "string")' \
            "$directory/release.json" > /dev/null
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$directory" \
            --pattern gate.json --pattern assessment.json --pattern inventory.json --pattern sboms.json
          jq -e --arg tag "$TAG" '
            .schema_version == 1 and .release_tag == $tag and .status == "passed" and
            .publication_authorized == false and .policy.status == "passed" and .policy.publication_authorized == false and
            (.controller_revision | test("^[a-f0-9]{40}$")) and
            ([.inventory_sha256,.sboms_sha256,.assessment_sha256,.policy.policy_sha256] | all(test("^[a-f0-9]{64}$")))
          ' "$directory/gate.json" > /dev/null
          for name in inventory sboms assessment; do
            checksum=$(jq -er --arg key "${name}_sha256" '.[$key]' "$directory/gate.json")
            printf '%s  %s\n' "$checksum" "$directory/$name.json" | sha256sum --check --strict > /dev/null
          done
      - uses: ./.github/actions/setup-docs
        with:
          rust: "false"
      - name: Download the build tool from Validate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.validate.outputs.build-tool }}
          path: .build/docs-tool
      - name: Make the build tool executable
        run: chmod +x "$NEMOCLAW_BUILD"
      - name: Publish main and v1 through the version selector
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
          FERN_V1_PUBLIC_ENABLED: ${{ vars.FERN_V1_PUBLIC_ENABLED }}
        run: '"$NEMOCLAW_BUILD" fern public'
