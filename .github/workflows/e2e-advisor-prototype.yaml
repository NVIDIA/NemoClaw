name: e2e-advisor-prototype

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base ref to diff against
        required: false
        default: origin/main
      head_ref:
        description: Head ref to diff
        required: false
        default: HEAD
      run_pi:
        description: Run Pi semantic analysis after deterministic baseline
        required: false
        type: boolean
        default: true
      pi_provider:
        description: Pi provider name for PI_E2E_ADVISOR_API_KEY
        required: false
        type: string
        default: anthropic
      pi_model:
        description: Optional Pi model pattern, for example aws/anthropic/bedrock-claude-opus-4-7 or openai/openai/gpt-5.5
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: e2e-advisor-prototype-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  advise:
    name: Pi semantic E2E recommendation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install advisor dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run deterministic E2E advisor baseline
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || inputs.base_ref }}
          HEAD_REF: ${{ github.event_name == 'pull_request' && 'HEAD' || inputs.head_ref }}
        run: |
          node tools/e2e-advisor/advisor.mjs \
            --base "$BASE_REF" \
            --head "$HEAD_REF" \
            --out-dir artifacts/e2e-advisor

      - name: Install Pi
        run: npm install -g @mariozechner/pi-coding-agent

      - name: Run Pi semantic analysis
        id: pi-analysis
        continue-on-error: true
        env:
          PI_E2E_ADVISOR_RUN_PI: ${{ github.event_name == 'workflow_dispatch' && inputs.run_pi == false && '0' || '1' }}
          PI_E2E_ADVISOR_PROVIDER: ${{ github.event_name == 'workflow_dispatch' && inputs.pi_provider || 'anthropic' }}
          PI_E2E_ADVISOR_MODEL: ${{ github.event_name == 'workflow_dispatch' && inputs.pi_model || '' }}
          # Preferred fork Phase 1 secret. The script maps this generic key to the selected provider's
          # expected env var before invoking pi, matching how local pi can be run with --api-key.
          PI_E2E_ADVISOR_API_KEY: ${{ secrets.PI_E2E_ADVISOR_API_KEY }}
          # Also support standard Pi provider env vars for future upstream/external-advisor use.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node tools/e2e-advisor/pi-analyze.mjs \
            --out-dir artifacts/e2e-advisor

      - name: Publish job summary
        if: always()
        run: |
          cat artifacts/e2e-advisor/e2e-advisor-summary.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
          if [ -f artifacts/e2e-advisor/e2e-advisor-pi-summary.md ]; then
            cat artifacts/e2e-advisor/e2e-advisor-pi-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '# Pi Semantic E2E Advisor\n\nPi analysis did not produce a summary. See raw artifacts/logs.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload advisor artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-advisor-prototype
          path: artifacts/e2e-advisor/
          if-no-files-found: error
