name: e2e-advisor-prototype

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base ref to diff against
        required: false
        default: origin/main
      head_ref:
        description: Head ref to diff
        required: false
        default: HEAD
      target_repo:
        description: Optional repo to analyze, e.g. NVIDIA/NemoClaw
        required: false
        type: string
        default: ""
      target_pr:
        description: Optional pull request number in target_repo to analyze
        required: false
        type: string
        default: ""
      run_pi:
        description: Run Pi semantic analysis after deterministic baseline
        required: false
        type: boolean
        default: true
      pi_provider:
        description: Pi provider name for PI_E2E_ADVISOR_API_KEY
        required: false
        type: string
        default: anthropic
      pi_model:
        description: Optional Pi model pattern, for example aws/anthropic/bedrock-claude-opus-4-7 or openai/openai/gpt-5.5
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: e2e-advisor-prototype-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  advise:
    name: Pi semantic E2E recommendation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install advisor dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Set default advisor workdir
        run: echo "ADVISOR_WORKDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Prepare target PR checkout
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.target_repo != '' && inputs.target_pr != '' }}
        env:
          TARGET_REPO: ${{ inputs.target_repo }}
          TARGET_PR: ${{ inputs.target_pr }}
        run: |
          TARGET_DIR=/tmp/e2e-advisor-target
          rm -rf "$TARGET_DIR"
          mkdir -p "$TARGET_DIR"
          git -C "$TARGET_DIR" init
          git -C "$TARGET_DIR" remote add target "https://github.com/${TARGET_REPO}.git"
          git -C "$TARGET_DIR" fetch --no-tags target main
          git -C "$TARGET_DIR" fetch --no-tags target "pull/${TARGET_PR}/head:refs/remotes/target/pr-${TARGET_PR}"
          git -C "$TARGET_DIR" checkout --detach "refs/remotes/target/pr-${TARGET_PR}"
          echo "ADVISOR_WORKDIR=$TARGET_DIR" >> "$GITHUB_ENV"

      - name: Run deterministic E2E advisor baseline
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event_name == 'workflow_dispatch' && inputs.target_repo != '' && inputs.target_pr != '' && 'target/main' || inputs.base_ref) }}
          HEAD_REF: ${{ github.event_name == 'pull_request' && 'HEAD' || (github.event_name == 'workflow_dispatch' && inputs.target_repo != '' && inputs.target_pr != '' && 'HEAD' || inputs.head_ref) }}
        run: |
          cd "$ADVISOR_WORKDIR"
          node "$GITHUB_WORKSPACE/tools/e2e-advisor/advisor.mjs" \
            --base "$BASE_REF" \
            --head "$HEAD_REF" \
            --manifest "$GITHUB_WORKSPACE/test/e2e/e2e-manifest.yaml" \
            --rules "$GITHUB_WORKSPACE/tools/e2e-advisor/rules.yaml" \
            --out-dir "$GITHUB_WORKSPACE/artifacts/e2e-advisor"

      - name: Install Pi
        run: npm install -g @mariozechner/pi-coding-agent

      - name: Run Pi semantic analysis
        id: pi-analysis
        continue-on-error: true
        env:
          PI_E2E_ADVISOR_RUN_PI: ${{ github.event_name == 'workflow_dispatch' && inputs.run_pi == false && '0' || '1' }}
          PI_E2E_ADVISOR_PROVIDER: ${{ github.event_name == 'workflow_dispatch' && inputs.pi_provider || 'anthropic' }}
          PI_E2E_ADVISOR_MODEL: ${{ github.event_name == 'workflow_dispatch' && inputs.pi_model || '' }}
          # Preferred fork Phase 1 secret. The script maps this generic key to the selected provider's
          # expected env var before invoking pi, matching how local pi can be run with --api-key.
          PI_E2E_ADVISOR_API_KEY: ${{ secrets.PI_E2E_ADVISOR_API_KEY }}
          # Also support standard Pi provider env vars for future upstream/external-advisor use.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd "$ADVISOR_WORKDIR"
          node "$GITHUB_WORKSPACE/tools/e2e-advisor/pi-analyze.mjs" \
            --manifest "$GITHUB_WORKSPACE/test/e2e/e2e-manifest.yaml" \
            --schema "$GITHUB_WORKSPACE/tools/e2e-advisor/schema.json" \
            --out-dir "$GITHUB_WORKSPACE/artifacts/e2e-advisor"

      - name: Publish job summary
        if: always()
        run: |
          if [ -f artifacts/e2e-advisor/e2e-advisor-summary.md ]; then
            cat artifacts/e2e-advisor/e2e-advisor-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '# E2E Advisor Prototype\n\nDeterministic analysis did not produce a summary. See logs.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
          if [ -f artifacts/e2e-advisor/e2e-advisor-pi-summary.md ]; then
            cat artifacts/e2e-advisor/e2e-advisor-pi-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '# Pi Semantic E2E Advisor\n\nPi analysis did not produce a summary. See raw artifacts/logs.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload advisor artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-advisor-prototype
          path: artifacts/e2e-advisor/
          if-no-files-found: warn
