name: Runtime / Podman CPU Proof

run-name: "Podman CPU proof PR #${{ github.event.pull_request.number }} commit ${{ github.event.pull_request.head.sha }}"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/podman-cpu-proof.yaml"
      - "src/lib/adapters/container-engine.ts"
      - "src/lib/adapters/podman/**"
      - "src/lib/onboard/docker-driver-gateway-*.ts"
      - "src/lib/onboard/managed-bootstrap/podman-*.ts"
      - "src/lib/onboard/experimental/portable-cpu-delegation-preflight*.ts"
      - "src/lib/onboard/experimental/portable-demo-lifecycle.ts"
      - "src/lib/onboard/runtime-provider/container-state-mutation.ts"
      - "src/lib/onboard/runtime-provider/docker-state-mutation.ts"
      - "src/lib/onboard/experimental/portable-host-preparation*.ts"
      - "src/lib/onboard/runtime-provider/podman*.ts"
      - "scripts/install-openshell.sh"
      - "test/e2e/live/podman-cpu-lifecycle-artifacts.ts"
      - "test/e2e/live/podman-cpu-lifecycle-helpers.ts"
      - "test/e2e/live/podman-cpu-lifecycle-policy.yaml"
      - "test/e2e/live/podman-cpu-lifecycle.test.ts"
      - "test/e2e/registry/native-runtime-qualification.ts"
      - "test/e2e/support/native-runtime-qualification.test.ts"
      - "test/e2e/live/portable-cpu-delegation-proof.test.ts"
      - "src/lib/onboard/experimental/portable-demo-lifecycle.test.ts"
      - "test/e2e/support/podman-cpu-proof-workflow.test.ts"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  portable-cpu-delegation:
    name: Portable CPU delegation admission on Ubuntu 22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      E2E_ARTIFACT_DIR: ${{ github.workspace }}/e2e-artifacts/portable-cpu-delegation
      E2E_CPU_DELEGATION_USER: nemoclaw-e2e
      E2E_TARGET_ID: portable-cpu-delegation
      E2E_SOURCE_REVISION: ${{ github.event.pull_request.head.sha }}
      NEMOCLAW_RUN_LIVE_E2E: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install locked test dependencies
        run: npm ci --ignore-scripts

      - name: Build shared sandbox-name contract
        run: npm run build:policy-boundary

      - name: Prepare app.slice CPU setting without service delegation
        shell: bash
        run: |
          set -euo pipefail
          drop_in="/etc/systemd/system/user@.service.d/90-nemoclaw-cpu-delegation.conf"
          drop_in_dir="$(dirname "$drop_in")"
          drop_in_marker="$RUNNER_TEMP/nemoclaw-cpu-delegation-drop-in-created"
          drop_in_dir_marker="$RUNNER_TEMP/nemoclaw-cpu-delegation-drop-in-dir-created"
          app_slice_drop_in="/etc/systemd/user/app.slice.d/90-nemoclaw-cpu-controller.conf"
          app_slice_drop_in_dir="$(dirname "$app_slice_drop_in")"
          app_slice_drop_in_marker="$RUNNER_TEMP/nemoclaw-app-slice-drop-in-created"
          app_slice_drop_in_dir_marker="$RUNNER_TEMP/nemoclaw-app-slice-drop-in-dir-created"
          slice_drop_in_marker="$RUNNER_TEMP/nemoclaw-cpu-slice-drop-in-created"
          slice_drop_in_dir_marker="$RUNNER_TEMP/nemoclaw-cpu-slice-drop-in-dir-created"
          source_cache_marker="$RUNNER_TEMP/nemoclaw-source-require-cache-created"
          workspace_traverse_marker="$RUNNER_TEMP/nemoclaw-workspace-traverse-modes"
          user_comment="nemoclaw-cpu-proof-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          uid=""
          created_user=0
          drop_in_temp=""
          drop_in_id=""
          drop_in_dir_id=""
          app_slice_drop_in_temp=""
          app_slice_drop_in_id=""
          created_app_slice_drop_in_dir=0
          app_slice_drop_in_dir_id=""
          slice_drop_in_dir=""
          slice_drop_in=""
          slice_drop_in_temp=""
          slice_drop_in_id=""
          created_slice_drop_in_dir=0
          slice_drop_in_dir_id=""
          source_cache_parent="$GITHUB_WORKSPACE/node_modules/.cache"
          source_cache_dir="$source_cache_parent/nemoclaw-source-require"
          source_cache_id=""

          cleanup_failed_prepare() {
            local status=$?
            local current_drop_in_id=""
            local current_app_slice_drop_in_id=""
            local current_slice_drop_in_id=""
            local current_source_cache_id=""
            local cleanup_failed=0
            trap - EXIT
            set +e
            if [ "$created_user" = 1 ] && id "$E2E_CPU_DELEGATION_USER" >/dev/null 2>&1; then
              if [ -n "$uid" ]; then
                sudo systemctl stop "user@${uid}.service" || cleanup_failed=1
              fi
            fi
            if [ -n "$slice_drop_in_temp" ]; then
              sudo rm -f -- "$slice_drop_in_temp" || cleanup_failed=1
            fi
            if [ -n "$drop_in_temp" ]; then
              sudo rm -f -- "$drop_in_temp" || cleanup_failed=1
            fi
            if [ -n "$app_slice_drop_in_temp" ]; then
              sudo rm -f -- "$app_slice_drop_in_temp" || cleanup_failed=1
            fi
            if [ -n "$source_cache_id" ]; then
              current_source_cache_id="$(sudo stat -Lc '%d:%i' -- "$source_cache_dir" 2>/dev/null)"
              if [ "$current_source_cache_id" = "$source_cache_id" ]; then
                sudo rm -rf --one-file-system -- "$source_cache_dir" || cleanup_failed=1
              elif sudo test -e "$source_cache_dir" || sudo test -L "$source_cache_dir"; then
                echo "::error::Refusing to remove a source-loader cache whose identity changed" >&2
                cleanup_failed=1
              fi
            fi
            if [ -n "$drop_in_id" ]; then
              current_drop_in_id="$(sudo stat -Lc '%d:%i' -- "$drop_in" 2>/dev/null)"
              if [ "$current_drop_in_id" = "$drop_in_id" ]; then
                sudo rm -f -- "$drop_in" || cleanup_failed=1
              elif sudo test -e "$drop_in" || sudo test -L "$drop_in"; then
                echo "::error::Refusing to remove a CPU delegation drop-in whose identity changed" >&2
                cleanup_failed=1
              fi
            fi
            if [ -n "$app_slice_drop_in_id" ]; then
              current_app_slice_drop_in_id="$(
                sudo stat -Lc '%d:%i' -- "$app_slice_drop_in" 2>/dev/null
              )"
              if [ "$current_app_slice_drop_in_id" = "$app_slice_drop_in_id" ]; then
                sudo rm -f -- "$app_slice_drop_in" || cleanup_failed=1
              elif sudo test -e "$app_slice_drop_in" \
                || sudo test -L "$app_slice_drop_in"; then
                echo "::error::Refusing to remove an app.slice proof drop-in whose identity changed" >&2
                cleanup_failed=1
              fi
            fi
            if [ -n "$slice_drop_in_id" ]; then
              current_slice_drop_in_id="$(sudo stat -Lc '%d:%i' -- "$slice_drop_in" 2>/dev/null)"
              if [ "$current_slice_drop_in_id" = "$slice_drop_in_id" ]; then
                sudo rm -f -- "$slice_drop_in" || cleanup_failed=1
              elif sudo test -e "$slice_drop_in" || sudo test -L "$slice_drop_in"; then
                echo "::error::Refusing to remove a CPU slice drop-in whose identity changed" >&2
                cleanup_failed=1
              fi
            fi
            if [ -n "$drop_in_id" ] || [ -n "$slice_drop_in_id" ]; then
              sudo systemctl daemon-reload || cleanup_failed=1
            fi
            if [ "$created_app_slice_drop_in_dir" = 1 ] \
              && [ "$(sudo stat -Lc '%d:%i' -- "$app_slice_drop_in_dir" 2>/dev/null)" \
                = "$app_slice_drop_in_dir_id" ]; then
              sudo rmdir -- "$app_slice_drop_in_dir" || cleanup_failed=1
            fi
            if [ "$created_slice_drop_in_dir" = 1 ] && [ -n "$slice_drop_in_dir" ] \
              && [ "$(sudo stat -Lc '%d:%i' -- "$slice_drop_in_dir" 2>/dev/null)" \
                = "$slice_drop_in_dir_id" ]; then
              sudo rmdir -- "$slice_drop_in_dir" || cleanup_failed=1
            fi
            if [ -n "$drop_in_dir_id" ] \
              && [ "$(sudo stat -Lc '%d:%i' -- "$drop_in_dir" 2>/dev/null)" \
                = "$drop_in_dir_id" ]; then
              sudo rmdir -- "$drop_in_dir" || cleanup_failed=1
            fi
            if [ "$created_user" = 1 ] && id "$E2E_CPU_DELEGATION_USER" >/dev/null 2>&1; then
              current_user_comment="$(
                getent passwd "$E2E_CPU_DELEGATION_USER" | cut -d: -f5
              )"
              if [ "$current_user_comment" = "$user_comment" ]; then
                sudo loginctl disable-linger "$E2E_CPU_DELEGATION_USER" || cleanup_failed=1
                sudo loginctl terminate-user "$E2E_CPU_DELEGATION_USER" || true
                sudo userdel --remove "$E2E_CPU_DELEGATION_USER" || cleanup_failed=1
              else
                echo "::error::Refusing preparation rollback for a proof user whose ownership comment changed" >&2
                cleanup_failed=1
              fi
            fi
            if [ -e "$workspace_traverse_marker" ]; then
              workspace_restore_failed=0
              while IFS=$'\t' read -r original_mode workspace_path; do
                if ! sudo chmod "$original_mode" -- "$workspace_path"; then
                  workspace_restore_failed=1
                  cleanup_failed=1
                fi
              done <"$workspace_traverse_marker"
              if [ "$workspace_restore_failed" = 0 ]; then
                rm -f -- "$workspace_traverse_marker" || cleanup_failed=1
              else
                echo "::error::Preserving the workspace mode receipt for final cleanup retry" >&2
              fi
            fi
            if [ "$cleanup_failed" != 0 ]; then
              echo "::error::Preparation rollback was incomplete; final cleanup will retry recorded resources" >&2
            fi
            exit "$status"
          }
          trap cleanup_failed_prepare EXIT

          {
            printf 'E2E_CPU_DELEGATION_USER_CLAIMED=1\n'
            printf 'E2E_CPU_DELEGATION_USER_COMMENT=%s\n' "$user_comment"
            printf 'E2E_CPU_DELEGATION_USER_CREATED=0\n'
            printf 'E2E_CPU_DELEGATION_DROP_IN_DIR=%s\n' "$drop_in_dir"
            printf 'E2E_CPU_DELEGATION_DROP_IN_DIR_MARKER=%s\n' "$drop_in_dir_marker"
            printf 'E2E_CPU_DELEGATION_DROP_IN_MARKER=%s\n' "$drop_in_marker"
            printf 'E2E_APP_SLICE_DROP_IN=%s\n' "$app_slice_drop_in"
            printf 'E2E_APP_SLICE_DROP_IN_DIR=%s\n' "$app_slice_drop_in_dir"
            printf 'E2E_APP_SLICE_DROP_IN_DIR_CREATED=0\n'
            printf 'E2E_APP_SLICE_DROP_IN_DIR_MARKER=%s\n' "$app_slice_drop_in_dir_marker"
            printf 'E2E_APP_SLICE_DROP_IN_MARKER=%s\n' "$app_slice_drop_in_marker"
            printf 'E2E_CPU_SLICE_DROP_IN_MARKER=%s\n' "$slice_drop_in_marker"
            printf 'E2E_CPU_SLICE_DROP_IN_DIR_CREATED=0\n'
            printf 'E2E_CPU_SLICE_DROP_IN_DIR_MARKER=%s\n' "$slice_drop_in_dir_marker"
            printf 'E2E_SOURCE_CACHE_DIR=%s\n' "$source_cache_dir"
            printf 'E2E_SOURCE_CACHE_MARKER=%s\n' "$source_cache_marker"
            printf 'E2E_WORKSPACE_TRAVERSE_MARKER=%s\n' "$workspace_traverse_marker"
          } >>"$GITHUB_ENV"
          if id "$E2E_CPU_DELEGATION_USER" >/dev/null 2>&1; then
            echo "::error::CPU delegation proof user already exists" >&2
            exit 1
          fi
          if sudo test -e "$drop_in" || sudo test -L "$drop_in"; then
            echo "::error::CPU delegation proof drop-in already exists" >&2
            exit 1
          fi
          if [ -e "$drop_in_marker" ] || [ -L "$drop_in_marker" ]; then
            echo "::error::CPU delegation proof ownership marker already exists" >&2
            exit 1
          fi
          if [ -e "$drop_in_dir_marker" ] || [ -L "$drop_in_dir_marker" ]; then
            echo "::error::CPU delegation drop-in directory marker already exists" >&2
            exit 1
          fi
          if sudo test -e "$app_slice_drop_in" || sudo test -L "$app_slice_drop_in"; then
            echo "::error::app.slice proof drop-in already exists" >&2
            exit 1
          fi
          if [ -e "$app_slice_drop_in_marker" ] || [ -L "$app_slice_drop_in_marker" ]; then
            echo "::error::app.slice proof ownership marker already exists" >&2
            exit 1
          fi
          if [ -e "$app_slice_drop_in_dir_marker" ] \
            || [ -L "$app_slice_drop_in_dir_marker" ]; then
            echo "::error::app.slice drop-in directory marker already exists" >&2
            exit 1
          fi
          if [ -e "$slice_drop_in_marker" ] || [ -L "$slice_drop_in_marker" ]; then
            echo "::error::CPU slice proof ownership marker already exists" >&2
            exit 1
          fi
          if [ -e "$slice_drop_in_dir_marker" ] || [ -L "$slice_drop_in_dir_marker" ]; then
            echo "::error::CPU slice drop-in directory marker already exists" >&2
            exit 1
          fi
          if [ -e "$source_cache_marker" ] || [ -L "$source_cache_marker" ]; then
            echo "::error::Source-loader cache ownership marker already exists" >&2
            exit 1
          fi
          if [ -e "$workspace_traverse_marker" ] || [ -L "$workspace_traverse_marker" ]; then
            echo "::error::Workspace traversal ownership marker already exists" >&2
            exit 1
          fi
          sudo useradd --create-home --shell /bin/bash --comment "$user_comment" \
            "$E2E_CPU_DELEGATION_USER"
          created_user=1
          printf 'E2E_CPU_DELEGATION_USER_CREATED=1\n' >>"$GITHUB_ENV"
          uid="$(id -u "$E2E_CPU_DELEGATION_USER")"
          home="$(getent passwd "$E2E_CPU_DELEGATION_USER" | cut -d: -f6)"
          slice_drop_in_dir="/run/systemd/system/user-${uid}.slice.d"
          slice_drop_in="$slice_drop_in_dir/90-nemoclaw-cpu-controller.conf"
          {
            printf 'E2E_CPU_DELEGATION_HOME=%s\n' "$home"
            printf 'E2E_CPU_DELEGATION_UID=%s\n' "$uid"
            printf 'E2E_CPU_DELEGATION_RUNTIME_DIR=/run/user/%s\n' "$uid"
            printf 'E2E_CPU_SLICE_DROP_IN=%s\n' "$slice_drop_in"
            printf 'E2E_CPU_SLICE_DROP_IN_DIR=%s\n' "$slice_drop_in_dir"
          } >>"$GITHUB_ENV"
          workspace_path="$GITHUB_WORKSPACE"
          workspace_ancestors=()
          while [ "$workspace_path" != "/" ]; do
            workspace_ancestors+=("$workspace_path")
            workspace_path="$(dirname "$workspace_path")"
          done
          : >"$workspace_traverse_marker"
          chmod 0600 "$workspace_traverse_marker"
          for ((index = ${#workspace_ancestors[@]} - 1; index >= 0; index--)); do
            workspace_path="${workspace_ancestors[$index]}"
            if ! sudo --user "$E2E_CPU_DELEGATION_USER" test -x "$workspace_path"; then
              original_mode="$(stat -c '%a' -- "$workspace_path")"
              printf '%s\t%s\n' "$original_mode" "$workspace_path" \
                >>"$workspace_traverse_marker"
              sudo chmod o+x -- "$workspace_path"
            fi
          done
          if ! sudo --user "$E2E_CPU_DELEGATION_USER" \
            test -x "$GITHUB_WORKSPACE/node_modules/.bin/vitest"; then
            echo "::error::Dedicated proof user cannot execute the Vitest entrypoint" >&2
            namei -l "$GITHUB_WORKSPACE/node_modules/.bin/vitest" >&2 || true
            exit 1
          fi
          if [ -L "$source_cache_parent" ] \
            || { [ -e "$source_cache_parent" ] && [ ! -d "$source_cache_parent" ]; }; then
            echo "::error::Source-loader cache parent has an unexpected type" >&2
            exit 1
          fi
          if [ ! -d "$source_cache_parent" ]; then
            install -d -m 0755 -- "$source_cache_parent"
          fi
          if ! sudo --user "$E2E_CPU_DELEGATION_USER" test -x "$source_cache_parent"; then
            echo "::error::Dedicated proof user cannot traverse the source-loader cache parent" >&2
            exit 1
          fi
          if sudo test -e "$source_cache_dir" || sudo test -L "$source_cache_dir"; then
            echo "::error::Source-loader cache already exists" >&2
            exit 1
          fi
          sudo mkdir -m 0700 -- "$source_cache_dir"
          source_cache_id="$(sudo stat -Lc '%d:%i' -- "$source_cache_dir")"
          printf '%s\n' "$source_cache_id" >"$source_cache_marker"
          sudo chown "$uid:$uid" -- "$source_cache_dir"
          sudo install -d -o "$uid" -g "$uid" -m 0700 "$E2E_ARTIFACT_DIR"
          if sudo test -e "$slice_drop_in" || sudo test -L "$slice_drop_in"; then
            echo "::error::CPU slice proof drop-in already exists" >&2
            exit 1
          fi
          if sudo test -L "$slice_drop_in_dir" \
            || { sudo test -e "$slice_drop_in_dir" && ! sudo test -d "$slice_drop_in_dir"; }; then
            echo "::error::CPU slice proof drop-in directory has an unexpected type" >&2
            exit 1
          fi
          if ! sudo test -d "$slice_drop_in_dir"; then
            created_slice_drop_in_dir=1
            sudo mkdir -m 0755 -- "$slice_drop_in_dir"
            slice_drop_in_dir_id="$(sudo stat -Lc '%d:%i' -- "$slice_drop_in_dir")"
            printf '%s\n' "$slice_drop_in_dir_id" >"$slice_drop_in_dir_marker"
            printf 'E2E_CPU_SLICE_DROP_IN_DIR_CREATED=1\n' >>"$GITHUB_ENV"
          fi
          if [ "$(sudo stat -Lc '%U:%G %a' -- "$slice_drop_in_dir")" != "root:root 755" ]; then
            echo "::error::CPU slice proof drop-in directory has unexpected owner or mode" >&2
            exit 1
          fi
          slice_drop_in_temp="$(sudo mktemp "$slice_drop_in_dir/.nemoclaw-cpu-controller.XXXXXX")"
          # CPU accounting alone does not activate the CPU controller on cgroup v2.
          # An explicit default CPU weight does, without changing relative weight.
          printf '[Slice]\nCPUWeight=100\n' | sudo tee "$slice_drop_in_temp" >/dev/null
          sudo chown root:root "$slice_drop_in_temp"
          sudo chmod 0644 "$slice_drop_in_temp"
          slice_drop_in_id="$(sudo stat -Lc '%d:%i' -- "$slice_drop_in_temp")"
          sudo ln -- "$slice_drop_in_temp" "$slice_drop_in"
          sudo rm -f -- "$slice_drop_in_temp"
          slice_drop_in_temp=""
          printf '%s\n' "$slice_drop_in_id" >"$slice_drop_in_marker"

          if sudo test -L "$app_slice_drop_in_dir" \
            || { sudo test -e "$app_slice_drop_in_dir" \
              && ! sudo test -d "$app_slice_drop_in_dir"; }; then
            echo "::error::app.slice proof drop-in directory has an unexpected type" >&2
            exit 1
          fi
          if ! sudo test -d "$app_slice_drop_in_dir"; then
            created_app_slice_drop_in_dir=1
            sudo mkdir -m 0755 -- "$app_slice_drop_in_dir"
            app_slice_drop_in_dir_id="$(
              sudo stat -Lc '%d:%i' -- "$app_slice_drop_in_dir"
            )"
            printf '%s\n' "$app_slice_drop_in_dir_id" >"$app_slice_drop_in_dir_marker"
            printf 'E2E_APP_SLICE_DROP_IN_DIR_CREATED=1\n' >>"$GITHUB_ENV"
          fi
          if [ "$(sudo stat -Lc '%U:%G %a' -- "$app_slice_drop_in_dir")" \
            != "root:root 755" ]; then
            echo "::error::app.slice proof drop-in directory has unexpected owner or mode" >&2
            exit 1
          fi
          app_slice_drop_in_temp="$(
            sudo mktemp "$app_slice_drop_in_dir/.nemoclaw-cpu-controller.XXXXXX"
          )"
          # The user manager enables delegated controllers for user units that request them.
          printf '[Slice]\nCPUWeight=100\n' | sudo tee "$app_slice_drop_in_temp" >/dev/null
          sudo chown root:root "$app_slice_drop_in_temp"
          sudo chmod 0644 "$app_slice_drop_in_temp"
          app_slice_drop_in_id="$(sudo stat -Lc '%d:%i' -- "$app_slice_drop_in_temp")"
          sudo ln -- "$app_slice_drop_in_temp" "$app_slice_drop_in"
          sudo rm -f -- "$app_slice_drop_in_temp"
          app_slice_drop_in_temp=""
          printf '%s\n' "$app_slice_drop_in_id" >"$app_slice_drop_in_marker"

          if sudo test -L "$drop_in_dir" \
            || { sudo test -e "$drop_in_dir" && ! sudo test -d "$drop_in_dir"; }; then
            echo "::error::CPU delegation proof drop-in directory has an unexpected type" >&2
            exit 1
          fi
          if ! sudo test -d "$drop_in_dir"; then
            sudo mkdir -m 0755 -- "$drop_in_dir"
            drop_in_dir_id="$(sudo stat -Lc '%d:%i' -- "$drop_in_dir")"
            printf '%s\n' "$drop_in_dir_id" >"$drop_in_dir_marker"
          fi
          if [ "$(sudo stat -Lc '%U:%G %a' -- "$drop_in_dir")" != "root:root 755" ]; then
            echo "::error::CPU delegation proof drop-in directory has unexpected owner or mode" >&2
            exit 1
          fi
          drop_in_temp="$(sudo mktemp "$drop_in_dir/.nemoclaw-cpu-delegation.XXXXXX")"
          printf '[Service]\nDelegate=memory pids\n' | sudo tee "$drop_in_temp" >/dev/null
          sudo chown root:root "$drop_in_temp"
          sudo chmod 0644 "$drop_in_temp"
          drop_in_id="$(sudo stat -Lc '%d:%i' -- "$drop_in_temp")"
          sudo ln -- "$drop_in_temp" "$drop_in"
          sudo rm -f -- "$drop_in_temp"
          drop_in_temp=""
          printf '%s\n' "$drop_in_id" >"$drop_in_marker"
          sudo systemctl daemon-reload
          sudo loginctl enable-linger "$E2E_CPU_DELEGATION_USER"
          if ! sudo systemctl start "user@${uid}.service"; then
            {
              sudo systemctl --no-pager --full status "user@${uid}.service" || true
              sudo journalctl --no-pager --unit "user@${uid}.service" --lines 200 || true
            } 2>&1 | python3 test/e2e/lib/redact-text.py | sudo tee \
              "$E2E_ARTIFACT_DIR/prepare-user-manager-diagnostics.txt" >/dev/null
            exit 1
          fi
          user_slice_controllers="/sys/fs/cgroup/user.slice/user-${uid}.slice/cgroup.controllers"
          if ! grep -qw cpu "$user_slice_controllers"; then
            echo "::error::dedicated proof user slice does not expose the CPU controller" >&2
            cat "$user_slice_controllers" >&2 || true
            exit 1
          fi
          trap - EXIT

      - name: Verify missing delegation blocks portable configuration and service activation
        shell: bash
        run: |
          set -euo pipefail
          sudo --user "$E2E_CPU_DELEGATION_USER" \
            env -i \
              "E2E_ARTIFACT_DIR=$E2E_ARTIFACT_DIR" \
              "E2E_CPU_DELEGATION_STATE=missing" \
              "E2E_CPU_DELEGATION_UID=$E2E_CPU_DELEGATION_UID" \
              "E2E_SOURCE_REVISION=$E2E_SOURCE_REVISION" \
              "E2E_TARGET_ID=$E2E_TARGET_ID" \
              "HOME=$E2E_CPU_DELEGATION_HOME" \
              "NEMOCLAW_RUN_LIVE_E2E=$NEMOCLAW_RUN_LIVE_E2E" \
              "PATH=$PATH" \
              "XDG_RUNTIME_DIR=$E2E_CPU_DELEGATION_RUNTIME_DIR" \
              ./node_modules/.bin/vitest run --no-cache --project e2e-live \
                test/e2e/live/portable-cpu-delegation-proof.test.ts

      - name: Apply administrator delegation and prove admission
        shell: bash
        run: |
          set -euo pipefail
          drop_in="/etc/systemd/system/user@.service.d/90-nemoclaw-cpu-delegation.conf"
          expected_drop_in_id="$(cat "$E2E_CPU_DELEGATION_DROP_IN_MARKER")"
          expected_app_slice_drop_in_id="$(cat "$E2E_APP_SLICE_DROP_IN_MARKER")"
          if [[ ! "$expected_drop_in_id" =~ ^[0-9]+:[0-9]+$ ]]; then
            echo "::error::CPU delegation proof ownership marker is invalid" >&2
            exit 1
          fi
          if [[ ! "$expected_app_slice_drop_in_id" =~ ^[0-9]+:[0-9]+$ ]]; then
            echo "::error::app.slice proof ownership marker is invalid" >&2
            exit 1
          fi
          if sudo test -L "$drop_in" || ! sudo test -f "$drop_in" \
            || [ "$(sudo stat -Lc '%d:%i' -- "$drop_in")" != "$expected_drop_in_id" ]; then
            echo "::error::CPU delegation proof drop-in identity changed before admission" >&2
            exit 1
          fi
          if sudo test -L "$E2E_APP_SLICE_DROP_IN" \
            || ! sudo test -f "$E2E_APP_SLICE_DROP_IN" \
            || [ "$(sudo stat -Lc '%d:%i' -- "$E2E_APP_SLICE_DROP_IN")" \
              != "$expected_app_slice_drop_in_id" ]; then
            echo "::error::app.slice proof drop-in identity changed before admission" >&2
            exit 1
          fi
          sudo systemctl stop "user@${E2E_CPU_DELEGATION_UID}.service"
          printf '[Service]\nDelegate=cpu memory pids\n' | sudo tee "$drop_in" >/dev/null
          sudo systemctl daemon-reload
          if ! sudo systemctl start "user@${E2E_CPU_DELEGATION_UID}.service"; then
            {
              sudo systemctl --no-pager --full status \
                "user@${E2E_CPU_DELEGATION_UID}.service" || true
              sudo journalctl --no-pager --unit \
                "user@${E2E_CPU_DELEGATION_UID}.service" --lines 200 || true
            } | python3 test/e2e/lib/redact-text.py >&2
            exit 1
          fi
          sudo --user "$E2E_CPU_DELEGATION_USER" \
            env -i \
              "E2E_ARTIFACT_DIR=$E2E_ARTIFACT_DIR" \
              "E2E_CPU_DELEGATION_STATE=delegated" \
              "E2E_CPU_DELEGATION_UID=$E2E_CPU_DELEGATION_UID" \
              "E2E_SOURCE_REVISION=$E2E_SOURCE_REVISION" \
              "E2E_TARGET_ID=$E2E_TARGET_ID" \
              "HOME=$E2E_CPU_DELEGATION_HOME" \
              "NEMOCLAW_RUN_LIVE_E2E=$NEMOCLAW_RUN_LIVE_E2E" \
              "PATH=$PATH" \
              "XDG_RUNTIME_DIR=$E2E_CPU_DELEGATION_RUNTIME_DIR" \
              ./node_modules/.bin/vitest run --no-cache --project e2e-live \
                test/e2e/live/portable-cpu-delegation-proof.test.ts

      - name: Capture CPU delegation failure diagnostics
        if: failure()
        shell: bash
        run: |
          set -u
          sudo install -d -m 0700 "$E2E_ARTIFACT_DIR"
          diagnostics="$E2E_ARTIFACT_DIR/user-manager-diagnostics.txt"
          {
            printf 'source_revision=%s\n' "$E2E_SOURCE_REVISION"
            printf 'proof_uid=%s\n' "${E2E_CPU_DELEGATION_UID:-unset}"
            if [ -n "${E2E_CPU_DELEGATION_UID:-}" ]; then
              sudo systemctl --no-pager --full status \
                "user@${E2E_CPU_DELEGATION_UID}.service" || true
              sudo journalctl --no-pager --unit \
                "user@${E2E_CPU_DELEGATION_UID}.service" --lines 200 || true
              sudo find "/sys/fs/cgroup/user.slice/user-${E2E_CPU_DELEGATION_UID}.slice" \
                -maxdepth 3 \
                \( -name 'cgroup.controllers' -o -name 'cgroup.subtree_control' \) \
                -print \
                -exec cat {} \; || true
            fi
          } 2>&1 | python3 test/e2e/lib/redact-text.py | sudo tee "$diagnostics" >/dev/null
          sudo chmod 0600 "$diagnostics"

      - name: Restore the user manager boundary
        if: always()
        shell: bash
        run: |
          set -u
          cleanup_failed=0
          drop_in="/etc/systemd/system/user@.service.d/90-nemoclaw-cpu-delegation.conf"

          remove_owned_drop_in() {
            local target="$1"
            local marker="$2"
            local label="$3"
            local expected_id=""
            local current_id=""

            if [ -z "$marker" ] || [ ! -e "$marker" ]; then
              return
            fi
            if [ -z "$target" ]; then
              echo "::error::$label path is unavailable during cleanup" >&2
              cleanup_failed=1
              return
            fi
            expected_id="$(cat "$marker")"
            if [[ ! "$expected_id" =~ ^[0-9]+:[0-9]+$ ]]; then
              echo "::error::$label ownership marker is invalid" >&2
              cleanup_failed=1
            elif ! sudo test -e "$target" && ! sudo test -L "$target"; then
              :
            elif sudo test -L "$target" || ! sudo test -f "$target"; then
              echo "::error::Refusing to remove a $label with an unexpected type" >&2
              cleanup_failed=1
            else
              current_id="$(sudo stat -Lc '%d:%i' -- "$target" 2>/dev/null)"
              if [ "$current_id" = "$expected_id" ]; then
                sudo rm -f -- "$target" || cleanup_failed=1
              else
                echo "::error::Refusing to remove a $label whose identity changed" >&2
                cleanup_failed=1
              fi
            fi
            if sudo test -e "$target" || sudo test -L "$target"; then
              echo "::error::$label remained after cleanup" >&2
              cleanup_failed=1
            fi
          }

          remove_owned_directory() {
            local target="$1"
            local marker="$2"
            local label="$3"
            local expected_id=""
            local current_id=""

            if [ -z "$marker" ] || [ ! -e "$marker" ]; then
              return
            fi
            if [ -z "$target" ]; then
              echo "::error::$label path is unavailable during cleanup" >&2
              cleanup_failed=1
              return
            fi
            expected_id="$(cat "$marker")"
            if [[ ! "$expected_id" =~ ^[0-9]+:[0-9]+$ ]]; then
              echo "::error::$label ownership marker is invalid" >&2
              cleanup_failed=1
            elif ! sudo test -e "$target" && ! sudo test -L "$target"; then
              :
            elif sudo test -L "$target" || ! sudo test -d "$target"; then
              echo "::error::Refusing to remove a $label with an unexpected type" >&2
              cleanup_failed=1
            else
              current_id="$(sudo stat -Lc '%d:%i' -- "$target" 2>/dev/null)"
              if [ "$current_id" = "$expected_id" ]; then
                sudo rmdir -- "$target" || cleanup_failed=1
              else
                echo "::error::Refusing to remove a $label whose identity changed" >&2
                cleanup_failed=1
              fi
            fi
            if sudo test -e "$target" || sudo test -L "$target"; then
              echo "::error::$label remained after cleanup" >&2
              cleanup_failed=1
            else
              rm -f -- "$marker" || cleanup_failed=1
            fi
          }

          user_owned=0
          if [ "${E2E_CPU_DELEGATION_USER_CLAIMED:-0}" = "1" ] \
            && id "$E2E_CPU_DELEGATION_USER" >/dev/null 2>&1; then
            expected_user_comment="${E2E_CPU_DELEGATION_USER_COMMENT:-}"
            current_user_comment="$(
              getent passwd "$E2E_CPU_DELEGATION_USER" | cut -d: -f5
            )"
            if [ -n "$expected_user_comment" ] \
              && [ "$current_user_comment" = "$expected_user_comment" ]; then
              user_owned=1
              uid="$(id -u "$E2E_CPU_DELEGATION_USER")"
              sudo systemctl stop "user@${uid}.service" || cleanup_failed=1
            else
              echo "::error::Refusing to remove a CPU delegation proof user whose ownership comment changed" >&2
              cleanup_failed=1
            fi
          fi
          remove_owned_drop_in \
            "$drop_in" \
            "${E2E_CPU_DELEGATION_DROP_IN_MARKER:-}" \
            "CPU delegation proof drop-in"
          remove_owned_drop_in \
            "${E2E_APP_SLICE_DROP_IN:-}" \
            "${E2E_APP_SLICE_DROP_IN_MARKER:-}" \
            "app.slice proof drop-in"
          remove_owned_drop_in \
            "${E2E_CPU_SLICE_DROP_IN:-}" \
            "${E2E_CPU_SLICE_DROP_IN_MARKER:-}" \
            "CPU slice proof drop-in"
          source_cache_dir="${E2E_SOURCE_CACHE_DIR:-}"
          source_cache_marker="${E2E_SOURCE_CACHE_MARKER:-}"
          if [ -n "$source_cache_marker" ] && [ -e "$source_cache_marker" ]; then
            expected_source_cache_id="$(cat "$source_cache_marker")"
            if [[ ! "$expected_source_cache_id" =~ ^[0-9]+:[0-9]+$ ]]; then
              echo "::error::Source-loader cache ownership marker is invalid" >&2
              cleanup_failed=1
            elif [ -z "$source_cache_dir" ]; then
              echo "::error::Source-loader cache path is unavailable during cleanup" >&2
              cleanup_failed=1
            elif ! sudo test -e "$source_cache_dir" && ! sudo test -L "$source_cache_dir"; then
              :
            elif sudo test -L "$source_cache_dir" || ! sudo test -d "$source_cache_dir"; then
              echo "::error::Refusing to remove a source-loader cache with an unexpected type" >&2
              cleanup_failed=1
            elif [ "$(sudo stat -Lc '%d:%i' -- "$source_cache_dir" 2>/dev/null)" \
              = "$expected_source_cache_id" ]; then
              sudo rm -rf --one-file-system -- "$source_cache_dir" || cleanup_failed=1
            else
              echo "::error::Refusing to remove a source-loader cache whose identity changed" >&2
              cleanup_failed=1
            fi
            if [ -n "$source_cache_dir" ] \
              && { sudo test -e "$source_cache_dir" || sudo test -L "$source_cache_dir"; }; then
              echo "::error::Source-loader cache remained after cleanup" >&2
              cleanup_failed=1
            fi
            rm -f -- "$source_cache_marker" || cleanup_failed=1
          fi
          sudo systemctl daemon-reload || cleanup_failed=1
          remove_owned_directory \
            "${E2E_APP_SLICE_DROP_IN_DIR:-}" \
            "${E2E_APP_SLICE_DROP_IN_DIR_MARKER:-}" \
            "app.slice proof drop-in directory"
          remove_owned_directory \
            "${E2E_CPU_SLICE_DROP_IN_DIR:-}" \
            "${E2E_CPU_SLICE_DROP_IN_DIR_MARKER:-}" \
            "CPU slice proof drop-in directory"
          remove_owned_directory \
            "${E2E_CPU_DELEGATION_DROP_IN_DIR:-}" \
            "${E2E_CPU_DELEGATION_DROP_IN_DIR_MARKER:-}" \
            "CPU delegation proof drop-in directory"
          if [ "$user_owned" = 1 ]; then
            if id "$E2E_CPU_DELEGATION_USER" >/dev/null 2>&1; then
              sudo loginctl disable-linger "$E2E_CPU_DELEGATION_USER" || cleanup_failed=1
              sudo loginctl terminate-user "$E2E_CPU_DELEGATION_USER" || true
              sudo userdel --remove "$E2E_CPU_DELEGATION_USER" || cleanup_failed=1
            fi
            if id "$E2E_CPU_DELEGATION_USER" >/dev/null 2>&1; then
              echo "::error::CPU delegation proof user remained after cleanup" >&2
              cleanup_failed=1
            fi
          fi
          if [ -d "$E2E_ARTIFACT_DIR" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$E2E_ARTIFACT_DIR" || cleanup_failed=1
          fi
          workspace_traverse_marker="${E2E_WORKSPACE_TRAVERSE_MARKER:-}"
          if [ -n "$workspace_traverse_marker" ] && [ -e "$workspace_traverse_marker" ]; then
            while IFS=$'\t' read -r original_mode workspace_path; do
              if [[ ! "$original_mode" =~ ^[0-7]{3,4}$ ]] || [ -z "$workspace_path" ]; then
                echo "::error::Workspace traversal ownership marker is invalid" >&2
                cleanup_failed=1
                continue
              fi
              sudo chmod "$original_mode" -- "$workspace_path" || cleanup_failed=1
            done <"$workspace_traverse_marker"
            rm -f -- "$workspace_traverse_marker" || cleanup_failed=1
          fi
          exit "$cleanup_failed"

      - name: Upload CPU delegation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-cpu-delegation-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: e2e-artifacts/portable-cpu-delegation/
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 14

  podman-cpu-lifecycle:
    name: Rootless Podman CPU lifecycle with Docker disabled
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      E2E_ARTIFACT_DIR: ${{ github.workspace }}/e2e-artifacts/podman-cpu-proof
      E2E_DEFAULT_ENABLED: "0"
      E2E_JOB: "1"
      E2E_SOURCE_REVISION: ${{ github.event.pull_request.head.sha }}
      E2E_TARGET_ID: podman-cpu-lifecycle
      NEMOCLAW_RUN_LIVE_E2E: "1"
      NEMOCLAW_OPENSHELL_PIN_VERSION: "0.0.101"
      PODMAN_APT_VERSION: "5.7.0+ds2-3build1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install locked test dependencies
        run: npm ci --ignore-scripts

      - name: Build shared sandbox-name contract
        run: npm run build:policy-boundary

      - name: Install pinned OpenShell runtime
        shell: bash
        run: |
          set -euo pipefail
          env -u GH_TOKEN -u GITHUB_TOKEN \
            NEMOCLAW_NON_INTERACTIVE=1 \
            bash scripts/install-openshell.sh
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"

      - name: Install Podman 5 runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes \
            apparmor \
            fuse-overlayfs \
            passt \
            slirp4netns \
            uidmap \
            "podman=$PODMAN_APT_VERSION"
          package_version="$(dpkg-query --show --showformat='${Version}' podman)"
          version="$(podman --version)"
          test "$package_version" = "$PODMAN_APT_VERSION"
          test "$version" = "podman version 5.7.0"
          printf '### Podman runtime\n\n`%s` (`%s`)\n' "$version" "$package_version" >>"$GITHUB_STEP_SUMMARY"

      - name: Apply Ubuntu pasta signal policy correction
        shell: bash
        run: |
          set -euo pipefail
          pasta_profile="/etc/apparmor.d/usr.bin.pasta"
          signal_rule='^[[:space:]]*signal[[:space:]]+\(receive\)[[:space:]]+peer=podman,[[:space:]]*$'
          test -f "$pasta_profile"
          test "$(grep -Fc 'include <abstractions/pasta>' "$pasta_profile")" -eq 1
          if ! grep -Eq "$signal_rule" "$pasta_profile"; then
            sudo sed -i \
              '/^[[:space:]]*include <abstractions\/pasta>[[:space:]]*$/a\  signal (receive) peer=podman,' \
              "$pasta_profile"
          fi
          test "$(grep -Ec "$signal_rule" "$pasta_profile")" -eq 1
          sudo apparmor_parser -r "$pasta_profile"

      - name: Install Docker invocation guard
        shell: bash
        run: |
          set -euo pipefail
          guard_dir="$RUNNER_TEMP/nemoclaw-podman-cpu-guard"
          guard_log="$guard_dir/docker-invocations.log"
          install -d -m 0700 "$guard_dir/bin"
          : >"$guard_log"
          cat >"$guard_dir/bin/docker" <<'DOCKER_GUARD'
          #!/usr/bin/env bash
          printf '%s\n' "$*" >>"${E2E_DOCKER_GUARD_LOG:?}"
          printf 'Docker CLI use is forbidden in the native Podman CPU proof.\n' >&2
          exit 97
          DOCKER_GUARD
          chmod 0700 "$guard_dir/bin/docker"
          {
            printf 'DOCKER_API_VERSION=\n'
            printf 'DOCKER_CERT_PATH=\n'
            printf 'DOCKER_CONFIG=\n'
            printf 'DOCKER_CONTEXT=\n'
            printf 'DOCKER_HOST=\n'
            printf 'DOCKER_TLS_VERIFY=\n'
            printf 'E2E_DOCKER_GUARD_BIN=%s\n' "$guard_dir/bin/docker"
            printf 'E2E_DOCKER_GUARD_LOG=%s\n' "$guard_log"
            printf 'PATH=%s:%s\n' "$guard_dir/bin" "$PATH"
          } >>"$GITHUB_ENV"

      - name: Disable Docker daemon and socket
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "$E2E_ARTIFACT_DIR"
          sudo systemctl stop docker.service docker.socket || true
          sudo systemctl mask --runtime docker.service docker.socket || true
          sudo pkill -TERM -x dockerd 2>/dev/null || true
          for attempt in $(seq 1 20); do
            if ! pgrep -x dockerd >/dev/null; then
              break
            fi
            sleep 1
          done
          if pgrep -x dockerd >/dev/null; then
            echo "::error::dockerd remained active after Docker shutdown" >&2
            exit 1
          fi
          sudo rm -f /var/run/docker.sock
          if systemctl is-active --quiet docker.service; then
            echo "::error::docker.service remained active after Docker shutdown" >&2
            exit 1
          fi
          if systemctl is-active --quiet docker.socket; then
            echo "::error::docker.socket remained active after Docker shutdown" >&2
            exit 1
          fi
          if [ -S /var/run/docker.sock ]; then
            echo "::error::Docker socket remained available after Docker shutdown" >&2
            exit 1
          fi
          docker_candidate="$(command -v docker || true)"
          if [ "$docker_candidate" != "$E2E_DOCKER_GUARD_BIN" ]; then
            echo "::error::Docker command resolution escaped the invocation guard" >&2
            exit 1
          fi
          jq -n \
            --arg dockerCandidate "$docker_candidate" \
            '{
              schemaVersion: 1,
              dockerServiceActive: false,
              dockerSocketActive: false,
              dockerDaemonActive: false,
              dockerSocketPresent: false,
              dockerCandidate: $dockerCandidate
            }' >"$E2E_ARTIFACT_DIR/docker-absence-boundary.json"
          source_revision="$(git rev-parse HEAD)"
          test "$source_revision" = "$E2E_SOURCE_REVISION"
          jq -n \
            --arg sourceRevision "$source_revision" \
            '{
              schemaVersion: 1,
              claim: "candidate-execution-prerequisites",
              candidateId: "podman-cpu-lifecycle",
              providerId: "podman",
              sourceRevision: $sourceRevision,
              executionPath: "runtime-provider-bundle",
              architecture: "amd64",
              acceleration: "cpu",
              agents: ["openclaw", "hermes", "langchain-deepagents-code"],
              socketFree: true,
              dockerUnavailable: {
                service: true,
                socket: true,
                daemon: true,
                invocationGuard: true
              }
            }' >"$E2E_ARTIFACT_DIR/candidate-execution-prerequisites.json"

      - name: Start exact rootless Podman API socket
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          uid="$(id -u)"
          runtime_dir="/run/user/$uid"
          socket_path="$runtime_dir/podman/podman.sock"
          if [ ! -d "$runtime_dir" ]; then
            sudo install -d -o "$uid" -g "$(id -g)" -m 0700 "$runtime_dir"
          fi
          install -d -m 0700 "$runtime_dir" "$runtime_dir/podman" "$E2E_ARTIFACT_DIR"
          containers_conf="$RUNNER_TEMP/nemoclaw-podman-cpu-containers.conf"
          cat >"$containers_conf" <<'CONTAINERS_CONF'
          [network]
          default_rootless_network_cmd = "pasta"
          firewall_driver = "iptables"

          [engine]
          env = ["NETAVARK_FW=iptables"]
          CONTAINERS_CONF
          chmod 0600 "$containers_conf"
          export CONTAINERS_CONF="$containers_conf"
          export NETAVARK_FW=iptables
          service_log="$E2E_ARTIFACT_DIR/podman-system-service.log"
          podman system service --time=0 "unix://$socket_path" >"$service_log" 2>&1 &
          service_pid="$!"
          for attempt in $(seq 1 30); do
            if podman --url "unix://$socket_path" info --format json \
              >"$E2E_ARTIFACT_DIR/podman-info.json" 2>>"$service_log"; then
              break
            fi
            test "$attempt" -lt 30
            sleep 1
          done
          test -S "$socket_path"
          jq -e '
            (.host.security.rootless // .Host.Security.Rootless) == true
            and ((.host.cgroupVersion // .Host.CgroupVersion) | ascii_downcase) == "v2"
            and ((.host.rootlessNetworkCmd // .Host.RootlessNetworkCmd) | ascii_downcase) == "pasta"
          ' "$E2E_ARTIFACT_DIR/podman-info.json" >/dev/null
          {
            printf 'CONTAINERS_CONF=%s\n' "$containers_conf"
            printf 'E2E_PODMAN_SERVICE_PID=%s\n' "$service_pid"
            printf 'E2E_PODMAN_SOCKET=%s\n' "$socket_path"
            printf 'NETAVARK_FW=iptables\n'
            printf 'XDG_RUNTIME_DIR=%s\n' "$runtime_dir"
          } >>"$GITHUB_ENV"

      - name: Prove pinned OpenShell activation and registered-agent Podman CPU lifecycle
        run: npx vitest run --project e2e-live test/e2e/live/podman-cpu-lifecycle.test.ts

      - name: Verify Docker stayed unavailable
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$E2E_DOCKER_GUARD_LOG"
          test ! -s "$E2E_DOCKER_GUARD_LOG"
          test "$(command -v docker)" = "$E2E_DOCKER_GUARD_BIN"
          ! systemctl is-active --quiet docker.service
          ! systemctl is-active --quiet docker.socket
          test ! -S /var/run/docker.sock

      - name: Capture failed Podman lifecycle diagnostics
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          endpoint="unix://${E2E_PODMAN_SOCKET:-/run/user/$(id -u)/podman/podman.sock}"
          diagnostic_dir="$E2E_ARTIFACT_DIR/failure-diagnostics"
          install -d -m 0700 "$diagnostic_dir"
          summary_rows="$(mktemp "$RUNNER_TEMP/podman-managed-summary.XXXXXX")"
          trap 'rm -f "$summary_rows"' EXIT
          mapfile -t managed_ids < <(
            podman --url "$endpoint" ps --all --quiet --no-trunc \
              --filter label=openshell.managed=true 2>/dev/null || true
          )
          for container_id in "${managed_ids[@]}"; do
            podman --url "$endpoint" inspect "$container_id" 2>/dev/null \
              | npx --no-install tsx test/e2e/live/podman-cpu-lifecycle-artifacts.ts \
                2>/dev/null >>"$summary_rows" || true
          done
          jq -s '{schemaVersion: 1, containers: .}' "$summary_rows" \
            >"$diagnostic_dir/managed-container-summary.json"
          rm -f "$summary_rows"
          trap - EXIT
          podman --url "$endpoint" network inspect openshell-docker \
            >"$diagnostic_dir/openshell-docker-network.json" 2>&1 || true
          podman --url "$endpoint" volume ls --format '{{.Name}}' \
            >"$diagnostic_dir/podman-volumes.txt" 2>&1 || true
          podman --url "$endpoint" secret ls --format '{{.Name}}' \
            >"$diagnostic_dir/podman-secrets.txt" 2>&1 || true

      - name: Clean up rootless Podman runtime
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          endpoint="unix://${E2E_PODMAN_SOCKET:-/run/user/$(id -u)/podman/podman.sock}"
          mapfile -t managed_ids < <(
            podman --url "$endpoint" ps --all --quiet --no-trunc \
              --filter label=openshell.managed=true 2>/dev/null || true
          )
          if [ "${#managed_ids[@]}" -gt 0 ]; then
            podman --url "$endpoint" rm --force "${managed_ids[@]}" || true
          fi
          while IFS= read -r volume_name; do
            case "$volume_name" in
              openshell-*-workspace)
                podman --url "$endpoint" volume rm --force "$volume_name" || true
                ;;
            esac
          done < <(podman --url "$endpoint" volume ls --format '{{.Name}}' 2>/dev/null || true)
          while IFS= read -r secret_name; do
            case "$secret_name" in
              openshell-*-token | openshell-*-proxy)
                podman --url "$endpoint" secret rm "$secret_name" || true
                ;;
            esac
          done < <(podman --url "$endpoint" secret ls --format '{{.Name}}' 2>/dev/null || true)
          podman --url "$endpoint" network rm openshell-docker 2>/dev/null || true
          service_pid="${E2E_PODMAN_SERVICE_PID:-}"
          if [[ "$service_pid" =~ ^[1-9][0-9]*$ ]]; then
            kill "$service_pid" 2>/dev/null || true
            wait "$service_pid" 2>/dev/null || true
          fi

      - name: Upload Podman CPU proof artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: podman-cpu-proof-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: e2e-artifacts/podman-cpu-proof
          if-no-files-found: error
          retention-days: 7
