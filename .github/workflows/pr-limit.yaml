name: Automation / PR Limit

# pull_request_target runs in the base repository context. This workflow never
# checks out or executes pull request code.
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  check-pr-limit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: pr-limit-${{ github.repository }}-${{ github.event.pull_request.user.login }}
      queue: max
      cancel-in-progress: false
    steps:
      - name: Check open PR count for author
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pull = context.payload.pull_request;
            const author = pull.user.login;
            const elevatedAccounts = new Set([
              "apurvvkumaria",
              "chengjiew",
              "cjagwani",
              "cv",
              "dongni-yang",
              "ericksoa",
              "jyaunches",
              "laitingsheng",
              "prekshivyas",
              "rluo8",
              "rsliter",
              "sandl99",
              "senthilr-nv",
              "tedy-y",
              "tonyluo-nv",
              "wscurran",
              "yimoj",
            ]);
            const limit = elevatedAccounts.has(author.toLowerCase()) ? 10 : 5;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: "open",
              creator: author,
              sort: "created",
              direction: "asc",
              per_page: 100,
            });
            const openCount = issues.filter(
              (issue) =>
                issue.pull_request &&
                (context.payload.action === "reopened" || issue.number <= pull.number),
            ).length;

            core.info(`Author ${author} has ${openCount} open PR(s); limit is ${limit}`);
            if (openCount <= limit) return;

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: pull.number,
              body: `This repository limits you to ${limit} open pull requests. Please close or merge an existing PR before opening another one.`,
            });
            await github.rest.pulls.update({
              ...context.repo,
              pull_number: pull.number,
              state: "closed",
            });
            core.setFailed(`PR closed because ${author} exceeds the ${limit}-open-PR limit`);
