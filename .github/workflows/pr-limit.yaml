name: Automation / PR Limit

# pull_request_target gives the token write access for fork PRs. The checkout
# is pinned to the trusted base commit, so this workflow never executes code
# from the pull request.
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  check-pr-limit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: pr-limit-${{ github.repository }}-${{ github.event.pull_request.user.login }}
      cancel-in-progress: false
    steps:
      - name: Check out trusted base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Enforce contributor PR limit
        uses: ./.github/actions/pr-limit
        with:
          token: ${{ github.token }}
