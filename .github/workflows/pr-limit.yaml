name: Automation / PR Limit

# pull_request_target runs in the base repository context. This workflow never
# checks out or executes pull request code.
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  check-pr-limit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: pr-limit-${{ github.repository }}-${{ github.event.pull_request.user.login }}
      queue: max
      cancel-in-progress: false
    steps:
      - name: Check open PR count for author
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ github.event.action }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          case "${AUTHOR,,}" in
            apurvvkumaria|chengjiew|cjagwani|cv|dongni-yang|ericksoa|jyaunches|laitingsheng|prekshivyas|rluo8|rsliter|sandl99|senthilr-nv|tedy-y|tonyluo-nv|wscurran|yimoj)
              LIMIT=10
              ;;
            *)
              LIMIT=5
              ;;
          esac

          OPEN_COUNT=$(gh api --paginate \
            "repos/$REPO/issues?state=open&creator=$AUTHOR&sort=created&direction=asc&per_page=100" \
            | jq --slurp --arg action "$ACTION" --argjson pr "$PR_NUMBER" \
              '[.[][] | select(.pull_request and ($action == "reopened" or .number <= $pr))] | length')

          echo "Author $AUTHOR has $OPEN_COUNT open PR(s); limit is $LIMIT"

          if [ "$OPEN_COUNT" -gt "$LIMIT" ]; then
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body \
              "This repository limits you to $LIMIT open pull requests. Please close or merge an existing PR before opening another one."
            gh pr close "$PR_NUMBER" --repo "$REPO"
            echo "::error::PR closed because $AUTHOR exceeds the $LIMIT-open-PR limit"
            exit 1
          fi
