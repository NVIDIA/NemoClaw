name: Qualification / Issue 12285 WSL transport

on:
  push:
    branches: [fix/issue-12285-wsl-transport]
    paths: [.github/workflows/issue-12285-wsl-proof.yaml, tools/wsl/llama-bridge-proof.mts]

permissions:
  contents: read

jobs:
  windows-arm:
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - name: Record Windows virtualization and WSL capabilities
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture | Format-List
          Get-CimInstance Win32_ComputerSystem | Select-Object Manufacturer, Model, HypervisorPresent | Format-List
          Get-CimInstance Win32_Processor | Select-Object Name, VirtualizationFirmwareEnabled, SecondLevelAddressTranslationExtensions | Format-List
          Get-WindowsOptionalFeature -Online -FeatureName VirtualMachinePlatform | Format-List
          Get-WindowsOptionalFeature -Online -FeatureName Microsoft-Windows-Subsystem-Linux | Format-List
          wsl.exe --status
          wsl.exe --version
          exit 0

      - name: Install Ubuntu for WSL2
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'wsl.arm64.msi'
          Invoke-WebRequest 'https://github.com/microsoft/WSL/releases/download/3.0.1/wsl.3.0.1.0.arm64.msi' -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne '857ddbb335ec7d05ffa71d0fd2203750c0e8fc29bb164f8a95db92bd7bba4263') {
            throw 'Microsoft WSL installer checksum mismatch'
          }
          $installation = Start-Process msiexec.exe -ArgumentList @('/i', $installer, '/quiet', '/norestart') -Wait -PassThru
          if ($installation.ExitCode -ne 0) { throw "WSL package installation failed or requires reboot: $($installation.ExitCode)" }
          Enable-WindowsOptionalFeature -Online -FeatureName VirtualMachinePlatform -All -NoRestart | Format-List
          wsl.exe --version
          wsl.exe --install --distribution Ubuntu-24.04 --web-download --no-launch
          if ($LASTEXITCODE -ne 0) { throw "WSL installation failed with exit $LASTEXITCODE" }
          wsl.exe --set-version Ubuntu-24.04 2
          if ($LASTEXITCODE -ne 0) { throw "WSL2 initialization failed with exit $LASTEXITCODE" }
          wsl.exe --distribution Ubuntu-24.04 --user root -- uname -a
          if ($LASTEXITCODE -ne 0) { throw "WSL2 execution failed with exit $LASTEXITCODE" }
          wsl.exe --list --verbose
