# Temporary diagnostic: where the first Docker Buildx calls spend their time on
# hosted runners. Removed before the pull request is ready.
name: Diagnose Docker startup
on:
  push:
    branches: [cv/bake-tests-docker-startup]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  measure:
    name: ${{ matrix.os }} ${{ matrix.order }} ${{ matrix.rep }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        order: [docker-first, read-first]
        rep: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Measure
        env:
          ORDER: ${{ matrix.order }}
        run: |
          majfault() { awk '/^pgmajfault/ {print $2}' /proc/vmstat; }
          sectors() { awk '$3 ~ /^(sda|vda|nvme0n1)$/ {s += $6} END {print s+0}' /proc/diskstats; }
          t() {
            local label=$1; shift
            local f0 s0 a b
            f0=$(majfault); s0=$(sectors); a=$(date +%s.%N)
            "$@" >/tmp/out 2>/tmp/err; local rc=$?
            b=$(date +%s.%N)
            printf '%-40s %6.3f s rc=%d majfaults=%d readMB=%d\n' "$label" "$(echo "$b - $a" | bc)" "$rc" \
              "$(( $(majfault) - f0 ))" "$(( ($(sectors) - s0) / 2048 ))"
          }
          echo "uptime: $(cat /proc/uptime)"
          echo "docker unit: $(systemctl is-active docker) since $(systemctl show docker -p ActiveEnterTimestampMonotonic --value) us after boot"
          echo "docker.socket: $(systemctl is-active docker.socket)"
          docker_bin=$(readlink -f "$(command -v docker)")
          buildx_bin=$(ls /usr/libexec/docker/cli-plugins/docker-buildx /usr/local/lib/docker/cli-plugins/docker-buildx 2>/dev/null | head -1)
          ls -la "$docker_bin" "$buildx_bin"
          lsblk -o NAME,SIZE,ROTA,TYPE,MOUNTPOINT | head -20
          if [ "$ORDER" = read-first ]; then
            t "cat docker binary" cat "$docker_bin"
            t "cat buildx binary" cat "$buildx_bin"
          fi
          t "docker buildx version (1st)" docker buildx version
          t "docker buildx version (2nd)" docker buildx version
          t "bake --print dummy (1st)" docker buildx bake --print dummy
          t "bake --print dummy (2nd)" docker buildx bake --print dummy
          t "bake --print without a daemon" env DOCKER_HOST=unix:///nonexistent.sock docker buildx bake --print dummy
          tail -2 /tmp/err
          if [ "$ORDER" = docker-first ]; then
            t "cat docker binary (after)" cat "$docker_bin"
            t "cat buildx binary (after)" cat "$buildx_bin"
          fi
          echo "--- sockets bake --print connects to"
          command -v strace >/dev/null || sudo apt-get install -y -q strace >/dev/null
          strace -f -e trace=connect -o /tmp/st docker buildx bake --print dummy >/dev/null 2>&1 || true
          grep -o 'sun_path="[^"]*"\|sin_addr=inet_addr("[^"]*")' /tmp/st | sort | uniq -c || echo none
          echo "--- versions"
          docker version --format 'client {{.Client.Version}} server {{.Server.Version}}'
          docker buildx version
          docker buildx ls
