name: Images / OpenClaw tar security revision

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Historical NemoClaw release tag to revise (v0.0.50 through v0.0.89)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: openclaw-tar-security-revision
  cancel-in-progress: false

jobs:
  build-and-push:
    if: github.repository == 'NVIDIA/NemoClaw' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable publication plan
        id: plan
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          plan="$(node --experimental-strip-types scripts/openclaw-tar-security-revision.mts --plan "$RELEASE_TAG")"
          source_tag="$(jq -r .releaseTag <<<"$plan")"
          openclaw_version="$(jq -r .openClawVersion <<<"$plan")"
          revision_tag="$(jq -r .revisionTag <<<"$plan")"
          image='ghcr.io/nvidia/nemoclaw/sandbox-base'
          source_ref="${image}:${source_tag}"
          manifest="$(docker buildx imagetools inspect "$source_ref" --format '{{json .Manifest}}')"
          source_digest="$(jq -er .digest <<<"$manifest")"
          [[ "$source_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          source_image="${image}@${source_digest}"
          destination_image="${image}:${revision_tag}"

          error_file="$(mktemp)"
          if docker buildx imagetools inspect "$destination_image" > /dev/null 2>"$error_file"; then
            echo "ERROR: Refusing to overwrite existing revision tag ${destination_image}" >&2
            exit 1
          fi
          if ! grep -Eqi 'manifest unknown|not found' "$error_file"; then
            echo "ERROR: Could not prove revision tag is absent" >&2
            cat "$error_file" >&2
            exit 1
          fi
          rm -f "$error_file"

          {
            printf 'source_ref=%s\n' "$source_ref"
            printf 'source_digest=%s\n' "$source_digest"
            printf 'source_image=%s\n' "$source_image"
            printf 'destination_image=%s\n' "$destination_image"
            printf 'openclaw_version=%s\n' "$openclaw_version"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push immutable security revision
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.openclaw-tar-security-revision
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.plan.outputs.destination_image }}
          provenance: mode=max
          sbom: true
          build-args: |
            BASE_IMAGE=${{ steps.plan.outputs.source_image }}
            EXPECTED_OPENCLAW_VERSION=${{ steps.plan.outputs.openclaw_version }}

      - name: Verify published revision
        env:
          SOURCE_REF: ${{ steps.plan.outputs.source_ref }}
          SOURCE_DIGEST: ${{ steps.plan.outputs.source_digest }}
          DESTINATION_IMAGE: ${{ steps.plan.outputs.destination_image }}
        run: |
          set -euo pipefail
          current_source="$(docker buildx imagetools inspect "$SOURCE_REF" --format '{{json .Manifest}}' | jq -er .digest)"
          test "$current_source" = "$SOURCE_DIGEST"
          published="$(docker buildx imagetools inspect "$DESTINATION_IMAGE" --format '{{json .Manifest}}')"
          revision_digest="$(jq -er .digest <<<"$published")"
          [[ "$revision_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(jq '[.manifests[] | select(.platform.os == "linux" and (.platform.architecture == "amd64" or .platform.architecture == "arm64")) | .platform.architecture] | unique | length' <<<"$published")" = 2
          {
            printf 'Published `%s@%s` from `%s@%s`.\n\n' "$DESTINATION_IMAGE" "$revision_digest" "$SOURCE_REF" "$SOURCE_DIGEST"
            printf 'To rebuild an affected release without changing its tag, set `NEMOCLAW_SANDBOX_BASE_IMAGE_REF=%s@%s` for onboarding.\n' "$DESTINATION_IMAGE" "$revision_digest"
          } >> "$GITHUB_STEP_SUMMARY"
