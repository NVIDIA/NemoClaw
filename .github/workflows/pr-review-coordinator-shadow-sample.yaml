name: Automation / PR Review Coordinator Shadow Sample

run-name: Shadow sample after Advisor run ${{ github.event.workflow_run.id }}

on:
  workflow_run:
    workflows:
      - Automation / PR Review Advisor
    types:
      - completed

permissions: {}

jobs:
  collect:
    name: Collect bounded shadow sample
    if: >-
      ${{
      github.repository == 'NVIDIA/NemoClaw' &&
      github.event.workflow_run.status == 'completed' &&
      (github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure') &&
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'NVIDIA/NemoClaw' &&
      github.event.workflow_run.path == '.github/workflows/pr-review-advisor.yaml'
      }}
    concurrency:
      group: pr-review-coordinator-shadow-sample
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted sample collector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          lfs: false
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.1"

      - name: Collect distinct read-only decision
        id: collect
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node --no-warnings tools/pr-review-coordinator/shadow-sample.mts

      - name: Retain shadow sample
        if: ${{ steps.collect.outputs.sampled == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-review-coordinator-shadow-sample
          path: artifacts/pr-review-coordinator-shadow-sample/sample.json
          if-no-files-found: error
          retention-days: 90
