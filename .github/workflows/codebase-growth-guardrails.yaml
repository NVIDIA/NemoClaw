name: CI / Codebase Growth Guardrails

# pull_request_target runs in the base repo context, so this policy cannot be
# bypassed by editing workflow files or tools in the PR. The trusted assertion
# reads PR metadata and blobs as data. It does not execute PR code.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  codebase-growth-guardrails:
    name: codebase-growth-guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the trusted base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Install trusted dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Enforce the codebase growth contract
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node --experimental-strip-types tools/growth-guardrails/check-pr.mts
