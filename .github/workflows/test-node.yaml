name: Test Node Fix

on:
  push:
    branches:
      - test/node-version-validation
  workflow_dispatch:

jobs:
  test-install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Node
        run: |
          node -v
          npm -v

      # 🔥 CRITICAL STEP (YOU WERE MISSING THIS)
      - name: Authenticate GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | gh auth login --with-token
          gh auth status

      - name: Run installer
        env:
          NEMOCLAW_NON_INTERACTIVE: 1
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          set -x

          chmod +x install.sh
          ./install.sh