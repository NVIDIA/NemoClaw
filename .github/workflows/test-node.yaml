name: Test Node Fix

on:
  push:
    branches:
      - test/node-version-validation
  workflow_dispatch:

jobs:
  test-install:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Node
        run: |
          node -v
          npm -v

      - name: Run installer
        env:
          NEMOCLAW_NON_INTERACTIVE: 1
        run: |
          set -e
          set -x

          chmod +x install.sh
          ./install.sh