name: E2E / Colossus runner connectivity

on:
  push:
    branches: [v1]
  workflow_dispatch:
    inputs:
      suite:
        description: >-
          smoke checks nvidia-smi; bundle runs ARM64 checks; station runs smoke then the reference E2E.
        type: choice
        options: [smoke, bundle, station]
        default: smoke

permissions: {}

concurrency:
  group: colossus-connectivity-manual
  cancel-in-progress: false

jobs:
  # Temporary PR #14356 qualification; restore v1-only dispatch before merge.
  smoke:
    if: github.repository == 'NVIDIA/NemoClaw' && (github.ref == 'refs/heads/v1' || github.ref == 'refs/heads/hple/dgx-station-reference-e2e') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'smoke' || inputs.suite == 'station')))
    runs-on: colossus-gb300-pilot
    timeout-minutes: 2
    # Unavailable hardware skips the Station lane without failing other CI.
    continue-on-error: true
    outputs:
      ready: ${{ steps.gpu.outcome == 'success' }}
    steps:
      - name: Check NVIDIA GPU access
        id: gpu
        shell: bash
        run: nvidia-smi

  # The pilot runner takes one job at a time, so these jobs run one after
  # another, where hosted runners run the test partitions in parallel. The jobs
  # restore the hosted runners' Rust caches but never save them, so hosted runs
  # never restore artifacts built on the leased machine.
  bundle:
    if: github.repository == 'NVIDIA/NemoClaw' && github.ref == 'refs/heads/v1' && github.event_name == 'workflow_dispatch' && inputs.suite == 'bundle'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/bundle-platform.yml
    with:
      runner: colossus-gb300-pilot
      platform: linux_arm64
      bundle: true
      lifecycle: true
      e2e: false
      save-cache: false

  station:
    needs: smoke
    if: "!cancelled() && github.repository == 'NVIDIA/NemoClaw' && (github.ref == 'refs/heads/v1' || github.ref == 'refs/heads/hple/dgx-station-reference-e2e') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'station')) && needs.smoke.outputs.ready == 'true'"
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/hcl-e2e.yml
    with:
      target: dgx-station
      hosted: false
