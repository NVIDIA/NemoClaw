name: E2E / Colossus runner connectivity

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Runner label for the smoke test
        type: string
        default: colossus-gb300

permissions: {}

concurrency:
  group: colossus-connectivity-manual
  cancel-in-progress: false

jobs:
  smoke:
    if: github.repository == 'NVIDIA/NemoClaw' && github.ref == 'refs/heads/v1' && github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 2
    steps:
      - name: Confirm job execution
        shell: bash
        run: "true"
