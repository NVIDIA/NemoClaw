name: E2E / Colossus runner connectivity

on:
  workflow_dispatch:
    inputs:
      suite:
        description: >-
          smoke checks nvidia-smi; bundle runs the Linux ARM64 build and tests;
          station runs OpenClaw with local Nemotron 3.5 text inference and cleanup.
        type: choice
        options: [smoke, bundle, station]
        default: smoke

permissions: {}

concurrency:
  group: colossus-connectivity-manual
  cancel-in-progress: false

jobs:
  smoke:
    if: github.repository == 'NVIDIA/NemoClaw' && github.ref == 'refs/heads/v1' && github.event_name == 'workflow_dispatch' && inputs.suite == 'smoke'
    runs-on: colossus-gb300-pilot
    timeout-minutes: 2
    steps:
      - name: Check NVIDIA GPU access
        shell: bash
        run: nvidia-smi

  # The pilot runner takes one job at a time, so these jobs run one after
  # another, where hosted runners run the test partitions in parallel. The jobs
  # restore the hosted runners' Rust caches but never save them, so hosted runs
  # never restore artifacts built on the leased machine.
  bundle:
    if: github.repository == 'NVIDIA/NemoClaw' && github.ref == 'refs/heads/v1' && github.event_name == 'workflow_dispatch' && inputs.suite == 'bundle'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/bundle-platform.yml
    with:
      runner: colossus-gb300-pilot
      platform: linux_arm64
      bundle: true
      lifecycle: true
      e2e: false
      save-cache: false

  station:
    if: github.repository == 'NVIDIA/NemoClaw' && github.ref == 'refs/heads/v1' && github.event_name == 'workflow_dispatch' && inputs.suite == 'station'
    runs-on: colossus-gb300-pilot
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
    env:
      TEST_PLATFORM: linux_arm64
      CARGO_INCREMENTAL: "0"
      NEMOCLAW_HCL_CASE: dgx-station-openclaw-nemotron
      # Upstream cf5cea2 contains vLLM #64506. Pin its ARM64 image, not the
      # moving nightly tag; existing RTX cases keep the default runtime base.
      STATION_VLLM_BASE: vllm/vllm-openai@sha256:0d69205f3227e47b750b05789f117abbd929b67eccc46060e0d22ce4021c0318
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the prepared Station
        timeout-minutes: 2
        run: |
          test "$(uname -m)" = aarch64
          . /etc/os-release
          test "$ID" = ubuntu
          test "${VERSION_ID%%.*}" = 24
          nvidia-smi
          nvidia-smi --query-gpu=name --format=csv,noheader | grep -Fx 'NVIDIA GB300'
          # A persistent runner must already be prepared. Do not restart Docker
          # or use the hosted-runner containerd-store action here.
          docker info --format '{{json .DriverStatus}}' | grep -q io.containerd.snapshotter.v1
          for label in nemoclaw.nvidia.com/uid openshell.ai/sandbox-namespace; do
            test -z "$(docker --host unix:///var/run/docker.sock ps -q --filter "label=$label")"
          done
          umask 077
          parent="$HOME/.local/state/nemoclaw-ci/colossus"
          mkdir -p "$parent"
          run="$parent/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$run"
          mkdir "$run"
          {
            echo "NEMOCLAW_HCL_RUN=$run"
            echo "NEMOCLAW_HCL_DOCUMENT=$run/case.yaml"
            echo "NEMOCLAW_TEST_BUNDLE=$GITHUB_WORKSPACE/dist/linux_arm64"
          } >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-rust
        with:
          platform: linux_arm64
          save-cache: "false"
      - name: Build the candidate bundle, test, and ARM64 images
        timeout-minutes: 30
        run: |
          cargo ci bundle
          executable=$(cargo test --locked -p nemoclaw-e2e --test e2e --no-run --message-format=json |
            jq -r 'select(.reason == "compiler-artifact" and .target.name == "e2e" and .profile.test) | .executable' | tail -1)
          test -x "$executable"
          cargo images build --platform linux/arm64 openclaw
          docker buildx bake vllm --set "vllm.args.VLLM_IMAGE=$STATION_VLLM_BASE" \
            --set vllm.tags=nc-prototype-vllm:station
          # Keep the original bundle with private recovery state.
          cp -a "$NEMOCLAW_TEST_BUNDLE" "$NEMOCLAW_HCL_RUN/bundle"
          cp "$executable" "$NEMOCLAW_HCL_RUN/e2e"
          echo "NEMOCLAW_E2E_EXECUTABLE=$NEMOCLAW_HCL_RUN/e2e" >> "$GITHUB_ENV"
          echo "NEMOCLAW_TEST_BUNDLE=$NEMOCLAW_HCL_RUN/bundle" >> "$GITHUB_ENV"
      - name: Bind the Station example
        run: |
          # As in Live / HCL, bind an owned copy to this run's images and UID.
          # The single runner serializes uses of the example's fixed ports;
          # the HCL harness selects a subnet clear of retained networks.
          id() { docker image inspect --format '{{.Id}}' "$1"; }
          openclaw=$(id nc-fabric:openclaw)
          runtime=$(id nc-prototype-vllm:station)
          uid=$(cat /proc/sys/kernel/random/uuid)
          umask 077
          sed -e "s#^  uid: .*#  uid: $uid#" \
            -e "s#nc-fabric@sha256:0\{64\}#nc-fabric@$openclaw#" \
            -e "s#nc-prototype-vllm@sha256:0\{64\}#nc-prototype-vllm@$runtime#" \
            -e 's#nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4#nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4#' \
            -e 's#ff433f5493e25d631c9f12b5d55c674229923d02#da5b2650a835292c678994a1fa3fb653250fb508#' \
            -e 's#nemotron-3-super#nemotron-3.5-super-vl#g' \
            examples/gtc-dc/openclaw-dgx-station.yaml > "$NEMOCLAW_HCL_DOCUMENT"
      - name: Run deployment, inference, and teardown
        timeout-minutes: 45
        working-directory: crates/nemoclaw-e2e
        run: '"$NEMOCLAW_E2E_EXECUTABLE" hcl_live::case --exact --ignored --nocapture'
      - name: Destroy and independently verify runtime cleanup
        if: always()
        timeout-minutes: 10
        run: |
          [[ -n ${NEMOCLAW_HCL_RUN:-} && -f "$NEMOCLAW_HCL_RUN/case.json" ]] || exit 0
          state="$NEMOCLAW_HCL_RUN/deployment"
          if [[ -d $state ]]; then
            "$NEMOCLAW_TEST_BUNDLE/bin/nemoclaw" destroy --output json --progress off --state-dir "$state" \
              > "$NEMOCLAW_HCL_RUN/work/destroy.stdout" 2> "$NEMOCLAW_HCL_RUN/work/destroy.stderr"
            jq -e '.outcome == "destroyed"' "$NEMOCLAW_HCL_RUN/work/destroy.stdout"
          fi
          "$NEMOCLAW_E2E_EXECUTABLE" station::cleanup --exact --ignored --nocapture
      - name: Upload outcome evidence
        if: always() && env.NEMOCLAW_HCL_RUN != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: station-reference-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.NEMOCLAW_HCL_RUN }}/reports/*.json
          if-no-files-found: ignore
          retention-days: 7
