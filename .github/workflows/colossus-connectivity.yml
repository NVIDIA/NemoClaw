name: E2E / Colossus runner connectivity

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: colossus-connectivity-manual
  cancel-in-progress: false

jobs:
  smoke:
    if: github.repository == 'NVIDIA/NemoClaw' && github.ref == 'refs/heads/v1' && github.event_name == 'workflow_dispatch'
    runs-on: colossus-gb300-pilot
    timeout-minutes: 2
    steps:
      - name: Confirm job execution
        shell: bash
        run: "true"
