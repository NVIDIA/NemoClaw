name: Images / Sandbox Image Contracts

on:
  # Manual dispatch is the branch-validation path. Non-main refs set
  # DOCKERHUB_AUTH_REQUIRED=0 and pull anonymously; only trusted NVIDIA main
  # dispatches receive Docker Hub credentials.
  workflow_dispatch:
    inputs:
      run_security_scans:
        description: "Optionally scan amd64 images; Critical vulnerabilities, verified secrets, malware, and scanner failures block (NVIDIA main only)"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      run_arm64:
        description: "Build sandbox images on arm64 too"
        required: false
        type: boolean
        default: false
      run_security_scans:
        description: "Optionally scan amd64 images; Critical vulnerabilities, verified secrets, malware, and scanner failures block (NVIDIA main only)"
        required: false
        type: boolean
        default: false
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      NGC_API_KEY:
        required: false
      PULSE_SSA_CLIENT_ID:
        required: false
      PULSE_SSA_CLIENT_SECRET:
        required: false

permissions:
  contents: read

jobs:
  build-sandbox-images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Keep the credential-bearing auth anchor isolated from the shared
      # non-secret setup anchors. Each image builder gets its own Docker config
      # and explicit cleanup. Direct branch
      # dispatches pull anonymously; only trusted NVIDIA main push/manual runs
      # receive Docker Hub credentials (this workflow has no schedule trigger).
      - &dockerhub-auth
        name: Authenticate to Docker Hub
        env:
          DOCKERHUB_AUTH_REQUIRED: ${{ github.repository == 'NVIDIA/NemoClaw' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
          DOCKERHUB_USERNAME: ${{ github.repository == 'NVIDIA/NemoClaw' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.DOCKERHUB_USERNAME || '' }}
          DOCKERHUB_TOKEN: ${{ github.repository == 'NVIDIA/NemoClaw' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.DOCKERHUB_TOKEN || '' }}
        shell: bash
        run: |
          set -euo pipefail
          docker_config="$(mktemp -d "${RUNNER_TEMP}/docker-config-${GITHUB_JOB}-XXXXXX")"
          chmod 700 "${docker_config}"
          export DOCKER_CONFIG="${docker_config}"
          printf 'DOCKER_CONFIG=%s\n' "${DOCKER_CONFIG}" >> "${GITHUB_ENV}"

          if [[ "${DOCKERHUB_AUTH_REQUIRED}" != "1" ]]; then
            echo "::notice::Docker Hub credentials are withheld for this ref; continuing with anonymous pulls."
            exit 0
          fi
          if [[ -z "${DOCKERHUB_USERNAME}" || -z "${DOCKERHUB_TOKEN}" ]]; then
            echo "::error::Docker Hub credentials are required for trusted image builds."
            exit 1
          fi

          auth_marker="${DOCKER_CONFIG}/.nemoclaw-docker-login-attempted"
          : > "${auth_marker}"
          chmod 600 "${auth_marker}"
          login_attempts=5
          retry_seconds=5
          login_succeeded=0
          for ((attempt = 1; attempt <= login_attempts; attempt += 1)); do
            if printf '%s' "${DOCKERHUB_TOKEN}" | timeout 30s docker login docker.io --username "${DOCKERHUB_USERNAME}" --password-stdin; then
              login_succeeded=1
              break
            fi
            if ((attempt < login_attempts)); then
              echo "::warning::Docker Hub login attempt ${attempt}/${login_attempts} failed; retrying in ${retry_seconds}s."
              sleep "${retry_seconds}"
            fi
          done
          if [[ "${login_succeeded}" -ne 1 ]]; then
            echo "::error::Docker Hub login failed after ${login_attempts} attempts."
            exit 1
          fi

      - name: Resolve sandbox base image
        uses: ./.github/actions/resolve-sandbox-base-image

      - name: Build production image
        env:
          BASE_IMAGE: ${{ env.BASE_IMAGE }}
        run: |
          set -euo pipefail
          build_args=(--build-arg "BASE_IMAGE=${BASE_IMAGE}")
          scripts/check-production-build-args.sh "${build_args[@]}"
          docker build "${build_args[@]}" -t nemoclaw-production .

      - name: Save production image
        run: |
          set -euo pipefail
          docker save nemoclaw-production | gzip > /tmp/isolation-image.tar.gz

      - name: Verify production image archive
        run: gzip -t /tmp/isolation-image.tar.gz

      - name: Upload isolation image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: isolation-image
          path: /tmp/isolation-image.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Clean up Docker auth
        if: always()
        shell: bash
        run: bash .github/scripts/docker-auth-cleanup.sh

  build-hermes-sandbox-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - *checkout

      - *dockerhub-auth

      - name: Resolve Hermes base image
        uses: ./.github/actions/resolve-hermes-base-image

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - &hermes-export-swap
        name: Add swap for Hermes image export
        shell: bash
        run: |
          set -euo pipefail
          swap_file=/mnt/nemoclaw-hermes-image-export.swap
          free -h
          df -h / /mnt
          swapon --show
          sudo fallocate -l 32G "$swap_file"
          sudo chmod 0600 "$swap_file"
          sudo mkswap "$swap_file"
          sudo swapon "$swap_file"
          swapon --show
          free -h
          df -h / /mnt
          docker system df

      - name: Validate Hermes production build args
        env:
          HERMES_BASE_IMAGE: ${{ env.HERMES_BASE_IMAGE }}
        run: |
          set -euo pipefail
          build_args=(-f agents/hermes/Dockerfile --build-arg "BASE_IMAGE=${HERMES_BASE_IMAGE}")
          scripts/check-production-build-args.sh "${build_args[@]}"

      - name: Record resources before Hermes image build
        shell: bash
        run: |
          set -u
          free -h || true
          df -h || true
          docker system df || true

      - name: Build Hermes production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: agents/hermes/Dockerfile
          load: true
          push: false
          tags: nemoclaw-hermes-production
          build-args: BASE_IMAGE=${{ env.HERMES_BASE_IMAGE }}
          cache-from: type=gha,scope=hermes-production-${{ runner.os }}-${{ runner.arch }}
          cache-to: type=gha,mode=max,scope=hermes-production-${{ runner.os }}-${{ runner.arch }}

      # The production build intentionally omits NEMOCLAW_CORPORATE_CA_B64. A
      # successful final stage therefore proves its registry remediations and
      # Hermes agent-install phase complete with the base image's default trust.
      - name: Verify Hermes default-trust final image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 64 \
            --memory 256m \
            --entrypoint /bin/sh \
            nemoclaw-hermes-production -eu -c '
              test -z "${NODE_EXTRA_CA_CERTS:-}"
              test -z "${CURL_CA_BUNDLE:-}"
              test ! -e /usr/local/share/nemoclaw/corporate-ca.pem
              test ! -L /usr/local/share/nemoclaw/corporate-ca.pem
              test -x /usr/local/bin/hermes
              node -e "const tls = require(\"node:tls\"); if (tls.rootCertificates.length === 0) process.exit(1); tls.createSecureContext()"
              /opt/hermes/.venv/bin/python -I -c "import ssl; assert ssl.create_default_context().get_ca_certs()"
            '

      - name: Verify sandbox user can read copied files
        run: |
          set -euo pipefail
          docker run --rm --user sandbox nemoclaw-hermes-production \
            test -r /opt/nemoclaw-hermes-config/generate-config.ts
          docker run --rm --user sandbox nemoclaw-hermes-production \
            test -r /opt/nemoclaw-hermes-plugin/plugin.yaml
          docker run --rm --user sandbox nemoclaw-hermes-production \
            test -r /opt/nemoclaw-blueprint/blueprint.yaml
          docker run --rm --user sandbox nemoclaw-hermes-production \
            test ! -e /usr/local/bin/nemoclaw-decode-proxy
          docker run --rm --user sandbox nemoclaw-hermes-production \
            test -x /usr/local/bin/nemoclaw-start

      - name: Save Hermes production image
        run: |
          set -euo pipefail
          docker save nemoclaw-hermes-production | gzip > /tmp/hermes-isolation-image.tar.gz
          gzip -t /tmp/hermes-isolation-image.tar.gz

      - name: Upload Hermes isolation image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermes-isolation-image
          path: /tmp/hermes-isolation-image.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Record resources after Hermes image build
        if: always()
        shell: bash
        run: |
          set -u
          free -h || true
          df -h || true
          docker system df || true

      - name: Clean up Docker auth
        if: always()
        shell: bash
        run: bash .github/scripts/docker-auth-cleanup.sh

  security-scan-sandbox-images:
    if: ${{ inputs.run_security_scans && github.repository == 'NVIDIA/NemoClaw' && github.ref == 'refs/heads/main' }}
    needs: [build-sandbox-images, build-hermes-sandbox-image]
    runs-on: linux-amd64-cpu4
    timeout-minutes: 120
    # Pulse Malware 1.1.2 and Pulse Secret 3.95.9-nvidia.1. Update these only
    # after reviewing the matching internal Pulse release and registry digest.
    # Repository administrators own the long-lived NGC and SSA secret rotation.
    env:
      PULSE_MALWARE_IMAGE: nvcr.io/0898940053369630/pulse/pulse-malware-scanner-cli@sha256:d89b0e81b7690bfc9aa6de7c3472f17aeccbcd54eaa61e18875a93391e26312c
      PULSE_SECRET_IMAGE: nvcr.io/0898940053369630/pulse/pulse-secret-scanner@sha256:5ba66735e5a5408c89025eb43f9fe0242e071d494a826e415964399bc9a85fc1
    steps:
      - *checkout

      - name: Set up Node for report sanitization
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1

      - name: Download OpenClaw sandbox image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: isolation-image
          path: ${{ runner.temp }}/security-images

      - name: Download Hermes sandbox image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hermes-isolation-image
          path: ${{ runner.temp }}/security-images

      - name: Load sandbox images and prepare scan archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p security-reports
          gzip -dc "${RUNNER_TEMP}/security-images/isolation-image.tar.gz" \
            > "${RUNNER_TEMP}/security-images/openclaw.tar"
          gzip -dc "${RUNNER_TEMP}/security-images/hermes-isolation-image.tar.gz" \
            > "${RUNNER_TEMP}/security-images/hermes.tar"
          docker load --input "${RUNNER_TEMP}/security-images/openclaw.tar"
          docker load --input "${RUNNER_TEMP}/security-images/hermes.tar"
          docker image inspect nemoclaw-production nemoclaw-hermes-production >/dev/null

      - name: Pull Pulse scanner versions
        env:
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${NGC_API_KEY}" ]]; then
            echo "::error::The optional security scan requires the NGC_API_KEY repository secret."
            exit 1
          fi
          docker_config="$(mktemp -d "${RUNNER_TEMP}/pulse-docker-config-XXXXXX")"
          chmod 700 "${docker_config}"
          export DOCKER_CONFIG="${docker_config}"
          trap 'docker logout nvcr.io >/dev/null 2>&1 || true; rm -rf "${docker_config}"' EXIT
          printf '%s' "${NGC_API_KEY}" | docker login nvcr.io --username '$oauthtoken' --password-stdin
          docker pull "${PULSE_SECRET_IMAGE}"
          docker pull "${PULSE_MALWARE_IMAGE}"

      - name: Scan OpenClaw image for Critical vulnerabilities
        id: oss-openclaw
        continue-on-error: true
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: nemoclaw-production
          severity-cutoff: critical
          fail-build: true
          output-format: json
          output-file: security-reports/oss-openclaw.json

      - name: Scan Hermes image for Critical vulnerabilities
        id: oss-hermes
        continue-on-error: true
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: nemoclaw-hermes-production
          severity-cutoff: critical
          fail-build: true
          output-format: json
          output-file: security-reports/oss-hermes.json

      - name: Scan image archives for verified secrets
        id: secret-scan
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          scan_failed=0
          cleanup_secret_output() {
            rm -f "${RUNNER_TEMP}"/pulse-secret-*.jsonl \
              "${RUNNER_TEMP}"/pulse-secret-*.stderr
          }
          trap cleanup_secret_output EXIT

          scan_archive() {
            local image_name="$1"
            local archive_name="$2"
            local raw_results="${RUNNER_TEMP}/pulse-secret-${image_name}.jsonl"
            local scanner_stderr="${RUNNER_TEMP}/pulse-secret-${image_name}.stderr"
            local redacted_results="security-reports/secrets-${image_name}.jsonl"
            local exit_code

            set +e
            docker run --rm \
              --volume "${RUNNER_TEMP}/security-images:/scan:ro" \
              --volume "${GITHUB_WORKSPACE}/.nspect-allowlist.toml:/allowlist/.nspect-allowlist.toml:ro" \
              "${PULSE_SECRET_IMAGE}" \
              docker --image "file:///scan/${archive_name}" \
              --allowlist=/allowlist/.nspect-allowlist.toml \
              --json --results=verified,unknown --fail \
              >"${raw_results}" 2>"${scanner_stderr}"
            exit_code=$?
            set -e

            if ! node .github/scripts/security-scan-results.mts redact-secrets \
              "${raw_results}" "${scanner_stderr}" "${redacted_results}"; then
              echo "::error::${image_name} secret scan produced an invalid report."
              scan_failed=1
            fi

            case "$(node .github/scripts/security-scan-results.mts classify-secret-exit "${exit_code}")" in
              accepted)
                echo "::notice::${image_name} secret scan passed."
                ;;
              advisory)
                echo "::warning::${image_name} secret scan found an unverified or unknown result. Review the redacted report."
                ;;
              blocking)
                echo "::error::${image_name} secret scan found a verified secret or failed with exit code ${exit_code}."
                scan_failed=1
                ;;
            esac
          }

          scan_archive openclaw openclaw.tar
          scan_archive hermes hermes.tar
          exit "${scan_failed}"

      - name: Scan image archives for malware
        id: malware-scan
        continue-on-error: true
        env:
          PULSE_SSA_CLIENT_ID: ${{ secrets.PULSE_SSA_CLIENT_ID }}
          PULSE_SSA_CLIENT_SECRET: ${{ secrets.PULSE_SSA_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PULSE_SSA_CLIENT_ID}" || -z "${PULSE_SSA_CLIENT_SECRET}" ]]; then
            echo "::error::The optional malware scan requires the PULSE_SSA_CLIENT_ID and PULSE_SSA_CLIENT_SECRET repository secrets."
            exit 1
          fi

          scan_failed=0
          ssa_env_file="$(mktemp "${RUNNER_TEMP}/pulse-ssa-token-XXXXXX.env")"
          chmod 600 "${ssa_env_file}"
          trap 'rm -f "${ssa_env_file}"' EXIT
          scan_archive() {
            local image_name="$1"
            local archive_name="$2"
            local report_dir="${GITHUB_WORKSPACE}/security-reports/malware-${image_name}"
            local token_response
            local ssa_token

            token_response="$(
              python3 - <<'PY'
          import base64
          import os
          import urllib.parse
          import urllib.request

          credentials = (
              os.environ["PULSE_SSA_CLIENT_ID"]
              + ":"
              + os.environ["PULSE_SSA_CLIENT_SECRET"]
          ).encode()
          request = urllib.request.Request(
              "https://x9thwm-cootr2q1jdv5p7b8iw4fs4ob3x6nqqsoznyk.ssa.nvidia.com/token",
              data=urllib.parse.urlencode(
                  {
                      "grant_type": "client_credentials",
                      "scope": "nspect.verify pms.read.malware pms.scan.file",
                  }
              ).encode(),
              headers={
                  "Authorization": "Basic " + base64.b64encode(credentials).decode(),
                  "Content-Type": "application/x-www-form-urlencoded",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print(response.read().decode())
          PY
            )"
            ssa_token="$(jq -er '.access_token' <<<"${token_response}")"
            echo "::add-mask::${ssa_token}"
            printf 'SSA_TOKEN=%s\n' "${ssa_token}" >"${ssa_env_file}"
            unset ssa_token token_response
            mkdir -p "${report_dir}"

            if ! docker run --rm \
              --env-file "${ssa_env_file}" \
              --volume "${RUNNER_TEMP}/security-images:/scan:ro" \
              --volume "${report_dir}:/reports" \
              --workdir /reports \
              "${PULSE_MALWARE_IMAGE}" \
              pulse-malware-scanner-cli \
              --nspect NSPECT-SQ44-PJFM \
              --tenant general-access \
              --output-dir=. \
              file-scan --file "/scan/${archive_name}"; then
              scan_failed=1
            fi
            : >"${ssa_env_file}"
          }

          scan_archive openclaw isolation-image.tar.gz
          scan_archive hermes hermes-isolation-image.tar.gz
          exit "${scan_failed}"

      - name: Upload sandbox image security reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sandbox-image-security-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: security-reports/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce sandbox image security results
        if: always()
        env:
          MALWARE_SCAN_OUTCOME: ${{ steps.malware-scan.outcome }}
          OPENCLAW_OSS_OUTCOME: ${{ steps.oss-openclaw.outcome }}
          HERMES_OSS_OUTCOME: ${{ steps.oss-hermes.outcome }}
          SECRET_SCAN_OUTCOME: ${{ steps.secret-scan.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for result in \
            "${OPENCLAW_OSS_OUTCOME}" \
            "${HERMES_OSS_OUTCOME}" \
            "${SECRET_SCAN_OUTCOME}" \
            "${MALWARE_SCAN_OUTCOME}"; do
            [[ "${result}" == "success" ]] || failed=1
          done
          if [[ "${failed}" -ne 0 ]]; then
            echo "::error::A sandbox image security scan found a blocking result or did not complete."
            exit 1
          fi

  test-hermes-sandbox-image:
    runs-on: ubuntu-latest
    needs: build-hermes-sandbox-image
    timeout-minutes: 90
    steps:
      - *checkout

      - &setup-node
        name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install reviewed npm
        uses: ./.github/actions/setup-reviewed-npm

      - &install-root-dependencies
        name: Install root dependencies
        run: npm ci --ignore-scripts && npm run build:policy-boundary

      - name: Download Hermes production image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hermes-isolation-image
          path: /tmp

      - name: Load Hermes production image
        run: |
          set -euo pipefail
          gunzip -c /tmp/hermes-isolation-image.tar.gz | docker load
          docker image inspect nemoclaw-hermes-production >/dev/null

      - name: Resolve Hermes base image
        uses: ./.github/actions/resolve-hermes-base-image

      - name: Run Hermes sandbox secret boundary test
        id: hermes-secret-boundary
        timeout-minutes: 45
        env:
          E2E_ARTIFACT_DIR: ${{ github.workspace }}/e2e-artifacts/live/hermes-sandbox-secret-boundary
          NEMOCLAW_HERMES_TEST_IMAGE: nemoclaw-hermes-production
          NEMOCLAW_RUN_LIVE_E2E: "1"
        run: npx vitest run --project e2e-live test/e2e/live/hermes-sandbox-secret-boundary.test.ts --silent=false --reporter=default

      - name: Upload Hermes sandbox secret boundary artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermes-sandbox-secret-boundary-artifacts
          path: |
            e2e-artifacts/live/hermes-sandbox-secret-boundary/
            /tmp/nemoclaw-hermes-sandbox-secret-boundary.log
          include-hidden-files: false
          if-no-files-found: ignore
          retention-days: 14

      - name: Run Hermes root entrypoint smoke Vitest test
        if: ${{ !cancelled() && (steps.hermes-secret-boundary.outcome == 'success' || steps.hermes-secret-boundary.outcome == 'failure') }}
        timeout-minutes: 30
        env:
          E2E_ARTIFACT_DIR: ${{ github.workspace }}/e2e-artifacts/live/hermes-root-entrypoint-smoke
          NEMOCLAW_HERMES_TEST_IMAGE: nemoclaw-hermes-production
          NEMOCLAW_RUN_LIVE_E2E: "1"
        run: |
          set -euo pipefail
          npx vitest run --project e2e-live \
            test/e2e/live/hermes-root-entrypoint-smoke.test.ts \
            --silent=false --reporter=default

      - name: Upload Hermes root entrypoint smoke artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermes-root-entrypoint-smoke-artifacts
          path: e2e-artifacts/live/hermes-root-entrypoint-smoke/
          include-hidden-files: false
          if-no-files-found: ignore
          retention-days: 14

      - name: Record resources after Hermes image tests
        if: always()
        shell: bash
        run: |
          set -u
          free -h || true
          df -h || true
          docker system df || true

  messaging-plan-image-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - *checkout

      - *dockerhub-auth

      - *setup-node

      - name: Install reviewed npm
        uses: ./.github/actions/setup-reviewed-npm

      - name: Resolve sandbox base image
        uses: ./.github/actions/resolve-sandbox-base-image

      - name: Resolve Hermes base image
        uses: ./.github/actions/resolve-hermes-base-image

      - name: Build and verify OpenClaw messaging plan boundary
        env:
          BASE_IMAGE: ${{ env.BASE_IMAGE }}
        shell: bash
        run: |
          set -euo pipefail
          messaging_plan_b64="$(node scripts/check-messaging-plan-image-boundary.mts plan openclaw)"
          build_args=(
            --build-arg "BASE_IMAGE=${BASE_IMAGE}"
            --build-arg "NEMOCLAW_MESSAGING_PLAN_B64=${messaging_plan_b64}"
          )
          scripts/check-production-build-args.sh "${build_args[@]}"
          docker build "${build_args[@]}" -t nemoclaw-openclaw-plan-boundary .
          node scripts/check-messaging-plan-image-boundary.mts verify \
            nemoclaw-openclaw-plan-boundary openclaw

      - *hermes-export-swap

      - name: Build and verify Hermes messaging plan boundary
        env:
          HERMES_BASE_IMAGE: ${{ env.HERMES_BASE_IMAGE }}
        shell: bash
        run: |
          set -euo pipefail
          # curl and Python replace their default roots with this build argument.
          compact_ca_bundle="$(mktemp)"
          trap 'rm -f "$compact_ca_bundle"' EXIT
          node scripts/checks/select-ci-endpoint-ca-roots.mts \
            --output "$compact_ca_bundle"
          corporate_ca_b64="$(base64 -w 0 "$compact_ca_bundle")"
          corporate_ca_sha256="$(sha256sum "$compact_ca_bundle" | cut -d ' ' -f 1)"
          messaging_plan_b64="$(node scripts/check-messaging-plan-image-boundary.mts plan hermes)"
          build_args=(
            -f agents/hermes/Dockerfile
            --build-arg "BASE_IMAGE=${HERMES_BASE_IMAGE}"
            --build-arg "NEMOCLAW_CORPORATE_CA_B64=${corporate_ca_b64}"
            --build-arg "NEMOCLAW_MESSAGING_PLAN_B64=${messaging_plan_b64}"
          )
          scripts/check-production-build-args.sh "${build_args[@]}"
          docker build "${build_args[@]}" -t nemoclaw-hermes-plan-boundary .
          installed_ca_sha256="$(
            docker run --rm --network none --entrypoint sha256sum \
              nemoclaw-hermes-plan-boundary \
              /usr/local/share/nemoclaw/corporate-ca.pem |
              cut -d ' ' -f 1
          )"
          test "$installed_ca_sha256" = "$corporate_ca_sha256"
          docker run --rm --network none --entrypoint openssl \
            nemoclaw-hermes-plan-boundary crl2pkcs7 -nocrl \
            -certfile /usr/local/share/nemoclaw/corporate-ca.pem -out /dev/null
          node scripts/check-messaging-plan-image-boundary.mts verify \
            nemoclaw-hermes-plan-boundary hermes

      - name: Clean up Docker auth
        if: always()
        shell: bash
        run: bash .github/scripts/docker-auth-cleanup.sh
  build-sandbox-images-arm64:
    if: inputs.run_arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - *checkout

      - *dockerhub-auth

      - name: Resolve sandbox base image
        uses: ./.github/actions/resolve-sandbox-base-image

      - name: Build production image on arm64
        env:
          BASE_IMAGE: ${{ env.BASE_IMAGE }}
        run: |
          set -euo pipefail
          build_args=(--build-arg "BASE_IMAGE=${BASE_IMAGE}")
          scripts/check-production-build-args.sh "${build_args[@]}"
          docker build "${build_args[@]}" -t nemoclaw-production-arm64 .


      - name: Clean up Docker auth
        if: always()
        shell: bash
        run: bash .github/scripts/docker-auth-cleanup.sh

  runtime-overrides:
    runs-on: ubuntu-latest
    # The live target owns 45 minutes; retain 15 minutes for setup, image
    # transfer, and the always-running artifact upload.
    timeout-minutes: 60
    needs: build-sandbox-images
    env:
      E2E_ARTIFACT_DIR: ${{ github.workspace }}/e2e-artifacts/live/runtime-overrides
      E2E_TARGET_ID: runtime-overrides
      NEMOCLAW_RUN_LIVE_E2E: "1"
      NEMOCLAW_TEST_IMAGE: nemoclaw-production
    steps:
      - *checkout

      - *setup-node

      - name: Install reviewed npm
        uses: ./.github/actions/setup-reviewed-npm

      - *install-root-dependencies

      - &download-isolation-image
        name: Download image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: isolation-image
          path: /tmp

      - &load-isolation-image
        name: Load image
        run: |
          set -euo pipefail
          gunzip -c /tmp/isolation-image.tar.gz | docker load
          docker image inspect nemoclaw-production >/dev/null

      - name: Run runtime overrides test against production image
        timeout-minutes: 45
        run: |
          npx vitest run --project e2e-live \
            test/e2e/live/runtime-overrides.test.ts \
            --silent=false --reporter=default

      - name: Upload runtime overrides artifacts
        if: always()
        uses: ./.github/actions/upload-e2e-artifacts

  managed-image-openclaw-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-sandbox-images
    env:
      E2E_ARTIFACT_DIR: ${{ github.workspace }}/e2e-artifacts/live/managed-image-openclaw-security
      E2E_TARGET_ID: managed-image-openclaw-security
      NEMOCLAW_E2E_SHARD: default
      NEMOCLAW_MANAGED_IMAGE_SECURITY_COHORT: reusable-${{ github.run_id }}-${{ github.run_attempt }}
      NEMOCLAW_RUN_LIVE_E2E: "1"
      NEMOCLAW_TEST_IMAGE: nemoclaw-production
    steps:
      - *checkout

      - name: Bind managed-image risk signal identity
        run: |
          set -euo pipefail
          echo "NEMOCLAW_E2E_EXPECTED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "NEMOCLAW_E2E_CORRELATION_ID=$(python3 -c 'import uuid; print(uuid.uuid4())')" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.1"
          cache: npm

      - name: Install reviewed npm
        uses: ./.github/actions/setup-reviewed-npm

      - name: Install root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run build:policy-boundary

      - *download-isolation-image

      - *load-isolation-image

      - name: Validate OpenClaw managed-image security boundary
        run: >-
          npx vitest run --project integration test/e2e-runtime/managed-image-openclaw-security.test.ts
          --silent=false --reporter=default --reporter=test/e2e/risk-signal-reporter.ts

      - name: Validate glibc probe lifecycle
        if: ${{ !cancelled() }}
        env:
          NEMOCLAW_RUN_GLIBC_PROBE_DOCKER_E2E: "1"
        run: >-
          npx vitest run --project integration test/e2e-runtime/image-compatibility-docker-lifecycle.test.ts
          --silent=false --reporter=default --reporter=test/e2e/risk-signal-reporter.ts

      - name: Remove managed-image security resources
        if: ${{ always() }}
        run: |
          set -euo pipefail
          label="io.nvidia.nemoclaw.managed-image.cohort=$NEMOCLAW_MANAGED_IMAGE_SECURITY_COHORT"
          cleanup_failed=0
          mapfile -t containers < <(docker ps -aq --filter "label=$label")
          ((${#containers[@]} == 0)) || docker rm -f "${containers[@]}" >/dev/null || cleanup_failed=1
          mapfile -t volumes < <(docker volume ls -q --filter "label=$label")
          ((${#volumes[@]} == 0)) || docker volume rm -f "${volumes[@]}" >/dev/null || cleanup_failed=1
          ! docker ps -aq --filter "label=$label" | grep -q . || cleanup_failed=1
          ! docker volume ls -q --filter "label=$label" | grep -q . || cleanup_failed=1
          ((cleanup_failed == 0)) || exit 1

      - name: Upload OpenClaw managed-image security evidence
        if: ${{ always() }}
        uses: ./.github/actions/upload-e2e-artifacts
        with:
          name: managed-image-openclaw-security-evidence
          path: ${{ env.E2E_ARTIFACT_DIR }}

  port-override-image-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-sandbox-images
    steps:
      - *checkout

      - *download-isolation-image

      - *load-isolation-image

      - name: Validate port override image contract
        run: NEMOCLAW_TEST_IMAGE=nemoclaw-production bash test/e2e-port-overrides.sh
