# This status complements the native installer hash check; both must pass.
# Candidate files are API data. No candidate checkout or candidate code executes.
name: Security / Candidate Upgrade Admission
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_run:
    workflows: [Security / Candidate Review Signal]
    types: [completed]
permissions:
  contents: read
  pull-requests: read
jobs:
  candidate-upgrade-admission:
    if: ${{ github.repository == 'NVIDIA/NemoClaw' && ((github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == 'NVIDIA/NemoClaw') || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request_review' && github.event.workflow_run.head_repository.full_name == 'NVIDIA/NemoClaw')) }}
    concurrency:
      group: candidate-upgrade-admission-${{ github.event.pull_request.head.ref || github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      pr_number: ${{ steps.identity.outputs.pr_number }}
      head_sha: ${{ steps.identity.outputs.head_sha }}
      base_sha: ${{ steps.identity.outputs.base_sha }}
    steps:
      - name: Invalidate candidate upgrade admission
        id: identity
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            if (context.repo.owner !== "NVIDIA" || context.repo.repo !== "NemoClaw") throw new Error("Unexpected upgrade repository");
            if (!["pull_request_target", "workflow_run"].includes(context.eventName)) throw new Error("Unexpected upgrade event");
            const signal = context.payload.workflow_run;
            let number = context.payload.pull_request?.number;
            if (context.eventName === "workflow_run") {
              if (signal?.event !== "pull_request_review" || signal?.name !== "Security / Candidate Review Signal" ||
                  signal?.head_repository?.full_name !== "NVIDIA/NemoClaw" ||
                  typeof signal?.head_branch !== "string" || !signal.head_branch)
                throw new Error("Invalid candidate review signal");
              // Review-triggered runs can omit pull_requests. Resolve the current upstream PR;
              // the signal only requests reevaluation and supplies no approval authority.
              const { data: prs } = await github.rest.pulls.list({ ...context.repo,
                head: context.repo.owner + ":" + signal.head_branch, base: "main", state: "open", per_page: 2 });
              if (!Array.isArray(prs) || prs.length > 1) throw new Error("Ambiguous candidate review signal");
              if (prs.length === 0) return;
              number = prs[0].number;
            }
            if (!Number.isSafeInteger(number) || number <= 0) throw new Error("Invalid upgrade PR number");
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
            if (pr.state !== "open") return;
            if (context.eventName === "workflow_run" && pr.head.ref !== signal.head_branch) throw new Error("Candidate review branch changed");
            if (pr.head.repo?.full_name !== "NVIDIA/NemoClaw" || pr.base.repo?.full_name !== "NVIDIA/NemoClaw" || pr.base.ref !== "main") throw new Error("Unsupported upgrade PR identity");
            if (!/^[a-f0-9]{40}$/.test(pr.head.sha) || !/^[a-f0-9]{40}$/.test(pr.base.sha)) throw new Error("Invalid upgrade commits");
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: pr.head.sha, context: "check-hash", state: "pending",
              description: "Candidate upgrade trust is being checked",
              target_url: context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId,
            });
            core.setOutput("pr_number", String(number));
            core.setOutput("head_sha", pr.head.sha);
            core.setOutput("base_sha", pr.base.sha);
      - name: Check out trusted admission code
        if: ${{ steps.identity.outputs.head_sha != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NVIDIA/NemoClaw
          ref: ${{ steps.identity.outputs.base_sha }}
          persist-credentials: false
      - name: Set up trusted admission runtime
        if: ${{ steps.identity.outputs.head_sha != '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.22.1
      - name: Recheck candidate upgrade admission
        id: admission
        if: ${{ steps.identity.outputs.head_sha != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_REPOSITORY: NVIDIA/NemoClaw
          CANDIDATE_SHA: ${{ steps.identity.outputs.head_sha }}
          UPGRADE_PR_NUMBER: ${{ steps.identity.outputs.pr_number }}
          UPGRADE_BASE_SHA: ${{ steps.identity.outputs.base_sha }}
        run: node --no-warnings tools/e2e/candidate-openshell-version.mts
      - name: Report current candidate upgrade admission
        if: ${{ always() && steps.identity.outputs.head_sha != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          UPGRADE_PR_NUMBER: ${{ steps.identity.outputs.pr_number }}
          UPGRADE_CANDIDATE_SHA: ${{ steps.identity.outputs.head_sha }}
          UPGRADE_BASE_SHA: ${{ steps.identity.outputs.base_sha }}
          UPGRADE_OUTCOME: ${{ steps.admission.outcome }}
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: Number(process.env.UPGRADE_PR_NUMBER) });
            const current = pr.state === "open" && pr.head.sha === process.env.UPGRADE_CANDIDATE_SHA && pr.base.sha === process.env.UPGRADE_BASE_SHA;
            const passed = current && process.env.UPGRADE_OUTCOME === "success";
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: process.env.UPGRADE_CANDIDATE_SHA, context: "check-hash",
              state: passed ? "success" : "failure",
              description: passed ? "Current candidate upgrade admission passed" : "Upgrade admission failed or did not complete",
              target_url: context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId,
            });

  candidate-sdk-package:
    needs: candidate-upgrade-admission
    if: ${{ needs.candidate-upgrade-admission.outputs.head_sha != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      packages: read
    steps:
      - name: Check out trusted SDK producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NVIDIA/NemoClaw
          ref: ${{ needs.candidate-upgrade-admission.outputs.base_sha }}
          persist-credentials: false
      - name: Set up trusted package runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.22.1
          registry-url: https://npm.pkg.github.com
          scope: "@nvidia"
      - name: Install reviewed npm
        uses: ./.github/actions/setup-reviewed-npm
      - name: Package a newly admitted SDK
        id: package
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}
          UPGRADE_PR_NUMBER: ${{ needs.candidate-upgrade-admission.outputs.pr_number }}
          CANDIDATE_SHA: ${{ needs.candidate-upgrade-admission.outputs.head_sha }}
          UPGRADE_BASE_SHA: ${{ needs.candidate-upgrade-admission.outputs.base_sha }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { packageCandidateOpenShellSdkIfRequired } from './scripts/checks/package-openshell-sdk-for-pr.mts';
          import { githubRequest } from './tools/e2e/base-image-publication.mts';
          const identity = { prNumber: Number(process.env.UPGRADE_PR_NUMBER), candidateSha: process.env.CANDIDATE_SHA, baseSha: process.env.UPGRADE_BASE_SHA };
          const result = await packageCandidateOpenShellSdkIfRequired(join(process.env.RUNNER_TEMP, 'candidate-sdk'), identity, path => githubRequest(path, process.env.GITHUB_TOKEN));
          appendFileSync(process.env.GITHUB_OUTPUT, `required=${result.required}\n`);
          if (result.required) appendFileSync(process.env.GITHUB_OUTPUT, `bundle_name=${result.bundleName}\nartifact_name=${result.artifactName}\n`);
          NODE
      - name: Upload the verified candidate SDK
        if: steps.package.outputs.required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.package.outputs.bundle_name }}
          path: ${{ runner.temp }}/candidate-sdk/${{ steps.package.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 7
