name: Bundle platform
on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      platform:
        type: string
        required: true
      bundle:
        description: Build the bundle when its inputs or consumers are affected.
        type: boolean
        default: true
      lifecycle:
        description: Run contract and integration tests when their inputs are affected.
        type: boolean
        default: true
      contract-shards:
        description: JSON list of contract shard numbers; its length is the partition count.
        type: string
        default: "[1]"
      integration-shards:
        description: JSON list of integration shard numbers; its length is the partition count.
        type: string
        default: "[1, 2]"
      live:
        description: Also archive the Linux live tests and build the bundle for the E2E workflow.
        type: boolean
        default: false
    outputs:
      tests:
        description: The test inputs artifact, for the E2E workflow.
        value: ${{ jobs.build.outputs.artifact }}
      bundle:
        description: The bundle artifact, for the E2E workflow.
        value: ${{ jobs.bundle.outputs.artifact }}
      unit:
        description: success or failure.
        value: ${{ jobs.results.outputs.unit }}
      contract:
        description: success, failure, or not-selected.
        value: ${{ jobs.results.outputs.contract }}
      integration:
        description: success, failure, or not-selected.
        value: ${{ jobs.results.outputs.integration }}
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  TEST_PLATFORM: ${{ inputs.platform }}
  CARGO_INCREMENTAL: "0"
# Build and unit test, and Build bundle, run in parallel on separate runners;
# the contract and integration shards start when both have uploaded their
# artifacts. Artifact names carry the run attempt, and consumers read them from
# the producers' outputs, so rerunning a failed shard reuses an earlier
# attempt's artifacts. The live suites run in the E2E workflow.
jobs:
  build:
    name: Build and unit test
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.identity.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          platform: ${{ inputs.platform }}
      - name: Check formatting
        run: cargo ci fmt
      - name: Lint Rust
        run: cargo ci clippy
      - name: Clear cached build timings
        id: timings
        run: rm -rf target/cargo-timings
      - name: Build test executables
        run: cargo ci build
      - name: Upload workspace build timings
        if: always() && steps.timings.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-workspace-${{ inputs.platform }}-${{ github.run_attempt }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 14
      - name: Run tests
        run: cargo ci test
      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-${{ inputs.platform }}-${{ github.run_attempt }}
          path: target/nextest/ci/test.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Check generated configuration schema and reference
        run: cargo ci schema
      - name: Archive lifecycle executables and inputs
        if: inputs.lifecycle || inputs.live
        run: cargo ci archive
      - name: Identify lifecycle artifact
        if: inputs.lifecycle || inputs.live
        id: identity
        run: echo "artifact=lifecycle-inputs-${TEST_PLATFORM}-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload lifecycle inputs
        if: inputs.lifecycle || inputs.live
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.identity.outputs.artifact }}
          path: |
            .build/ci/lifecycle.tar.zst
            .build/ci/lifecycle-inputs.tar
          include-hidden-files: true
          compression-level: 1
          retention-days: 1
          if-no-files-found: error

  bundle:
    name: Build bundle
    if: inputs.bundle || inputs.lifecycle || inputs.live
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.identity.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A separate cache: the bundle's release dependencies and the debug build
      # tool that assembles it, which the test job's cache does not hold together.
      - uses: ./.github/actions/setup-rust
        with:
          platform: ${{ inputs.platform }}
          cache-prefix: native-bundle-v3
      - name: Clear cached build timings
        id: timings
        run: rm -rf target/cargo-timings
      - name: Build and verify bundle
        run: cargo ci bundle
      - name: Upload release bundle build timings
        if: always() && steps.timings.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-bundle-${{ inputs.platform }}-${{ github.run_attempt }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 14
      # Tar preserves the executable permissions that artifact transfer drops.
      - name: Pack bundle
        run: |
          mkdir -p .build/ci
          tar -cf .build/ci/bundle.tar "dist/${TEST_PLATFORM}"
      - name: Identify bundle artifact
        id: identity
        run: echo "artifact=bundle-${TEST_PLATFORM}-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.identity.outputs.artifact }}
          path: .build/ci/bundle.tar
          include-hidden-files: true
          compression-level: 1
          retention-days: 1
          if-no-files-found: error

  contract:
    name: Contract / ${{ matrix.shard }}
    # The bundle job runs whenever contract and integration tests do.
    if: inputs.lifecycle && needs.bundle.result == 'success'
    needs: [build, bundle]
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.contract-shards) }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: .build/ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.bundle.outputs.artifact }}
          path: .build/ci
      - name: Extract test inputs and bundle
        run: |
          tar -xf .build/ci/lifecycle-inputs.tar
          tar -xf .build/ci/bundle.tar
      # Slices deal the platform's sorted tests round-robin, so slow tests that
      # sort next to each other split evenly. A slice depends on the selected
      # test list: adding a test moves later tests to other partitions.
      - name: Execute contract partition without compiling
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: >-
          .build/ci/nemoclaw-build ci contract
          --partition "slice:${SHARD}/${SHARDS}"
          --archive-file .build/ci/lifecycle.tar.zst
      - name: Upload contract timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-${{ inputs.platform }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: target/nextest/contract/contract.xml
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  # Each partition reports and enforces its own budget; this job reports the
  # platform's whole contract suite in its summary, from the partitions'
  # uploaded timings, including failed partitions'. A test binary's tests span
  # partitions, so this job enforces the binary budgets: on Linux, a binary
  # over its budget fails the Contract check.
  contract-timing:
    name: Contract timing
    needs: [build, contract]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.contract.result != 'skipped' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    steps:
      # For .config/test-budgets.yaml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The build tool comes from the test inputs; this job compiles nothing.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: .build/ci
      # Every attempt's timings; the report reads each shard's latest attempt.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: contract-${{ inputs.platform }}-*
          path: .build/ci/timings
      - name: Report the whole contract suite
        env:
          SHARDS: ${{ inputs.contract-shards }}
        run: |
          tool=.build/ci/nemoclaw-build
          if [ "$RUNNER_OS" = Windows ]; then tool="$tool.exe"; fi
          tar -xf .build/ci/lifecycle-inputs.tar "$tool"
          "$tool" suite-timing contract .build/ci/timings --platform "$TEST_PLATFORM" --shards "$SHARDS"

  integration:
    name: Integration / ${{ matrix.shard }}
    # The bundle job runs whenever contract and integration tests do.
    if: inputs.lifecycle && needs.bundle.result == 'success'
    needs: [build, bundle]
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.integration-shards) }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: .build/ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.bundle.outputs.artifact }}
          path: .build/ci
      - name: Extract test inputs and bundle
        run: |
          tar -xf .build/ci/lifecycle-inputs.tar
          tar -xf .build/ci/bundle.tar
      # Slices deal the platform's sorted tests round-robin, so slow tests that
      # sort next to each other split evenly. A slice depends on the selected
      # test list: adding a test moves later tests to other partitions.
      - name: Execute integration partition without compiling
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
          # The tofu test integration scenarios record each result and a failed
          # scenario's redacted evidence here.
          NEMOCLAW_INTEGRATION_EVIDENCE: ${{ runner.temp }}/hcl-integration
        run: >-
          .build/ci/nemoclaw-build ci integration
          --partition "slice:${SHARD}/${SHARDS}"
          --archive-file .build/ci/lifecycle.tar.zst
      - name: Upload integration timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-${{ inputs.platform }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: target/nextest/integration/integration.xml
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - name: Summarize integration scenarios
        if: always()
        env:
          RESULTS: ${{ runner.temp }}/hcl-integration/results.tsv
        run: |
          if [ -f "$RESULTS" ]; then
            {
              echo '| Integration scenario | Result |'
              echo '|---|---|'
              awk -F '\t' '{ printf "| `%s` | %s |\n", $1, $2 }' "$RESULTS"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      # Fixture credentials are redacted; the evidence holds only fixture data.
      - name: Upload failed integration scenarios' evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hcl-integration-evidence-${{ inputs.platform }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hcl-integration
          if-no-files-found: ignore
          retention-days: 7

  # Each partition reports and enforces its own budget; this job reports the
  # platform's whole integration suite in its summary, from the partitions'
  # uploaded timings, including failed partitions'. A test binary's tests span
  # partitions, so this job enforces the binary budgets: on Linux, a binary
  # over its budget fails the Integration check.
  integration-timing:
    name: Integration timing
    needs: [build, integration]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.integration.result != 'skipped' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    steps:
      # For .config/test-budgets.yaml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The build tool comes from the test inputs; this job compiles nothing.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: .build/ci
      # Every attempt's timings; the report reads each shard's latest attempt.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: integration-${{ inputs.platform }}-*
          path: .build/ci/timings
      - name: Report the whole integration suite
        env:
          SHARDS: ${{ inputs.integration-shards }}
        run: |
          tool=.build/ci/nemoclaw-build
          if [ "$RUNNER_OS" = Windows ]; then tool="$tool.exe"; fi
          tar -xf .build/ci/lifecycle-inputs.tar "$tool"
          "$tool" suite-timing integration .build/ci/timings --platform "$TEST_PLATFORM" --shards "$SHARDS"

  # Each layer's result for the caller's Unit, Contract, and Integration checks.
  # A layer the plan did not select reports not-selected; a skipped job whose
  # layer was selected, such as after a failed bundle, reports failure.
  results:
    name: Layer results
    if: ${{ !cancelled() }}
    needs: [build, bundle, contract, contract-timing, integration, integration-timing]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      unit: ${{ steps.layers.outputs.unit }}
      contract: ${{ steps.layers.outputs.contract }}
      integration: ${{ steps.layers.outputs.integration }}
    steps:
      - name: Decide each layer's result
        id: layers
        env:
          SELECTED: ${{ inputs.lifecycle }}
          BUILD: ${{ needs.build.result }}
          BUNDLE: ${{ needs.bundle.result }}
          CONTRACT: ${{ needs.contract.result }}
          CONTRACT_TIMING: ${{ needs.contract-timing.result }}
          INTEGRATION: ${{ needs.integration.result }}
          INTEGRATION_TIMING: ${{ needs.integration-timing.result }}
        run: |
          echo "unit=$BUILD" >> "$GITHUB_OUTPUT"
          layer() {
            if [ "$SELECTED" != true ]; then
              echo not-selected
            elif [ "$BUILD" = success ] && [ "$BUNDLE" = success ] && [ "$1" = success ] && [ "$2" = success ]; then
              echo success
            else
              echo failure
            fi
          }
          echo "contract=$(layer "$CONTRACT" "$CONTRACT_TIMING")" >> "$GITHUB_OUTPUT"
          echo "integration=$(layer "$INTEGRATION" "$INTEGRATION_TIMING")" >> "$GITHUB_OUTPUT"
