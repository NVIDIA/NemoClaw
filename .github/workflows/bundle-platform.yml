name: Bundle platform
on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      platform:
        type: string
        required: true
      bundle:
        description: Build the bundle when its inputs or consumers are affected.
        type: boolean
        default: true
      lifecycle:
        description: Run contract and integration tests when their inputs are affected.
        type: boolean
        default: true
      partitions:
        description: JSON list of the contract and integration partitions, each {layer, shard, shards}.
        type: string
        default: >-
          [{"layer": "contract", "shard": 1, "shards": 1},
          {"layer": "integration", "shard": 1, "shards": 2},
          {"layer": "integration", "shard": 2, "shards": 2}]
      e2e:
        description: Run the Docker and Kubernetes live suites, which need a Linux runner.
        type: boolean
        default: false
      live-images-commit:
        description: A v1 commit whose pushed images the live suites pull instead of building, or empty to build them.
        type: string
        default: ""
      hcl:
        description: With e2e, also run the HCL E2E cases that use NVIDIA hosted inference; the caller passes the inference secret.
        type: boolean
        default: false
      hcl-gpu:
        description: Run the HCL E2E cases on the NVIDIA GPU runner, which refuses pull request jobs; the caller passes the inference secret.
        type: boolean
        default: false
      hcl-cases:
        description: The validation plan's live HCL case selection, by where each case runs; required with e2e.
        type: string
        default: ""
# The live suites read the per-commit image package for images to reuse.
permissions:
  contents: read
  packages: read
defaults:
  run:
    shell: bash
env:
  TEST_PLATFORM: ${{ inputs.platform }}
  CARGO_INCREMENTAL: "0"
# Each job's name starts with its test layer: Unit, Contract, Integration, or
# E2E. Unit build and test, and Build bundle, run in parallel on separate
# runners; the contract, integration, and live jobs start when both have
# uploaded their artifacts. Artifact names carry the run attempt, and consumers
# read them from the producers' outputs, so rerunning a failed shard reuses an
# earlier attempt's artifacts. The caller's Test / PLATFORM check requires every
# job here that runs; a job the plan does not select is skipped.
jobs:
  build:
    name: Unit build and test
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.identity.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          platform: ${{ inputs.platform }}
      - name: Check formatting
        run: cargo ci fmt
      - name: Lint Rust
        run: cargo ci clippy
      - name: Clear cached build timings
        id: timings
        run: rm -rf target/cargo-timings
      - name: Build test executables
        run: cargo ci build
      - name: Upload workspace build timings
        if: always() && steps.timings.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-workspace-${{ inputs.platform }}-${{ github.run_attempt }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 14
      - name: Run tests
        run: cargo ci test
      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-${{ inputs.platform }}-${{ github.run_attempt }}
          path: target/nextest/ci/test.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Check generated configuration schema and reference
        run: cargo ci schema
      - name: Archive lifecycle executables and inputs
        if: inputs.lifecycle || inputs.e2e
        run: cargo ci archive
      - name: Identify lifecycle artifact
        if: inputs.lifecycle || inputs.e2e
        id: identity
        run: echo "artifact=lifecycle-inputs-${TEST_PLATFORM}-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload lifecycle inputs
        if: inputs.lifecycle || inputs.e2e
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.identity.outputs.artifact }}
          path: |
            .build/ci/lifecycle.tar.zst
            .build/ci/lifecycle-inputs.tar
          include-hidden-files: true
          compression-level: 1
          retention-days: 1
          if-no-files-found: error

  bundle:
    name: Build bundle
    if: inputs.bundle || inputs.lifecycle || inputs.e2e
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.identity.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A separate cache: the bundle's release dependencies and the debug build
      # tool that assembles it, which the test job's cache does not hold together.
      - uses: ./.github/actions/setup-rust
        with:
          platform: ${{ inputs.platform }}
          cache-prefix: native-bundle-v3
      - name: Clear cached build timings
        id: timings
        run: rm -rf target/cargo-timings
      - name: Build and verify bundle
        run: cargo ci bundle
      - name: Upload release bundle build timings
        if: always() && steps.timings.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-bundle-${{ inputs.platform }}-${{ github.run_attempt }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 14
      # Tar preserves the executable permissions that artifact transfer drops.
      - name: Pack bundle
        run: |
          mkdir -p .build/ci
          tar -cf .build/ci/bundle.tar "dist/${TEST_PLATFORM}"
      - name: Identify bundle artifact
        id: identity
        run: echo "artifact=bundle-${TEST_PLATFORM}-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.identity.outputs.artifact }}
          path: .build/ci/bundle.tar
          include-hidden-files: true
          compression-level: 1
          retention-days: 1
          if-no-files-found: error

  tests:
    name: ${{ matrix.layer == 'contract' && 'Contract' || 'Integration' }} tests ${{ matrix.shard }} of ${{ matrix.shards }}
    # The bundle job runs whenever contract and integration tests do.
    if: inputs.lifecycle && needs.bundle.result == 'success'
    needs: [build, bundle]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.partitions) }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: .build/ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.bundle.outputs.artifact }}
          path: .build/ci
      - name: Extract test inputs and bundle
        run: |
          tar -xf .build/ci/lifecycle-inputs.tar
          tar -xf .build/ci/bundle.tar
      # Slices deal the platform's sorted tests round-robin, so slow tests that
      # sort next to each other split evenly. A slice depends on the selected
      # test list: adding a test moves later tests to other partitions.
      - name: Execute the partition without compiling
        env:
          LAYER: ${{ matrix.layer }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
          # The tofu test integration scenarios record each result and a failed
          # scenario's redacted evidence here.
          NEMOCLAW_INTEGRATION_EVIDENCE: ${{ runner.temp }}/hcl-integration
        run: >-
          .build/ci/nemoclaw-build ci "$LAYER"
          --partition "slice:${SHARD}/${SHARDS}"
          --archive-file .build/ci/lifecycle.tar.zst
      - name: Upload timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.layer }}-${{ inputs.platform }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: target/nextest/${{ matrix.layer }}/${{ matrix.layer }}.xml
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - name: Summarize integration scenarios
        if: always() && matrix.layer == 'integration'
        env:
          RESULTS: ${{ runner.temp }}/hcl-integration/results.tsv
        run: |
          if [ -f "$RESULTS" ]; then
            {
              echo '| Integration scenario | Result |'
              echo '|---|---|'
              awk -F '\t' '{ printf "| `%s` | %s |\n", $1, $2 }' "$RESULTS"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      # Fixture credentials are redacted; the evidence holds only fixture data.
      - name: Upload failed integration scenarios' evidence
        if: failure() && matrix.layer == 'integration'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hcl-integration-evidence-${{ inputs.platform }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hcl-integration
          if-no-files-found: ignore
          retention-days: 7

  # Each partition reports and enforces its own budget; this job reports each
  # layer's whole suite in its summary, from the partitions' uploaded timings,
  # including failed partitions'. A test binary's tests span partitions, so this
  # job enforces the binary budgets: on Linux, a binary over its budget fails
  # the platform's Test check.
  timing:
    name: ${{ matrix.layer == 'contract' && 'Contract' || 'Integration' }} timing report
    needs: [build, tests]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.tests.result != 'skipped' }}
    strategy:
      fail-fast: false
      matrix:
        layer: [contract, integration]
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    steps:
      # For .config/test-budgets.yaml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The build tool comes from the test inputs; this job compiles nothing.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: .build/ci
      # Every attempt's timings; the report reads each shard's latest attempt.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ matrix.layer }}-${{ inputs.platform }}-*
          path: .build/ci/timings
      - name: Report the whole suite
        env:
          LAYER: ${{ matrix.layer }}
          PARTITIONS: ${{ inputs.partitions }}
        run: |
          tool=.build/ci/nemoclaw-build
          if [ "$RUNNER_OS" = Windows ]; then tool="$tool.exe"; fi
          tar -xf .build/ci/lifecycle-inputs.tar "$tool"
          shards=$(jq -c --arg layer "$LAYER" '[.[] | select(.layer == $layer) | .shard]' <<< "$PARTITIONS")
          "$tool" suite-timing "$LAYER" .build/ci/timings --platform "$TEST_PLATFORM" --shards "$shards"

  # The Docker and Kubernetes live suites, from this platform's test archive and
  # bundle.
  e2e:
    name: E2E
    needs: [build, bundle]
    if: ${{ !cancelled() && inputs.e2e && needs.build.result == 'success' && needs.bundle.result == 'success' }}
    uses: ./.github/workflows/e2e-platform.yml
    with:
      runner: ${{ inputs.runner }}
      platform: ${{ inputs.platform }}
      tests: ${{ needs.build.outputs.artifact }}
      bundle: ${{ needs.bundle.outputs.artifact }}
      live-images-commit: ${{ inputs.live-images-commit }}
      hcl: ${{ inputs.hcl }}
      hcl-cases: ${{ inputs.hcl-cases }}
    # The HCL cases read NVIDIA_API_KEY.
    secrets: inherit

  # The HCL E2E cases on the NVIDIA GPU runner, which refuses pull request
  # jobs. Live / HCL builds them a candidate against an older glibc, which the
  # runner can run.
  gpu:
    name: E2E GPU
    if: inputs.hcl-gpu
    uses: ./.github/workflows/hcl-e2e.yml
    with:
      hosted: false
      cases: ${{ inputs.hcl-cases }}
    # The Ollama case reads NVIDIA_API_KEY.
    secrets: inherit
