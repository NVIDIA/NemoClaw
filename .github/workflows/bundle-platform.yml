name: Bundle platform
on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      build-runner:
        description: >-
          The runner for the build and bundle jobs, when they need an older OS than
          the test jobs; executables built against an older glibc run on newer ones.
        type: string
        default: ""
      glibc:
        description: >-
          On Linux, the oldest glibc that the bundle's executables must run on, which
          the bundle job checks; empty skips the check.
        type: string
        default: ""
      platform:
        type: string
        required: true
      bundle:
        description: Build the bundle when its inputs or consumers are affected.
        type: boolean
        default: true
      lifecycle:
        description: Run contract and integration tests when their inputs are affected.
        type: boolean
        default: true
      partitions:
        description: JSON list of the contract and integration partitions, each {layer, shard, shards}.
        type: string
        default: >-
          [{"layer": "contract", "shard": 1, "shards": 1},
          {"layer": "integration", "shard": 1, "shards": 2},
          {"layer": "integration", "shard": 2, "shards": 2}]
      e2e:
        description: Run the Docker and Kubernetes live suites, which need a Linux runner.
        type: boolean
        default: false
      live-images-commit:
        description: A v1 commit whose pushed images the live suites pull instead of building, or empty to build them.
        type: string
        default: ""
      hcl:
        description: With e2e, also run the HCL E2E cases that use NVIDIA hosted inference; the caller passes the inference secret.
        type: boolean
        default: false
      hcl-gpu:
        description: With e2e, also run the HCL E2E cases on the NVIDIA GPU runner, which refuses pull request jobs; the caller passes the inference secret.
        type: boolean
        default: false
      hcl-cases:
        description: The validation plan's live HCL case selection, by where each case runs; required with e2e.
        type: string
        default: ""
      save-cache:
        description: Write the shared Rust caches on v1; a self-hosted runner's experiment only reads them.
        type: boolean
        default: true
      split-bundle:
        description: >-
          Compile the bundle's executables in three parts on separate runners, and
          assemble them on a fourth, which shortens the bundle job where one runner
          compiles them slowly.
        type: boolean
        default: false
    # The caller reports the macOS and Windows suites' timings from these.
    outputs:
      lifecycle-artifact:
        description: The lifecycle artifacts' common name prefix, or empty when the build job uploaded none.
        value: ${{ jobs.build.outputs.artifact }}
      partitions:
        description: The contract and integration partitions, as given.
        value: ${{ inputs.partitions }}
# The live suites read the per-commit image package for images to reuse.
permissions:
  contents: read
  packages: read
defaults:
  run:
    shell: bash
env:
  TEST_PLATFORM: ${{ inputs.platform }}
  CARGO_INCREMENTAL: "0"
# Each job's name starts with its test layer: Unit, Contract, Integration, or
# E2E. Unit build and test, Build bundle, and on Linux E2E build images run in
# parallel on separate runners; the contract, integration, and live jobs start
# when the ones they read have uploaded their artifacts. With split-bundle, the
# other Build bundle jobs compile the bundle's executables in parallel, and
# Build bundle assembles them. Artifact names carry the run attempt, and consumers
# read them from the producers' outputs, so rerunning a failed shard reuses an
# earlier attempt's artifacts. The caller's Test / PLATFORM check requires every
# job here that runs; a job the plan does not select is skipped.
jobs:
  build:
    name: Unit build and test
    runs-on: ${{ inputs.build-runner || inputs.runner }}
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.identity.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          platform: ${{ inputs.platform }}
          save-cache: ${{ inputs.save-cache }}
      - name: Check formatting
        run: cargo ci fmt
      - name: Lint Rust
        run: cargo ci clippy
      - name: Clear cached build timings
        id: timings
        run: rm -rf target/cargo-timings
      - name: Build test executables
        run: cargo ci build
      - name: Upload workspace build timings
        if: always() && steps.timings.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-workspace-${{ inputs.platform }}-${{ github.run_attempt }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 14
      # The Bake tests' first Docker call reads the Docker CLI and its Buildx
      # plugin, about 110 MB, from the runner's disk; under the test run's load,
      # that took up to 5.5 s on some hosted runners. Reading them here keeps
      # that out of the tests' time limits. Without Docker, the tests skip.
      - name: Load Docker Buildx from disk
        if: runner.os == 'Linux'
        run: docker buildx version || true
      - name: Run tests
        run: cargo ci test
      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-${{ inputs.platform }}-${{ github.run_attempt }}
          path: target/nextest/ci/test.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Check generated configuration schema and reference
        run: cargo ci schema
      - name: Archive lifecycle executables and inputs
        if: inputs.lifecycle || inputs.e2e
        run: cargo ci archive
      # The artifacts' common name prefix: each test job downloads the inputs
      # and only its own layer's archive, PREFIX-inputs and PREFIX-LAYER.
      - name: Identify lifecycle artifacts
        if: inputs.lifecycle || inputs.e2e
        id: identity
        run: echo "artifact=lifecycle-${TEST_PLATFORM}-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload lifecycle inputs
        if: inputs.lifecycle || inputs.e2e
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.identity.outputs.artifact }}-inputs
          path: .build/ci/lifecycle-inputs.tar
          include-hidden-files: true
          compression-level: 1
          retention-days: 1
          if-no-files-found: error
      - name: Upload contract tests
        if: inputs.lifecycle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.identity.outputs.artifact }}-contract
          path: .build/ci/contract.tar.zst
          include-hidden-files: true
          compression-level: 1
          retention-days: 1
          if-no-files-found: error
      - name: Upload integration tests
        if: inputs.lifecycle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.identity.outputs.artifact }}-integration
          path: .build/ci/integration.tar.zst
          include-hidden-files: true
          compression-level: 1
          retention-days: 1
          if-no-files-found: error
      # Only Linux archives the live suites, and only Linux runs them.
      - name: Upload live tests
        if: inputs.e2e
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.identity.outputs.artifact }}-live
          path: .build/ci/live.tar.zst
          include-hidden-files: true
          compression-level: 1
          retention-days: 1
          if-no-files-found: error
      # The HCL case jobs run only the e2e test executable.
      - name: Upload the e2e test executable
        if: inputs.e2e
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.identity.outputs.artifact }}-e2e
          path: .build/ci/e2e
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # Each part compiles some of the bundle's release executables, with the
  # features of the whole bundle, so every part reuses the bundle cache. Every
  # part compiles the SDK, but the parts' dependency chains then take about as
  # long as each other, shorter than one runner compiling them all. The CLI part
  # also builds the debug build tool that assembles the bundle. All parts
  # restore and may save the bundle cache: on a new cache key, the first part to
  # save writes it, and the others rebuild the dependencies that only they
  # changed until the key changes again.
  bundle-part:
    name: Build bundle ${{ matrix.name }}
    if: inputs.split-bundle && (inputs.bundle || inputs.lifecycle || inputs.e2e)
    runs-on: ${{ inputs.build-runner || inputs.runner }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - part: cli
            name: CLI
            executables: nemoclaw
          - part: nemoclaw-provider
            name: NemoClaw providers
            executables: terraform-provider-vllm,terraform-provider-ollama,terraform-provider-host
          - part: openshell-provider
            name: OpenShell and Fabric providers
            executables: terraform-provider-openshell,terraform-provider-fabric
    outputs:
      artifact: ${{ steps.identity.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          platform: ${{ inputs.platform }}
          cache-prefix: native-bundle-v4
          save-cache: ${{ inputs.save-cache }}
      - name: Clear cached build timings
        id: timings
        run: rm -rf target/cargo-timings
      - name: Build release executables
        env:
          EXECUTABLES: ${{ matrix.executables }}
        run: cargo ci bundle --executables "$EXECUTABLES"
      # As cargo ci bundle builds it, without debug data.
      - name: Build the build tool
        if: matrix.part == 'cli'
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo build --locked --package nemoclaw-build
      - name: Upload release build timings
        if: always() && steps.timings.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-bundle-${{ inputs.platform }}-${{ matrix.part }}-${{ github.run_attempt }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 14
      # Tar preserves the executable permissions that artifact transfer drops.
      - name: Pack executables
        env:
          PART: ${{ matrix.part }}
          EXECUTABLES: ${{ matrix.executables }}
        run: |
          extension=
          if [ "$RUNNER_OS" = Windows ]; then extension=.exe; fi
          files=()
          for name in ${EXECUTABLES//,/ }; do
            files+=(target/*/release/"$name$extension")
          done
          if [ "$PART" = cli ]; then files+=("target/debug/nemoclaw-build$extension"); fi
          mkdir -p .build/ci
          tar -cf ".build/ci/bundle-$PART.tar" "${files[@]}"
      # Every part writes the same name prefix, which the bundle job reads.
      - name: Identify executables artifact
        id: identity
        run: echo "artifact=bundle-part-${TEST_PLATFORM}-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload executables
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.identity.outputs.artifact }}-${{ matrix.part }}
          path: .build/ci/bundle-${{ matrix.part }}.tar
          include-hidden-files: true
          compression-level: 1
          retention-days: 1
          if-no-files-found: error

  bundle:
    name: Build bundle
    needs: bundle-part
    # Without split-bundle, the parts are skipped and this job compiles.
    if: >-
      ${{ !cancelled() && (inputs.bundle || inputs.lifecycle || inputs.e2e)
      && needs.bundle-part.result == (inputs.split-bundle && 'success' || 'skipped') }}
    runs-on: ${{ inputs.build-runner || inputs.runner }}
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.identity.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A separate cache: the bundle's release dependencies and the debug build
      # tool that assembles it, which the test job's cache does not hold together.
      - uses: ./.github/actions/setup-rust
        if: ${{ !inputs.split-bundle }}
        with:
          platform: ${{ inputs.platform }}
          cache-prefix: native-bundle-v4
          save-cache: ${{ inputs.save-cache }}
      - name: Clear cached build timings
        if: ${{ !inputs.split-bundle }}
        id: timings
        run: rm -rf target/cargo-timings
      - name: Build and verify bundle
        if: ${{ !inputs.split-bundle }}
        run: cargo ci bundle
      - name: Download the compiled executables
        if: inputs.split-bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ needs.bundle-part.outputs.artifact }}-*
          path: .build/ci
          merge-multiple: true
      # Assembly compiles nothing, so this job needs no Rust setup.
      - name: Assemble and verify bundle
        if: inputs.split-bundle
        run: |
          for part in .build/ci/bundle-*.tar; do tar -xf "$part"; done
          tool=target/debug/nemoclaw-build
          if [ "$RUNNER_OS" = Windows ]; then tool="$tool.exe"; fi
          "$tool" bundle --platform "$TEST_PLATFORM" --prebuilt
      - name: Check that the bundle runs on glibc ${{ inputs.glibc }}
        if: inputs.glibc != ''
        env:
          GLIBC: ${{ inputs.glibc }}
        run: target/debug/nemoclaw-build check-glibc --minimum "$GLIBC" "dist/${TEST_PLATFORM}"
      - name: Upload release bundle build timings
        if: always() && steps.timings.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-bundle-${{ inputs.platform }}-${{ github.run_attempt }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 14
      # Tar preserves the executable permissions that artifact transfer drops.
      - name: Pack bundle
        run: |
          mkdir -p .build/ci
          tar -cf .build/ci/bundle.tar "dist/${TEST_PLATFORM}"
      - name: Identify bundle artifact
        id: identity
        run: echo "artifact=bundle-${TEST_PLATFORM}-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      # Release / Stage attaches the bundles of a tag's push or manual run to
      # the tag's release, so they stay for a week.
      - name: Upload bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.identity.outputs.artifact }}
          path: .build/ci/bundle.tar
          include-hidden-files: true
          compression-level: 1
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 7 }}
          if-no-files-found: error

  tests:
    name: ${{ matrix.layer == 'contract' && 'Contract' || 'Integration' }} tests ${{ matrix.shard }} of ${{ matrix.shards }}
    # The bundle job runs whenever contract and integration tests do. Without
    # a status function, a skipped bundle part would skip these jobs too.
    if: >-
      ${{ !cancelled() && inputs.lifecycle && needs.build.result == 'success'
      && needs.bundle.result == 'success' }}
    needs: [build, bundle]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.partitions) }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}-inputs
          path: .build/ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}-${{ matrix.layer }}
          path: .build/ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.bundle.outputs.artifact }}
          path: .build/ci
      - name: Extract test inputs and bundle
        run: |
          tar -xf .build/ci/lifecycle-inputs.tar
          tar -xf .build/ci/bundle.tar
      # Slices deal the platform's sorted tests round-robin, so slow tests that
      # sort next to each other split evenly. A slice depends on the selected
      # test list: adding a test moves later tests to other partitions.
      - name: Execute the partition without compiling
        env:
          LAYER: ${{ matrix.layer }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
          # The tofu test integration scenarios record each result and a failed
          # scenario's redacted evidence here.
          NEMOCLAW_INTEGRATION_EVIDENCE: ${{ runner.temp }}/hcl-integration
        run: >-
          .build/ci/nemoclaw-build ci "$LAYER"
          --partition "slice:${SHARD}/${SHARDS}"
          --archive-file ".build/ci/${LAYER}.tar.zst"
      - name: Upload timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.layer }}-${{ inputs.platform }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: target/nextest/${{ matrix.layer }}/${{ matrix.layer }}.xml
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - name: Summarize integration scenarios
        if: always() && matrix.layer == 'integration'
        env:
          RESULTS: ${{ runner.temp }}/hcl-integration/results.tsv
        run: |
          if [ -f "$RESULTS" ]; then
            {
              echo '| Integration scenario | Result |'
              echo '|---|---|'
              awk -F '\t' '{ printf "| `%s` | %s |\n", $1, $2 }' "$RESULTS"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      # Fixture credentials are redacted; the evidence holds only fixture data.
      - name: Upload failed integration scenarios' evidence
        if: failure() && matrix.layer == 'integration'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hcl-integration-evidence-${{ inputs.platform }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hcl-integration
          if-no-files-found: ignore
          retention-days: 7

  # Each partition reports and enforces its own budget; this job reports each
  # layer's whole suite in its summary, from the partitions' uploaded timings,
  # including failed partitions'. A test binary's tests span partitions, so this
  # job enforces the binary budgets: a binary over its budget fails the
  # platform's Test check. Only Linux enforces them, so only Linux runs this
  # job; the caller reports the other platforms' suites outside their checks.
  timing:
    name: ${{ matrix.layer == 'contract' && 'Contract' || 'Integration' }} timing report
    needs: [build, tests]
    if: ${{ !cancelled() && startsWith(inputs.platform, 'linux_') && needs.build.result == 'success' && needs.tests.result != 'skipped' }}
    strategy:
      fail-fast: false
      matrix:
        layer: [contract, integration]
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    steps:
      # For .config/test-budgets.yaml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The build tool comes from the test inputs; this job compiles nothing.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}-inputs
          path: .build/ci
      # Every attempt's timings; the report reads each shard's latest attempt.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ matrix.layer }}-${{ inputs.platform }}-*
          path: .build/ci/timings
      - name: Report the whole suite
        env:
          LAYER: ${{ matrix.layer }}
          PARTITIONS: ${{ inputs.partitions }}
        run: |
          tool=.build/ci/nemoclaw-build
          tar -xf .build/ci/lifecycle-inputs.tar "$tool"
          shards=$(jq -c --arg layer "$LAYER" '[.[] | select(.layer == $layer) | .shard]' <<< "$PARTITIONS")
          "$tool" suite-timing "$LAYER" .build/ci/timings --platform "$TEST_PLATFORM" --shards "$shards"

  # The live suites' images, built once per platform alongside the build and
  # bundle jobs: the build reads neither job's artifacts, so it starts with them
  # instead of after both. The live jobs load these images instead of building
  # their own. When
  # no image input changed since a v1 commit that pushed them, the live jobs
  # pull that commit's images instead. The builds reuse the layers that v1's
  # last build saved to the Actions cache for unchanged image inputs.
  live-images:
    name: E2E build images
    if: inputs.e2e && inputs.live-images-commit == ''
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.identity.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          platform: ${{ inputs.platform }}
          save-cache: "false"
      # The image builds' pinned sources, as CI / Images saved them.
      - name: Restore the verified image sources
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/downloads
          key: image-sources-v1-${{ hashFiles('versions.json') }}
      - uses: ./.github/actions/containerd-store
      # Buildx reads the Actions cache service from these variables, which
      # GitHub passes to actions but not to run steps.
      - name: Expose the Actions cache to Buildx
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            for (const name of ["ACTIONS_CACHE_SERVICE_V2", "ACTIONS_CACHE_URL", "ACTIONS_RESULTS_URL", "ACTIONS_RUNTIME_TOKEN"]) {
              if (process.env[name]) core.exportVariable(name, process.env[name]);
            }
      - name: Build and save the live images
        env:
          # Like the Rust caches, only v1 saves image layers; pull requests
          # into v1 read them.
          NEMOCLAW_SAVE_GHA_CACHE: ${{ github.ref == 'refs/heads/v1' }}
        run: cargo ci live-images
      - name: Identify live images artifact
        id: identity
        run: echo "artifact=live-images-${TEST_PLATFORM}-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload live images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.identity.outputs.artifact }}
          path: .build/ci/live-images.tar.zst
          include-hidden-files: true
          # Already zstd-compressed.
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      # The GPU runner downloads artifacts slowly, so the GPU HCL cases that run
      # only OpenClaw download its image alone, about a third smaller.
      - name: Upload the OpenClaw live image
        if: inputs.hcl-gpu
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.identity.outputs.artifact }}-openclaw
          path: .build/ci/live-images-openclaw.tar.zst
          include-hidden-files: true
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  # The Docker and Kubernetes live suites and the HCL E2E cases, from this
  # platform's test archive, bundle, and live images, or in place of the live
  # images, a v1 commit's pushed images when the plan names one.
  e2e:
    name: E2E
    needs: [build, bundle, live-images]
    if: >-
      ${{ !cancelled() && inputs.e2e && needs.build.result == 'success' && needs.bundle.result == 'success' &&
      (needs.live-images.result == 'success' ||
      (needs.live-images.result == 'skipped' && inputs.live-images-commit != '')) }}
    uses: ./.github/workflows/e2e-platform.yml
    with:
      runner: ${{ inputs.runner }}
      platform: ${{ inputs.platform }}
      tests: ${{ needs.build.outputs.artifact }}
