name: Bundle platform
on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      platform:
        type: string
        required: true
      bundle:
        description: Build the bundle when its inputs or consumers are affected.
        type: boolean
        default: true
      lifecycle:
        description: Run contract and integration tests when their inputs are affected.
        type: boolean
        default: true
      contract-shards:
        description: JSON list of contract shard numbers; its length is the partition count.
        type: string
        default: "[1]"
      integration-shards:
        description: JSON list of integration shard numbers; its length is the partition count.
        type: string
        default: "[1, 2]"
      e2e:
        description: Run the Docker and Kubernetes live suites, which need a Linux runner.
        type: boolean
        default: false
      live-images-commit:
        description: A v1 commit whose pushed images the live suites pull instead of building, or empty to build them.
        type: string
        default: ""
      hcl:
        description: With e2e, also run the HCL E2E cases that use NVIDIA hosted inference; the caller passes the inference secret.
        type: boolean
        default: false
      hcl-gpu:
        description: Run the HCL E2E cases on the NVIDIA GPU runner, which refuses pull request jobs; the caller passes the inference secret.
        type: boolean
        default: false
# The live suites read the per-commit image package for images to reuse.
permissions:
  contents: read
  packages: read
# A platform's four test layers, each its own workflow, so the run page groups
# each platform's jobs by layer: Unit, then Contract, Integration, and, on
# Linux, E2E, which start when the unit layer has uploaded the test archive and
# bundle. The caller's Test / PLATFORM check requires every job here that runs;
# a layer the plan does not select is skipped.
jobs:
  unit:
    name: Unit
    uses: ./.github/workflows/layer-unit.yml
    with:
      runner: ${{ inputs.runner }}
      platform: ${{ inputs.platform }}
      bundle: ${{ inputs.bundle || inputs.lifecycle || inputs.e2e }}
      archive: ${{ inputs.lifecycle || inputs.e2e }}

  contract:
    name: Contract
    needs: [unit]
    if: inputs.lifecycle
    uses: ./.github/workflows/layer-tests.yml
    with:
      runner: ${{ inputs.runner }}
      platform: ${{ inputs.platform }}
      layer: contract
      shards: ${{ inputs.contract-shards }}
      tests: ${{ needs.unit.outputs.tests }}
      bundle: ${{ needs.unit.outputs.bundle }}

  integration:
    name: Integration
    needs: [unit]
    if: inputs.lifecycle
    uses: ./.github/workflows/layer-tests.yml
    with:
      runner: ${{ inputs.runner }}
      platform: ${{ inputs.platform }}
      layer: integration
      shards: ${{ inputs.integration-shards }}
      tests: ${{ needs.unit.outputs.tests }}
      bundle: ${{ needs.unit.outputs.bundle }}

  # The Docker and Kubernetes live suites and the HCL E2E cases.
  e2e:
    name: E2E
    needs: [unit]
    if: inputs.e2e
    uses: ./.github/workflows/e2e-platform.yml
    with:
      runner: ${{ inputs.runner }}
      platform: ${{ inputs.platform }}
      tests: ${{ needs.unit.outputs.tests }}
      bundle: ${{ needs.unit.outputs.bundle }}
      live-images-commit: ${{ inputs.live-images-commit }}
      hcl: ${{ inputs.hcl }}
      gpu: ${{ inputs.hcl-gpu }}
    # The HCL cases read NVIDIA_API_KEY.
    secrets: inherit
