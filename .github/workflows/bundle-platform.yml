name: Bundle platform
on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      platform:
        type: string
        required: true
      bundle:
        description: Build the bundle when its inputs or consumers are affected.
        type: boolean
        default: true
      lifecycle:
        description: Run contract and system tests when their inputs are affected.
        type: boolean
        default: true
      lifecycle-shards:
        description: JSON list of lifecycle shard numbers; its length is the partition count.
        type: string
        default: "[1, 2]"
      live:
        description: Also run the Docker and Kubernetes live suites, which need a Linux runner.
        type: boolean
        default: false
      live-images-commit:
        description: A v1 commit whose pushed images the live suites pull instead of building, or empty to build them.
        type: string
        default: ""
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  TEST_PLATFORM: ${{ inputs.platform }}
  CARGO_INCREMENTAL: "0"
# Build and test, and Build bundle, run in parallel on separate runners; the
# lifecycle shards start when both have uploaded their artifacts. Artifact names
# carry the run attempt, and consumers read them from the producers' outputs, so
# rerunning a failed shard reuses an earlier attempt's artifacts.
jobs:
  build:
    name: Build and test
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.identity.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          platform: ${{ inputs.platform }}
      - name: Check formatting
        run: cargo ci fmt
      - name: Lint Rust
        run: cargo ci clippy
      - name: Clear cached build timings
        id: timings
        run: rm -rf target/cargo-timings
      - name: Build test executables
        run: cargo ci build
      - name: Upload workspace build timings
        if: always() && steps.timings.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-workspace-${{ inputs.platform }}-${{ github.run_attempt }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 14
      - name: Run tests
        run: cargo ci test
      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-${{ inputs.platform }}-${{ github.run_attempt }}
          path: target/nextest/ci/test.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Check generated configuration schema and reference
        run: cargo ci schema
      - name: Archive lifecycle executables and inputs
        if: inputs.lifecycle || inputs.live
        run: cargo ci archive
      - name: Identify lifecycle artifact
        if: inputs.lifecycle || inputs.live
        id: identity
        run: echo "artifact=lifecycle-inputs-${TEST_PLATFORM}-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload lifecycle inputs
        if: inputs.lifecycle || inputs.live
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.identity.outputs.artifact }}
          path: |
            .build/ci/lifecycle.tar.zst
            .build/ci/lifecycle-inputs.tar
          include-hidden-files: true
          compression-level: 1
          retention-days: 1
          if-no-files-found: error

  bundle:
    name: Build bundle
    if: inputs.bundle || inputs.lifecycle || inputs.live
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.identity.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A separate cache: the bundle's release dependencies and the debug build
      # tool that assembles it, which the test job's cache does not hold together.
      - uses: ./.github/actions/setup-rust
        with:
          platform: ${{ inputs.platform }}
          cache-prefix: native-bundle-v3
      - name: Clear cached build timings
        id: timings
        run: rm -rf target/cargo-timings
      - name: Build and verify bundle
        run: cargo ci bundle
      - name: Upload release bundle build timings
        if: always() && steps.timings.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-bundle-${{ inputs.platform }}-${{ github.run_attempt }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 14
      # Tar preserves the executable permissions that artifact transfer drops.
      - name: Pack bundle
        run: |
          mkdir -p .build/ci
          tar -cf .build/ci/bundle.tar "dist/${TEST_PLATFORM}"
      - name: Identify bundle artifact
        id: identity
        run: echo "artifact=bundle-${TEST_PLATFORM}-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.identity.outputs.artifact }}
          path: .build/ci/bundle.tar
          include-hidden-files: true
          compression-level: 1
          retention-days: 1
          if-no-files-found: error

  lifecycle:
    name: Lifecycle / ${{ matrix.shard }}
    # The bundle job runs whenever lifecycle tests do.
    if: inputs.lifecycle && needs.bundle.result == 'success'
    needs: [build, bundle]
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.lifecycle-shards) }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: .build/ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.bundle.outputs.artifact }}
          path: .build/ci
      - name: Extract lifecycle inputs and bundle
        run: |
          tar -xf .build/ci/lifecycle-inputs.tar
          tar -xf .build/ci/bundle.tar
      # Slices deal the platform's sorted lifecycle tests round-robin, so the
      # slow e2e scenarios, which sort next to each other, split evenly. Hash
      # buckets left one Linux partition about 50 s slower than the other.
      # A slice depends on the selected test list: adding a test moves later
      # tests to other partitions.
      - name: Execute lifecycle partition without compiling
        env:
          LIFECYCLE_SHARD: ${{ matrix.shard }}
          LIFECYCLE_SHARDS: ${{ strategy.job-total }}
          # The tofu test integration scenarios record each result and a failed
          # scenario's redacted evidence here.
          NEMOCLAW_INTEGRATION_EVIDENCE: ${{ runner.temp }}/hcl-integration
        run: >-
          .build/ci/nemoclaw-build ci lifecycle
          --partition "slice:${LIFECYCLE_SHARD}/${LIFECYCLE_SHARDS}"
          --archive-file .build/ci/lifecycle.tar.zst
      - name: Upload lifecycle timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lifecycle-${{ inputs.platform }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: target/nextest/lifecycle/lifecycle.xml
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - name: Summarize integration scenarios
        if: always()
        env:
          RESULTS: ${{ runner.temp }}/hcl-integration/results.tsv
        run: |
          if [ -f "$RESULTS" ]; then
            {
              echo '| Integration scenario | Result |'
              echo '|---|---|'
              awk -F '\t' '{ printf "| `%s` | %s |\n", $1, $2 }' "$RESULTS"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      # Fixture credentials are redacted; the evidence holds only fixture data.
      - name: Upload failed integration scenarios' evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hcl-integration-evidence-${{ inputs.platform }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hcl-integration
          if-no-files-found: ignore
          retention-days: 7

  # Each partition reports and enforces its own budget; this job reports the
  # platform's whole lifecycle suite in its summary, from the partitions'
  # uploaded timings, including failed partitions'. A test binary's tests span
  # partitions, so this job enforces the binary budgets: on Linux, a binary
  # over its budget fails the platform.
  lifecycle-timing:
    name: Lifecycle timing
    needs: [build, lifecycle]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.lifecycle.result != 'skipped' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    steps:
      # For .config/test-budgets.yaml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The build tool comes from the lifecycle inputs; this job compiles nothing.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: .build/ci
      # Every attempt's timings; the report reads each shard's latest attempt.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lifecycle-${{ inputs.platform }}-*
          path: .build/ci/timings
      - name: Report the whole lifecycle suite
        env:
          SHARDS: ${{ inputs.lifecycle-shards }}
        run: |
          tool=.build/ci/nemoclaw-build
          if [ "$RUNNER_OS" = Windows ]; then tool="$tool.exe"; fi
          tar -xf .build/ci/lifecycle-inputs.tar "$tool"
          "$tool" lifecycle-timing .build/ci/timings --platform "$TEST_PLATFORM" --shards "$SHARDS"

  # The live suites' images, built once per platform alongside the build and
  # bundle jobs; both live jobs load them instead of building their own. When
  # no image input changed since a v1 commit that pushed them, the live jobs
  # pull that commit's images instead.
  live-images:
    name: Build live images
    if: inputs.live && inputs.live-images-commit == ''
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.identity.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          platform: ${{ inputs.platform }}
          save-cache: "false"
      - uses: ./.github/actions/containerd-store
      - name: Build and save the live images
        run: cargo ci live-images
      - name: Identify live images artifact
        id: identity
        run: echo "artifact=live-images-${TEST_PLATFORM}-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload live images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.identity.outputs.artifact }}
          path: .build/ci/live-images.tar.zst
          include-hidden-files: true
          # Already zstd-compressed.
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  # Like the lifecycle shards, the live suites run this platform's archived test
  # executables and bundle, load its live images, compile nothing, and count
  # toward the platform's required Test / PLATFORM check.
  live-docker:
    name: Live / Docker
    needs: [build, bundle, live-images]
    # Runs after Build live images, or in its place when the plan names a v1
    # commit's images. Its result decides the platform's Test check, so it
    # must not be skipped when its images are pulled.
    if: >-
      ${{ !cancelled() && inputs.live &&
      needs.build.result == 'success' && needs.bundle.result == 'success' &&
      (needs.live-images.result == 'success' ||
      (needs.live-images.result == 'skipped' && inputs.live-images-commit != '')) }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/live-suite
        with:
          platform: ${{ inputs.platform }}
          suite: live-docker
          tests: ${{ needs.build.outputs.artifact }}
          bundle: ${{ needs.bundle.outputs.artifact }}
          images: ${{ needs.live-images.outputs.artifact }}
          images-commit: ${{ inputs.live-images-commit }}

  live-kind:
    name: Live / Kind
    needs: [build, bundle, live-images]
    # Runs after Build live images, or in its place when the plan names a v1
    # commit's images. Its result decides the platform's Test check, so it
    # must not be skipped when its images are pulled.
    if: >-
      ${{ !cancelled() && inputs.live &&
      needs.build.result == 'success' && needs.bundle.result == 'success' &&
      (needs.live-images.result == 'success' ||
      (needs.live-images.result == 'skipped' && inputs.live-images-commit != '')) }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/live-suite
        with:
          platform: ${{ inputs.platform }}
          suite: live-kind
          tests: ${{ needs.build.outputs.artifact }}
          bundle: ${{ needs.bundle.outputs.artifact }}
          images: ${{ needs.live-images.outputs.artifact }}
          images-commit: ${{ inputs.live-images-commit }}
