name: PR metadata
on:
  # Include stacked PRs. Body edits must not rerun the platform builds.
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: pr-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  session-report:
    name: Session report
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check and test the validator
        run: |
          rustfmt --edition 2024 --check tools/ci/pr-session-report.rs
          rustc --edition=2024 -D warnings --test tools/ci/pr-session-report.rs -o "$RUNNER_TEMP/report-tests"
          "$RUNNER_TEMP/report-tests"
          rustc --edition=2024 -D warnings tools/ci/pr-session-report.rs -o "$RUNNER_TEMP/report-check"
      - name: Validate the opening report comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # Fetch every page; comment text is data, never shell source or log output.
        run: |
          gh api --paginate --slurp "repos/$GH_REPO/issues/$PR_NUMBER/comments" > "$RUNNER_TEMP/comments.json"
          jq -er '[.[][] | select(.body | test("^\\s*<!-- agent-session-report:opening -->"))] | if length == 1 then .[0].body else error("expected exactly one opening report comment") end' "$RUNNER_TEMP/comments.json" > "$RUNNER_TEMP/report-comment.md"
          "$RUNNER_TEMP/report-check" "$RUNNER_TEMP/report-comment.md"
