name: Governance / Lint PR Title

run-name: >-
  ${{ inputs.repair_attempt_key != '' &&
  format('Repair validation {0} head {1}', inputs.repair_attempt_key, inputs.repair_head_sha) ||
  github.event.pull_request.title }}

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      repair_pr_number:
        required: false
        type: string
        default: ""
      repair_head_sha:
        required: false
        type: string
        default: ""
      repair_base_sha:
        required: false
        type: string
        default: ""
      repair_attempt_key:
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.repair_attempt_key || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  validate-repair-target:
    if: ${{ inputs.repair_attempt_key != '' }}
    uses: ./.github/workflows/validate-repair-target.yaml
    with:
      repair_pr_number: ${{ inputs.repair_pr_number }}
      repair_head_sha: ${{ inputs.repair_head_sha }}
      repair_base_sha: ${{ inputs.repair_base_sha }}
      repair_attempt_key: ${{ inputs.repair_attempt_key }}
    permissions:
      contents: read
      pull-requests: read

  commit-lint:
    needs: validate-repair-target
    if: ${{ always() && (github.event_name == 'pull_request' || needs.validate-repair-target.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Read generated repair pull request
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.repair_pr_number }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/repair-pr.json"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title || '' }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            jq -r .title "$RUNNER_TEMP/repair-pr.json" | npx commitlint --verbose
          else
            printf '%s\n' "$PR_TITLE" | npx commitlint --verbose
          fi

  repair-receipt:
    name: ${{ format('Repair receipt {0} PR {1} head {2} base {3}', inputs.repair_attempt_key, inputs.repair_pr_number, inputs.repair_head_sha, inputs.repair_base_sha) }}
    needs: commit-lint
    if: ${{ inputs.repair_attempt_key != '' && needs.commit-lint.result == 'success' }}
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Record exact validation receipt
        run: echo 'Trusted validation completed for the exact repair inputs.'
