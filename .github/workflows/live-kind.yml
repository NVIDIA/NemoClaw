# The managed Kubernetes gateway on a temporary kind cluster.
# `cargo ci live-kind` runs the same thing locally; see docs/contributing/testing.md.
name: Live / Kind
on:
  push:
    # Dispatch needs this file on the default branch; push a
    # run-live-kind/ branch to run it outside a pull request.
    branches: [v1, run-live-kind/**]
  # Pull requests run the suite when they change its build or inputs; see
  # docs/contributing/testing.md.
  pull_request:
    branches: [v1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-kind-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  live-kind:
    name: Live / Kind / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            platform: linux_arm64
          - runner: ubuntu-24.04
            platform: linux_amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      TEST_PLATFORM: ${{ matrix.platform }}
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The second commit is a pull request merge commit's base.
          fetch-depth: 2
      - name: Decide whether this change can affect the live suites
        id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # Pushes and manual runs always run the suite.
          if [ "$EVENT" != pull_request ]; then
            echo live=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(git rev-parse HEAD^1)
          cargo run --locked --quiet -p nemoclaw-build --no-default-features --target-dir target/ci-runner -- \
            changes live --base "$base" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-rust
        if: steps.changes.outputs.live == 'true'
        with:
          platform: ${{ matrix.platform }}
          save-cache: "false"
      - name: Build test executables
        if: steps.changes.outputs.live == 'true'
        run: cargo ci build
      - name: Build and verify bundle
        if: steps.changes.outputs.live == 'true'
        run: cargo ci bundle
      # The agent image's metadata bundle is read from an OCI index, which
      # Docker writes only with its containerd image store.
      - name: Use the containerd image store
        if: steps.changes.outputs.live == 'true'
        run: |
          config=/etc/docker/daemon.json
          if [ -s "$config" ]; then current=$(sudo cat "$config"); else current='{}'; fi
          printf '%s' "$current" | jq '.features["containerd-snapshotter"] = true' | sudo tee "$config" >/dev/null
          sudo systemctl restart docker
          docker info --format '{{json .DriverStatus}}' | grep -q io.containerd.snapshotter.v1
      - name: Run Kubernetes live tests
        if: steps.changes.outputs.live == 'true'
        run: cargo ci live-kind
      - name: Upload live test results
        if: always() && steps.changes.outputs.live == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-kind-${{ matrix.platform }}-${{ github.run_attempt }}
          path: target/nextest/live-kind/live-kind.xml
          if-no-files-found: ignore
          retention-days: 14
