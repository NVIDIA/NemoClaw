name: E2E / Simple Maintainer Run
run-name: "Simple E2E ${{ inputs.sha || github.sha }}"

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to test; blank uses the selected ref head"
        required: false
        default: ""
        type: string
      jobs:
        description: "Comma-separated job IDs; empty jobs and targets select every simple E2E"
        required: false
        default: "messaging-providers,mcp-bridge,hermes-e2e"
        type: string
      targets:
        description: "Comma-separated target IDs, using the main E2E selector semantics"
        required: false
        default: "security-posture-hermes,openshell-gateway-upgrade-v0-0-55-x86-64,openshell-gateway-upgrade-v0-0-55-aarch64,openshell-gateway-upgrade-v0-0-74-x86-64,openshell-gateway-upgrade-v0-0-89-x86-64,shields-retirement-upgrade"
        type: string
      image_run_id:
        description: "Optional prior successful Simple E2E run whose exact managed images should be reused"
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      build_base: ${{ steps.plan.outputs.build_base }}
      image_run_id: ${{ steps.plan.outputs.image_run_id }}
      selected: ${{ steps.plan.outputs.selected }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - name: Require a repository maintainer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for actor in "$GITHUB_ACTOR" "$GITHUB_TRIGGERING_ACTOR"; do
            permission="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$actor/permission" --jq .role_name)"
            [[ "$permission" == "maintain" || "$permission" == "admin" ]] || {
              echo "::error::Simple E2E requires repository maintainer or administrator permission"
              exit 1
            }
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - id: plan
        name: Select tests and classify base-image work
        env:
          IMAGE_RUN_ID: ${{ inputs.image_run_id }}
          JOBS: ${{ inputs.jobs }}
          TARGETS: ${{ inputs.targets }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse --verify HEAD)"
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          job_ids='["messaging-providers","mcp-bridge","hermes-e2e"]'
          target_ids='["security-posture-hermes","openshell-gateway-upgrade-v0-0-55-x86-64","openshell-gateway-upgrade-v0-0-55-aarch64","openshell-gateway-upgrade-v0-0-74-x86-64","openshell-gateway-upgrade-v0-0-89-x86-64","shields-retirement-upgrade"]'
          all="$(jq -cn --argjson jobs "$job_ids" --argjson targets "$target_ids" '$jobs + $targets')"
          if [[ -z "$JOBS" && -z "$TARGETS" ]]; then
            selected="$all"
          else
            # shellcheck disable=SC2016
            selected_jobs="$(jq -cn --arg value "$JOBS" '$value | split(",") | map(select(length > 0)) | unique')"
            # shellcheck disable=SC2016
            selected_targets="$(jq -cn --arg value "$TARGETS" '$value | split(",") | map(select(length > 0)) | unique')"
            jq -e --argjson allowed "$job_ids" 'all(.[]; IN($allowed[]))' <<<"$selected_jobs" >/dev/null || {
              echo "::error::Unknown simple E2E job selection: $JOBS"
              exit 1
            }
            jq -e --argjson allowed "$target_ids" 'all(.[]; IN($allowed[]))' <<<"$selected_targets" >/dev/null || {
              echo "::error::Unknown simple E2E target selection: $TARGETS"
              exit 1
            }
            selected="$(jq -cn --argjson jobs "$selected_jobs" --argjson targets "$selected_targets" '$jobs + $targets | unique')"
          fi
          git fetch --no-tags origin main
          merge_base="$(git merge-base "$sha" origin/main)"
          if [[ "$merge_base" == "$sha" ]]; then
            compare_sha="$(git rev-parse "${sha}^")"
          else
            compare_sha="$merge_base"
          fi
          changed="$(git diff --name-only --diff-filter=ACMRD "$compare_sha" "$sha")"
          base_changed="$(grep -E '^(Dockerfile[.]base|agents/hermes/Dockerfile[.]base|agents/hermes/(security-dependencies|runtime-boundaries|whatsapp-proxy)[.]patch|agents/hermes/hindsight-client-probe-requirements[.]txt|agents/langchain-deepagents-code/(Dockerfile[.]base|requirements[.]lock)|agents/openclaw/(openclaw-runtime|mcporter-runtime)/|ci/npm-audit-exceptions[.]json|nemoclaw-blueprint/blueprint[.]yaml|scripts/security/|scripts/checks/download-hermes-source-archive[.]sh|scripts/lib/(bundled-npm-package|patch-bundled-npm-ip-address|reviewed-npm-archive|reviewed-npm-audit)[.]mts|scripts/lib/sandbox-rlimits[.]sh|scripts/(patch-bundled-npm-brace-expansion|patch-bundled-npm-tar|upgrade-bundled-npm)[.]mts)$' <<<"$changed" || true)"
          build_base=false
          [[ -z "$base_changed" ]] || build_base=true
          if [[ -n "$IMAGE_RUN_ID" ]]; then
            [[ "$IMAGE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
              echo "::error::image_run_id must be a positive workflow run ID"
              exit 1
            }
            build_base=false
          fi

          {
            printf 'sha=%s\n' "$sha"
            printf 'build_base=%s\n' "$build_base"
            printf 'image_run_id=%s\n' "$IMAGE_RUN_ID"
            printf 'selected=%s\n' "$selected"
          } >>"$GITHUB_OUTPUT"
          {
            # shellcheck disable=SC2016
            printf '### Simple E2E plan\n\n'
            # shellcheck disable=SC2016
            printf -- '- Commit: `%s`\n' "$sha"
            # shellcheck disable=SC2016
            printf -- '- Tests: `%s`\n' "$(jq -r 'join(",")' <<<"$selected")"
            # shellcheck disable=SC2016
            printf -- '- Base images: `%s`\n' "$build_base"
          } >>"$GITHUB_STEP_SUMMARY"

  base-images:
    needs: plan
    if: ${{ needs.plan.outputs.build_base == 'true' && needs.plan.outputs.image_run_id == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: openclaw
            dockerfile: Dockerfile.base
            repository: ghcr.io/nvidia/nemoclaw/sandbox-base
          - agent: hermes
            dockerfile: agents/hermes/Dockerfile.base
            repository: ghcr.io/nvidia/nemoclaw/hermes-sandbox-base
          - agent: langchain-deepagents-code
            dockerfile: agents/langchain-deepagents-code/Dockerfile.base
            repository: ghcr.io/nvidia/nemoclaw/langchain-deepagents-code-sandbox-base
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build exact base image
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          REPOSITORY: ${{ matrix.repository }}
        shell: bash
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/base-metadata.json"
          for attempt in 1 2; do
            if docker buildx build \
              --platform linux/amd64 \
              --provenance=false \
              --sbom=false \
              --file "$DOCKERFILE" \
              --output "type=image,name=$REPOSITORY,push-by-digest=true,name-canonical=true,push=true" \
              --metadata-file "$metadata" \
              .; then
              break
            fi
            [[ "$attempt" -lt 2 ]] || exit 1
            echo "::warning::Base build failed; retrying once with the retained BuildKit cache"
          done
          digest="$(jq -er '."containerimage.digest"' "$metadata")"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/base-contract"
          jq -n --arg reference "$REPOSITORY@$digest" '{reference:$reference}' \
            >"$RUNNER_TEMP/base-contract/contract.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: simple-base-${{ matrix.agent }}
          path: ${{ runner.temp }}/base-contract/contract.json
          if-no-files-found: error
          retention-days: 1

  managed-images:
    needs: [plan, base-images]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.image_run_id == '' && (needs.base-images.result == 'success' || needs.base-images.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: openclaw
            dockerfile: Dockerfile
            base_alias: ghcr.io/nvidia/nemoclaw/sandbox-base:latest
            base_repository: ghcr.io/nvidia/nemoclaw/sandbox-base
            repository: ghcr.io/nvidia/nemoclaw/openclaw-sandbox
          - agent: hermes
            dockerfile: agents/hermes/Dockerfile
            base_alias: ghcr.io/nvidia/nemoclaw/hermes-sandbox-base:latest
            base_repository: ghcr.io/nvidia/nemoclaw/hermes-sandbox-base
            repository: ghcr.io/nvidia/nemoclaw/hermes-sandbox
          - agent: langchain-deepagents-code
            dockerfile: agents/langchain-deepagents-code/Dockerfile
            base_alias: ghcr.io/nvidia/nemoclaw/langchain-deepagents-code-sandbox-base:latest
            base_repository: ghcr.io/nvidia/nemoclaw/langchain-deepagents-code-sandbox-base
            repository: ghcr.io/nvidia/nemoclaw/langchain-deepagents-code-sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Download rebuilt base
        if: ${{ needs.plan.outputs.build_base == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: simple-base-${{ matrix.agent }}
          path: ${{ runner.temp }}/base-contract

      - id: base
        name: Select exact base
        env:
          BASE_ALIAS: ${{ matrix.base_alias }}
          BASE_REPOSITORY: ${{ matrix.base_repository }}
          BUILD_BASE: ${{ needs.plan.outputs.build_base }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BUILD_BASE" == "true" ]]; then
            reference="$(jq -er .reference "$RUNNER_TEMP/base-contract/contract.json")"
          else
            docker buildx imagetools inspect "$BASE_ALIAS" --raw >"$RUNNER_TEMP/base.raw"
            reference="$BASE_REPOSITORY@sha256:$(sha256sum "$RUNNER_TEMP/base.raw" | awk '{print $1}')"
          fi
          [[ "$reference" =~ @sha256:[a-f0-9]{64}$ ]]
          printf 'reference=%s\n' "$reference" >>"$GITHUB_OUTPUT"

      - name: Build exact managed image
        env:
          AGENT: ${{ matrix.agent }}
          BASE_IMAGE: ${{ steps.base.outputs.reference }}
          CANDIDATE_SHA: ${{ needs.plan.outputs.sha }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          REPOSITORY: ${{ matrix.repository }}
        shell: bash
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/managed-metadata.json"
          release="$(git describe --tags --match 'v*' "$CANDIDATE_SHA")"
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --file "$DOCKERFILE" \
            --build-arg "BASE_IMAGE=$BASE_IMAGE" \
            --build-arg NEMOCLAW_MANAGED_IMAGE_CAPABILITY_UNION=1 \
            --build-arg NEMOCLAW_MANAGED_IMAGE_RUNTIME_USER=root \
            --label "org.opencontainers.image.revision=$CANDIDATE_SHA" \
            --label "org.opencontainers.image.version=$release" \
            --label "io.nvidia.nemoclaw.agent=$AGENT" \
            --label "io.nvidia.nemoclaw.managed-image.cohort=ghrun-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --output "type=image,name=$REPOSITORY,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "$metadata" \
            .
          digest="$(jq -er '."containerimage.digest"' "$metadata")"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/managed-contract"
          jq -n \
            --arg agent "$AGENT" --arg cohort "ghrun-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --arg digest "$digest" --arg image "$REPOSITORY" --arg reference "$REPOSITORY@$digest" \
            --arg release "$release" --arg revision "$CANDIDATE_SHA" \
            '{contractVersion:1,agent:$agent,platform:"linux/amd64",image:$image,digest:$digest,reference:$reference,source:{repository:"NVIDIA/NemoClaw",revision:$revision,release:$release,cohort:$cohort},startupProfileContractVersion:1,capabilityContractVersion:1}' \
            >"$RUNNER_TEMP/managed-contract/contract.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: simple-managed-${{ matrix.agent }}
          path: ${{ runner.temp }}/managed-contract/contract.json
          if-no-files-found: error
          retention-days: 1

  catalog:
    needs: [plan, managed-images]
    if: ${{ always() && needs.plan.result == 'success' && (needs.managed-images.result == 'success' || (needs.managed-images.result == 'skipped' && needs.plan.outputs.image_run_id != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      revision: ${{ steps.assemble.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ needs.plan.outputs.image_run_id == '' }}
        with:
          pattern: simple-managed-*
          path: ${{ runner.temp }}/managed-contracts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ needs.plan.outputs.image_run_id != '' }}
        with:
          pattern: simple-managed-*
          path: ${{ runner.temp }}/managed-contracts
          run-id: ${{ needs.plan.outputs.image_run_id }}
          github-token: ${{ github.token }}

      - id: assemble
        name: Assemble exact managed-image catalog
        env:
          IMAGE_RUN_ID: ${{ needs.plan.outputs.image_run_id }}
          TARGET_SHA: ${{ needs.plan.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/catalog"
          find "$RUNNER_TEMP/managed-contracts" -name contract.json -print0 \
            | xargs -0 jq -s 'if length == 3 then map({key:.agent,value:.}) | from_entries else error("expected three managed contracts") end' \
            >"$RUNNER_TEMP/catalog/catalog.json"
          source_revision="$(jq -er '[.[].source.revision] | unique | if length == 1 then .[0] else error("mixed source revisions") end' "$RUNNER_TEMP/catalog/catalog.json")"
          [[ "$source_revision" =~ ^[a-f0-9]{40}$ ]]
          printf 'revision=%s\n' "$source_revision" >>"$GITHUB_OUTPUT"
          git merge-base --is-ancestor "$source_revision" "$TARGET_SHA"
          if [[ "$source_revision" != "$TARGET_SHA" ]]; then
            changed="$(git diff --name-only --diff-filter=ACMRD "$source_revision" "$TARGET_SHA")"
            unexpected="$(grep -Ev '^(test/|[.]github/workflows/e2e-simple[.]yaml$|src/lib/actions/sandbox/mcp-bridge-restart[.]ts$)' <<<"$changed" || true)"
            [[ -z "$unexpected" ]] || {
              echo "::error::Reused images are not source-equivalent to the requested commit"
              exit 1
            }
          fi
          if [[ -n "$IMAGE_RUN_ID" ]]; then
            jq -e --arg prefix "ghrun-$IMAGE_RUN_ID-" 'all(.[]; .source.cohort | startswith($prefix))' \
              "$RUNNER_TEMP/catalog/catalog.json" >/dev/null
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: simple-managed-catalog
          path: ${{ runner.temp }}/catalog/catalog.json
          if-no-files-found: error
          retention-days: 1

  test:
    needs: [plan, catalog]
    if: ${{ always() && needs.plan.result == 'success' && needs.catalog.result == 'success' }}
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.id == 'openshell-gateway-upgrade-v0-0-55-aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.selected) }}
    env:
      NEMOCLAW_CLI_BIN: ${{ github.workspace }}/bin/nemoclaw.js
      NEMOCLAW_E2E_EXPECTED_SHA: ${{ needs.plan.outputs.sha }}
      NEMOCLAW_E2E_MANAGED_IMAGE_CATALOG: ${{ github.workspace }}/simple-managed-catalog/catalog.json
      NEMOCLAW_E2E_MANAGED_IMAGE_REVISION: ${{ needs.catalog.outputs.revision }}
      NEMOCLAW_GATEWAY_RUNTIME: docker
      NEMOCLAW_OPENSHELL_CHANNEL: stable
      NEMOCLAW_RUN_LIVE_E2E: "1"
      OPENSHELL_DOCKER_SUPERVISOR_IMAGE: ghcr.io/nvidia/openshell/supervisor@sha256:722f44669722961b7f432b0b81de25b91a58f34a61d6403bef967acaf2b3af01
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NVIDIA/NemoClaw
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - uses: NVIDIA/NemoClaw/.github/actions/docker-auth-setup@05fa6b810017752ab21148cb7e9d82d12a88c92f
        with:
          auth-required: "1"
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: NVIDIA/NemoClaw/.github/actions/prepare-e2e@f6304bc25fc35bfaa441c8c2fbfee38f72805a75

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: simple-managed-catalog
          path: ${{ github.workspace }}/simple-managed-catalog

      - id: config
        name: Configure selected test
        env:
          TEST_ID: ${{ matrix.id }}
        shell: bash
        run: |
          set -euo pipefail
          agent=openclaw
          old_base=""
          selector=""
          case "$TEST_ID" in
            messaging-providers)
              test_file=test/e2e/live/messaging-providers.test.ts
              env_lines=$'NEMOCLAW_E2E_USE_HOSTED_INFERENCE=1\nNEMOCLAW_NON_INTERACTIVE=1\nNEMOCLAW_ACCEPT_THIRD_PARTY_SOFTWARE=1\nOPENSHELL_GATEWAY=nemoclaw'
              ;;
            mcp-bridge)
              agent=hermes
              test_file=test/e2e/live/mcp-bridge.test.ts
              selector='^mcp-bridge-hermes$'
              env_lines='NEMOCLAW_MCP_BRIDGE_AGENT=hermes'
              ;;
            hermes-e2e)
              agent=hermes
              test_file=test/e2e/live/hermes-e2e.test.ts
              env_lines=$'NEMOCLAW_E2E_INFERENCE_MODE=mock\nNEMOCLAW_E2E_HERMES_DASHBOARD=1\nNEMOCLAW_ACCEPT_THIRD_PARTY_SOFTWARE=1\nNEMOCLAW_AGENT=hermes\nNEMOCLAW_NON_INTERACTIVE=1\nNEMOCLAW_RECREATE_SANDBOX=1\nNEMOCLAW_SANDBOX_NAME=e2e-hermes\nNEMOCLAW_ONBOARD_VALIDATION_TIMEOUT_SECONDS=60'
              ;;
            security-posture-hermes)
              agent=hermes
              test_file=test/e2e/live/hermes-e2e.test.ts
              env_lines=$'NEMOCLAW_E2E_USE_HOSTED_INFERENCE=1\nNEMOCLAW_NON_INTERACTIVE=1\nNEMOCLAW_ACCEPT_THIRD_PARTY_SOFTWARE=1\nNEMOCLAW_AGENT=hermes\nNEMOCLAW_E2E_EXPECT_OPENSHELL_SPLIT_PROCESS=1\nNEMOCLAW_E2E_EXPECT_NON_ROOT_HOST=1\nNEMOCLAW_E2E_SECURITY_POSTURE=1\nNEMOCLAW_ONBOARD_VALIDATION_TIMEOUT_SECONDS=60\nNEMOCLAW_RECREATE_SANDBOX=1\nNEMOCLAW_SANDBOX_NAME=e2e-hm-security\nOPENSHELL_GATEWAY=nemoclaw'
              ;;
            openshell-gateway-upgrade-v0-0-55-x86-64|openshell-gateway-upgrade-v0-0-55-aarch64)
              test_file=test/e2e/live/openshell-gateway-upgrade.test.ts
              old_base=ghcr.io/nvidia/nemoclaw/sandbox-base@sha256:10433a8cd2f2b809dd0fdf983514679e04c0f8aa1ff5bbff675029046033b108
              env_lines=$'NEMOCLAW_NON_INTERACTIVE=1\nNEMOCLAW_ACCEPT_THIRD_PARTY_SOFTWARE=1\nNEMOCLAW_GATEWAY_UPGRADE_SURVIVOR_NAME=e2e-gw-survivor\nNEMOCLAW_OLD_NEMOCLAW_REF=v0.0.55\nNEMOCLAW_OLD_NEMOCLAW_COMMIT=95d483fe2b6569d68e59493c60f19df09a068e8f\nNEMOCLAW_OLD_INSTALLER_SHA256=ff8cf448e4d17b00421545a1f333262b615b1b0aa236d0cc5aeaf4e2cae2d897\nNEMOCLAW_OLD_SANDBOX_BASE_IMAGE_REF=ghcr.io/nvidia/nemoclaw/sandbox-base@sha256:10433a8cd2f2b809dd0fdf983514679e04c0f8aa1ff5bbff675029046033b108\nNEMOCLAW_OLD_OPENSHELL_VERSION=0.0.44\nNEMOCLAW_OLD_OPENCLAW_VERSION=2026.5.22\nOPENSHELL_GATEWAY=nemoclaw'
              ;;
            openshell-gateway-upgrade-v0-0-74-x86-64)
              test_file=test/e2e/live/openshell-gateway-upgrade.test.ts
              old_base=ghcr.io/nvidia/nemoclaw/sandbox-base@sha256:104151ffadc2ff0b6c815e3c95c2783ced61aee0d0f83fc327cc02be9b7e14e6
              env_lines=$'NEMOCLAW_NON_INTERACTIVE=1\nNEMOCLAW_ACCEPT_THIRD_PARTY_SOFTWARE=1\nNEMOCLAW_GATEWAY_UPGRADE_SURVIVOR_NAME=e2e-gw-survivor\nNEMOCLAW_OLD_NEMOCLAW_REF=v0.0.74\nNEMOCLAW_OLD_NEMOCLAW_COMMIT=3a05b54e8ec3e1d5550ec5c728de54af872bffe3\nNEMOCLAW_OLD_INSTALLER_SHA256=a0cd3feca488d247e53d59d7d8246d2b86e75e95acb5e7d78504b3c0c60fd7db\nNEMOCLAW_OLD_SANDBOX_BASE_IMAGE_REF=ghcr.io/nvidia/nemoclaw/sandbox-base@sha256:104151ffadc2ff0b6c815e3c95c2783ced61aee0d0f83fc327cc02be9b7e14e6\nNEMOCLAW_OLD_OPENSHELL_VERSION=0.0.72\nNEMOCLAW_OLD_OPENCLAW_VERSION=2026.5.27\nOPENSHELL_GATEWAY=nemoclaw'
              ;;
            openshell-gateway-upgrade-v0-0-89-x86-64)
              test_file=test/e2e/live/openshell-gateway-upgrade.test.ts
              old_base=ghcr.io/nvidia/nemoclaw/sandbox-base@sha256:3265d482f67c9d81ee3a59b0bbad5eb5ea6c705fea81ece8ae888ed12794f7f1
