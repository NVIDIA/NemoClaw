name: E2E / Affected Regressions

on:
  pull_request:
    paths:
      - ".github/workflows/e2e-simple.yaml"

permissions:
  contents: read

env:
  OPENCLAW_IMAGE: ghcr.io/nvidia/nemoclaw/openclaw-sandbox@sha256:c3f2eee548b33bdb0bf295ed6841c4157ba486b2dc55f3d9b98f33a7065959c7
  HERMES_IMAGE: ghcr.io/nvidia/nemoclaw/hermes-sandbox@sha256:4b18257a2fb992a62c58c114c7fe36d2c685eae11dad85717b38223d10e0fbd3
  MANAGED_IMAGE_CATALOG: '{"openclaw":{"contractVersion":1,"agent":"openclaw","platform":"linux/amd64","image":"ghcr.io/nvidia/nemoclaw/openclaw-sandbox","digest":"sha256:c3f2eee548b33bdb0bf295ed6841c4157ba486b2dc55f3d9b98f33a7065959c7","reference":"ghcr.io/nvidia/nemoclaw/openclaw-sandbox@sha256:c3f2eee548b33bdb0bf295ed6841c4157ba486b2dc55f3d9b98f33a7065959c7","source":{"repository":"NVIDIA/NemoClaw","revision":"376c7c09092dffd3ee7ee698e506dba1ae81e6fa","release":"v0.0.119-35-g376c7c090","cohort":"ghrun-33803755678-1"},"startupProfileContractVersion":1,"capabilityContractVersion":1},"hermes":{"contractVersion":1,"agent":"hermes","platform":"linux/amd64","image":"ghcr.io/nvidia/nemoclaw/hermes-sandbox","digest":"sha256:4b18257a2fb992a62c58c114c7fe36d2c685eae11dad85717b38223d10e0fbd3","reference":"ghcr.io/nvidia/nemoclaw/hermes-sandbox@sha256:4b18257a2fb992a62c58c114c7fe36d2c685eae11dad85717b38223d10e0fbd3","source":{"repository":"NVIDIA/NemoClaw","revision":"376c7c09092dffd3ee7ee698e506dba1ae81e6fa","release":"v0.0.119-35-g376c7c090","cohort":"ghrun-33803755678-1"},"startupProfileContractVersion":1,"capabilityContractVersion":1},"langchain-deepagents-code":{"contractVersion":1,"agent":"langchain-deepagents-code","platform":"linux/amd64","image":"ghcr.io/nvidia/nemoclaw/langchain-deepagents-code-sandbox","digest":"sha256:d71529567c0ff7398a1ae2fd96c4cb9b1118253edd31cb759255c9c1428e50b1","reference":"ghcr.io/nvidia/nemoclaw/langchain-deepagents-code-sandbox@sha256:d71529567c0ff7398a1ae2fd96c4cb9b1118253edd31cb759255c9c1428e50b1","source":{"repository":"NVIDIA/NemoClaw","revision":"376c7c09092dffd3ee7ee698e506dba1ae81e6fa","release":"v0.0.119-35-g376c7c090","cohort":"ghrun-33803755678-1"},"startupProfileContractVersion":1,"capabilityContractVersion":1}}'

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Messaging providers
            runner: ubuntu-latest
            timeout: 90
            test: test/e2e/live/messaging-providers.test.ts
            selector: ""
            image: openclaw
            old_base: ""
            swap: false
            install_openshell: false
            mcp: false
            settings: '{"NEMOCLAW_E2E_USE_HOSTED_INFERENCE":"1","NEMOCLAW_NON_INTERACTIVE":"1","NEMOCLAW_ACCEPT_THIRD_PARTY_SOFTWARE":"1","OPENSHELL_GATEWAY":"nemoclaw"}'

          - name: MCP bridge Hermes
            runner: ubuntu-latest
            timeout: 90
            test: test/e2e/live/mcp-bridge.test.ts
            selector: ^mcp-bridge-hermes$
            image: hermes
            old_base: ""
            swap: true
            install_openshell: false
            mcp: true
            settings: '{"NEMOCLAW_MCP_BRIDGE_AGENT":"hermes"}'

          - name: Hermes E2E
            runner: ubuntu-latest
            timeout: 85
            test: test/e2e/live/hermes-e2e.test.ts
            selector: ""
            image: hermes
            old_base: ""
            swap: true
            install_openshell: false
            mcp: false
            settings: '{"NEMOCLAW_E2E_INFERENCE_MODE":"mock","NEMOCLAW_E2E_HERMES_DASHBOARD":"1","NEMOCLAW_ACCEPT_THIRD_PARTY_SOFTWARE":"1","NEMOCLAW_AGENT":"hermes","NEMOCLAW_NON_INTERACTIVE":"1","NEMOCLAW_RECREATE_SANDBOX":"1","NEMOCLAW_SANDBOX_NAME":"e2e-hermes","NEMOCLAW_ONBOARD_VALIDATION_TIMEOUT_SECONDS":"60"}'

          - name: Hermes security posture
            runner: ubuntu-latest
            timeout: 75
            test: test/e2e/live/hermes-e2e.test.ts
            selector: ""
            image: hermes
            old_base: ""
            swap: true
            install_openshell: true
            mcp: false
            settings: '{"NEMOCLAW_E2E_USE_HOSTED_INFERENCE":"1","NEMOCLAW_NON_INTERACTIVE":"1","NEMOCLAW_ACCEPT_THIRD_PARTY_SOFTWARE":"1","NEMOCLAW_AGENT":"hermes","NEMOCLAW_E2E_EXPECT_OPENSHELL_SPLIT_PROCESS":"1","NEMOCLAW_E2E_EXPECT_NON_ROOT_HOST":"1","NEMOCLAW_E2E_SECURITY_POSTURE":"1","NEMOCLAW_ONBOARD_VALIDATION_TIMEOUT_SECONDS":"60","NEMOCLAW_RECREATE_SANDBOX":"1","NEMOCLAW_SANDBOX_NAME":"e2e-hm-security","OPENSHELL_GATEWAY":"nemoclaw"}'

          - name: Upgrade v0.0.55 x86-64
            runner: ubuntu-latest
            timeout: 70
            test: test/e2e/live/openshell-gateway-upgrade.test.ts
            selector: ""
            image: openclaw
            old_base: ghcr.io/nvidia/nemoclaw/sandbox-base@sha256:10433a8cd2f2b809dd0fdf983514679e04c0f8aa1ff5bbff675029046033b108
            swap: false
            install_openshell: false
            mcp: false
            settings: '{"NEMOCLAW_NON_INTERACTIVE":"1","NEMOCLAW_ACCEPT_THIRD_PARTY_SOFTWARE":"1","NEMOCLAW_GATEWAY_UPGRADE_SURVIVOR_NAME":"e2e-gw-survivor","NEMOCLAW_OLD_NEMOCLAW_REF":"v0.0.55","NEMOCLAW_OLD_NEMOCLAW_COMMIT":"95d483fe2b6569d68e59493c60f19df09a068e8f","NEMOCLAW_OLD_INSTALLER_SHA256":"ff8cf448e4d17b00421545a1f333262b615b1b0aa236d0cc5aeaf4e2cae2d897","NEMOCLAW_OLD_SANDBOX_BASE_IMAGE_REF":"ghcr.io/nvidia/nemoclaw/sandbox-base@sha256:10433a8cd2f2b809dd0fdf983514679e04c0f8aa1ff5bbff675029046033b108","NEMOCLAW_OLD_OPENSHELL_VERSION":"0.0.44","NEMOCLAW_OLD_OPENCLAW_VERSION":"2026.5.22","OPENSHELL_GATEWAY":"nemoclaw"}'

          - name: Upgrade v0.0.55 ARM64
            runner: ubuntu-24.04-arm
            timeout: 70
            test: test/e2e/live/openshell-gateway-upgrade.test.ts
            selector: ""
            image: openclaw
            old_base: ghcr.io/nvidia/nemoclaw/sandbox-base@sha256:10433a8cd2f2b809dd0fdf983514679e04c0f8aa1ff5bbff675029046033b108
            swap: false
            install_openshell: false
            mcp: false
            settings: '{"NEMOCLAW_NON_INTERACTIVE":"1","NEMOCLAW_ACCEPT_THIRD_PARTY_SOFTWARE":"1","NEMOCLAW_GATEWAY_UPGRADE_SURVIVOR_NAME":"e2e-gw-survivor","NEMOCLAW_OLD_NEMOCLAW_REF":"v0.0.55","NEMOCLAW_OLD_NEMOCLAW_COMMIT":"95d483fe2b6569d68e59493c60f19df09a068e8f","NEMOCLAW_OLD_INSTALLER_SHA256":"ff8cf448e4d17b00421545a1f333262b615b1b0aa236d0cc5aeaf4e2cae2d897","NEMOCLAW_OLD_SANDBOX_BASE_IMAGE_REF":"ghcr.io/nvidia/nemoclaw/sandbox-base@sha256:10433a8cd2f2b809dd0fdf983514679e04c0f8aa1ff5bbff675029046033b108","NEMOCLAW_OLD_OPENSHELL_VERSION":"0.0.44","NEMOCLAW_OLD_OPENCLAW_VERSION":"2026.5.22","OPENSHELL_GATEWAY":"nemoclaw"}'

          - name: Upgrade v0.0.74 x86-64
            runner: ubuntu-latest
            timeout: 70
            test: test/e2e/live/openshell-gateway-upgrade.test.ts
            selector: ""
            image: openclaw
            old_base: ghcr.io/nvidia/nemoclaw/sandbox-base@sha256:104151ffadc2ff0b6c815e3c95c2783ced61aee0d0f83fc327cc02be9b7e14e6
            swap: false
            install_openshell: false
            mcp: false
            settings: '{"NEMOCLAW_NON_INTERACTIVE":"1","NEMOCLAW_ACCEPT_THIRD_PARTY_SOFTWARE":"1","NEMOCLAW_GATEWAY_UPGRADE_SURVIVOR_NAME":"e2e-gw-survivor","NEMOCLAW_OLD_NEMOCLAW_REF":"v0.0.74","NEMOCLAW_OLD_NEMOCLAW_COMMIT":"3a05b54e8ec3e1d5550ec5c728de54af872bffe3","NEMOCLAW_OLD_INSTALLER_SHA256":"a0cd3feca488d247e53d59d7d8246d2b86e75e95acb5e7d78504b3c0c60fd7db","NEMOCLAW_OLD_SANDBOX_BASE_IMAGE_REF":"ghcr.io/nvidia/nemoclaw/sandbox-base@sha256:104151ffadc2ff0b6c815e3c95c2783ced61aee0d0f83fc327cc02be9b7e14e6","NEMOCLAW_OLD_OPENSHELL_VERSION":"0.0.72","NEMOCLAW_OLD_OPENCLAW_VERSION":"2026.5.27","OPENSHELL_GATEWAY":"nemoclaw"}'

          - name: Upgrade v0.0.89 x86-64
            runner: ubuntu-latest
            timeout: 70
            test: test/e2e/live/openshell-gateway-upgrade.test.ts
            selector: ""
            image: openclaw
            old_base: ghcr.io/nvidia/nemoclaw/sandbox-base@sha256:3265d482f67c9d81ee3a59b0bbad5eb5ea6c705fea81ece8ae888ed12794f7f1
            swap: false
            install_openshell: false
            mcp: false
            settings: '{"NEMOCLAW_NON_INTERACTIVE":"1","NEMOCLAW_ACCEPT_THIRD_PARTY_SOFTWARE":"1","NEMOCLAW_GATEWAY_UPGRADE_SURVIVOR_NAME":"e2e-gw-survivor","NEMOCLAW_OLD_NEMOCLAW_REF":"v0.0.89","NEMOCLAW_OLD_NEMOCLAW_COMMIT":"1143aa5cce77f3bad1b3b5588bd7fddbe438237e","NEMOCLAW_OLD_INSTALLER_SHA256":"00f24959e5ca68104fe91221c0a015dab6a4154618497fa36b969b661f418cc2","NEMOCLAW_OLD_SANDBOX_BASE_IMAGE_REF":"ghcr.io/nvidia/nemoclaw/sandbox-base@sha256:3265d482f67c9d81ee3a59b0bbad5eb5ea6c705fea81ece8ae888ed12794f7f1","NEMOCLAW_OLD_OPENSHELL_VERSION":"0.0.85","NEMOCLAW_OLD_OPENCLAW_VERSION":"2026.6.10","NEMOCLAW_CURRENT_OPENCLAW_VERSION":"2026.7.1","NEMOCLAW_OPENCLAW_STATE_UPGRADE_PROOF":"1","OPENSHELL_GATEWAY":"nemoclaw"}'

          - name: Shields retirement upgrade
            runner: ubuntu-latest
            timeout: 120
            test: test/e2e/live/shields-retirement-upgrade.test.ts
            selector: ""
            image: openclaw
            old_base: ""
            swap: false
            install_openshell: false
            mcp: false
            settings: '{"NEMOCLAW_NON_INTERACTIVE":"1","NEMOCLAW_ACCEPT_THIRD_PARTY_SOFTWARE":"1","NEMOCLAW_AGENT":"openclaw","NEMOCLAW_OLD_NEMOCLAW_REF":"v0.0.115","NEMOCLAW_OLD_NEMOCLAW_TAG_OBJECT":"7503e700808655df1303ddc51888bb596c9afa34","NEMOCLAW_OLD_NEMOCLAW_COMMIT":"324a886fd05b01f6756bae0371ea503c651fbd11","NEMOCLAW_OLD_INSTALLER_SHA256":"0ed77ba8cf176641bd3b22cfd89b4977b3d9a6f47b76da8b03bf4091a20d1251","NEMOCLAW_OLD_OPENSHELL_VERSION":"0.0.106","NEMOCLAW_OLD_OPENCLAW_VERSION":"2026.7.1","NEMOCLAW_SANDBOX_NAME":"e2e-retire-lock","OPENSHELL_GATEWAY":"nemoclaw"}'
    env:
      NEMOCLAW_CLI_BIN: ${{ github.workspace }}/bin/nemoclaw.js
      NEMOCLAW_E2E_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      NEMOCLAW_GATEWAY_RUNTIME: docker
      NEMOCLAW_OPENSHELL_CHANNEL: stable
      NEMOCLAW_RUN_LIVE_E2E: "1"
      OPENSHELL_DOCKER_SUPERVISOR_IMAGE: ghcr.io/nvidia/openshell/supervisor@sha256:722f44669722961b7f432b0b81de25b91a58f34a61d6403bef967acaf2b3af01
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NVIDIA/NemoClaw
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: NVIDIA/NemoClaw/.github/actions/docker-auth-setup@05fa6b810017752ab21148cb7e9d82d12a88c92f
        with:
          auth-required: "1"
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: NVIDIA/NemoClaw/.github/actions/prepare-e2e@f6304bc25fc35bfaa441c8c2fbfee38f72805a75

      - name: Pull exact images
        shell: bash
        run: |
          if [[ "${{ matrix.image }}" == "hermes" ]]; then docker pull "$HERMES_IMAGE"; else docker pull "$OPENCLAW_IMAGE"; fi
          if [[ -n "${{ matrix.old_base }}" ]]; then docker pull "${{ matrix.old_base }}"; fi

      - name: Add swap
        if: ${{ matrix.swap }}
        run: |
          sudo fallocate -l 32G /mnt/nemoclaw-e2e.swap
          sudo chmod 0600 /mnt/nemoclaw-e2e.swap
          sudo mkswap /mnt/nemoclaw-e2e.swap
          sudo swapon /mnt/nemoclaw-e2e.swap

      - name: Install OpenShell
        if: ${{ matrix.install_openshell }}
        run: env -u DOCKER_CONFIG -u DOCKERHUB_USERNAME -u DOCKERHUB_TOKEN -u NVIDIA_API_KEY -u NVIDIA_INFERENCE_API_KEY -u GITHUB_TOKEN bash scripts/install-openshell.sh

      - name: Install MCP prerequisites
        if: ${{ matrix.mcp }}
        env:
          CLOUDFLARED_VERSION: "2026.6.1"
          CLOUDFLARED_DEB_SHA256: ccd02ec216c62bfa573395d8f72cb2e91e95cbdf8726a8acc06b3e2d9aa31526
        run: |
          curl -fL "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64.deb" -o /tmp/cloudflared.deb
          printf '%s  %s\n' "$CLOUDFLARED_DEB_SHA256" /tmp/cloudflared.deb | sha256sum -c -
          sudo dpkg -i /tmp/cloudflared.deb
          bash test/e2e/setup-mcp-test-tls.sh

      - name: Run test
        env:
          TEST_SETTINGS: ${{ matrix.settings }}
          DISCORD_BOT_TOKEN_REAL: ${{ secrets.DISCORD_BOT_TOKEN_REAL }}
          DISCORD_CHANNEL_ID_E2E: ${{ secrets.DISCORD_CHANNEL_ID_E2E }}
          GITHUB_TOKEN: ${{ github.token }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_INFERENCE_API_KEY: ${{ secrets.NVIDIA_INFERENCE_API_KEY }}
          SLACK_APP_TOKEN_REAL: ${{ secrets.SLACK_APP_TOKEN_REAL }}
          SLACK_BOT_TOKEN_REAL: ${{ secrets.SLACK_BOT_TOKEN_REAL }}
          SLACK_CHANNEL_ID_E2E: ${{ secrets.SLACK_CHANNEL_ID_E2E }}
          TELEGRAM_ALLOWED_IDS: ${{ secrets.TELEGRAM_ALLOWED_IDS }}
          TELEGRAM_AUTHORIZED_CHAT_IDS: ${{ secrets.TELEGRAM_AUTHORIZED_CHAT_IDS }}
          TELEGRAM_BOT_TOKEN_REAL: ${{ secrets.TELEGRAM_BOT_TOKEN_REAL }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_E2E: ${{ secrets.TELEGRAM_CHAT_ID_E2E }}
        shell: bash
        run: |
          export NEMOCLAW_E2E_MANAGED_IMAGE_CATALOG_JSON="$MANAGED_IMAGE_CATALOG"
          while IFS=$'\t' read -r key value; do export "$key=$value"; done < <(jq -r 'to_entries[] | [.key, .value] | @tsv' <<<"$TEST_SETTINGS")
          args=(vitest run --project e2e-live "${{ matrix.test }}" --silent=false --reporter=default)
          if [[ -n "${{ matrix.selector }}" ]]; then args+=(-t "${{ matrix.selector }}"); fi
          npx "${args[@]}"
