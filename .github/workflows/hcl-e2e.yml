# The HCL E2E cases that need a model: hosted NVIDIA inference, or vLLM and
# Ollama on an NVIDIA GPU runner. CI / Bundle's Linux AMD64 platform calls it,
# passing the secrets, whenever the plan selects the live suites, and CI /
# Bundle reports it in the E2E check;
# it runs the GPU cases except on pull requests, which NVIDIA's GPU runners
# refuse. Dispatch it to run it alone.
name: Live / HCL

on:
  workflow_call:
    inputs:
      gpu:
        description: Also run the cases that need the NVIDIA GPU runner, which refuses pull request jobs.
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      gpu:
        description: Also run the cases that need the NVIDIA GPU runner.
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: "0"
  CANDIDATE: hcl-candidate-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  build:
    name: Build
    # The GPU runner and the inference secret exist only in this repository;
    # CI / Bundle does not call this workflow for a fork's pull request.
    if: github.repository == 'NVIDIA/NemoClaw'
    # Like Live / Brev, build against the older glibc so every lane runner can run the executables.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      TEST_PLATFORM: linux_amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          platform: linux_amd64
          cache-prefix: hcl-deps-v1
      - uses: ./.github/actions/containerd-store
      - name: Build the bundle, test executable, and agent images
        run: |
          cargo ci bundle
          executable=$(cargo test --locked -p nemoclaw-e2e --test e2e --no-run --message-format=json |
            jq -r 'select(.reason == "compiler-artifact" and .target.name == "e2e" and .profile.test) | .executable' | tail -1)
          mkdir candidate
          cp "$executable" candidate/e2e
          cp -a "dist/$TEST_PLATFORM" candidate/bundle
          cargo images build --platform linux/amd64 openclaw hermes
          docker save nc-fabric:openclaw nc-fabric:hermes -o candidate/agents.tar
          # Tar keeps the executable bits that artifact transfer drops.
          tar -cf "$RUNNER_TEMP/candidate.tar" candidate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.CANDIDATE }}
          path: ${{ runner.temp }}/candidate.tar
          retention-days: 1
          if-no-files-found: error

  # The cases to run: those on GitHub-hosted runners always, and those on the
  # NVIDIA GPU runner when the gpu input asks for them.
  cases:
    name: Select cases
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      include: ${{ steps.select.outputs.include }}
    steps:
      - id: select
        env:
          GPU: ${{ inputs.gpu }}
        run: |
          hosted='[
            {"case": "docker-openclaw-nvidia", "runner": "ubuntu-24.04", "secret": "NVIDIA_API_KEY"},
            {"case": "docker-openclaw-v0-parity", "runner": "ubuntu-24.04", "secret": "NVIDIA_API_KEY"},
            {"case": "docker-hermes-v0-parity", "runner": "ubuntu-24.04", "secret": "NVIDIA_API_KEY"}
          ]'
          # This NVIDIA GPU runner is already used by the main E2E workflow.
          gpu='[
            {"case": "docker-openclaw-vllm", "runner": "linux-amd64-gpu-rtxpro6000-latest-1", "secret": ""},
            {"case": "docker-openclaw-vllm-shared", "runner": "linux-amd64-gpu-rtxpro6000-latest-1", "secret": ""},
            {"case": "docker-openclaw-hermes-ollama", "runner": "linux-amd64-gpu-rtxpro6000-latest-1", "secret": "NVIDIA_API_KEY"}
          ]'
          if [ "$GPU" = true ]; then
            include=$(jq -cn --argjson hosted "$hosted" --argjson gpu "$gpu" '$hosted + $gpu')
          else
            include=$(jq -c . <<<"$hosted")
          fi
          echo "include=$include" >> "$GITHUB_OUTPUT"

  e2e:
    name: ${{ matrix.case }}
    needs: [build, cases]
    # Runs only when the build ran.
    if: needs.build.result == 'success' && needs.cases.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.cases.outputs.include) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # These cases use fixed gateway ports; finish cleanup before another run starts.
    concurrency:
      group: live-hcl-${{ matrix.case }}
      cancel-in-progress: false
    env:
      NEMOCLAW_HCL_CASE: ${{ matrix.case }}
      NEMOCLAW_TEST_BUNDLE: ${{ github.workspace }}/candidate/bundle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/containerd-store
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.CANDIDATE }}
          path: ${{ runner.temp }}
      - name: Load the images and bind the case to them
        run: |
          tar -xf "$RUNNER_TEMP/candidate.tar"
          docker load -i candidate/agents.tar
          # A case builds the model runtime image it serves.
          if [[ $NEMOCLAW_HCL_CASE == *vllm* ]]; then docker buildx bake vllm; fi
          if [[ $NEMOCLAW_HCL_CASE == *ollama* ]]; then docker buildx bake ollama; fi
          id() { docker image inspect --format '{{.Id}}' "$1" 2>/dev/null; }
          # Pin this run's images and give it a fresh deployment identity; plan rejects an unbound image.
          sed -i -e "s#nc-fabric@sha256:0\{64\}#nc-fabric@$(id nc-fabric:openclaw)#" \
            -e "s#nc-fabric-hermes@sha256:0\{64\}#nc-fabric@$(id nc-fabric:hermes)#" \
            -e "s#nc-prototype-vllm@sha256:0\{64\}#nc-prototype-vllm@$(id nc-prototype-vllm:rust-v1)#" \
            -e "s#nc-prototype-ollama@sha256:a\{64\}#nc-prototype-ollama@$(id nc-prototype-ollama:rust-v1)#" \
            -e "s#^  uid: .*#  uid: $(cat /proc/sys/kernel/random/uuid)#" \
            "crates/nemoclaw-e2e/cases/$NEMOCLAW_HCL_CASE.yaml"
      - name: Run the scenario
        working-directory: crates/nemoclaw-e2e
        env:
          NEMOCLAW_HCL_RUN: ${{ runner.temp }}/hcl
          # Only the hosted case receives the inference credential.
          NVIDIA_INFERENCE_API_KEY: ${{ secrets[matrix.secret] }}
        run: '"$GITHUB_WORKSPACE/candidate/e2e" hcl_live::case --exact --ignored --nocapture'
      # A cancelled or timed-out job still runs this step; the test's process does not survive.
      - name: Destroy
        if: always()
        run: |
          state="$RUNNER_TEMP/hcl/deployment"
          [[ -d $state ]] || exit 0
          candidate/bundle/bin/nemoclaw destroy --output json --progress off --state-dir "$state" \
            > "$RUNNER_TEMP/hcl/reports/destroy.json"
      # Reports hold outcomes only; requests, replies, state, and credentials stay on the runner.
      - name: Upload observations and cleanup receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hcl-e2e-${{ matrix.case }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hcl/reports/*.json
          if-no-files-found: ignore
          retention-days: 7
