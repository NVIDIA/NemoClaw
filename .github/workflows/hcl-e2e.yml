# The HCL E2E cases that need a model, from a candidate this workflow builds:
# hosted NVIDIA inference, or vLLM and Ollama on an NVIDIA GPU runner. CI /
# Bundle's Linux AMD64 platform runs the hosted cases from its own artifacts
# instead, and calls this workflow for the GPU cases on v1 pushes and manual
# runs, which NVIDIA's GPU runners accept. Dispatch it to run either set alone.
name: Live / HCL

on:
  workflow_call:
    inputs:
      hosted:
        description: Run the cases that use NVIDIA hosted inference on GitHub-hosted runners.
        type: boolean
        default: true
      gpu:
        description: Run the cases that need the NVIDIA GPU runner, which refuses pull request jobs.
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      hosted:
        description: Run the cases that use NVIDIA hosted inference.
        type: boolean
        default: true
      gpu:
        description: Run the cases that need the NVIDIA GPU runner.
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: "0"
  CANDIDATE: hcl-candidate-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  build:
    name: Build
    # The GPU runner and the inference secret exist only in this repository;
    # CI / Bundle does not call this workflow for a fork's pull request.
    if: github.repository == 'NVIDIA/NemoClaw' && (inputs.hosted || inputs.gpu)
    # Like Live / Brev, build against the older glibc so every lane runner can run the executables.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      TEST_PLATFORM: linux_amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          platform: linux_amd64
          cache-prefix: hcl-deps-v1
      - uses: ./.github/actions/containerd-store
      - name: Build the bundle, test executable, and agent images
        run: |
          cargo ci bundle
          executable=$(cargo test --locked -p nemoclaw-e2e --test e2e --no-run --message-format=json |
            jq -r 'select(.reason == "compiler-artifact" and .target.name == "e2e" and .profile.test) | .executable' | tail -1)
          mkdir candidate
          cp "$executable" candidate/e2e
          cp -a "dist/$TEST_PLATFORM" candidate/bundle
          cargo images build --platform linux/amd64 openclaw hermes
          docker save nc-fabric:openclaw nc-fabric:hermes -o candidate/agents.tar
          # Tar keeps the executable bits that artifact transfer drops.
          tar -cf "$RUNNER_TEMP/candidate.tar" candidate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.CANDIDATE }}
          path: ${{ runner.temp }}/candidate.tar
          retention-days: 1
          if-no-files-found: error

  # The cases the inputs select.
  cases:
    name: Select cases
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      include: ${{ steps.select.outputs.include }}
    steps:
      - id: select
        env:
          HOSTED: ${{ inputs.hosted }}
          GPU: ${{ inputs.gpu }}
        run: |
          hosted='[
            {"case": "docker-openclaw-nvidia", "runner": "ubuntu-24.04", "secret": "NVIDIA_API_KEY"},
            {"case": "docker-openclaw-v0-parity", "runner": "ubuntu-24.04", "secret": "NVIDIA_API_KEY"},
            {"case": "docker-hermes-v0-parity", "runner": "ubuntu-24.04", "secret": "NVIDIA_API_KEY"}
          ]'
          # This NVIDIA GPU runner is already used by the main E2E workflow.
          gpu='[
            {"case": "docker-openclaw-vllm", "runner": "linux-amd64-gpu-rtxpro6000-latest-1", "secret": ""},
            {"case": "docker-openclaw-vllm-shared", "runner": "linux-amd64-gpu-rtxpro6000-latest-1", "secret": ""},
            {"case": "docker-openclaw-hermes-ollama", "runner": "linux-amd64-gpu-rtxpro6000-latest-1", "secret": "NVIDIA_API_KEY"}
          ]'
          [ "$HOSTED" = true ] || hosted='[]'
          [ "$GPU" = true ] || gpu='[]'
          include=$(jq -cn --argjson hosted "$hosted" --argjson gpu "$gpu" '$hosted + $gpu')
          echo "include=$include" >> "$GITHUB_OUTPUT"

  e2e:
    name: ${{ matrix.case }}
    needs: [build, cases]
    # Runs only when the build ran and selected a case.
    if: needs.build.result == 'success' && needs.cases.outputs.include != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.cases.outputs.include) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # These cases use fixed gateway ports; finish cleanup before another run starts.
    concurrency:
      group: live-hcl-${{ matrix.case }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/hcl-case
        with:
          case: ${{ matrix.case }}
          # Only the cases that use hosted inference receive the credential.
          api-key: ${{ secrets[matrix.secret] }}
          candidate: ${{ env.CANDIDATE }}
