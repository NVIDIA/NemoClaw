# The HCL E2E cases that need a model, from a candidate this workflow builds on
# Ubuntu 22.04, whose older glibc the GPU runner may need. CI / Bundle calls it
# for the GPU cases on v1 pushes and manual runs; NVIDIA's GPU runners refuse
# pull request jobs. Linux AMD64's E2E jobs run the hosted cases on every run.
name: Live / HCL

on:
  workflow_call:
    inputs:
      hosted:
        description: Also run the cases that use NVIDIA hosted inference.
        type: boolean
        default: true
      cases:
        description: The validation plan's live HCL case selection, or empty to run every case.
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      hosted:
        description: Also run the cases that use NVIDIA hosted inference.
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: "0"
  CANDIDATE: hcl-candidate-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  build:
    name: Build
    # The GPU runner and the inference secret exist only in this repository.
    if: github.repository == 'NVIDIA/NemoClaw'
    # Like Live / Brev, build against the older glibc so every lane runner can run the executables.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    outputs:
      cases: ${{ steps.cases.outputs.cases }}
      matrix: ${{ steps.cases.outputs.matrix }}
      runtimes: ${{ steps.cases.outputs.runtimes }}
    env:
      TEST_PLATFORM: linux_amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          platform: linux_amd64
          cache-prefix: hcl-deps-v1
      - uses: ./.github/actions/containerd-store
      - name: Build the bundle, test executable, and agent images
        run: |
          cargo ci bundle
          executable=$(cargo test --locked -p nemoclaw-e2e --test e2e --no-run --message-format=json |
            jq -r 'select(.reason == "compiler-artifact" and .target.name == "e2e" and .profile.test) | .executable' | tail -1)
          mkdir candidate
          cp "$executable" candidate/e2e
          cp -a "dist/$TEST_PLATFORM" candidate/bundle
          cargo images build --platform linux/amd64 openclaw hermes
          docker save nc-fabric:openclaw nc-fabric:hermes -o candidate/agents.tar
          # Tar keeps the executable bits that artifact transfer drops.
          tar -cf "$RUNNER_TEMP/candidate.tar" candidate
      # Each case's documents say where it runs, whether it reads the NVIDIA
      # API key, and which model runtime images its job builds.
      - name: List the cases and their runtime images
        id: cases
        env:
          CASES: ${{ inputs.cases }}
          HOSTED: ${{ inputs.hosted }}
        run: |
          if [[ -z $CASES ]]; then
            CASES=$(cargo run --locked --quiet -p nemoclaw-build --no-default-features --target-dir target/ci-runner -- \
              changes cases --all | jq -c '{runners, nvidia_key}')
          fi
          {
            echo "cases=$CASES"
            echo "matrix=$(jq -c --argjson hosted "$HOSTED" '.runners.gpu + (if $hosted then .runners.hosted else [] end)' <<< "$CASES")"
            echo "runtimes=$(cargo images runtimes)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.CANDIDATE }}
          path: ${{ runner.temp }}/candidate.tar
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: ${{ matrix.case }}
    needs: build
    # Runs only when the build ran and selected a case.
    if: needs.build.result == 'success' && needs.build.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(needs.build.outputs.matrix) }}
    # The cases with model runtime images need this NVIDIA GPU runner, which the main E2E workflow also uses.
    runs-on: ${{ contains(fromJSON(needs.build.outputs.cases).runners.gpu, matrix.case) && 'linux-amd64-gpu-rtxpro6000-latest-1' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    # These cases use fixed gateway ports; finish cleanup before another run starts.
    concurrency:
      group: live-hcl-${{ matrix.case }}
      cancel-in-progress: false
    env:
      NEMOCLAW_HCL_CASE: ${{ matrix.case }}
      NEMOCLAW_TEST_BUNDLE: ${{ github.workspace }}/candidate/bundle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/containerd-store
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.CANDIDATE }}
          path: ${{ runner.temp }}
      - name: Load the images and bind the case to them
        env:
          RUNTIMES: ${{ join(fromJSON(needs.build.outputs.runtimes)[matrix.case], ' ') }}
        run: |
          tar -xf "$RUNNER_TEMP/candidate.tar"
          docker load -i candidate/agents.tar
          # A case builds the model runtime images its services run.
          read -ra runtimes <<< "$RUNTIMES"
          if (( ${#runtimes[@]} )); then docker buildx bake "${runtimes[@]}"; fi
          id() { docker image inspect --format '{{.Id}}' "$1" 2>/dev/null; }
          # Pin this run's images and give it a fresh deployment identity; plan rejects an unbound image.
          sed -i -e "s#nc-fabric@sha256:0\{64\}#nc-fabric@$(id nc-fabric:openclaw)#" \
            -e "s#nc-fabric-hermes@sha256:0\{64\}#nc-fabric@$(id nc-fabric:hermes)#" \
            -e "s#nc-prototype-vllm@sha256:0\{64\}#nc-prototype-vllm@$(id nc-prototype-vllm:rust-v1)#" \
            -e "s#nc-prototype-ollama@sha256:a\{64\}#nc-prototype-ollama@$(id nc-prototype-ollama:rust-v1)#" \
            -e "s#^  uid: .*#  uid: $(cat /proc/sys/kernel/random/uuid)#" \
            "crates/nemoclaw-e2e/cases/$NEMOCLAW_HCL_CASE.yaml"
      - name: Run the scenario
        working-directory: crates/nemoclaw-e2e
        env:
          NEMOCLAW_HCL_RUN: ${{ runner.temp }}/hcl
          # Only the cases that read the key receive it.
          NVIDIA_INFERENCE_API_KEY: ${{ contains(fromJSON(needs.build.outputs.cases).nvidia_key, matrix.case) && secrets.NVIDIA_API_KEY || '' }}
        run: '"$GITHUB_WORKSPACE/candidate/e2e" hcl_live::case --exact --ignored --nocapture'
      # A cancelled or timed-out job still runs this step; the test's process does not survive.
      - name: Destroy
        if: always()
        run: |
          state="$RUNNER_TEMP/hcl/deployment"
          [[ -d $state ]] || exit 0
          candidate/bundle/bin/nemoclaw destroy --output json --progress off --state-dir "$state" \
            > "$RUNNER_TEMP/hcl/reports/destroy.json"
      # Reports hold outcomes only; requests, replies, state, and credentials stay on the runner.
      - name: Upload observations and cleanup receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hcl-e2e-${{ matrix.case }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hcl/reports/*.json
          if-no-files-found: ignore
          retention-days: 7
