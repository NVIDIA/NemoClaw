# The HCL E2E cases that need a model. CI / Bundle calls it from Linux AMD64's
# E2E jobs for the GPU cases on v1 pushes and manual runs, with that platform's
# test archive, bundle, and live images; NVIDIA's GPU runners refuse pull
# request jobs. CI / Bundle builds those on Ubuntu 22.04, whose glibc the GPU
# runner can run. A dispatch has no such artifacts, so it builds a candidate
# of its own there. Linux AMD64's E2E jobs run the selected hosted cases
# themselves, except on a fork's pull request.
name: Live / HCL

on:
  workflow_call:
    inputs:
      target:
        description: RTX PRO 6000 by default. Station requires a manual dispatch; Spark is not qualified yet.
        type: string
        default: rtx-pro-6000
      hosted:
        description: Also run the cases that use NVIDIA hosted inference.
        type: boolean
        default: true
      cases:
        description: The validation plan's live HCL case selection, or empty to run every case.
        type: string
        default: ""
      tests:
        description: >-
          Name prefix of CI / Bundle's Linux AMD64 test artifacts; the jobs download
          PREFIX-inputs and PREFIX-live. Empty builds a candidate here instead.
        type: string
        default: ""
      bundle:
        description: CI / Bundle's Linux AMD64 bundle artifact; required with tests.
        type: string
        default: ""
      live-images:
        description: CI / Bundle's Linux AMD64 live images artifact, when it built them.
        type: string
        default: ""
      live-images-commit:
        description: A v1 commit whose pushed images to pull instead of the live images artifact.
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      target:
        description: Hardware target; Station requires a prepared Colossus runner.
        type: choice
        options: [rtx-pro-6000, dgx-station]
        default: rtx-pro-6000
      hosted:
        description: Also run the cases that use NVIDIA hosted inference.
        type: boolean
        default: true

# The case jobs pull a v1 commit's pushed images when CI / Bundle names one.
permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: "0"
  TARGET: ${{ inputs.target || 'rtx-pro-6000' }}
  TEST_PLATFORM: linux_amd64
  CANDIDATE: hcl-candidate-${{ github.run_id }}-${{ github.run_attempt }}
  SOURCES: hcl-image-sources-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  # Each case's documents say where it runs, whether it reads the NVIDIA API
  # key, and which model runtime images its job builds. This job lists them
  # and fetches those images' pinned sources, which the case jobs' Bake reads.
  cases:
    name: Cases
    # The GPU runner and the inference secret exist only in this repository.
    if: github.repository == 'NVIDIA/NemoClaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      runner: ${{ steps.target.outputs.runner }}
      platform: ${{ steps.target.outputs.platform }}
      cases: ${{ steps.cases.outputs.cases }}
      matrix: ${{ steps.cases.outputs.matrix }}
      runtimes: ${{ steps.cases.outputs.runtimes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select target
        id: target
        env:
          TESTS: ${{ inputs.tests }}
        run: |
          case "$TARGET" in
            rtx-pro-6000) runner=linux-amd64-gpu-rtxpro6000-latest-1 platform=linux_amd64 ;;
            dgx-station)
              [[ -z $TESTS && $GITHUB_EVENT_NAME == workflow_dispatch ]] || exit 1
              runner=colossus-gb300-pilot platform=linux_arm64 ;;
            dgx-spark) echo 'DGX Spark is not qualified yet.' >&2; exit 1 ;;
            *) echo "Unknown target: $TARGET" >&2; exit 1 ;;
          esac
          printf 'runner=%s\nplatform=%s\n' "$runner" "$platform" >> "$GITHUB_OUTPUT"
      # CI / Bundle's build tool, so that this job compiles nothing.
      - if: inputs.tests != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.tests }}-inputs
          path: .build/ci
      # The image builds' pinned sources, as CI / Images saved them.
      - name: Restore the verified image sources
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/downloads
          key: image-sources-v1-${{ hashFiles('versions.json') }}
      - name: List the cases and fetch their runtime images' sources
        id: cases
        env:
          CASES: ${{ inputs.cases }}
          HOSTED: ${{ inputs.hosted }}
          TESTS: ${{ inputs.tests }}
        run: |
          if [[ -n $TESTS ]]; then
            tar -xf .build/ci/lifecycle-inputs.tar .build/ci/nemoclaw-build
            tool=.build/ci/nemoclaw-build
          else
            cargo build --locked --quiet -p nemoclaw-build --no-default-features --target-dir target/ci-runner
            tool=target/ci-runner/debug/nemoclaw-build
          fi
          if [[ -z $CASES ]]; then
            CASES=$("$tool" changes cases --all | jq -c '{runners, nvidia_key}')
          fi
          runtimes=$("$tool" images runtimes)
          if [[ $TARGET == dgx-station ]]; then
            # Manual case inputs; they are absent from automatic case discovery.
            CASES='{"runners":{"gpu":["dgx-station-openclaw-nemotron"]},"nvidia_key":[]}'
            runtimes='{"dgx-station-openclaw-nemotron":["vllm"]}'
          fi
          {
            echo "cases=$CASES"
            echo "matrix=$(jq -c --argjson hosted "$HOSTED" '.runners.gpu + (if $hosted then .runners.hosted else [] end)' <<< "$CASES")"
            echo "runtimes=$runtimes"
          } >> "$GITHUB_OUTPUT"
          "$tool" images fetch
          # Only the Ollama image has sources; vllm has none. Tar keeps the
          # mode and time that images fetch gave them, which the image's layers
          # retain and artifact transfer drops.
          tar -cf "$RUNNER_TEMP/image-sources.tar" .build/image-sources/ollama
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.SOURCES }}
          path: ${{ runner.temp }}/image-sources.tar
          retention-days: 1
          if-no-files-found: error

  # A run without CI / Bundle's artifacts, such as a dispatch, builds a
  # candidate here, which unpacks where those artifacts would.
  build:
    name: Build
    needs: cases
    if: github.repository == 'NVIDIA/NemoClaw' && needs.cases.result == 'success' && inputs.tests == ''
    # Like CI / Bundle, build against Ubuntu 22.04's glibc, which every case's runner can run.
    runs-on: ${{ needs.cases.outputs.platform == 'linux_arm64' && needs.cases.outputs.runner || 'ubuntu-22.04' }}
    timeout-minutes: 45
    env:
      TEST_PLATFORM: ${{ needs.cases.outputs.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          platform: ${{ needs.cases.outputs.platform }}
          cache-prefix: hcl-deps-v1
          save-cache: ${{ needs.cases.outputs.platform == 'linux_amd64' }}
      # The image builds' pinned sources, as CI / Images saved them.
      - name: Restore the verified image sources
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/downloads
          key: image-sources-v1-${{ hashFiles('versions.json') }}
      - if: needs.cases.outputs.platform == 'linux_amd64'
        uses: ./.github/actions/containerd-store
      - name: Build the bundle, test executable, and agent images
        run: |
          if [[ $TARGET == dgx-station ]]; then
            test "$(uname -m)" = aarch64
            . /etc/os-release
            test "$ID:$VERSION_ID" = ubuntu:24.04
            nvidia-smi --query-gpu=name --format=csv,noheader | grep -q GB300
            docker info --format '{{json .DriverStatus}}' | grep -q io.containerd.snapshotter.v1
          fi
          cargo ci bundle
          executable=$(cargo test --locked -p nemoclaw-e2e --test e2e --no-run --message-format=json |
            jq -r 'select(.reason == "compiler-artifact" and .target.name == "e2e" and .profile.test) | .executable' | tail -1)
          mkdir -p .build
          cp "$executable" .build/e2e
          cargo images build --platform "linux/${TEST_PLATFORM#linux_}" openclaw hermes
          docker save nc-fabric:openclaw nc-fabric:hermes -o .build/agents.tar
          # Tar keeps the executable bits that artifact transfer drops.
          tar -cf "$RUNNER_TEMP/candidate.tar" "dist/$TEST_PLATFORM" .build/e2e .build/agents.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.CANDIDATE }}
          path: ${{ runner.temp }}/candidate.tar
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: ${{ matrix.case }}
    needs: [cases, build]
    # Runs when the cases job selected a case, from CI / Bundle's artifacts or
    # this run's build.
    if: >-
      ${{ !cancelled() && needs.cases.result == 'success' && needs.cases.outputs.matrix != '[]' &&
      (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.tests != '')) }}
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(needs.cases.outputs.matrix) }}
    # The cases with model runtime images need this NVIDIA GPU runner, which the main E2E workflow also uses.
    runs-on: ${{ contains(fromJSON(needs.cases.outputs.cases).runners.gpu, matrix.case) && needs.cases.outputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 60
    # These cases use fixed gateway ports; finish cleanup before another run starts.
    concurrency:
      group: live-hcl-${{ matrix.case }}
      cancel-in-progress: false
    env:
      TEST_PLATFORM: ${{ needs.cases.outputs.platform }}
      NEMOCLAW_HCL_CASE: ${{ matrix.case }}
      NEMOCLAW_TEST_BUNDLE: ${{ github.workspace }}/dist/${{ needs.cases.outputs.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.cases.outputs.platform == 'linux_amd64'
        uses: ./.github/actions/containerd-store
      - if: inputs.tests == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.CANDIDATE }}
          path: ${{ runner.temp }}
      - if: inputs.tests != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.tests }}-live
          path: .build/ci
      - if: inputs.tests != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.bundle }}
          path: .build/ci
      - if: inputs.tests != '' && inputs.live-images-commit == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.live-images }}
          path: .build/ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.SOURCES }}
          path: ${{ runner.temp }}
      - name: Load the images and bind the case to them
        env:
          TESTS: ${{ inputs.tests }}
          COMMIT: ${{ inputs.live-images-commit }}
          PULL_TOKEN: ${{ github.token }}
          RUNTIMES: ${{ join(fromJSON(needs.cases.outputs.runtimes)[matrix.case], ' ') }}
        run: |
          if [[ -z $TESTS ]]; then
            tar -xf "$RUNNER_TEMP/candidate.tar"
            docker load -i .build/agents.tar
          else
            # As the E2E platform workflow's hosted HCL jobs load them.
            tar -xf .build/ci/bundle.tar
            mkdir -p .build/hcl
            zstd -d -c -q .build/ci/live.tar.zst | tar -x -C .build/hcl
            find .build/hcl -type f -perm -u+x -path '*/deps/e2e-*' -exec ln -s "$PWD/{}" .build/e2e ';'
            # A case names its images nc-fabric@DIGEST, which Docker resolves
            # only in the repository that holds the image.
            if [[ -n $COMMIT ]]; then
              printf '%s\n' "$PULL_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
              for name in openclaw hermes; do
                docker pull --quiet "ghcr.io/nvidia/nemoclaw/v1-ci:$name-$COMMIT-${TEST_PLATFORM#linux_}"
                docker tag "ghcr.io/nvidia/nemoclaw/v1-ci:$name-$COMMIT-${TEST_PLATFORM#linux_}" "nc-fabric:$name"
              done
              docker logout ghcr.io
            else
              zstd -d -c -q .build/ci/live-images.tar.zst | docker load
              for name in openclaw hermes; do docker tag "nc-live-images:$name" "nc-fabric:$name"; done
            fi
          fi
          # A case builds the model runtime images its services run, from the
          # sources the cases job fetched.
          tar -xf "$RUNNER_TEMP/image-sources.tar"
          read -ra runtimes <<< "$RUNTIMES"
          NEMOCLAW_HCL_RUN="$RUNNER_TEMP/hcl"
          bake_args=()
          bindings=()
          document="crates/nemoclaw-e2e/cases/$NEMOCLAW_HCL_CASE.yaml"
          if [[ $TARGET == dgx-station ]]; then
            umask 077
            NEMOCLAW_HCL_RUN="$HOME/.local/state/nemoclaw-ci/hcl/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            test ! -e "$NEMOCLAW_HCL_RUN"
            mkdir -p "$NEMOCLAW_HCL_RUN"
            document="$NEMOCLAW_HCL_RUN/case.yaml"
            cp examples/gtc-dc/openclaw-dgx-station.yaml "$document"
            # Case-specific inputs; the shared binding below also pins images and UID.
            bindings+=(
              -e 's#nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4#nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4#'
              -e 's#ff433f5493e25d631c9f12b5d55c674229923d02#da5b2650a835292c678994a1fa3fb653250fb508#'
              -e 's#nemotron-3-super#nemotron-3.5-super-vl#g'
            )
            bake_args+=(--set vllm.args.VLLM_IMAGE=vllm/vllm-openai@sha256:0d69205f3227e47b750b05789f117abbd929b67eccc46060e0d22ce4021c0318)
            cp -a "$NEMOCLAW_TEST_BUNDLE" "$NEMOCLAW_HCL_RUN/bundle"
            cp -L .build/e2e "$NEMOCLAW_HCL_RUN/e2e"
            {
              echo "NEMOCLAW_TEST_BUNDLE=$NEMOCLAW_HCL_RUN/bundle"
              echo "NEMOCLAW_HCL_TEST_DIRECTORY=manual"
              echo "NEMOCLAW_HCL_PERSISTENT=true"
            } >> "$GITHUB_ENV"
          fi
          if (( ${#runtimes[@]} )); then (umask 022; docker buildx bake "${runtimes[@]}" "${bake_args[@]}"); fi
          docker image inspect nc-fabric:openclaw nc-fabric:hermes > /dev/null
          for runtime in "${runtimes[@]}"; do docker image inspect "nc-prototype-$runtime:rust-v1" > /dev/null; done
          id() { docker image inspect --format '{{.Id}}' "$1" 2>/dev/null; }
          # Pin this run's images and give it a fresh deployment identity; plan rejects an unbound image.
          sed -i "${bindings[@]}" -e "s#nc-fabric@sha256:0\{64\}#nc-fabric@$(id nc-fabric:openclaw)#" \
            -e "s#nc-fabric-hermes@sha256:0\{64\}#nc-fabric@$(id nc-fabric:hermes)#" \
            -e "s#nc-prototype-vllm@sha256:0\{64\}#nc-prototype-vllm@$(id nc-prototype-vllm:rust-v1)#" \
            -e "s#nc-prototype-ollama@sha256:a\{64\}#nc-prototype-ollama@$(id nc-prototype-ollama:rust-v1)#" \
            -e "s#^  uid: .*#  uid: $(cat /proc/sys/kernel/random/uuid)#" \
            "$document"
          {
            echo "NEMOCLAW_HCL_RUN=$NEMOCLAW_HCL_RUN"
            echo "NEMOCLAW_HCL_DOCUMENT=$(realpath "$document")"
          } >> "$GITHUB_ENV"
      - name: Run the scenario
        working-directory: crates/nemoclaw-e2e
        env:
          # Only the cases that read the key receive it.
          NVIDIA_INFERENCE_API_KEY: ${{ contains(fromJSON(needs.cases.outputs.cases).nvidia_key, matrix.case) && secrets.NVIDIA_API_KEY || '' }}
        run: '"$GITHUB_WORKSPACE/.build/e2e" hcl_live::case --exact --ignored --nocapture'
      # A cancelled or timed-out job still runs this step; the test's process does not survive.
      - name: Destroy
        if: always()
        run: |
          [[ -n ${NEMOCLAW_HCL_RUN:-} ]] || exit 0
          state="$NEMOCLAW_HCL_RUN/deployment"
          [[ -d $state ]] || exit 0
          destroyed=false
          if "$NEMOCLAW_TEST_BUNDLE/bin/nemoclaw" destroy --output json --progress off --state-dir "$state" \
            > "$NEMOCLAW_HCL_RUN/reports/destroy.json" &&
            jq -e '.outcome == "destroyed"' "$NEMOCLAW_HCL_RUN/reports/destroy.json"; then destroyed=true; fi
          executable="$GITHUB_WORKSPACE/.build/e2e"
          if [[ -x $NEMOCLAW_HCL_RUN/e2e ]]; then executable="$NEMOCLAW_HCL_RUN/e2e"; fi
          "$executable" hcl_live::docker_cleanup --exact --ignored --nocapture
          test "$destroyed" = true
      # Reports hold outcomes only; requests, replies, state, and credentials stay on the runner.
      - name: Upload observations and cleanup receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hcl-e2e-${{ matrix.case }}-${{ github.run_attempt }}
          path: ${{ env.NEMOCLAW_HCL_RUN }}/reports/*.json
          if-no-files-found: ignore
          retention-days: 7
