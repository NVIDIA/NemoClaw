# The HCL E2E cases that need a model. CI / Bundle calls it from a Linux
# platform's E2E jobs, with that platform's test archive, bundle, and live
# images: Linux AMD64's for the GPU cases on v1 pushes, manual runs, and
# copied pull request branches, since NVIDIA's GPU runners refuse pull request
# jobs, and Linux ARM64's for the DGX Station and Spark cases. CI / Bundle
# builds those on Ubuntu 22.04, whose glibc every case's runner can run, so
# this workflow compiles nothing. Linux AMD64's E2E jobs run the selected
# hosted cases themselves, except on a fork's pull request.
name: Live / HCL

on:
  workflow_call:
    inputs:
      target:
        description: RTX PRO 6000 by default, or the qualified Station. Spark requires a manual dispatch.
        type: string
        default: rtx-pro-6000
      hosted:
        description: Also run the cases that use NVIDIA hosted inference.
        type: boolean
        default: true
      cases:
        description: The validation plan's live HCL case selection, or empty to run every case.
        type: string
        default: ""
      tests:
        description: >-
          Name prefix of CI / Bundle's test artifacts for the target's platform; the
          jobs download PREFIX-inputs and PREFIX-e2e.
        type: string
        required: true
      bundle:
        description: CI / Bundle's bundle artifact for the target's platform.
        type: string
        required: true
      live-images:
        description: CI / Bundle's live images artifact for the target's platform, when it built them.
        type: string
        default: ""
      live-images-commit:
        description: A v1 commit whose pushed images to pull instead of the live images artifact.
        type: string
        default: ""
      jobs:
        description: Comma-separated case IDs on this target; empty selects every case on the target.
        type: string
        default: ""

# The case jobs pull a v1 commit's pushed images when CI / Bundle names one.
permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: "0"
  TARGET: ${{ inputs.target || 'rtx-pro-6000' }}
  TEST_PLATFORM: linux_amd64
  SOURCES: hcl-image-sources-${{ inputs.target || 'rtx-pro-6000' }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  # Each case's documents say where it runs, whether it reads the NVIDIA API
  # key, and which model runtime images its job builds. This job lists them
  # and fetches those images' pinned sources, which the case jobs' Bake reads.
  cases:
    name: Cases
    # The GPU runner and the inference secret exist only in this repository.
    if: github.repository == 'NVIDIA/NemoClaw'
    # It runs the target platform's build tool from CI / Bundle's test inputs.
    runs-on: ${{ (inputs.target || 'rtx-pro-6000') == 'rtx-pro-6000' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 20
    outputs:
      runner: ${{ steps.target.outputs.runner }}
      platform: ${{ steps.target.outputs.platform }}
      persistent: ${{ steps.target.outputs.persistent }}
      cases: ${{ steps.cases.outputs.cases }}
      matrix: ${{ steps.cases.outputs.matrix }}
      runtimes: ${{ steps.cases.outputs.runtimes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check copied-PR admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ $GITHUB_REF_NAME == pull-request/* ]]; then
            number=${GITHUB_REF_NAME#pull-request/}
            [[ $number =~ ^[1-9][0-9]*$ ]] || exit 1
            gh api "repos/$GITHUB_REPOSITORY/pulls/$number" | jq -e --arg sha "$GITHUB_SHA" '
              .state == "open" and .draft == false and .base.ref == "v1" and .head.sha == $sha
            ' > /dev/null
            # A manual run must also identify the bot's admission, not just a branch with that name.
            if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
              gh api "repos/$GITHUB_REPOSITORY/activity?ref=$GITHUB_REF&per_page=1" |
                jq -e --arg sha "$GITHUB_SHA" '
                  length == 1 and .[0].after == $sha and .[0].actor.login == "copy-pr-bot[bot]" and
                  (.[0].activity_type | IN("branch_creation", "push", "force_push"))
                ' > /dev/null
            else
              [[ $GITHUB_ACTOR == 'copy-pr-bot[bot]' ]] || exit 1
            fi
          elif [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
            [[ $GITHUB_REF == refs/heads/v1 ]] || exit 1
          fi
      - name: Select target
        id: target
        run: |
          persistent=false
          case "$TARGET" in
            rtx-pro-6000) runner=linux-amd64-gpu-rtxpro6000-latest-1 platform=linux_amd64 ;;
            dgx-station)
              [[ $GITHUB_EVENT_NAME == workflow_dispatch || ($GITHUB_EVENT_NAME == push && $GITHUB_ACTOR == 'copy-pr-bot[bot]' && $GITHUB_REF_NAME == pull-request/*) ]] || exit 1
              runner=colossus-gb300 platform=linux_arm64 persistent=true ;;
            dgx-spark)
              [[ $GITHUB_EVENT_NAME == workflow_dispatch ]] || exit 1
              runner=colossus-gb10 platform=linux_arm64 persistent=true ;;
            *) echo "Unknown target: $TARGET" >&2; exit 1 ;;
          esac
          printf 'runner=%s\nplatform=%s\npersistent=%s\n' "$runner" "$platform" "$persistent" >> "$GITHUB_OUTPUT"
      # CI / Bundle's build tool, so that this job compiles nothing.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.tests }}-inputs
          path: .build/ci
      # The image builds' pinned sources, as CI / Images saved them.
      - name: Restore the verified image sources
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/downloads
          key: image-sources-v1-${{ hashFiles('versions.json') }}
      - name: List the cases and fetch their runtime images' sources
        id: cases
        env:
          CASES: ${{ inputs.cases }}
          HOSTED: ${{ inputs.hosted }}
          JOBS: ${{ inputs.jobs }}
        run: |
          tar -xf .build/ci/lifecycle-inputs.tar .build/ci/nemoclaw-build
          tool=.build/ci/nemoclaw-build
          if [[ -z $CASES ]]; then
            CASES=$("$tool" changes cases --all | jq -c '{runners, nvidia_key}')
          fi
          runtimes=$("$tool" images runtimes)
          if [[ $TARGET == dgx-station ]]; then
            CASES=$(jq -c '.runners.gpu = .runners["dgx-station"] | .runners.hosted = []' <<< "$CASES")
          elif [[ $TARGET == dgx-spark ]]; then
            # Spark remains manual-only and is absent from automatic case discovery.
            CASES="{\"runners\":{\"gpu\":[\"$TARGET-openclaw-nemotron\"]},\"nvidia_key\":[]}"
            runtimes="{\"$TARGET-openclaw-nemotron\":[\"vllm\"]}"
          fi
          if [[ -n $JOBS ]]; then
            CASES=$(jq -ce --arg jobs "$JOBS" '
              ($jobs | split(",")) as $ids |
              (.runners.gpu + (if env.HOSTED == "true" then .runners.hosted else [] end)) as $known |
              if all($ids[]; . as $id | $known | index($id) != null) then
                .runners |= with_entries(.value |= map(select(. as $id | $ids | index($id) != null)))
              else error("Select known case IDs on the chosen target") end
            ' <<< "$CASES")
          fi
          {
            echo "cases=$CASES"
            echo "matrix=$(jq -c --argjson hosted "$HOSTED" '.runners.gpu + (if $hosted then .runners.hosted else [] end)' <<< "$CASES")"
            echo "runtimes=$runtimes"
          } >> "$GITHUB_OUTPUT"
          "$tool" images fetch
          # Only the Ollama and llama.cpp images have sources; vllm has none.
          # Tar keeps the mode and time that images fetch gave them, which the
          # images' layers retain and artifact transfer drops.
          tar -cf "$RUNNER_TEMP/image-sources.tar" .build/image-sources/ollama .build/image-sources/llama-cpp
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.SOURCES }}
          path: ${{ runner.temp }}/image-sources.tar
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: ${{ matrix.case }}
    needs: cases
    # Runs when the cases job selected a case. A Colossus label can match
    # several machines, so its case's job downloads CI / Bundle's artifacts
    # itself, at the 3-8 MB/s that Actions artifacts move there.
    if: needs.cases.result == 'success' && needs.cases.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(needs.cases.outputs.matrix) }}
    # The cases with model runtime images need this NVIDIA GPU runner, which the main E2E workflow also uses.
    runs-on: ${{ contains(fromJSON(needs.cases.outputs.cases).runners.gpu, matrix.case) && needs.cases.outputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 60
    # The cases use fixed gateway ports. Each job has a runner and Docker engine
    # to itself, so runs of one case don't collide; a job waits in the runner
    # queue. A concurrency group would let a newer run cancel a waiting job.
    env:
      TEST_PLATFORM: ${{ needs.cases.outputs.platform }}
      PERSISTENT: ${{ needs.cases.outputs.persistent }}
      NEMOCLAW_HCL_CASE: ${{ matrix.case }}
      NEMOCLAW_TEST_BUNDLE: ${{ github.workspace }}/dist/${{ needs.cases.outputs.platform }}
    steps:
      - name: Recheck the copied PR head
        if: startsWith(github.ref, 'refs/heads/pull-request/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=${GITHUB_REF_NAME#pull-request/}
          [[ $number =~ ^[1-9][0-9]*$ ]] || exit 1
          printf 'header = "Authorization: Bearer %s"\n' "$GH_TOKEN" | \
            curl --fail --silent --show-error --config - "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$number" | \
            jq -e --arg sha "$GITHUB_SHA" '
            .state == "open" and .draft == false and .base.ref == "v1" and .head.sha == $sha
          ' > /dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.cases.outputs.platform == 'linux_amd64'
        uses: ./.github/actions/containerd-store
      # The agent images the case binds: Hermes only when its document names
      # it. A case without Hermes downloads CI / Bundle's OpenClaw-only live
      # images artifact, the live-images input's name plus -openclaw, which is
      # about a third smaller: the GPU runner downloads artifacts slowly.
      - name: Select the case's agent images
        id: agents
        run: |
          if grep -qs 'nc-fabric-hermes@' "crates/nemoclaw-e2e/cases/$NEMOCLAW_HCL_CASE.yaml"; then
            printf 'names=openclaw hermes\nsuffix=\n' >> "$GITHUB_OUTPUT"
          else
            printf 'names=openclaw\nsuffix=-openclaw\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Check the Colossus runner
        if: needs.cases.outputs.persistent == 'true'
        run: |
          case "$TARGET" in
            dgx-station) gpu=GB300 ;;
            dgx-spark) gpu=GB10 ;;
            *) exit 1 ;;
          esac
          test "$(uname -m)" = aarch64
          . /etc/os-release
          test "$ID:$VERSION_ID" = ubuntu:24.04
          nvidia-smi --query-gpu=name --format=csv,noheader | grep -q "$gpu"
          docker info --format '{{json .DriverStatus}}' | grep -q io.containerd.snapshotter.v1
      # Since v0.37.0, Buildx starts a runtime image's base pull only after the
      # supervisor target finishes (https://github.com/docker/buildx/issues/4216).
      # A build of just the base, started here, pulls the same digest into
      # BuildKit while the job downloads its inputs and the bake builds the
      # supervisor; its RUN makes BuildKit unpack the layers too. The bake's
      # FROM then finds the base in BuildKit's cache, or joins the pull still in
      # progress. A docker pull would leave BuildKit to unpack the base again
      # after the supervisor, about 95 s for vLLM. Remove this step and the wait
      # after the bake once a Buildx release overlaps linked targets again.
      - name: Start pulling the runtime images' bases
        env:
          RUNTIMES: ${{ join(fromJSON(needs.cases.outputs.runtimes)[matrix.case], ' ') }}
        run: |
          read -ra names <<< "$RUNTIMES"
          {
            for name in "${names[@]}"; do
              { sed -n '1{/^# syntax=/p}; /^FROM /p' "image/$name/Dockerfile"; echo 'RUN true'; } |
                docker buildx build --quiet --output type=cacheonly - &&
                echo "Pulled the $name base after ${SECONDS}s."
            done
            touch "$RUNNER_TEMP/base-pull.done"
          } > "$RUNNER_TEMP/base-pull.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/base-pull.pid"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.tests }}-e2e
          path: .build/ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.bundle }}
          path: .build/ci
      - if: inputs.live-images-commit == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.live-images }}${{ steps.agents.outputs.suffix }}
          path: .build/ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.SOURCES }}
          path: ${{ runner.temp }}
      - name: Load the images and bind the case to them
        env:
          COMMIT: ${{ inputs.live-images-commit }}
          PULL_TOKEN: ${{ github.token }}
          RUNTIMES: ${{ join(fromJSON(needs.cases.outputs.runtimes)[matrix.case], ' ') }}
          AGENTS: ${{ steps.agents.outputs.names }}
          SUFFIX: ${{ steps.agents.outputs.suffix }}
        run: |
          read -ra agent_names <<< "$AGENTS"
          # As the E2E platform workflow's hosted HCL jobs load them.
          tar -xf .build/ci/bundle.tar
          # Artifact transfer drops the executable bit.
          install -m 755 .build/ci/e2e .build/e2e
          # A case names its images nc-fabric@DIGEST, which Docker resolves
          # only in the repository that holds the image.
          if [[ -n $COMMIT ]]; then
            printf '%s\n' "$PULL_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            for name in "${agent_names[@]}"; do
              docker pull --quiet "ghcr.io/nvidia/nemoclaw/v1-ci:$name-$COMMIT-${TEST_PLATFORM#linux_}"
              docker tag "ghcr.io/nvidia/nemoclaw/v1-ci:$name-$COMMIT-${TEST_PLATFORM#linux_}" "nc-fabric:$name"
            done
            docker logout ghcr.io
          else
            zstd -d -c -q ".build/ci/live-images$SUFFIX.tar.zst" | docker load
            for name in "${agent_names[@]}"; do docker tag "nc-live-images:$name" "nc-fabric:$name"; done
          fi
          # A case builds the model runtime images its services run, from the
          # sources the cases job fetched.
          tar -xf "$RUNNER_TEMP/image-sources.tar"
          read -ra runtimes <<< "$RUNTIMES"
          NEMOCLAW_HCL_RUN="$RUNNER_TEMP/hcl"
          bindings=()
          document="crates/nemoclaw-e2e/cases/$NEMOCLAW_HCL_CASE.yaml"
          if [[ $PERSISTENT == true ]]; then
            umask 077
            NEMOCLAW_HCL_RUN="$HOME/.local/state/nemoclaw-ci/hcl/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            test ! -e "$NEMOCLAW_HCL_RUN"
            mkdir -p "$NEMOCLAW_HCL_RUN"
            document="$NEMOCLAW_HCL_RUN/case.yaml"
            cp "examples/platforms/$TARGET/openclaw-nemotron-super.yaml" "$document"
            # Station's qualified model stays separate from the Spark template.
            if [[ $TARGET == dgx-station ]]; then
              bindings+=(
                -e 's#nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4#nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4#'
                -e 's#ff433f5493e25d631c9f12b5d55c674229923d02#da5b2650a835292c678994a1fa3fb653250fb508#'
                -e 's#nemotron-3-super#nemotron-3.5-super-vl#g'
              )
            fi
            cp -a "$NEMOCLAW_TEST_BUNDLE" "$NEMOCLAW_HCL_RUN/bundle"
            cp -L .build/e2e "$NEMOCLAW_HCL_RUN/e2e"
            {
              echo "NEMOCLAW_TEST_BUNDLE=$NEMOCLAW_HCL_RUN/bundle"
              echo "NEMOCLAW_HCL_TEST_DIRECTORY=manual"
              echo "NEMOCLAW_HCL_PERSISTENT=true"
            } >> "$GITHUB_ENV"
          fi
          if (( ${#runtimes[@]} )); then
            (umask 022; docker buildx bake "${runtimes[@]}")
            until [[ -e $RUNNER_TEMP/base-pull.done ]] || ! kill -0 "$(< "$RUNNER_TEMP/base-pull.pid")" 2> /dev/null; do sleep 1; done
            cat "$RUNNER_TEMP/base-pull.log"
          fi
          for name in "${agent_names[@]}"; do docker image inspect "nc-fabric:$name" > /dev/null; done
          for runtime in "${runtimes[@]}"; do docker image inspect "nc-prototype-$runtime:rust-v1" > /dev/null; done
          id() { docker image inspect --format '{{.Id}}' "$1" 2>/dev/null; }
          # Pin this run's images and give it a fresh deployment identity; plan rejects an unbound image.
          sed -i "${bindings[@]}" -e "s#nc-fabric@sha256:0\{64\}#nc-fabric@$(id nc-fabric:openclaw)#" \
            -e "s#nc-fabric-hermes@sha256:0\{64\}#nc-fabric@$(id nc-fabric:hermes)#" \
            -e "s#nc-prototype-vllm@sha256:0\{64\}#nc-prototype-vllm@$(id nc-prototype-vllm:rust-v1)#" \
            -e "s#nc-prototype-llama-cpp@sha256:0\{64\}#nc-prototype-llama-cpp@$(id nc-prototype-llama-cpp:rust-v1)#" \
            -e "s#nc-prototype-ollama@sha256:a\{64\}#nc-prototype-ollama@$(id nc-prototype-ollama:rust-v1)#" \
            -e "s#^  uid: .*#  uid: $(cat /proc/sys/kernel/random/uuid)#" \
            "$document"
          {
            echo "NEMOCLAW_HCL_RUN=$NEMOCLAW_HCL_RUN"
            echo "NEMOCLAW_HCL_DOCUMENT=$(realpath "$document")"
          } >> "$GITHUB_ENV"
      - name: Run the scenario
        working-directory: crates/nemoclaw-e2e
        env:
          # Only the cases that read the key receive it.
          NVIDIA_INFERENCE_API_KEY: ${{ contains(fromJSON(needs.cases.outputs.cases).nvidia_key, matrix.case) && secrets.NVIDIA_API_KEY || '' }}
        run: '"$GITHUB_WORKSPACE/.build/e2e" hcl_live::case --exact --ignored --nocapture'
      # A cancelled or timed-out job still runs this step; the test's process does not survive.
      - name: Destroy
        if: always()
        run: |
          [[ -n ${NEMOCLAW_HCL_RUN:-} ]] || exit 0
          state="$NEMOCLAW_HCL_RUN/deployment"
          [[ -d $state ]] || exit 0
          destroyed=false
          if "$NEMOCLAW_TEST_BUNDLE/bin/nemoclaw" destroy --output json --progress off --state-dir "$state" \
            > "$NEMOCLAW_HCL_RUN/reports/destroy.json" &&
            jq -e '.outcome == "destroyed"' "$NEMOCLAW_HCL_RUN/reports/destroy.json"; then destroyed=true; fi
          executable="$GITHUB_WORKSPACE/.build/e2e"
          if [[ -x $NEMOCLAW_HCL_RUN/e2e ]]; then executable="$NEMOCLAW_HCL_RUN/e2e"; fi
          "$executable" hcl_live::docker_cleanup --exact --ignored --nocapture
          test "$destroyed" = true
      - name: Release this run's cached model mount
        if: always() && inputs.target == 'dgx-station'
        run: |
          [[ -n ${NEMOCLAW_HCL_RUN:-} && -f ${NEMOCLAW_HCL_DOCUMENT:-} ]] || exit 0
          executable="$GITHUB_WORKSPACE/.build/e2e"
          if [[ -x $NEMOCLAW_HCL_RUN/e2e ]]; then executable="$NEMOCLAW_HCL_RUN/e2e"; fi
          "$executable" hcl_live::model_cache_cleanup --exact --ignored --nocapture
      # Reports hold outcomes only; requests, replies, state, and credentials stay on the runner.
      - name: Upload observations and cleanup receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hcl-e2e-${{ matrix.case }}-${{ github.run_attempt }}
          path: ${{ env.NEMOCLAW_HCL_RUN }}/reports/*.json
          if-no-files-found: ignore
          retention-days: 7
