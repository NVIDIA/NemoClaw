name: CI / Images
on:
  pull_request:
    branches: [v1]
  push:
    branches: [v1]
    paths:
      - image/**
      - docker-bake.hcl
      - .dockerignore
      - ruff.toml
      - .github/workflows/images.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  images:
    name: Build / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_arm64
            docker_platform: linux/arm64
            runner: ubuntu-24.04-arm
          - platform: linux_amd64
            docker_platform: linux/amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      AGENT_PLATFORM: ${{ matrix.docker_platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate image selection and Dockerfile instructions
        run: |
          python3 -B -m unittest discover -s image -p test_builds.py
          docker buildx bake --check agents ollama-proxy
      - name: Check packaging and generic Fabric lifecycle
        run: docker buildx bake check
      - name: Build local images with installed Fabric metadata
        run: |
          python3 image/build_fabric.py --platform "$AGENT_PLATFORM" agents
          docker buildx bake ollama-proxy --load
      - name: Verify installed discovery and retained source hashes
        run: |
          docker buildx bake --print agents | jq -er '.target | to_entries[] | [.key, .value.tags[0]] | @tsv' > .build-image-list
          test -s .build-image-list
          while read -r harness image; do
            catalog=$(docker image inspect "$image" --format '{{index .Config.Labels "io.nemoclaw.fabric.catalog"}}')
            docker run --rm --runtime=runc --network none \
              -e NEMOCLAW_TEST_HARNESS="$harness" -e NEMOCLAW_TEST_CATALOG="$catalog" \
              -v "$PWD/image/test_image.py:/test.py:ro" \
              --entrypoint /opt/fabric/bin/python "$image" -B /test.py
          done < .build-image-list
      - name: Qualify native adapters in the built images
        run: |
          native() {
            image=$1 script=$2
            shift 2
            docker run --rm --runtime=runc --network none               -v "$PWD/image/$script:/$script:ro"               --entrypoint /opt/fabric/bin/python "$image" -B "/$script" "$@"
          }
          native nc-fabric:openclaw qualify_native.py nvidia.fabric.openclaw --settings '{"cli":"/app/openclaw.mjs"}'
          if [ "$AGENT_PLATFORM" = linux/arm64 ]; then
            native nc-fabric:hermes qualify_native.py nvidia.fabric.hermes --settings '{"mode":"service"}'
            native nc-fabric:hermes hermes_security.py
            native nc-fabric:pi qualify_native.py nvidia.fabric.pi
          fi
