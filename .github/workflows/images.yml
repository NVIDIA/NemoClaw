name: CI / Images
on:
  pull_request:
    branches: [v1]
  push:
    branches: [v1]
    paths:
      - image/**
      - test/**
      - tools/ci/image_fixtures.py
      - tools/fabric-adapter-experiment.py
      - tools/fabric_management/**
      - docker-bake.hcl
      - .dockerignore
      - ruff.toml
      - .github/workflows/images.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  images:
    name: Images / linux_arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      AGENT_PLATFORM: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate image selection and Dockerfile instructions
        run: |
          python3 -B -m unittest discover -s image -p test_builds.py
          docker buildx bake --check agents ollama-proxy
      - name: Lint, format, compile TypeScript, and run unit tests
        run: docker buildx bake check
      - name: Build all supported agent images locally
        run: docker buildx bake agents ollama-proxy --load
      - name: Verify assembled images and retained source hashes
        run: |
          for harness in deepagents claude codex mini-swe-agent nooa nooa-bench remote-agent pi openclaw hermes; do
            docker run --rm --runtime=runc --network none \
              -e NEMOCLAW_TEST_HARNESS="$harness" -v "$PWD/image/test_image.py:/test.py:ro" \
              --entrypoint /opt/fabric/bin/python "nc-fabric:$harness" -B /test.py
          done
      - name: Exercise native adapters against isolated protocol fixtures
        run: python3 tools/ci/image_fixtures.py linux_arm64
      - name: Qualify the experimental Fabric management contract
        run: |
          for harness in pi deepagents; do
            python3 tools/fabric_management/run.py --image "nc-fabric:$harness" \
              --config "tools/fabric_management/fixtures/$harness.json"
          done
      - name: Exercise OpenClaw tools, execution, search, and tracing
        run: |
          docker run --rm --runtime=runc --network none --user 0 \
            --add-host host.openshell.internal:127.0.0.1 \
            -e PYTHONPATH=/opt/nemoclaw \
            -e NEMOCLAW_TEST_NATIVE_TOOLS=1 -e NEMOCLAW_TEST_NATIVE_FEATURES=1 -e NEMOCLAW_TEST_NATIVE_EXECUTION=1 \
            -v "$PWD/image/fabric:/tests:ro" -w /tests \
            --entrypoint /opt/fabric/bin/python nc-fabric:openclaw \
            -B -m unittest test_openclaw_adapter test_inference test_interfaces \
            test_execution test_observability test_web_search test_openclaw_tools_gateway
          for test in test_inference_probe.mts test_openclaw_tools.mts test_openclaw_disclosure.mts test_web_search.mts; do
            docker run --rm --runtime=runc --network none --user 0 \
              -e PYTHONPATH=/opt/nemoclaw -v "$PWD/image/fabric:/tests:ro" \
              --entrypoint node nc-fabric:openclaw "/tests/$test"
          done
  agents-amd64:
    name: Images / linux_amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      AGENT_PLATFORM: linux/amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate AMD64 agent builds
        run: |
          python3 -B -m unittest discover -s image -p test_builds.py
          docker buildx bake --check agents ollama-proxy
      - name: Build qualified AMD64 agent images locally
        run: |
          docker buildx bake proxy-tests
          docker buildx bake agents ollama-proxy --load
      - name: Verify assembled AMD64 images and retained source hashes
        run: |
          for harness in deepagents openclaw; do
            docker run --rm --runtime=runc --network none \
              -e NEMOCLAW_TEST_HARNESS="$harness" -v "$PWD/image/test_image.py:/test.py:ro" \
              --entrypoint /opt/fabric/bin/python "nc-fabric:$harness" -B /test.py
          done
      - name: Exercise AMD64 native adapters against isolated protocol fixtures
        run: python3 tools/ci/image_fixtures.py linux_amd64
      - name: Exercise AMD64 OpenClaw tools, execution, search, and tracing
        run: |
          docker run --rm --runtime=runc --network none --user 0 \
            --add-host host.openshell.internal:127.0.0.1 \
            -e PYTHONPATH=/opt/nemoclaw \
            -e NEMOCLAW_TEST_NATIVE_TOOLS=1 -e NEMOCLAW_TEST_NATIVE_FEATURES=1 -e NEMOCLAW_TEST_NATIVE_EXECUTION=1 \
            -v "$PWD/image/fabric:/tests:ro" -w /tests \
            --entrypoint /opt/fabric/bin/python nc-fabric:openclaw \
            -B -m unittest test_openclaw_adapter test_inference test_interfaces \
            test_execution test_observability test_web_search test_openclaw_tools_gateway
          for test in test_inference_probe.mts test_openclaw_tools.mts test_openclaw_disclosure.mts test_web_search.mts; do
            docker run --rm --runtime=runc --network none --user 0 \
              -e PYTHONPATH=/opt/nemoclaw -v "$PWD/image/fabric:/tests:ro" \
              --entrypoint node nc-fabric:openclaw "/tests/$test"
          done
