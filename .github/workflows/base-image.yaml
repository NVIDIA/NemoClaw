# Build and push sandbox base images, then publish validated managed images.
#
# Triggers:
#   - Push to main when a base- or managed-image input changes
#   - Manual dispatch for ad-hoc rebuilds
#
# Base images contain the expensive, rarely-changing layers. Complete image
# publication consumes exact base digests from the same trusted workflow run.

name: Images / Base Images

on:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      # Re-run when this workflow gains or changes a publisher so the new path
      # takes effect immediately after merge instead of waiting for another tag.
      - ".github/workflows/base-image.yaml"
      - ".github/workflows/managed-images.yaml"
      - ".github/actions/ci-reviewed-npm-audit/**"
      - ".dockerignore"
      # Complete managed-image inputs. Keep these reviewed families synchronized
      # with tools/e2e/base-image-publication.mts.
      - "Dockerfile"
      - "agents/**"
      - "nemoclaw/**"
      - "nemoclaw-blueprint/**"
      - "scripts/**"
      - "src/lib/actions/sandbox/openshell-child-visible-credentials.v*.json"
      - "src/lib/core/json-types.ts"
      - "src/lib/core/ports.ts"
      - "src/lib/messaging/**"
      - "src/lib/onboard/managed-bootstrap/envelope.ts"
      - "src/lib/onboard/managed-startup/**"
      - "src/lib/security/credential-hash.ts"
      - "src/lib/state/paths.ts"
      - "src/lib/state/state-root.ts"
      - "src/lib/tool-disclosure.ts"
      - "tools/mcp-tool-discovery-runtime/**"
      - "tsconfig.runtime-preloads.json"
      - "Dockerfile.base"
      - "agents/openclaw/openclaw-runtime/package.json"
      - "agents/openclaw/openclaw-runtime/package-lock.json"
      - "scripts/lib/reviewed-npm-archive.mts"
      - "agents/hermes/Dockerfile.base"
      - "agents/hermes/security-dependencies.patch"
      - "agents/hermes/whatsapp-proxy.patch"
      - "agents/langchain-deepagents-code/Dockerfile.base"
      - "agents/langchain-deepagents-code/manifest.yaml"
      - "agents/langchain-deepagents-code/requirements.lock"
      - "agents/openclaw/mcporter-runtime/package.json"
      - "agents/openclaw/mcporter-runtime/package-lock.json"
      - "ci/npm-audit-exceptions.json"
      - "ci/reviewed-npm-audit.json"
      # Dockerfile.base validates min_openclaw_version from this file at build time.
      - "nemoclaw-blueprint/blueprint.yaml"
      - "scripts/lib/openclaw-npm-remediation.mts"
      - "scripts/lib/reviewed-npm-audit.mts"
      - "scripts/security/build-native-security-packages.sh"
      - "scripts/security/build-perl-security-packages.sh"
      - "scripts/security/patches/libssh2-1.11.1-cve-2026.patch"
      - "scripts/security/patches/python3.13-htmlparser-cve-2026-15308.patch"
      - "scripts/patch-bundled-npm-brace-expansion.mts"
      - "scripts/lib/patch-bundled-npm-ip-address.mts"
      - "scripts/patch-bundled-npm-tar.mts"
      - "scripts/upgrade-bundled-npm.mts"
      - "scripts/lib/sandbox-rlimits.sh"
  workflow_dispatch:
    inputs:
      openclaw_version:
        description: "OpenClaw version to install (leave blank to use the default in Dockerfile.base)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: base-image-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  REGISTRY: ghcr.io

jobs:
  reviewed-npm-audit:
    if: github.repository == 'NVIDIA/NemoClaw'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit reviewed production npm graphs
        uses: ./.github/actions/ci-reviewed-npm-audit
        with:
          target-root: ${{ github.workspace }}
          report-dir: artifacts/reviewed-npm-audit

  # The complete Perl suite approaches the image-job timeout under QEMU arm64 emulation.
  # Build OpenClaw on native runners and publish only immutable per-platform digests here.
  # The dependent manifest job updates user-facing tags atomically.
  build-openclaw-platforms:
    name: Build OpenClaw base image (${{ matrix.arch }})
    if: github.repository == 'NVIDIA/NemoClaw'
    needs:
      - reviewed-npm-audit
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: openclaw
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
            dockerfile: Dockerfile.base
            image: nvidia/nemoclaw/sandbox-base
          - agent: openclaw
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            dockerfile: Dockerfile.base
            image: nvidia/nemoclaw/sandbox-base
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 8
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,prefix=,format=short

      - name: Validate production Docker build args
        id: production-build-args
        env:
          AGENT: ${{ matrix.agent }}
          OPENCLAW_VERSION_INPUT: ${{ inputs.openclaw_version }}
        run: |
          set -euo pipefail
          build_args=()
          openclaw_build_arg=""
          if [ "$AGENT" = "openclaw" ] && [ -n "${OPENCLAW_VERSION_INPUT}" ]; then
            openclaw_build_arg="OPENCLAW_VERSION=${OPENCLAW_VERSION_INPUT}"
            build_args+=(--build-arg "$openclaw_build_arg")
          fi
          if [ "${#build_args[@]}" -gt 0 ]; then
            scripts/check-production-build-args.sh "${build_args[@]}"
          else
            scripts/check-production-build-args.sh
          fi
          if [ "$AGENT" = "openclaw" ] && [ -n "${OPENCLAW_VERSION_INPUT}" ]; then
            if [[ "$OPENCLAW_VERSION_INPUT" == *$'\r'* || "$OPENCLAW_VERSION_INPUT" == *$'\n'* ]]; then
              echo "ERROR: OpenClaw version must not contain CR or LF characters." >&2
              exit 1
            fi
            if [[ ! "$OPENCLAW_VERSION_INPUT" =~ ^[0-9]+([.][0-9]+)*$ ]]; then
              echo "ERROR: OpenClaw version must be a whole decimal dotted version (for example, 2026.6.10)." >&2
              exit 1
            fi
          fi
          printf 'openclaw_build_arg=%s\n' "$openclaw_build_arg" >> "$GITHUB_OUTPUT"

      - name: Build and push platform digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ matrix.image }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ matrix.image }}:buildcache-${{ matrix.arch }},mode=max
          build-args: ${{ steps.production-build-args.outputs.openclaw_build_arg }}

      - name: Export platform digest
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$ARCH" =~ ^(amd64|arm64)$ ]]; then
            echo "ERROR: unsupported platform architecture: $ARCH" >&2
            exit 1
          fi
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ERROR: build did not return a valid sha256 digest: $DIGEST" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${ARCH}-${DIGEST#sha256:}"

      - name: Upload platform digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openclaw-base-digest-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # The complete Perl suite approaches the image-job timeout under QEMU arm64 emulation.
  # Build each sibling image on native architecture runners and publish only immutable platform digests.
  # Each manifest job updates its image tags after both platform builds pass.
  build-hermes-platforms:
    name: Build ${{ matrix.display_name }} base image (${{ matrix.arch }})
    if: github.repository == 'NVIDIA/NemoClaw'
    needs:
      - reviewed-npm-audit
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: hermes
            display_name: Hermes
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
            dockerfile: agents/hermes/Dockerfile.base
            image: nvidia/nemoclaw/hermes-sandbox-base
          - agent: hermes
            display_name: Hermes
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            dockerfile: agents/hermes/Dockerfile.base
            image: nvidia/nemoclaw/hermes-sandbox-base
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 8
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}

      - name: Validate production Docker build args
        id: production-build-args
        env:
          AGENT: ${{ matrix.agent }}
          OPENCLAW_VERSION_INPUT: ${{ inputs.openclaw_version }}
        run: |
          set -euo pipefail
          build_args=()
          openclaw_build_arg=""
          if [ "$AGENT" = "openclaw" ] && [ -n "${OPENCLAW_VERSION_INPUT}" ]; then
            openclaw_build_arg="OPENCLAW_VERSION=${OPENCLAW_VERSION_INPUT}"
            build_args+=(--build-arg "$openclaw_build_arg")
          fi
          if [ "${#build_args[@]}" -gt 0 ]; then
            scripts/check-production-build-args.sh "${build_args[@]}"
          else
            scripts/check-production-build-args.sh
          fi
          if [ "$AGENT" = "openclaw" ] && [ -n "${OPENCLAW_VERSION_INPUT}" ]; then
            if [[ "$OPENCLAW_VERSION_INPUT" == *$'\r'* || "$OPENCLAW_VERSION_INPUT" == *$'\n'* ]]; then
              echo "ERROR: OpenClaw version must not contain CR or LF characters." >&2
              exit 1
            fi
            if [[ ! "$OPENCLAW_VERSION_INPUT" =~ ^[0-9]+([.][0-9]+)*$ ]]; then
              echo "ERROR: OpenClaw version must be a whole decimal dotted version (for example, 2026.6.10)." >&2
              exit 1
            fi
          fi
          printf 'openclaw_build_arg=%s\n' "$openclaw_build_arg" >> "$GITHUB_OUTPUT"

      - name: Build and push platform digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ matrix.image }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ matrix.image }}:buildcache-${{ matrix.arch }},mode=max
          build-args: ${{ steps.production-build-args.outputs.openclaw_build_arg }}

      - name: Export platform digest
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$ARCH" =~ ^(amd64|arm64)$ ]]; then
            echo "ERROR: unsupported platform architecture: $ARCH" >&2
            exit 1
          fi
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ERROR: build did not return a valid sha256 digest: $DIGEST" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${ARCH}-${DIGEST#sha256:}"

      - name: Upload platform digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.agent }}-base-digest-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  build-dcode-platforms:
    name: Build ${{ matrix.display_name }} base image (${{ matrix.arch }})
    if: github.repository == 'NVIDIA/NemoClaw'
    needs:
      - reviewed-npm-audit
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: langchain-deepagents-code
            display_name: Deep Agents Code
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
            dockerfile: agents/langchain-deepagents-code/Dockerfile.base
            image: nvidia/nemoclaw/langchain-deepagents-code-sandbox-base
          - agent: langchain-deepagents-code
            display_name: Deep Agents Code
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            dockerfile: agents/langchain-deepagents-code/Dockerfile.base
            image: nvidia/nemoclaw/langchain-deepagents-code-sandbox-base
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 8
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}

      - name: Validate production Docker build args
        id: production-build-args
        env:
          AGENT: ${{ matrix.agent }}
          OPENCLAW_VERSION_INPUT: ${{ inputs.openclaw_version }}
        run: |
          set -euo pipefail
          build_args=()
          openclaw_build_arg=""
          if [ "$AGENT" = "openclaw" ] && [ -n "${OPENCLAW_VERSION_INPUT}" ]; then
            openclaw_build_arg="OPENCLAW_VERSION=${OPENCLAW_VERSION_INPUT}"
            build_args+=(--build-arg "$openclaw_build_arg")
          fi
          if [ "${#build_args[@]}" -gt 0 ]; then
            scripts/check-production-build-args.sh "${build_args[@]}"
          else
            scripts/check-production-build-args.sh
          fi
          if [ "$AGENT" = "openclaw" ] && [ -n "${OPENCLAW_VERSION_INPUT}" ]; then
            if [[ "$OPENCLAW_VERSION_INPUT" == *$'\r'* || "$OPENCLAW_VERSION_INPUT" == *$'\n'* ]]; then
              echo "ERROR: OpenClaw version must not contain CR or LF characters." >&2
              exit 1
            fi
            if [[ ! "$OPENCLAW_VERSION_INPUT" =~ ^[0-9]+([.][0-9]+)*$ ]]; then
              echo "ERROR: OpenClaw version must be a whole decimal dotted version (for example, 2026.6.10)." >&2
              exit 1
            fi
          fi
          printf 'openclaw_build_arg=%s\n' "$openclaw_build_arg" >> "$GITHUB_OUTPUT"

      - name: Build and push platform digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ matrix.image }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ matrix.image }}:buildcache-${{ matrix.arch }},mode=max
          build-args: ${{ steps.production-build-args.outputs.openclaw_build_arg }}

      - name: Export platform digest
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$ARCH" =~ ^(amd64|arm64)$ ]]; then
            echo "ERROR: unsupported platform architecture: $ARCH" >&2
            exit 1
          fi
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ERROR: build did not return a valid sha256 digest: $DIGEST" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${ARCH}-${DIGEST#sha256:}"

      - name: Upload platform digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.agent }}-base-digest-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  build-and-push-hermes:
    name: Build and push Hermes base image
    if: github.repository == 'NVIDIA/NemoClaw'
    needs:
      - build-hermes-platforms
      - reviewed-npm-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download platform digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: hermes-base-digest-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 8
        with:
          images: ${{ env.REGISTRY }}/nvidia/nemoclaw/hermes-sandbox-base
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,prefix=,format=short

      - name: Create and verify multi-platform manifest
        id: manifest
        env:
          AGENT: hermes
          IMAGE: ${{ env.REGISTRY }}/nvidia/nemoclaw/hermes-sandbox-base
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          digest_files=("$RUNNER_TEMP"/digests/*)
          if [ "${#digest_files[@]}" -ne 2 ]; then
            echo "ERROR: expected exactly two platform digests, found ${#digest_files[@]}." >&2
            exit 1
          fi

          declare -A seen_arches=()
          declare -A source_digests=()
          sources=()
          for digest_file in "${digest_files[@]}"; do
            digest_artifact="$(basename "$digest_file")"
            if [[ ! "$digest_artifact" =~ ^(amd64|arm64)-([0-9a-f]{64})$ ]]; then
              echo "ERROR: invalid platform digest artifact: $digest_artifact" >&2
              exit 1
            fi
            expected_arch="${BASH_REMATCH[1]}"
            digest="${BASH_REMATCH[2]}"
            if [ -n "${seen_arches[$expected_arch]:-}" ]; then
              echo "ERROR: duplicate platform digest for linux/$expected_arch." >&2
              exit 1
            fi
            source="$IMAGE@sha256:$digest"
            source_platform="$(
              scripts/checks/retry-docker-imagetools-inspect.sh "$source" \
                --format '{{.Image.OS}}/{{.Image.Architecture}}'
            )"
            if [ "$source_platform" != "linux/$expected_arch" ]; then
              echo "ERROR: digest for linux/$expected_arch resolves to $source_platform." >&2
              exit 1
            fi
            seen_arches["$expected_arch"]=1
            source_digests["linux/$expected_arch"]="sha256:$digest"
            sources+=("$source")
          done
          if [ "${seen_arches[amd64]:-0}" -ne 1 ] || [ "${seen_arches[arm64]:-0}" -ne 1 ]; then
            echo "ERROR: expected one validated digest for linux/amd64 and linux/arm64." >&2
            exit 1
          fi

          mapfile -t tags <<< "$TAGS"
          tag_args=()
          for tag in "${tags[@]}"; do
            if [ -n "$tag" ]; then
              tag_args+=(--tag "$tag")
            fi
          done
          if [ "${#tag_args[@]}" -eq 0 ]; then
            echo "ERROR: metadata did not produce any publication tags." >&2
            exit 1
          fi

          candidate_tag="$IMAGE:base-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          candidate_metadata="$RUNNER_TEMP/$AGENT-base-candidate-metadata.json"
          docker buildx imagetools create \
            --tag "$candidate_tag" \
            --metadata-file "$candidate_metadata" \
            "${sources[@]}"
          digest="$(jq -er '.["containerimage.descriptor"].digest' "$candidate_metadata")"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ERROR: expected one staged Hermes base digest." >&2
            exit 1
          fi
          reference="$IMAGE@$digest"
          actual_platforms="$(
            scripts/checks/retry-docker-imagetools-inspect.sh "$reference" --raw \
              | jq -r '.manifests[] | select(.platform.os == "linux") | .platform.architecture' \
              | sort -u \
              | paste -sd, -
          )"
          if [ "$actual_platforms" != "amd64,arm64" ]; then
            echo "ERROR: staged manifest has unexpected platforms: $actual_platforms" >&2
            exit 1
          fi
          platform_digests_json="$(
            scripts/checks/validate-managed-base-index.sh \
              "$reference" \
              "${source_digests[linux/amd64]}" \
              "${source_digests[linux/arm64]}"
          )"
          declare -A platform_digests=()
          for platform in linux/amd64 linux/arm64; do
            platform_digests["$platform"]="$(
              jq -er --arg platform "$platform" '.[$platform]' <<< "$platform_digests_json"
            )"
          done

          scripts/export-managed-base-image-contract.sh \
            "$AGENT" \
            "$IMAGE" \
            "$digest" \
            "${platform_digests[linux/amd64]}" \
            "${platform_digests[linux/arm64]}" \
            "$GITHUB_SHA" \
            "$GITHUB_RUN_ID" \
            "$GITHUB_RUN_ATTEMPT" \
            "$RUNNER_TEMP/managed-base-contract/contract.json"

          publication_metadata="$RUNNER_TEMP/$AGENT-base-publication-metadata.json"
          docker buildx imagetools create \
            "${tag_args[@]}" \
            --metadata-file "$publication_metadata" \
            "$reference"
          published_digest="$(jq -er '.["containerimage.descriptor"].digest' "$publication_metadata")"
          if [ "$published_digest" != "$digest" ]; then
            echo "ERROR: published Hermes base digest differs from the validated candidate." >&2
            exit 1
          fi
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Upload managed base image contract
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-base-${{ github.run_id }}-${{ github.run_attempt }}-hermes
          path: ${{ runner.temp }}/managed-base-contract/contract.json
          if-no-files-found: error
          retention-days: 1

  build-and-push-dcode:
    name: Build and push Deep Agents Code base image
    if: github.repository == 'NVIDIA/NemoClaw'
    needs:
      - build-dcode-platforms
      - reviewed-npm-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download platform digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: langchain-deepagents-code-base-digest-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 8
        with:
          images: ${{ env.REGISTRY }}/nvidia/nemoclaw/langchain-deepagents-code-sandbox-base
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,prefix=,format=short

      - name: Create and verify multi-platform manifest
        id: manifest
        env:
          AGENT: langchain-deepagents-code
          IMAGE: ${{ env.REGISTRY }}/nvidia/nemoclaw/langchain-deepagents-code-sandbox-base
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          digest_files=("$RUNNER_TEMP"/digests/*)
          if [ "${#digest_files[@]}" -ne 2 ]; then
            echo "ERROR: expected exactly two platform digests, found ${#digest_files[@]}." >&2
            exit 1
          fi

