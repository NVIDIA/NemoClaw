name: Run a live suite
description: Run one live suite from this platform's test archive and bundle, compiling nothing.
inputs:
  platform:
    description: Bundle platform.
    required: true
  suite:
    description: The cargo ci step, live-docker or live-kind.
    required: true
  tests:
    description: Name of the Build and test job's artifact.
    required: true
  bundle:
    description: Name of the bundle job's artifact.
    required: true
runs:
  using: composite
  steps:
    - name: Restore verified downloads
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .build/downloads
        key: native-downloads-v1-${{ inputs.platform }}-${{ hashFiles('versions.json') }}
    - name: Download the test archive
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.tests }}
        path: .build/ci
    - name: Download the bundle
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.bundle }}
        path: .build/ci
    # Tar preserves the executable permissions that artifact transfer drops.
    - name: Extract test inputs and bundle
      shell: bash
      run: |
        tar -xf .build/ci/lifecycle-inputs.tar
        tar -xf .build/ci/bundle.tar
    # The Docker suite loads OCI archives and local images by digest, and the
    # Kubernetes suite reads an agent image's metadata from its OCI index; both
    # need Docker's containerd image store, and hosted runners use the classic one.
    - name: Use the containerd image store
      shell: bash
      run: |
        config=/etc/docker/daemon.json
        if [ -s "$config" ]; then current=$(sudo cat "$config"); else current='{}'; fi
        printf '%s' "$current" | jq '.features["containerd-snapshotter"] = true' | sudo tee "$config" >/dev/null
        sudo systemctl restart docker
        docker info --format '{{json .DriverStatus}}' | grep -q io.containerd.snapshotter.v1
    - name: Run live tests without compiling
      shell: bash
      env:
        LIVE_STEP: ${{ inputs.suite }}
      run: .build/ci/nemoclaw-build ci "$LIVE_STEP" --archive-file .build/ci/lifecycle.tar.zst
    - name: Upload live test results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.suite }}-${{ inputs.platform }}-${{ github.run_attempt }}
        path: target/nextest/${{ inputs.suite }}/${{ inputs.suite }}.xml
        if-no-files-found: ignore
        retention-days: 14
