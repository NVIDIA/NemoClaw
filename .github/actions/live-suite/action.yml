name: Run a live suite
description: Run one live suite with the bundle that this platform's bundle job built.
inputs:
  platform:
    description: Bundle platform.
    required: true
  suite:
    description: The cargo ci step, live-docker or live-kind.
    required: true
  bundle:
    description: Name of the bundle job's artifact.
    required: true
runs:
  using: composite
  steps:
    # Restore dependencies first, so deciding compiles the build tool from the cache.
    - uses: ./.github/actions/setup-rust
      with:
        platform: ${{ inputs.platform }}
        save-cache: "false"
    - name: Decide whether this change can affect the live suites
      id: changes
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
      run: |
        # Pushes and manual runs always run the suite.
        if [ "$EVENT" != pull_request ]; then
          echo live=true >> "$GITHUB_OUTPUT"
          exit 0
        fi
        base=$(git rev-parse HEAD^1)
        cargo run --locked --quiet -p nemoclaw-build --no-default-features --target-dir target/ci-runner -- \
          changes live --base "$base" >> "$GITHUB_OUTPUT"
    - name: Build test executables
      if: steps.changes.outputs.live == 'true'
      shell: bash
      run: cargo ci build
    - name: Download the bundle
      if: steps.changes.outputs.live == 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.bundle }}
        path: .build/ci
    # Tar preserves the executable permissions that artifact transfer drops.
    - name: Extract the bundle
      if: steps.changes.outputs.live == 'true'
      shell: bash
      run: tar -xf .build/ci/bundle.tar
    # The Docker suite loads OCI archives and local images by digest, and the
    # Kubernetes suite reads an agent image's metadata from its OCI index; both
    # need Docker's containerd image store, and hosted runners use the classic one.
    - name: Use the containerd image store
      if: steps.changes.outputs.live == 'true'
      shell: bash
      run: |
        config=/etc/docker/daemon.json
        if [ -s "$config" ]; then current=$(sudo cat "$config"); else current='{}'; fi
        printf '%s' "$current" | jq '.features["containerd-snapshotter"] = true' | sudo tee "$config" >/dev/null
        sudo systemctl restart docker
        docker info --format '{{json .DriverStatus}}' | grep -q io.containerd.snapshotter.v1
    - name: Run live tests
      if: steps.changes.outputs.live == 'true'
      shell: bash
      env:
        LIVE_STEP: ${{ inputs.suite }}
      run: cargo ci "$LIVE_STEP"
    - name: Upload live test results
      if: always() && steps.changes.outputs.live == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.suite }}-${{ inputs.platform }}-${{ github.run_attempt }}
        path: target/nextest/${{ inputs.suite }}/${{ inputs.suite }}.xml
        if-no-files-found: ignore
        retention-days: 14
