name: Run an HCL E2E case
description: Run one HCL E2E case from a test executable, bundle, and agent images that other jobs built, then destroy what it deployed.
inputs:
  case:
    description: The case's name in crates/nemoclaw-e2e/cases.
    required: true
  api-key:
    description: The NVIDIA inference key, for the cases that use hosted inference.
    required: false
    default: ""
  candidate:
    description: Name of the Live / HCL candidate artifact, or empty to use a platform's artifacts.
    required: false
    default: ""
  platform:
    description: The Linux platform whose artifacts the case uses.
    required: false
    default: linux_amd64
  tests:
    description: Name of the platform's Build and test artifact.
    required: false
    default: ""
  bundle:
    description: Name of the platform's bundle artifact.
    required: false
    default: ""
  images:
    description: Name of the platform's live images artifact, when it built them.
    required: false
    default: ""
  images-commit:
    description: The v1 commit whose pushed images to pull instead, when the plan found one.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: ./.github/actions/containerd-store
    - name: Download the candidate
      if: inputs.candidate != ''
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.candidate }}
        path: ${{ runner.temp }}
    # Tar keeps the executable bits that artifact transfer drops.
    - name: Unpack the candidate
      if: inputs.candidate != ''
      shell: bash
      run: |
        tar -xf "$RUNNER_TEMP/candidate.tar"
        docker load -i candidate/agents.tar
        {
          echo "HCL_E2E=$GITHUB_WORKSPACE/candidate/e2e"
          echo "NEMOCLAW_TEST_BUNDLE=$GITHUB_WORKSPACE/candidate/bundle"
          echo "HCL_OPENCLAW=nc-fabric:openclaw"
          echo "HCL_HERMES=nc-fabric:hermes"
        } >> "$GITHUB_ENV"
    - name: Download the test archive
      if: inputs.candidate == ''
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.tests }}
        path: .build/ci
    - name: Download the bundle
      if: inputs.candidate == ''
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.bundle }}
        path: .build/ci
    - name: Download the live images
      if: inputs.candidate == '' && inputs.images-commit == ''
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.images }}
        path: .build/ci
    - name: Unpack the platform's test executable, bundle, and images
      if: inputs.candidate == ''
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
        IMAGES_COMMIT: ${{ inputs.images-commit }}
        PULL_TOKEN: ${{ github.token }}
      run: |
        tar -xf .build/ci/bundle.tar
        mkdir -p .build/hcl
        zstd -d -c -q .build/ci/lifecycle.tar.zst | tar -x -C .build/hcl
        mapfile -t found < <(find .build/hcl -type f -path '*/deps/e2e-*' -perm -u+x ! -name '*.d')
        if [[ ${#found[@]} -ne 1 ]]; then
          echo "the test archive must hold one e2e test executable; found ${#found[@]}" >&2
          exit 1
        fi
        # The same images the platform's live suites run. A case names its
        # images as nc-fabric@DIGEST, which Docker resolves only in the
        # repository that holds the image, so name them as the candidate does.
        if [[ -n $IMAGES_COMMIT ]]; then
          printf '%s\n' "$PULL_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for name in openclaw hermes; do
            pushed="ghcr.io/nvidia/nemoclaw/v1-ci:$name-$IMAGES_COMMIT-${PLATFORM#linux_}"
            docker pull --quiet "$pushed"
            docker tag "$pushed" "nc-fabric:$name"
          done
          docker logout ghcr.io
        else
          zstd -d -c -q .build/ci/live-images.tar.zst | docker load
          for name in openclaw hermes; do
            docker tag "nc-live-images:$name" "nc-fabric:$name"
          done
        fi
        {
          echo "HCL_E2E=$GITHUB_WORKSPACE/${found[0]}"
          echo "NEMOCLAW_TEST_BUNDLE=$GITHUB_WORKSPACE/dist/$PLATFORM"
          echo "HCL_OPENCLAW=nc-fabric:openclaw"
          echo "HCL_HERMES=nc-fabric:hermes"
        } >> "$GITHUB_ENV"
    - name: Bind the case to this run's images
      shell: bash
      env:
        NEMOCLAW_HCL_CASE: ${{ inputs.case }}
      run: |
        # A case builds the model runtime image it serves.
        if [[ $NEMOCLAW_HCL_CASE == *vllm* ]]; then docker buildx bake vllm; fi
        if [[ $NEMOCLAW_HCL_CASE == *ollama* ]]; then docker buildx bake ollama; fi
        id() { docker image inspect --format '{{.Id}}' "$1" 2>/dev/null; }
        # Pin this run's images and give it a fresh deployment identity; plan rejects an unbound image.
        sed -i -e "s#nc-fabric@sha256:0\{64\}#nc-fabric@$(id "$HCL_OPENCLAW")#" \
          -e "s#nc-fabric-hermes@sha256:0\{64\}#nc-fabric@$(id "$HCL_HERMES")#" \
          -e "s#nc-prototype-vllm@sha256:0\{64\}#nc-prototype-vllm@$(id nc-prototype-vllm:rust-v1)#" \
          -e "s#nc-prototype-ollama@sha256:a\{64\}#nc-prototype-ollama@$(id nc-prototype-ollama:rust-v1)#" \
          -e "s#^  uid: .*#  uid: $(cat /proc/sys/kernel/random/uuid)#" \
          "crates/nemoclaw-e2e/cases/$NEMOCLAW_HCL_CASE.yaml"
    - name: Run the scenario
      shell: bash
      working-directory: crates/nemoclaw-e2e
      env:
        NEMOCLAW_HCL_CASE: ${{ inputs.case }}
        NEMOCLAW_HCL_RUN: ${{ runner.temp }}/hcl
        NVIDIA_INFERENCE_API_KEY: ${{ inputs.api-key }}
      run: '"$HCL_E2E" hcl_live::case --exact --ignored --nocapture'
    # A failed, cancelled, or timed-out run still runs this step; the test's process does not survive.
    - name: Destroy
      if: always()
      shell: bash
      run: |
        state="$RUNNER_TEMP/hcl/deployment"
        [[ -d $state ]] || exit 0
        "$NEMOCLAW_TEST_BUNDLE/bin/nemoclaw" destroy --output json --progress off --state-dir "$state" \
          > "$RUNNER_TEMP/hcl/reports/destroy.json"
    # Reports hold outcomes only; requests, replies, state, and credentials stay on the runner.
    - name: Upload observations and cleanup receipt
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: hcl-e2e-${{ inputs.case }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/hcl/reports/*.json
        if-no-files-found: ignore
        retention-days: 7
