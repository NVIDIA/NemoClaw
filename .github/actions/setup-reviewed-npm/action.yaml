name: setup-reviewed-npm
description: Install the exact npm release approved by the reviewed npm audit identity.

runs:
  using: composite
  steps:
    - name: Download, verify, and install reviewed npm
      shell: bash
      run: >-
        env -u NODE_AUTH_TOKEN -u NPM_TOKEN -u NPM_CONFIG__AUTH_TOKEN
        "$GITHUB_ACTION_PATH/verify-and-install-npm.sh"
        "$GITHUB_ACTION_PATH/../../../ci/reviewed-npm-audit.json"
