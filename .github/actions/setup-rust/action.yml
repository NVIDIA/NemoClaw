name: Set up Rust
description: Install pinned protoc and cargo-nextest, and restore third-party Rust artifacts.
inputs:
  platform:
    description: Bundle platform.
    required: true
  cache-prefix:
    description: Separate dependency caches for distinct build jobs.
    default: native-deps-v2
  save-cache:
    description: Write Rust dependencies on v1; live jobs only restore the native cache.
    default: "true"
runs:
  using: composite
  steps:
    - name: Restore verified downloads
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .build/downloads
        key: native-downloads-v1-${{ inputs.platform }}-${{ hashFiles('versions.json') }}
    # Before saving, rust-cache keeps target artifacts by crate name, not version
    # or build hash, so a cache restored from an older key also keeps every
    # earlier build. A profile change rebuilds every dependency, and new months
    # bound the slower growth from lockfile updates: either starts a fresh cache.
    - name: Select the dependency cache generation
      id: generation
      shell: bash
      run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
    - name: Restore Rust dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        prefix-key: ${{ inputs.cache-prefix }}-${{ steps.generation.outputs.month }}-${{ hashFiles('.cargo/config.toml') }}
        # Within a generation, the action restores an older cache for this
        # platform when manifests, Cargo.lock, or rust-toolchain.toml change.
        # Replace the job-specific key so native and live jobs share dependencies.
        shared-key: ${{ inputs.platform }}
        add-rust-environment-hash-key: "true"
        workspaces: . -> target
        cache-targets: "true"
        cache-all-crates: "false"
        cache-workspace-crates: "false"
        cache-bin: "false"
        save-if: ${{ github.ref == 'refs/heads/v1' && inputs.save-cache == 'true' }}
    # After the cache restore, so the runner compiles from cached dependencies.
    # It exports PROTOC and the nextest directory for later workflow steps.
    - name: Install pinned build tools
      shell: bash
      env:
        TEST_PLATFORM: ${{ inputs.platform }}
      run: |
        rustup show
        cargo ci tools
