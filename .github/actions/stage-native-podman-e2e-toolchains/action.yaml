name: stage-native-podman-e2e-toolchains
description: Copy the reviewed native Podman release assets into the current E2E run.

inputs:
  enabled:
    description: Stage the toolchains when native Podman E2E is selected.
    required: false
    default: "false"
  github-token:
    description: Read-only token for retrieving the immutable toolchain release assets.
    required: true

runs:
  using: composite
  steps:
    - name: Verify immutable native Podman E2E toolchains
      if: ${{ inputs.enabled == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        SOURCE_RELEASE_ID: "400756116"
      run: |
        set -euo pipefail
        release="$(gh api "repos/NVIDIA/NemoClaw/releases/$SOURCE_RELEASE_ID")"
        jq -e --argjson releaseId "$SOURCE_RELEASE_ID" '
          .id == $releaseId and
          .tag_name == "ci-native-podman-e2e-2026-10-01" and
          .target_commitish == "1ccec4e141b0a830229ef68c96639851d24810fd" and
          .draft == false
        ' <<<"$release" >/dev/null
        verify_asset() {
          local asset_id="$1"
          local asset_name="$2"
          local asset_digest="$3"
          local asset_size="$4"
          jq -e \
            --argjson assetId "$asset_id" \
            --arg assetName "$asset_name" \
            --arg assetDigest "$asset_digest" \
            --argjson assetSize "$asset_size" '
              [.assets[] | select(
                .id == $assetId and .name == $assetName and
                .state == "uploaded" and .digest == $assetDigest and .size == $assetSize
              )] | length == 1
            ' <<<"$release" >/dev/null
        }
        verify_asset \
          602749331 \
          podman-toolchain-amd64.zip \
          sha256:2a07674b09da33f24772936e5fc3e8d7e80dbbe096cc70e9fa32babc9177a006 \
          85029836
        verify_asset \
          602749330 \
          podman-toolchain-arm64.zip \
          sha256:dba39bc41923592bef67980e4d179c8b6d8442a6157e67621e53abf969072e3a \
          80376484

    - name: Download immutable native Podman amd64 toolchain
      if: ${{ inputs.enabled == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/native-podman-e2e-amd64.zip"
        directory="$RUNNER_TEMP/native-podman-e2e-toolchain-amd64"
        [[ ! -e "$archive" && ! -L "$archive" && ! -e "$directory" && ! -L "$directory" ]]
        gh api -H 'Accept: application/octet-stream' \
          repos/NVIDIA/NemoClaw/releases/assets/602749331 >"$archive"
        printf '%s  %s\n' \
          2a07674b09da33f24772936e5fc3e8d7e80dbbe096cc70e9fa32babc9177a006 \
          "$archive" | sha256sum --check --strict -
        mkdir "$directory"
        unzip -q "$archive" -d "$directory"
        (cd "$directory" && sha256sum --check --strict SHA256SUMS)
        rm -f "$archive"

    - name: Download immutable native Podman arm64 toolchain
      if: ${{ inputs.enabled == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/native-podman-e2e-arm64.zip"
        directory="$RUNNER_TEMP/native-podman-e2e-toolchain-arm64"
        [[ ! -e "$archive" && ! -L "$archive" && ! -e "$directory" && ! -L "$directory" ]]
        gh api -H 'Accept: application/octet-stream' \
          repos/NVIDIA/NemoClaw/releases/assets/602749330 >"$archive"
        printf '%s  %s\n' \
          dba39bc41923592bef67980e4d179c8b6d8442a6157e67621e53abf969072e3a \
          "$archive" | sha256sum --check --strict -
        mkdir "$directory"
        unzip -q "$archive" -d "$directory"
        (cd "$directory" && sha256sum --check --strict SHA256SUMS)
        rm -f "$archive"

    - name: Publish native Podman amd64 toolchain for this run
      if: ${{ inputs.enabled == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: native-podman-e2e-toolchain-amd64
        path: ${{ runner.temp }}/native-podman-e2e-toolchain-amd64/
        if-no-files-found: error
        retention-days: 3
        compression-level: 0

    - name: Publish native Podman arm64 toolchain for this run
      if: ${{ inputs.enabled == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: native-podman-e2e-toolchain-arm64
        path: ${{ runner.temp }}/native-podman-e2e-toolchain-arm64/
        if-no-files-found: error
        retention-days: 3
        compression-level: 0
