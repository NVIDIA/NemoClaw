name: stage-native-podman-e2e-toolchains
description: Copy the reviewed native Podman toolchains into the current E2E run.

inputs:
  enabled:
    description: Stage the toolchains when native Podman E2E is selected.
    required: false
    default: "false"
  github-token:
    description: Read-only token for retrieving the immutable source-run artifacts.
    required: true

runs:
  using: composite
  steps:
    - name: Verify immutable native Podman E2E toolchains
      if: ${{ inputs.enabled == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        SOURCE_RUN_ID: "37725998591"
      run: |
        set -euo pipefail
        verify_artifact() {
          local artifact_id="$1"
          local artifact_name="$2"
          local artifact_digest="$3"
          gh api "repos/NVIDIA/NemoClaw/actions/artifacts/$artifact_id" \
            --jq '[.id,.name,.expired,.digest,.workflow_run.id] | @tsv' \
            | awk -F '\t' \
                -v expected_id="$artifact_id" \
                -v expected_name="$artifact_name" \
                -v expected_digest="$artifact_digest" \
                -v expected_run="$SOURCE_RUN_ID" \
                '$1 == expected_id && $2 == expected_name && $3 == "false" && $4 == expected_digest && $5 == expected_run { found = 1 }
                 END { exit found ? 0 : 1 }'
        }
        verify_artifact \
          11528275310 \
          native-podman-e2e-toolchain-amd64 \
          sha256:787e6ddeb8409c8a7b9f92716053d93bc16d7f6240e9137208addb9f56f65c55
        verify_artifact \
          11528091073 \
          native-podman-e2e-toolchain-arm64 \
          sha256:1af259cd34db77bbe8f41c63b0f45c09c25a78265f0da53a9eb38431f4898f7a

    - name: Download immutable native Podman amd64 toolchain
      if: ${{ inputs.enabled == 'true' }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        github-token: ${{ inputs.github-token }}
        repository: NVIDIA/NemoClaw
        run-id: "37725998591"
        artifact-ids: "11528275310"
        path: ${{ runner.temp }}/native-podman-e2e-toolchain-amd64

    - name: Download immutable native Podman arm64 toolchain
      if: ${{ inputs.enabled == 'true' }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        github-token: ${{ inputs.github-token }}
        repository: NVIDIA/NemoClaw
        run-id: "37725998591"
        artifact-ids: "11528091073"
        path: ${{ runner.temp }}/native-podman-e2e-toolchain-arm64

    - name: Publish native Podman amd64 toolchain for this run
      if: ${{ inputs.enabled == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: native-podman-e2e-toolchain-amd64
        path: ${{ runner.temp }}/native-podman-e2e-toolchain-amd64/
        if-no-files-found: error
        retention-days: 3
        compression-level: 0

    - name: Publish native Podman arm64 toolchain for this run
      if: ${{ inputs.enabled == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: native-podman-e2e-toolchain-arm64
        path: ${{ runner.temp }}/native-podman-e2e-toolchain-arm64/
        if-no-files-found: error
        retention-days: 3
        compression-level: 0
