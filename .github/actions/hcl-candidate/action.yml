name: Build a Live / HCL candidate
description: Build the bundle, the e2e test executable, and the agent images that Live / HCL's case jobs run, from the checkout.
inputs:
  platform:
    description: Bundle platform.
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-rust
      with:
        platform: ${{ inputs.platform }}
        cache-prefix: hcl-deps-v1
        save-cache: ${{ inputs.platform == 'linux_amd64' }}
    # The image builds' pinned sources, as CI / Images saved them.
    - name: Restore the verified image sources
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .build/downloads
        key: image-sources-v1-${{ hashFiles('versions.json') }}
    - if: inputs.platform == 'linux_amd64'
      uses: ./.github/actions/containerd-store
    - name: Build the bundle, test executable, and agent images
      shell: bash
      env:
        TEST_PLATFORM: ${{ inputs.platform }}
      run: |
        cargo ci bundle
        executable=$(cargo test --locked -p nemoclaw-e2e --test e2e --no-run --message-format=json |
          jq -r 'select(.reason == "compiler-artifact" and .target.name == "e2e" and .profile.test) | .executable' | tail -1)
        mkdir -p .build
        cp "$executable" .build/e2e
        cargo images build --platform "linux/${TEST_PLATFORM#linux_}" openclaw hermes
