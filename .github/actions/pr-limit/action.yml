name: Enforce contributor PR limit
description: Close a pull request and fail its check when its author exceeds the configured open PR limit.
inputs:
  token:
    description: GitHub token used to list, comment on, and close pull requests.
    required: true
runs:
  using: node24
  main: index.mjs
