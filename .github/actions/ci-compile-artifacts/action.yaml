name: ci-compile-artifacts
description: Restore or build the complete CLI and plugin outputs for the checked-out commit.

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "22.23.2"
        cache: npm
        cache-dependency-path: |
          package-lock.json
          nemoclaw/package-lock.json

    - name: Identify compiled output
      id: identity
      shell: bash
      run: node "$GITHUB_ACTION_PATH/compiled-artifact.mts" identity

    - name: Restore compiled CLI and plugin
      id: cache
      uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        key: ${{ steps.identity.outputs.key }}
        path: |
          dist
          nemoclaw/dist

    - name: Remove outputs after a cache miss
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: rm -rf -- dist nemoclaw/dist

    - name: Install dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ github.event_name == 'push' && github.token || '' }}
      run: bash "$GITHUB_ACTION_PATH/../ci-install-dependencies.sh"

    - name: Compile CLI and plugin
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        npm --prefix nemoclaw run build
        npm run build:cli

    - name: Verify compiled CLI and plugin
      shell: bash
      run: |
        set -euo pipefail
        node "$GITHUB_ACTION_PATH/compiled-artifact.mts" verify
        node "$GITHUB_ACTION_PATH/../../../scripts/check-dist-sourcemaps.mts" dist

    - name: Save compiled CLI and plugin
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        key: ${{ steps.identity.outputs.key }}
        path: |
          dist
          nemoclaw/dist

    - name: Report compiled output preparation
      if: always()
      shell: bash
      env:
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        CACHE_KEY: ${{ steps.identity.outputs.key }}
        SOURCE_SHA: ${{ steps.identity.outputs.sha }}
        PREPARATION_RESULT: ${{ job.status }}
      run: |
        {
          echo '### Compiled CLI and plugin'
          printf 'Source: `%s`\n\n' "$SOURCE_SHA"
          printf 'Cache key: `%s`\n\n' "$CACHE_KEY"
          printf 'Result: %s. Cache hit: %s.\n\n' "$PREPARATION_RESULT" "${CACHE_HIT:-false}"
          if [[ "$CACHE_HIT" == "true" && "$PREPARATION_RESULT" == "failure" ]]; then
            printf 'Delete the rejected cache with `gh cache delete "%s" --repo "%s"`, then rerun the failed jobs.\n' "$CACHE_KEY" "$GITHUB_REPOSITORY"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
