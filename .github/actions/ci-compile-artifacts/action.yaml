name: ci-compile-artifacts
description: Compile and verify fixed CLI and plugin outputs from the caller workspace.

inputs: {}

outputs:
  cli-dist:
    description: Fixed caller-workspace path containing verified CLI outputs.
    value: dist
  plugin-dist:
    description: Fixed caller-workspace path containing verified plugin outputs.
    value: nemoclaw/dist

runs:
  using: composite
  steps:
    - name: Compile and verify outputs
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/compile.sh"
