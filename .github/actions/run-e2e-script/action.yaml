name: Run E2E script

description: >-
  Runs a repository E2E script from an already-checked-out workspace and uploads
  the configured artifacts when the script fails.

inputs:
  script:
    description: Repository-relative E2E script path.
    required: true
  working-directory:
    description: Directory to run the script from.
    required: false
    default: .
  artifact-name:
    description: Failure artifact name.
    required: true
  artifact-path:
    description: Newline-capable artifact path glob list.
    required: true

runs:
  using: composite
  steps:
    - name: Run E2E script
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bash "${{ inputs.script }}"

    - name: Upload E2E artifacts on failure
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.artifact-path }}
        if-no-files-found: ignore
