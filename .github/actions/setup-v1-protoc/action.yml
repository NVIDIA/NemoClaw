name: Set up the pinned v1 protoc
description: Install the protoc that the pinned v1 SDK build runs; install.sh holds the pins.
runs:
  using: composite
  steps:
    - name: Install the protoc pinned by v1
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/install.sh" "${{ runner.os }}-${{ runner.arch }}"
