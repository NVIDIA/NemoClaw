name: ci-installer-integration
description: Run CI-gated installer integration Vitest tests.

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: |
          package-lock.json
          nemoclaw/package-lock.json

    - name: Install dependencies
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ github.event_name == 'push' && github.token || '' }}
      run: bash "$GITHUB_ACTION_PATH/../ci-install-dependencies.sh"

    - name: Build installer integration artifacts
      shell: bash
      run: |
        npm run build:cli
        cd nemoclaw && npm run build

    - name: Run installer integration tests
      shell: bash
      run: CI=true npx vitest run --project installer-integration
