name: Set up v1 documentation tools
description: Prepare pinned Rust, protoc, Node, and npm tools on Linux AMD64.
inputs:
  rust:
    description: Set up Rust and protoc to compile the build tool; jobs that download it need only Node and npm.
    default: "true"
runs:
  using: composite
  steps:
    - name: Set up Node for Fern
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "24.21.0"
        package-manager-cache: false
    - name: Install reviewed npm
      uses: NVIDIA/NemoClaw/.github/actions/setup-reviewed-npm@98669f24d35f18e49b6b2769cd68709509ea24f2
    # Restore the cache that CI / Bundle saves on every v1 push rather than
    # keeping a docs cache: rust-cache never saved one from this nested action.
    # The bundle job builds `--package nemoclaw-build` with the same resolved
    # features as the docs build; the test job's workspace build unifies dev
    # features such as tokio's test-util, so about 50 crates would rebuild.
    - uses: ./.github/actions/setup-rust
      if: inputs.rust == 'true'
      with:
        platform: linux_amd64
        cache-prefix: native-bundle-v2
        save-cache: "false"
