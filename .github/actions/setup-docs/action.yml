name: Set up v1 documentation tools
description: Prepare pinned Rust, protoc, Node, and npm tools on Linux AMD64.
inputs:
  rust:
    description: Set up Rust and protoc to compile the build tool; jobs that download it need only Node and npm.
    default: "true"
runs:
  using: composite
  steps:
    - name: Set up Node for Fern
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24.21.0"
        package-manager-cache: false
    - name: Install reviewed npm
      uses: NVIDIA/NemoClaw/.github/actions/setup-reviewed-npm@98669f24d35f18e49b6b2769cd68709509ea24f2
    - uses: ./.github/actions/setup-rust
      if: inputs.rust == 'true'
      with:
        platform: linux_amd64
        cache-prefix: docs-v1
