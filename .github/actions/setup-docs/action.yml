name: Set up v1 documentation tools
description: Prepare pinned Rust, protoc, Node, and npm tools on Linux AMD64.
runs:
  using: composite
  steps:
    - name: Set up Node for Fern
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "24.18.1"
        package-manager-cache: false
    - name: Install reviewed npm
      uses: NVIDIA/NemoClaw/.github/actions/setup-reviewed-npm@98669f24d35f18e49b6b2769cd68709509ea24f2
    - name: Install pinned local build tools
      shell: bash
      run: |
        rustup show
        python3 - <<'PY'
        import hashlib, io, json, os, pathlib, urllib.request, zipfile
        root = pathlib.Path.cwd()
        pin = json.loads((root / 'versions.json').read_text())['platforms']['linux_amd64']['protoc']
        data = urllib.request.urlopen(pin['url'], timeout=120).read()
        if hashlib.sha256(data).hexdigest() != pin['sha256']:
            raise SystemExit('protoc checksum mismatch')
        destination = root / '.tools/protoc'
        with zipfile.ZipFile(io.BytesIO(data)) as archive:
            archive.extractall(destination)
        binary = destination / 'bin/protoc'
        binary.chmod(0o755)
        with open(os.environ['GITHUB_ENV'], 'a') as output:
            output.write(f'PROTOC={binary}\n')
        PY
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        prefix-key: docs-v1
        cache-workspace-crates: "false"
        cache-bin: "false"
