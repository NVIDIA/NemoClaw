name: Set up v1 documentation tools
description: Prepare pinned Rust, protoc, Node, and npm tools on Linux AMD64.
runs:
  using: composite
  steps:
    - name: Set up Node for Fern
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "24.21.0"
        package-manager-cache: false
    - name: Install reviewed npm
      uses: NVIDIA/NemoClaw/.github/actions/setup-reviewed-npm@98669f24d35f18e49b6b2769cd68709509ea24f2
    - uses: ./.github/actions/setup-rust
      with:
        platform: linux_amd64
        cache-prefix: docs-v1
