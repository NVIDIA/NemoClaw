name: Feature Request
description: Propose a concrete behavior that solves a real problem.
type: Enhancement
labels: ["needs: triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve? Why does it matter?
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: Desired Behavior
      description: |
        What should a user or contributor be able to do or observe?
        Describe the before-and-after behavior and give one concrete example.
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints and Non-goals
      description: List only current constraints or exclusions that materially change the solution.
    validations:
      required: false

  - type: textarea
    id: scope
    attributes:
      label: Scope and Exclusions
      description: |
        What should be included, and what should stay out of scope?
        Use "unknown" or "not applicable" with a short explanation when needed.
    validations:
      required: true

  - type: textarea
    id: owner
    attributes:
      label: Proposed Ongoing Owner
      description: |
        Who would own compatibility, upgrades, security review, testing, and user support after merge?
        Use "unknown" or "not applicable" with a short explanation when needed.
    validations:
      required: true

  - type: textarea
    id: placement
    attributes:
      label: Requested Placement and Support Expectations
      description: |
        Should this live in canonical NemoClaw, NemoClaw Community, documentation, examples, tests, or another existing project area?
        Describe the support expectation users should have after merge.
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validation Plan
      description: |
        Which tests, checks, or live evidence should prove the behavior?
        Use "unknown" with a short explanation when the validation boundary needs maintainer guidance.
    validations:
      required: true

  - type: textarea
    id: compatibility
    attributes:
      label: Supported Versions and Platforms
      description: |
        Which NemoClaw versions, operating systems, hardware targets, providers, sandboxes, or deployment modes should this support?
        Use "not applicable" with a short explanation for changes that do not affect compatibility.
    validations:
      required: true

  - type: textarea
    id: security_privacy
    attributes:
      label: Security or Privacy Impact
      description: |
        Does this affect credentials, policy, sandboxing, networking, user data, logs, telemetry, or external services?
        Use "none expected" with a short explanation when there is no expected impact.
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: Implementation Idea
      description: |
        Optional, non-binding notes about the smallest direct change that might work.
        Do not design for hypothetical future cases.
    validations:
      required: false

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - "Feature"
        - "Provider"
        - "Platform"
        - "Testing"
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I described the problem and desired behavior
          required: true
        - label: I included scope, ownership, placement, validation, compatibility, and security or privacy impact, using "unknown" or "not applicable" with explanations where needed
          required: true
