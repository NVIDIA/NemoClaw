version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # CodeQL steps exchange state and reject mixed action versions.
      codeql-action:
        patterns:
          - "github/codeql-action/*"

  # The v1 development branch keeps its own workflows and composite actions.
  # Dependabot reads this file only from the default branch.
  - package-ecosystem: "github-actions"
    target-branch: "v1"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "v1"
    # The organization allows taiki-e/install-action only at listed commits.
    # v1 pins 43aecc8d72668fbcfe75c31400bc4f890f1c5853, which is allowed.
    # Every proposed bump fails v1's workflow test and would leave
    # CI / Dependencies unable to start (see #13612 and #14217).
    # Remove this ignore once the organization allows a newer commit.
    ignore:
      - dependency-name: "taiki-e/install-action"
