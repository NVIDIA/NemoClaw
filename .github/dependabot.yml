version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # CodeQL steps exchange state and reject mixed action versions.
      codeql-action:
        patterns:
          - "github/codeql-action/*"

  # The v1 development branch keeps its own workflows and composite actions.
  # Dependabot reads this file only from the default branch.
  - package-ecosystem: "github-actions"
    target-branch: "v1"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "v1"
