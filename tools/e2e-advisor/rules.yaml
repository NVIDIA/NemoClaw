# Prototype deterministic layer for E2E advisor. Rules classify risk domains
# from changed files. The advisor then maps domains to manifest tests.

version: 1
rules:
  - id: docs-only
    domain: docs
    confidence: high
    reason: Documentation or doc tooling changed.
    any:
      - '^docs/'
      - '^README\.md$'
      - '^CHANGELOG\.md$'
      - '^\.github/workflows/docs-'
      - '^test/e2e/test-docs-validation\.sh$'
    optional_tests: [docs-validation-e2e]

  - id: e2e-inventory-or-ci
    domain: e2e-infra
    confidence: high
    reason: E2E workflow, manifest, script, or advisor policy changed.
    any:
      - '^\.github/workflows/.*e2e.*\.ya?ml$'
      - '^test/e2e/'
      - '^tools/e2e-advisor/'
    optional_tests: [docs-validation-e2e]

  - id: installer-onboard
    domain: onboard
    confidence: high
    reason: Installer or onboarding path changed.
    any:
      - '^install\.sh$'
      - '^scripts/(install|launch|onboard|setup|nemoclaw-start|spark-install|brev-launchable).*'
      - '^bin/lib/(onboard|preflight|install|config|credentials).*'
      - '^bin/commands/onboard.*'
      - '^nemoclaw/src/onboard/'
    required_tests: [cloud-onboard-e2e, double-onboard-e2e]
    optional_tests: [onboard-repair-e2e, onboard-resume-e2e, cloud-e2e]

  - id: sandbox-entrypoint-security
    domain: landlock
    confidence: high
    reason: Sandbox entrypoint, Docker image, OpenShell, or security-sensitive startup path changed.
    any:
      - '^Dockerfile$'
      - '^docker/'
      - '^scripts/(nemoclaw-start|lib/sandbox-init|sandbox|openshell).*'
      - '^nemoclaw-blueprint/(Dockerfile|.*blueprint.*|policies/)'
      - '^package(-lock)?\.json$'
    required_tests: [cloud-onboard-e2e, issue-2478-crash-loop-recovery-e2e]
    optional_tests: [sandbox-survival-e2e, cloud-e2e]

  - id: gateway-auth-credentials
    domain: credentials
    confidence: high
    reason: Gateway auth, provider credentials, token handling, or credential storage changed.
    any:
      - '^bin/lib/(credentials|auth|gateway|provider|providers|token).*'
      - '^bin/.*(credential|auth|token|provider).*'
      - '^nemoclaw/src/.*(credential|auth|token|provider).*'
      - '^scripts/.*(credential|auth|token|provider).*'
    required_tests: [credential-sanitization-e2e, credential-migration-e2e, inference-routing-e2e]
    optional_tests: [token-rotation-e2e, shields-config-e2e]

  - id: inference-proxy-routing
    domain: proxy
    confidence: high
    reason: Inference routing, proxy rewrite, SSRF, compatible endpoint, or inference-local path changed.
    any:
      - '^nemoclaw-blueprint/scripts/.*(proxy|inference|ssrf|routing).*'
      - '^nemoclaw/src/.*(proxy|inference|ssrf|routing).*'
      - '^bin/lib/.*(proxy|inference|routing|provider).*'
      - '^test/.*(proxy|inference|routing|ssrf).*'
    required_tests: [inference-routing-e2e, messaging-compatible-endpoint-e2e]
    optional_tests: [cloud-inference-e2e, kimi-inference-compat-e2e]
    gap_if_missing: forward-mode-proxy

  - id: network-policy-security
    domain: network-policy
    confidence: high
    reason: Network policy, SSRF enforcement, egress allowlist, or hot-reload changed.
    any:
      - '^nemoclaw-blueprint/policies/'
      - '^nemoclaw/src/.*(policy|ssrf|network|egress).*'
      - '^bin/lib/.*(policy|ssrf|network|egress).*'
      - '^scripts/.*(policy|ssrf|network|egress).*'
    required_tests: [network-policy-e2e]
    optional_tests: [cloud-onboard-e2e, shields-config-e2e]

  - id: sandbox-lifecycle
    domain: lifecycle
    confidence: high
    reason: Sandbox lifecycle command path changed.
    any:
      - '^bin/.*(sandbox|rebuild|snapshot|upgrade|destroy|status|logs|connect).*'
      - '^nemoclaw/src/(commands|blueprint)/.*(sandbox|rebuild|snapshot|upgrade|destroy|status|logs|connect).*'
      - '^scripts/.*(sandbox|rebuild|snapshot|upgrade|destroy).*'
    required_tests: [sandbox-operations-e2e, sandbox-survival-e2e]
    optional_tests: [snapshot-commands-e2e, rebuild-openclaw-e2e, upgrade-stale-sandbox-e2e]

  - id: rebuild-upgrade
    domain: rebuild
    confidence: high
    reason: Rebuild or upgrade behavior changed.
    any:
      - '^bin/.*(rebuild|upgrade).*'
      - '^nemoclaw/src/.*(rebuild|upgrade).*'
      - '^scripts/.*(rebuild|upgrade).*'
    required_tests: [rebuild-openclaw-e2e, upgrade-stale-sandbox-e2e]
    optional_tests: [rebuild-hermes-e2e]
    gap_if_missing: rebuild-failure-recovery

  - id: snapshot
    domain: snapshot
    confidence: high
    reason: Snapshot command or state path changed.
    any:
      - '^bin/.*snapshot.*'
      - '^nemoclaw/src/.*snapshot.*'
      - '^scripts/.*snapshot.*'
    required_tests: [snapshot-commands-e2e]

  - id: messaging
    domain: messaging
    confidence: high
    reason: Messaging provider integration changed.
    any:
      - '^bin/.*(telegram|discord|slack|messag|hermes).*'
      - '^nemoclaw/src/.*(telegram|discord|slack|messag|hermes).*'
      - '^scripts/.*(telegram|discord|slack|messag|hermes).*'
      - '^nemoclaw-blueprint/.*(telegram|discord|slack|messag|hermes).*'
    required_tests: [messaging-providers-e2e]
    optional_tests: [telegram-injection-e2e, token-rotation-e2e]

  - id: hermes
    domain: hermes
    confidence: high
    reason: Hermes agent path changed.
    any:
      - '^bin/.*hermes.*'
      - '^nemoclaw/src/.*hermes.*'
      - '^scripts/.*hermes.*'
    required_tests: [hermes-e2e]
    optional_tests: [hermes-discord-e2e, hermes-slack-e2e, rebuild-hermes-e2e]

  - id: gpu-ollama
    domain: gpu
    confidence: high
    reason: GPU, Ollama, or local inference path changed.
    any:
      - '^bin/.*(gpu|ollama|local-inference).*'
      - '^nemoclaw/src/.*(gpu|ollama|local-inference).*'
      - '^scripts/.*(gpu|ollama|local-inference).*'
      - '^test/e2e/.*gpu.*'
      - '^test/e2e/.*ollama.*'
    required_tests: [ollama-proxy-e2e]
    optional_tests: [gpu-e2e, gpu-double-onboard-e2e]

  - id: launchable-community
    domain: launchable
    confidence: high
    reason: Community launchable install path changed.
    any:
      - '^scripts/.*launchable.*'
      - '^test/e2e/test-launchable-smoke\.sh$'
      - '^\.github/workflows/.*launchable.*\.ya?ml$'
    required_tests: [launchable-smoke-e2e]

  - id: platform-docker
    domain: platform
    confidence: medium
    reason: Docker/platform compatibility path changed.
    any:
      - '^Dockerfile$'
      - '^\.dockerignore$'
      - '^scripts/.*(docker|overlayfs|colima|wsl|macos|spark).*'
      - '^\.github/workflows/(wsl|macos|pr-self-hosted).*\.ya?ml$'
    required_tests: [overlayfs-autofix-e2e]
    optional_tests: [launchable-smoke-e2e]

gaps:
  forward-mode-proxy:
    domain: proxy
    priority: medium
    reason: Custom OpenAI-compatible/FORWARD-mode paths have historically escaped full sandbox E2E coverage.
    suggested_test: Configure a custom OpenAI-compatible endpoint and verify a chat completion traverses sandbox -> gateway -> FORWARD proxy -> mock upstream without leaking provider fields.
  rebuild-failure-recovery:
    domain: rebuild
    priority: medium
    reason: Happy-path rebuild coverage does not prove rollback/backup behavior when recreate fails.
    suggested_test: Force rebuild recreate failure after backup, then verify the original sandbox/workspace remains usable.
