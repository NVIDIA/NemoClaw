version: 1

filesystem_policy:
  include_workdir: false
  read_only:
    - /usr/bin
    - /usr/lib
    - /usr/share/git-core
    - /etc
    - /sandbox/repo
    - /sandbox/config
  read_write:
    - /dev
    - /sandbox/output

landlock:
  compatibility: hard_requirement

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies: {}
