version: 1

filesystem_policy:
  include_workdir: false
  read_only:
    - /usr
    - /bin
    - /lib
    - /lib64
    - /etc
    - /proc
  read_write:
    - /dev
    - /sandbox

landlock:
  compatibility: hard_requirement

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  public_npm:
    name: public_npm
    endpoints:
      - host: registry.npmjs.org
        port: 443
        access: full
        tls: skip
    binaries:
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/node }
