apiVersion: nemoclaw.nvidia.com/v1alpha1
kind: NemoClawConfig
metadata:
  name: local-agent
  uid: 87d485ad-fba7-4197-9eaa-aa97cc97446b
spec:
  gateway:
    management: external
    endpoint: http://127.0.0.1:17671
  inferenceProviders:
    - name: local
      provider: openai
      endpoint: http://172.20.0.1:11436/v1
      ollama:
        engine: unix:///var/run/docker.sock
        image: ollama/ollama@sha256:684d8674b4315fa18f4f0e973a118ec2652ed96f67563277839985175858e0ba
        network: nc-prototype-slice
  sandboxes:
    - name: assistant
      image:
        ref: nc-multi-models@sha256:3ab70ded67440e838a37d6c9f0e3b08b95e2acf416c6076f8817bac190525cf0
      runtime:
        provider: docker
      network:
        tier: isolated
      harness:
        kind: openclaw
      agents:
        - name: main
          inference:
            routes:
              - name: primary
                providerRef: local
                overrides:
                  model: qwen3:0.6b
