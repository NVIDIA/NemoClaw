apiVersion: nemoclaw.nvidia.com/v1alpha1
kind: NemoClawConfig
metadata:
  name: local-agent
  uid: 87d485ad-fba7-4197-9eaa-aa97cc97446b
spec:
  gateway:
    management: external
    endpoint: http://127.0.0.1:17671
  inferenceProviders:
    - name: local
      provider: openai
      endpoint: http://172.20.0.1:11436/v1
      ollama:
        engine: unix:///var/run/docker.sock
        image: ollama/ollama@sha256:684d8674b4315fa18f4f0e973a118ec2652ed96f67563277839985175858e0ba
        network: nc-prototype-slice
  sandboxes:
    - name: assistant
      image:
        ref: nc-prototype-fabric@sha256:a608340846053d881c3c6b3bdd7541d4f2f53236deaaef8e0b8f44afd8d4e8dd
      runtime:
        provider: docker
      network:
        tier: isolated
      agents:
        - name: main
          harness: openclaw
          inference:
            routes:
              - name: primary
                providerRef: local
                overrides:
                  model: qwen3:0.6b
