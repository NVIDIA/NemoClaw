# yaml-language-server: $schema=../schemas/nemoclaw-v1alpha1.schema.json

apiVersion: nemoclaw.nvidia.com/v1alpha1
kind: NemoClawConfig
metadata:
  name: local-agent
  uid: 87d485ad-fba7-4197-9eaa-aa97cc97446b
spec:
  gateway:
    management: managed
    endpoint: http://127.0.0.1:17671
    engine: unix:///var/run/docker.sock
    image:
      ghcr.io/nvidia/openshell/gateway@sha256:fa785f7e07e6412c2b1b5dc537f4fa0c1c49ffa55614863d4543fe8d1d3701da
    networkCIDR: 172.20.0.0/24
  services:
    ollama-server:
      kind: ollama
      hardware: {profile: dgx-spark}
      image: nc-prototype-ollama@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      model:
        name: qwen3:0.6b
        digest: 7df6b6e09427a769808717c0a93cadc4ae99ed4eb8bf5ca557c90846becea435
      serving:
        contextTokens: 8192
      memory:
        gpuMemoryGiB: 16
  inferenceProviders:
    - name: local
      provider: openai
      serviceRef: ollama-server
  sandboxes:
    - name: assistant
      runtime:
        provider: docker
      network:
        tier: isolated
      harness:
        kind: nvidia.fabric.openclaw
      agent:
        name: main
        inference:
          routes:
            - name: primary
              providerRef: local
              overrides:
                model: qwen3:0.6b
