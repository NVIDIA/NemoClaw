# Replace the fixture endpoint/model with your own compatible service.
# See docs/reference/fabric-harnesses.md for protocol requirements and test commands.
apiVersion: nemoclaw.nvidia.com/v1alpha1
kind: NemoClawConfig
metadata:
  name: fabric-nooa-bench
  uid: 1533935c-7ff1-4c28-9a68-c42ef3dd2fb3
spec:
  gateway:
    management: external
    endpoint: http://127.0.0.1:17681
  inferenceProviders:
    - name: local
      provider: openai
      endpoint: http://172.20.0.1:11446/v1
  sandboxes:
    - name: assistant
      image:
        ref: nc-prototype-fabric@sha256:deaa2580e46f5d27105c7051771d36da36c5879ac2fea98e6b22cd651c910260
      runtime:
        provider: docker
      network:
        tier: isolated
      harness:
        kind: nooa-bench
      agent:
        name: main
        inference:
          routes:
            - name: primary
              providerRef: local
              overrides:
                model: fixture-model
