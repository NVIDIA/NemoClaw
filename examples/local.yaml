# yaml-language-server: $schema=../schemas/nemoclaw-v1alpha1.schema.json

apiVersion: nemoclaw.nvidia.com/v1alpha1
kind: NemoClawConfig
metadata:
  name: local-agent
  uid: 87d485ad-fba7-4197-9eaa-aa97cc97446b
spec:
  gateway:
    management: external
    endpoint: http://127.0.0.1:17671
  inferenceProviders:
    - name: local
      provider: openai
      endpoint: http://172.20.0.1:11436/v1
  sandboxes:
    - name: assistant
      runtime:
        provider: docker
      network:
        tier: isolated
      harness:
        kind: openclaw
      agents:
        - name: main
          inference:
            routes:
              - name: primary
                providerRef: local
                overrides:
                  model: qwen3.5:0.8b
