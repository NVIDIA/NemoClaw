# yaml-language-server: $schema=../../schemas/nemoclaw-v1alpha1.schema.json
# Express template for `nemoclaw onboard`; the command assigns a new deployment UID.
apiVersion: nemoclaw.nvidia.com/v1alpha1
kind: NemoClawConfig
metadata:
  name: openclaw-nvidia-hosted
  uid: 12345678-1234-4234-9234-123456789abc
spec:
  gateway:
    management: managed
    runtime:
      provider: docker
  inferenceProviders:
    nvidia-prod:
      provider: openai
      api: openai-completions
      endpoint: https://integrate.api.nvidia.com/v1
      credential:
        env: NVIDIA_API_KEY
  sandboxes:
    assistant:
      harness:
        kind: nvidia.fabric.openclaw
      agent:
        name: primary
        inference:
          routes:
            - name: primary
              providerRef: nvidia-prod
              overrides:
                model: nvidia/nemotron-3.5-super-vl-120b-a12b
