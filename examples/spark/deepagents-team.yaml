# yaml-language-server: $schema=../../schemas/nemoclaw-v1alpha1.schema.json
# Build current images and replace these local digests and the deployment UID.
# Model sources, host requirements, and validation limits: README.md.
apiVersion: nemoclaw.nvidia.com/v1alpha1
kind: NemoClawConfig
metadata:
  name: spark-deepagents-team
  uid: 280334c4-330a-4d14-98ee-963627893a67
spec:
  gateway:
    management: managed
    endpoint: http://127.0.0.1:17802
    networkCIDR: 172.30.162.0/24
  services:
    local:
      kind: vllm
      hardware:
        profile: dgx-spark
      image: nc-prototype-vllm@sha256:a08d7d6542a20cff9a7f5303e100f71a121d241d0e33fc3be5da6ad6d3bc0c31
      authentication: bearer
      model:
        repository: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
        revision: bee7596271d1495f6992ae224aefde4410e816b8
      serving:
        toolParser: qwen3_xml
        reasoningParser: nemotron_v3
        port: 19002
        contextTokens: 32768
        maxSequences: 2
        batchTokens: 1024
        startupTimeoutSeconds: 1800
        mambaBackend: flashinfer
      memory:
        gpuMemoryGiB: 36
        hostReserveGiB: 32
        kvCacheGiB: 4
        minAvailableGiB: 8
        minFreeGiB: 3
        freeGateGiB: 12
        consecutiveSamples: 5
  inferenceProviders:
    - name: local
      provider: openai
      serviceRef: local
  sandboxes:
    - name: researcher
      image:
        ref: nc-fabric@sha256:f4a2f7068525f55f1dc25e77dfcc07998a32bd19f44ad75a61e304e255440f56
      runtime:
        provider: docker
      network:
        tier: isolated
      harness:
        kind: nvidia.fabric.langchain.deepagents
        execution:
          timeoutSeconds: 300
      agent:
        name: researcher
        inference:
          routes:
            - name: primary
              providerRef: local
              overrides:
                model: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
                maxTokens: 1024
        tools:
          allow:
            - read
    - name: writer
      image:
        ref: nc-fabric@sha256:f4a2f7068525f55f1dc25e77dfcc07998a32bd19f44ad75a61e304e255440f56
      runtime:
        provider: docker
      network:
        tier: isolated
      harness:
        kind: nvidia.fabric.langchain.deepagents
        execution:
          timeoutSeconds: 300
      agent:
        name: writer
        inference:
          routes:
            - name: primary
              providerRef: local
              overrides:
                model: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
                maxTokens: 1024
