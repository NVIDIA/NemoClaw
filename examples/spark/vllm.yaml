# yaml-language-server: $schema=../../schemas/nemoclaw-v1alpha1.schema.json
apiVersion: nemoclaw.nvidia.com/v1alpha1
kind: NemoClawConfig
metadata:
  name: qwen3-selected-model
  uid: b89a891a-5fb9-4314-8fba-448928c8312b
spec:
  gateway:
    management: managed
    endpoint: http://127.0.0.1:17695
    engine: unix:///var/run/docker.sock
    image: ghcr.io/nvidia/openshell/gateway@sha256:ec2b0efea84fff198e888e97c85befb9c908acde92e8256f9b527877ed182d66
    networkCIDR: 172.30.121.0/24
  services:
    qwen:
      kind: vllm
      hardware:
        profile: dgx-spark
      image: nc-prototype-vllm@sha256:e3f95d68664394c97ed9ea31f55f2183a5f1b6f07a61ffa15177f5dcacdb8b5e
      model:
        repository: Qwen/Qwen3-4B
        revision: 1cfa9a7208912126459214e8b04321603b3df60c
      serving:
        toolParser: hermes
        reasoningParser: qwen3
        port: 18898
        contextTokens: 32768
        maxSequences: 1
        batchTokens: 1024
        speculativeTokens: 0
        startupTimeoutSeconds: 1800
      memory:
        gpuMemoryGiB: 20
        hostReserveGiB: 32
        kvCacheGiB: 6
        minAvailableGiB: 8
        minFreeGiB: 3
        freeGateGiB: 12
        consecutiveSamples: 5
  inferenceProviders:
    - name: qwen
      provider: openai
      serviceRef: qwen
  sandboxes:
    - name: assistant
      runtime:
        provider: docker
      network:
        tier: isolated
      harness:
        kind: openclaw
      agent:
        name: assistant
        inference:
          routes:
            - name: primary
              providerRef: qwen
              overrides:
                model: Qwen/Qwen3-4B
