# yaml-language-server: $schema=../../schemas/nemoclaw-v1alpha1.schema.json
# Build current images and replace these local digests and the deployment UID.
# Model sources, host requirements, and validation limits: README.md.
apiVersion: nemoclaw.nvidia.com/v1alpha1
kind: NemoClawConfig
metadata:
  name: spark-shared-model
  uid: d1f052ca-1237-4e3f-97ed-fe0b84b68c70
spec:
  gateway:
    management: managed
    endpoint: http://127.0.0.1:17803
    networkCIDR: 172.30.163.0/24
  services:
    shared:
      kind: vllm
      hardware:
        profile: dgx-spark
      image: nc-prototype-vllm@sha256:a08d7d6542a20cff9a7f5303e100f71a121d241d0e33fc3be5da6ad6d3bc0c31
      authentication: bearer
      model:
        repository: nvidia/Qwen3.6-35B-A3B-NVFP4
        revision: 1355db6a052410cfd62085d94b58866fd0f2c3c5
      serving:
        toolParser: qwen3_coder
        reasoningParser: qwen3
        port: 19003
        contextTokens: 32768
        maxSequences: 2
        batchTokens: 1024
        startupTimeoutSeconds: 1800
      memory:
        gpuMemoryGiB: 36
        hostReserveGiB: 32
        kvCacheGiB: 4
        minAvailableGiB: 8
        minFreeGiB: 3
        freeGateGiB: 12
        consecutiveSamples: 5
  inferenceProviders:
  - name: shared
    provider: openai
    serviceRef: shared
  sandboxes:
  - name: pi
    image:
      ref: nc-fabric@sha256:ac526ed31206c90557c7ac313400586e5347bee2c142efa4708256b122a81284
    runtime:
      provider: docker
    network:
      tier: isolated
    harness:
      kind: pi
      execution:
        timeoutSeconds: 300
    agent:
      name: assistant
      inference:
        routes:
        - name: primary
          providerRef: shared
          overrides:
            model: nvidia/Qwen3.6-35B-A3B-NVFP4
            piModel:
              api: openai-completions
              contextWindow: 32768
              maxTokens: 2048
              reasoning: false
              input:
              - text
  - name: openclaw
    image:
      ref: nc-fabric@sha256:a4402fa5dc8b020551f1e3bde409c8079767e53fcba7bd98b32197f82a9355a8
    runtime:
      provider: docker
    network:
      tier: isolated
    harness:
      kind: openclaw
      execution:
        timeoutSeconds: 300
    agent:
      name: assistant
      inference:
        routes:
        - name: primary
          providerRef: shared
          overrides:
            model: nvidia/Qwen3.6-35B-A3B-NVFP4
            contextWindow: 32768
            maxTokens: 2048
  - name: deepagents
    image:
      ref: nc-fabric@sha256:f4a2f7068525f55f1dc25e77dfcc07998a32bd19f44ad75a61e304e255440f56
    runtime:
      provider: docker
    network:
      tier: isolated
    harness:
      kind: deepagents
      execution:
        timeoutSeconds: 300
    agent:
      name: assistant
      inference:
        routes:
        - name: primary
          providerRef: shared
          overrides:
            model: nvidia/Qwen3.6-35B-A3B-NVFP4
            maxTokens: 1024
