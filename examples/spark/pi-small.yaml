# yaml-language-server: $schema=../../schemas/nemoclaw-v1alpha1.schema.json
# Build current images and replace these local digests and the deployment UID.
# Model sources, host requirements, and validation limits: README.md.
apiVersion: nemoclaw.nvidia.com/v1alpha1
kind: NemoClawConfig
metadata:
  name: spark-pi-small
  uid: 29d0cfac-c72d-4445-bebd-d8944308f7ad
spec:
  gateway:
    management: managed
    endpoint: http://127.0.0.1:17801
    networkCIDR: 172.30.161.0/24
  services:
    local:
      kind: vllm
      hardware:
        profile: dgx-spark
      runtime:
        provider: docker
        engine: unix:///var/run/docker.sock
        image: nc-prototype-vllm@sha256:a08d7d6542a20cff9a7f5303e100f71a121d241d0e33fc3be5da6ad6d3bc0c31
      authentication: bearer
      model:
        repository: Qwen/Qwen3-4B
        revision: 1cfa9a7208912126459214e8b04321603b3df60c
      serving:
        toolParser: hermes
        reasoningParser: qwen3
        port: 19001
        contextTokens: 32768
        maxSequences: 1
        batchTokens: 1024
        startupTimeoutSeconds: 1800
      memory:
        gpuMemoryGiB: 20
        hostReserveGiB: 32
        kvCacheGiB: 6
        minAvailableGiB: 8
        minFreeGiB: 3
        freeGateGiB: 12
        consecutiveSamples: 5
  inferenceProviders:
  - name: local
    provider: openai
    serviceRef: local
  sandboxes:
  - name: assistant
    image:
      ref: nc-fabric@sha256:ac526ed31206c90557c7ac313400586e5347bee2c142efa4708256b122a81284
    runtime:
      provider: docker
    network:
      tier: isolated
    harness:
      kind: pi
      execution:
        timeoutSeconds: 300
    agent:
      name: assistant
      inference:
        routes:
        - name: primary
          providerRef: local
          overrides:
            model: Qwen/Qwen3-4B
            piModel:
              api: openai-completions
              contextWindow: 32768
              maxTokens: 2048
              reasoning: false
              input:
              - text
