{{- if and .Values.ingress.gateway.enabled .Values.ingress.auth.enabled (not .Values.ingress.auth.existingSecret) }}
{{- $ns := include "nemoclaw-gpu.namespace" . }}
{{- $secretName := include "nemoclaw-gpu.ingressAuthSecretName" . }}
{{- $existing := lookup "v1" "Secret" $ns $secretName }}
{{- $password := .Values.ingress.auth.password }}
{{- $htpasswd := .Values.ingress.auth.htpasswd }}
{{- if and (not $password) $existing }}
{{- $password = index $existing.data "password" | b64dec }}
{{- end }}
{{- if and (not $htpasswd) $existing }}
{{- if hasKey $existing.data ".htpasswd" }}
{{- $htpasswd = index $existing.data ".htpasswd" | b64dec }}
{{- end }}
{{- end }}
{{- if not $password }}
{{- $password = randAlphaNum 20 }}
{{- end }}
{{- if not $htpasswd }}
{{- fail "ingress.auth.htpasswd is required for Envoy Gateway basic auth (Apache {SHA} htpasswd). The install scripts generate it automatically from ingress.auth.password; for a manual helm install pass --set-string ingress.auth.htpasswd='user:{SHA}...'. See README \"Ingress security\"." }}
{{- end }}
{{- if not (contains "{SHA}" $htpasswd) }}
{{- fail "ingress.auth.htpasswd must use Apache {SHA} format because Envoy Gateway basic auth rejects bcrypt/apr1 hashes." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "nemoclaw-gpu.labels" . | nindent 4 }}
  annotations:
    # Keep the Secret (and the password it holds) across `helm uninstall` so a reinstall
    # of the same release doesn't invalidate credentials an operator already saved.
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ $password | b64enc | quote }}
stringData:
  # Envoy Gateway SecurityPolicy basicAuth expects Opaque key ".htpasswd" in Apache {SHA} form.
  .htpasswd: |
    {{ $htpasswd | trim }}
{{- end }}
