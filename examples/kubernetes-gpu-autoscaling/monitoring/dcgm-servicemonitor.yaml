# Scrape NVIDIA DCGM exporter (already installed by microk8s enable gpu / GPU operator).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nvidia-dcgm-exporter
  namespace: __DCGM_NAMESPACE__
  labels:
    release: __PROM_RELEASE__
spec:
  namespaceSelector:
    matchNames:
      - __DCGM_NAMESPACE__
  selector:
    matchLabels:
      app: nvidia-dcgm-exporter
  endpoints:
    - port: gpu-metrics
      interval: 15s
