#
# prometheus-adapter: expose HPA custom metrics.
# Built-in recipe signals (live-validated): DCGM GPU utilization and metrics-proxy
# rolling average LLM latency. Select one via autoscaling.metric / HPA_METRIC.
# Additional custom series can be added here for operator-defined HPA metrics.

prometheus:
  url: http://REPLACE_PROMETHEUS_SERVICE.monitoring.svc
  port: 9090

rules:
  default: false
  custom:
    # DCGM exporter attributes GPU util to workloads via exported_* labels (not pod/namespace).
    - seriesQuery: 'DCGM_FI_DEV_GPU_UTIL{exported_namespace!="",exported_pod!=""}'
      resources:
        overrides:
          exported_namespace:
            resource: namespace
          exported_pod:
            resource: pod
      name:
        matches: "^(.*)$"
        as: "gpu_utilization_percent"
      # Peak in 90s during climb: a DCGM 0 scrape must not publish HPA 0%
      # while nvidia-smi still shows busy GPUs. 30s stalled 1→8 at 6–7.
      # client.sh shortens this to 15s after the 60s sit-at-8 hold so 8→1
      # can start. Pause scale-down during the climb so a new 0% GPU cannot bounce.
      metricsQuery: 'avg(max_over_time(<<.Series>>{<<.LabelMatchers>>}[90s])) by (<<.GroupBy>>)'

    # metrics-proxy /metrics rolling avg latency (idle-expires when traffic stops).
    - seriesQuery: 'nemoclaw_llm_latency_avg_milliseconds{namespace!="",pod!=""}'
      resources:
        overrides:
          namespace:
            resource: namespace
          pod:
            resource: pod
      name:
        matches: "^(.*)$"
        as: "nemoclaw_llm_latency_avg_milliseconds"
      metricsQuery: 'avg(<<.Series>>{<<.LabelMatchers>>}) by (<<.GroupBy>>)'
