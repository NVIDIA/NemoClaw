# yaml-language-server: $schema=../schemas/nemoclaw-v1alpha1.schema.json
# Replace the deployment UID, image pins, endpoint, and model for your host.
apiVersion: nemoclaw.nvidia.com/v1alpha1
kind: NemoClawConfig
metadata:
  name: multiple-sandboxes
  uid: d21c8698-2b96-49fd-bb17-570c523960d0
spec:
  gateway:
    management: external
    endpoint: http://127.0.0.1:17681
  inferenceProviders:
    - name: local
      provider: openai
      endpoint: http://172.20.0.1:11446/v1
  sandboxes:
    - name: alice
      runtime:
        provider: docker
      network:
        tier: isolated
      harness:
        kind: nvidia.fabric.openclaw
      agent:
        name: alice
        inferenceRef: chat
    - name: bob
      runtime:
        provider: docker
      network:
        tier: isolated
      harness:
        kind: nvidia.fabric.openclaw
      agent:
        name: bob
        inferenceRef: chat
    - name: research
      image:
        ref: nc-prototype-fabric@sha256:a6a0e5cf53501e765ae43457212989ff4716c6224352dc109ebd49c3780450cd
      runtime:
        provider: docker
      network:
        tier: isolated
      harness:
        kind: nvidia.fabric.langchain.deepagents
      agent:
        name: researcher
        inferenceRef: chat
    - name: review
      image:
        ref: nc-prototype-fabric@sha256:a6a0e5cf53501e765ae43457212989ff4716c6224352dc109ebd49c3780450cd
      runtime:
        provider: docker
      network:
        tier: isolated
      harness:
        kind: nvidia.fabric.langchain.deepagents
      agent:
        name: reviewer
        inferenceRef: chat
    - name: coding
      image:
        ref: nc-multi-models@sha256:2ee5e33522a37d3d77bb6381a92e963cb1d5884f2dd28b353b4b7fa0d95f212e
      runtime:
        provider: docker
      network:
        tier: isolated
      harness:
        kind: nvidia.fabric.pi
      agent:
        name: coder
        inference:
          routes:
            - name: primary
              providerRef: local
              overrides:
                model: qwen3:4b
                settings:
                  model_metadata:
                    api: openai-completions
                    contextWindow: 8192
                    maxTokens: 2048
                    reasoning: false
                    input: [text]
  inferences:
    chat:
      routes:
        - name: primary
          providerRef: local
          overrides:
            model: qwen3:4b
