apiVersion: nemoclaw.nvidia.com/v1alpha1
kind: NemoClawConfig
metadata:
  name: remote-qwen3-model
  uid: b9acbf25-75a7-424a-a5b8-6296b094cb83
spec:
  gateway:
    management: external
    endpoint: http://127.0.0.1:17697
  inferenceProviders:
    - name: qwen
      provider: openai
      service:
        placement:
          engine: ssh://gpu-box
          networkCidr: 172.30.119.0/24
        publication:
          endpoint: http://10.0.0.8:18898/v1
          bindAddress: 10.0.0.8
        backend: vllm
        image: nc-prototype-vllm@sha256:0913eec1d921a129e4c02e64bfe199a5a0e23269ba429c4022809b8d038bb46e
        model:
          repository: Qwen/Qwen3-4B
          revision: 1cfa9a7208912126459214e8b04321603b3df60c
        serving:
          toolParser: hermes
          reasoningParser: qwen3
          port: 18898
          contextTokens: 32768
          maxSequences: 1
          batchTokens: 1024
          speculativeTokens: 0
          startupTimeoutSeconds: 1800
        memory:
          gpuMemoryGiB: 20
          hostReserveGiB: 32
          kvCacheGiB: 6
          minAvailableGiB: 8
          minFreeGiB: 3
          freeGateGiB: 12
          consecutiveSamples: 5
  sandboxes:
    - name: assistant
      image:
        ref: nc-prototype-fabric@sha256:a608340846053d881c3c6b3bdd7541d4f2f53236deaaef8e0b8f44afd8d4e8dd
      runtime:
        provider: podman
      network:
        tier: isolated
      agents:
        - name: assistant
          harness: openclaw
          inference:
            routes:
              - name: primary
                providerRef: qwen
                overrides:
                  model: Qwen/Qwen3-4B
