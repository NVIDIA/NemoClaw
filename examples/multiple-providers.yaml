# yaml-language-server: $schema=../schemas/nemoclaw-v1alpha1.schema.json
# Replace the UID, endpoint, model IDs, and agent image for your services.
# Requires a local model endpoint and a hosted HTTPS endpoint; this example starts neither.
# Set HOSTED_API_KEY on the applying host. Requests to a hosted model may incur charges.
apiVersion: nemoclaw.nvidia.com/v1alpha1
kind: NemoClawConfig
metadata:
  name: multiple-providers
  uid: cb18eaf0-1a4e-47b8-b254-6fe4e49bc360
spec:
  gateway:
    management: external
    endpoint: http://127.0.0.1:17671
  inferenceProviders:
    - name: local
      provider: openai
      endpoint: http://172.20.0.1:11434/v1
    - name: hosted
      provider: anthropic
      api: anthropic-messages
      endpoint: https://hosted.example/v1
      credential:
        env: HOSTED_API_KEY
  harnesses:
    assistant:
      kind: openclaw
  inferences:
    smart-and-fast:
      default: smart
      routes:
        - name: smart
          providerRef: hosted
          overrides:
            model: replace-with-supported-model
            contextWindow: 32768
        - name: fast
          providerRef: local
          overrides:
            model: qwen3:4b
            contextWindow: 8192
  sandboxes:
    - name: researcher
      harnessRef: assistant
      agent:
        name: researcher
        inferenceRef: smart-and-fast
    - name: writer
      harnessRef: assistant
      agent:
        name: writer
        inference:
          routes:
            - name: fast
              providerRef: local
              overrides:
                model: qwen3:4b
                contextWindow: 8192
