apiVersion: nemoclaw.nvidia.com/v1alpha1
kind: NemoClawConfig
metadata:
  name: fabric-openclaw
  uid: c892587f-6439-44b5-9a70-a43e8936461f
spec:
  gateway:
    management: external
    endpoint: http://127.0.0.1:17681
  inferenceProviders:
    - name: local
      provider: openai
      endpoint: http://172.20.0.1:11446/v1
  sandboxes:
    - name: assistant
      runtime:
        provider: docker
      network:
        tier: isolated
      harness:
        kind: openclaw
      agents:
        - name: main
          inference:
            routes:
              - name: primary
                providerRef: local
                overrides:
                  model: qwen3:4b
