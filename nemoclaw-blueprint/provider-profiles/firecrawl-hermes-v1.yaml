id: firecrawl-hermes-v1
display_name: Firecrawl Search for Hermes
description: Firecrawl Search API access for the Hermes managed Python runtime
category: agent
credentials:
  - name: api_key
    description: Firecrawl Search API key
    env_vars:
      - FIRECRAWL_API_KEY
    required: true
    # Hermes' native firecrawl backend (firecrawl-py) sends the resolver
    # placeholder as the Authorization bearer token, so the L7 proxy rewrites
    # the header credential. No JSON-body rewrite is needed.
    auth_style: bearer
    header_name: authorization
    query_param: ''
endpoints:
  - host: api.firecrawl.dev
    port: 443
    protocol: rest
    enforcement: enforce
    rules:
      - allow: { method: POST, path: "/v2/search" }
      - allow: { method: POST, path: "/v2/scrape" }
binaries:
  - /opt/hermes/.venv/bin/python
  - /usr/local/bin/curl
  - /usr/bin/curl
inference_capable: false
