# Template profile for the experimental blueprint identity wrapper. Copy this
# file and replace the example custom authorization-server URL before use.
id: okta-runtime-v1
display_name: Okta Runtime Credentials v1
description: Gateway-managed Okta access-token refresh for an attached sandbox
category: agent
credentials:
  - name: access_token
    description: Short-lived Okta API access token
    env_vars:
      - OKTA_ACCESS_TOKEN
    required: true
    auth_style: bearer
    header_name: authorization
    refresh:
      strategy: oauth2_refresh_token
      token_url: https://example.okta.com/oauth2/default/v1/token
      refresh_before_seconds: 300
      max_lifetime_seconds: 3600
      material:
        - name: client_id
          required: true
        - name: refresh_token
          required: true
          secret: true
        - name: client_secret
          required: false
          secret: true
endpoints:
  - host: api.example.okta.com
    port: 443
    protocol: rest
    enforcement: enforce
    rules:
      - allow: { method: GET, path: "/**" }
binaries:
  - /usr/local/bin/node
  - /usr/bin/node
  - /usr/local/bin/curl
  - /usr/bin/curl
inference_capable: false
