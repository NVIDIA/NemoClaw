id: firecrawl
display_name: Firecrawl Search
description: Firecrawl Search API access
category: agent
credentials:
  - name: api_key
    description: Firecrawl Search API key
    env_vars:
      - FIRECRAWL_API_KEY
    required: true
    # Firecrawl authenticates with a bearer token in the Authorization header,
    # so the L7 proxy rewrites the resolver placeholder in that header rather
    # than in the JSON body.
    auth_style: bearer
    header_name: authorization
    query_param: ''
endpoints:
  - host: api.firecrawl.dev
    port: 443
    protocol: rest
    enforcement: enforce
    rules:
      - allow: { method: POST, path: "/v2/search" }
      - allow: { method: POST, path: "/v2/scrape" }
binaries:
  - /opt/venv/bin/python3*
  - /usr/local/bin/node
  - /usr/bin/node
  - /usr/local/bin/curl
  - /usr/bin/curl
inference_capable: false
