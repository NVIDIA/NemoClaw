preset:
  name: qdrant
  description: "Qdrant vector database access for runbook similarity search"

network_policies:
  qdrant:
    name: qdrant
    endpoints:
      # REST API — collections, points, search
      - host: "*.darknoc.svc.cluster.local"
        port: 6333
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
          - allow: { method: PUT, path: "/**" }
          - allow: { method: DELETE, path: "/collections/*/points/**" }
      # gRPC — bulk operations
      - host: "*.darknoc.svc.cluster.local"
        port: 6334
        access: full
    binaries:
      - { path: /usr/local/bin/node }
