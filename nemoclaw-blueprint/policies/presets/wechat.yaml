# WeChat (personal) channel egress, via @tencent-weixin/openclaw-weixin.
#
# The upstream plugin uses per-account dynamic baseUrls behind WeChat's iLink
# gateway and rotates them through IDC redirects, so we cannot safely pin a
# single subdomain. The wildcard intentionally widens egress vs. the
# Telegram/Discord/Slack presets — operators who need a tighter boundary
# should pin a narrower subdomain set after observing their own accounts'
# baseUrls and accept the breakage risk on rotation.
preset:
  name: wechat
  description: "WeChat (personal) iLink API access via @tencent-weixin/openclaw-weixin"

network_policies:
  wechat_bridge:
    name: wechat_bridge
    endpoints:
      - host: "*.weixin.qq.com"
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
    binaries:
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/node }
