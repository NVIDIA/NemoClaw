preset:
  name: grafana
  description: "Grafana API access for dashboard and datasource queries"

network_policies:
  grafana:
    name: grafana
    endpoints:
      - host: "*.monitoring.svc.cluster.local"
        port: 3000
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/api/**" }
          - allow: { method: POST, path: "/api/ds/query" }
    binaries:
      - { path: /usr/local/bin/node }
