preset:
  name: telegram
  description: "Telegram Bot API access"

network_policies:
  telegram_bot:
    name: telegram_bot
    endpoints:
      - host: api.telegram.org
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/bot*/**" }
          - allow: { method: POST, path: "/bot*/**" }
          - allow: { method: GET, path: "/file/bot*/**" }
    binaries:
      # Sandbox base images install Node.js to one of two paths depending on
      # distro: /usr/local/bin/node (manual install / nvm) or /usr/bin/node
      # (Debian/Ubuntu apt). OPA does exact-path matching on the binary
      # allowlist, so both must be present or the bot is silently 403'd by
      # the L7 proxy. See issue #481.
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/node }
