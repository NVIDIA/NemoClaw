preset:
  name: outlook
  description: "Microsoft Outlook and Graph API access"

network_policies:
  outlook_graph:
    name: outlook_graph
    endpoints:
      - host: graph.microsoft.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
      - host: login.microsoftonline.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
      - host: outlook.office365.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
      - host: outlook.office.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
    binaries:
      # Sandbox base images install Node.js to one of two paths depending on
      # distro: /usr/local/bin/node (manual install / nvm) or /usr/bin/node
      # (Debian/Ubuntu apt). OPA does exact-path matching on the binary
      # allowlist, so both must be present or the bot is silently 403'd by
      # the L7 proxy. See issue #481.
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/node }
