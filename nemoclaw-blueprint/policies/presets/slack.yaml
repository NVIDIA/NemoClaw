preset:
  name: slack
  description: "Slack API, Socket Mode, and webhooks access"

network_policies:
  slack:
    name: slack
    endpoints:
      - host: slack.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
      - host: api.slack.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
      - host: hooks.slack.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
      # Socket Mode WebSocket — requires CONNECT tunnel to avoid
      # HTTP idle timeout killing the persistent connection. See #409.
      - host: wss-primary.slack.com
        port: 443
        access: full
      - host: wss-backup.slack.com
        port: 443
        access: full
    binaries:
      # Sandbox base images install Node.js to one of two paths depending on
      # distro: /usr/local/bin/node (manual install / nvm) or /usr/bin/node
      # (Debian/Ubuntu apt). OPA does exact-path matching on the binary
      # allowlist, so both must be present or the bot is silently 403'd by
      # the L7 proxy. See issue #481.
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/node }
