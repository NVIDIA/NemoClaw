preset:
  name: claude-code
  description: "Claude Code API, browser login, telemetry, and crash-report access"

network_policies:
  claude_code:
    name: claude_code
    endpoints:
      - host: api.anthropic.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
      - host: platform.claude.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/v1/oauth/**" }
          - allow: { method: POST, path: "/v1/oauth/**" }
      - host: statsig.anthropic.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
      - host: sentry.io
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
    binaries:
      - { path: /usr/local/bin/claude }
      - { path: /usr/bin/claude }
      - { path: /sandbox/.local/bin/claude }
      - { path: /tmp/npm-global/bin/claude }
      - { path: /home/linuxbrew/.linuxbrew/bin/claude }
      # OpenShell checks the resolved executable. Retain the old temporary
      # prefix for existing installations; new user installs use ~/.local.
      - { path: /sandbox/.local/lib/node_modules/@anthropic-ai/claude-code/bin/claude.exe }
      - { path: /tmp/npm-global/lib/node_modules/@anthropic-ai/claude-code/bin/claude.exe }
      # Claude Code is distributed as an npm CLI, so OpenShell may observe
      # the Node runtime instead of the shim that launched it.
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/node }
