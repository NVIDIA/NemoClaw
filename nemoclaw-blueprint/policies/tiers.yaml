#
# Tier definitions for the NemoClaw policy selector.
#
# Each tier maps to a named posture. The base sandbox policy
# (openclaw-sandbox.yaml) is always applied regardless of tier.
# Tiers add presets on top of that baseline.
#
# access values:
#   read       — GET only (or equivalent read-only rules for that service)
#   read-write — GET + POST/PUT/PATCH (explicitly opt-in; never the default)

tiers:
  - name: restricted
    label: Restricted
    description: Base sandbox only. No third-party network access beyond inference and core agent tooling.
    presets: []

  - name: balanced
    label: Balanced
    description: Full dev tooling and web search. Package installs, model downloads, and inference. No messaging platform access.
    presets:
      - { name: npm,          access: read-write }
      - { name: pypi,         access: read-write }
      - { name: huggingface,  access: read-write }
      - { name: brew,         access: read-write }
      - { name: brave,        access: read-write }

  - name: open
    label: Open
    description: Broad access across third-party services including messaging and productivity. User accepts responsibility for the expanded scope.
    presets:
      - { name: npm,          access: read-write }
      - { name: pypi,         access: read-write }
      - { name: huggingface,  access: read-write }
      - { name: brew,         access: read-write }
      - { name: brave,        access: read-write }
      - { name: slack,        access: read-write }
      - { name: discord,      access: read-write }
      - { name: telegram,     access: read-write }
      - { name: wechat,       access: read-write }
      - { name: whatsapp,     access: read-write }
      - { name: jira,         access: read-write }
      - { name: outlook,      access: read-write }

  # DANGER: disables egress filtering. Unlike the other tiers, allow-all does
  # NOT layer presets onto the deny-by-default base — it swaps the base policy
  # for openclaw-sandbox-allow-all.yaml (a catch-all host: "*"), so the agent can
  # reach ANY public host. SSRF / private-network blocking still applies. Has no
  # presets by design; the catch-all makes per-service presets moot. Opt in only
  # for trusted dev/testing. See docs/reference/network-policies.mdx.
  - name: allow-all
    label: Allow All (no egress filtering — dev/testing only)
    description: Catch-all egress to any public host. Swaps the base policy for the allow-all catch-all; presets do not apply. Maximum scope — you accept full responsibility.
    presets: []
