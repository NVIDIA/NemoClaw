version: "0.1.0"
# OpenShell 0.0.24 is the lowest version NV QA validates against
# (see #1607, #1609, #1612 — all reproduced on 0.0.24). The previous
# floor of 0.1.0 had been hardcoded since the initial blueprint
# scaffold and did not match any released or supported version, so
# the preflight gate added in #1317 was rejecting environments QA
# had explicitly signed off on. Bump the floor in lockstep with the
# next OpenShell release if a feature in the blueprint actually
# requires a newer minimum.
min_openshell_version: "0.0.24"
min_openclaw_version: "2026.3.0"
digest: ""  # Computed at release time

profiles:
  - default
  - ncp
  - nim-local
  - vllm

description: |
  NemoClaw blueprint: orchestrates OpenClaw sandbox creation, migration,
  and NIM/vLLM inference routing inside OpenShell.

components:
  sandbox:
    image: "ghcr.io/nvidia/openshell-community/sandboxes/openclaw:latest"
    name: "openclaw"
    forward_ports:
      - 18789

  inference:
    profiles:
      default:
        provider_type: "nvidia"
        provider_name: "nvidia-inference"
        endpoint: "https://integrate.api.nvidia.com/v1"
        model: "nvidia/nemotron-3-super-120b-a12b"

      ncp:
        provider_type: "nvidia"
        provider_name: "nvidia-ncp"
        endpoint: ""
        model: "nvidia/nemotron-3-super-120b-a12b"
        credential_env: "NVIDIA_API_KEY"
        dynamic_endpoint: true

      nim-local:
        provider_type: "openai"
        provider_name: "nim-local"
        endpoint: "http://nim-service.local:8000/v1"
        model: "nvidia/nemotron-3-super-120b-a12b"
        credential_env: "NIM_API_KEY"
        timeout_secs: 180

      vllm:
        provider_type: "openai"
        provider_name: "vllm-local"
        endpoint: "http://localhost:8000/v1"
        model: "nvidia/nemotron-3-nano-30b-a3b"
        credential_env: "OPENAI_API_KEY"
        credential_default: "dummy"
        timeout_secs: 180

  policy:
    base: "sandboxes/openclaw/policy.yaml"
    additions:
      nim_service:
        name: nim_service
        endpoints:
          - host: "nim-service.local"
            port: 8000
            protocol: rest
